- id: case_cn_zibuyu_v08_s038
  paragraphs:
  - 清代《子不语》里，杭州人赵清尧喜爱下棋，在一处庵里遇到一个棋艺不佳却自称“炼师”的道人。赵没有与他深交，当晚却看见帐边鬼火，随后又听见床边传来的声音。
  - 故事说，声音来自受了冷落的道人；他想以恐吓索财，但赵始终没有按他的意愿求饶。结尾交代道人自伤身亡，留下有关报应与先知的种种说法。邓启耀在书中引用这一故事；它属于古代志怪叙事。
  location:
    lat: 30.2741
    lng: 120.1551
