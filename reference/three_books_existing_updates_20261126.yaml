- id: case_cn_zibuyu_v10_s008
  paragraphs:
  - 《子不语》“张大帝”记下一则墓地故事：一位道士想改变别人家坟地的风水，在羊角里藏入东西，悄悄埋在坟旁。两家此后的变化被故事解释成这一行为的结果。
  - 清明迎神队伍经过墓旁时，神像突然停下。众人按叙事中神灵的指示搜寻，找到羊角并将道士送官；邓启耀以此讨论风水争夺的地方传说。神像、风水效力与审判细节均属于志怪叙事。
  location:
    lat: 26.0745
    lng: 119.2965
    precision: culture_region
    location_name: 福建省（福州省域参考点）
    culture_region: 东亚 · 中国 · 福建
