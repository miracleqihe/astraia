- id: case_cn_shanghai_zhenping_school_explorers_2012
  title: 上海镇坪路｜废校与凌晨三点
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_shanghai_city_lore_liu_2015
  location:
    lat: 31.24655
    lng: 121.42279
    precision: city
    location_name: 中国上海 · 普陀公园附近参考
    culture_region: 中国 · 华东
  map_label: 镇坪路
  location_note: 报道指镇坪路与宜昌路一带的旧学校；点位使用附近公园地标，不代表校址。
  temporal:
    year_start: 2012
    year_end: 2012
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 2012 年，一所上海废弃学校因网络传言吸引学生相约前来。故事说，凌晨三点左右学校里会出现怪事，还有人声称拍到了照片。
  - 记者到现场时，看见许多学生在傍晚聚集；有人翻墙入内，门卫随后驱赶。组织过小规模探访的人则说，自己此前没有听过学生们正在转述的版本。
  - 《新闻晚报》的采访同时记录了网上的讲法、现场的行动和门卫的回应，呈现一则传闻怎样引发真实的城市探访。
  sources:
  - citation: 程怡、周柏伊：〈听传说找刺激 废弃地成探险园〉，《新闻晚报》，2012 年 11 月 7 日，新浪转载。
    type: newspaper_report
    url: https://news.sina.com.cn/o/2012-11-07/140025529737.shtml
