- id: case_cn_hk_cuhk_window_soup_2007
  title: 香港中大｜从楼上吊下的汤
  genre: urban_legend
  credibility_tier: B
  theme: corpus_cn_hk_bosco_campus_story_versions_2007
  location:
    lat: 22.4198
    lng: 114.2068
    precision: city
    location_name: 香港 · 沙田中大校园参考
    culture_region: 东亚 · 中国香港
  map_label: 中大
  location_note: 地图采用中文大学校园参考点；不同版本所指的具体宿舍或地点并不一致。
  temporal:
    year_start: 2007
    year_end: 2007
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一对学生住在同一幢宿舍，女孩的房间恰好在男孩楼上。她常煮汤，用绳子从窗外吊给他。
  - 考试将近，两人约好暂时不见面，窗外送来的汤却仍然没有断。后来男孩听说女孩已经去世，而每天傍晚，汤还是会被吊下来。
  - Joseph Bosco 在 2007 年论文中记录了伯利衡宿舍的牛尾汤版本，也指出其他书院有不同汤品和结尾的讲法。
  sources:
  - *id001
- id: case_cn_hk_cuhk_swing_little_finger_2007
  title: 香港中大｜秋千上的女孩
  genre: urban_legend
  credibility_tier: B
  theme: corpus_cn_hk_bosco_campus_story_versions_2007
  location:
    lat: 22.4198
    lng: 114.2068
    precision: city
    location_name: 香港 · 沙田中大校园参考
    culture_region: 东亚 · 中国香港
  map_label: 中大
  location_note: 地图采用中文大学校园参考点；不同版本所指的具体宿舍或地点并不一致。
  temporal:
    year_start: 2007
    year_end: 2007
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一个学生总在图书馆关门后走回宿舍，路过小公园时，经常看见女孩坐在秋千上。后来他走过去与她交谈，从此每晚都会聊一会儿。
  - 朋友听过他的描述，说她很像一名曾在交通事故中去世的教师女儿；那女孩缺了一根小指。他再次去看，发现秋千上的女孩也少了那根手指。
  - 他吓了一跳。故事说，此后他再经过公园，就没有再见到她。这个版本见于 Bosco 的校园鬼故事研究。
  sources:
  - *id001
- id: case_cn_hk_cuhk_lotus_pond_time_2007
  title: 香港中大｜荷花池的十点钟
  genre: urban_legend
  credibility_tier: B
  theme: corpus_cn_hk_bosco_campus_story_versions_2007
  location:
    lat: 22.4198
    lng: 114.2068
    precision: city
    location_name: 香港 · 沙田中大校园参考
    culture_region: 东亚 · 中国香港
  map_label: 中大
  location_note: 地图采用中文大学校园参考点；此为中大版本，不能定位故事中的人物。
  temporal:
    year_start: 2007
    year_end: 2007
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一对恋人约好晚上十点在荷花池相见。女孩等了很久，男孩仍没有出现；故事说，她伤心之下走进了池中。
  - 后来，有人夜里经过池边，会被一名陌生女孩问起时间。流传的警告说，如果回答现在是十点，她就会把回答的人拉进水里。
  - Bosco 记录了这个中大版本；1994 年学生刊物中的讲法则把约定写成午夜。港大也流传情节相近的故事。
  sources:
