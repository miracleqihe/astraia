- id: case_cn_shanghai_minhang_school_white_figure_2015
  title: 上海闵行｜校园停电时的白影
  genre: urban_legend
  credibility_tier: B
  theme: corpus_cn_shanghai_city_lore_liu_2015
  location:
    lat: 31.10881
    lng: 121.37471
    precision: city
    location_name: 中国上海 · 闵行区域参考
    culture_region: 中国 · 华东
  map_label: 闵行
  location_note: 点位为闵行地名参考；论文中的学校与学生无法据此定位或核实。
  temporal:
