- id: case_id_jakarta_rental_dancing_calendar_2016
  title: 雅加达｜挂历里跳舞的人
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: -6.2088
    lng: 106.8456
    precision: city
    location_name: 印度尼西亚雅加达 · 城市参考点
    culture_region: 东南亚 · 印度尼西亚
  map_label: 雅加达
  location_note: 档案只给出雅加达，没有租住房屋的地址。
  temporal:
    year_start: 2016
    year_end: 2016
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 祖父曾在雅加达工作，与朋友住进一处租屋。白天男人出门后，一位住客说自己时常听见声音，还看见厨房里有人；她的丈夫起初不相信。
  - 有一天，丈夫睡醒后望向墙上的挂历，觉得画中的两个女孩正在跳舞。从那以后，他也开始相信妻子说的话。
  - 2016 年，采集者的姑母转述了祖父多年前讲过的故事。关于屋下墓地和搬家后仍有动静的说法，也来自这条家族讲述。
  sources:
  - citation: “Haunted House in Jakarta”, USC Digital Folklore Archives, interview 24 April 2016, posted 28 April 2016。
    type: oral_history
    url: https://folklore.usc.edu/haunted-house-in-jakarta/
    locator: 采集者的姑母转述祖父讲过的雅加达租屋故事
- id: case_sg_shared_house_locked_room_2021
  title: 新加坡｜合租屋里锁着的门
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 1.3521
    lng: 103.8198
    precision: city
    location_name: 新加坡 · 城市范围参考
    culture_region: 东南亚 · 新加坡
  map_label: 新加坡
  location_note: 受访者只说父母当时住在新加坡，未公开合租屋地址。
  temporal:
    year_start: 2021
    year_end: 2021
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一对夫妻在新加坡与别人合租。室友去了菲律宾，房门锁着；一天午后，两人洗完碗，觉得看见一道白影沿走廊穿进那间锁住的房间。
  - 另一晚，母亲做饭时听见大门声，看见一个影子走向室友卧室，以为室友回来了。几分钟后，真正的室友才进门，说自己刚到。
  - 2021 年，一位菲律宾裔受访者在邮件里转述父母的回忆，并表达了自己的猜测；她并未说自己亲眼见到那两幕。
  sources:
  - citation: Isabelle Perez, “The House Ghost in Singapore”, USC Digital Folklore Archives, April 2021, posted 18 May 2021。
    type: oral_history
    url: https://folklore.usc.edu/the-house-ghost-in-singapore/
    locator: 受访者通过邮件转述父母在新加坡合租房的经历
