themes:
- id: corpus_cn_hk_bosco_campus_story_versions_2007
  title: 香港校园鬼故｜讲述、变体与研究
  genre: academic_model
  peers:
  - case_cn_hk_cuhk_braid
  - case_cn_hk_polyu_pool_child
  - case_cn_hk_hku_lotus_pool
  - corpus_east_asia_school_oral_accounts_2011_2026
  paragraphs:
  - 在香港中文大学，学长学姐有时会在迎新活动中向新生讲校园鬼故：同一条路、一个水池或一间宿舍，就这样成为一届届学生记住的地点。
  - 人类学者 Joseph Bosco 的 2007 年论文说，这项研究收集了一百多则故事：有的由学生助理口头采集，有的来自学生课程作业。论文选出辫子姑娘、牛尾汤、荷花池等版本分析。
  - 同一个“吊汤”的故事会随着讲述者改变宿舍、汤的种类和结尾。作者提出，故事可能折射学生对学习、亲密关系和独立生活的感受；论文也记下部分学生对这种解释的不同意见。
  - 1994 年的中大学生刊物另留下学生讲述理大泳池和中大辫子姑娘的版本。港大和中大都流传过荷花池问时间的故事，可以并读，但相似本身不能确定它们从哪里传来。
  sources:
  - &id001
    citation: Joseph Bosco, “Young People’s Ghost Stories in Hong Kong”, The Journal of Popular Culture 40(5), 2007, 785–807, DOI 10.1111/j.1540-5931.2007.00454.x。
    type: peer_reviewed
    url: https://www.cuhk.edu.hk/ant/joseph/JPCU_454.pdf
    locator: 作者在香港中文大学网站提供的论文全文，第 785–790、801–803 页
  - &id002
    citation: Margaret Liu, “Dead Zone”, Varsity, The Chinese University of Hong Kong, April 1994。
    type: journalism
    url: https://varsity.com.cuhk.edu.hk/varsity/9404/ghost.htm
    locator: 学生访谈：中大和理大校园故事的不同讲述
