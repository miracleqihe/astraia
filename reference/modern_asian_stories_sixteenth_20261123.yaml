- id: case_vn_family_mosquito_three_drops_2019
  title: 越南家庭｜三滴血与蚊子
  genre: folktale
  credibility_tier: B
  theme: corpus_asian_personal_night_memories_2016_2025
  location:
    lat: 16.0
    lng: 107.5
    precision: culture_region
    location_name: 越南 · 家庭讲述文化范围参考
    culture_region: 东南亚 · 越南
  map_label: 越南
  location_note: 受访者生于西贡，故事未给出事发地点；点位表示越南叙事背景。
  temporal:
    year_start: 2019
    year_end: 2019
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一个男人救回病重的妻子，给了她三滴自己的血。后来妻子被富商带走，又留了下来；丈夫找到她，只求她归还那三滴血。
  - 妻子答应后倒下，变成蚊子。故事说，从此蚊子不断寻找血，想把欠下的东西取回来；这个结尾让日常叮咬有了令人不安的来历。
  - 这是一则越南家庭故事：采集者的母亲小时候听外祖母讲过，后来又讲给孩子听。2019 年的访谈保存了这个版本；它解释的是传说里的起源，不是对蚊子习性的生物学说明。
  sources:
  - citation: zukkhini, “Why Only Female Mosquitos Drink Blood”, USC Digital Folklore Archives, May 2019。
    type: oral_history
    url: https://folklore.usc.edu/why-only-female-mosquitos-drink-blood/
    locator: 采集者的母亲转述她小时候从外祖母听来的故事
- id: case_ph_gamu_white_chicken_house_2021
  title: 菲律宾加穆｜穿过客厅的白鸡
  genre: memorate
  credibility_tier: B
  theme: corpus_asian_personal_night_memories_2016_2025
  location:
    lat: 17.0472
    lng: 121.8333
    precision: city
    location_name: 菲律宾 · 伊莎贝拉省加穆镇范围参考
    culture_region: 东南亚 · 菲律宾
  map_label: 加穆
  location_note: 讲述者 2014 年在加穆地区听到故事；点位是镇级参考，不标私宅。
  temporal:
    year_start: 2021
    year_end: 2021
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一位母亲和女儿先后说，看见一只约三英尺高的白鸡，从门廊穿过客厅，走进厨房，再从后门消失。它不叫，也不回头，隔一段时间便会出现。
  - 父亲起初并不相信。一次他独自在家修空调，转身取工具时，也看见那只大白鸡走过；同样的事后来又发生了几次。他终于把自己的经历告诉家人。
  - 一位朋友 2014 年在菲律宾加穆听到这个家庭故事，2021 年又转述给采集者。讲述者提到家里曾有亲人去世，但并不知道白鸡的来历。
