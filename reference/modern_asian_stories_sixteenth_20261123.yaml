themes:
- id: corpus_cn_dreams_relatives_historical_2022
  title: 亲人入梦｜家庭讲述与中国史书中的梦
  genre: academic_model
  peers:
  - case_cn_relatives_cold_feet_straw_2020
  - case_cn_jiangsu_grandma_illness_farewell_2021
  - case_my_burmese_family_seventh_day_2024
  paragraphs:
  - 祖父梦见过世的母亲说脚冷，醒来后去坟地查看；另一个家庭则把孩子发热前后的变化理解为祖母最后一次探望。两次现代采录保留了家人各自讲述亲人离别的方式。
  - 认知科学研究者 Ze Hong 于 2022 年梳理《二十四史》《清史稿》《左传》《国语》中的 793 条记梦记录，比较不同类型的梦与人们对梦的解释。其中既有被当作征兆的梦，也有叙述者认为传递了具体消息的梦。
  - 研究讨论了讲述和记录中的选择：看似应验的事可能更容易被记住、留下并传开。史书保存的是进入文献的故事，并不能代表所有人做梦的概率，也不能单凭这些记载证明预知能力。
  - 现代家庭叙述与古代史书并置，可以观察亲情、记忆和解释如何出现在不同文本中；相似之处本身不能证明具体故事之间的传播关系。
  sources:
  - citation: 'Ze Hong, “Dream Interpretation from a Cognitive and Cultural Evolutionary Perspective: The Case of Oneiromancy in Traditional China”, Cognitive Science 46(1), e13088, 2022。'
    type: academic_study
    url: https://onlinelibrary.wiley.com/doi/10.1111/cogs.13088
    locator: 研究正文第三节：中国史书中的 793 条梦及其解释
  - citation: 美国国家医学图书馆 PubMed：Hong, 2022, PMID 35066902。
    type: academic_study
    url: https://pubmed.ncbi.nlm.nih.gov/35066902/
    locator: 论文书目信息、摘要和全文入口
  - citation: Ze Hong, 论文全文，Harvard Culture, Cognition, and Coevolution Lab。
    type: academic_study
    url: https://coevolution.fas.harvard.edu/sites/g/files/omnuum5841/files/culture_cognition_coevol_lab/files/cognitive_science_-_2022_-_hong_-_dream_interpretation_from_a_cognitive_and_cultural_evolutionary_perspective_the_case_of.pdf
    locator: 作者机构存档；研究方法与结果
  - &id002
    citation: siruizhu, “Relatives in Dreams”, USC Digital Folklore Archives, 19 November 2020。
    type: oral_history
    url: https://folklore.usc.edu/relatives-in-dreams/
    locator: 2020 年 10 月 29 日家庭讲述；祖父梦见母亲并查看坟地
  - &id001
    citation: anitatao, “Grandma’s Visitation”, USC Digital Folklore Archives, 31 October 2021。
    type: oral_history
    url: https://folklore.usc.edu/grandmas-visitation/
    locator: 2021 年 10 月 24 日电话访谈；童年记忆及母亲的转述
