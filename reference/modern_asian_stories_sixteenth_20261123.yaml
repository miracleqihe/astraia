- id: case_cn_tw_cemetery_gps_2023
  title: 台湾｜导航指向墓地的小路
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_roads_and_warnings_2020_2026
  location:
    lat: 23.6978
    lng: 120.9605
    precision: province
    location_name: 中国台湾 · 地区范围参考
    culture_region: 东亚 · 中国台湾
  map_label: 台湾
  location_note: 受访者在台湾驾车，未给出道路或墓地的位置；点位仅表示台湾地区范围。
  temporal:
    year_start: 2023
    year_end: 2023
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 露营结束后，一位女士开车去火车站。天已经黑了，导航突然提示她转进一条泥泞的小路，路旁是墓地；她记得继续直走才是去车站的方向。
  - 经过那一段时，路灯闪烁，颜色也显得奇怪。她没有按导航转弯，继续沿原路行驶，离开墓地后路灯又呈现平常的暖黄色。
  - 她在 2023 年的访谈中把经历讲给采集者，说自己当时有种仿佛被什么东西拉向墓地的感觉。访谈没有指出路名，也没有查明导航提示或路灯变化的原因。
  sources:
  - citation: Yen Ai Tai, “GPS and Cemetery are a bad combo”, USC Digital Folklore Archives, 13 May 2023。
    type: oral_history
    url: https://folklore.usc.edu/gps-and-cemetery-are-a-bad-combo/
    locator: 台湾受访者讲述夜间导航、墓地与闪烁灯光
- id: case_kr_apartment_elevator_stranger_2021
  title: 韩国｜九楼下电梯的人
  genre: urban_legend
  credibility_tier: C
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 36.5
    lng: 127.8
    precision: culture_region
    location_name: 韩国 · 故事传播范围参考
    culture_region: 东亚 · 韩国
  map_label: 韩国
  location_note: 讲述者在韩国从兄长处听到故事，文中没有城市或公寓名；点位仅代表传播背景。
  temporal:
    year_start: 2021
    year_end: 2021
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 深夜下班的女孩走进公寓电梯，一个年轻男人追上来，请她帮忙按住门。他说自己住九楼，女孩住十楼，两人在上升途中随口聊起工作。
  - 到了九楼，男人走出电梯。门快合上时，他转过身，露出诡异的笑，手里握着带血的刀，随即冲向通往十楼的楼梯。故事停在这里，没有交代女孩后来怎样。
  - 采集者说，兄长早年在网上读到这个故事，又讲给家人听。它利用熟悉的公寓和电梯制造惊吓；这份采录不是一则经过核实的案件报道。
  sources:
  - citation: Youngjin Hwang, “The Elevator Story”, USC Digital Folklore Archives, 17 May 2021。
    type: oral_history
    url: https://folklore.usc.edu/the-elevator-story/
    locator: 兄弟从网上读到后转述的韩国电梯恐怖故事
