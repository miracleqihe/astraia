- id: case_th_chiang_mai_ancestor_feast_2020
  title: 清迈附近｜八年一次的祖灵宴
  genre: memorate
  credibility_tier: B
  theme: corpus_asian_personal_night_memories_2016_2025
  location:
    lat: 18.7883
    lng: 98.9853
    precision: city
    location_name: 泰国 · 清迈周边范围参考
    culture_region: 东南亚 · 泰国
  map_label: 清迈周边
  location_note: 受访者称家乡在清迈附近车程约半小时，未说村名与方向；点位为清迈城市参考。
  temporal:
    year_start: 2020
    year_end: 2020
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 在清迈附近的一个村庄，讲述者说，家族有照顾村里祖灵的责任：祖母曾担任这个角色，后来由下一代女性亲属接续。
  - 她记得村里大约每八年为祖灵办一次聚会。人们摆上鸡肉、花和酒，亲友一起吃饭；在他们的理解里，祖先也回来与大家同席。
  - 2020 年，一位泰裔美国受访者向朋友讲述自己的家乡习俗。她还提到向土地和森林中的灵献礼；这是一个村庄与家庭的记忆，不代表所有泰国家庭的做法。
  sources:
