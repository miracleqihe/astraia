- id: case_cn_northeast_big_white_shadow_2021
  title: 中国东北｜走进院子的大白影
  genre: memorate
  credibility_tier: B
  theme: corpus_asian_personal_night_memories_2016_2025
  location:
    lat: 43.5
    lng: 125.0
    precision: culture_region
    location_name: 中国 · 东北村庄讲述范围参考
    culture_region: 中国 · 东北
  map_label: 中国东北
  location_note: 受访者曾住东北村庄、采录时住沈阳；故事未提供村名或院落位置，点位是东北范围参考。
  temporal:
    year_start: 2021
    year_end: 2021
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 老人说，她小时候从村里人那里听说，有一个很高很大的白影，夜里会沿着村子走。多年以后，家人在饭桌上聊起鬼故事，她又想起了这个身影。
  - 在一次饭桌访谈中，她告诉孙辈，自己也曾看见过：那个白影走进了姐姐家的院子。村里还有一种说法，认为它由许多个死去的人聚在一起形成。
  - 这是 2021 年记录的一位东北讲述者的回忆。另一则石磨边小白影的故事也来自东北口述材料，两个版本里的身影与动作不同，不能据此认定发生在同一村庄。
  sources:
  - citation: Free Guan, “The Big White Ghost”, USC Digital Folklore Archives, 4 May 2021。
    type: oral_history
    url: https://folklore.usc.edu/the-big-white-ghost/
    locator: 2021 年 4 月 18 日饭桌访谈；受访者童年居住东北村庄
  peers:
  - case_cn_shenyang_village_white_mill_2023
- id: case_cn_jiangsu_grandma_illness_farewell_2021
  title: 江苏讲述｜祖母最后的探望
  genre: memorate
  credibility_tier: B
  theme: corpus_cn_dreams_relatives_historical_2022
  location:
    lat: 32.9711
    lng: 119.455
    precision: province
    location_name: 中国江苏 · 受访者居住范围参考
    culture_region: 东亚 · 中国
  map_label: 江苏
  location_note: 档案只记受访者采录时居住江苏，童年经历未给出城市或地址；点位是居住省份参考。
  temporal:
    year_start: 2021
    year_end: 2021
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 祖母去世那年，女孩六岁。家人请僧人到家里做仪式；第二天晚上，女孩发起高烧，母亲守在床边，听见她含糊地说话。
  - 母亲后来告诉她，深夜她突然伸直双手，发出奇怪的声音。僧人和家人把这一晚理解为祖母在告别，女孩自己只记得其中一些片段。
  - 另一位年长亲人随后讲起梦见祖母微笑招手。2021 年电话访谈记录了这家人如何回忆离别；身体不适和梦的原因，访谈并没有独立确认。
  sources:
  - *id001
  - citation: USC Digital Folklore Archives, anitatao 文章索引。
    type: oral_history
    url: https://folklore.usc.edu/author/anitatao/
    locator: 同一篇访谈及发表日期
- id: case_cn_relatives_cold_feet_straw_2020
  title: 中国家庭｜梦里说脚冷的母亲
  genre: memorate
  credibility_tier: B
  theme: corpus_cn_dreams_relatives_historical_2022
  location:
    lat: 35.8617
    lng: 104.1954
    precision: culture_region
    location_name: 中国 · 家庭讲述范围参考
    culture_region: 东亚 · 中国
  map_label: 中国
  location_note: 档案只记受访者居住中国，未说出坟地所在地区；点位表示国家范围，不是具体地点。
  temporal:
    year_start: 2020
    year_end: 2020
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 小时候，讲述者和祖父母住在一起。一天早饭时，祖父说他梦见去世多年的母亲，母亲在梦里抱怨自己的脚冷。
  - 祖父想不明白，便去玉米地里的坟前看望。棺木原来盖着稻草，靠近脚的一端却被人移开了。他把稻草重新盖好，此后没有再梦见母亲抱怨。
  - 讲述者把这一经历当作亲人仍能在梦中沟通的故事。采集者也提到自己听过相似讲述，觉得这样的梦为思念逝者的人带来安慰。
  sources:
  - *id002
  - citation: USC Digital Folklore Archives, November 2020, page 5。
    type: oral_history
    url: https://folklore.usc.edu/2020/11/page/5/
    locator: 同一篇访谈、讲述语境及发表日期
- id: case_cn_city_village_funeral_photo_2021
  title: 城中村｜照片后面的男孩
  genre: urban_legend
  credibility_tier: C
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 35.8617
    lng: 104.1954
