- id: case_cn_dict5_yantai_pengzu_three_visits
  title: 山东烟台｜彭祖三次躲过阴差
  aliases:
  - 彭祖三气阎罗王
  genre: folktale
  credibility_tier: B
  location:
    lat: 37.47649
    lng: 121.44081
    precision: city
    location_name: 山东烟台
    culture_region: 东亚 · 中国
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
  paragraphs:
  - 烟台一带的故事让彭祖先后面对前来捉拿他的阴差：第一次他将来客赶走，第二次又识破茶水中的毒计，以假死脱身。
  - 许多年后，阎王化作游方郎中亲自前来，仍未得逞。辞典把这段长寿与斗智的想象列为地方鬼话，并非人物寿命记录。
  sources:
