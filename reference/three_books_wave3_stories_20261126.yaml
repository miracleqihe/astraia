    entry: LIT-2-0006
    cluster: sid_liminal
    trail: all
    label: 戏台与申冤
    rationale: 对读庙会、戏台和坟地如何推动情节。
- id: case_cn_dict5_dengta_teacher_petition
  title: 辽宁灯塔｜夜访书斋的抱孩女子
  aliases:
