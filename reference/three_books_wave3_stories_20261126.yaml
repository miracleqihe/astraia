- id: case_cn_dict5_wuning_yaksha_gratitude
  title: 江西武宁｜荒路掩埋与梦中的来信
  aliases:
  - 报恩夜叉
  genre: folktale
  credibility_tier: B
  location:
    lat: 29.2777525
    lng: 115.0476181
    precision: city
    location_name: 江西武宁
    culture_region: 东亚 · 中国
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
  paragraphs:
  - 武宁一则故事中，一位寡妇在打柴路上发现无人掩埋的遗体，便脱下衣物包裹并安葬。许多年后，她的孩子梦见有人承诺帮助他赴考。
  - 母亲说明当年的事，孩子后来考中并以立碑纪念这份善意。辞典将梦中的帮助写作被安葬者的报恩，而不是可核验的科举档案。
  sources:
