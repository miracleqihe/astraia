- id: case_cn_dict5_shanyin_gambler_straw_hut
  title: 山西山阴｜草屋赌局里的吊死鬼
  aliases:
  - 李二鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 39.52038
    lng: 112.81684
    precision: city
    location_name: 山西山阴
    culture_region: 东亚 · 中国
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
  paragraphs:
  - 山阴故事中的李二鬼输了钱，夜间游荡时听见草屋里喧哗，进去发现有人聚赌。他向人借钱加入，起初赢了不少。
  - 赌徒们后来钻圈上吊，他才意识到自己遇见的是吊死鬼；一番惊险后他决定戒赌。草屋与赌局只属于地方故事中的场景。
