- id: case_cn_dict5_linqing_ghost_brother_mud
  title: 山东临清｜车水结义与泥娃
  aliases:
  - 人鬼兄弟
  genre: folktale
  credibility_tier: B
  location:
    lat: 36.84092
    lng: 115.71087
    precision: city
    location_name: 山东临清
    culture_region: 东亚 · 中国
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
  paragraphs:
  - 临清的故事里，一位老人在车水时遇见愿意帮忙的鬼，两者结成兄弟，一同对付欺压乡人的恶霸。后来鬼要去做阎王，两人依约再见。
  - 阎王送老人一个能化为姑娘的泥娃；恶霸把她抢走后，她又变回泥。官员在泥里发现诉状，故事以恶霸受惩结束。
