- id: case_cn_dict5_tongshan_two_debt_spirits
  title: 湖北通山｜两个托生者的不同境遇
  aliases:
  - 讨债鬼与还债鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 29.6081986
    lng: 114.4775062
    precision: city
    location_name: 湖北通山
    culture_region: 东亚 · 中国
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
  paragraphs:
  - 通山故事说，商人张甲听见两个鬼准备托生，其中一个将来到自己家。孩子出生后，他因先入为主地认定孩子是讨债鬼，对孩子十分苛刻。
