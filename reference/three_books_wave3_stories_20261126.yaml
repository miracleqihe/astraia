- id: case_cn_dict5_changsha_opera_appeal
  title: 湖南长沙｜庙会戏台前的诉冤
  aliases:
  - 鬼告状
  genre: folktale
  credibility_tier: B
  location:
    lat: 28.19874
    lng: 112.97087
    precision: city
    location_name: 湖南长沙
    culture_region: 东亚 · 中国
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
  paragraphs:
  - 长沙一带的故事把场景放在一场庙会：包公戏正要开演，一名自称蒙冤而死的女子拉住扮演包公的戏子，向他倾诉遭丈夫杀害的经过。
  - 她带着戏子来到坟地；故事说，戏子查验后向官府告发，涉案者受到惩办。戏台上的审案角色，在叙事中越过舞台，成了替人申冤的人。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: “当代鬼话”，印页 484（PDF 第 599 页），条目“鬼告状”。辞典明示转引文彦生《中国鬼话》（上海文艺出版社 1991 年版）；本次未独立核对该书原件或原始采录。
  - citation: 湖南长沙地理参考。
    type: geographic_reference
    url: https://www.geonames.org/1815577/
    locator: 地区或市县参考点；具体精度见地图说明。
