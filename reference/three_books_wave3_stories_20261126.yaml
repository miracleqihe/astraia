- id: case_cn_dict5_taicang_flatterer_underworld
  title: 江苏太仓｜阴间审讯中的逢迎者
  aliases:
  - 马屁鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 31.44778
    lng: 121.09389
    precision: city
    location_name: 江苏太仓
    culture_region: 东亚 · 中国
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
  paragraphs:
  - 太仓故事中，阎王摆出阴差和牛头马面，准备审问一个善于逢迎的鬼，想用森严阵势使他害怕。
  - 受审者却反复称赞阎王公正无私，令其十分得意，最终被放过。故事把一场审讯写成对奉承与权力的讽刺。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
