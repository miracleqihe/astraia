    location_name: 浙江兰溪
    culture_region: 东亚 · 中国
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
  paragraphs:
  - 兰溪版本让牛备、马飞两名书生一同赴考：马飞擅长钻营而得志，牛备落第后又以梦境作说辞，谋得高位。
  - 二人后来结为同党，横行人间。故事让他们死后继续在阴间听差，借此讲述牛头马面的另一种来历。
