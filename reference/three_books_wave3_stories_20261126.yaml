- id: case_cn_dict5_puning_zhongkui_swapped_face
  title: 广东普宁｜钟馗与被换走的面容
  aliases:
  - 丑鬼戏钟馗
  genre: folktale
  credibility_tier: B
  location:
    lat: 23.31072
    lng: 116.16869
    precision: city
    location_name: 广东普宁
    culture_region: 东亚 · 中国
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
  paragraphs:
  - 普宁地方故事说，钟馗原本相貌英俊，附近山洞里的丑鬼却想与他交换面容。丑鬼来到寺里，反而被钟馗吞下。
  - 丑鬼在腹中施展换脸的本领，钟馗被迫答应并放他离开。故事借一次出人意料的交换解释钟馗后来为何以异貌捉鬼。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
