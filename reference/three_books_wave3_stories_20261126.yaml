- id: case_cn_dict5_taicang_wandering_ghost_king
  title: 江苏太仓｜落第书生与野鬼王
  aliases:
  - 野鬼王
  genre: folktale
  credibility_tier: B
  location:
    lat: 31.44778
    lng: 121.09389
    precision: city
    location_name: 江苏太仓
    culture_region: 东亚 · 中国
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
  paragraphs:
  - 太仓地方故事说，秀才陈剑秋因不满考场舞弊而郁郁而终；由于阳寿未尽，他在阴间成了一名不受约束的野鬼。
  - 众鬼推举他为首，一同对付不平之事。故事最后让当年的考官当众承认罪行，并说此事后来得到处理。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
