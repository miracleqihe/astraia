  - id: case_cn_lingnan_tiaosheng_gu
    title: 岭南广西｜宋代《岭外代答》挑生食蛊与历代畜蛊禁令档案
    aliases:
      - 挑生蛊
      - 广南挑生
      - 桂海畜蛊
      - 雷州推官勘挑生案
      - 造畜蛊毒律
    genre: historical_archive
    credibility_tier: A
    note_kind: history
    location:
      lat: 25.2736
      lng: 110.2902
      precision: province
      location_name: 中国广西桂林（宋静江府）与雷州广南西路 · 宋代挑生与解蛊方志区
      culture_region: 中国 · 岭南与西南食蛊禁令史料区
    location_note: 南宋范成大任静江府（今桂林）知府撰《桂海虞衡志》，周去非曾仕桂林等地撰《岭外代答》并录雷州推官勘验挑生事，坐标取桂林作宋代岭南文献核心参照点。
    temporal:
      year_start: 653
      year_end: 1178
      era_label: 唐代《唐律疏议》（653 年）至南宋乾道淳熙间《岭外代答》（1178 年）
      uncertainty_note: 唐代律典以“造畜蛊毒”通缉岭表及各地毒药巫术，南宋范成大（1175 年）与周去非（1178 年）详细记述广南“挑生”食蛊与官府验案方式。
    paragraphs:
      - 宋代岭南风土名著周去非《岭外代答》卷十《志异门》与范成大《桂海虞衡志》均设专条记述当地“挑生”与“蛊毒”忌讳。《岭外代答》写道，广南所谓挑生，指以鱼肉款待远客之际暗行厌胜，令食入腹中之物“反生”作祟，致胸膈窒痛闷绝，传闻死者魂魄将阴役于施术者之家；书中所引雷州推官李寿翁审案时，甚至当庭令疑犯覆碗施法，启视鱼肉竟呈毛发滋生之状，遂依法定罪。
      - 在政书与医药记录层，唐代《唐律疏议·贼盗》“造畜蛊毒”条早已严惩投毒与巫术合流，清代《大清律例》亦沿袭严刑；而周去非同条既录民间“饮客先尝”之戒，又记当地以升麻、郁金等草药催吐泄下，以及“咀嚼生黄豆不腥、含银针不变黑”的古老验蛊法，反映宋代士大夫试图在惊疑传闻与药物实效之间寻找可操作的应对规程。
      - 从现代热带医学与毒理学视角再读宋代“挑生”档案，岭南湿热气候下鱼贝淡水食源极易携带华支睾吸虫、肺吸虫等寄生虫或产生微生物腐败毒素；生冷鱼肉饮食后突发急性剧烈腹痛、呕吐乃至肠绞痛，极易被客商误判为“鱼肉在腹中活转咬噬”，再叠加异乡语言隔阂与食宿戒心，便凝结成经久不衰的食蛊恐惧。
    sources:
      - citation: 〔南宋〕周去非撰（1178 年），《岭外代答·卷十·志异门·挑生》，中国哲学书电子化计划（CText）。
        type: primary_text
        url: 'https://ctext.org/ling-wai-dai-da'
        locator: 卷十《挑生》广南鱼肉延客、雷州推官勘验及升麻郁金解毒条
