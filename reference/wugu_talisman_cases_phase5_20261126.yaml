  - id: case_cn_quanzhou_jincan_gu
    title: 福建泉州｜宋明笔记中的金蚕蛊传闻与“嫁金蚕”民俗
    aliases:
      - 金蚕蛊
      - 嫁金蚕
      - 泉州金蚕
      - 福清金蚕讼
      - Jincan Gu
    genre: historical_archive
    credibility_tier: A
    note_kind: history
    location:
      lat: 24.8740
      lng: 118.6750
      precision: province
      location_name: 中国福建泉州与闽南沿海 · 宋明笔记“金蚕蛊”及“嫁金蚕”流播区
      culture_region: 中国 · 闽南及东南沿海巫蛊文献区
    location_note: 宋代蔡绦《铁围山丛谈》、洪迈《夷坚志》及明清闽南志书重点载述福建泉州、福清等地“金蚕蛊”与“嫁金蚕”传闻，坐标取泉州古城作东南沿海民俗文献参照点。
    temporal:
      year_start: 1110
      year_end: 1644
      era_label: 北宋《铁围山丛谈》至南宋《夷坚志》、明末《赤雅》记载时期
      uncertainty_note: 蔡绦《铁围山丛谈》记北宋末至南宋初闽蜀金蚕风闻与福清官司，洪迈《夷坚志》收福建诸州金蚕怪谈，明邝露《赤雅》与李时珍《本草纲目》续记南方变体。
    paragraphs:
      - 宋代以降，东南沿海与西南山地出现一种专以“致富反噬”为特征的蛊术传说——金蚕蛊。北宋蔡绦《铁围山丛谈》卷六载，金蚕毒传自蜀中，渐盛于湖广与闽粤：畜主若无力再供其噬咬人命，须以金银钗钏、锦缎裹挟金蚕弃置路旁诱人拾取，谓之“嫁金蚕”；凡贪财捡拾者即成新主，原主方得脱身。文中更记福建福清县民曾因遭邻人诬控“放金蚕害死人命”陷入重狱，老吏教以密引刺猬入室搜捕，因传闻“金蚕畏猬”。
      - 南宋洪迈《夷坚志》继录多则泉州、福州与漳州民间“畜金蚕”“买金蚕”及路拾锦囊致祸的故事；明末邝露《赤雅》则将广西所传夜间熠熠飞行如流星的“飞蛊”并入“金蚕”谱系，李时珍《本草纲目·虫部》亦专门采录民间传说并列石榴根皮等解毒旧方，可见这一观念在数百年间不断吸附各地域的毒虫、致富焦虑与邻里猜忌。
      - 当代民俗史与社会学研读指出，“嫁金蚕”绝非真实昆虫饲养术，而是乡土熟人社会对“暴富”与“外来不明财货”的道德警世叙事：凡一家忽然殷富或与外地客商往来密切，便极易遭邻里疑为“暗养金蚕吸人精血”；而捡拾路边遗物招灾的禁忌，亦在客观上折射出防备不明投毒物与规训非分贪念的双重心理机制。
    sources:
