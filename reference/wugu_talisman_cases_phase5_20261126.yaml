  - id: case_cn_han_taofu_shentu_yulei
    title: 汉魏岁时｜度朔山神荼郁垒与桃符门神厌胜制
    aliases:
      - 神荼郁垒
      - 度朔山桃木
      - 桃符
      - 桃梗苇茭
      - Shentu and Yulei
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 34.6200
      lng: 112.4500
      precision: culture_region
      location_name: 中国河南洛阳（汉魏都城岁时礼制参照点）与东海度朔山神话传统区
      culture_region: 中国 · 汉魏中原岁时门神神话区
    location_note: “度朔之山”为古代东海想象神山，而《论衡》《风俗通义》与汉魏腊祭桃符礼俗主要记述于洛阳等中原礼制中心，此坐标仅作文献文化参考点。
    temporal:
      year_start: 80
      year_end: 550
      era_label: 东汉《论衡》《风俗通义》至南朝梁《荆楚岁时记》定型时期
      uncertainty_note: 东汉王充（约 80 年代）与应劭追述古《山海经》保存度朔山双神神话，6 世纪中叶宗懔《荆楚岁时记》明载岁旦悬桃板、贴神荼郁垒门神定制。
    paragraphs:
      - 东汉王充《论衡·订鬼》与应劭《风俗通义·祀典》均转引战国先秦古本《山海经》佚文称：沧海之中有度朔之山，上有大桃木，屈蟠三千里，其枝间东北角曰“鬼门”，乃万鬼出入之径；山上有二神人，一曰神荼，一曰郁垒，主阅领万鬼，凡遇无道妄为祸害者，即执以苇索、抛之食虎。正是这套早期神话，为后世千余年中国门户岁时厌胜奠定了神圣原型。
      - 为将度朔山神威引入现实门庭，汉代腊月除夕官方与民间遂通行“桃符”之制：《风俗通义》记县官常于腊除夕饰桃人、垂苇茭、画虎于门以御凶魅；至南朝梁宗懔《荆楚岁时记》正月初一条，则形成“造桃板着户，谓之仙木；绘二神贴户左右，左神荼，右郁垒，俗谓之门神”的完备规制，五代后蜀孟昶题写联语于桃符，更为近世春联之直接先声。
      - 民俗学与器物史研究解释“桃木畏鬼”的象征逻辑时指出：先秦《左传》已有“桃弧棘矢以除其灾”的礼俗，桃树早春先花后叶、枝叶味苦含微毒（桃仁含苦杏仁苷）且纹理细密，加之“桃”与“逃”谐音，使其兼具植物药性、巫术象征与门户物理界标三重属性，逐渐由驱鬼神人演变出祝颂岁首平安的门庭艺术。
    sources:
