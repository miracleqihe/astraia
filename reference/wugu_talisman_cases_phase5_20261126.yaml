  - id: case_cn_luban_mujiu_stealth_hex
    title: 明清营造｜匠作木偶厌胜秘法与《清稗类钞》暗埋镇物传说
    aliases:
      - 木匠厌胜
      - 鲁班木偶术
      - 柱础藏木偶
