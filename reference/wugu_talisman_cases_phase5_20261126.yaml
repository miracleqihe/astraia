  - id: case_cn_zhuyou_shisan_ke_healing
    title: 历代太医｜祝由十三科符禁疗疾与《素问》《元史》医官制度
    aliases:
      - 祝由十三科
      - 祝由科
      - 咒禁科
      - 移精变气
      - 太医院十三科
    genre: historical_archive
    credibility_tier: A
    note_kind: history
    location:
      lat: 39.9040
      lng: 116.4070
      precision: city
      location_name: 中国北京（元大都太医院及明清太医院旧址参照点）
      culture_region: 中国 · 历代太医署与太医院制度文献区
    location_note: 元代太医院定制与十三科考课制度颁行于元大都（今北京），明代至隆庆五年裁撤前亦沿设于北京太医院，坐标取北京城区中心作国家医制文献参考点。
    temporal:
      year_start: -200
      year_end: 1571
      era_label: 战国两汉《黄帝内经》至唐太医署、元代十三科与明隆庆五年废科（1571 年）
      uncertainty_note: 《素问·移精变气论》首见“祝由”之名，《新唐书》载太医署四科含“咒禁师”，《元史》记太医院十三科并置祝由书禁，明隆庆五年（1571 年）裁革。
    paragraphs:
      - “祝由”作为中国古代方术医疗的重要概念，横跨早期医经、国家医官建制与道教符箓三大脉络。传世中医经典《黄帝内经·素问·移精变气论》以黄帝之问开篇：“余闻古之治病，惟其移精变气，可祝由而已”；唐王冰注阐释为不借毒药针石，唯借祝说病由与精神调摄而愈。其后隋代太医署设“祝禁博士”，《新唐书·卷四十八·百官志》明载唐代太医署所属四科即分医师、针师、按摩师与“咒禁师”，专司符禁汤药及驱除鬼祟之疾。
      - 至元代，《元史·卷八十一·选举志》与《卷八十八·百官志》记太医院秩正二品并定制“十三科”，岁降十三科疑难题目考校诸路医学，其中即含“祝由科”（又与书禁并称祝由书禁科），使符水咒禁疗疾合法居于朝廷十三医科之列。直到明代隆庆五年（1571 年），礼部与太医院议改医制，方正式将祝由科裁出官定医学考试体系；清代医政亦禁绝之，该科遂彻底转入民间抄本（如托名《轩辕碑记医学祝由十三科》）与道坛传承。
      - 当代医学史与心理医学学者指出，古代官私“祝由”实践中既包含借画符念咒、闭户静坐、数问病者隐情产生的心理暗示、安慰剂效应与轻度催眠解离，也常混用草药外敷、放血或火灸等物理干预；历史阅读时，既应如实肯定元明以前官方医政曾制度化接纳“咒禁祝由”的史实，也需明确现代医学对传染病及器质性急症必须依托循证诊疗的界限。
    sources:
