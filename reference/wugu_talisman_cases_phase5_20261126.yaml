  - id: case_cn_tang_zhongkui_meng_expel
    title: 唐宋宫廷｜终南进士钟馗啖鬼梦兆与岁暮赐画镇宅仪
    aliases:
      - 钟馗啖鬼
      - 钟馗捉鬼
      - 唐玄宗梦钟馗
      - 吴道子画钟馗
