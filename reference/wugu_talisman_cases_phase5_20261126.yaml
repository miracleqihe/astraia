records:
  - id: case_cn_han_wugu_91bce
    title: 西汉长安｜征和二年巫蛊之祸与桐人案牍档案
    aliases:
      - 巫蛊之祸
      - 征和二年巫蛊案
      - 桐木偶人巫蛊
      - 江充巫蛊狱
      - Witchcraft Crisis of 91 BC
    genre: historical_archive
    credibility_tier: A
    note_kind: history
    location:
      lat: 34.3000
      lng: 108.8700
      precision: city
      location_name: 中国陕西西安（汉长安城未央宫与甘泉宫政治档案中心区）
      culture_region: 中国 · 关中汉代都城政治档案区
    location_note: 西汉征和二年（前 91 年）巫蛊大狱围绕长安未央宫、太子宫及皇帝避暑的甘泉宫展开，坐标取汉长安城遗址中心作历史档案地理参照。
    temporal:
      year_start: -92
      year_end: -89
      era_label: 西汉太始末至征和二年（前 92–前 91 年）及轮台诏前后
      uncertainty_note: 《汉书》载太始年间公孙贺案已起巫蛊之狱，征和二年七月长安城内兵变爆发并连坐数万人，征和四年汉武帝作《轮台罪己诏》并察知江充诈伪后族灭其党。
    paragraphs:
      - 据东汉班固《汉书》卷六十三《武五子传》与卷四十五《蒯伍江息夫传》载，汉武帝晚年多病疑忌，自甘泉宫起即以“巫蛊”为名清查内外朝臣。宠臣江充借机受命按治巫蛊，先掘丞相公孙贺及诸公主宅邸，继而率胡巫入皇宫、皇后与戾太子刘据宫室掘地搜检，宣称在太子宫中所得桐木偶人最多，且另有帛书不道之辞。
      - 太子刘据自知陷入绝境而汉武帝远在甘泉宫无法面陈，遂听从少傅石德之议矫诏发兵，捕斩江充及胡巫于上林苑，并引兵与丞相官军激战于长安街市五日。战斗致死者数万，太子兵败东奔湖县（今河南灵宝）自缢，卫皇后与诸皇孙亦先后遇害；后壶关三老茂及高寝郎田千秋上书讼冤，汉武帝方悔悟并兴建思子宫。
      - 征和二年之变在中国古代巫蛊史上具有奠基意义：它表明“刻木偶埋地、咒诅君亲”在汉代不仅被视作私室厌胜，更已被制度化为可启动连坐诛夷的最高政治罪名。史学与社会学研究多指出，此类大狱往往在老迈君主猜忌、外戚与法吏角力以及传染病与灾异恐慌叠加时爆发，将难以验证的“巫蛊物证”转化为政治清洗与替罪机制的合法通道。
    sources:
      - citation: 〔东汉〕班固撰，《汉书·卷六十三·武五子传·戾太子据》，维基文库二十四史校本。
        type: historical_text_transcription
        url: 'https://zh.wikisource.org/wiki/%E6%BC%A2%E6%9B%B8/%E5%8D%B7063'
        locator: 卷六十三《戾太子传》掘得桐木人、长安兵变及田千秋讼冤全文
