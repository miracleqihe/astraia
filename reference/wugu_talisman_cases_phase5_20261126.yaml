  - id: case_cn_sui_dugu_tuo_maogui
    title: 隋代长安｜独孤陀猫鬼蛊狱与《唐律疏议》厌魅禁律
    aliases:
      - 独孤陀猫鬼案
      - 猫鬼蛊
      - 徐阿尼祭猫鬼
      - 造猫鬼
      - 隋唐巫蛊律令
    genre: historical_archive
    credibility_tier: A
    note_kind: history
    location:
      lat: 34.2600
      lng: 108.9500
      precision: city
      location_name: 中国陕西西安（隋大兴城宫廷与大理寺审案中心）
      culture_region: 中国 · 关中隋唐律令史料区
    location_note: 隋文帝开皇年间独孤陀猫鬼案发生并审理于隋大兴城（唐长安城，今西安），《唐律疏议》亦定本于长安，坐标取隋唐长安城中心位置。
    temporal:
      year_start: 598
      year_end: 653
      era_label: 隋开皇后期猫鬼狱案至唐永徽四年《唐律疏议》（653 年）成书期
      uncertainty_note: 《隋书·外戚传》详录开皇年间独孤陀猫鬼蛊案，653 年颁行的《唐律疏议·贼盗》正式将“造猫鬼”与“造畜蛊毒”并列条文。
    paragraphs:
      - 《隋书·卷七十九·外戚传·独孤陀》与《北史》记载，隋文帝文献皇后异母弟独孤陀“性好左道”，其外祖母高氏家世相传“事猫鬼”，后转入独孤陀私宅。开皇年间，文献皇后与尚书左仆射杨素妻郑氏同时骤病，御医诊视均称“此猫鬼疾”；隋文帝疑独孤陀所为，乃命朝臣与大理官员合审其家婢女徐阿尼，供称每于子日夜静祭祀猫鬼，若咒某人即令猫鬼摄害其命、暗移其财入主家。
      - 供词甚至描述官署试法之时，婢女置粥器以匙叩呼猫鬼，旋即目睹如猫之形出现而呈惊悸之状；隋文帝怒极欲赐独孤陀夫妇死刑，因文献皇后三日绝食哀请，且其弟独孤整伏阙叩头流血求免，最终改判独孤陀除名为民，其妻杨氏落发为尼，并诏令天下搜捕严禁私蓄猫鬼者，流配边远。
      - 这宗宫廷公案直接促成中古法制对“蛊毒”与“厌魅”的精细定罪。《唐律疏议·卷第十八·贼盗》专设“造畜蛊毒”律条，其疏议明确点出“谓造合成蛊，堪以害人者，并造猫鬼之类”，规定造畜及教令者皆绞，不知情之同居亲属与知而不纠的里正坊正亦须流三千里。医学史研究者指出，所谓“猫鬼疾”在当时常对应骤发心腹痛或惊厥急症，而酷刑问供则往往把侍婢、女性家眷及边缘族裔推入“蓄鬼害主”的司法框架。
    sources:
      - citation: 〔唐〕魏征等撰，《隋书·外戚传·独孤陀》，中国哲学书电子化计划（CText）。
