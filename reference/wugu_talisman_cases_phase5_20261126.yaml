  - id: case_cn_chizhou_wuchang_nuo
    title: 皖南池州｜宗族傩戏面具祭仪、五猖驱疫与《礼记·郊特牲》乡傩渊源
    aliases:
      - 池州傩戏
      - 贵池傩戏
      - 五猖驱疫
      - 舞五猖
      - 乡人逐疫傩仪
    genre: myth
    credibility_tier: A
    note_kind: story
    location:
      lat: 30.6640
      lng: 117.4910
      precision: city
      location_name: 中国安徽池州贵池区（姚街、刘街、梅街宗族傩堂）
      culture_region: 中国 · 皖南池州宗族傩仪文化区
    location_note: 池州傩戏主脉集中于安徽省池州市贵池区九华山麓刘街、梅街、姚街及青阳、石台诸村落宗族傩会，坐标取贵池区池州古城文化中心。
    temporal:
      year_start: -200
      year_end: 2006
      era_label: 先秦两汉《礼记·郊特牲》乡傩礼俗至明清宗族傩抄本及 2006 年国家级非遗
      uncertainty_note: 《礼记·郊特牲》载孔子朝服立于阼阶观“乡人逐疫”，明清皖南池州诸大姓宗族以抄本保存傩仪、傩舞与正戏三段结构，2006 年列入首批国家级非物质文化遗产名录。
    paragraphs:
      - 安徽池州（尤以贵池区九华山麓姚街、刘街、梅街诸姓宗族聚落为核心）保存着中国戏曲史上极为完整的活态古傩传统。每逢农历正月初七至十五春祭，当地均以血缘宗族而非职业戏班为单位开坛设傩，整套法事分为“傩仪”“傩舞”“傩戏”三叠：既演目连救母与世俗忠孝正戏，更在核心驱疫环节请出樟木彩绘面具，由族中男丁戴上象征凶神猛将的五猖（东青、南红、西白、北黑、中黄五方瘟神或猖神）及钟馗、傩神像，伴以大锣大鼓粗犷踩踏罡步，绕村驱逐疫疠邪祟、祷祝五谷丰登。
      - 这一乡土祭仪遥承先秦两汉的古傩礼制。《礼记·郊特牲》早有“乡人逐疫（乡人傩），孔子朝服而立于阼阶”的经典记载；《周礼·方相氏》更详述官傩持戈蒙熊皮搜室驱疫之仪。随着汉唐宫廷大傩向民间村落沉降，池州各大姓氏将逐疫“舞五猖”、洒鸡血符水、化纸船送瘟等仪式与明清徽剧、目连戏唱腔及祖传手抄傩书合流，形成“无傩不成村”的宗族防御仪轨。
      - 戏剧人类学与非物质文化遗产研究表明，戴上面具的宗族演员并不以个人身份登台，而是借木雕面具与罡步完成神灵附位，把年初季节交替时村社对流行疫病、农业灾荒的集体恐慌，疏导进可掌控的锣鼓节奏与合族欢宴之中，既是活态宗教仪式，也是珍贵的古代村落戏剧史标本。
    sources:
