# Phase 5B Layer 3 & Layer 2 supplement: zhenwu material taxonomy & imperial wugu legal corpus.
# Original academic simplified Chinese syntheses grounded in public-domain classics, statutes, and heritage archives.
records:
  - id: motif_cn_zhenwu_material_taxonomy
    title: 中国镇物三相载体与六维功能分类母题群
    aliases:
      - 镇物分类母题群
      - 三相载体六维功能
      - 镇风止煞镇物
      - Zhenwu material taxonomy
    node_type: motif_index
    z_layer: 3
    genre: academic_model
    credibility_tier: A
    trail: all
    spatial:
      precision: culture_region
      location_name: 中国黄河、长江流域及闽台滇传统镇物分布区
      culture_region: 中国 · 传统镇物与器物民俗区
    temporal:
      year_start: -200
      year_end: 1998
      era_label: 战国秦汉随葬关津镇物至明清民居厌胜与当代遗产保护时期
      uncertainty_note: 涵盖马王堆汉墓帛画、东吴魂瓶买地券、唐宋蒲津铁牛，以及金门风狮爷、云南瓦猫、闽南送王船等跨越两千年的物质民俗谱系。
    paragraphs:
      - 中国传统“镇物”体系在长期演化中呈现出高度系统化的分类结构，可依“三相载体”与“六维功能”加以梳理。就物质载体而言，可分为取材山川草木矿石的“自然镇物”（如泰山石、桃梗、艾叶、雄黄、朱砂）、贴身佩戴或随身护佑的“身之镇物”（如五彩长命缕、百家锁、马王堆帛画随葬衣饰）以及经过匠艺铸雕画印的“人工造作镇物”（如金门石雕风狮爷、云南屋脊瓦猫、蒲津渡铸铁牛、东吴魂瓶与买地券、闽南王船）。
      - 就社会与空间功能而言，镇物全面嵌入人类生存的六大场域：其一“岁时节令”辟邪（端午悬艾、岁暮桃符），其二“护身安命”收魂（长命缕、杂禁方佩符），其三“家宅屋宇”镇宅（瓦猫、照壁、吞口、八卦镜），其四“路道关津”镇水挡风（石敢当、风狮爷、镇河铁牛），其五“婚丧墓葬”界隔阴阳（婚俗红盖头跨火盆、汉代非衣帛画、六朝魂瓶买地券），其六“御凶驱疫”清场（大傩面具、闽南及马六甲送王船巡境送煞）。
      - 本母题在分类框架上参照陶思炎《中国镇物》（台北：东大图书公司“沧海美术·艺术特辑”，1998 年，ISBN 957-19-2210-2）之体系线索，具体论述依据《后汉书·礼仪志》《鲁班经》及国内外考古与非物质文化遗产公开档案独立撰写。比较分析各类型镇物时，应辨明金属铸造与桥梁锚重等工程物理价值、聚落风土防风需求以及传统空间象征防护信仰之间的不同层次。
    note_kind: research
