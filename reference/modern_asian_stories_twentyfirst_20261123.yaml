- id: case_tw_taipei_parking_grandma_2023
  title: 台北｜停车场里的“奶奶”
  genre: memorate
  reading_kind: report
  credibility_tier: A
  theme: corpus_asia_night_noises_and_rumors_2009_2026
  location:
    lat: 25.03752
    lng: 121.56368
    precision: city
    location_name: 中国台湾 · 台北市参考
    culture_region: 东亚 · 台湾
  map_label: 台北
  location_note: 点位为台北市区域参考，不标示具体社宅或住户。
  temporal:
    year_start: 2023
    year_end: 2023
    era_label: 资料发表
    uncertainty_note: 年份为资料发表时间，讲述的经历可能发生于其他时间。
  paragraphs:
  - 凌晨的停车场空荡荡的，忽然传来小女孩叫“奶奶”的声音。声音停一会儿又出现，附近却看不到孩子；一些停车的人因此感到害怕。
  - 2023 年报道指出，声音来自全天循环播放的交通安全宣传影片。管理单位回应，已请业者在夜间切换静音，画面仍可继续播放。
  - 这段声音没有走出停车场，却在那个时段被人听成了一则即将诞生的都市怪谈。
  sources:
  - *id003
  - citation: OpenStreetMap，区域参考。
    type: map_reference
    url: https://www.openstreetmap.org/relation/1293250
    locator: 中国台湾 · 台北市参考
  peers:
  - case_cn_tonggu_light_reflection_2015
- id: case_tw_beiyi_fog_old_woman_2018
  title: 北宜公路｜雾中招手的老妇
  genre: urban_legend
  reading_kind: legend
  credibility_tier: C
  theme: corpus_asia_night_noises_and_rumors_2009_2026
  location:
    lat: 24.937388
    lng: 121.711185
    precision: city
    location_name: 中国台湾 · 新北市坪林区参考
    culture_region: 东亚 · 台湾
  map_label: 坪林
  location_note: 标点为北宜公路沿线坪林区参考，不代表传闻的具体发生地点。
  temporal:
    year_start: 2018
    year_end: 2018
    era_label: 资料发表
    uncertainty_note: 年份为资料发表时间，讲述的经历可能发生于其他时间。
  paragraphs:
  - 山路起雾时，驾驶者只能看见车灯照出的近处。流传的故事里，一位老妇独自站在雾中，向经过的骑士招手，希望搭一段路。
  - 另一个网络讲述让她在车上不断询问对方的名字和住处；道路的弯、夜雾和沿途祭祀习俗，都被讲述者放进了故事。
  - 2018 年媒体整理的是多个流传版本，没有独立证据证明搭车经过。公路本身则真实连接新北与宜兰。
  sources:
  - citation: 林莹真，〈冥纸、浓雾成“死亡公路”〉，TVBS，2018 年 8 月 11 日。
    type: media_account
    url: https://news.tvbs.com.tw/fun/971970
    locator: 北宜公路夜行传闻
  - citation: OpenStreetMap，区域参考。
    type: map_reference
    url: https://www.openstreetmap.org/relation/2922120
    locator: 中国台湾 · 新北市坪林区参考
  peers:
