- id: case_id_ciputat_pocong_performers_2026
  title: 南丹格朗｜买饮料的白衣人
  genre: memorate
  reading_kind: report
  credibility_tier: A
  theme: corpus_asia_night_noises_and_rumors_2009_2026
  location:
    lat: -6.311078
    lng: 106.718411
    precision: city
    location_name: 印度尼西亚万丹 · 西普塔特地区参考
    culture_region: 东南亚 · 印度尼西亚
  map_label: 西普塔特
  location_note: 点位为西普塔特地区参考，不标示商户或住所。
  temporal:
    year_start: 2026
    year_end: 2026
    era_label: 资料发表
    uncertainty_note: 年份为资料发表时间，讲述的经历可能发生于其他时间。
  paragraphs:
  - 2026 年，一些居民在社交媒体上说，夜里见到裹着白布的人在街区徘徊。有人在路边见过两三个身影，也有人说他们坐在住宅区附近。
  - 记者和警方访问夜间营业的店主。受访者说，那些人是穿着当地“裹尸鬼”服装的街头表演者，曾在店边休息、买饮料，并没有打扰店里。
  - 同一种白色身影，在街上传闻中是令人不安的目击，在店主的叙述中则有了停下来喝水的日常细节。
