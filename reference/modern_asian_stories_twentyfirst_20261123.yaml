- id: case_tw_wuri_yellow_raincoats_2011
  title: 台中乌日｜坡道边的黄色人影
  genre: memorate
  reading_kind: report
  credibility_tier: A
  theme: corpus_asia_night_noises_and_rumors_2009_2026
  location:
    lat: 24.104696
    lng: 120.623806
    precision: city
    location_name: 中国台湾 · 台中市乌日区参考
    culture_region: 东亚 · 台湾
  map_label: 乌日
  location_note: 点位为乌日区区域参考，不标示危险路段。
  temporal:
    year_start: 2011
    year_end: 2011
    era_label: 资料发表
    uncertainty_note: 年份为资料发表时间，讲述的经历可能发生于其他时间。
  paragraphs:
  - 一段通往墓园的窄路边，挂着几件黄色雨衣。风吹过时，雨衣远远看去像站着的人；夜里车灯扫过，影子更不容易辨认。
  - 2011 年的电视报道采访了附近居民：有人把雨衣系在路边，是想提醒司机留意坡道，但在夜色中反而吓到了路人。
  - 这是一则已经找到具体物件的误认故事：被讲述的“人影”，最后仍然留在那条需要小心行驶的道路旁。
  sources:
  - citation: TVBS，〈鬼月路边飘人影？黄色雨衣示警像阿飘〉，2011 年 8 月 23 日。
    type: newspaper_report
    url: https://news.tvbs.com.tw/life/64479
    locator: 现场画面与路段居民访谈
