themes:
- id: corpus_asia_night_noises_and_rumors_2009_2026
  title: 夜声、道路与误认｜亚洲地方怪谈的现场
  paragraphs:
  - 声音先于影像来到人面前：停车场里传来孩子的呼唤，旧庙中响起夜鸟，山路上仿佛有人摆起集市。不同的人在不同地点，把听见的东西讲成自己的经历。
  - 有些报道保留了后来找到的物件或调查：乌日路边的是雨衣，台北停车场的声音来自宣传片，西普塔特的白衣人被商户认作街头表演者。也有些声音至今只留下受访者的回忆。
  - 网络给旧街巷或住处起名之后，这些地方仍然是日常生活的空间。把居民的说法、媒体记录与地图上的区域参考放在一起，才能看见怪谈之外的人。
  sources:
  - &id001
    citation: 葛学涛、陈咏，〈江苏扬州一古巷被恶搞为中国“最邪地”〉，《扬子晚报》，2009 年 7 月 21 日；中新网转载。
    type: investigative_report
    url: https://www.chinanews.com/sh/news/2009/07-21/1783405.shtml
    locator: 网络帖、居民访谈与记者实地观察
