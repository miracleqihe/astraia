- id: case_cn_yangzhou_luosijieding_2009
  title: 扬州｜古巷里的灯与琴声
  genre: memorate
  reading_kind: report
  credibility_tier: A
  theme: corpus_asia_night_noises_and_rumors_2009_2026
  location:
    lat: 32.396855
    lng: 119.407766
    precision: city
    location_name: 中国江苏 · 扬州城区参考
    culture_region: 中国 · 近现代地方传闻
  map_label: 扬州
  location_note: 点位为扬州城区参考，不指向巷内住户。
  temporal:
    year_start: 2009
    year_end: 2009
    era_label: 资料发表
    uncertainty_note: 年份为资料发表时间，讲述的经历可能发生于其他时间。
  paragraphs:
  - 一条旧巷蜿蜒很长。网络帖子说，这里一到夜里灯就熄灭，电动车也会停下；有人还听见从深处传来的琴声。巷名的来历在帖子里被写成了一段恐怖故事。
  - 2009 年，记者白天和夜间都去过这里，骑车穿过巷子时没有遇到帖子描述的故障。住了多年的居民说，路灯曾因线路老化损坏，后来已经维修；他们也没有听到那种琴声。
  - 另一种地方说法把巷名与旧澡堂的旋转楼梯联系起来。居民希望好奇的人记住：故事里的街巷，也是有人每天生活的地方。
  sources:
  - *id001
  - citation: OpenStreetMap，区域参考。
    type: map_reference
    url: https://www.openstreetmap.org/relation/4430826
    locator: 中国江苏 · 扬州城区参考
  peers:
  - case_cn_tonggu_light_reflection_2015
- id: case_cn_shouguang_shop_knock_2010
  title: 山东寿光｜午夜店门的敲击
  genre: memorate
  reading_kind: report
  credibility_tier: A
  theme: corpus_asia_night_noises_and_rumors_2009_2026
  location:
    lat: 36.876236
    lng: 118.732255
    precision: city
    location_name: 中国山东 · 寿光市参考
    culture_region: 中国 · 近现代地方传闻
  map_label: 寿光
  location_note: 点位为寿光市区域参考，不指向店铺或当事人住宅。
  temporal:
    year_start: 2010
    year_end: 2010
    era_label: 资料发表
    uncertainty_note: 年份为资料发表时间，讲述的经历可能发生于其他时间。
  paragraphs:
  - 一间小店在深夜响起敲门声。店主人起床开门，外面却看不见人；接下来几晚，声音又一次次出现，时间常常接近午夜。
  - 店主向派出所求助。当地民警告诉记者，他们在夜里守候，发现敲门的人是与店主认识的邻居；随后双方接受调解。
  - 报道把这个原本被当成“鬼敲门”的经历，放回邻里纠纷和夜间生活的背景里。
  sources:
  - citation: 陈怀禹等，〈半夜“鬼”敲门，吓坏店主人〉，《齐鲁晚报》，2010 年 4 月 9 日；新浪转载。
    type: newspaper_report
    url: https://news.sina.com.cn/c/2010-04-09/075317345661s.shtml
    locator: 报案人经历与警方调解记录
  - citation: OpenStreetMap，地区参考。
    type: map_reference
    url: https://www.openstreetmap.org/relation/3468767
    locator: 中国山东 · 寿光市参考
  peers:
  - case_cn_tonggu_light_reflection_2015
- id: case_tw_tucheng_temple_nightjar_2023
  title: 新北土城｜废庙里的夜叫
  genre: memorate
  reading_kind: report
  credibility_tier: A
  theme: corpus_asia_night_noises_and_rumors_2009_2026
  location:
    lat: 24.972201
    lng: 121.443348
    precision: city
    location_name: 中国台湾 · 新北市土城区参考
    culture_region: 东亚 · 台湾
  map_label: 土城
  location_note: 点位为土城区行政区域参考，不是废庙具体位置。
  temporal:
    year_start: 2023
    year_end: 2023
    era_label: 资料发表
    uncertainty_note: 年份为资料发表时间，讲述的经历可能发生于其他时间。
  paragraphs:
  - 夜里，路过一座空庙的人听见尖锐的叫声。声音一遍遍从屋里传出，有人觉得像是在喊人求救，越听越不敢靠近。
  - 2023 年，民众把声音通报给新北市动物保护人员。到场人员根据叫声与习性判断，声音来自夜行性鸟类夜鹰。
  - 同一阵夜声，在熟悉周围生态的人耳中与初次经过的路人耳中，可以是两种截然不同的经验。
  sources:
  - *id002
