- id: case_jp_saitama_shared_dream_2020
  title: 日本埼玉｜废村之后的梦
  genre: memorate
  reading_kind: report
  credibility_tier: C
  theme: corpus_asia_night_noises_and_rumors_2009_2026
  location:
    lat: 35.975417
    lng: 139.416011
    precision: province
    location_name: 日本 · 埼玉县参考
    culture_region: 东亚 · 日本
  map_label: 埼玉县
  location_note: 报道未公开废村名称；标点仅代表埼玉县。
  temporal:
    year_start: 2020
    year_end: 2020
    era_label: 资料发表
    uncertainty_note: 年份为资料发表时间，讲述的经历可能发生于其他时间。
  paragraphs:
  - 一群人走进埼玉县一处废村，屋里还留着旧餐具和日历。离开后一周，大家再次聚在一起，其中一人说，自己做梦回到了那座村子。
  - 梦里，他放大拍下的画面，看见树上坐着一个穿蓝色工装的人。其他同行者也讲起相似的梦：有人在井边看到那个人，有人说他坐在屋内。
  - 这是怪谈讲述者吉田悠轨在 2020 年采访中转述的同行者经历；梦境和共同时间均来自讲述，文章没有给出可独立核验的记录。
  sources:
  - citation: 《周刊女性 PRIME》，〈都内屈指の「最恐スポット」に潜入〉，2020 年；Livedoor 新闻转载。
    type: interview
    url: https://news.livedoor.com/article/detail/18770972/
    locator: 怪谈讲述者吉田悠轨的采访及梦境故事
