themes:
- id: corpus_th_spirit_houses_pearce_2011
  title: 神灵屋与城市中的地方感｜泰国田野研究
  genre: academic_model
  peers:
  - case_th_mae_nak_phra_khanong
  - corpus_th_johnson_night_fieldwork_2026
  paragraphs:
  - 泰国家屋、商铺或旅馆附近常见小型神灵屋。它们的称呼和供奉对象并不完全相同；有的与土地、地方守护者及家屋生活相连。
  - 人类学者 Michael Pearce 的 2011 年论文以三个泰国城市共十八个月的田野为基础，讨论两个案例中人们如何使用神灵屋，以及这些场所如何参与塑造人对居住地的感受。
  - 另一份 2016 年家庭访谈记录了受访者及其亲人对曼谷街头神灵屋的记忆。它是一家人的说法，不能替代整项研究，也不等于所有泰国人的共同看法。
  - 本节依据期刊公开摘要和馆藏书目整理；昆士兰大学论文原稿由康奈尔馆藏登记，全文需向馆方申请。
  sources:
  - citation: 'Michael Pearce, “Accommodating the discarnate: Thai spirit houses and the phenomenology of place”, Material Religion 7(3), 2011, 344–372。'
    type: peer_reviewed
    url: https://www.tandfonline.com/doi/abs/10.2752/175183411X13172844495939
    locator: 期刊公开摘要；18 个月、三个城市田野与两个案例
  - citation: 'Michael Robert Pearce, Accommodating the Discarnate: Spirit Houses in Contemporary Urban Thailand, University of Queensland, 2010，Cornell eCommons。'
    type: academic_thesis
    url: https://hdl.handle.net/1813/33431
    locator: 馆藏书目与摘要；全文须向馆方申请
  - citation: “Thai Spirit Houses”, USC Digital Folklore Archives, interview 24 April 2016, posted 12 May 2016。
    type: oral_history
    url: https://folklore.usc.edu/tag/spirit-house/
    locator: 泰裔受访者及采集者母亲对神灵屋的家庭回忆；按标题查找
- id: corpus_asia_night_places_oral_accounts_2012_2025
  title: 夜里的房间与道路｜故事怎样被记住
  genre: academic_model
  peers:
  - corpus_east_asia_school_oral_accounts_2011_2026
  - case_jp_tokyo_forest_school_window_1986
  - corpus_vn_urban_rumor_reporting_2005_2017
  paragraphs:
  - 一个人把窗里的倒影讲给朋友；一位母亲把躲在隔间里的故事讲给孩子；另一个家庭把看见树旁巨人的往事告诉长大后的当事人。
  - 这些记录的共同点是讲述的路线可以辨认：有人记得亲身见闻，有人只记得自己从谁那里听说，后来的人也可能给出不同解释。
  - 把故事并列，能看到家庭、夜路和校园怎样成为讲述的场所；相似的情节并不能单独证明故事从一个地区传到了另一个地区。
  sources:
  - &id001
    citation: Aisling Deng, “An apartment is found haunted by reflection on the window”, USC Digital Folklore Archives, interview 24 April 2019, posted 13 May 2019。
    type: oral_history
    url: https://folklore.usc.edu/an-apartment-is-found-haunted-by-reflection-on-the-window/
    locator: 北京成长的受访者讲述窗中倒影故事；未给出故事地点
  - &id002
    citation: Tiffany Luke, “Japanese Ghost Story”, USC Digital Folklore Archives, interview 12 March 2012, posted 16 May 2012。
    type: oral_history
    url: https://folklore.usc.edu/japanese-ghost-story/
    locator: 受访者重述母亲讲过的校园躲藏故事
  - &id005
    citation: Xavier Siazon, “Kapre Ghost Story”, USC Digital Folklore Archives, interview 3 April 2025, posted 1 May 2025。
    type: oral_history
    url: https://folklore.usc.edu/kapre-ghost-story/
    locator: 受访者转述家人对其马尼拉童年经历的回忆及自己的解释
records:
- id: case_cn_beijing_teller_window_reflection_2019
  title: 北京讲述｜窗里的老人
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 39.9042
    lng: 116.4074
    precision: city
    location_name: 中国北京 · 讲述者成长地参考
    culture_region: 中国 · 华北
  location_note: 北京是讲述者的成长地；故事未说明公寓所在城市。
  paragraphs:
  - 一名男子买下一楼的公寓，装修时常看见一位老人站在窗外的草地上望着他。每次他走出门，窗外又没有人。
  - 搬进去后，朋友来访，他请朋友到外面看看，自己留在屋里观察窗子。朋友很快跑回来，把他带到屋外：从外面看，那个身影映在玻璃上，仿佛老人其实站在屋内。
  - 2019 年，一位在北京成长的学生向南加州大学民俗档案讲述这个故事。她没有给出公寓所在地点。
  sources:
  - *id001
- id: case_cn_four_corner_extra_player_2019
  title: 中国校园讲述｜四个角落的第五个人
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 35.8617
    lng: 104.1954
    precision: culture_region
    location_name: 中国 · 讲述背景范围参考
    culture_region: 中国 · 跨地区
  location_note: 受访者是中国大学生；记录没有写明学校或故事地点。
  paragraphs:
  - 一个校园故事说，四个人在昏暗的房间里分别站在四个角落，沿墙依次走向下一个人。故事中的游戏一直继续，直到有人想起：最先走动的人已经离开原来的位置。
  - 如果第四个人仍能在那个角落碰到人，多出来的究竟是谁？讲述到这里，故事便停住了，没有给第五个人安排姓名或面孔。
  - 2019 年民俗访谈中，一位大学生说她初中时听过这个故事，并一直记得当时的害怕。
  sources:
  - citation: Aisling Deng, “Game for Summoning Ghosts”, USC Digital Folklore Archives, posted 13 May 2019。
    type: oral_history
    url: https://folklore.usc.edu/ghost-game-with-4-people-and-a-rectangular-house/
    locator: 大学生回忆初中时听到的四角游戏故事
- id: case_jp_school_fifth_stall_2012
  title: 日本校园故事｜第五间隔间
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 36.2048
    lng: 138.2529
    precision: culture_region
    location_name: 日本 · 故事背景范围参考
    culture_region: 东亚 · 日本
  location_note: 日本是讲述中的学校背景；档案未说明具体学校或城市。
  paragraphs:
  - 一群孩子在夜里的学校玩捉迷藏。一名男孩看见长发白衣的人，连忙躲进洗手间最里面的隔间。
  - 门外的脚步停下来，隔间的门从第一间开始依次被打开。第四间关上后，男孩等了很久，自己那扇门却始终没有动静。
  - 他在里面睡着，醒来时天已经亮了。门推不开，他抬起头，才看见那个身影一直伏在门的上方。2012 年的受访者说，这个故事是母亲在她小时候讲给她听的。
  sources:
  - *id002
  peers:
  - corpus_jp_school_story_space_1986_1999
- id: case_jp_okinawa_hillside_blue_light_2019
  title: 冲绳｜山坡上的蓝光
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 26.5
    lng: 127.9
    precision: province
    location_name: 日本冲绳岛 · 地区范围参考
    culture_region: 东亚 · 日本
  location_note: 点位仅表示冲绳岛范围；访谈未给出公园、山坡或神社的位置。
  paragraphs:
  - 刚搬到冲绳不久的 AM 与朋友夜里在公园闲谈。有人指向远处山坡，说那里有一道蓝色的人形光影；AM 望过去，也看见山上的蓝光。
  - 同行的人提起岛上流传的灵异故事，几个人随后离开了。AM 没有描述那道光的来源，也没有说它靠近过他们。
  - 2019 年，AM 在洛杉矶的宿舍里向采集者讲起这段记忆。地图标的是回忆中提到的冲绳，不是后来讲述故事的地点。
  sources:
  - citation: Vivian Gray, “Blue Ghosts in Okinawa, Japan”, USC Digital Folklore Archives, 13 May 2019。
    type: oral_history
    url: https://folklore.usc.edu/blue-ghosts-in-okinawa-japan/
    locator: 受访者在洛杉矶回忆冲绳岛夜间看到的光
- id: case_tw_yushan_borrowed_socks_2014
  title: 台湾玉山｜借走袜子的夜客
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 23.470018
    lng: 120.95727
    precision: province
    location_name: 中国台湾 · 玉山山域参考
    culture_region: 东亚 · 台湾
  location_note: 主峰坐标仅用于表示玉山山域；受访者没有说出木屋或登山路线。
  paragraphs:
  - 一支登山队在玉山的山屋过夜。半睡半醒间，一位队员觉得有女孩叫醒他，说自己很冷，想借一双袜子；他从背包里拿出来，随后又睡着了。
  - 第二天早上，他问遍同行的人，却没人承认借过袜子。他发现背包里确实少了一双，队员们也没有找到。
  - 2014 年，一位台湾受访者把大学同学讲给自己的这段经历转述给民俗采集者。木屋周围过去发生过什么，在口述中仍是听说来的背景。
  sources:
  - citation: Irene Wang, “Jade Mountain Ghost”, USC Digital Folklore Archives, interview 9 April 2014, posted 16 May 2014。
    type: oral_history
    url: https://folklore.usc.edu/jade-mountain-ghost/
    locator: 受访者转述大学同学在玉山登山途中所讲的借袜子经历
  - citation: 台湾登山资讯：玉山国家公园步道通讯点汇整表。
    type: map_reference
    url: https://hike.taiwan.gov.tw/files/%E7%8E%89%E5%B1%B1%E5%9C%8B%E5%AE%B6%E5%85%AC%E5%9C%92%E6%AD%A5%E9%81%93%E9%80%9A%E8%A8%8A%E9%BB%9E%E5%BD%99%E6%95%B4%E8%A1%A8J.pdf
    locator: 玉山主峰顶：23.470018, 120.95727；用作山域参考
  peers:
  - case_cn_tw_yushan_yellow_raincoats
- id: case_th_phuket_spirit_house_sleep_2016
  title: 普吉岛｜神灵屋旁的一次争执
  genre: memorate
  credibility_tier: B
  theme: corpus_th_spirit_houses_pearce_2011
  location:
    lat: 7.8804
    lng: 98.3923
    precision: province
    location_name: 泰国普吉岛 · 地区范围参考
    culture_region: 东南亚 · 泰国
  location_note: 档案只说旅行发生在普吉岛，未给出旅馆名称或位置。
  paragraphs:
  - 一次家庭旅行中，讲述者找不到手表，叫醒同住一间房的弟弟帮忙。弟弟的回应令她不快，她便独自出门跑步。
  - 经过旅馆附近的神灵屋时，她仍想着这场争执。回到房间，弟弟告诉她，自己刚才觉得胸口受压、身体不能动。
  - 弟弟把这次经历称作睡眠瘫痪；姐姐则把它理解为神灵对他的提醒。2016 年的家庭访谈同时留下了两人的不同解释，不能据此诊断那次经历。
  sources:
  - citation: “Lesson from the Spirits”, USC Digital Folklore Archives, interview 24 April 2016, posted 28 April 2016。
    type: oral_history
    url: https://folklore.usc.edu/lesson-from-the-spirits/
    locator: 受访者回忆在普吉岛家庭旅行时与弟弟的不同解释
  peers:
  - mech_sleep_paralysis
- id: case_my_penang_usm_lake_tree_ghost
  title: 槟城校园｜湖边树上的影子
  genre: urban_legend
  credibility_tier: C
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 5.35780054
    lng: 100.3040272
    precision: city
    location_name: 马来西亚槟城 · 理科大学主校区参考
    culture_region: 东南亚 · 马来西亚
  location_note: 坐标为校园测站参考点，不指向故事里的湖、树或宿舍。
  paragraphs:
  - 传闻中，一名学生开完社团会议后独自走回宿舍。校园巴士已经停驶，他经过湖边时，瞥见树间有一团模糊的黑影。
  - 他以为那东西像一张人脸，吓得一边念祷词一边跑回去；故事又说，他后来病了好一阵。
  - 马来西亚媒体将这段文字列为理科大学学生间流传的校园故事，未给出最初讲述者或发生日期。
  sources:
  - &id003
    citation: TTN Writer：〈USM 的恐怖鬼故事，你听过那些？〉，TTN 谈谈网。
    type: magazine_article
    url: https://tantannews.com/topic/w9aADkKOev/amp
    locator: “树上的头”“半夜的鬼巴士”“洗衣房的好朋友”三则校园转述
  - &id004
    citation: SONEL：USMP GNSS station, Universiti Sains Malaysia, Penang。
    type: map_reference
    url: https://www.sonel.org/spip.php?idStation=2636&page=gps
    locator: 槟城校区测站坐标 5.35780054, 100.30402720，仅作校园范围参考
- id: case_my_penang_usm_empty_night_bus
  title: 槟城校园｜半夜的空巴士
  genre: urban_legend
  credibility_tier: C
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 5.35780054
    lng: 100.3040272
    precision: city
    location_name: 马来西亚槟城 · 理科大学主校区参考
    culture_region: 东南亚 · 马来西亚
  location_note: 坐标为校园测站参考点；文章未提供可核对的宿舍与车站。
  paragraphs:
  - 深夜读书时，一名学生听见车声，从窗户望见一辆空荡荡的校园巴士。她下楼想上车，司机却把她叫住，让她赶快回宿舍。
  - 故事给这辆夜车安排了另一种乘客，也流传过一段关于校园建筑与安抚亡灵的背景。
  - 这则说法出现在媒体整理的学生怪谈中；文章没有提供可以核对车次和人物身份的记录。
  sources:
  - *id003
  - *id004
- id: case_my_penang_usm_laundry_white_shape
  title: 槟城校园｜洗衣房里的白影
  genre: urban_legend
  credibility_tier: C
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 5.35780054
    lng: 100.3040272
    precision: city
    location_name: 马来西亚槟城 · 理科大学主校区参考
    culture_region: 东南亚 · 马来西亚
  location_note: 坐标为校园测站参考点；故事中的校外宿舍未被定位。
  paragraphs:
  - 宿舍洗衣机总要排队。一次轮到她时已近午夜，学生独自下楼收衣服，余光里忽然掠过一团白影。
  - 她抬起头，那轮廓又不见了。她抱着衣服往房间跑，快到门口时，似乎听见身后传来笑声。
  - 这是马来西亚媒体整理的一则匿名校园转述；文中的宿舍、人物和时间没有进一步定位。
  sources:
  - *id003
  - *id004
- id: case_vn_dalat_prenn_white_passenger_2004
  title: 越南大叻｜山口搭车的人
  genre: urban_legend
  credibility_tier: A
  theme: corpus_vn_urban_rumor_reporting_2005_2017
  location:
    lat: 11.9404
    lng: 108.4583
    precision: city
    location_name: 越南林同省大叻 · 城市参考点
    culture_region: 东南亚 · 越南
  location_note: 地图只标大叻城市范围；报道涉及 Prenn 山口附近多座建筑，未精确定位故事场所。
  paragraphs:
  - 大叻通往 Prenn 山口的路边，有司机听过一个传闻：夜里一名白衣女子拦车，车开出一段后，座位上却空了。路旁旧别墅也因此被编进不同的故事。
  - 2004 年一篇报道记下了这些讲法：有人在废屋附近连续三个夜晚观察，没有见到传闻中的身影；山雾、风声和照进屋内的灯光仍让现场显得阴森。
  - 2010 年另一篇报道记录，地方人员在山口别墅附近调查三座新出现的假墓，现场没有发现遗骸。假墓调查有其具体范围，并不能单独解释所有传闻。
  sources:
  - citation: 〈Những biệt thự ma ở Đà Lạt〉，Ngôi Sao / VnExpress，2004 年 8 月 11 日。
    type: newspaper_report
    url: https://ngoisao.vnexpress.net/nhung-biet-thu-ma-o-da-lat-2437595.html
    locator: Prenn 山口搭车传闻与连续三个夜晚观察的记述
  - citation: Gia Bình：〈Giải mã “ngôi biệt thự ma” ở Đà Lạt〉，《Thanh Niên》报道，Dân trí 转载，2010 年 9 月 13 日。
    type: newspaper_report
    url: https://dantri.com.vn/thoi-su/giai-ma-ngoi-biet-thu-ma-o-da-lat-1284608937.htm
    locator: Prenn 山口传闻、三座假墓与地方调查的报道
  reading_kind: report
- id: case_vn_hanoi_rental_mango_fireflies_2016
  title: 河内讲述｜芒果树边的萤火
  genre: memorate
  credibility_tier: C
  theme: corpus_vn_urban_rumor_reporting_2005_2017
  location:
    lat: 21.0278
    lng: 105.8342
    precision: city
    location_name: 越南河内 · 城市参考点
    culture_region: 东南亚 · 越南
  location_note: 网络作者自称在河内读书；租屋地址没有公开，点位只表示城市。
  paragraphs:
  - 一篇 2016 年网络故事里，自称在河内读大学的作者搬进新租屋。楼后空地上有一棵大芒果树；房间的灯时常闪烁，暴雨夜里床铺又不知为何湿了。
  - 一天深夜，他与同事喝酒后回家，在离租屋不远处遇到熄火。树旁许多萤火虫忽然聚拢，他说自己还看见模糊人影，害怕得坐在地上。
  - 他向空地低声请求平安，等灯光重新亮起，发现自己已在树下。作者以亲历口吻写下这段经历；网页没有提供能够核验当事人与住址的资料。
  sources:
  - citation: Kẻ Phiến Loạn：〈Phòng trọ ma ám và chuỗi ngày ác mộng〉，Truyện ma có thật，2016 年 8 月 16 日。
    type: personal_blog
    url: https://truyenmacothat.wordpress.com/2016/08/16/phong-tro-ma-am-va-chuoi-ngay-ac-mong/
    locator: 署名网络叙述，作者自称河内学生并讲述租房经历
- id: case_ph_manila_banana_tree_kapre_2025
  title: 马尼拉｜窗外的树与巨人
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 14.5995
    lng: 120.9842
    precision: city
    location_name: 菲律宾马尼拉 · 城市参考点
    culture_region: 东南亚 · 菲律宾
  location_note: 家庭住址未公开；点位只表示马尼拉城市范围。
  paragraphs:
  - 家人后来告诉一位在马尼拉长大的受访者：他年幼时望着窗外，指着香蕉树旁说看见了一个高大的人影。祖母向外看，却什么也没看见。
  - 祖母把孩子的描述与当地传说中的树巨人 kapre 联系起来，请人来为房屋祝福。此后再问孩子，他说已经看不到了。
  - 2025 年访谈中，受访者说自己并不记得那一幕；他觉得也可能是孩子把风中晃动的树看成了别的东西。
