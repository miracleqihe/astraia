  case_th_radio_returning_noodles:
    path: vault/01_cases/case_th_radio_returning_noodles.md
    source:
      citation: Sirinee Saktidej Bhanubandh, “Roommates”, USC Digital Folklore Archives, interview 11 November 2013, posted 25 November 2013。
      type: oral_history
      url: https://folklore.usc.edu/roommates/
      locator: 曼谷受访者转述高中同学讲过的清迈校园版本
    original_source_numbers:
    - 1
    source_numbers:
    - 1
    - 2
    paragraphs:
    - 泰国校园里流传过一个关于两名室友的故事：一人身体不适，另一人出门时答应带一份食物回来。
    - 2013 年一次民俗访谈保存了这样的版本：雨夜里，留下的人听见敲门声，开门却只看见一袋炒面和走廊上的水迹。第二天，她听说出门的朋友遇害了。
    - 受访者说自己从曼谷的高中同学那里听过这个故事，讲述中把地点设在清迈的大学；档案没有证实故事中所说的案件。
    - 2006 年泰国广播采访也记下类似的买面故事，但没有指定学校。两个版本可以并读，不能据此确认它们的共同来源。
  case_th_mae_nak_phra_khanong:
    path: vault/01_cases/case_th_mae_nak_phra_khanong.md
    source:
      citation: “Nang Nak”, USC Digital Folklore Archives, interview 24 April 2016, posted 28 April 2016。
      type: oral_history
      url: https://folklore.usc.edu/tag/thai-ghost-stories/
      locator: 受访者回忆童年听到的娜娜故事及烹饪用具版本；按标题查找
    original_source_numbers:
    - 1
    - 2
    source_numbers:
    - 1
    - 2
    - 3
    paragraphs:
    - 故事里，马克离家服役，怀孕的妻子娜娜在他不在时去世。马克归来，仍看到妻子在屋里照料孩子，一时没有察觉。
    - 一天做饭时，娜娜把用具掉到高脚屋下。马克正要去捡，却看见她的手臂越伸越长，轻易把东西取了回来。
    - 2016 年，一位受访者向晚辈重讲这个版本，说自己小时候听别人说起时也害怕过。不同讲述中，掉落的东西和丈夫离开后的结尾都有变化。
    - 曼谷玛哈布寺一带有与娜娜相关的祭祀；电影和地方讲述也保留着不同版本。
