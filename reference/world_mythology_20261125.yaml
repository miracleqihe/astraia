  - id: case_eg_abydos_osiris_myth
    title: 古埃及阿拜多斯｜奥西里斯受难、木匣漂流与复活神话
    aliases:
      - Osiris Myth
      - 奥西里斯与伊西斯
      - 赛特分尸神话
      - 荷鲁斯复仇
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 26.1850
      lng: 31.9189
      precision: city
      location_name: 埃及索哈杰省 · 阿拜多斯遗址（Abydos）
      culture_region: 非洲 · 古埃及尼罗河流域
    location_note: 阿拜多斯是古埃及最为核心的奥西里斯圣地与王室朝圣中心，全篇连续叙事亦见于后世希腊罗马作者的整理。
    paragraphs:
      - 古埃及神话中，奥西里斯曾作为贤明君王教导人间农耕与律法，却遭嫉妒的兄弟赛特设局谋害。赛特按奥西里斯身形暗制精美木匣，在宴会上佯称合身者可得此宝；待奥西里斯躺入匣中，赛特与同伙即刻封死铅盖将其投入尼罗河。木匣顺流飘向地中海并搁浅于比布鲁斯，被一棵巨树包裹其中，直至妻子伊西斯历尽艰辛将其寻回。
      - 据普鲁塔克等古典转述及埃及本土铭文片段，赛特再度劫得遗体并裂为十四块散落埃及各地；伊西斯与奈芙蒂斯化鸟哀哭遍寻残骸，借阿努比斯防腐术拼接木乃伊，伊西斯化作隼鸟扇动双翼吹入气息，令奥西里斯短暂苏生并孕育遗腹子荷鲁斯。奥西里斯此后留驻杜阿特幽冥世界担任冥王与审判主神，而荷鲁斯长成后与赛特激战八十年夺回埃及王权。
      - 奥西里斯之死与再生在古埃及并未以单一连续长篇传世，而是散见于金字塔铭文、阿拜多斯圣庙浮雕、亡灵书咒文及公元 1 至 2 世纪普鲁塔克《论伊西斯与奥西里斯》中。宗教史上，奥西里斯的复苏既呼应尼罗河年复一年的泛滥与草木枯荣，也构成王室与平民追求来世永生的葬仪核心，但它属于信仰与文学传统而非可核验的史实。
    sources:
      - citation: Encyclopaedia Britannica, "Osiris (Egyptian god)".
        type: encyclopedia
        url: 'https://www.britannica.com/topic/Osiris-Egyptian-god'
        locator: 奥西里斯受难、赛特分尸、伊西斯复原与阿拜多斯圣地传统
      - citation: The Metropolitan Museum of Art, "Statuette of Osiris" (Late Period, 664–332 B.C.).
        type: archival_catalogue
        url: 'https://www.metmuseum.org/art/collection/search/545802'
        locator: 后期王朝奥西里斯青铜像馆藏说明与冥王图像学
    compare: [case_eg_aswan_philae_isis_tears, case_eg_thebes_weighing_heart]
    motifs: [index_berezkin_k59]
    bridge:
      entry: REL-1-0003
      cluster: sid_myth
      trail: all
      label: 王权交替与古埃及葬仪信仰
      rationale: 结合阿拜多斯圣地传统与古埃及宗教概论，理解地方祭仪、王权继承与奥西里斯神话如何交织演进。

  - id: case_eg_thebes_weighing_heart
    title: 古埃及底比斯｜《亡灵书》玛特之羽与心脏称量审判
    aliases:
      - Weighing of the Heart
      - 霍尼费尔纸草卷
      - 第 125 章否定自白
      - Book of the Dead
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 25.7300
      lng: 32.6000
      precision: city
      location_name: 埃及卢克索 · 底比斯西岸墓葬区
      culture_region: 非洲 · 古埃及尼罗河流域
    location_note: 新王国时期众多绘有心脏称量图的《亡灵书》纸草卷出土于底比斯西岸贵族墓地，此坐标标示文本出土的地域中心。
    paragraphs:
      - 古埃及丧葬文学《亡灵书》（原名《白昼出行之书》）第 125 章描绘亡者历经阴间门户与守卫后，步入奥西里斯坐镇的“双重真理大厅”。亡者须面向四十二位阴间神灵逐一诵出“否定自白”，声明生前未曾偷盗、欺诈、污染水源或篡改秤砣，从而求取通往芦苇原永生之地的资格。
      - 随后进入著名的称心仪式：豺狼首的阿努比斯将象征生命记录与良知的心脏（ib）置于天平一端，另一端摆放代表宇宙真理与秩序的女神玛特（Ma'at）之鸵鸟羽；朱鹭首书吏神托特执芦苇笔站在旁侧记录称量结果。若心脏轻过或与羽毛平衡，荷鲁斯便引领亡者拜见端坐莲花与奥西里斯四子前的冥王；若因罪恶沉重失衡，蹲伏天平旁的“吞噬者”阿米特便会扑食心脏，令亡者陷入彻底毁灭的“第二次死亡”。
      - 大英博物馆藏第十九王朝霍尼费尔纸草卷（EA 9901 第 3 幅）完整保存了这一图景。考古与文献研究指出，《亡灵书》往往与圣甲虫护身符共同陪葬，咒文意在借助仪式语言帮助亡者安度审判；它呈现的是古埃及人对道德责任与死后秩序的宗教想象，而不是实证层面的死后世界图景。
    sources:
      - citation: The British Museum, "Book of the Dead of Hunefer (EA9901, Sheet 3)".
        type: archival_catalogue
