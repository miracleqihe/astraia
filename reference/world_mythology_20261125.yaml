        url: 'https://folkency.nfm.go.kr/topic/detail/5336'
        locator: 韩国国立民俗博物馆《三国遗事》与《帝王韵纪》檀君神话条目
      - citation: Encyclopaedia Britannica, "Tangun (Korean mythology)".
        type: encyclopedia
        url: 'https://www.britannica.com/topic/Tangun'
        locator: 桓雄、熊女与古朝鲜开天建国神话学术概览
      - citation: Academy of Korean Studies, Encyclopedia of Korean Culture, "太白山 (Taebaeksan)".
        type: institutional_account
        url: 'https://encykorea.aks.ac.kr/Article/E0058920'
        locator: 太伯山名号考证及半岛圣山天祭传统
