        type: encyclopedia
        url: 'https://www.britannica.com/topic/Matsya'
        locator: 摩蹉鱼神化身从《百道梵书》到《往世书》的谱系演变
    compare: [case_iq_uruk_gilgamesh_flood, case_in_purana_samudra_manthana]
    motifs: [index_berezkin_c2, index_berezkin_c3]
    bridge:
      entry: REL-2-0001
      cluster: sid_myth
