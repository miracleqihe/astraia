  - id: case_ie_tara_tuatha_de_danann
    title: 爱尔兰塔拉｜达努神族降临、魔法四宝与退居仙丘神话
    aliases:
      - Tuatha Dé Danann
      - 达努神族
      - 爱尔兰侵占记
      - 塔拉山命运之石
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 53.5789
      lng: -6.6122
      precision: city
      location_name: 爱尔兰米斯郡 · 塔拉山遗址（Hill of Tara）
      culture_region: 欧洲 · 爱尔兰凯尔特传统
    location_note: 塔拉山是爱尔兰王权加冕圣地与神族四宝之一“命运之石”（Lia Fáil）传说安放点，此坐标作凯尔特神族叙事中心参考。
    paragraphs:
      - 收录于中世纪爱尔兰抄本《爱尔兰侵占记》（Lebor Gabála Érenn）及《莫伊图拉战役》的古老传说称，拥有超凡技艺与魔法的达努神族（Tuatha Dé Danann）曾居于北方四座神秘城市习得秘法，后乘着蔽日黑云降临爱尔兰岛并焚毁战船断绝退路。神族携四件至宝入岛：一触真王即长啸的塔拉命运之石（Lia Fáil）、所向披靡的卢格长矛、无人能逃脱的努阿达神剑，以及永不枯竭的达格达魔釜。
      - 历经两场莫伊图拉血战，达努神族先胜本地菲尔博格人，再借银臂王努阿达、全能匠神卢格（Lugh）之力击败独眼巨人巴罗尔统率的福摩尔海魔，确立岛上秩序。然而数代之后，随着西班牙渡海而来的凡人米利西安人（盖尔人先祖）登陆，神族吟游诗人阿美尔金与国王们议定契约，将爱尔兰天地上下平分。
      - 按“地上归凡人、地下归神族”的盟约，达努神族举族隐入岛上星罗棋布的史前土丘（Sídhe，即“仙丘”）之下，逐渐演变为爱尔兰民间信仰中的隐世精怪与“好邻居”（Aos Sí）。近代民俗学家指出，中世纪基督教修道士在抄录这些神话时多刻意将昔日神祇史实化为古代移民部落，故阅读时须辨析修道院文本与口述仙丘传说之间的层累改写。
    sources:
      - citation: Encyclopaedia Britannica, "Tuatha Dé Danann".
        type: encyclopedia
        url: 'https://www.britannica.com/topic/Tuatha-De-Danann'
        locator: 达努神族四件圣物、莫伊图拉战役及退入地下仙丘条目
