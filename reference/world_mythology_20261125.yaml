  - id: case_ru_novgorod_perun_veles
    title: 东斯拉夫诺夫哥罗德｜雷神佩伦与伏神维列斯对峙神话
    aliases:
      - Perun and Veles
      - 佩伦神
      - 维列斯
      - 佩伦尼神庙遗址
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 58.4744
      lng: 31.2736
      precision: city
      location_name: 俄罗斯诺夫哥罗德州 · 大诺夫哥罗德佩伦尼（Peryn）半岛
      culture_region: 欧洲 · 俄罗斯东斯拉夫传统
    location_note: 大诺夫哥罗德沃尔霍夫河出口的佩伦尼（Peryn）曾立有雷神佩伦神像并经考古发掘，此坐标作东斯拉夫文献与考古参照点。
    paragraphs:
      - 在前基督教斯拉夫宗教中，至高雷电战神佩伦（Perun）高居世界橡树树冠或天际山巅，手持战斧与火石雷箭；而在树根沼泽、水域与冥界深处盘踞着牛角蛇身之神维列斯（Veles），主司牲畜、财富、水域、魔法与逝者之魂。自《往年纪事》（Russian Primary Chronicle）至后世条约誓言，这对并立的神名共同维系着天界秩序与大地冥界的张力。
      - 比较语言学家伊万诺夫与托波罗夫等学者从后期巴尔干及东斯拉夫民俗、民谣与雷电禁忌中构拟出著名的“暴风战神对决蛇魔”核心神话：维列斯窃走天界牛群、水源或配偶逃往地面，一路不断化形隐匿于树石、水波或屋角之后；佩伦驾云投掷闪电一路追击，直至迫出蛇怪将其劈入水中，随即降下倾盆甘霖滋润田野。
      - 980 年基辅大公弗拉基米尔曾在基辅与大诺夫哥罗德佩伦尼高丘竖立佩伦木像，并于 988 年受洗后下令将神像拖入第聂伯河与沃尔霍夫河焚毁沉水。学界需明确说明：东斯拉夫并未留下如《埃达》般完整的本土神话长卷，佩伦与维列斯“盗牛激战”的完整情节很大程度上属于结合印欧语源学与民间雷雨故事的学术重构，不能与直接传世的古文献混为一谈。
    sources:
      - citation: Encyclopaedia Britannica, "Perun (Slavic deity)".
        type: encyclopedia
        url: 'https://www.britannica.com/topic/Perun'
        locator: 雷电神佩伦神格、基辅与诺夫哥罗德毁像纪事及民俗雷箭传统
      - citation: Encyclopaedia Britannica, "Slavic religion".
