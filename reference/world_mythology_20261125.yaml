      entry: REL-2-0009
      cluster: sid_liminal
      trail: all
      label: 死后之问与我（Ātman）观念边界
      rationale: 以那奇凯塔拒受俗世奖赏而追问死后实相的对话，引导阅读印度传统对业报、解脱及生死界线的哲学探讨。

  - id: case_in_chidambaram_shiva_nataraja
    title: 南印度吉登伯勒姆｜湿婆“舞王”纳塔罗阇宇宙之舞神话
    aliases:
      - Shiva Nataraja
      - 舞王湿婆
      - 阿帕斯玛拉侏儒
      - 安南达坦达瓦
    genre: myth
    credibility_tier: B
