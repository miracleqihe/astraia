  - id: case_in_vedic_manu_matsya_flood
    title: 古印度吠陀｜摩奴与摩蹉神鱼的大洪水神话
    aliases:
      - Matsya and Manu
      - 百道梵书洪水神话
      - 摩蹉鱼化身
      - Shatapatha Brahmana
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 29.9695
      lng: 76.8783
      precision: culture_region
      location_name: 印度哈里亚纳邦 · 俱卢之野（晚期吠陀文献形成文化带）
      culture_region: 南亚 · 古印度吠陀与往世书传统
    location_note: 《百道梵书》成书于恒河上游及俱卢之野一带的晚期吠陀婆罗门学派，此坐标作印度古文献生成地域参考。
    paragraphs:
      - 现存最早的古印度大洪水记述见于晚期吠陀散文经典《百道梵书》（第一编第八章第一节）：人类始祖摩奴清晨取水净手时，掌中忽然落入一条极小的鱼。小鱼开口请求收留，许诺日后洪涛淹天时必报救命之恩。摩奴依言先以陶瓮蓄养，继而随鱼身暴涨将其移入深池，最终送归大海；神鱼临别时预告洪灾将至的精确年岁，嘱他造大舟备行。
      - 大水如期涌起淹没世间一切生灵时，摩奴独乘木舟航行其上；神鱼游回船侧，摩奴遂用长绳将船缆系于鱼头独角，由神鱼牵引船只平稳度过汹涌巨浪，直抵北方巍峨群峰之巅（后世称“摩奴坠舟处”）。洪水渐退后，摩奴依神鱼指引循水际下山，独自献上酥油与乳酪祭品，竟从祭仪泡沫中生出一女子名为“依达”（Ida），二人遂成为洪水后人类的新始祖。
      - 后世《摩诃婆罗多》与《往世书》将救世神鱼确认为毗湿奴十大化身之首“摩蹉”（Matsya），并将随舟同行者扩充为携带着药草、五谷种子及七仙人的救赎船队。将《百道梵书》素朴的祭仪起源叙事与两河流域乌特纳比什提姆泥板对照，可清晰识别跨地域大洪水母题在南亚祭祀神学中的独特重构。
    sources:
      - citation: 'Internet Sacred Text Archive, Julius Eggeling (trans.), "Satapatha Brahmana, Part I (SBE 12): Adhyaya VIII, Brahmana 1 (Manu and the Fish)".'
