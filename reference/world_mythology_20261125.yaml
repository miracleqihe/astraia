      label: 梵书祭仪与经典谱系增补
      rationale: 对比早期《百道梵书》摩奴独舟与后期《往世书》七仙人版本的差异，思考宗教经典如何不断增补神学解释。

  - id: case_in_katha_nachiketa_yama
    title: 古印度奥义书｜那奇凯塔向死神阎摩问道的生死对话
    aliases:
      - Nachiketa and Yama
      - 卡塔奥义书
      - 阎摩三愿
      - Katha Upanishad
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 25.3176
      lng: 83.0058
      precision: culture_region
      location_name: 印度北印度 · 恒河流域奥义书传习区（瓦拉纳西参考）
      culture_region: 南亚 · 古印度吠陀与往世书传统
    location_note: 《卡塔奥义书》由黑夜柔吠陀伽陀学派口传定型于北印度，此处用北印度宗教学术重镇作文献文化圈参考。
    paragraphs:
      - 《卡塔奥义书》开篇借一则极具戏剧性的父子冲突引出冥界访道：婆罗门瓦加什拉瓦萨举办献出全部家产的祭祀，却仅将衰老无乳的病牛作为布施。耿直的少年那奇凯塔三度追问父亲“究竟将我献给谁”，激怒之下父亲脱口怒喝“我把你献给死神”。少年恪守父言孤身赴阎摩殿报到，适逢死神外出三日，饿着肚子枯守门前。
      - 阎摩归来惊见婆罗门童子三夜未受款待，深感失礼，遂许下三个愿望以示赔罪。那奇凯塔首愿祈求父亲消怒复归和睦，次愿求教通往天界不惧饥渴的天火祭法；及至第三愿，少年直问“人死之后，有人言其尚存，有人言其归于无，唯愿闻知真实究竟”。阎摩百般推辞，愿以长寿子孙、黄金疆土与天女乐舞代换此问，少年皆不为所动。
      - 面对顽强求真的问者，死神阎摩终肯开示著名的“胜善（shreyas）与可喜（preyas）”之辨，并将身体比作马车、感官比作骏马、理智比作御者，阐发不生不灭之“大我”（Ātman）教义。从早期《鹧鸪氏梵书》的祭火故事演进至《卡塔奥义书》的哲学寓言，此文本是印度神话叙事向抽象形而上学转化的典范，应当置于古代宗教哲学语境中细读。
    sources:
      - citation: 'Internet Sacred Text Archive, F. Max Müller (trans.), "The Upanishads, Part II (SBE 15): Katha-Upanishad".'
        type: primary_text
        url: 'https://www.sacred-texts.com/hin/sbe15/sbe15020.htm'
        locator: 《卡塔奥义书》第一品那奇凯塔赴死神居所与三愿段落
      - citation: Encyclopaedia Britannica, "Upanishad".
        type: encyclopedia
        url: 'https://www.britannica.com/topic/Upanishad'
        locator: 奥义书谱系与从吠陀祭仪向自我（Atman）哲学的转变
    compare: [case_gr_thrace_orpheus_underworld, case_eg_thebes_weighing_heart, corpus_theme_between_life_death]
    motifs: [index_berezkin_h12, index_berezkin_k27r]
