        url: 'https://www.britannica.com/topic/Slavic-religion'
        locator: 佩伦与维列斯二元宇宙结构及东斯拉夫史料有限性说明
      - citation: UNESCO World Heritage Centre, "Historic Monuments of Novgorod and Surroundings (WHC List 604)".
        type: official_archive
        url: 'https://whc.unesco.org/en/list/604'
        locator: 大诺夫哥罗德历史建筑群与沃尔霍夫河流域早期聚落遗产档案
