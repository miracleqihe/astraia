  - id: case_iq_sumer_inanna_underworld
    title: 美索不达米亚｜伊南娜下冥界与七道门神话
    aliases:
      - Inana's Descent to the Nether World
      - 伊南娜下冥府
      - 伊什塔尔冥界之旅
      - 杜木兹替身神话
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 31.3222
      lng: 45.6361
      precision: city
      location_name: 伊拉克穆萨纳省 · 乌鲁克古城遗址（Warka）
      culture_region: 中东与西亚 · 两河流域（美索不达米亚）
    location_note: 乌鲁克是伊南娜主神庙所在城邦及早期楔形文字泥板出土重镇，此坐标作为苏美尔文学传统的地区参考点，并非冥界入口的现实位置。
    paragraphs:
      - 在苏美尔长诗《伊南娜下冥界》中，掌管丰饶与战事的女神伊南娜决定前往姐姐埃列什基伽勒统治的“不归之地”。动身前，她叮嘱随从宁舒布尔，若三日未归便遍访诸神坛庙求援。踏入冥界七重门时，守门者内提要求她每过一门卸下一件权杖、王冠或服饰，直至她赤身站在冥界七位裁判神面前，遭死亡凝视击毙，尸身被悬于钩上。
      - 宁舒布尔依约向恩利尔、南纳求救均遭婉拒，唯有智慧与深水之神恩基从指甲缝里的泥垢捏出两位不属阴阳秩序的使者库尔加拉与卡拉图尔，携生命之水与生命之草潜入冥界，借共情埃列什基伽勒的苦痛换取尸身并令伊南娜复生。然而冥界律法规定离去者须留替身；伊南娜见丈夫牧神杜木兹非但未穿丧服反高坐华座，遂令冥府鬼卒将其拘走，最终改为杜木兹与姐姐格什提南娜各在冥界值守半年。
      - 牛津大学苏美尔文学电子语料库（ETCSL c.1.4.1）收录了来自尼普尔、乌尔等地多块古巴比伦时期泥板的合校本，后期阿卡德语《伊什塔尔下冥界》亦保留了相近骨架但删略了替身细节。学界常将此诗与两河农牧季节交替及王权葬仪对照阅读，但不应将楔形文字宗教诗篇直接等同于可证实的客观自然现象或冥界经验。
    sources:
      - citation: Electronic Text Corpus of Sumerian Literature (ETCSL), University of Oxford, "Inana's descent to the nether world" (c.1.4.1).
        type: primary_text
        url: 'https://etcsl.orinst.ox.ac.uk/section1/tr141.htm'
        locator: 苏美尔语合校英译本第 1 至 412 行（七道门、恩基造使者与杜木兹替身）
      - citation: Encyclopaedia Britannica, "Ishtar" (Inanna and Descent to the Underworld).
        type: encyclopedia
        url: 'https://www.britannica.com/topic/Ishtar'
        locator: 伊南娜/伊什塔尔神格及苏美尔—阿卡德冥界文本传统
    compare: [case_gr_eleusis_persephone_cycle, case_jp_izumo_izanagi_yomi, corpus_theme_between_life_death]
    motifs: [index_berezkin_h12, index_berezkin_k27r]
    bridge:
      entry: SCR-1-0003
      cluster: sid_myth
      trail: all
      label: 泥板诗篇与楔形文字载体
      rationale: 将苏美尔女神下冥界的文学结构与早期楔形文字泥板的书写、校勘语境并读，辨认文本流传的物质基础。

  - id: case_iq_uruk_gilgamesh_flood
    title: 美索不达米亚｜吉尔伽美什与大洪水泥板神话
    aliases:
      - Epic of Gilgamesh Tablet XI
      - 乌特纳比什提姆
      - 济乌苏德拉洪水神话
      - Flood Tablet K.3375
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 31.3222
      lng: 45.6361
      precision: city
      location_name: 伊拉克 · 乌鲁克古城（叙事核心城邦）
      culture_region: 中东与西亚 · 两河流域（美索不达米亚）
    location_note: 乌鲁克是史诗主人公吉尔伽美什传说统治的城邦；最完整的第十一泥板大洪水文献则出土于亚述首都尼尼微王室图书馆。
    paragraphs:
      - 挚友恩奇都死后，乌鲁克王吉尔伽美什因畏惧死亡而长途跋涉至世界边缘，寻访唯一逃过劫难、获赐永生的先祖乌特纳比什提姆。对方道出大洪水往事：诸神议决降下灭世洪涛，唯有恩基（埃阿）隔着舒鲁帕克的芦苇墙暗中传谕，命他拆毁屋宇建造边长相等的巨舟，携家人、工匠与百兽种子登船避难。
      - 暴风狂雨席卷天地六日七夜，连诸神也惊惧退避天界。船只搁浅在尼西尔山后，乌特纳比什提姆先后放出鸽子、燕子与乌鸦试探水势，见乌鸦不再飞回，遂出舱向风祭献；诸神聚于祭烟之上，恩利尔虽初怒后缓，仍抚额祝福夫妻二人如神般长生。随后吉尔伽美什在“七夜不眠”的考验中沉睡失败，潜入深海采得的返老还童仙草又被蛇吞食，只得空手返归乌鲁克城墙。
      - 大英博物馆藏泥板 K.3375（公元前 7 世纪亚述巴尼拔图书馆藏本）于 1872 年被乔治·史密斯破译，并与更早的苏美尔《洪水故事》（ETCSL c.1.7.4，主人公称济乌苏德拉）及《阿特拉哈西斯》一脉相承。考古学上美索不达米亚确有多期区域性河泛淤积层，但泥板所载全球性灭世洪水属于古老神学与文学母题，不可把神话叙事直接用作单一地质灾变的实证。
    sources:
      - citation: The British Museum, "The Flood Tablet (K.3375), Epic of Gilgamesh Tablet XI".
        type: archival_catalogue
        url: 'https://www.britishmuseum.org/collection/object/W_K-3375'
        locator: 尼尼微出土新亚述时期黏土泥板藏品 K.3375 馆藏记录
      - citation: Electronic Text Corpus of Sumerian Literature (ETCSL), University of Oxford, "The flood story" (c.1.7.4).
        type: primary_text
        url: 'https://etcsl.orinst.ox.ac.uk/section1/tr174.htm'
        locator: 苏美尔语济乌苏德拉洪水叙事片段英译本
      - citation: Encyclopaedia Britannica, "Gilgamesh".
        type: encyclopedia
        url: 'https://www.britannica.com/topic/Gilgamesh'
        locator: 史诗流传谱系与第十一泥板大洪水比较
    compare: [case_in_vedic_manu_matsya_flood, case_iq_eridu_adapa_wind]
    motifs: [index_berezkin_c2, index_berezkin_c3]
    bridge:
      entry: HIS-4-0001
      cluster: sid_myth
      trail: all
      label: 洪水叙事与冲积地层边界
      rationale: 把两河大洪水泥板传统与考古地层判读并置，明确文学母题、局部河患沉积与历史定年各自的证据边界。

  - id: case_iq_babylon_enuma_elish
    title: 美索不达米亚｜巴比伦《埃努玛·埃利什》创世神话
    aliases:
      - Enuma Elish
      - 当高天之上
      - 马尔杜克与提阿玛特
      - Seven Tablets of Creation
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 32.5364
      lng: 44.4208
      precision: city
      location_name: 伊拉克巴比伦省 · 巴比伦古城遗址
      culture_region: 中东与西亚 · 两河流域（美索不达米亚）
    location_note: 巴比伦城是史诗主神马尔杜克与埃萨吉拉神庙的礼仪中心，现存七块泥板抄本则出土于尼尼微、阿述尔及巴比伦多地。
    paragraphs:
      - 《埃努玛·埃利什》以天地未名之初开篇：唯有淡水之神阿普苏与咸水混沌提阿玛特混融一体。新生诸神喧闹不休，阿普苏欲加诛灭，却反被智慧之神埃阿施咒安眠并击杀。暴怒的提阿玛特遂缔造十一种毒龙怪兽复仇，诸神无力迎战，最终推举埃阿之子、巴比伦主神马尔杜克担任统帅，赋予其至高无上的神权。
      - 马尔杜克携风暴、雷霆与巨网迎战，趁提阿玛特张口吞噬之际驱使恶风灌入其腹，一箭洞穿其心，再将庞大躯壳劈作两半：一半支起苍穹挡住天水，一半铺作大地与深渊，又以其眼窝涌出幼发拉底河与底格里斯河，设定日月星辰与历法秩序。随后他取叛神金古之血混合泥土塑造人类，令人承担劳役以奉养神祇，诸神则在巴比伦为他筑起埃萨吉拉神庙。
      - 这部七板阿卡德语长诗每年在巴比伦新年阿基图节（Akitu）上由大祭司诵读，是宗教宇宙观与城市神权合法性的礼仪文本，大英博物馆藏有多块亚述巴尼拔图书馆及新巴比伦时期残片。将神战劈分混沌的叙事与各地域“原初之水”创世诗并读，可以清楚看到政治中心转移如何改写古老神谱。
    sources:
      - citation: The British Museum, "Cuneiform tablet with part of the Babylonian Creation Myth (Enuma Elish)".
        type: archival_catalogue
        url: 'https://www.britishmuseum.org/collection/object/W_1888-0419-13'
        locator: 大英博物馆藏巴比伦创世史诗楔形文字泥板残片 1888,0419.13
      - citation: Encyclopaedia Britannica, "Enuma elish".
        type: encyclopedia
        url: 'https://www.britannica.com/topic/Enuma-elish'
        locator: 七块泥板结构、马尔杜克登极与新年祭仪背景
      - citation: Internet Sacred Text Archive, L. W. King (trans.), "The Seven Tablets of Creation (Enuma Elish)".
        type: primary_text
        url: 'https://www.sacred-texts.com/ane/enuma.htm'
        locator: 第一至第七泥板英译全文
    compare: [corpus_theme_creation_worlds, case_b3a_yoruba_waters, case_in_purana_samudra_manthana]
    motifs: [index_berezkin_b3a, index_berezkin_i44]
    bridge:
      entry: REL-6-0001
      cluster: sid_myth
      trail: all
      label: 创世史诗与城市祭仪秩序
      rationale: 以《埃努玛·埃利什》与新年祭仪的绑定为例，从比较宗教方法观察宇宙叙事如何依托具体历史与政教结构展开。

  - id: case_iq_eridu_adapa_wind
    title: 美索不达米亚｜埃里都智者阿达帕与南风折翼神话
    aliases:
      - Adapa and the South Wind
      - 阿达帕神话
      - 生命之食
      - 阿马尔纳泥板 EA 356
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 30.8158
      lng: 45.9961
      precision: city
      location_name: 伊拉克济加尔省 · 埃里都古城遗址（Tell Abu Shahrain）
      culture_region: 中东与西亚 · 两河流域（美索不达米亚）
    location_note: 埃里都是两河传统中最早的圣城与恩基主庙所在地；核心泥板残片则保存于埃及阿马尔纳外交档案与尼尼微遗址。
    paragraphs:
      - 埃里都的祭司兼圣贤阿达帕受深水之神恩基（埃阿）赐予极高智慧，唯独未得永生。一日他乘舟出海捕鱼供奉神庙，却遭凶猛的南风倾覆小船，跌入海中；阿达帕怒极咒语出口，竟将南风的双翼折断，致使七日间无风拂面、大地闷热难耐。天神阿努察觉异状后派使者传唤这位凡人登天问罪。
      - 临行前恩基设下叮嘱：阿达帕应身着丧服赴天庭，向守门神杜木兹与宁吉什济达致哀博取同情，但切忌饮用天父阿努赐下的饮食，因其或为“死亡之水食”。不料诸神见其谦卑遂心生怜惜，阿努转而端出能令凡人成神的“生命之面包与生命之水”；阿达帕谨遵恩基告诫婉拒进食，阿努只得大笑令其返回人间，凡人遂永远错失长生。
      - 该故事目前仅存阿卡德语写本，最著名的一块出土于公元前 14 世纪埃及阿马尔纳（EA 356），疑作外交书吏学习阿卡德语的范本，另有尼尼微藏本补充后续。关于恩基究竟有意剥夺凡人永生还是保护爱徒避免天庭诡计，学界尚无定论，正显示了神谕多义性与阿卡德智慧文学的张力。
    sources:
      - citation: Encyclopaedia Britannica, "Adapa".
        type: encyclopedia
        url: 'https://www.britannica.com/topic/Adapa'
        locator: 阿达帕折断南风之翼、天庭拒绝生命之食及阿马尔纳泥板综述
      - citation: Internet Sacred Text Archive, R. W. Rogers (trans.), "Adapa and the Food of Life".
        type: primary_text
        url: 'https://www.sacred-texts.com/ane/adapa.htm'
        locator: 泥板残片英译本及埃里都祭司设定
    compare: [case_iq_uruk_gilgamesh_flood, case_gr_caucasus_prometheus_fire]
    motifs: [index_berezkin_m27]
    bridge:
      entry: LIT-2-0004
      cluster: sid_myth
      trail: all
      label: 神谕陷阱与凡人有限性
      rationale: 阅读恩基对阿达帕的矛盾忠告，体会古代叙事如何通过信息不对称安排凡人与永生的擦肩而过。

