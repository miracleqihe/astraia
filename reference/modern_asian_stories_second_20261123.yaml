  title: 泰国丽贝岛｜游客画下的人面蜘蛛
  genre: urban_legend
  credibility_tier: B
  theme: motif_urban_ostension_liminal
  location:
    lat: 6.488
    lng: 99.305
    precision: city
    location_name: 泰国沙敦府 · 丽贝岛参考点
    culture_region: 东南亚 · 泰国
  location_note: 丽贝岛岛屿范围参考点，不标记墓地、住宿地或讲述者住处。
  paragraphs:
  - 一篇 2006 年的地方采访转述丽贝岛上的故事：有游客在住宿处附近看见一只像是长着人脸的大蜘蛛，惊慌之余把所见画下来，拿给当地人辨认。
  - 记者将这段讲述放在岛民对祖先、墓地与旅游开发的叙述中。画作和目击没有得到独立核实；这里保存的是文章中的一次地方转述，不把它当作动物学记录。
  sources:
  - citation: Gordon McEvoy, “Haunted Islands”, Untamed Travel, October 2006.
    type: journalism
    url: https://danielcooper.name/wp-content/uploads/2023/08/Untamed0610.pdf
