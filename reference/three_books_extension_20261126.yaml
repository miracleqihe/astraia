- id: case_cn_dict4_linzhou_bullhorse_banquet
  title: 河南林州｜庙中棋局与添寿
  aliases:
  - 牛头和马面
  genre: folktale
  credibility_tier: B
  location:
    lat: 36.06545
    lng: 113.81547
    precision: city
    location_name: 河南林州
    culture_region: 东亚 · 中国
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。辞典用旧名林县，此处以今林州作参考。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
  paragraphs:
  - 林县的一则传说里，牛大臣听算命人说儿子寿数将尽，依照指点与妻子来到一座庙。他们遇到正在下棋的牛头、马面，带来的饭菜成了请求添寿的契机。
  - 两位阴差吃过饭后答应延长儿子的寿数，也收了纸钱。阎王知道后将他们降为黑无常的下属；故事借阴间差役讲述人情、贿赂和处罚。
  sources:
