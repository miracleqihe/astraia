    culture_region: 东亚 · 中国
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
  paragraphs:
  - 灵璧故事中，卖烧饼的王老伯发现一名女子拿纸钱买饼，便悄悄跟随。女子在一座坟旁消失，那座坟属于王二已故的妻子。
  - 王二得知后带人打开坟墓，发现一个孩子并抱回家。故事说亡妻因失去孩子不断在村中呼喊，王老伯捏了个面人，叫喊声才平息。
