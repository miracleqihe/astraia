- id: case_cn_dict4_cixi_pawn_ghost
  title: 浙江慈溪｜当铺里的会跳葫芦
  aliases:
  - 典当吊死鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.1764
    lng: 121.2457
    precision: city
    location_name: 浙江慈溪
    culture_region: 东亚 · 中国
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
  paragraphs:
  - 灾荒中，张三捉住一只吊死鬼，鬼化成能叫能跳的葫芦。他把葫芦送到当铺换银钱，并将所得分给生活困苦的人。
  - 当铺老板玩弄葫芦时不慎让鬼逃脱，张三早有准备，又向老板索赔，把得到的钱继续分给百姓。辞典用这则奇诡故事写出灾荒与反转。
  sources:
