records:
- id: case_cn_dict4_hangzhou_bao_hell
  title: 浙江杭州｜包公与十殿的调任
  aliases:
  - 包龙图做阎王
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.29365
    lng: 120.16142
    precision: city
    location_name: 浙江杭州
    culture_region: 东亚 · 中国
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
  paragraphs:
  - 杭州流传的故事说，包龙图死后在阴间主持第一殿。他访查冤案，把不该受罚的人放回阳间，做法与其他殿的审判方式大不相同。
  - 其余阎王联名向玉帝告状，他因此被调到第五殿。新职位有名无实，即便看出冤情也难以改变判决；辞典用这个故事解释屈死鬼的出现。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: “当代鬼话”，印页 470（PDF 第 585 页），条目“包龙图做阎王”。本次直接查阅辞典该条目，未另核原始采录材料。
  - citation: 浙江杭州地理参考。
    type: geographic_reference
    url: https://www.geonames.org/1808926/
    locator: 此点表示辞典流传地的行政区域参考，具体范围见地图说明。
  bridge:
    entry: PHI-4-0002
    cluster: sid_liminal
    trail: all
    label: 阴间审判与正义
    rationale: 把阴间审判中的申冤与权力限制，作为分配与正义问题的叙事对读；故事不是制度史事实。
- id: case_cn_dict4_hangzhou_farmer_waterghost
  title: 浙江杭州｜水车边的两次试探
  aliases:
  - 农夫斗水鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.29365
    lng: 120.16142
    precision: city
    location_name: 浙江杭州
    culture_region: 东亚 · 中国
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
  paragraphs:
  - 一名农夫夜里车水时，水中的鬼劝他下水。他识破对方想找替身，拆开水车龙头，令对方的打算落空；次日又阻止一个孩子下水捞伞。
  - 鬼随后往他的田里堆石头报复，农夫反过来骗它清掉石块、丢入旧草鞋等杂物。次年莲子收成很好，故事以一场人鬼之间的机智较量收尾。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: “当代鬼话”，印页 471（PDF 第 586 页），条目“农夫斗水鬼”。本次直接查阅辞典该条目，未另核原始采录材料。
  - citation: 浙江杭州地理参考。
    type: geographic_reference
    url: https://www.geonames.org/1808926/
    locator: 此点表示辞典流传地的行政区域参考，具体范围见地图说明。
  bridge:
    entry: LIT-2-0006
    cluster: sid_liminal
    trail: all
    label: 水塘与田地的故事空间
    rationale: 对读水塘、水车和农田怎样安排角色相遇及反转，不把叙事里的水鬼当作现实水域事实。
- id: case_cn_dict4_hangzhou_peddler_firecracker
  title: 浙江杭州｜货郎与鬼发上的爆竹
  aliases:
  - 人鬼斗法
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.29365
    lng: 120.16142
    precision: city
    location_name: 浙江杭州
    culture_region: 东亚 · 中国
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
  paragraphs:
  - 货郎见一位媳妇打碎了碗，担心她遭丈夫责打，便替她赔了钱。几天后他才知道，媳妇原是鬼准备找的替身；那鬼因此对他十分恼怒。
  - 鬼现出可怖模样，要货郎跟它走。货郎却说要替它梳妆，悄悄把一串爆竹挂到头发上点燃；连串响声使鬼惊慌逃离。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
