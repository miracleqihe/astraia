  - citation: 浙江杭州地理参考。
    type: geographic_reference
    url: https://www.geonames.org/1808926/
    locator: 此点表示辞典流传地的行政区域参考，具体范围见地图说明。
  bridge:
    entry: LIT-2-0001
    cluster: sid_liminal
    trail: all
    label: 反转与机智人物
    rationale: 用叙事角色、转折与结局的角度阅读货郎故事，保持故事本身的虚构语境。
- id: case_cn_dict4_boli_pharmacy_well
  title: 黑龙江勃利｜药房深夜的器物声
  aliases:
  - 井水不把河水犯
  genre: folktale
  credibility_tier: B
  location:
    lat: 45.7529
    lng: 130.58452
    precision: city
    location_name: 黑龙江勃利
    culture_region: 东亚 · 中国
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
  paragraphs:
  - 完达山下的小镇有间药店，经常传出闹鬼的消息。店主把店租给宋先生，他搬进去的第一夜，先后听见称药器具坠地、药臼作响，随后又听到女子哭声。
  - 故事解释，女子是店主的亡妻；宋先生说出“井水不把河水犯”后，动静便停了。辞典把它作为勃利流传的鬼话收录，没有给出可核对的店址。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: “当代鬼话”，印页 483（PDF 第 598 页），条目“井水不把河水犯”。辞典标明转引文彦生《中国鬼话》（上海文艺出版社 1991 年版）；本次未独立核对该书原件。
  - citation: 黑龙江勃利地理参考。
    type: geographic_reference
    url: https://www.geonames.org/2038274/
    locator: 此点表示辞典流传地的行政区域参考，具体范围见地图说明。
  bridge:
    entry: LIT-2-0006
    cluster: sid_liminal
    trail: all
    label: 药房与夜间声响
    rationale: 比较室内器具声如何塑造夜间疑惧，知识对读不把声响解释为已证实的灵异现象。
- id: case_cn_dict4_yangyuan_woman_revenge
  title: 河北阳原｜夜路上的女鬼与报应
  aliases:
  - 罪有应得
  genre: folktale
  credibility_tier: B
  location:
    lat: 40.117
    lng: 114.167
    precision: city
    location_name: 河北阳原
    culture_region: 东亚 · 中国
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
  paragraphs:
  - 阳原流传的故事里，一名常骚扰妇女的男子深夜遇见女子，起了歹意。女子忽然变成吊死鬼的模样；男子用自己知道的办法制住她，并把她带回家。
  - 她在人形与鬼形间反复变化，男子只好请人驱除；当晚男子突然身亡。故事结尾说，女子生前曾受他欺侮而死，此次是来寻仇。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: “当代鬼话”，印页 483（PDF 第 598 页），条目“罪有应得”。辞典标明转引文彦生《中国鬼话》（上海文艺出版社 1991 年版）；本次未独立核对该书原件。
  - citation: 河北阳原地理参考。
    type: geographic_reference
    url: https://en.wikipedia.org/wiki/Yangyuan_County
    locator: 此点表示辞典流传地的行政区域参考，具体范围见地图说明。
  bridge:
    entry: LIT-2-0004
    cluster: sid_liminal
    trail: all
    label: 冤屈与报应的叙事
    rationale: 对读故事如何通过视角和结尾解释先前的暴力与报偿，不将其当作真实案件。
- id: case_cn_dict4_qiandongnan_burial_dream
  title: 贵州黔东南｜墓地、恶梦与冤屈
  aliases:
  - 人鬼仇
  genre: folktale
  credibility_tier: B
  location:
    lat: 26.58583
    lng: 107.97972
    precision: culture_region
    location_name: 贵州黔东南
    culture_region: 东亚 · 中国
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。采用自治州州府凯里作为宽范围代表点；辞典只写“黔东南”，未指明所在县市。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
  paragraphs:
  - 黔东南一则故事讲，一位地主为了给自己选墓地，听从阴阳先生的建议，与管家以欺骗手段掳来两个孩子，将他们活埋，并害死孩子的父母。
  - 此后地主时常梦见遭狗咬、被鹰啄，管家的脚伤也不断恶化。故事把两人最终死亡写作受害者冤魂的报复；辞典仅标明故事流传于黔东南。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
