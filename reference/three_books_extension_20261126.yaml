- id: case_cn_dict4_lingbi_flatbread_ghost
  title: 安徽灵璧｜烧饼铺的纸钱
  aliases:
  - 鬼骂王庄
  genre: folktale
  credibility_tier: B
  location:
    lat: 33.67861
