- id: case_cn_dict4_zoucheng_yuhong_gate
  title: 山东邹城｜玉红叩问门神
  aliases:
  - 玉红
  genre: folktale
  credibility_tier: B
  location:
    lat: 35.40056
    lng: 116.96556
    precision: city
    location_name: 山东邹城
    culture_region: 东亚 · 中国
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。辞典用旧名邹县，此处以今邹城作参考。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
  paragraphs:
  - 邹县故事中的玉红被豪绅害死，父母求告无门。她向阴间申冤后，奉命去找害她的人，却先被宅门上的两位门神挡在门外。
  - 玉红向门神说明遭遇，秦琼同意放行，尉迟恭也最终让开。她进入宅院带走仇人的魂魄；故事用门神的犹豫与选择表现对冤情的判断。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
