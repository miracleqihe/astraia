- id: case_id_banjarmasin_bank_guard_double
  title: 班贾尔马辛银行｜没有离岗的同事
  genre: memorate
  credibility_tier: A
  theme: corpus_id_banjarmasin_nasrullah_2018
  location:
    lat: -3.3194
    lng: 114.5908
    precision: city
    location_name: 印尼班贾尔马辛 · 城市参考点
    culture_region: 东南亚 · 印度尼西亚
  location_note: 原文没有给出可公开定位的银行地址，地图使用城市参考点。
  paragraphs:
  - 银行有两名警卫值夜，一人到后方休息时，看见像同事的人也在那里。他叫了对方，对方却没有回应。
  - 后来他问起这件事，同事说自己一直留在前面，从未到过后方。2018 年论文记录的是一位技术人员转述的警卫故事；双重身份是当事人给出的解释。
  sources:
  - *id004
  reading_kind: report
