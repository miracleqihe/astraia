themes:
- id: corpus_cn_beijing_ghostlore_solovyova_2019
  title: 北京城市鬼故事｜日常空间中的讲述
  genre: academic_model
  peers:
  - case_cn_beijing_dormitory_window_eyes
  - case_cn_beijing_school_wheelchair
  - case_cn_beijing_ghost_bus
  - text_cn_ma_xingyu_campus_horror_2016
  paragraphs:
  - 民俗研究者 Alevtina Solovyova 根据北京的访谈，将宿舍、学校、夜路与公园里的故事放在一起阅读。有人说自己在湖边见到异样身影，也有人讲祖辈如何对待黄鼠狼；同一座城市里，传统观念与现代生活并行。
  - 这些记述最有价值的地方，是保留谁在何时讲了什么，以及亲友如何解释。它们与末班车、宿舍窗户和校园轮椅声并列，呈现故事在私人经历与共同传闻之间如何流动。
  sources:
  - &id001
    citation: Alevtina Solovyova, “Ghostlore of Contemporary Beijing”, 2019。
    url: https://www.academia.edu/61013635/Ghostlore_of_Contemporary_Beijing
    locator: 第 275—284 页，2012—2016 年访谈
- id: corpus_seasia_airport_ferguson_2014
  title: 机场里的故事｜航站楼、飞机与守护仪式
  genre: academic_model
  peers:
  - text_cn_ma_xingyu_campus_horror_2016
  paragraphs:
  - 人类学者 Jane Ferguson 在曼德勒、仰光和曼谷机场记录员工的故事：有人说入境柜台前有一位旁人看不见的男子；塔台工作人员转述过驾驶舱的异常；也有员工在平安出行后到神龛献上鸡蛋。
  - 研究把机场视为工作的地方：安全、赶航班、危险记忆与地方信仰在此相遇。相似故事可以并读，不能因此断定彼此传播，或把个人解释当作事故原因。
  sources:
  - &id002
    citation: Jane M. Ferguson, “Terminally Haunted”, The Asia Pacific Journal of Anthropology 15(1), 2014, 47–64。
    url: https://www.academia.edu/5974036/Terminally_Haunted_Aviation_Ghosts_Hybrid_Buddhist_Practices_and_Disaster_Aversion_Strategies_Amongst_Airport_Workers_in_Myanmar_and_Thailand
    locator: 第 53—61 页，机场员工访谈与参与观察
    doi: 10.1080/14442213.2013.872698
- id: corpus_mm_yangon_ghostlore_long_2014
  title: 仰光的夜间传闻｜校舍与办公室
  genre: academic_model
  peers:
  - text_cn_ma_xingyu_campus_horror_2016
  - corpus_seasia_airport_ferguson_2014
  paragraphs:
  - 2014 年，《缅甸时报》采访仰光居民和校友，整理他们记住的办公室见闻与寄宿学校故事。干燥的浴室、空房里的乒乓球声，以及深夜绕着桌子移动的鞋声，都是在熟悉环境里突然出现的不协调细节。
  - 报道同时区分本人讲述与高年级学生转述的校园传说。将其与中国和日本的学校故事并读，可以看见不同城市如何用相似的空间叙述恐惧。
  sources:
  - &id003
    citation: Douglas Long, “Ghosts are everywhere in Myanmar”, The Myanmar Times, 2014 年 10 月 27 日—11 月 2 日。
    url: https://uzo.sakura.ne.jp/burma/mmt/mmt_data/mmt_2014/mmt_10_2014/mmt_752-05_10_2014.pdf
    locator: 报纸第 48—50 页，仰光居民与校友访谈
- id: corpus_id_banjarmasin_nasrullah_2018
  title: 班贾尔马辛｜商场与工作场所的鬼故事
  genre: academic_model
  peers:
  - corpus_seasia_airport_ferguson_2014
  paragraphs:
  - Nasrullah 于 2018 年发表的研究记录印尼班贾尔马辛的城市鬼故事。受访者提到商场监控里坐着的长发女子，也转述夜班警卫在银行看见同事，却得知同事从未离开岗位。
  - 论文保留的是受访者与旁人的解释，监控影像及故事中的超自然解释并未由研究者独立证实。将办公室、商场和机场并读，可看到故事如何进入现代工作场所。
  sources:
  - &id004
    citation: Nasrullah, “Hantu di Tengah Keramaian Kota Banjarmasin”, Khazanah 16(1), 2018, 23–48。
    url: https://jurnal.uin-antasari.ac.id/index.php/khazanah/article/download/2154/1619
    locator: 第 33—36 页，商场员工和警卫的讲述
    doi: 10.18592/khazanah.v16i1.2154
- id: corpus_la_tappe_ghosts_war_business
  title: 老挝的两段田野｜战争记忆与城市生意
  genre: academic_model
  peers:
  - corpus_seasia_airport_ferguson_2014
  paragraphs:
  - 人类学者 Oliver Tappe 记录一位老挝朋友的两段经历：在川圹省经过爆炸现场之后，他在夜里看见身影，想到多年前身亡的兄弟；几年后，他又在万象为生意上的不顺寻求仪式帮助。
  - 同一个人的叙述把战争留下的伤痛、家人的记忆和城市生活连接起来。研究呈现的是讲述者的理解与研究者的观察，不把仪式与后来际遇之间的关系写成已证明的因果。
  sources:
  - &id005
    citation: 'Oliver Tappe, “Bombs and Business: Interactions with Spirits in Laos”, Global Modernities and the (Re-)Emergence of Ghosts。'
    url: https://www.academia.edu/117514071/Global_Modernities_and_the_Re_Emergence_of_Ghosts
    locator: 〈Bombs and Business〉，2010 年川圹省与 2014 年万象田野叙述
records:
- id: case_cn_beijing_beihai_water_figure_2016
  title: 北京北海｜湖边慢慢移动的身影
  genre: memorate
  credibility_tier: A
  theme: corpus_cn_beijing_ghostlore_solovyova_2019
  location:
    lat: 39.925
    lng: 116.389
    precision: city
    location_name: 中国北京 · 北海公园参考点
    culture_region: 中国 · 华北
  location_note: 点位取北海公园公共区域的参考坐标；访谈没有指明具体岸边。
  paragraphs:
  - 一位受访者回忆，自己在北海散步时，看见水边有个动作缓慢、说不清年龄和性别的身影。对方望了过来，随后跳入水中，不见了。
  - 他害怕地打电话给朋友，猜测自己遇见了水鬼。朋友们的反应各不相同：有人建议他看医生，有人建议去寺庙问问。研究者于 2016 年记录了这段自述，故事发生的确切日期没有交代。
  sources:
  - *id001
  reading_kind: report
- id: case_cn_beijing_weasel_grandfather_2012
  title: 北京院子｜祖父骂走的黄鼠狼
  genre: memorate
  credibility_tier: A
  theme: corpus_cn_beijing_ghostlore_solovyova_2019
  location:
    lat: 39.9042
    lng: 116.4074
    precision: city
    location_name: 中国北京 · 城市参考点
    culture_region: 中国 · 华北
  location_note: 访谈未提供住址，地图使用北京城市参考点。
  paragraphs:
  - 一位北京受访者说，长辈相信黄鼠狼夜里会发出像孩子哭泣一样的声音，还会拿走小东西。遇到它，家里人要出去大声喝骂。
  - 他记得祖父曾经跑出去这样做，之后它就没有再来。研究者在 2012 年记录了这段家族回忆；故事保留的是讲述者对动物和家宅的民间观念。
  sources:
  - *id001
  reading_kind: report
- id: case_cn_beijing_school_pool_decorations_2014
  title: 北京校园｜节庆装饰与泳池传闻
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_beijing_ghostlore_solovyova_2019
  location:
    lat: 39.9042
    lng: 116.4074
    precision: city
    location_name: 中国北京 · 城市参考点
    culture_region: 中国 · 华北
  location_note: 讲述者没有记住学校名称，地图只定位到北京。
  paragraphs:
  - 一位受访者讲过一则学校传闻：校园为庆祝活动挂上传统装饰，之后学生开始议论听到和看到奇怪的东西。故事又说，一名男孩在泳池遇险，被救上来时腿上留下了痕迹。
  - 传闻把这些事与装饰的使用联系起来，还说校方后来请人处理。2014 年的访谈保留了讲述者从报纸听来的版本，学校和具体事件均未在文中核定。
  sources:
  - *id001
- id: case_cn_shanghai_abandoned_school_exploration_2012
  title: 上海｜凌晨三点的废校传闻
  genre: memorate
  credibility_tier: B
  theme: text_cn_ma_xingyu_campus_horror_2016
  location:
    lat: 31.2304
    lng: 121.4737
    precision: city
    location_name: 中国上海 · 城市参考点
    culture_region: 中国 · 华东
  location_note: 报道描述上海一处旧校附近的聚集；地图使用城市参考点，旧建筑现状未核定。
  paragraphs:
  - 2012 年，上海年轻人之间流传一所废弃学校在凌晨三点会发生怪事。学生从网上看见帖子，又听同伴说有人拍到了照片，于是相约到现场。
  - 记者记录到百余人在傍晚聚集，门卫则说最近常有人翻墙、敲门和砸窗。报道没有找到传说的可靠起点；它记录了一个故事如何从网络进入真实的城市生活。
  sources:
  - citation: 程怡、周柏伊：〈听传说找刺激，废弃地成探险园〉，《新闻晚报》，2012 年 11 月 7 日。
    url: https://news.sina.com.cn/o/2012-11-07/140025529737.shtml
    locator: 记者现场观察及门卫、参加者访谈
  reading_kind: report
- id: case_mm_mandalay_airport_invisible_man
  title: 曼德勒机场｜柜台前只有一人看见的旅客
  genre: memorate
  credibility_tier: A
  theme: corpus_seasia_airport_ferguson_2014
  location:
    lat: 21.9588
    lng: 96.0891
    precision: city
    location_name: 缅甸曼德勒 · 城市参考点
    culture_region: 东南亚 · 缅甸
  location_note: 原访谈指曼德勒机场入境区域；为避免把未知柜台当作确切点位，使用曼德勒城市参考点。
  paragraphs:
  - 机场员工 Ma Khin 说，她和同事在入境柜台附近工作时，看到一个男人站在旁边看着她。她向他示意，对方也点了点头；同事却问她在向谁打招呼。
  - 她认为自己看见了当地所谓的 thayay，并在工作文件夹里放了一份经文。人类学者 Ferguson 将这段口述收入 2014 年的机场研究，原文没有交代具体日期。
  sources:
  - *id002
  reading_kind: report
- id: case_mm_yangon_airport_autostart
  title: 仰光机场｜进入驾驶舱前已启动的装置
  genre: memorate
  credibility_tier: A
  theme: corpus_seasia_airport_ferguson_2014
  location:
    lat: 16.8409
    lng: 96.1735
    precision: city
    location_name: 缅甸仰光 · 城市参考点
    culture_region: 东南亚 · 缅甸
  location_note: 访谈发生在仰光机场工作环境；航班与机位不详，地图使用仰光城市参考点。
  paragraphs:
  - 仰光机场的一位塔台工作人员向研究者转述，两次有飞行员进入驾驶舱时，发现自动启动装置已经处于开启状态，而他们说自己还没有碰过仪表。
  - 原文记载，两次航班后来都按计划完成。研究者把它作为机场员工讲述的一则异常经历，并未提供可独立核验的航班记录或技术故障结论。
  sources:
  - *id002
  reading_kind: report
- id: case_th_bangkok_airport_column
  title: 曼谷机场｜海关大厅的柱子
  genre: urban_legend
  credibility_tier: A
  theme: corpus_seasia_airport_ferguson_2014
  location:
    lat: 13.69
    lng: 100.7501
    precision: city
    location_name: 泰国曼谷 · 素万那普机场参考点
    culture_region: 东南亚 · 泰国
  location_note: 点位是素万那普机场公共区域参考坐标，不标示海关内部柱子的实际位置。
  paragraphs:
  - 素万那普机场员工之间流传，一根混凝土柱子与一位施工时遇难的缅甸女工有关。夜班人员有人声称在附近见过长发女子，后来也有人在柱旁留下供品。
  - 这是一则关于施工与夜班见闻的地方传闻。受访的海关负责人说自己没有见过那个身影；人类学论文没有独立证实传说中的死亡经过。
  sources:
  - *id002
- id: case_th_bangkok_airport_hundred_eggs
  title: 曼谷机场｜平安归来的百枚鸡蛋
  genre: memorate
  credibility_tier: A
  theme: corpus_seasia_airport_ferguson_2014
  location:
    lat: 13.69
    lng: 100.7501
    precision: city
    location_name: 泰国曼谷 · 素万那普机场参考点
    culture_region: 东南亚 · 泰国
  location_note: 神龛位于机场工作人员活动区域；地图只给出机场公共参考点。
  paragraphs:
  - 一名机场员工出行前向守护神许愿，希望旅途顺利。回来后，他带着朋友走到员工食堂附近的神龛，摆出一百枚鸡蛋，履行自己的承诺。
  - 研究者在现场观察到这次仪式，也听见同伴提醒朋友尊重他人的信仰。与机场里的惊险传闻相比，这是同一工作空间里更日常的一种守护习俗。
  sources:
  - *id002
  reading_kind: report
- id: case_mm_yangon_latha_dry_shower
  title: 仰光校园｜凌晨三点仍然干燥的浴室
  genre: urban_legend
  credibility_tier: A
  theme: corpus_mm_yangon_ghostlore_long_2014
  location:
    lat: 16.8409
    lng: 96.1735
    precision: city
    location_name: 缅甸仰光 · 拉达区城市参考点
    culture_region: 东南亚 · 缅甸
  location_note: 采访提及拉达区一所学校；点位为仰光城市参考点，不指向浴室。
  paragraphs:
  - 仰光一所寄宿学校的旧生记得，新生会从高年级学生那里听到一个故事：凌晨三点，浴室传出淋浴的水声；有人循声去看，隔间却完全干着。
  - 她在 1970 年入学时就听说过这个故事。另一位约在 1980 年就读的校友也记得相似版本；到那时，学校已不再允许学生留宿。两人的回忆由《缅甸时报》于 2014 年刊出。
  sources:
  - *id003
- id: case_mm_yangon_latha_pingpong
  title: 仰光校园｜空房里滚出的乒乓球
  genre: urban_legend
  credibility_tier: A
  theme: corpus_mm_yangon_ghostlore_long_2014
  location:
    lat: 16.8409
    lng: 96.1735
    precision: city
    location_name: 缅甸仰光 · 拉达区城市参考点
    culture_region: 东南亚 · 缅甸
  location_note: 地点为拉达区学校传闻；地图使用仰光城市参考点。
  paragraphs:
  - 夜里，学校值夜的人听见空房间里传来乒乓球弹跳的声音。她走进去，看见球慢慢停下，便用手帕把它捡起来；隔着手帕，东西却有些温热。
  - 她打开手帕，发现里面并不是乒乓球。这则带有惊悚结尾的校园故事由旧生转述，2014 年刊出的报道说明，它在 1970 年前后已经流传。
  sources:
  - *id003
- id: case_mm_yangon_office_yellow_woman
  title: 仰光办公室｜窗边穿黄衣的女子
  genre: memorate
  credibility_tier: A
  theme: corpus_mm_yangon_ghostlore_long_2014
  location:
    lat: 16.8409
    lng: 96.1735
    precision: city
    location_name: 缅甸仰光 · 城市参考点
    culture_region: 东南亚 · 缅甸
  location_note: 采访没有公开办公室地址，地图使用仰光城市参考点。
  paragraphs:
  - 一位杂志编辑来到办公室，隔着窗看见一个穿黄色传统服装的女子坐在桌边。门却从外面锁着，照她的理解，同事们都还没有到。
  - 她再往里面看时，那个身影已经不见了。她在 2014 年的采访中谈到这次经历，也说自己更害怕活人；报道没有留下足以核对现场的地址。
