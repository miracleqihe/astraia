  geo_sources: *id002
  paragraphs:
  - 一个砍柴人进山时看两位老人下棋，看完一局才动身回家。老人用树枝变出马和鞍，叮嘱他若家里人不认识他，就回来找他们。
  - 回到家后，他才发现已过了好几代，家人把他说成骗子。他离开后，马和鞍化成两棵柏树，长大后交合如门，便有了柏树台门的故事。
- id: case_cn_yuhuan_2008_p052
