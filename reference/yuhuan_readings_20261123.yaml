  geo_sources: *id001
  paragraphs:
  - 坎门渔家少年养了一条小蜈蚣，给它取名“一条龙”。后山的毒蛇因争食受伤，趁父子熟睡时潜入屋内，蜈蚣及时出来抵挡，与蛇同归于尽。
  - 少年记念它救了家人，用彩布做成蜈蚣形的旗子，挂到渔船桅杆上。故事说，后来这种旗也成为渔船庆丰收的标记。
- id: case_cn_yuhuan_2008_p059
  original_sha256: 383f9bb83d8a66684534d98eb62f76eddd3dbd286f59805af02359c1372074e5
