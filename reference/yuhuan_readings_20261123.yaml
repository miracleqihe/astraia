    citation: OpenStreetMap，大麦屿街道地名参考。
    type: map_reference
    url: https://mapcarta.com/N4556057068
    locator: 大麦屿地区参考点：28.09654, 121.16279
  paragraphs:
  - 东海龙王掀起风浪，许多岛屿被淹没。传说一条大鲳鱼为了让人们有安身处，化成一座平稳的岛，后来住上了渔家。
  - 鱼担心自己一激动岛就会摇晃，便用长索把尾鳍系在对岸山头。人们从海上望去，岛像一粒麦子，连接处像麦芒，于是有了大麦屿的名字。
- id: case_cn_yuhuan_2008_p036
  original_sha256: b021636c380bca3cb5a05ea8efb041c2ea4cf9989ff3dc4d5a7baf4cddfe6990
