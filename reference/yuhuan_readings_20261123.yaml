  map_label: 大麦屿
  location_note: 点位代表故事提到的大麦屿地区，不指向具体渔家、海礁或故事发生处。
  geo_sources: *id004
  paragraphs:
  - 大麦屿一位渔翁屡次空网，织布的女儿听见渔仙指点，便坚持随父出海。她和父亲在礁边连获丰收，附近船只也满载而归。
  - 渔霸借口女子上船触犯规矩，前来索鱼并羞辱她。姑娘愤而投海，巨浪吞没了渔霸的船；此后人们以她的名字称呼海礁，并在庙中纪念鱼司娘娘。
- id: case_cn_yuhuan_2008_p056
  original_sha256: 0730ef565bf2f9762f386ff06c0eb34c08ee1e9d3fec3b1dd811cffd952ffe70
