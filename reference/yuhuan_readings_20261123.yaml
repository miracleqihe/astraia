  map_label: 大麦屿
  location_note: 选辑标注流传于当时的陈屿；点位使用今大麦屿街道区域参考，不是具体采录地。
  geo_sources: &id005
  - *id003
  - citation: 玉环市地方志编纂委员会，《玉环县志（1989—2016）》。
    type: map_reference
    url: https://zjjcmspublic.oss-cn-hangzhou-zwynet-d01-a.internet.cloud.zj.gov.cn/jcms_files/jcms1/web3202/site/attach/0/a9253bb9ee9840efb3da7fc4010c0264.pdf
    locator: 行政区划：2009 年陈屿办事处改设大麦屿街道
  paragraphs:
  - 古城附近的山岗远看像一条巨大的蜈蚣。传说一条蜈蚣精曾戏弄一位路过的女子，围观者的议论让她羞愤难当，最终失去了生命。
  - 张必官决定除害，追着蜈蚣一直到海边。它的头卡在礁石缝里，被斩断后身子留在山岗；故事也把附近地名和岩石痕迹解释成这场追逐的遗迹。
