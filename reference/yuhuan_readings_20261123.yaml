  paragraphs:
  - 这部 2008 年选辑收录玉环沿海的地方传说、风物故事与习俗讲述，书中为许多篇目保留了讲述者、整理者和流传区域。
  - 这一组阅读稿沿着海岸展开：海岛如何得名，龙潭与溪水怎样进入故事，渔船上的眼睛和旗帜又如何被讲述。它们来自不同讲述者，放在一起是为了比较，不代表同一次采录。
  - 每篇保留原册页码与对应地图范围；地区点表示故事背景或记载的流传区域，不表示人物或事件的精确位置。
