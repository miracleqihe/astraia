  geo_sources: *id002
  paragraphs:
  - 漩门水急，传说李铁拐想挑两座山填住海峡，便用竹子作担，赶在天亮之前出发。
  - 吕洞宾在鸡冠山学了一声鸡叫，惊醒了巡海的神。李铁拐一急，把两座山和扁担丢在海上。后来人们把有洞的两座小山与细长岛屿，分别讲成洞正山和冲担屿的来历。
- id: case_cn_yuhuan_2008_p038
  original_sha256: f53d023e5c7c69b4eaf6faa2fa40e97ed3b40a5008f4a3da74ec0cd5ef0bf054
