  geo_sources: *id002
  paragraphs:
  - 红岗山旁的岩石像一张朝东的龙口，原本流出的水滋养田地。传说财主听信风水之说，铸了铁人堵住水口，周围的田地便干旱了。
  - 老人强四多次设法凿开铁人。山野中的花姑娘指点他染遍野花，他得到锤和锯，终于砸开铁人。水重新涌出，也冲走了赶来阻拦的财主。
- id: case_cn_yuhuan_2008_p046
  original_sha256: ae50a546a49e6dcd443e5d3fb354a29ab0e4abf7a5adad75efbcbd4457cca020
