    location_name: 浙江玉环 · 大鹿岛岛域参考
    culture_region: East Asia · China · Zhejiang
  map_label: 大鹿岛
  location_note: 点位参考大鹿岛区域，表示传说所指的岛屿，并非故事采录地。
  geo_sources:
  - citation: 玉环市渔业行政执法船舶码头项目环境影响报告书。
    type: map_reference
    url: https://29634560.s21i.faiusr.com/61/ABUIABA9GAAgwqWxqgYonr_pxgE.pdf
    locator: 表 2.7-1：大鹿岛旅游休闲娱乐区参考坐标
  paragraphs:
  - 吕洞宾听说温州叫鹿城，却没有见到城里的鹿，便想带几只鹿去。途中他找到一家三口，却发现它们是花斑鹿，而不是传说中的白鹿。
  - 眼看天亮，仙友已先行离开，他把三只鹿推入海中，自己追了上去。鹿从水中挣出，变成大、中、小三座岛；故事说渔船经过时，风里还能听见它们的鸣叫。
