  geo_sources: *id001
  paragraphs:
  - 造船木匠的女儿红衫子为平息危害渔民的乌龙，驾船出海后没有再回来。父亲四处寻找，只看到海面上的一条红鱼。
  - 红鱼带他找到岩壁上的红色海绵。木匠把它带回家，故事里人们把这看作女儿留给乡亲的帮助；选辑借此讲述渔民寻找“红鱼窝”的来历。
- id: case_cn_yuhuan_2008_p068
  original_sha256: 919e7ce573b2e377f22dedfc68b1cc9e5f902d4bddf7b4bad2179c8b48d260ac
