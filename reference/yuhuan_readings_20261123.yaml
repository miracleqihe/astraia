  map_label: 坎门
  location_note: 点位是选辑所记坎门流传地区的区域参考，不是具体采录地或传说中地点。
  geo_sources: *id001
  paragraphs:
  - 传说漩门湾底沉着一条金门槛。渔夫放生一只会说话的小海豚后，得知只有九兄弟同心，用足够长的石花草绳才能把它吊起来。
  - 九个儿子忙了许久，终于把金门槛拉出水面。可每个人都开始盘算自己能分到多少，绳索越来越重，最后断开，金门槛又沉回湾底。
  - 这则讲述最后提到后来横跨漩门的堤坝，把水下宝物与人们共同修筑的道路并置。
- id: case_cn_yuhuan_2008_p033
  original_sha256: e268d627f947f955ec0ca02196cb7d78c7ebccc83178541c8357879bc4b0a3ce
  spatial:
    lat: 28.1023
