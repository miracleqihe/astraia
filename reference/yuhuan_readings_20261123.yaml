  paragraphs:
  - 一位老人告诉三个儿子，海岛与陆地之间曾有一条沉入海底的金地枕。两个哥哥急着寻宝，先后被漩涡和海浪卷走。
  - 小儿子先学驾船，与渔人一起谋生，渐渐有了积蓄。多年后他看着金黄的鱼和银白的鱼，听同伴说他们每天都在“捞金地枕”，才明白海里的收获也是宝。
- id: case_cn_yuhuan_2008_p030
  original_sha256: 5e6c9f0e68c9d39d7b20b86ed60b5c900cd4f3e20b1ef0bbc4423b376c59add1
