  geo_sources: *id005
  paragraphs:
  - 砍柴青年用一担柴替路人搭桥，得到许多人称赞。桥边的仙人石化成老人，许他前程；青年后来考中做官。
  - 富贵之后，他为求更多回报，农忙时强征乡民修大石桥，引来怨恨。老人再次出现，将他变成黑驴；传说桥面上刻着驴形，正是这个故事留下的记号。
hub:
