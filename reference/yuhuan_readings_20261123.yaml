  geo_sources: *id002
  paragraphs:
  - 一位保护渔民的女头领常到山顶梳长发。一天听到海盗来袭，她急忙返回寨中迎战，遗落了随身的金梳。
  - 战事结束后，她和乡亲遍寻山上也没有找到。后来人们再没见到她的队伍，便猜测她是仙人，金梳藏在山里；这座山也被称作梳头山。
- id: case_cn_yuhuan_2008_p054
  original_sha256: 6b3eb8d0305d7a447c2c0045403dcdba5ce8e7402a1ebf1c46f08a3cda233d69
