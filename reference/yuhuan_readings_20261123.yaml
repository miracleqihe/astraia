  geo_sources: *id002
  paragraphs:
  - 石匠石华受雇给财主雕石马。干活时，他听见山腹反复发问；一位老人告诉他，雕好的马其实可以腾空。
  - 财主骗他说会让英妹与他成亲，却暗中将她卖走。石华骑上石马，让山塌埋住财主，随后追上运走英妹的船，两人一同飞向海岛。
  - 讲述者把这匹石马与楚门的天马山联系起来。
- id: case_cn_yuhuan_2008_p043
  original_sha256: 8056c08b01c97f61b742912cd6df360b661e3e3309b5ec40606277cda456d03d
  spatial:
