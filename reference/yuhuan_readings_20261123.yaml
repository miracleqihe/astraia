  map_label: 坎门
  location_note: 点位是选辑所记坎门流传地区的区域参考，不是具体采录地或传说中地点。
  geo_sources: *id001
  paragraphs:
  - 渔家姑娘绢珠放生一条流泪的小鱼，擦过鱼泪后，她的眼睛竟能看清水中的鱼群和暗礁。她随父亲出海，为大家指引下网的位置。
  - 渔霸想独占她的本领，把她关起来。绢珠将自己的眼睛交给父亲，托他安在船头；故事以此解释渔船两侧向下看的船眼。
