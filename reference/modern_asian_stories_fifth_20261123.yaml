- id: case_th_mekong_naga_night_fisher
  title: 泰国东北部｜河边关于纳迦的夜谈
  genre: memorate
  credibility_tier: A
  theme: corpus_th_johnson_night_fieldwork_2026
  location:
    lat: 18.1
    lng: 103.7
    precision: culture_region
    location_name: 泰国东北部 · 湄公河沿岸区域示意
    culture_region: 东南亚 · 泰国
  location_note: 论文记载的是泰国东北部湄公河畔的田野；为保护受访者，坐标仅作区域示意，不指向其村庄或住宅。
  paragraphs:
  - 接近午夜，一位渔人与研究者坐在湄公河边，谈起他认为自己见过的大水蛇纳迦，以及它可能在梦中或死后以另一种形式回来。说着说着，他认真问对方是否相信鬼。
  - 研究者起初给出客气而含糊的回答，渔人却希望听到他的真实想法。2026 年论文保留了这次并不轻松的对话，也展示了朋友如何从不同经验出发讨论同一条河。
  sources:
