- id: case_th_chiangmai_yaksha_temple_2006
  title: 泰国清迈｜佛塔后微笑的夜叉
  genre: memorate
  credibility_tier: A
  theme: corpus_th_johnson_night_fieldwork_2026
  location:
    lat: 18.7883
    lng: 98.9853
    precision: city
    location_name: 泰国清迈 · 城市参考点
    culture_region: 东南亚 · 泰国
  location_note: 研究涉及清迈郊区一处寺院，但未公开可核定的具体名称；地图只标清迈城区。
  paragraphs:
  - 研究者在清迈与一位照顾年长灵媒的女子交谈时，她说自己常在梦中见到纳迦与夜叉，也讲起寺院佛塔后的一个身影。
  - 她起初被巨大的身形和獠牙吓到，后来看到对方微笑，便把他理解为守护自己的存在。这个故事发表于 2026 年的人类学论文，访谈发生在作者早年清迈田野期间。
  sources:
  - *id007
