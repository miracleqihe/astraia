themes:
- id: corpus_cn_empty_buildings_2004_2008
  title: 空楼如何变成鬼楼｜住户、传闻与调查
  genre: academic_model
  peers:
  - case_cn_shanghai_abandoned_school_exploration_2012
  - case_cn_kunming_camera_lens_cap_2006
  paragraphs:
  - 沈阳、青岛、深圳和泉州的报道都写到外形破旧或部分空置的楼。传闻里，走廊、灯光和无人应答的房间被串成故事；住户与调查者则记下了产权、用途和迁居的另一面。
  - 这些材料也显示，围观会影响仍在楼里生活的人。阅读时可以把讲述、采访者观察和建筑历史放在一起，而不把彼此相似的情节当作同一次事件。
  sources:
  - &id001
    citation: 柴会群：〈沈阳“鬼楼”：一个谣言的流传史〉，《南方周末》，2007 年 8 月 2 日，新浪新闻转载。
    type: newspaper_report
    url: https://news.sina.com.cn/c/2007-08-02/150212316536s.shtml
    locator: “灵异事件”“鬼楼身世”“辟谣行动”三节
  - &id003
    citation: 〈“鬼楼”探险揭谣言：“四五个人死后出现灵异”是假〉，青岛新闻网，2004 年 8 月 12 日，新浪新闻转载。
    type: newspaper_report
    url: https://news.sina.com.cn/s/2004-08-12/04253376047s.shtml
    locator: 江西路居民、楼内住户及警方采访
  - &id002
    citation: 〈深圳四大邪地揭秘：网上传言见女鬼别回头〉，《南方都市报》，2007 年 9 月 20 日，新浪新闻转载。
    type: newspaper_report
    url: https://news.sina.com.cn/c/2007-09-20/151413935752.shtml
    locator: 调查总述、中银大厦及和邦酒店段落
  - &id004
    citation: 刘玉红、颜鹏、王盼琛等：〈大学生“鬼楼”探秘〉，《东南早报》，2008 年 7 月 21 日，搜狐新闻转载。
    type: newspaper_report
    url: https://news.sohu.com/20080721/n258264044.shtml
    locator: 建筑专业学生测绘及村民讲述
- id: corpus_jp_kyoto_haunted_tour_2013
  title: 京都怪谈夜巴士｜地方故事如何被体验
  genre: academic_model
  peers:
  - case_jp_tokyo_stair_step_1986
  - case_jp_yokohama_spiral_stairs_1990
  paragraphs:
  - 2009 年，一家京都旅行社开设夜间怪谈巴士，把地方传闻与城市道路、寺社和隧道连成路线。参加者在车上听故事，在到站后将看到的水渍、听到的声音和自己的感受说给同伴。
  - 研究者 Andrea De Antoni 在 2010—2011 年参加并观察行程，访谈组织者与旅客。他关心的是讲述、地点和体验如何相互影响，而不是为传闻中的人物提供真实性证明。
  sources:
  - &id005
    citation: Andrea De Antoni：〈死者へ接続するツアー——現代京都におけるダークツーリズムの再考〉，《観光学評論》1(1)，2013，81—93。
    type: peer_reviewed
    url: https://www.jstage.jst.go.jp/article/tourismstudies/1/1/1_81/_pdf
    locator: 第 85、88—89 页，京都怪谈夜巴士与花山洞的参与观察
- id: corpus_jp_teachers_school_lore_yoshioka_2021
  title: 教师之间的学校怪谈｜下班之后的校舍
  genre: academic_model
  peers:
  - case_jp_tokyo_stair_step_1986
  - case_jp_kamakura_locked_toilet_1990
  paragraphs:
  - 校园怪谈不只在学生之间流传。教师也会在下班锁门、走过暗廊或与同事闲聊时交换听来的故事，决定哪些经历可以讲给孩子听。
  - 吉冈一志对小学、中学和高中教师的小组访谈保存了这些日常叙述。论文对个人与学校作匿名处理；研究讨论的是讲述如何在师生之间流动。
  sources:
  - &id006
    citation: 吉冈一志：〈子ども文化論再考——「学校の怪談」をめぐる教師と子どもたちの編み合わせ〉，《子ども社会研究》27，2021，163—183。
    type: peer_reviewed
    url: https://www.jstage.jst.go.jp/article/jschildstudy/27/0/27_163/_article/-char/ja/
    doi: 10.57410/jschildstudy.27.0_163
    locator: 第 169—170 页，教师小组访谈
- id: corpus_th_johnson_night_fieldwork_2026
  title: 夜里的纳迦与梦｜泰国田野中的讲述
  genre: academic_model
  peers:
  - case_th_radio_returning_noodles
  - case_la_xieng_khouang_brother_in_doorway
  paragraphs:
  - 在清迈和泰国东北部的田野中，研究者听到人们谈起纳迦、夜叉、梦与河流。有的形象令人惊惧，也可能被讲述者理解为陪伴与保护。
  - Andrew Alan Johnson 的 2026 年论文把采访、友人之间的讨论和研究者自身的疑问并置。这里保留讲述者自己的理解，也为读者留下比较不同解释的空间。
  sources:
  - &id007
    citation: 'Andrew Alan Johnson, “Encounters at the Edge of Night: An Ethnography of the Weird”, Cultural Anthropology 41(3), 2026, 743–764。'
    type: peer_reviewed
    url: https://anthrosource.onlinelibrary.wiley.com/doi/full/10.14506/ca41.3.11
    doi: 10.14506/ca41.3.11
    locator: “Isan Worlds”及“Dreams and the Weird”两节
- id: corpus_sg_bishan_living_dead_2018
  title: 碧山亭到碧山镇｜墓地、村庄与城市记忆
  genre: academic_model
  peers:
  - case_sg_bishan_last_train
  paragraphs:
  - 旧碧山亭墓地和周边村庄曾是许多人生活、祭祀与相聚的地方。后来墓地迁移、村民搬迁，新住宅区和车站又出现了新的都市传闻。
  - 新加坡国家文物局文章援引口述历史与地方资料，将村民童年、迁坟和地铁故事放在同一幅地方历史里。日常记忆与恐怖传说都属于这座城市的讲述。
  sources:
  - &id008
    citation: 'Ang Zhen Ye, “Bishan: Living with the Dead”, MuseSG 11(1), National Heritage Board Singapore, 2018。'
    type: institutional_account
    url: https://www.roots.gov.sg/stories-landing/stories/bishan-living-with-the-dead/story
    locator: Kampong San Teng 村民回忆与碧山城区部分
records:
- id: case_cn_shenyang_empty_building_sleep_shift
  title: 沈阳铁西｜醒来后换了地方的传闻
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_empty_buildings_2004_2008
  location:
    lat: 41.8057
    lng: 123.4315
    precision: city
    location_name: 中国辽宁沈阳 · 城市参考点
    culture_region: 中国 · 东北
  location_note: 报道涉及仍有居民生活的楼宇；地图只标沈阳城区，不标示住户或入口。
  paragraphs:
  - 沈阳铁西一带曾流传一栋楼的怪事：有人说住户睡前在床上，醒来却到了走廊；传着传着，门铃、哭声和搬家都加入了不同版本。
  - 2007 年记者询问多位居民，却找不到能够说清当事人和时间的“睡觉移位”见证。受访者解释，相邻两栋楼的使用情况并不一样，其中一栋上层曾因产权纠纷长期空置。
  - 不少好奇者和媒体上门后，住户还要反复向来访者解释。那份调查留下的，不只是楼里的传闻，还有传闻怎样改变邻里的生活。
  sources:
  - *id001
- id: case_cn_shenzhen_bank_tower_floor_21
  title: 深圳福田｜二十一楼的不明水声
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_empty_buildings_2004_2008
  location:
    lat: 22.5431
    lng: 114.0579
    precision: city
    location_name: 中国广东深圳 · 福田区参考点
    culture_region: 中国 · 华南
  location_note: 报道指向福田的办公楼；坐标为深圳福田城区参考点，不代表楼内具体位置。
  paragraphs:
  - 深圳一栋红色大楼的二十一楼曾被说成无人敢去。网络故事里，电梯会自己停在这一层，空洗手间传出水声，有时还会出现白衣身影。
  - 2007 年《南方都市报》记者走访后发现，当时已有公司在这一层办公；保安也说自己会照常夜间巡楼。物业人员把较大的租赁面积列为楼层曾经空置的原因之一。
  - 建筑的红色外墙和塔尖也被赋予了不同解释。传闻如何产生仍有多种说法，不能把受访者的推测当作已经查明的起源。
  sources:
  - *id002
- id: case_cn_shenzhen_hebang_hotel_empty
  title: 深圳深南路｜消失后仍被讲述的酒店
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_empty_buildings_2004_2008
  location:
    lat: 22.5431
    lng: 114.0579
    precision: city
    location_name: 中国广东深圳 · 城市参考点
    culture_region: 中国 · 华南
  location_note: 酒店已拆除；未核定旧址边界，地图使用深圳城区参考点。
  paragraphs:
  - 深南路附近曾有一座长期没有营业的酒店大楼。网上有人说，工程每次动工都出意外，因此楼一直空着；在城市的记忆里，这栋楼逐渐有了另一层神秘身份。
  - 2007 年的报道查到，酒店建成后涉及巨额债务与抵押，后来因广场改造被收购拆除。楼已不在，关于它的说法却仍在流传。
  sources:
  - *id002
- id: case_cn_qingdao_jiangxi_road_red_dress
  title: 青岛江西路｜楼道里的红裙传闻
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_empty_buildings_2004_2008
  location:
    lat: 36.0671
    lng: 120.3826
    precision: city
    location_name: 中国山东青岛 · 城市参考点
    culture_region: 中国 · 华东
  location_note: 报道中的建筑为居民楼；地图只标青岛城区，尊重住户隐私。
  paragraphs:
  - 青岛江西路一栋楼的部分窗户破旧，晚上偶尔透出灯光。附近居民听到一种讲法：一位穿红裙的女子出现在楼道，后来住户陆续搬走。
  - 2004 年记者采访楼内租户、长期住户和当地派出所。住户表示自己也听过故事，但并未见到传闻中的事情；警方介绍，楼内部分房间长期空置与住房使用安排有关。
  - 红裙女子的经历属于转述，报道并没有找到可以独立核对的当事人。
  sources:
  - *id003
- id: case_cn_quanzhou_qingmeng_old_house_survey
  title: 泉州清濛｜被雷击过的老楼
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_empty_buildings_2004_2008
  location:
    lat: 24.8741
    lng: 118.6757
    precision: city
    location_name: 中国福建泉州 · 城市参考点
    culture_region: 中国 · 华东
  location_note: 建筑位于晋江池店镇清濛村，历史住宅的现状未核定；地图使用泉州城市参考点。
  paragraphs:
  - 2008 年，建筑专业学生来到清濛村测绘一座老楼。楼上光线昏暗，通往四层的楼梯已经损坏；他们听到村里关于楼主、雷击和不寻常死亡的不同讲法。
  - 记者随后询问一位在楼内住了几十年的老人。她记得年轻时楼里曾住过许多人，也回忆起一次雷雨后四层受损；她所讲的生活经历与外面流传的故事并不完全相同。
  - 这一记录把测绘者的初印象和居住者的回忆并置，楼主身份及其他传闻仍有待进一步查证。
  sources:
  - *id004
  - citation: 〈泉州发现之走进将军楼：与阿婆对话〉，《东南早报》，2008 年 7 月 21 日，新浪新闻转载。
    type: newspaper_report
    url: https://news.sina.com.cn/c/2008-07-21/151614195433s.shtml
    locator: 第 3 页，对长期居住者的采访
  reading_kind: report
- id: case_cn_kunming_dark_tunnel_unexpected_hand
  title: 昆明｜防空洞里伸来的手
  genre: memorate
  credibility_tier: B
  theme: corpus_cn_yunnan_field_reports_2001_2007
  location:
    lat: 25.0389
    lng: 102.7183
    precision: city
    location_name: 中国云南昆明 · 城市参考点
    culture_region: 中国 · 西南
  location_note: 受访者没有提供可核定的防空洞位置；地图只标昆明城区。
  paragraphs:
  - 两位昆明探访者走进一条防空洞时，头灯突然熄灭。她们牵着手摸索前进，希望找到出口，却在黑暗里摸到一只陌生人的手。
  - 一声惊叫之后，对方说不要害怕。她们才发现洞里还有一位暂住的人。2007 年报纸采访记录了这段回忆：恐惧来自看不见彼此的片刻，而故事结尾是一次意外相遇。
  sources:
  - citation: 毛翠、秦力：〈昆明 X 友的另类空间：吓得半死再乐死〉，《生活新报》，2007 年 8 月 13 日，新浪新闻转载。
    type: newspaper_report
    url: https://news.sina.com.cn/c/2007-08-13/102612375407s.shtml
    locator: “X友追求预料不到的刺激”采访段落
  reading_kind: report
- id: case_jp_kyoto_kazan_tunnel_damp_shapes
  title: 京都花山洞｜夜间隧道里的水渍
  genre: memorate
  credibility_tier: A
  theme: corpus_jp_kyoto_haunted_tour_2013
  location:
    lat: 34.9891305
    lng: 135.78932
    precision: city
    location_name: 日本京都 · 花山洞西口参考点
    culture_region: 东亚 · 日本
  location_note: 坐标采用土木学会关西支部列出的花山洞西口；记录的是公共隧道地点，不是可核实的异常事件坐标。
  paragraphs:
  - 京都的旧隧道花山洞，在网络和口耳相传中逐渐有了各种怪谈。参加夜间路线的人走进隧道前，会先听导游讲述附近地方记忆。
  - 2010—2011 年的参与观察中，研究者记下了潮湿的洞壁、像人形的水渍，以及旅客对寒冷、声音或被触碰感觉的不同反应。一人的感受也会影响同行者接下来的注意力。
  - 这些是旅行者的现场体验记录；隧道作为通道的历史与围绕它流传的解释，需要分别阅读。
