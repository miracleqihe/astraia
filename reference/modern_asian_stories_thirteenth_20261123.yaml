- id: case_cn_shenyang_village_white_mill_2023
  title: 沈阳乡村｜石磨旁的小白影
  genre: urban_legend
  credibility_tier: B
  theme: corpus_cn_asia_everyday_objects_2024
  location:
    lat: 41.8057
    lng: 123.4315
    precision: city
    location_name: 中国辽宁 · 沈阳地区参考
    culture_region: 中国 · 东北
  map_label: 沈阳
  location_note: 档案题名指向沈阳；没有给出村庄或石磨的具体位置。
  temporal:
    year_start: 2023
    year_end: 2023
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 村口有一座大家共用的石磨。祖母讲，夜里常有一个小小的白影绕着石磨跑，人们说它是小鬼。
  - 故事里的警告是，不要靠近它：它会扑上来挠人，让人笑得喘不过气。祖母说自己曾见过白影，但并没有被它挠到。
  - 2023 年的受访者转述祖母的讲法，还说后来再没有听见白影的消息，并把这一变化与特定历史时期联系起来；这是讲述者自己的解释。
  sources:
  - citation: Lingchong Hu, “Ghost Story in Chinese Village in Sheng Yang”, USC Digital Folklore Archives, 8 May 2023。
    type: oral_history
    url: https://folklore.usc.edu/ghost-story-in-chinese-village-in-sheng-yang/
    locator: 祖母讲述的石磨旁白影；题名指向沈阳
- id: case_cn_shenyang_cursed_tomb_drought_2021
  title: 沈阳讲述｜多年不下雨的墓
  genre: urban_legend
  credibility_tier: B
  theme: corpus_cn_asia_everyday_objects_2024
  location:
    lat: 41.8057
    lng: 123.4315
    precision: city
    location_name: 中国辽宁 · 受访者居住地参考
    culture_region: 中国 · 东北
  map_label: 沈阳讲述
  location_note: 点位表示 2021 年受访者的居住城市；故事中的村庄和墓地未指明。
  temporal:
    year_start: 2021
    year_end: 2021
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 这则讲述从一座墓开始：故事说，一名怀孕的女子去世后，腹中的孩子仍在墓中生长，墓因此带上了诅咒。
  - 村里接连多年没有降雨，田地荒芜。讲述者把它当作一则小时候反复听过的怪谈，也猜测它可能是人们解释土地歉收的一种说法。
  - 2021 年的采访记录了这段民间叙述；它没有指出墓在哪里，不能据受访者居住沈阳推定故事发生在沈阳。
  sources:
