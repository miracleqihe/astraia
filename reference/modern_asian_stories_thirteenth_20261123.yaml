- id: case_cn_red_embroidered_shoes_2024
  title: 中国校园｜晚自习后的红绣花鞋
  genre: urban_legend
  credibility_tier: B
  theme: corpus_cn_asia_everyday_objects_2024
  location:
    lat: 35.8617
    lng: 104.1954
    precision: culture_region
    location_name: 中国 · 讲述背景范围参考
    culture_region: 东亚 · 中国
  map_label: 中国
  location_note: 受访者在中国长大；原采录没有提供故事中的城市或具体地点，地图只表示讲述背景范围。
  temporal:
    year_start: 2024
    year_end: 2024
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 明和宏是同班同学，也是一起走夜路回家的邻居。一天晚自习后，他们经过墓地，看见一位穿深色衣服的老妇人，脚上的红绣花鞋在暗处格外显眼。
  - 宏请明留下陪自己过夜。第二天明却不见了；几天后，故事里传来消息，说有人在河中发现了穿红鞋的明。宏十分害怕，后来在父亲送他出门途中也消失了。
  - 寻找的人说曾看见宏与明的母亲在墓地附近；巡夜的人又见一名少年和一位中年女子走来，两人脚上都穿着红鞋。
  - 一位在中国长大的受访者说，她在中学时听同学讲过这则故事。采录没有给出学校、城市，也没有把情节作为新闻案件核实。
  sources:
  - citation: Madeline Feng, “Red Embroidered Shoes (红色绣花鞋), A Chinese Horror Story”, USC Digital Folklore Archives, 14 May 2024。
    type: oral_history
    url: https://folklore.usc.edu/red-embroidered-shoes-%E7%BA%A2%E8%89%B2%E7%BB%A3%E8%8A%B1%E9%9E%8B-a-chinese-horror-story/
    locator: 一位在中国长大的受访者转述中学同学讲过的故事
  - *id002
