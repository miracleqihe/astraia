- id: case_la_weeping_river_market_path_2017
  title: 老挝｜夜里从河中走出的女子
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 19.8563
    lng: 102.4955
    precision: culture_region
    location_name: 老挝 · 国家范围参考
    culture_region: 东南亚 · 老挝
  map_label: 老挝
  location_note: 故事只说老挝一座村庄，未给村名；采录将巴色误称首都，无法据此确定村庄位置。
  temporal:
    year_start: 2017
    year_end: 2017
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 在母亲讲的故事里，农人去集市要经过一座小村。半夜到凌晨三点之间，一名衣衫破旧、哭泣的女子会从附近河里走出，站在路中央。
  - 她口中念着听不懂的话。故事说，如果路人不赶快离开，仍想从她身旁经过，就会失去意识，醒来时已经到了另一个世界。
  - 一位学生回忆，母亲曾在全家露营时把这个故事讲给她和姐妹们听；那天夜里，她们因为害怕而一起熬着不睡。
  - 采录称母亲出生于老挝，但提及祖父母所在地时把巴色称作首都；老挝首都是万象，因此这里仅标注国家范围。
  sources:
  - citation: Austen Le, “The Weeping River Lady”, USC Digital Folklore Archives, interview 9 April, posted 30 April 2017。
    type: oral_history
    url: https://folklore.usc.edu/the-weeping-river-lady/
    locator: 露营时母亲讲给受访者和姐妹的故事
