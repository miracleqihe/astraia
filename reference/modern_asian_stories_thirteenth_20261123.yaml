    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 梅姨在旅馆房间捡到一只玩偶，想带回去送给女儿。当晚她梦见一个女孩向她借鞋；醒来后，她发现自己的鞋不见了，玩偶脚上却多了一双相似的小鞋。
  - 她匆忙离店，把玩偶留下。后来在火车上，梅姨再次梦见孩子的声音，醒来却发现玩偶坐在膝上，身上的粉色裙子与自己箱子里丢失的一件很像。
  - 她把玩偶扔掉，因行程变动折返时遇到一个寻找母亲的女孩，便带她去旅馆过夜。故事以梅姨次日被发现去世、身边只剩玩偶收尾；笔记本又引出她拐卖儿童的情节。
  - 受访者说自己在小学听同学讲过这个都市故事，成年后尤其记得结尾。采录没有提供旅馆、铁路或人物的可核对身份。
  sources:
  - citation: Madeline Feng, “The Doll’s Revenge, A Chinese Urban Legend”, USC Digital Folklore Archives, 14 May 2024。
    type: oral_history
    url: https://folklore.usc.edu/the-dolls-revenge-a-chinese-urban-legend/
