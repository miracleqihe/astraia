themes:
- id: corpus_cn_asia_everyday_objects_2024
  title: 日常物件里的恐怖故事｜口述材料并读
  genre: academic_model
  peers:
  - case_cn_chongqing_grandfather_bear_granny_2019
  - case_cn_qingdao_school_statue_restroom_2020
  - case_id_jakarta_rental_dancing_calendar_2016
  - corpus_east_asia_school_oral_accounts_2011_2026
  paragraphs:
  - 一双红色绣花鞋、一尊餐厅外的小丑像、一只酒店里的玩偶：在几则中文口述故事中，普通物件会突然改变人物对熟悉场所的感觉。
  - 2024 年，Madeline Feng 在南加州大学民俗档案中记录了不同受访者从同学或亲属那里听来的故事；其中红鞋与晚自习后的归途相连，玩偶则出现在旅行和旅馆中。
  - 雅加达的一则家庭转述里，挂历上的人物仿佛动了起来；青岛校园讲述中的雕像也成为学生议论的中心。这些记录在这里按物件与场景并读，不能据此断定故事之间有传播关系。
  - 另一条可以对照的线索是祖辈讲给孩子听的熊家婆：重庆和四川两次记录的结局不同，保留下来的是各自的讲述，而不是单一的标准版本。
  sources:
  - &id002
    citation: Madeline Feng, 2024 年口述采集集，USC Digital Folklore Archives。
    type: oral_history
    url: https://folklore.usc.edu/author/fengyuan/
    locator: 作者页面可并读金花、红绣花鞋、小丑和玩偶四则记录
  - &id001
    citation: Madeline Feng, “Bear Grandma (熊家婆), A Chinese Little Red Riding Hood”, USC Digital Folklore Archives, 14 May 2024。
    type: oral_history
    url: https://folklore.usc.edu/bear-grandma-%E7%86%8A%E5%AE%B6%E5%A9%86-a-chinese-little-red-riding-hood/
    locator: 采集者重询四川外祖母所讲的金花故事
  - citation: Yunqian Hsu, “Bear Granny”, USC Digital Folklore Archives, interview 13 March 2019, posted 13 May 2019。
    type: oral_history
    url: https://folklore.usc.edu/bear-granny/
    locator: 受访者重述重庆祖父所讲故事及结尾
