- id: case_th_dragging_sound_temple_2013
  title: 泰国讲述｜跟随的拖行声
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 15.87
    lng: 100.9925
    precision: culture_region
    location_name: 泰国 · 国家范围参考
    culture_region: 东南亚 · 泰国
  map_label: 泰国
  location_note: 受访者从祖父处听来泰语故事；采录没有提供故事中的城镇。
  temporal:
    year_start: 2013
    year_end: 2013
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一个男人走路时，总听见身后传来拖行声；他停下，声音也跟着停。两周后，他在家中跌伤，住院时仍听见断断续续的声音。
  - 出院后，他去寺院行善，声音渐渐弱了。他以为事情结束，便不再前往；约一个月后，过马路时声音又出现了，他随后遭遇车祸。
  - 故事里，僧人把他的遭遇解释为前世行为的后果，男人决定余生留在宗教生活中。2013 年，一位泰国受访者说这是祖父讲给他的故事。
  sources:
  - citation: “Bad Karma”, USC Digital Folklore Archives, interview 12 November 2013。
    type: oral_history
    url: https://folklore.usc.edu/bad-karma/
    locator: 泰国受访者转述祖父所讲的跟随声与寺院故事
