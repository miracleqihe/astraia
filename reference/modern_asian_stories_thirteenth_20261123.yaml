- id: case_cn_sichuan_jinhua_bear_grandma_2024
  title: 四川｜金花与熊家婆
  genre: folktale
  credibility_tier: B
  theme: corpus_cn_asia_everyday_objects_2024
  location:
    lat: 30.5
    lng: 102.66667
    precision: province
    location_name: 中国四川 · 讲述者家族参考
    culture_region: 中国 · 西南
  map_label: 四川
  location_note: 外祖母来自四川，故事没有指定山村；点位为四川省行政区域参考点。
  temporal:
    year_start: 2024
    year_end: 2024
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 母亲出门后，金花独自照顾弟弟。夜里一位自称祖母的人来敲门，她让金花熄灯；来客坐坏了木凳，金花低头生火时，看见她长满毛的脚，认出是熊家婆。
  - 金花先把弟弟带进房间安顿好，又假装要出去一会儿。熊家婆把绳子系在两人手腕上，她悄悄将绳子另一端系住，趁机逃了出去。
  - 熊家婆追到池边，以为金花在水里，其实看见的是她躲在梨树上的倒影。树干被金花涂得滑溜溜的，熊家婆爬不上去，最后被金花用计制服。天亮后，母亲回来了。
  - 2024 年，采集者重新向来自四川的外祖母询问童年听过的睡前故事；她记得外祖母原先用四川话讲述。
  sources:
  - *id001
  - *id002
  - citation: GeoNames, Sichuan, China, place 1794299。
    type: gazetteer
    url: https://www.geonames.org/1794299/sichuan.html
    locator: 四川省行政区域参考点 30.50000, 102.66667
