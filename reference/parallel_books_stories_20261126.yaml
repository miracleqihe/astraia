- id: case_cn_dict_zhuhua
  title: 广西河池 · 罗城县｜竹花
  aliases:
  - 二渡河鬼妻
  - 耶罗与竹花
  genre: folktale
  credibility_tier: B
  location:
    lat: 24.788
    lng: 108.9035
    precision: city
    location_name: 广西河池 · 罗城县
    culture_region: 东亚 · 中国广西
  location_note: 罗城县城参考点；词典说故事流传于罗城，故事中的桃花村及二渡河均未定位。
  paragraphs:
  - 一位农人在河边结识名叫竹花的女子。她说自己要寻找替身，才能离开水边；当一位洗衣妇人将要落水时，农人却不忍见她丧命，将人救下。
  - 竹花于是说出自己受害的冤情。故事让农人带来作恶的财主，最终将冤情交由阴间审理；竹花得以还阳。它是辞典归入“当代部分”的罗城地方故事，河流名称来自叙事，尚未核实具体河段。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: 鬼话·当代部分，印页 467（PDF 第 582 页），条目“竹花”
  - citation: 广西河池 · 罗城县 地域参考资料。
