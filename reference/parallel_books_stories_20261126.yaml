- id: case_cn_dict_beggar_ghost
  title: 四川 · 成都市｜讨口子吓鬼
  aliases:
  - 乞儿与产难鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.5728
    lng: 104.0668
    precision: city
    location_name: 四川 · 成都市
    culture_region: 东亚 · 中国四川
  location_note: 成都市区参考点；词典仅记流传于成都，故事中的家庭住址未定位。
  paragraphs:
  - 一个四处乞食的孩子，夜里遇到传说中要伤害产妇的鬼。对方数次变换样子想将孩子吓走，孩子始终没有退让。
  - 天亮之后，产妇平安生下孩子，家人听说经过后给予孩子住所与田地。故事是地方传说，不可把产妇的遭遇或鬼怪的解释当作医学事实。
