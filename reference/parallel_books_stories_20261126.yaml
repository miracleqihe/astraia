- id: case_cn_dict_carpenter_ghost
  title: 四川 · 成都市｜木匠收鬼
  aliases:
  - 杨木匠与女鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.5728
    lng: 104.0668
    precision: city
    location_name: 四川 · 成都市
    culture_region: 东亚 · 中国四川
  location_note: 成都市区参考点；词典所称石板桥与故事发生的具体地点均未核。
  paragraphs:
  - 夜里，一个木匠经过石板桥，遇见哭泣的女子，背她回家后才知道她被讲作鬼。故事里他用墨斗作记号，把她留在家中干活。
  - 女子趁木匠外出时逃走，后来再相遇，又被吓得赶紧离开。故事把熟悉的匠人工具带入夜路奇遇；辞典没有说明石板桥的具体位置和采录者。
