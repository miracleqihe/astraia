- id: case_cn_dict_mountain_spirit_ziche
  title: 云南玉溪 · 元江县｜山神资车
  aliases:
  - 资车与山鬼
  - 资车祭山
  genre: folktale
  credibility_tier: B
  location:
    lat: 23.596
    lng: 101.998
    precision: city
    location_name: 云南玉溪 · 元江县
    culture_region: 东亚 · 中国云南
  location_note: 元江县参考点；词典所记为元江哈尼族的流传范围，不标作仪式采录点。
  paragraphs:
  - 相传资车力气很大，乡人辛苦种下的谷物接连受损，他发现人们把原因归于山鬼。资车为了阻止山鬼，搬到山上，却因为长期无人送食而力竭。
  - 后来乡人再次纪念资车，并将敬奉山神的活动与丰收联系起来。辞典所记是地方祭山故事，不能当作作物受损原因或所有地方仪式的统一解释。
  sources:
