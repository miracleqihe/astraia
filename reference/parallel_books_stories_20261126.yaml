- id: case_cn_dict_ghost_catches_master
  title: 四川 · 成都市｜鬼收端公
  aliases:
  - 端公夜路疑声
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.5728
    lng: 104.0668
    precision: city
    location_name: 四川 · 成都市
    culture_region: 东亚 · 中国四川
  location_note: 成都市区参考点；词典仅记流传于成都，端公夜路并无可核的具体地点。
  paragraphs:
  - 刘端公以收鬼闻名，一次替人办事后酒足饭饱，独自走在回家的路上。身后忽然响起声音，他以为有漏掉的鬼追来报复，急忙逃回家。
  - 这一短篇把驱鬼者与害怕者的位置倒转。词典仅记其在成都流传，没有给出发生日期或可查的具体夜路。
