    lng: 120.155
    precision: city
    location_name: 浙江 · 杭州市
    culture_region: 东亚 · 中国浙江
  location_note: 杭州城市参考点；词典仅说故事流传杭州，山间戏台未定位。
  paragraphs:
  - 一个戏班被请到山里演戏，约定天亮才散场。班子演了一场又一场，却始终见不到天亮，众人认定其中有古怪。
  - 班主改演包公戏，包公角色一上台，天便亮了。众人这才发现戏台搭在坟头，四周是一片荒草；辞典把它记为杭州一带的故事，并未说明具体山址。
