- id: case_cn_dict_shuanghunpo
  title: 重庆 · 城市参考｜双魂坡
  aliases:
  - 乔逸生玉芹
  - 双魂坡传说
  genre: folktale
  credibility_tier: B
  location:
    lat: 29.563
    lng: 106.5516
    precision: city
    location_name: 重庆 · 城市参考
    culture_region: 东亚 · 中国重庆
  location_note: 重庆城市参考点；词典所称故事流传重庆，双魂坡位置未核。
  paragraphs:
  - 书生乔逸生与表妹玉芹青梅竹马，后来离乡。多年后他遇到玉芹，二人相聚，一夜之后她却不见了；他后来才知道她早已去世。
  - 故事说乔逸生悲痛而亡，附近的人将两人葬在一起，地名由此而来。辞典另标《中国民间故事集成重庆市卷》下册为出处；本次尚未查到该册原件，也未定位山坡。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
