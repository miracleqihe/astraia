- id: case_cn_dict_wang_laoshi
  title: 湖南湘西 · 泸溪县｜王老实怕鬼的故事
  aliases:
  - 王老实夜路虚惊
  genre: folktale
  credibility_tier: B
  location:
    lat: 28.2156
    lng: 110.21275
    precision: city
    location_name: 湖南湘西 · 泸溪县
    culture_region: 东亚 · 中国湖南
  location_note: 泸溪县城附近参考点；词典记“湖南泸溪”流传，夜路与住宅未定位。
  paragraphs:
  - 王老实夜里经过坟地，觉得有人不断抽打自己的腿和背；他越跑越快，身后的敲击也愈加明显，到家后急忙请妻子查看。
  - 妻子发现，原来一根长竹和一截稻草挂在他的辫梢与鞋后。地方故事把夜路上的恐惧与回家后的辨认放在一处，结尾揭示原来是虚惊。
  sources:
