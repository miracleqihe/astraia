- id: case_cn_dict_yama_hired_teacher
  title: 上海 · 金山区｜阎罗王聘师
  aliases:
  - 阴间私塾
  - 阎罗之子拜师
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.7247
    lng: 121.3307
    precision: city
    location_name: 上海 · 金山区
    culture_region: 东亚 · 中国上海
  location_note: 金山区参考点，仅指词典所记流传区域，阴间及宅址不作地理定位。
  paragraphs:
  - 一个屡试未中的秀才在家乡教书，相传有一天被阎罗王请去教孩子。学生临时离开前嘱他不要去西楼，他却推门看见妻子守着自己的遗体哭泣。
  - 阎罗王后来安排他借另一具新亡者的身体回去；两家人也因此成为亲属。故事把私塾与家庭生活搬进阴间，但辞典没有给出具体讲述者。
