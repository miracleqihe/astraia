- id: case_cn_dict_ghost_long_robe
  title: 浙江 · 杭州市｜地方鬼的长衫
  aliases:
  - 无常鬼长衫
  - 隐身长衫
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.274
    lng: 120.155
    precision: city
    location_name: 浙江 · 杭州市
    culture_region: 东亚 · 中国浙江
  location_note: 杭州城市参考点；词典仅记流传于杭州，演奏及其他情节的地点未定位。
  paragraphs:
  - 一个年轻人夜里拉胡琴，听众中有位地方鬼。故事说鬼走时遗落了长衫，年轻人披上衣服后，发现它能使自己隐身，于是起了偷窃的念头。
  - 长衫后来烧出破洞，虽经补缀，他行窃时仍被人看见并受到惩罚。辞典用“地方鬼”称呼此处的无常鬼；这不是能够定位的现实案件。
  sources:
