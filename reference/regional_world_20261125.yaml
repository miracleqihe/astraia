# Newly researched summaries. Coordinates identify a documented place or a clearly labelled regional anchor.
records:
  - id: case_cn_shenzhen_longgang_concrete_fortress
    title: 深圳龙岗｜老墟尽头的怪楼
    aliases: [龙岗怪楼, 龙岗老墟, Longgang Weird Building]
    genre: urban_legend
    credibility_tier: B
    location: {lat: 22.7252, lng: 114.2521, precision: city, location_name: 广东深圳 · 龙岗老墟附近, culture_region: 东亚 · 中国广东}
    location_note: 点位为龙岗老墟的地区参考，不是进入建筑的入口或私人居所坐标。
    paragraphs:
      - 龙岗老墟的街巷尽头，一座高高的混凝土楼房几乎没有普通窗户，屋顶长着草木，外形像一座碉堡。住在附近的人叫它“怪楼”；随着照片和探访视频在网上传播，有人开始讲里面的曲折楼梯和让人迷路的空间。
      - 地方媒体记下它在老墟的位置，纪录片创作者则通过邻居访谈、影像和建筑调查，尝试拼起建造者与深港两地的生活背景。楼房和城市传闻都是真实存在的记录，网上那些无法核实的神秘经历则是另一层故事。
      - 从墙外看到的轮廓、不同人的回忆，以及后来流传的探险帖，并不一定能拼成同一段完整历史；这也是一座私人建筑如何变成城市记忆的线索。
    sources:
      - {citation: '深圳新闻网，打卡百年老墟：龙岗老墟探索之旅，2023。', type: journalism, url: 'https://www.sznews.com/news/content/2023-06/26/content_30297897.htm', locator: 老墟中的怪楼与位置}
      - {citation: 'South China Morning Post, The mystery of one man’s fortress in Longgang, 2026.', type: journalism, url: 'https://www.scmp.com/postmag/culture/article/3361248/mystery-one-mans-fortress-longgang', locator: 建筑外观、口述背景与纪录片}
      - {citation: '一叶障目播客，龙岗怪楼试映会及分享讨论。', type: interview, url: 'https://podcasts.apple.com/us/podcast/%E4%B8%80%E5%8F%B6%E9%9A%9C%E7%9B%AE/id1780149489', locator: 导演与建筑研究者对材料和影像的讨论}
    compare: [case_cn_liwan_plaza_night_sign]
    bridge: {entry: HIS-6-0002, cluster: sid_liminal, trail: trail5, label: 怪楼、口述与城市记忆, rationale: 比较建筑实地资料、邻居回忆和网络探访，理解一处城市空间如何不断获得新故事。}
  - id: case_cn_jinan_old_museum_rumor
    title: 济南｜旧博物馆的网络鬼楼传闻
    aliases: [山东省博物馆旧址, 济南老省博, 老馆鬼楼]
    genre: urban_legend
    credibility_tier: B
    location: {lat: 36.6512, lng: 117.1201, precision: city, location_name: 山东 · 济南市区, culture_region: 东亚 · 中国山东}
    location_note: 济南市区为城市参考点；旧馆和现馆并非同一建筑，此点不代表两者的具体位置。
    paragraphs:
      - 网上曾有“十大灵异地点”的名单，把山东省博物馆旧馆也放了进去。帖子讲一个人夜里在院落醒来，看见穿花袄的女子围着天井走动；展厅、墓碑和较暗的走廊被连成一座神秘的“鬼楼”。
      - 2014 年记者到旧址采访时，原馆工作人员承认旧建筑的布局可能影响采光，但否认帖子描述的灵异事件。馆舍后来另有用途，网上故事却仍可被重新转发。
      - 这条记录保存的是传闻和受访者的回应；它适合与照片、旧馆位置及博物馆迁移史一起阅读，不能把名单当作现场记录。
    sources:
      - {citation: '山东省博老馆入选十大灵异地，老馆员回应，2014。', type: journalism, url: 'https://sd.sina.com.cn/news/sdyw/2014-04-27/103362085.html', locator: 记者现场采访与旧馆人员回应}
    compare: [case_cn_yangzhou_luosijieding_2009]
    bridge: {entry: SOC-5-0002, cluster: sid_liminal, trail: trail5, label: 一座旧馆怎样进入灵异名单, rationale: 将转发名单与记者对旧馆工作人员的采访并读，辨认传闻的出处和现场信息。}
  - id: case_cn_jinhua_xifeng_nie_xiaoqian
    title: 金华｜西峰旅馆里的聂小倩
    aliases: [西峰旅馆, 聂小倩, 金华鬼故事]
    genre: urban_legend
    credibility_tier: B
    location: {lat: 29.0792, lng: 119.6474, precision: city, location_name: 浙江 · 金华城区, culture_region: 东亚 · 中国浙江}
    location_note: 金华城区是地方故事的城市参考点，不将现存建筑认作故事发生的准确房间。
    paragraphs:
      - 金华人谈起西峰一带时，有人会讲一则旅馆闹鬼的旧事：夜里的陌生女子被叫作聂小倩，仿佛蒲松龄笔下的故事走出了书页，又回到了地方巷陌。
      - 地方文博工作者在访谈中把《聂小倩》文本、金华旧地名和寺院资料放在一起讨论，提出宁采臣投宿地点的解释。小说地点与现实遗址之间如何对应，仍是研究者和地方讲述者的不同看法。
      - 一条较早的文学叙事因此又长出了现代旅馆版本；读者既可以读书中的情节，也能观察一座城市如何认领和改写它。
    sources:
      - {citation: '浙江在线，金华古城悬谜：宁采臣聂小倩真有其人，2016。', type: journalism, url: 'https://jinhua.zjol.com.cn/jinhua/system/2016/04/11/020341809.shtml', locator: 西峰旅馆传闻与地方文博访谈}
    bridge: {entry: HIS-6-0009, cluster: sid_liminal, trail: trail5, label: 聂小倩从小说到地方传闻, rationale: 对读《聊斋》文本与金华旅馆讲述，留意旧地名、文本版本和后来改写的区别。}
  - id: case_cn_shantou_nansha_shigu
    title: 汕头南砂｜为无主之魂摆出的供桌
    aliases: [南砂施孤, 澄海普渡, 抢孤, Shigu]
    genre: historical_archive
    credibility_tier: B
    location: {lat: 23.467, lng: 116.756, precision: city, location_name: 广东汕头 · 澄海区域, culture_region: 东亚 · 中国潮汕}
    location_note: 澄海区域是南砂乡仪式的地区参考点，并非某一年的供桌或路线坐标。
    paragraphs:
      - 农历七月，潮汕一些村落会为无人祭祀的亡者准备食物和香烛。南砂的普渡场上，乡人募集米粮、摆起供品，祭仪结束后又有“抢孤”：供品由人们带走，场面从肃静转为热闹。
      - 2026 年的实地报道记录了村民募集物资、照看仪式和不同年龄的人参与。施孤既与地方关于孤魂的观念有关，也与互助和乡里组织相连；各村举办的时间与形式并不完全相同。
      - 看这场仪式时，可以同时留意祭桌前的故事与筹备桌后的劳动：谁组织、谁捐献、谁把习俗教给下一代。
    sources:
      - {citation: 'Wu Haiyun, A Dying Tradition? China’s Shigu Festival, Sixth Tone, 2026.', type: journalism, url: 'https://www.sixthtone.com/news/1019051', locator: 2026 年南砂实地记录}
      - {citation: '澄海习俗：南砂乡七月半抢孤，2018。', type: journalism, url: 'https://www.sohu.com/a/249938585_367549', locator: 南砂地点与普渡习俗}
    bridge: {entry: REL-5-0001, cluster: sid_myth, trail: all, label: 施孤与地方互助, rationale: 从南砂供桌和村民筹备进入地方仪式阅读，观察信仰实践与社区互助怎样相连。}
  - id: case_cn_tw_kinmen_tongzishan_headless
    title: 金门｜赶早市经过的统仔山
    aliases: [統仔山, 无头鬼, 金沙桥]
    genre: urban_legend
    credibility_tier: B
    location: {lat: 24.4837, lng: 118.4146, precision: city, location_name: 金门 · 金沙镇地区, culture_region: 东亚 · 中国金门}
    location_note: 金沙镇为赶集路线的地区参考点；报刊讲述的山丘和旧碉堡未标为精确位置。
    paragraphs:
      - 天还没亮，挑菜去沙美早市的人走过统仔山。当地一篇旧报刊故事说，有人看见旧碉堡边站着没有头的身影；后来卖蚵和卖菜的邻居结伴上路，又听见山边传来断续的声音。
      - 讲述者把这名身影的由来与戒严年代的军营传闻联系起来，也写到另一名赶集人停下来向它大声斥责。随着赶集路线和运输方式改变，山路上的故事慢慢淡出日常。
      - 《金门日报》2003 年刊登的是地方回忆和传说，不提供军营事件的独立档案；早市、道路和各人的说法共同构成了这则故事的背景。
    sources:
      - {citation: '金门日报，地方传说：统仔山顶的无头鬼，2003。', type: journalism, url: 'https://www.kmdn.gov.tw/1117/1271/1274/32447/?cprint=pt', locator: 赶早市的人、旧碉堡与讲述者回忆}
      - {citation: '刘镇东，浯江轶事，秀威资讯科技，2005。', type: book_catalogue, url: 'https://klccab.ebook.hyread.com.tw/bookDetail.jsp?id=1383', locator: 第 31 页；电子书借阅依馆藏规定}
    bridge: {entry: HIS-6-0007, cluster: sid_liminal, trail: trail5, label: 山路传闻与地方记忆, rationale: 把山路、早市和军营传闻放在一起阅读，区分地方记忆与可独立核对的历史记录。}
  - id: case_cn_tw_tainan_chenghuang_night_patrol
    title: 台南｜城隍爷出城夜巡
    aliases: [暗访夜巡, 全台首邑县城隍庙, 城隍暗访]
    genre: historical_archive
    location: {lat: 22.9958, lng: 120.2079, precision: city, location_name: 台南 · 中西区, culture_region: 东亚 · 中国台湾}
    location_note: 台南中西区为城隍庙和旧府城夜巡的城市参考；实际路线随仪式安排变化。
    paragraphs:
      - 农历七月之后，台南县城隍庙有“暗访夜巡”：队伍从庙里出发，穿过旧府城的街道，依地方信仰巡视逗留人间的孤魂。沿途的仪仗、路祭和庙前准备，让熟悉的街巷在夜里有了另一种秩序。
      - 文化资产资料记载了点兵、出巡、路祭等仪程，也说明路线依每次安排而定。它既是一套仍由参与者维护的地方仪式，也保存了城市居民对逝者与公共空间的想象。
      - 这是关于实际民俗活动的记录；队伍所讲的阴间故事则应放回参与者的信仰语境中理解。
    sources:
      - {citation: '台湾文化资产网，全台首邑县城隍庙暗访夜巡查。', type: official_archive, url: 'https://nchdb.boch.gov.tw/embed/assets/overview/folklore/20230620000002', locator: 仪式程序与文化资产记录}
      - {citation: '台南市政府，县城隍庙暗访夜巡查。', type: official_archive, url: 'https://www.tainan.gov.tw/News_Content.aspx?n=13370&s=7917927', locator: 地方口述与夜巡活动}
    bridge: {entry: REL-5-0001, cluster: sid_myth, trail: all, label: 城隍夜巡与地方仪式, rationale: 阅读夜巡的组织、路线和地方信仰，观察仪式如何让城市空间与共同记忆相连。}
  - id: case_cn_shanghai_jingan_digital_archive_fiction
    title: 上海静安寺站｜网络虚构的异常档案
    aliases: [静安寺站异常档案, 虚构调查局, 上海地铁怪谈]
    genre: creepypasta_ostension
    credibility_tier: F
    location: {lat: 31.223, lng: 121.445, precision: city, location_name: 上海 · 静安寺站附近, culture_region: 东亚 · 中国上海}
    location_note: 数字原生故事借用了静安寺站的名称；坐标是现实地标参考，不表示发生过所述事件。
    paragraphs:
      - 一则网络“档案”声称，静安寺站附近出现异响与感官异常，随后有自称调查员的人介入。文字模仿了报告格式，让一个真实站名和一段虚构情节看起来像已经调查过的事件。
      - 2026 年的报道指出，相关帖子有的标明“纯属虚构”，却使用不显眼的标签；其中一个版本还把静安寺站写进并不经过该站的地铁三号线。记者将其作为借用地标、传播故事并推广商品的例子。
      - 此条保留虚构作品与传播方式的记录；打开虚构条目开关后，读者可以对照其叙事包装和报道中的核查结果。
    sources:
      - {citation: '上海网络辟谣，上海地铁、杭州地铁的虚构“档案”，澎湃新闻，2026。', type: journalism, url: 'https://www.thepaper.cn/newsDetail_forward_33803967', locator: 虚构标签、地铁线路错误与传播方式}
    compare: [case_cn_bj_metro_beixinqiao_audio_2019]
    bridge: {entry: SOC-5-0002, cluster: sid_liminal, trail: trail5, label: 虚构档案与真实地标, rationale: 对照故事中的调查口吻与公开报道的核查，阅读地标怎样被借入数字叙事。}
  - id: case_jp_ome_hearn_snow_woman
    title: 青梅｜雪夜里不能说出的约定
    aliases: [雪女, 雪おんな, Yuki-onna, 小泉八云]
    genre: folktale
    location: {lat: 35.7871, lng: 139.2754, precision: city, location_name: 日本东京 · 青梅市, culture_region: 东亚 · 日本关东}
    location_note: 青梅市是小泉八云所记故事来源地区的城市参考点，雪夜中的渡口不在此标作精确地点。
    paragraphs:
      - 暴雪夜里，年轻樵夫巳之吉与年长同伴借住渡口小屋。一名白衣女子出现，年长者再没有醒来；她让年轻人活下去，却要求他永远不要把相遇告诉别人。
      - 许多年后，巳之吉与阿雪成家。有一天他谈起那场雪，妻子忽然承认自己就是当年的女子；因为他违背约定，她将离开，但叮嘱他照顾孩子，随后消失在冬夜。
      - 小泉八云在 1904 年《怪谈》的序言中记下自己从旧调布村讲述者听到这一版本；东京地方资料将它与今天青梅一带联系起来。日本各地的雪女故事并不只有这一种结局。
    sources:
      - {citation: 'Lafcadio Hearn, Kwaidan: Stories and Studies of Strange Things, 1904, Yuki-Onna.', type: primary_text, url: 'https://www.gutenberg.org/files/1210/1210-h/1210-h.htm', locator: 序言与雪女全文}
      - {citation: '东京都江户东京博物馆，多摩文学历史散步。', type: institutional_account, url: 'https://edo-tokyo-museum.repo.nii.ac.jp/record/262/files/kiyo8_1-44.pdf', locator: 青梅与雪女传说的地理讨论}
    bridge: {entry: HIS-6-0009, cluster: sid_hag, trail: all, label: 雪女的口述与书写版本, rationale: 对读八云的英文文本与青梅地区资料，观察口述故事进入出版物时的版本变化。}
  - id: case_jp_nara_gangoji_gagoze
    title: 奈良｜钟楼里留下的鬼发
    aliases: [元兴寺, 元興寺, Gagoze, 伽古则]
    genre: folktale
    location: {lat: 34.6778, lng: 135.831, precision: city, location_name: 日本奈良 · 元兴寺, culture_region: 东亚 · 日本关西}
    location_note: 坐标指向今天元兴寺所在区域，寺院旧有建筑范围经历过变化。
    paragraphs:
      - 奈良元兴寺的钟楼里，照看钟楼的童子接连遇害。寺里新来的少年道场自告奋勇守夜；怪物半夜现身，两人一直争斗到天亮，少年只抓下一把长发，怪物却逃进夜色。
      - 这则故事进入《日本灵异记》，后来与被称为 Gagoze 的鬼形象相连。今天寺院的介绍还讲述它如何逐渐成为寺院象征的一部分，而不只是一位被击退的怪物。
      - 读故事时，也能比较古代书写、寺院自己的解释和今天的鬼像：同一名字在不同时代被赋予了不同角色。
    sources:
      - {citation: '元兴寺，元兴神 Gagoze 与寺院历史。', type: institutional_account, url: 'https://www.gangoji-tera.or.jp/about/index.html', locator: 寺院对钟楼传说的介绍}
      - {citation: '日本国土交通省，元兴寺：Gagoze 的传说。', type: official_archive, url: 'https://www.mlit.go.jp/tagengo-db/common/001558420.pdf', locator: 少年与鬼的情节及形象变化}
    bridge: {entry: REL-5-0005, cluster: sid_myth, trail: all, label: 元兴寺钟楼与鬼的变身, rationale: 对读寺院介绍和古代故事的再叙述，观察妖怪形象怎样与地方记忆结合。}
  - id: case_kr_sangju_goblin_reservoir
    title: 韩国尚州｜鬼怪一夜筑成的水坝
    aliases: [Dokkaebibo, 도깨비보, 鬼怪水坝]
    genre: folktale
    location: {lat: 36.4109, lng: 128.1591, precision: city, location_name: 韩国 · 尚州市, culture_region: 东亚 · 韩国庆尚地区}
    location_note: 尚州市是相关传说流传地区的参考点，并非具体水坝或村口的精确位置。
    paragraphs:
      - 一个人请求鬼怪们帮忙堵水筑坝，答应用红豆粥酬谢。鬼怪连夜把石头垒好，主人端来的粥却不够分；落空的那个生气地拔走自己砌的几块石头。
      - 据地方故事，洪水来了水坝仍没有倒，只从缺石处喷出水来。韩国国立民俗博物馆的资料指出，这类故事在尚州等地有不同版本，也常被用来解释地方水利设施或地名。
      - 红豆粥既与岁时习俗有关，也在故事里变成一份酬劳，让水坝如何建成的想象带上日常人情。
    sources:
      - {citation: 'National Folk Museum of Korea, Encyclopedia of Korean Folk Culture: Goblin Reservoir.', type: institutional_account, url: 'https://folkency.nfm.go.kr/en/topic/detail/5485', locator: 红豆粥、水坝与地方版本}
    bridge: {entry: REL-5-0005, cluster: sid_myth, trail: all, label: 红豆粥与地方水坝, rationale: 对读水坝传说和口述传统，观察地方设施、食物习俗怎样成为故事的一部分。}
  - id: case_bn_bandar_jong_batu
    title: 文莱河｜变成石船的归乡人
    aliases: [Jong Batu, Nakhoda Manis, 石船]
    genre: folktale
    location: {lat: 4.9031, lng: 114.9398, precision: city, location_name: 文莱 · 斯里巴加湾市, culture_region: 东南亚 · 文莱}
    location_note: 斯里巴加湾市是文莱河故事的城市参考点，并非石船岩礁的精确位置。
    paragraphs:
      - 年轻的马尼斯离开文莱河畔远行，后来成为富有的船长。母亲多年等待，终于听说儿子的船回来了，便划着小船去迎接；不同版本里，她的贫困和船上的新生活让相认变得艰难。
      - 一种流传的结局说，儿子拒绝承认母亲，风暴随即掀翻大船，船化成河中的岩石。水上村落的人把那处外形像船的石块叫作 Jong Batu，也一代代向孩子讲起这段相遇。
      - 文莱教育材料和河流文化路线都收录了这一故事；印尼和马来西亚也流传相近母题，比较时仍需保留各地各自的人名与版本。
    sources:
      - {citation: 'Brunei Ministry of Education, Brunei’s Folktales: Nakhoda Manis.', type: official_archive, url: 'https://resource.moe.gov.bn/wl/?download=1&id=sLfhg015d9heBCtXizJ0ZOHgKI8lRLFy&mode=list&path=Documents%2FTIARA+programme%2FY3++Unit+1+Folktales+2014+new.pdf', locator: 故事及不同教学版本}
      - {citation: 'Pelita Brunei, 文莱口述文学与 Nakhoda Manis, 2003.', type: official_archive, url: 'https://www.pelitabrunei.gov.bn/Arkib%20Dokumen/2003/30%20JULAI%202003.pdf', locator: 第 6 页；母亲、风暴与石船}
      - {citation: 'ASEAN Secretariat Indonesia, ASEAN folktales for basic education.', type: official_archive, url: 'https://setnasasean.kemlu.go.id/site/uploads/document/book/61375cdb24440-buku-pengajaran-asean-bagi-pendidikan-dasar-sd-smp.pdf', locator: 文莱 Nakhoda Manis 故事}
    bridge: {entry: REL-5-0005, cluster: sid_myth, trail: all, label: 文莱石船与归乡故事, rationale: 比较石船故事的当地讲述与教材版本，留意家庭关系、河流地标和相似母题。}
  - id: case_sg_kusu_turtle_fishers
    title: 新加坡龟屿｜大海里托起渔人的龟
    aliases: [Kusu Island, 龟屿岛, Pulau Tembakul]
    genre: folktale
    location: {lat: 1.224, lng: 103.8619, precision: culture_region, location_name: 新加坡 · 龟屿岛, culture_region: 东南亚 · 新加坡}
    location_note: 坐标为龟屿岛的区域参考点；不同版本描述的落水地点并不相同。
    paragraphs:
      - 一种龟屿故事说，华人与马来渔人在海上遇险，一只大龟把他们送到安全的地方；另一版本则说，大龟索性化成小岛，让落水的船员站上龟背。
      - 岛上今天有大伯公庙和马来 Keramat 圣祠，每年有信众前来。新加坡国家文物局介绍这些故事与朝圣的联系，同时指出岛屿和圣祠的由来还有其他讲法。
      - 海上救援、岛名和多社群共同到访的记忆在这里交织，但不必把其中某一个版本当成所有人的唯一讲法。
    sources:
      - {citation: 'National Heritage Board Singapore, Pilgrimage to Kusu Island.', type: institutional_account, url: 'https://www.roots.gov.sg/ich-landing/ich/pilgrimage-to-kusu-island', locator: 救人龟、岛屿传说与朝圣}
      - {citation: 'National Library Board Singapore, The Origin Stories of Keramat Kusu.', type: institutional_account, url: 'https://biblioasia.nlb.gov.sg/all-sections/vol-18-issue-4-jan-mar-2023-shrines-keramat-kusu/', locator: 圣祠来源的不同记录}
    bridge: {entry: REL-5-0002, cluster: sid_myth, trail: all, label: 龟屿故事与跨社群朝圣, rationale: 从海龟救人和岛上庙祠出发，阅读多社群信仰如何在同一地点并存。}
  - id: case_la_champasak_nakasang_phi_pop
    title: 老挝南部｜被传言驱逐后抵达纳卡桑
    aliases: [Nakasang, Phi Pop, ຜິປອບ, 噬食之灵]
    genre: historical_archive
    location: {lat: 14.0004, lng: 105.925, precision: city, location_name: 老挝占巴塞省 · 纳卡桑地区, culture_region: 东南亚 · 老挝}
    location_note: 点位为纳卡桑所在的湄公河沿岸地区参考，不标识任何个人或住址。
    paragraphs:
      - 老挝一些地方讲述一种名为 Phi Pop 的危险灵体，人们有时用它解释疾病或不幸。被怀疑与灵体有关的人可能遭到邻里排斥，甚至不得不离开原来的村子。
      - 地理学者 Ian Baird 通过田野研究记录，湄公河边的纳卡桑及周边一些村落会接纳从别处被驱逐的人；在这里，故事不只是夜谈，也会影响一个人能否留下、求助和重新生活。
      - 研究讨论的是信念和社会对待人的方式，不应把传闻用于指认现实中的任何人。
    sources:
      - {citation: 'Ian G. Baird, Where Do the Ravenous Spirits Go? Southeast Asian Studies 13(1), 2024.', type: academic_article, url: 'https://englishkyoto-seas.org/2024/04/vol-13-no-1-ian-g-baird/', doi: '10.20495/seas.13.1_109', locator: 纳卡桑田野研究与接纳被排斥者}
    bridge: {entry: HIS-6-0002, cluster: sid_witch, trail: all, label: 灵体传闻与田野中的人, rationale: 从纳卡桑的田野研究出发，阅读信念、迁移与受访者生活之间的关系。}
  - id: case_vn_hcm_museum_hua_daughter
    title: 胡志明市｜美术馆旧宅里的白衣传闻
    aliases: [Hui Bon Hoa mansion, 许家女儿, 美术馆鬼故事]
    genre: urban_legend
    credibility_tier: B
    location: {lat: 10.7696, lng: 106.6995, precision: city, location_name: 越南 · 胡志明市第一郡, culture_region: 东南亚 · 越南}
    location_note: 坐标为胡志明市美术馆所在街区的参考点；传闻中的房间没有可核实的位置。
    paragraphs:
      - 胡志明市美术馆所在的旧宅，常出现在一则家族怪谈中：有人说深夜听见楼上传来哭声，也有人说走廊里飘过白色身影。传闻给她安排了不同的身世，故事越传越长。
      - 一种版本说，佣人曾从门上的小孔向房里送饭；另一个细节是白衣和玩偶。这些画面将一座真实旧宅变成城市想象中的密室，但并不能证明人物遭遇确曾发生。
      - 当地媒体整理故事时明确说明，材料多来自论坛和个人网站，人名与年代可能被改写。美术馆的建筑史和鬼故事因此需要分开追溯。
    sources:
      - {citation: 'Dang Bui, Saigon Urban Legends: The Ghost of the Fine Arts Museum, Saigoneer, 2014.', type: journalism, url: 'https://saigoneer.com/saigon-culture/1922-saigon-urban-legends-the-ghost-of-the-fine-arts-museum', locator: 旧宅故事及编辑对来源的说明}
    bridge: {entry: SOC-5-0005, cluster: sid_liminal, trail: trail5, label: 旧宅怪谈与来源核对, rationale: 比较美术馆旧宅与论坛转述，阅读报道如何交代来源不明和版本改写。}
  - id: case_vn_hue_1885_ghost_memory
    title: 越南顺化｜城池失守后的祭奠与传闻
    aliases: [Huế Citadel, '1885', 顺化孤魂记忆]
    genre: historical_archive
    location: {lat: 16.4667, lng: 107.5833, precision: city, location_name: 越南 · 顺化市, culture_region: 东南亚 · 越南中部}
    location_note: 顺化市为研究中的城市参考点；访谈和祭奠涉及城内多个场所。
    paragraphs:
      - 1885 年顺化城失守留下大量伤亡。后来，关于无人认领的亡者、夜里听见的声音以及为他们准备供品的讲述，在城市街巷和纪念场所继续流传。
      - 顺化学者在 2022 至 2024 年间进行了 42 次深度访谈，研究不同讲述如何保存、解释和重组这段历史；城中纪念活动与民间版本并不总是说同一件事。
      - 这条档案把战争史、今日祭奠和鬼故事放在同一条阅读线上，同时保留它们各自不同的证据与叙述位置。
    sources:
      - {citation: 'Hoang Huu Phuoc, Contemporary Ghost Legends Associated with the Fall of Huế Citadel in 1885, HNUE Journal of Science, 2025.', type: academic_article, url: 'https://hnuejs.edu.vn/ss/article/download/897/454/5795', doi: '10.18173/2354-1067.2025-0018', locator: 42 次访谈、城池记忆与当代传说}
    bridge: {entry: HIS-6-0007, cluster: sid_liminal, trail: all, label: 顺化鬼故事与公共记忆, rationale: 将访谈中的传说与纪念实践并读，观察一段战争历史如何在不同场所被记住。}
  - id: case_id_jakarta_prapanca_potato_house
    title: 雅加达｜夜里飘出土豆味的房子
    aliases: [Rumah Kentang, 土豆屋, Prapanca]
    genre: urban_legend
    credibility_tier: B
    location: {lat: -6.2088, lng: 106.8456, precision: city, location_name: 印度尼西亚 · 雅加达, culture_region: 东南亚 · 印度尼西亚}
    location_note: 雅加达市中心为城市参考点，传闻地点在南雅加达的 Prapanca 一带，未标示私人房屋。
    paragraphs:
      - 南雅加达流传着“土豆屋”的名字：路过的人说，空屋附近有时会飘出煮土豆的气味。另一种讲述把味道和过去一家人的不幸联系起来，越到夜里，气味越让人不安。
      - 雅加达媒体在 2010 年将它列为未经证实的城市传说，2019 年再访时又写到周边街区的发展改变了人们对地点的感受。它后来也进入电影，成为可以被反复改写的城市故事。
      - 房子的称呼、报刊记录与影视改编可以核对；关于具体家庭和灵异原因的转述则没有因此得到证明。
    sources:
      - {citation: 'The Jakarta Post, Ghost tales underline Jakartan love for absurdities, 2010.', type: journalism, url: 'https://www.thejakartapost.com/news/2010/03/27/ghost-tales-underline-jakartan-love-absurdities', locator: Rumah Kentang 的早期报刊转述}
      - {citation: 'The Jakarta Post, Urban development drives eeriness out of scary places, 2019.', type: journalism, url: 'https://www.thejakartapost.com/news/2019/10/31/urban-development-drives-eeriness-out-scary-places', locator: 气味传闻、街区变化和电影}
    bridge: {entry: LIT-2-0006, cluster: sid_liminal, trail: trail5, label: 土豆味与城市空间叙事, rationale: 从一座房子的气味和街区变化出发，阅读日常感官如何成为城市故事的场景。}
  - id: case_my_karak_yellow_beetle
    title: 马来西亚加叻公路｜总在前面的黄色甲壳虫
    aliases: [Karak Highway, yellow Volkswagen, 黄色甲壳虫]
    genre: urban_legend
    credibility_tier: B
    location: {lat: 3.3511, lng: 101.7918, precision: culture_region, location_name: 马来西亚 · 云顶森巴一带, culture_region: 东南亚 · 马来西亚}
    location_note: 云顶森巴附近为吉隆坡—加叻公路的路线参考点，不代表任何一场遭遇的具体位置。
    paragraphs:
      - 夜里开车经过加叻公路，前面是一辆走得很慢的黄色甲壳虫。司机超车后松了口气，拐过弯却又看到同一辆车；有的版本还说，经过时发现驾驶座上没有人。
      - 马来西亚报刊把它列为公路上长期流传的故事，与白衣搭车人等不同版本并列。2019 年汽车品牌也拍过借用这一传闻的万圣节短片，故事又从车内夜谈走进了广告影像。
      - 公路和短片可以查到，黄色车反复出现则是传闻中的情节；不同讲述对车出现的方式并不完全一致。
    sources:
      - {citation: 'The Star, The great Malaysian haunts, 2026.', type: journalism, url: 'https://www.thestar.com.my/news/focus/2026/10/11/the-great-malaysian-haunts', locator: 加叻公路黄色汽车与其他版本}
      - {citation: 'Volkswagen Malaysia, The Legend of the Yellow Beetle, 2019.', type: video, url: 'https://www.youtube.com/watch?v=40Kcl7TjF08', locator: 借用公路传闻的万圣节短片}
    compare: [case_ba_zenica_road_ghosts]
    bridge: {entry: LIT-2-0005, cluster: sid_liminal, trail: trail5, label: 公路重复遭遇与叙事时间, rationale: 从不断回到前方的黄色车进入叙事时间阅读，比较夜谈与影像改编的重复结构。}
  - id: case_my_lenggong_sang_kelembai
    title: 玲珑谷｜洞里被说成石头的人
    aliases: [Gua Puteri, Gua Kajang, Sang Kelembai, 玲珑谷]
    genre: folktale
    location: {lat: 5.126, lng: 100.981, precision: culture_region, location_name: 马来西亚霹雳州 · 玲珑谷, culture_region: 东南亚 · 马来西亚}
    location_note: 玲珑谷为洞穴遗址所在的区域参考点，不指向洞内人骨或考古发掘点。
    paragraphs:
      - 玲珑谷的 Gua Puteri 洞中，石灰岩形成的形状让人联想到动物和并坐的新人。地方传说说，这些形象原本是活物，被名叫 Sang Kelembai 的灵体变成了石头。
      - 马来西亚国家遗产部门在介绍这则洞穴故事的同时，也记录附近 Gua Kajang 的陶片、石器与人骨发现。这是同一山体里的不同洞穴，故事和考古记录回答的问题也不同。
      - 地方故事赋予岩洞可讲述的形象；石笋的形成和邻近遗址的年代则有各自的地质与考古资料。
    sources:
      - {citation: 'Department of National Heritage Malaysia, Caves in the Lenggong Valley.', type: official_archive, url: 'https://www.heritage.gov.my/en/kraf.html?catid=17%3Ainfo-jwn&id=44%3Aarkeologi-penyelidikan-arkeologi-di-malaysia-lembah-warisan-lenggong-perak-gua-kajang-gua-ngaum-gua-asar-gua-teluk-kelawar&view=article', locator: Gua Puteri 传说与邻近洞穴考古发现}
      - {citation: 'UNESCO, Archaeological Heritage of the Lenggong Valley nomination.', type: institutional_account, url: 'https://whc.unesco.org/uploads/nominations/1396.pdf', locator: 玲珑谷洞穴与遗址位置}
    compare: [case_is_reynisfjara_petrified_troll_stacks]
    bridge: {entry: HIS-6-0001, cluster: sid_crypt, trail: all, label: 洞穴传说与考古材料, rationale: 并读洞穴的地方传说和考古资料，比较不同来源如何解释同一处遗址。}
  - id: case_ph_pagbilao_calibuyboy_bridge
    title: 菲律宾帕格比劳｜古桥上的三个身影
    aliases: [Calibuyboy Bridge, Pagbilao, 古桥鬼故事]
    genre: urban_legend
    location: {lat: 14.0, lng: 121.75, precision: city, location_name: 菲律宾奎松省 · 帕格比劳, culture_region: 东南亚 · 菲律宾吕宋}
    location_note: 帕格比劳市镇为古桥所在地区的参考点，并非某座桥面上的精确位置。
    paragraphs:
      - 帕格比劳和塔亚巴斯之间有几座旧石桥。地方讲述把其中一座 Calibuyboy 桥与三个夜间形象联系起来：长相奇异的孩子、吸烟的 Tikbalang，以及悄悄走过桥面的白衣女子。
      - 当地政府的文化遗产介绍同时记下桥梁与殖民时期强制劳动的历史。今天人们仍会经过这条路，桥的用途、保存状况和后来的怪谈都成为地方记忆的一部分。
      - 本条记录当地旅游资料中的故事版本；它不会把传闻中的人物当作已证实的现场目击。
    sources:
      - {citation: 'Municipality of Pagbilao, Cultural Built Heritage: Calibuyboy Bridge.', type: official_archive, url: 'https://tourism.pagbilao.gov.ph/Immovable.html', locator: 古桥历史与三个地方传闻}
    compare: [case_cn_hk_taipo_chung_tsai_yuen_bridge]
    bridge: {entry: ARC-4-0009, cluster: sid_liminal, trail: trail5, label: 古桥、交通与地方故事, rationale: 将桥梁的遗产介绍和夜间故事并读，观察交通设施如何承载多层地方记忆。}
  - id: case_tl_dili_grandfather_crocodile
    title: 东帝汶｜鳄鱼祖父与海上的孩子
    aliases: [Lafaek Diak, Grandfather Crocodile, 帝汶岛起源]
    genre: myth
    location: {lat: -8.5569, lng: 125.5603, precision: city, location_name: 东帝汶 · 帝力, culture_region: 东南亚 · 东帝汶}
    location_note: 帝力是东帝汶的城市参考点；故事涉及整个帝汶岛，不对应单一海岸。
    paragraphs:
      - 一名孩子救起搁浅的小鳄鱼，把它送回海里。后来鳄鱼长大，载着孩子越过大海；在一种讲述中，它临终时告诉孩子，自己的身体会化成一座可以居住的岛。
      - 这个故事常被用来讲述帝汶岛的形状以及人们称鳄鱼为“祖父”的缘由。东帝汶官方资料和生物多样性报告都记录了这种关系，也显示它在不同社群的讲述和实践中有不同细节。
      - 同一动物既存在于地方创世叙事中，也生活在真实的河海环境里；这两条阅读线可以并行展开。
    sources:
      - {citation: 'Timor-Leste Tourism, The Crocodile That Became an Island.', type: institutional_account, url: 'https://timorleste.tl/stories/crocodile-legends', locator: 孩子与祖父鳄鱼的地方故事}
      - {citation: 'Timor-Leste, Fifth National Report to the Convention on Biological Diversity.', type: official_archive, url: 'https://www.cbd.int/doc/world/tl/tl-nr-05-en.pdf', locator: 鳄鱼、地方文化与生物多样性}
    bridge: {entry: BIO-5-0008, cluster: sid_myth, trail: all, label: 鳄鱼祖父与河海栖息地, rationale: 并读帝汶岛起源故事与动物栖息地知识，保留地方文化和生态观察各自的语境。}
  - id: case_mv_male_rannamaari
    title: 马累｜海上灯船与兰纳马里
    aliases: [Rannamaari, Ranna Māri, 马尔代夫海灵]
    genre: folktale
    location: {lat: 4.1755, lng: 73.5093, precision: city, location_name: 马尔代夫 · 马累, culture_region: 南亚 · 马尔代夫}
    location_note: 马累是相关历史叙述中的城市参考点，不表示海灵出现的具体海域。
    paragraphs:
      - 马尔代夫的一种讲述里，海上每月出现一艘灯火通明的船，人们认为那是名为兰纳马里的海灵。故事将岛民的恐惧、献祭与后来驱逐海灵的宗教人物连成一段情节。
      - 研究者将这一故事与伊本·白图泰在十四世纪记下的马尔代夫叙述及后来的地方版本对照，讨论不同文学传统如何进入这则宗教转变传说。
      - 海上灯船是故事里的形象；它与实际历史中的宗教变迁有关，却不能单凭故事断定每个情节都曾发生。
    sources:
      - {citation: 'Thoiba Saeedh and R. Michael Feener, Religious entanglements with the politics of infrastructure in the Maldives, Modern Asian Studies, 2024.', type: academic_article, url: 'https://www.cambridge.org/core/services/aop-cambridge-core/content/view/D96DFD9EE1DD1B9FFFCA04DA2DA2BAE4/S0026749X23000422a.pdf/religious-entanglements-with-the-politics-of-infrastructure-in-the-maldives.pdf', doi: '10.1017/S0026749X23000422', locator: 兰纳马里叙述与不同文本传统}
      - {citation: 'Xavier Romero-Frias, The Maldive Islanders, Kyoto University repository.', type: academic_book, url: 'https://maritimeasiaheritage.cseas.kyoto-u.ac.jp/wp-content/uploads/2022/03/Xavier-Romero-Frias-The-Maldive-Islanders-Book.pdf', locator: 马尔代夫海灵故事与伊本·白图泰文本}
      - {citation: 'Maldives National University, Folk Tales of the Maldives: Ranna Māri.', type: institutional_account, url: 'https://saruna.mnu.edu.mv/server/api/core/bitstreams/d096509f-4d5a-4552-aa85-abd9bfe72c2c/content', locator: 海灵与灯船的故事版本}
    bridge: {entry: HIS-6-0009, cluster: sid_myth, trail: all, label: 海灵故事与文本流传, rationale: 比较旅行记、地方故事和现代研究对海灵叙述的处理，留意版本的先后与差异。}
  - id: case_np_kathmandu_ban_jhakri
    title: 尼泊尔｜森林里的班贾克里
    aliases: [Ban Jhakri, Banjhakri, 森林萨满]
    genre: folktale
    location: {lat: 27.7172, lng: 85.324, precision: city, location_name: 尼泊尔 · 加德满都, culture_region: 南亚 · 尼泊尔}
    location_note: 加德满都为尼泊尔城市参考点；班贾克里故事流传在更广泛的山地和森林社群。
    paragraphs:
      - 尼泊尔一些讲述把班贾克里描述成住在森林里的灵体：它既像人，也带有动物特征，能够把某些孩子带进山林，教他们以后成为萨满所需的知识。
      - 其他传承则说，萨满可以从家人学习，或通过修习得到能力。关于班贾克里的故事只是这些地方传统中的一种，并非所有实践者都用相同方式解释自己的经历。
      - 特里布文大学研究者介绍了 Jhankri 在社区仪式、音乐和传统照护中的角色；这个故事提供了进入地方知识与师承关系的入口。
    sources:
      - {citation: 'Peshal Dahal, The Jhankri Tradition: A Living Heritage of Nepal, ICH Courier, 2012.', type: academic_article, url: 'https://ichcourier.unesco-ichcap.org/board.es?act=view&bid=A102&list_no=460&mid=a10501000000', locator: 班贾克里与尼泊尔萨满传统}
      - {citation: 'Uttam Paudel, Re-Understanding Banjhakri: Forest Shaman as a Therapeutic Ally and a Social Equalizer, Nepalese Culture 18, 2025.', type: academic_article, url: 'https://www.nepjol.info/index.php/nc/article/download/78281/59943/225370', doi: '10.3126/nc.v18i1.78281', locator: 森林灵体与不同地方讲述}
    bridge: {entry: REL-5-0004, cluster: sid_myth, trail: all, label: 森林灵体与知识传承, rationale: 从班贾克里的不同故事进入地方传统照护和师承，注意讲述者与实践语境。}
  - id: case_jm_buff_bay_rolling_calf
    title: 牙买加布夫湾｜拖着铁链的夜行牛
    aliases: [Rolling Calf, 滚动牛犊, Buff Bay]
    genre: folktale
    credibility_tier: B
    location: {lat: 18.2329, lng: -76.6612, precision: city, location_name: 牙买加 · 布夫湾, culture_region: 加勒比 · 牙买加}
    location_note: 布夫湾是民俗档案记录讲述来源的城镇参考点，不代表某次夜间遭遇的地点。
    paragraphs:
      - 牙买加的夜间故事里，有一种叫 Rolling Calf 的灵体。有的讲述让它像牛犊一样出现在路上，伴着铁链声；有人说它与生前不诚实或残酷的人有关。
      - 底特律慈悲大学的民俗档案保存了一条来自布夫湾的短记录，把这个形象与屠夫的职业联系起来。牙买加媒体后来也记录了不同人口中的外形和遭遇。
      - 这些材料让人看到一个故事如何从地方讲述进入档案与报刊，而不是把每个版本都合成同一次目击。
    sources:
      - {citation: 'University of Detroit Mercy, James T. Callow Folklore Archive: Rolling Calf.', type: institutional_account, url: 'https://libraries.udmercy.edu/find/special_collections/digital/cfa/index.php?fl_id=7772', locator: 布夫湾讲述者的简短记录}
      - {citation: 'Jamaica Star, The rolling calf with blazing-red eyes, 2019.', type: journalism, url: 'https://jamaica-star.com/article/features/20191018/ching-ching-ching-rolling-calf-blazing-red-eyes', locator: 当代牙买加报刊中的转述}
      - {citation: 'Walter Jekyll, Jamaican Song and Story, 1907, Project Gutenberg edition.', type: primary_text, url: 'https://www.gutenberg.org/ebooks/35410', locator: 牙买加 duppy 与 Rolling Calf 采录}
    compare: [case_gt_guatemala_cadejo]
    bridge: {entry: HIS-6-0002, cluster: sid_hag, trail: all, label: 夜行牛与讲述来源, rationale: 比较民俗档案中的采录地点和后来媒体故事，留意讲述者、细节与传播场合。}
  - id: case_gt_guatemala_cadejo
    title: 危地马拉｜跟在夜路后面的狗
    aliases: [El Cadejo, 黑犬白犬, 中美洲夜犬]
    genre: folktale
    location: {lat: 14.6349, lng: -90.5069, precision: city, location_name: 危地马拉 · 危地马拉城, culture_region: 中美洲 · 危地马拉}
    location_note: 危地马拉城是全国性故事的城市参考点；Cadejo 的版本流传于中美洲不同地区。
    paragraphs:
      - 夜里独自行路时，有人说会听见身后有狗跟着。在危地马拉的一种版本中，浅色的 Cadejo 保护走夜路的人，黑色的则带来危险；到底遇到哪一只，与讲述者对行人目的的判断有关。
      - 危地马拉国家通讯社将它与当地其他夜谈一起介绍，强调这是不同世代口口相传的故事。中美洲其他地方也有 Cadejo，但颜色、性情和结尾并不总是一致。
      - 一条普通夜路因此成了道德劝诫、地方恐惧和保护愿望交织的场景。
    sources:
      - {citation: 'Agencia Guatemalteca de Noticias, Las leyendas populares de Guatemala, 2021.', type: institutional_account, url: 'https://agn.gt/las-leyendas-populares-de-guatemala/', locator: 黑白 Cadejo 的地方版本}
      - {citation: 'Municipalidad de Palencia, Creencias: el Cadejo.', type: official_archive, url: 'https://munipalencia.gob.gt/index.php/2016/10/27/creencias/', locator: 中美洲城乡流传的夜犬}
    bridge: {entry: LIT-2-0006, cluster: sid_liminal, trail: all, label: 夜犬与道路场景, rationale: 从黑白夜犬的不同结局阅读故事场景，比较夜路如何承载警告和保护的想象。}
  - id: case_tt_port_of_spain_la_diablesse
    title: 特立尼达｜长裙藏住的一只蹄
    aliases: [La Diablesse, 魔女, 加勒比夜路]
    genre: folktale
    location: {lat: 10.6596, lng: -61.5086, precision: city, location_name: 特立尼达和多巴哥 · 西班牙港, culture_region: 加勒比 · 特立尼达和多巴哥}
    location_note: 西班牙港为岛上故事的城市参考点，传说并不局限于城市或某条道路。
    paragraphs:
      - 夜路上，一位穿长裙、戴宽檐帽的女子向行人招呼。故事里的她有一只普通的脚，另一只却是分叉的蹄；当对方察觉裙摆下的秘密时，自己可能已经走离原来的路。
      - 特立尼达和多巴哥国家图书馆保存了 La Diablesse 的服饰和民俗资料。她既在口头故事里迷惑行人，也进入狂欢节服装与当代表演。
      - 不同讲述对外貌和结局各有变化；长裙和蹄则成为读者辨认这一形象的常见线索。
    sources:
      - {citation: 'National Library and Information System Authority, Trinidad and Tobago folklore: La Diablesse.', type: institutional_account, url: 'https://www.nalis.gov.tt/blog/caribbean-folklore-part-3/', locator: 外形、蹄与加勒比民俗}
      - {citation: 'National Library and Information System Authority, La-Diablesse collection record.', type: institutional_account, url: 'https://library2.nalis.gov.tt/gsdl/cgi-bin/library.cgi?a=d&cl=CL4.1&d=HASH01f6ea9f0c5dcd0c2d204572', locator: 民俗人物和传统服饰}
      - {citation: 'Kemi Peters, Cultural Identities and Creative Expressions, University of the West Indies undergraduate thesis, 2022.', type: academic_thesis, url: 'https://uwispace.sta.uwi.edu/bitstreams/b55d4d5b-baa7-4d42-84ef-bdf2dcac92fe/download', locator: La Diablesse 与民俗艺术表现}
    compare: [case_ma_tangier_aisha_qandisha]
    bridge: {entry: REL-5-0006, cluster: sid_witch, trail: all, label: 夜路女子与狂欢节服饰, rationale: 对读口述人物和图书馆保存的服饰资料，观察民俗形象如何进入公共表演。}
  - id: case_mn_gobi_death_worm
    title: 蒙古戈壁｜沙下的奥尔戈伊蠕虫
    aliases: [Mongolian Death Worm, Olgoi-Khorkhoi, 戈壁死虫]
    genre: folktale
    credibility_tier: B
    location: {lat: 43.5708, lng: 104.425, precision: city, location_name: 蒙古 · 达兰扎德嘎德, culture_region: 东亚 · 蒙古戈壁}
    location_note: 达兰扎德嘎德是南戈壁省的城市参考点；故事所说的沙漠范围远大于此。
    paragraphs:
      - 蒙古戈壁的传闻里，沙下藏着一条粗壮、暗红色的虫，人们称它为 Olgoi-Khorkhoi。故事对它的长度和危险能力有不同说法，但共同的场景往往是空旷而难以寻找踪迹的沙地。
      - 探险家 Roy Chapman Andrews 在二十世纪二十年代向英语读者转述过当地关于它的说法；后来节目、探险报道和小说又使形象不断变化。美国公共电视的介绍对照了传闻和寻找证据的尝试。
      - 地图标的是戈壁地区的参考城市，不是发现地点；这条资料保存的是有关未知生物的讲述和传播史。
    sources:
      - {citation: 'PBS Monstrum, Death Worms: Fact or Fiction?', type: institutional_account, url: 'https://www.pbs.org/video/death-worms-fact-or-fiction-ruz8iy/', locator: 戈壁传闻与二十世纪传播}
      - {citation: 'Associated Press, Scary stories from around the world, 2024.', type: journalism, url: 'https://apnews.com/article/22426b638b79e06b1aa997125e72abd3', locator: 蒙古故事与 Andrews 的转述}
    bridge: {entry: BIO-5-0008, cluster: sid_crypt, trail: all, label: 戈壁传闻与沙漠栖息地, rationale: 从戈壁里的未知生物故事进入栖息地阅读，区分讲述、探索报道与动物观察。}
