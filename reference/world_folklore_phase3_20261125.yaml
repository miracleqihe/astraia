records:
  - id: case_sa_rubalkhali_jinn_lore
    title: 鲁卜哈利沙漠｜沙丘鸣响、废城传说与精灵夜谈
    aliases: [Rub' al-Khali, Empty Quarter, Ubar, 鲁卜哈利, 乌巴尔, 阿拉伯精灵]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 19.8, lng: 50.5, precision: culture_region, location_name: 沙特阿拉伯 · 鲁卜哈利沙漠腹地（区域参考）, culture_region: 中东与西亚 · 阿拉伯半岛}
    location_note: 坐标取阿拉伯半岛南部鲁卜哈利沙漠腹地作文化地理参考，不指向具体的沙丘鸣响地点或考古遗址坐标。
    paragraphs:
      - 横跨阿拉伯半岛南部的鲁卜哈利沙漠（意为“空域”）自古被贝都因口述视为人迹罕至的荒原边界。在当地民间叙事中，极度干旱与无人沙海常被说成精灵（Jinn）与食尸鬼出没的领地，商旅夜间听见沙丘发出低沉嗡鸣或鼓声，便将其解释为荒原精灵试图诱人偏离驼道的呼唤。
      - 与沙海精灵共生的还有“沙中失落之城”乌巴尔（Ubar）的传说：叙事把乳香贸易带来的繁华与后来的毁灭相连，描绘城市因傲慢遭神罚而整体没入黄沙。二十世纪九十年代初，研究团队借助 NASA 卫星光学与成像雷达辨识出深沙下的古商道汇集点，并在阿曼佐法尔省希斯尔（Shisr）发掘出古代贸易堡垒遗址，发现其坍塌与地下石灰岩溶洞及水位下降有关。
      - 将地理声学现象、太空考古成果与阿拉伯精灵传说并读，能够分开三个层面：风沙摩擦产生的物理鸣响、商站因地质塌陷而废弃的考古事实，以及地方社会在极端荒漠环境下编织的敬畏与警戒故事。
    sources:
      - {citation: 'Encyclopædia Britannica, Rubʿ al-Khali.', type: institutional_account, url: 'https://www.britannica.com/place/Rub-al-Khali', locator: 阿拉伯半岛南部沙漠地理与勘探史}
      - {citation: 'Encyclopædia Britannica, Jinni.', type: institutional_account, url: 'https://www.britannica.com/topic/jinni', locator: 前伊斯兰及阿拉伯民间信仰中的精灵概念与荒原栖居说}
      - {citation: 'Pola Lem, Peering through the Sands of Time: Searching for the Origins of Space Archaeology, NASA Earth Observatory.', type: official_archive, url: 'https://earthobservatory.nasa.gov/features/SpaceArchaeology', locator: 遥感古商道、希斯尔遗址与乌巴尔传说的考古对照}
    compare: [case_egypt_jinn_sleep_paralysis, case_et_harar_hyena_jinn]
    motifs: [index_ocm_776]
    bridge: {entry: GEO-LAND-0008, cluster: sid_liminal, trail: all, label: 沙漠荒原、鸣沙与精灵想象, rationale: 将阿拉伯沙漠精灵夜谈、乌巴尔考古遥感与风成沙丘地貌知识并读，区分自然声学、遗址塌陷与民间叙事。}

  - id: case_ir_alborz_simurgh_lore
    title: 厄尔布尔士山脉｜《列王纪》中的神鸟西摩格
    aliases: [Simurgh, Sīmorḡ, Shahnameh, 西摩格, 萨尔, 厄尔布尔士山]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 35.9511, lng: 52.1096, precision: culture_region, location_name: 伊朗 · 厄尔布尔士山脉（区域参考）, culture_region: 中东与西亚 · 伊朗高原}
    location_note: 坐标取伊朗北部厄尔布尔士山脉中段作文化参考；古代文献中的阿尔布尔兹神山兼有宇宙论象征，不限于现代山体。
    paragraphs:
      - 在伊朗高原的古代文献与史诗叙事里，西摩格（Simurgh，中古波斯语 sēnmurw）是一只栖息于厄尔布尔士山巅的巨型神鸟。语源学追溯至阿维斯陀语的“萨埃纳鸟”，早期萨珊艺术常将其刻画为兼有禽翼、狗首或狮爪的复合神兽；在菲尔多西十世纪末的波斯史诗《列王纪》中，它进一步成为通晓医术与人言的庇护者。
      - 最广为流传的情节围绕英雄萨尔（Zal）展开：萨尔出生时满头白发，父亲萨姆因迷信将其遗弃在厄尔布尔士山坡，西摩格发现并叼回巢中抚养。父子重逢时，神鸟赠予一枚羽毛，嘱咐遇险焚羽即可召来救援；后来萨尔的妻子鲁达芭因胎儿过大难产，正是焚羽召来西摩格传授剖腹产方略与草药，救下英雄罗斯塔姆母子。
      - 不过，波斯传统里的西摩格并非单一面貌。《列王纪》另有一则英雄伊斯凡迪亚尔斩杀食人凶禽西摩格的试炼，而十二世纪苏菲诗人阿塔尔则在《百鸟朝凤》里借谐音“三十只鸟”（sī murḡ）将其转写为灵性合一的隐喻。同一神鸟在不同文体中承担护佑、试炼与神秘主义象征三重角色。
    sources:
      - {citation: 'Hanns-Peter Schmidt, Sīmorḡ, Encyclopædia Iranica.', type: academic_article, url: 'https://www.iranicaonline.org/articles/simorg', locator: 阿维斯陀语源、萨珊艺术图像及《列王纪》双重形象}
      - {citation: 'Wilhelm Eilers, Alborz i. The Name, Encyclopædia Iranica.', type: academic_article, url: 'https://www.iranicaonline.org/articles/alborz-name/', locator: 厄尔布尔士山名语源与波斯神话地理演变}
      - {citation: 'Encyclopædia Britannica, Shāh-nāmeh.', type: institutional_account, url: 'https://www.britannica.com/topic/Shah-nameh', locator: 菲尔多西史诗结构、萨尔与罗斯塔姆故事脉络}
    motifs: [index_berezkin_k38c, index_ocm_776]
    bridge: {entry: LIT-1-0003, cluster: sid_myth, trail: all, label: 史诗神鸟与文体流变, rationale: 对照阿维斯陀宗教文本、《列王纪》英雄叙事与苏菲诗作，观察同一神话意象如何随诗歌与文体规则转化。}

  - id: case_tr_anatolia_nazar_amulet
    title: 安纳托利亚｜蓝色“恶眼珠”与避邪习俗
    aliases: [Nazar boncuğu, Nazar, Evil eye, 恶眼珠, 土耳其蓝眼睛]
    genre: folktale
    credibility_tier: A
    note_kind: story
    location: {lat: 38.43, lng: 27.36, precision: culture_region, location_name: 土耳其 · 安纳托利亚西部（伊兹密尔区域参考）, culture_region: 中东与西亚 · 土耳其安纳托利亚}
    location_note: 坐标取土耳其西部伊兹密尔近郊传统玻璃珠作坊一带作区域参考，护眼珠习俗通行于整个安纳托利亚与东地中海地区。
    paragraphs:
      - 在安纳托利亚与东地中海的民间观念里，“恶眼”（Nazar 或 göz değmesi）指带有嫉妒、恶意或过度赞美成分的注视，被认为会给新生儿、新居、牲畜乃至新开业店铺带来无形灾厄。为了承接并反弹第一道投来的目光，当地长期使用同心圆眼状的蓝色玻璃护符“纳扎尔珠”（Nazar boncuğu）。
      - 围绕伊兹密尔周边的传统玻璃炉坊（如纳扎尔村），工匠至今以熔融玻璃与铁钎沿袭师徒口传手工制珠。学者对美索不达米亚、乌加里特泥板与古埃及文献的梳理显示，将“有害目光”物化为辟邪护符的做法在古代近东已有深厚渊源，进入安纳托利亚后又与中亚突厥民俗及伊斯兰日常祝祷语相互交织。
      - 现代土耳其民俗学研究同时指出，恶眼珠在旅游商品化与文化工业中成为高度符号化的纪念品，但其民间功能本质上是应对人际羡慕与不确定风险的心理缓冲。佩戴或悬挂护符属于社群文化实践，并不构成任何可检验的物理防护机制。
    sources:
      - {citation: 'Metin Ekici & Pınar Fedakâr, Gelenek, Aktarma, Dönüşüm ve Kültür Endüstrisi Bağlamında Nazar ve Nazar Boncuğu, Millî Folklor 101, 2014.', type: academic_article, url: 'https://dergipark.org.tr/en/pub/millifolklor/issue/74526/1209355', locator: 安纳托利亚恶眼珠传统、玻璃匠艺与文化工业转型}
      - {citation: 'Mustafa Karageçi, Burak Taşdüvenci & Dilek Karageçi, Ugarit, Mısır ve Mezopotamya Kaynaklarına Göre Nazar, Adıyaman Üniversitesi Sosyal Bilimler Enstitüsü Dergisi 18(50), 2025, 739–769.', type: academic_article, url: 'https://dergipark.org.tr/en/pub/adyisosbil/issue/91039/1572970', locator: 古代两河、乌加里特与埃及文献中的恶眼观念溯源}
      - {citation: 'Encyclopædia Britannica, Evil eye.', type: institutional_account, url: 'https://www.britannica.com/topic/evil-eye-superstition', locator: 环地中海与西亚恶眼信仰比较概述}
    bridge: {entry: REL-5-0009, cluster: sid_myth, trail: all, label: 护身珠工艺与嫉妒规避, rationale: 从安纳托利亚玻璃珠作坊与古代近东文献出发，阅读民间器物如何将无形的嫉妒焦虑转化为可佩戴的日常物件。}

  - id: case_se_dalarna_tomte_lore
    title: 瑞典达拉纳｜守望农舍与牲畜的汤姆特
    aliases: [Tomte, Gårdstomte, Nisse, Lillhättgubbe, 汤姆特, 尼瑟, 农舍矮灵]
    genre: folktale
    credibility_tier: A
    note_kind: story
    location: {lat: 60.6065, lng: 15.6355, precision: province, location_name: 瑞典 · 达拉纳省（区域参考）, culture_region: 欧洲 · 北欧瑞典}
    location_note: 坐标取瑞典达拉纳省法伦一带作省级参考；瑞典语言与民俗档案馆记有该地区方言称谓及广泛农庄传说。
    paragraphs:
      - 在瑞典及斯堪的纳维亚乡村记忆里，汤姆特（Tomte 或 gårdstomte，在丹麦、挪威与瑞典南部也称 Nisse）是驻守农庄院落与马厩的矮小灵体。瑞典语言与民俗档案馆（ISOF）的方言资料显示，各地对其称呼丰富多样，在达拉纳省部分方言中被称为“小红帽老头”（lillhättgubbe）。
      - 传统讲述把汤姆特刻画成身披灰呢外衣、戴红帽、身形仅如幼童的老者，有时被视为最早开垦这片土地的先祖精魂。他脾气耿直而严厉，若农人勤勉照料牲畜、在圣诞夜端上一碗浇了黄油的热麦粥，他便会暗中守护牛马与谷仓；反之，若遭怠慢或被挑剔，他就会藏起农具、惊扰马匹甚至转投别家。
      - 直到十九世纪中叶，随着画家与文学作品把灰色农舍守望者、圣尼古拉与北欧圣诞山羊的形象合流，汤姆特才逐渐演变为现代圣诞送礼形象（Jultomten）。将档案口述与后来节庆插画对读，能清楚看见农业伦理精灵怎样转向城市节日符号。
    sources:
      - {citation: 'Institutet för språk och folkminnen (ISOF), Tomtegubbe, Väsen i folktron.', type: official_archive, url: 'https://www.isof.se/lar-dig-mer/kunskapsbanker/lar-dig-mer-om-vasen-i-folktron/vasengalleriet/tomtegubbe', locator: 瑞典农庄精灵传统特征、麦粥供奉与图像演变}
      - {citation: 'Institutet för språk och folkminnen (ISOF), Tomten i dialekterna.', type: official_archive, url: 'https://www.isof.se/lar-dig-mer/kunskapsbanker/lar-dig-mer-om-arets-hogtider/jul/tomten-i-dialekterna', locator: 达拉纳方言称谓 lillhättgubbe 与瑞典各地名称分布}
      - {citation: 'Encyclopædia Britannica, Tomte.', type: institutional_account, url: 'https://www.britannica.com/topic/tomte', locator: 北欧汤姆特与尼瑟的词源、农舍职能及圣诞形象融合}
    compare: [case_ba_bihac_hudam_harmani]
    motifs: [index_ocm_776]
    bridge: {entry: REL-5-0007, cluster: sid_myth, trail: all, label: 农舍守护灵与日常秩序, rationale: 对读北欧方言档案中的农舍精灵与家庭信仰空间，理解供奉礼俗与农务规范怎样维系农庄内部秩序。}

  - id: case_ru_karelia_baba_yaga
    title: 卡累利阿与俄北林区｜林界边缘的芭芭雅嘎
    aliases: [Baba Yaga, Баба-яга, 芭芭雅嘎, 鸡腿小屋]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 61.7850, lng: 34.3469, precision: province, location_name: 俄罗斯 · 卡累利阿林区（区域参考）, culture_region: 欧洲 · 俄罗斯东欧}
    location_note: 坐标取俄罗斯西北部卡累利阿林区作文化参考；芭芭雅嘎故事流传于东斯拉夫广大地区，并非某座单一林屋的位置。
    paragraphs:
      - 在俄罗斯与东斯拉夫民间故事里，芭芭雅嘎居住在密林深处的“鸡腿小屋”中：屋舍由鸟爪般的高柱撑起并不断旋转，门窗常背向来客，周遭还立着人骨篱笆。闯入林地的主角必须念出固定口诀——“小屋呀，背对森林，面向我站好”——屋子才会停转开门。她乘坐木臼飞行，以木杵为桨，并用扫帚抹去行踪。
      - 这位林中老妇极少呈现单纯的善或恶，而是扮演充满矛盾的门槛守卫与考验者。有时她扬言烹食迷路的孩童或继女，但在对方保持礼貌、耐心完成繁重家务并善待林中小动物后，又会赠予火种、宝马或指路线索；在另一些故事里，她甚至承担着检验英雄资格的严苛导师角色。
      - 民俗学家普罗普等学者在形式结构研究中，把芭芭雅嘎的林中小屋解读为成人礼与生死分界的象征空间：高架木屋与古代北方森林葬俗中的架空尸屋颇有呼应，故事借森林边缘这一空间门槛，将少年离开家庭、接受试炼并携宝归来的过程戏剧化。
    sources:
      - {citation: 'Encyclopædia Britannica, Baba Yaga.', type: institutional_account, url: 'https://www.britannica.com/topic/Baba-Yaga', locator: 鸡腿小屋、木臼木杵飞行器及矛盾角色特征}
      - {citation: 'Andreas Johns, Baba Yaga and the Russian Mother, The Slavic and East European Journal 42(1), 1998.', type: academic_article, url: 'https://doi.org/10.2307/310050', doi: '10.2307/310050', locator: 东斯拉夫民间故事中芭芭雅嘎的双重母性形象与考验结构}
      - {citation: 'Juliette Wood, Review of Baba Yaga: The Wild Witch of the East in Russian Fairy Tales, Folklore 126(2), 2015, 238–239.', type: academic_article, url: 'https://doi.org/10.1080/0015587X.2015.1047184', doi: '10.1080/0015587X.2015.1047184', locator: 芭芭雅嘎文本编选与林界叙事研究评述}
    motifs: [index_berezkin_c26, index_berezkin_k89]
    bridge: {entry: LIT-2-0001, cluster: sid_witch, trail: all, label: 森林门槛与考验叙事, rationale: 从鸡腿小屋的转向口诀与双重考验入手，阅读民间故事如何利用空间边界结构推动主角成长。}

  - id: case_ua_dnipro_rusalka_lore
    title: 第聂伯河流域｜水岸、黑麦田与鲁萨尔卡
    aliases: [Rusalka, Русалка, 鲁萨尔卡, 绿周节水灵]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 49.4444, lng: 32.0598, precision: culture_region, location_name: 乌克兰 · 第聂伯河中游流域（区域参考）, culture_region: 欧洲 · 乌克兰东欧}
    location_note: 坐标取乌克兰第聂伯河中游河段作流域参考；鲁萨尔卡故事遍布乌克兰各河流、池塘与麦田交界处。
    paragraphs:
      - 不同于西欧长着鱼尾的美人鱼，乌克兰与东斯拉夫民间传闻中的鲁萨尔卡（Rusalka）拥有双腿，常现身为披散长发、着素白长衫或戴草冠的年轻女子。民族志调查通常将其解释为非正常离世者的游荡魂灵，尤其是溺亡少女、未受洗婴孩或怀恨离世的新娘。
      - 在第聂伯河流域的农耕日历中，鲁萨尔卡与春末夏初的“绿周节”（Rusalii）紧密相连。传说此时她们离开水底，栖息于岸边垂柳与桦树枝头，或在黑麦田间起舞以助庄稼生长；然而她们也会以歌声诱惑独自涉水或夜行的青年，将其拖入深水或“挠痒致死”。村民过河或下田时，常随身携带艾草、大蒜等辟邪植物。
      - 当代斯拉夫民俗学者指出，鲁萨尔卡集结了农时节气、水域危险警示与对未尽生命之痛的集体悼念。十九世纪乌克兰文化复兴先驱甚至以“德涅斯特水仙”（Rusalka Dnistrovaia）命名首部民间文献年鉴，使这一水陆边界灵体进入区域文化记忆。
    sources:
      - {citation: 'Internet Encyclopedia of Ukraine, Rusalka, Canadian Institute of Ukrainian Studies.', type: institutional_account, url: 'https://www.encyclopediaofukraine.com/display.aspx?letr=R&page=Rusalka', locator: 乌克兰民族志中的鲁萨尔卡形象、绿周节禁忌与护身草药}
