  - id: case_it_friuli_benandanti_1575
    title: 意大利弗留利｜1575 年“善行者”夜战审判档案
    aliases: [Benandanti, 善行者, Paolo Gasparutto, Carlo Ginzburg, 夜战]
    genre: historical_archive
    credibility_tier: A
    note_kind: history
    location: {lat: 46.0926, lng: 13.4316, precision: province, location_name: 意大利弗留利 · 奇维达莱与乌迪内地区, culture_region: 欧洲 · 意大利南欧}
    location_note: 坐标取弗留利奇维达莱一带（1575 年首批审讯地点）作区域参考，相关卷宗涉及乌迪内及周边多个村镇。
    temporal: {year_start: 1575, year_end: 1647, era_label: 1575–1647 年弗留利宗教裁判所卷宗时期, uncertainty_note: 1575 年 3 月奇维达莱开始讯问保罗·加斯帕鲁托与巴托洛梅奥·斯加巴里扎，此后数十年的审讯记录反映了证词如何被逐步改写。}
    paragraphs:
      - 1575 年 3 月 21 日，意大利东北部的奇维达莱宗教裁判所展开一场不寻常的调查：农夫保罗·加斯帕鲁托等人平静地供述，凡是“带胎膜降生”的人都会在四季斋日夜间陷入昏睡，灵魂离开躯体，手持茴香茎秆赴野地与巫师作战，以保卫村庄的谷物、葡萄收成并祈求风调雨顺。他们自称为“善行者”（Benandanti）。
      - 历史学家卡洛·金茨堡于二十世纪六十年代发掘这批乌迪内档案，写成微观史名著《夜战》。与常见猎巫案不同，善行者最初并非自认魔鬼仆从，反而认为自己在为基督与农田丰收而战；然而审判官既不理解也不接纳民间口述中的“出神梦境”与巫术之间的界线，执意用欧洲魔鬼安息夜（Sabbat）的教义模版反复盘问。
      - 跨越 1575 年至十七世纪中叶的卷宗揭示了一个清晰的史料演变过程：在长期审讯、拘禁与引导性提问的压力下，后期的受审者逐渐放弃原有的护稼自述，转而“承认”参与魔鬼聚会。这批档案证明了审讯制度如何重塑民间口述记忆，而不能将供词里的夜战神游当作客观发生的超自然事实。
    sources:
      - {citation: 'Carlo Ginzburg, The Night Battles: Witchcraft and Agrarian Cults in the Sixteenth and Seventeenth Centuries, Johns Hopkins University Press.', type: academic_article, url: 'https://press.jhu.edu/books/title/12660/night-battles', locator: 1575 年弗留利审判卷宗重构与善行者夜战研究}
      - {citation: 'Istituto della Enciclopedia Italiana, Ginzburg, Carlo, Dizionario di Storia, Treccani.', type: institutional_account, url: 'https://www.treccani.it/enciclopedia/carlo-ginzburg_%28Dizionario-di-Storia%29/', locator: 《夜战》与十六至十七世纪大众文化与裁判所档案分析}
      - {citation: 'Carlo Ginzburg & Dipesh Chakrabarty, Carlo Ginzburg (Correspondence on historical knowledge and The Night Battles), Postcolonial Studies 14(3), 2011, 347.', type: academic_article, url: 'https://doi.org/10.1080/13688790.2011.621405', doi: '10.1080/13688790.2011.621405', locator: 历史档案中证词与审讯框架的认识论讨论}
