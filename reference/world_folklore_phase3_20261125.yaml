  - id: case_np_khumbu_yeti_lore
    title: 尼泊尔昆布｜夏尔巴寺院与雪人传说
    aliases: [Yeti, Miche, Pangboche, Tengboche, 雪人, 昆布谷地]
    genre: memorate
    credibility_tier: B
    note_kind: legend
    location: {lat: 27.8475, lng: 86.7918, precision: culture_region, location_name: 尼泊尔 · 昆布潘波切与腾波切一带, culture_region: 南亚 · 尼泊尔喜马拉雅}
    location_note: 坐标取昆布谷地潘波切与腾波切寺院所在区域作文化参考；夏尔巴山谷护法与雪人记忆涵盖更广的高海拔藏传佛教圣地（Beyul）。
    paragraphs:
      - 在尼泊尔东北部昆布谷地的夏尔巴口述传统中，高山雪线不仅是放牧与商旅通道，更是莲花生大师庇佑的隐秘圣地（Beyul）。当地称呼的“雪人”（Yeti 或 Miche，意近“人熊”）长期出现在高海拔岩洞与寺院周围的叙述里，与十七世纪宁玛派高僧桑瓦多吉在潘波切闭关时获雪人相助的宗教记忆交织，象征着人与荒野之间的脆弱平衡。
      - 昆布的多座寺院曾珍藏被信众视作雪人遗存的宗教圣物，其中最知名的是昆琼寺的毛皮“头皮”以及潘波切寺的“干尸手掌”。自二十世纪五十年代起，伴随欧美登山队进入珠穆朗玛峰南坡，西方探险界与媒体将这些寺院圣物与雪地巨型脚印视作未知灵长类的实证；1950 年代末甚至出现外部探险者与中间人违规带走潘波切手掌指骨的文物流失风波。
      - 随着高海拔考察和现代分子检测的推进，学界对来自喜马拉雅与青藏高原寺院及私人收藏的所谓雪人毛发、骨骼样品进行了多次比对：2017 年发表于《英国皇家学会学报 B》的线粒体基因组研究显示，多份受检样本实属当地喜马拉雅棕熊、西藏棕熊或黑熊及家犬。科学检验澄清了受检生物样品的物种归属，同时也提醒读者区分实验室标本鉴定与夏尔巴寺院叙事各自的文化位置。
    sources:
      - {citation: 'Tianyi Lan et al., Evolutionary history of enigmatic bears in the Tibetan Plateau–Himalaya region and the identity of the yeti, Proceedings of the Royal Society B 284, 2017.', type: academic_article, url: 'https://royalsocietypublishing.org/doi/10.1098/rspb.2017.1804', doi: '10.1098/rspb.2017.1804', locator: 喜马拉雅所谓雪人遗物样本的线粒体 DNA 鉴定与熊类演化分析}
      - {citation: 'Trafficking Culture, Pangboche Hand, University of Glasgow.', type: academic_article, url: 'https://traffickingculture.org/encyclopedia/case-studies/pangboche-hand/', locator: 潘波切寺“雪人手掌”宗教背景、采样流散与文物归还争议}
      - {citation: 'Michael Ward, Himalayan Scientific Expedition, 1960–61, Alpine Journal, 1961, 343–364.', type: primary_archive, url: 'https://www.alpinejournal.org.uk/Contents/Contents_1961_files/AJ%201961%20343-364%20Ward%20Himalayan%20Science.pdf', locator: 昆布谷地实地考察与雪人足迹及标本记录}
    compare: [case_yeti_khumjung_scalp_1960]
    motifs: [index_berezkin_k100f1]
