  - id: case_in_kerala_sarpakavu_naga
    title: 印度喀拉拉邦｜蛇神圣林“萨帕卡武”与禁忌守护
    aliases: [Sarpakavu, Kaavu, Nagaradhana, 萨帕卡武, 蛇神圣林, 那伽圣林]
    genre: folktale
    credibility_tier: A
    note_kind: story
    location: {lat: 10.5276, lng: 76.2144, precision: province, location_name: 印度 · 喀拉拉邦（圣林文化区参考）, culture_region: 南亚 · 印度喀拉拉邦}
    location_note: 坐标取印度南部喀拉拉邦中部作省级文化参考；萨帕卡武圣林分散坐落于传统大家族宅院与村落周边。
    paragraphs:
      - 在印度南部的喀拉拉邦，许多传统大家族宅院（Taravad）旁曾保留一片不可随意砍伐的小片常绿林，称为“萨帕卡武”（Sarpakavu，意为“蛇神之林”）。林中供奉象征水脉、生育与家族福祉的蛇神那伽（Nagaraja 与 Nagayakshi）石像，周边常配有池塘与禁止惊扰爬行动物的习俗禁忌。
      - 民间叙事与仪式实践紧密相连：在特定节期，社区会请专业诵唱者用天然矿物与植物粉末在林前绘制繁复的蛇神地画（Kalam），伴随“蛇神之舞”（Pambum Thullal）与供奉仪轨，祈求祛除家族灾病或平息冒犯圣林带来的厄运。违背护林禁忌招致惩罚的故事，长期在口述中强化了林地边界。
      - 生态学与宗教学的跨学科田野调查发现，在人口密集且城市化迅速的喀拉拉邦，正是这些敬蛇禁忌使成百上千片小微林地免于农垦与砍伐，为本土植物、两栖类与蛇类保留了关键的生境斑块与水源涵养点。近年来大家族解体与土地分割正令不少圣林萎缩，也促使学者重新评估地方信仰在生物多样性保护中的实际作用。
    sources:
      - {citation: 'Devika B., The Sacred Groves of the Serpent Gods: Sarpakavus of Kerala as Indigenous Ecology, Rupkatha Journal on Interdisciplinary Studies in Humanities 16(1), 2024.', type: academic_article, url: 'https://doi.org/10.21659/rupkatha.v16n1.16', doi: '10.21659/rupkatha.v16n1.16', locator: 喀拉拉邦蛇神圣林的仪式表演、家族体系与本土生态伦理}
      - {citation: 'Félix Landry Yuan, U. Prashanth Ballullaya, Ramesh Roshnath, Timothy C. Bonebrake & Palatty Allesh Sinu, Sacred groves and serpent-gods moderate human–snake relations, People and Nature 2(1), 2020.', type: academic_article, url: 'https://doi.org/10.1002/pan3.10059', doi: '10.1002/pan3.10059', locator: 蛇神信仰如何调节人蛇冲突并维系微生境保护}
    compare: [case_th_mekong_naga_night_fisher, case_br_sao_paulo_curupira]
    motifs: [index_berezkin_h5, index_berezkin_c26]
    bridge: {entry: BIO-5-0009, cluster: sid_myth, trail: all, label: 蛇神圣林与生境斑块, rationale: 将喀拉拉邦敬蛇护林的民间规范与生态栖息地连通性并读，观察宗教禁忌如何客观保留微小生境块。}

  - id: case_ca_ontario_windigo_lore
    title: 加拿大安大略｜阿尔冈昆冬荒禁忌与温迪戈
    aliases: [Windigo, Wendigo, Wiitiko, 温迪戈, 冬荒食人精怪]
    genre: folktale
    credibility_tier: A
    note_kind: story
    location: {lat: 49.7670, lng: -94.4894, precision: province, location_name: 加拿大 · 安大略西北部（文化区域参考）, culture_region: 北美 · 加拿大安大略}
    location_note: 坐标取加拿大安大略西北部北方针叶林区作文化区域参考；温迪戈故事流传于五大湖及亚北极多支阿尔冈昆语民族之间。
    paragraphs:
      - 在安大略省及北美亚北极森林的奥吉布瓦、克里等阿尔冈昆语原住民族群口述传统里，温迪戈（Windigo，亦拼作 Wendigo 或 Wiitiko）是与严寒、极冬、密林孤立和饥荒紧扣的恐怖存在。它有时被讲述成吞噬人肉的冰心巨人，食量越大身躯越庞大；也有版本强调原本的凡人因在绝境中犯下食人禁忌，或因极端自私贪婪而心化寒冰、异变为温迪戈。
      - 在原住民社群伦理中，温迪戈远非单纯的恐怖怪物，而是关于资源分配与集体求生的警示：北方漫长冬季里，食物匮乏迫使家庭小群分散狩猎，彼此分享与克制私欲是生存底线。讲述者借“贪婪者终将失去人性、沦为孤立食人魔”的叙事，将不共享、不节制界定为危险的越界。
      - 二十世纪人类学与精神医学文献曾围绕所谓“温迪戈精神病”（Windigo psychosis）展开长期争论，学者卢·马拉诺等人在重检档案后批评早年外部观察者混淆了文化内的道德解释框架与临床诊断实体；而当代流行文化把温迪戈改绘为鹿角怪物，往往脱离了阿尔冈昆传统原本的冬荒社会语境。
    sources:
      - {citation: 'Steve Pitt, Windigo, The Canadian Encyclopedia, Historica Canada.', type: institutional_account, url: 'https://www.thecanadianencyclopedia.ca/en/article/windigo', locator: 阿尔冈昆口述中的温迪戈形象、社会禁忌与现代文化挪用辨析}
      - {citation: 'Encyclopædia Britannica, Wendigo.', type: institutional_account, url: 'https://www.britannica.com/topic/wendigo', locator: 北美原住民传说脉络与冬荒食人禁忌概述}
      - {citation: 'Lou Marano, Windigo Psychosis: The Anatomy of an Emic-Etic Confusion, Current Anthropology 23(4), 1982.', type: academic_article, url: 'https://doi.org/10.1086/202868', doi: '10.1086/202868', locator: 文化内部道德叙述与外部医学分类混用的学术反思}
    motifs: [index_berezkin_b33d]
    bridge: {entry: SOC-1-0003, cluster: sid_crypt, trail: all, label: 极寒饥荒禁忌与社群规范, rationale: 从阿尔冈昆严冬共享准则与贪婪戒律切入，理解精怪禁忌如何约束极端资源危机中的个体行为。}

  - id: case_us_point_pleasant_mothman_1966
    title: 波因特普莱森特｜1966 年目击叙述与“叙事劫持”
