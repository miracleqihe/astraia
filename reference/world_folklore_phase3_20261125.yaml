  - id: case_in_ujjain_vetala_cycle
    title: 印度乌贾因｜尸鬼韦塔拉的二十五个谜题
    aliases: [Vetala Panchavimsati, Baital Pachisi, 韦塔拉, 维克拉玛蒂亚, 起尸鬼]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 23.1765, lng: 75.7885, precision: city, location_name: 印度中央邦 · 乌贾因（文学都城参考）, culture_region: 南亚 · 印度中央邦}
    location_note: 坐标取印度中央邦乌贾因（故事框架中维克拉玛蒂亚王的都城）作参考；现存抄本与方言译本流传于克什米尔至北印多地。
    paragraphs:
      - 《韦塔拉二十五故事》（Vetala Panchavimsati，印地语常称 Baital Pachisi）是印度古典叙事传统中极具代表性的套层框架故事。故事以传说中的乌贾因明君维克拉玛蒂亚为主角：他受苦行僧所托，须于暗夜前往火葬场，从树上取下一具附着尸鬼韦塔拉（Vetala）的尸体，且在背负归途中保持绝对沉默。
      - 每当国王背起尸体启程，附体其上的韦塔拉便开始讲述一则奇案或人伦故事，并在结尾抛出一个法律、伦理或继承归属上的两难谜题，同时警告国王若知答案却缄口不言便会头颅爆裂。维克拉玛蒂亚因秉性公正而屡次开口作答，一旦破戒发声，尸鬼便立刻飞回树梢，令整个背尸与解谜循环重复二十五轮。
      - 现存最古老的梵语散韵本保存在十一世纪克什米尔诗人索玛德瓦的《故事海》（Kathasaritsagara）中，另有克什门德拉等人的传本及十九世纪英译本《维克拉姆与吸血鬼》。尸鬼与火葬场为全书提供了奇诡外壳，真正的核心则是以谜题检验王权裁断、宗法伦理与智慧边界。
    sources:
      - {citation: 'Encyclopædia Britannica, Somadeva.', type: institutional_account, url: 'https://www.britannica.com/biography/Somadeva', locator: 《故事海》作者与克什米尔梵语故事集编纂}
      - {citation: 'John T. Platts (trans.), The Baitâl Pachchisi; Or, The Twenty-Five Tales of a Sprite, Project Gutenberg.', type: primary_text, url: 'https://www.gutenberg.org/ebooks/54697', locator: 二十五则韦塔拉谜题框架英译本全文}
      - {citation: 'Vetala Pancavimsatika, Sanskrit text digitized archive, Internet Archive.', type: primary_text, url: 'https://archive.org/details/vetala-pancavimsatika', locator: 梵语《韦塔拉二十五故事》传本文献}
    motifs: [index_berezkin_k27z8, index_berezkin_m196a]
