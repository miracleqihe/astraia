  title: 香港华富邨｜夜里的步操声
  genre: urban_legend
  credibility_tier: B
  theme: corpus_hk_neighborhood_ghosts_and_change_2016_2017
  location:
    lat: 22.2517
    lng: 114.13645
    precision: city
    location_name: 中国香港 · 华富邨范围参考
    culture_region: 东亚 · 中国香港
  map_label: 华富邨
  location_note: 点位代表华富邨公共地区，不指向某栋住宅或电梯。
  temporal:
    year_start: 2016
    year_end: 2016
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 刚搬进华富邨的时候，孩子们记得夜路很暗，楼宇间只有零星的灯光。街坊还会说，夜里听见一阵步操声，甚至传出有人在升降机里看见穿军服的身影。
  - 多年后，两位早期住户接受访问，谈起这些让小时候的他们害怕的传闻；他们也记得搬进有独立厨房和厕所的新家时，家人觉得生活宽敞了许多。
  - 2016 年的采访把鬼故事和住屋改善、偏远街道及盂兰节记忆放在一起。旧街坊听到的说法是社区回忆，不能单凭它确定夜间声响的来源。
  sources:
  - *id001
  - citation: GeoNames：Wah Fu Estate (I & II) 地理参考。
    type: map_reference
    url: https://mapcarta.com/37785262
    locator: 华富邨范围参考坐标 22.25170, 114.13645
