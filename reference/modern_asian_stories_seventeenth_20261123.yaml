  title: 香港瀑布湾｜火龙队伍走到海边
  genre: memorate
  credibility_tier: B
  theme: corpus_hk_neighborhood_ghosts_and_change_2016_2017
  location:
    lat: 22.25063
    lng: 114.13454
    precision: city
    location_name: 中国香港 · 瀑布湾公园参考
    culture_region: 东亚 · 中国香港
  map_label: 瀑布湾
  location_note: 点位为瀑布湾公园区域参考；受访者没有说明当年在海岸的具体位置。
  temporal:
    year_start: 2016
    year_end: 2016
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一位旧街坊回忆，年轻时跟随薄扶林舞火龙的队伍走到瀑布湾海边。天色很暗，有人突然落入海中；爬上岸后，那人说自己像是被谁拉下了水。
  - 同行的人听后有些害怕，队伍很快散了。附近一直有关于水鬼的传言，而受访者同样记得，小时候孩子们会到海边和旧瞭望台玩耍。
  - 2016 年的采访把这一夜与居民对危险海岸的记忆一起记录。落水者的说法来自受访者转述，报道没有给出可核对的具体日期。
