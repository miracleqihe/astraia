themes:
- id: corpus_hk_neighborhood_ghosts_and_change_2016_2017
  title: 城市更新里的鬼故事｜香港街坊与旧建筑
  genre: academic_model
  peers:
  - case_cn_hk_wahfu_marching_lift_2016
  - case_cn_hk_waterfall_bay_fire_dragon_2016
  - case_cn_hk_blake_garden_night_voices_2017
  - case_cn_hk_lockhart_cinema_seats_2016
  - case_sg_bishan_last_train
  paragraphs:
  - 有人记得夜里传来的步操声，有人记得海边火龙队伍散开前的惊慌，还有人把旧戏院里没卖出去的座位算进鬼故事。香港不同街区的记忆，常围绕住宅、海湾、戏院和公园展开。
  - 2016 至 2017 年的报道采访街坊和社区导赏员，也追问旧建筑的变化：华富邨为一些家庭提供了更宽敞的住所，雷生春后来被捐赠并活化，湾仔旧戏院的地点则承载了另一组传闻。
  - 可以对照新加坡碧山旧墓地与新地铁站的故事：老居民对日常生活的记忆，与后来围绕新设施产生的传言，并不必然指向同一次经历。
  - 这些文章并置了建筑史、个人回忆和民间叙述；在地图上找到地点，不等于故事中的人物或超自然解释已得到证实。
  sources:
  - &id001
    citation: 李赞：〈瀑布湾有水鬼？华富邨前身竟是乱葬岗〉，《香港01》，2016 年 8 月 7 日。
