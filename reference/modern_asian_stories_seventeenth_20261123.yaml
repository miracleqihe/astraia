- id: case_cn_shanghai_dahu_hotel_newspaper_ghost_2017
  title: 上海旧饭店｜沙发上看报的人
  genre: urban_legend
  credibility_tier: C
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 31.2304
    lng: 121.4737
    precision: city
    location_name: 中国上海 · 黄浦区范围参考
    culture_region: 东亚 · 中国
  map_label: 上海
  location_note: 文章所述旧大沪饭店在爱多亚路一带；点位仅表示上海市中心范围，不认定旧址。
  temporal:
    year_start: 2017
    year_end: 2017
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 旅客半夜醒来，发现房间亮着灯，对面的沙发上坐着一个看报的人。报纸挡住了脸；他连问几声，对方都没有回答，等众人赶来时，房里只剩旅客自己。
  - 他坚持翻看床下。故事说，众人从床架背面发现一具尸体，于是上海流传起饭店闹鬼的消息。后来另一种讲法把地点换成扬子饭店，也改写了房客和尸体的身份。
  - 2017 年，祝淳翔比较两种旧文，指出情节存在明显差异；其中一位作者还提出传闻可能与同行竞争有关，但这一解释本身也需证据。1936 年《申报》确实提到大沪饭店，不能因此证明故事里的事件。
  sources:
