  title: 北京讲述｜反复出现的无脸人
  genre: memorate
  credibility_tier: B
  theme: corpus_cn_dreams_relatives_historical_2022
  location:
    lat: 39.9042
    lng: 116.4074
    precision: city
    location_name: 中国北京 · 受访者居住地参考
    culture_region: 东亚 · 中国
  map_label: 北京
  location_note: 采访时受访者居住北京，童年经历的城市未指明；点位表示受访者居住地。
  temporal:
    year_start: 2017
    year_end: 2017
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 十岁左右，他反复做同一个梦：自己躺在熟悉的卧室里，看见一个高大身影从门口走来。他去开灯，灯光却昏暗闪烁，始终看不清对方的脸。
  - 差不多那段时间，家里还时常传来像虫鸣的声音；大家寻找过，却没找到来源。后来叔叔来住了两天，声音便不再出现。
  - 2017 年采访时，他也谈到祖父去世后梦见祖父；被问到时，他说无脸身影并不是祖父。采集者保留了几段彼此接近的家庭记忆，没有替它们确定共同原因。
  sources:
