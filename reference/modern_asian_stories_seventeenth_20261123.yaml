  title: 香港跑马地｜一匹马上两位骑师
  genre: urban_legend
  credibility_tier: B
  theme: corpus_hk_neighborhood_ghosts_and_change_2016_2017
  location:
    lat: 22.27278
    lng: 114.18222
    precision: city
    location_name: 中国香港 · 跑马地马场范围参考
    culture_region: 东亚 · 中国香港
  map_label: 跑马地
  location_note: 点位代表跑马地马场；大火纪念碑位于附近扫杆埔山坡，并非同一坐标。
  temporal:
    year_start: 2016
    year_end: 2016
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 跑马地的旧传闻说，有观众远远看见一匹马上仿佛坐着两位骑师，等马冲过终点，却只剩下一个人。另一些人把骑师无端坠马与旧日灾难联系起来。
  - 地方研究者向记者转述另一则故事：大火当天，一名孩子在电车上看到马场一片烛光，执意拉祖父回去，两人因而没有入场。这是后来的讲述，无法据此还原祖孙身份或行程。
  - 可以核对的历史是 1918 年跑马地马场发生大火，伤亡惨重；附近扫杆埔的纪念碑于 1922 年建成。纪念碑保存了灾难的历史，赛场异影与预兆仍是另行流传的故事。
  sources:
  - citation: 陈铭智：〈火烧马棚历史几失传〉，《香港01》，2016 年 8 月 14 日。
    type: press_account
    url: https://www.hk01.com/%E7%A4%BE%E5%8D%80%E5%B0%88%E9%A1%8C/36997/%E7%9B%82%E8%98%AD%E7%AF%80%E9%AC%BC%E6%95%85-%E7%81%AB%E7%87%92%E9%A6%AC%E6%A3%9A%E6%AD%B7%E5%8F%B2%E5%B9%BE%E5%A4%B1%E5%82%B3-%E9%80%BE600-%E4%BA%BA%E7%82%AD-%E8%91%AC%E5%A4%A7%E7%90%83%E5%A0%B4%E5%BE%8C%E5%B1%B1
    locator: 回顾大火历史及地方研究者转述的预兆与赛马传闻
  - citation: 香港古物古迹办事处：马场先难友纪念碑。
    type: historical_reference
    url: https://www.amo.gov.hk/en/historic-buildings/monuments/hong-kong-island/monuments_110/index.html
