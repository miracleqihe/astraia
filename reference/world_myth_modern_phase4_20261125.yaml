  - id: case_nz_maori_ranginui_papa
    title: 新西兰毛利｜天父朗伊努伊与地母帕帕图阿努库分离创世神话
    aliases:
      - Ranginui and Papatuanuku
      - Rangi and Papa
      - 天父地母分离神话
      - 毛利创世神话
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: -38.1368
      lng: 176.2497
      precision: culture_region
      location_name: 新西兰北岛 · 罗托鲁瓦与毛利文化腹地（区域参考）
      culture_region: 大洋洲 · 新西兰毛利传统
    location_note: 天父朗伊努伊与地母帕帕图阿努库的分离创世故事通行于奥特亚罗瓦（新西兰）各毛利部族口述传统，坐标取北岛中部罗托鲁瓦文化圈作区域参考，并非具体发生地点。
    paragraphs:
      - 在新西兰毛利传统宇宙观里，最初一切沉睡于漫长黑暗之境“特波”（Te Pō）：天父朗伊努伊（Ranginui）与地母帕帕图阿努库（Papatūānuku）紧紧相拥，令诞生的众子嗣——包括森林之神塔内、海洋之神坦加罗阿、风雷之神塔菲里马泰阿与战神图马塔乌恩加等——长期蜷缩在狭窄幽暗的缝隙之间，不见天日。
      - 为求得光亮与生长空间，兄弟们合议推开双亲。战神曾提议将父母杀害，但森林之神塔内主张只将天地分离；先后几位兄长尝试皆告失败，唯有塔内将双肩抵住大地、倒立举起双足猛力顶起苍穹，终于挣断父母拥抱的藤蔓与双臂，令光明世界“特奥马拉马”（Te Ao Mārama）豁然显现。
      - 暴怒的风神塔菲里马泰阿随父亲升入高空，降下狂风巨浪拷问兄弟，迫使海、林、农各神后代分守天地水域；而分开的朗伊努伊与帕帕图阿努库至今彼此思念——天父的泪化作雨水滋润大地，地母的叹息升作晨雾回望长空。新西兰国家百科 Te Ara 与国家博物馆 Te Papa 指出，不同部族（iwi）对神灵子嗣次序各有口传异文，它是毛利谱系（whakapapa）与土地伦理的核心隐喻，不应简化为字面自然史。
    sources:
      - citation: 'Te Ara – The Encyclopedia of New Zealand, "Papatūānuku – the land".'
        type: institutional_account
        url: 'https://teara.govt.nz/en/papatuanuku-the-land'
        locator: 天父朗伊努伊与地母帕帕图阿努库分离及土地（whenua）伦理阐释
      - citation: 'Te Ara – The Encyclopedia of New Zealand, "Ranginui and Papatūānuku".'
        type: institutional_account
        url: 'https://teara.govt.nz/en/artwork/2426/ranginui-and-papatuanuku'
        locator: 塔内推开天地进入光明世界（Te Ao Mārama）的传统图像与说明
      - citation: 'Museum of New Zealand Te Papa Tongarewa, "Origins of Māori Weaving".'
        type: institutional_account
        url: 'https://collections.tepapa.govt.nz/topic/3612'
        locator: 毛利创世神谱、部族叙事差异与文化实践关联
    compare: [corpus_nz_maori_rangi_papa, case_nz_aotearoa_maui_fishing, corpus_theme_creation_worlds]
