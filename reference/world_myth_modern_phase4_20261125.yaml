  - id: case_ru_taiga_leshy_guardian
    title: 俄罗斯北方泰加林｜森林守护灵“莱希”迷途误导与衣履反穿民俗
    aliases:
      - Leshy
      - Леший
      - 莱希
      - 俄罗斯森林守护灵
      - 迷途反穿衣鞋
    genre: folktale
    credibility_tier: B
    note_kind: story
    location:
      lat: 59.2205
      lng: 39.8915
      precision: province
      location_name: 俄罗斯 · 沃洛格达州北方泰加林带（民俗采集参考区）
      culture_region: 欧洲 · 俄罗斯北方泰加林带
    location_note: 莱希传说遍布俄罗斯北方及东斯拉夫广袤针叶林区，坐标取 19 至 20 世纪俄罗斯民族志重点采录林区沃洛格达州作文化参考，并非某座单一林地坐标。
    paragraphs:
      - 在俄罗斯与东斯拉夫民间信仰里，“莱希”（Leshy，意为“林中存在”）是统辖森林、野兽与林木边界的精灵守护者。在乡村猎人与采蘑人讲述中，莱希能随周围草木变化身形：立于林缘草地时矮如野草，退入幽深泰加林腹地则高比参天古松；当他化作人形老翁现身时，常无影子、缺少右耳或眉毛，且外套前襟左右颠倒、双脚鞋子左右穿反。
      - 莱希既护佑遵守禁忌、礼貌祈请的猎人与牧人，又以恶作剧和“令人迷失方向”着称。他能摹仿同行亲友的呼唤或旋风般的口哨声，将触怒森林规矩的砍柴人、采浆果者引入浓密灌丛绕圈鬼打墙——民间称之为“被莱希绕昏了头”。遇难者明明听见村犬吠声近在咫尺，却整夜在熟悉的小径旁原地打转找不到归途。
      - 面对莱希施加的空间错乱，俄罗斯北方民俗保存了一套象征性的“逆序破法”：迷途者必须原地停下，脱下外衣反面套穿，将左脚靴鞋套上右脚、右脚套上左脚（有时还伴随诙谐咒语或静坐平息），借打破日常对称秩序来破除林灵的障眼法。近代民俗学与俄罗斯文学研究将这套习俗解读为古人划定人类农庄秩序与非人荒野界线的文化编码——反穿衣履既提示受困者暂停盲目乱闯、重置心理方位，也告诫社群敬畏广袤林海潜藏的迷失风险。
    sources:
      - citation: 'Encyclopædia Britannica, "Leshy (Slavic mythology)".'
        type: encyclopedia
        url: 'https://www.britannica.com/topic/leshy'
        locator: 莱希随草木变幻身高、守护野兽及诱人迷途传说特征
      - citation: 'Russkaya Literatura (2025), "Why the leshy has the goat''s feet: traces of Antiquity in the treatment of the folklore characters in the Russian literature of the late 18th — early 19th century".'
        type: peer_reviewed
        url: 'https://doi.org/10.31860/0131-6095-2025-1-40-46'
        doi: '10.31860/0131-6095-2025-1-40-46'
        locator: 俄罗斯民间莱希形象的衣履反穿特征、古典文学转写与民俗学考证
