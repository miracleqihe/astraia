  - id: case_cy_lincolnshire_poacher_radio
    title: 塞浦路斯转播疑案｜“林肯郡偷猎者”冷战短波数字电台档案
    aliases:
      - The Lincolnshire Poacher
      - E03 Numbers Station
      - 林肯郡偷猎者电台
      - 冷战短波数字电台
    genre: urban_legend
