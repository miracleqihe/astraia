        locator: 平原原住民圣烟斗礼器结构、白水牛圣女传授谱系与祈祷功能
      - citation: 'Smithsonian Institution Libraries, Lakota Sacred Pipe and White Buffalo Calf Woman Archival Record (SIRIS SIL 915763).'
        type: archival_catalogue
