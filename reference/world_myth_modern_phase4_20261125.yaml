  - id: case_ru_dyatlov_pass_1959
    title: 俄罗斯乌拉尔山｜1959 年迪亚特洛夫山口登山队事件档案与风雪板崩复盘
    aliases:
      - Dyatlov Pass Incident
      - Перевал Дятлова
      - 迪亚特洛夫山口事件
      - 霍拉特夏赫尔山难
    genre: historical_archive
    credibility_tier: A
    note_kind: history
    location:
      lat: 61.7547
      lng: 59.4628
      precision: province
      location_name: 俄罗斯斯维尔德洛夫斯克州 · 北乌拉尔迪亚特洛夫山口
      culture_region: 欧洲 · 俄罗斯乌拉尔山脉
    location_note: 坐标对应 1959 年 2 月乌拉尔工学院九人滑雪登山队在霍拉特夏赫尔峰东坡扎营遇难地区（后称迪亚特洛夫山口）周边山地。
    temporal:
      year_start: 1959
      year_end: 1959
      era_label: 1959 年 2 月乌拉尔山登山队遇难事件
      uncertainty_note: 1959 年 2 月 1 日夜发生营地逃生事件，9 名遇难者遗体于同年 2 月底至 5 月雪融期间陆续搜获。
    paragraphs:
      - 1959 年 1 月底，由乌拉尔工学院毕业生伊戈尔·迪亚特洛夫率领的九名经验丰富的苏联滑雪登山者深入北乌拉尔山脉荒野；2 月 1 日傍晚，队伍在后来被称作“死亡之山”的霍拉特夏赫尔峰东坡挖平积雪扎下大帐篷。数周后搜救队赶到现场时，发现帐篷布面被人从内部以刀割裂，登山靴与厚外衣仍留在帐内，而九组光脚或仅着袜子的脚印一路向下方密林延伸。
      - 搜救行动从 2 月底持续至 5 月雪融：前五名遇难者倒卧在林缘与山坡雪地上，法医判定均死于严重失温；然而最后四具在山涧深雪坑内寻获的遗体中，三人胸骨碎裂或颅骨重创却毫无外层皮肤撕裂伤口，加之少数衣物被检出轻微放射性痕量、卷宗当时暂封且部分目击者提到天际光球，此后半个多世纪间衍生出雪人袭击、次声波致幻、秘密武器试验甚至外星接触等海量都市传闻。
      - 2020 年俄罗斯联邦总检察院重新复核历史卷宗，将致死因素指向雪崩与极端严寒低能见度；2021 年，瑞士洛桑联邦理工学院与苏黎世联邦理工学院学者 Johan Gaume 与 Alexander Puzrin 在《自然》旗下《Communications Earth & Environment》发表同行评审数值模拟研究，证明登山队扎营时切入坡面高密风积雪层下方脆弱雪层，在深夜风荷载叠加下完全可能在看似不算陡峭的斜坡引发“滞后型小型板状雪崩”——厚重雪块垂直压砸帐篷内熟睡队员胸部与头部造成致命内伤，迫使惊慌生还者仓促割帐逃往林下并最终冻毙，使这起传奇悬案首次获得与现场伤口及坡度吻合的物理力学解释。
    sources:
      - citation: 'Johan Gaume & Alexander M. Puzrin, "Mechanisms of slab avalanche release and impact in the Dyatlov Pass incident in 1959", Communications Earth & Environment 2, Article 10, 2021.'
        type: peer_reviewed
        url: 'https://www.nature.com/articles/s43247-020-00081-8'
        doi: '10.1038/s43247-020-00081-8'
