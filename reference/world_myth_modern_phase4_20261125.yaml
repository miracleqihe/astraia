  - id: case_ir_avesta_ahura_angra_dualism
    title: 波斯《阿维斯陀》｜光明与黑暗双元宇宙论及钦瓦特之桥
    aliases:
      - Ahura Mazda and Angra Mainyu
      - Chinvat Bridge
      - Činwad Puhl
      - 钦瓦特之桥
      - 阿胡拉·马兹达与安格拉·曼纽
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 31.8974
      lng: 54.3569
      precision: culture_region
      location_name: 伊朗亚兹德 · 琐罗亚斯德教文献保存区（文化参考）
      culture_region: 中东与西亚 · 古波斯与伊朗高原
    location_note: 古伊朗双元宇宙观与死后渡桥神学见于《阿维斯陀》及中古波斯文献，坐标取长期保存琐罗亚斯德教写本与火庙礼俗的亚兹德地区作文化参照点。
    paragraphs:
      - 在古波斯与伊朗高原的琐罗亚斯德教（祆教）经典《阿维斯陀》体系中，宇宙并非单一神祇的独白，而是善与恶、真理（Asha）与谎言（Druj）的根本对立。至高智慧之主阿胡拉·马兹达（Ahura Mazdā，中古波斯语称奥尔马兹德）创设光明、秩序与清净万物，而破坏之灵安格拉·曼纽（Angra Mainyu，亦称阿里曼）则自黑暗深渊涌出，以疾病、灾荒、恶兽与欺妄不断侵蚀世界，令受造界成为双方交锋的战场。
      - 人的道德抉择因而直接参与宇宙战役；死后第四日黎明，灵魂必须登上耸立于圣山哈拉（Harā）之巅的“钦瓦特之桥”（Chinvat Bridge，阿维斯陀语意近“甄别与结算之桥”）。面对各自的良知化身（Daēnā），奉行真理善行的灵魂会看见美丽的少女迎候，桥面亦随之拓宽为坦途，稳稳引向永恒光明的“歌咏之家”（Garōdmān）；而沉溺虚妄恶行的灵魂则将遭遇丑恶灵影，桥面骤然收窄为锋利剃刀之刃，令其失足坠入黑暗苦境。
      - 《伊朗百科全书》指出，从早期琐罗亚斯德亲自吟诵的《伽陀》（Gāthās）到后期《温迪达德》（Vendidad）及萨珊时期的《邦达希申》（Bundahišn），关于双元本体与桥上审判的细节经历了数个世纪的层累发展——例如后期文献还为善恶相抵者增设了“哈米斯塔干”过渡界。理解这一传统须区分早期诗颂的伦理抉择观与后期系统神学的宇宙论编排。
    sources:
      - citation: 'Encyclopædia Iranica, "Ahura Mazdā".'
        type: academic_article
        url: 'https://www.iranicaonline.org/articles/ahura-mazda'
        locator: 阿胡拉·马兹达创世职能、真理秩序与对立二元架构
      - citation: 'Encyclopædia Iranica, "Činwad Puhl".'
        type: academic_article
        url: 'https://www.iranicaonline.org/articles/cinwad-puhl'
        locator: 钦瓦特之桥词源考证、剃刀窄桥与善恶灵魂渡桥文本演变
    compare: [case_ir_alborz_simurgh_lore, case_eg_thebes_weighing_heart, case_in_katha_nachiketa_yama]
