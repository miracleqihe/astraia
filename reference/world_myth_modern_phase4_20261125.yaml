      rationale: 梳理《伽陀》诗颂到中古波斯注疏对善恶二元与渡桥图像的层累阐发，对照宗教文本中的历史、字面与寓意解读层次。

  - id: case_us_lakota_white_buffalo
    title: 北美拉科塔｜白水牛圣女传授“圣烟斗”与七圣礼神话
    aliases:
      - White Buffalo Calf Woman
      - Ptesan-Wi
      - Chanupa
      - 白水牛圣女
      - 拉科塔圣烟斗
    genre: myth
    credibility_tier: A
    note_kind: story
    location:
      lat: 44.4758
      lng: -103.4267
      precision: culture_region
      location_name: 美国南达科他州 · 黑山贝尔布特（Mato Paha）圣地周边
      culture_region: 北美 · 北美大平原（拉科塔）
    location_note: 白水牛圣女传授圣烟斗的口述神圣叙事通行于拉科塔、达科他与纳科塔等大平原苏族部族，坐标取拉科塔礼仪圣地贝尔布特附近作区域文化参考。
    paragraphs:
      - 据大平原拉科塔（Lakota）口述神圣历史记载，远古一次严酷饥荒期间，两名青年猎手出营寻觅野牛群，忽见远方云雾中走来一位身着素白鹿皮衣的圣洁女子——即“白水牛圣女”（Ptesan-Wi）。其中一名斥候心生轻薄邪念上前冒犯，瞬间被骤降的白云吞没化作枯骨；另一名怀抱敬畏的斥候则聆听圣女嘱托，飞奔回营嘱咐长老与族人搭起大圆帐迎候。
      - 白水牛圣女步入营帐顺行绕场一周，向饥困的族人献上红石烟斗钵与木制烟杆相合的“圣烟斗”（Chanupa），详述烟斗刻纹如何联结大地、草木、飞禽走兽与四方天穹，并传授构成拉科塔灵性生活核心的“七项圣礼”（涵盖汗屋净礼、寻象禁食、太阳舞与灵魂安顿等仪轨）。她叮嘱族人须珍惜天地生命并善待妇孺。
      - 临别之际，白水牛圣女走至草原四度俯身滚地，身形依次显化为黑、红、黄、白四色水牛，最终化作一头纯白幼水牛消失在视野尽头；随即成群野牛涌向平原，解除了部落的饥荒。美国国家公园管理局、大英百科全书与史密森学会藏文献指出，在原住民社群内部，白水牛诞育至今仍是重要的生态与灵性象征，外界读解时须尊重部落口述主权与宗教隐私边界。
    sources:
      - citation: 'National Park Service (U.S. Department of the Interior), "Bison Bellows: The Birth of a White Buffalo Calf".'
        type: institutional_account
        url: 'https://www.nps.gov/articles/bison-bellows-the-birth-of-a-white-buffalo-calf.htm'
        locator: 拉科塔白水牛圣女遇斥候、赠圣烟斗及四色化牛叙事与当代草原文化意义
      - citation: 'Encyclopædia Britannica, "Sacred Pipe".'
        type: encyclopedia
