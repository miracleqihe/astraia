      rationale: 以拉科塔白水牛圣女传授圣礼的口述神圣记忆为例，对照原住民社区仪式记录与文化公开的伦理原则。

  - id: case_mn_altai_tengri_creation
    title: 阿尔泰与蒙古草原｜苍天腾格里与“水潜取土”创世神话
    aliases:
      - Tengri Creation Myth
      - Altai Earth-Diver
      - 腾格里创世神话
      - 埃尔利克潜海取泥
      - 阿尔泰水潜取土
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 48.9692
      lng: 89.9625
      precision: culture_region
      location_name: 蒙古国西部 · 阿尔泰山脉与草原盆地（区域参考）
      culture_region: 东亚 · 蒙古与阿尔泰草原
    location_note: 长生天腾格里信仰与“水潜取土”（Earth-diver）创世母题广泛见于阿尔泰、蒙古与西伯利亚草原萨满口述，坐标取蒙古阿尔泰西部地区作文化参考。
    paragraphs:
      - 在古代突厥、蒙古与阿尔泰草原萨满教传统中，至高苍穹神祇“长生天腾格里”（Tengri / Kök Möngke Tengri）主宰天象、时序与人间秩序。而在 19 世纪俄国突厥学家拉德洛夫（Wilhelm Radloff）等人在阿尔泰山区采录的经典创世口述中，世界起初唯有漫无边际的原初大水，至高造物神乌尔根（Ülgen，或库尔布斯坦，常位于腾格里统摄的神系之中）决定在水面上奠立干爽大地。
      - 造物神或携水鸟同伴，或命与其并行的阴暗对手埃尔利克（Erlik，后来成为幽冥主宰）潜入无底幽暗的水渊，自海底衔取一撮湿泥浮回水面敷成陆地。潜入深水的对手趁机在口中暗藏一撮泥土，企图另造只属于自己的隐秘国土；不料造物神吹气令泥土急速膨胀，那藏在口中的泥块猛然胀满咽喉，逼得对方剧烈呛咳，将余泥一口口喷吐在平坦大地上。
      - 据叙事解释，凡造物神亲手铺展之处皆成平阔草原，而被埃尔利克仓皇吐出的泥块则堆积成险峻山岳、沼泽与乱石沟壑——这既赋予草原崎岖地貌以善恶并存的二元起源，也交代了大地、山川地灵（Yer-Sub）与苍天之间的秩序分工。尤里·别列兹金与弗拉基米尔·纳波尔斯基赫等学者的比较研究指出，“水潜取土”母题遍布北亚、乌拉尔语系与北美原住民传说，体现了深远的跨欧亚—北美口传分布格局，但学界对其具体年代与传播路径仍持审慎比较态度。
    sources:
      - citation: 'Encyclopædia Britannica, "Tengri".'
        type: encyclopedia
        url: 'https://www.britannica.com/topic/Tengri'
        locator: 突厥—蒙古长生天腾格里神格、宇宙分层与草原萨满教体系
      - citation: 'Yuri E. Berezkin, "\"Earth-diver\" and \"Emergence from under the Earth\": Cosmogonic Tales as Evidence in Favor of the Heterogenic Origins of the American Indians", Archaeology, Ethnology and Anthropology of Eurasia 32(1), 2007, pp. 110–123.'
        type: peer_reviewed
        url: 'https://doi.org/10.1134/S156301100704010X'
        doi: '10.1134/S156301100704010X'
        locator: 西伯利亚、阿尔泰与北美“水潜取土”（A812）创世母题统计分布比较
      - citation: 'Vladimir V. Napolskikh, "The Earth-Diver Myth (A812) in Northern Eurasia and North America: Twenty Years Later", Mythic Discourses, Helsinki, 2012, pp. 120–140.'
        type: academic_article
        url: 'https://www.academia.edu/4918926/'
        locator: 阿尔泰、乌拉尔与北美潜海取泥神话重构与文献梳理
