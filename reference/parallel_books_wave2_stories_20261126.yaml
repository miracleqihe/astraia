- id: case_cn_dict_w2_xishui_chiboshen
  title: 湖北黄冈 · 浠水县｜赤膊神
  aliases:
  - 浠水赤膊神
  - 水鬼弃恶
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.45207
    lng: 115.26512
    precision: city
    location_name: 湖北黄冈 · 浠水县
    culture_region: 东亚 · 中国湖北
  location_note: 浠水县域参考点；辞典未定位故事中的渡口、井或庙。
  paragraphs:
  - 相传水鬼到了寻找替身的期限，先后遇见过河的母亲、财主的儿子和汲水老人。每次看到他们背后的家人，它都不忍心夺走对方性命。
  - 故事最后说，水鬼改而行善，得到封号。辞典将这则神灵缘起记为浠水流传的鬼话，并另引文彦生《中国鬼话》；后者原件未核。
  sources:
