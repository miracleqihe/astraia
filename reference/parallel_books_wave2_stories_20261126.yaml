- id: case_cn_dict_w2_lincang_carpenter
  title: 云南 · 临沧市｜智制吊死鬼
  aliases:
  - 临沧彝族木匠与墨线
  genre: folktale
  credibility_tier: B
  location:
    lat: 23.8841
    lng: 100.0889
    precision: city
    location_name: 云南 · 临沧市
    culture_region: 东亚 · 中国云南
  location_note: 临沧地区城市参考点；辞典未说明山寨、山坳及采录点。
  paragraphs:
  - 辞典所记临沧彝族山寨故事里，木匠的妻子反复梦到吊颈鬼，并被引向后山。木匠后来察觉异样，假装求教，趁机用墨线制住来者。
  - 鬼被带回家做农活，过了几代才因墨线被洗掉而逃走。它与其他匠人借工具制鬼的故事有相似情节，但目前没有证据证明版本之间存在传播关系。
  sources:
