- id: case_cn_dict_w2_shiyan_spring_child
  title: 湖北 · 十堰市｜阎罗王和土地爷
  aliases:
  - 春娃与龙潭坪土地爷
  genre: folktale
  credibility_tier: B
  location:
    lat: 32.6295
    lng: 110.7983
    precision: city
    location_name: 湖北 · 十堰市
    culture_region: 东亚 · 中国湖北
  location_note: 十堰地域参考点；龙潭坪具体位置尚未核实。
  paragraphs:
  - 龙潭坪土地爷不满阎罗横行，却遭到陷害，只好请年轻的春娃帮忙。春娃依照土地爷的指点，救下无辜的人，并设法赶走判官和小鬼。
  - 他又夺得阎罗的马和官服，最终扭转局面。故事写玉帝有意重用春娃，他却推荐土地爷担当职务；词典称此故事流传于十堰。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
