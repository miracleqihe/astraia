- id: case_cn_dict_w2_zhongxian_ghost_city
  title: 重庆 · 忠县｜抢先修鬼城
  aliases:
  - 益王与鬼城
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.29916
    lng: 108.03568
    precision: city
    location_name: 重庆 · 忠县
    culture_region: 东亚 · 中国重庆
  location_note: 忠县县域参考点；八德场、鬼城和祭祀地点均未定位。
  paragraphs:
  - 传说益王来到八德场相看建都之地，随从认为这里地势吉利。不料一阵阴风将众人带进阴间，他们发现阎君早已抢先建起一座鬼城。
  - 益王只得另择地点，故事又把当地祭祀日期的缘起与这次遭遇相连。辞典出版时写“四川忠县”，忠县今属重庆；故事中的场址和祭祀实践未作实地核验。
  sources:
