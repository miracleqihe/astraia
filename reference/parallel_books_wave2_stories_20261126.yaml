- id: case_cn_dict_w2_fuqing_lantern_child
  title: 福建福州 · 福清市｜小顽童
  aliases:
  - 走马灯里的小孩
  genre: folktale
  credibility_tier: B
  location:
    lat: 25.72
    lng: 119.38
    precision: city
    location_name: 福建福州 · 福清市
    culture_region: 东亚 · 中国福建
  location_note: 福清市域参考点；私塾和戏班活动地点未定位。
  paragraphs:
  - 村里戏班开演，书童和乡人都去看戏，留下私塾先生独自在屋里读书。一个胖乎乎的孩子突然在他身边跑跳，先生觉得奇怪，却继续读书。
  - 看戏的人散场回来，孩子也消失了。先生随后在一盏破旧走马灯上见到相似的人像，故事将这次相遇解释为旧画成精。
  sources:
