- id: case_cn_dict_w2_xingning_zhongkui
  title: 广东梅州 · 兴宁市｜五鬼闹钟馗
  aliases:
  - 五鬼戏钟馗
  - 两面鬼设宴
  genre: folktale
  credibility_tier: B
  location:
    lat: 24.1680556
    lng: 115.6669444
    precision: city
    location_name: 广东梅州 · 兴宁市
    culture_region: 东亚 · 中国广东
  location_note: 兴宁市范围参考点；故事未给出可核实的湖泊。
  paragraphs:
  - 钟馗追赶两面鬼不成，暂时住下。两面鬼找来四个同伴，假扮衙役，携酒菜上门；钟馗没有识破，酒后被他们摆布。
  - 五鬼正要把钟馗扔进湖里，他的两个手下赶来，将两面鬼杀死、其余四鬼擒住。辞典将这则讽谑鬼话列为兴宁流传的版本。
  sources:
