- id: case_cn_dict_w2_jingzhou_rice_ghosts
  title: 湖北 · 荆州市｜换粮济贫
  aliases:
  - 游林侠鬼换粮
  - 粮商与纸锭
  genre: folktale
  credibility_tier: B
  location:
    lat: 30.335
    lng: 112.24
    precision: city
    location_name: 湖北 · 荆州市
    culture_region: 东亚 · 中国湖北
  location_note: 荆州地域参考点；粮行与故事事件均不可定位。
  paragraphs:
  - 故事将情节放在明末荆州：灾荒中，粮商囤积米粮，打算抬价。一群自称商人的来客买下大米，又低价转给受困的百姓。
  - 粮商后来发现收到的银钱变成纸锭，试图勾结官府夺回粮食，再度中了计。结尾揭示，这群来客是仗义济人的鬼；明末是叙事设定，非已核事件日期。
  sources:
