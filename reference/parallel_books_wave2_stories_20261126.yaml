- id: case_cn_dict_w2_shangqiu_water_ghost
  title: 河南 · 商丘市｜酒鬼和水鬼
  aliases:
  - 渔人与水鬼酒友
  genre: folktale
  credibility_tier: B
  location:
    lat: 34.4146
    lng: 115.6558
    precision: city
    location_name: 河南 · 商丘市
    culture_region: 东亚 · 中国河南
  location_note: 商丘地域参考点；辞典未给出河流、居所或讲述者。
  paragraphs:
  - 喜欢饮酒的渔人发现，自己近来捕鱼常常满载，可酒瓶里的酒却越来越少。原来有个同样嗜酒的水鬼在暗中饮酒，后来二者竟成了朋友。
  - 水鬼一度想找替身，渔人多次劝阻，它终于放弃害人。待渔人生活困顿时，水鬼又拿出银钱相助；这是一则关于人鬼情谊的地方叙事。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
