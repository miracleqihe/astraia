- id: case_cn_dict_w2_taizhou_doubt
  title: 江苏 · 泰州市｜智破讨债计
  aliases:
  - 李红朝化险
  genre: folktale
  credibility_tier: B
  location:
    lat: 32.455
    lng: 119.923
    precision: city
    location_name: 江苏 · 泰州市
    culture_region: 东亚 · 中国江苏
  location_note: 泰州地域参考点；书中张家坝、鲍家沟和小石桥均未定位。
  paragraphs:
  - 赶集的李红朝走过一座小石桥，听见两个女鬼商量寻找替身。他将谈话记在心里，第二天赶到一户刚遭丧事的人家，劝住正在争吵的婆媳。
  - 他又走访另一户办喜事的人家，帮助新娘找到遗失的手镯，化解危机。辞典将它记为泰州流传的鬼话；故事中的两处村落与桥梁没有经过定位。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: 鬼话·当代部分，印页 480（PDF 第 595 页），条目“智破讨债计”
  - citation: 江苏 · 泰州市，地域参考资料。
