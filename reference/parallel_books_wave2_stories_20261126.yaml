- id: case_cn_dict_w2_manzhouli_yanluo
  title: 内蒙古 · 满洲里市｜阎王爷的由来
  aliases:
  - 阎罗寻救人之路
  genre: folktale
  credibility_tier: B
  location:
    lat: 49.588
    lng: 117.481
    precision: city
    location_name: 内蒙古 · 满洲里市
    culture_region: 东亚 · 中国内蒙古
  location_note: 满洲里城市参考点；辞典所记为流传范围，不是人物行程定位。
  paragraphs:
  - 一个名叫阎罗的年轻人离开故乡，想为遭受苦难的人们寻找出路。路上两位老人向他提出考验，他历经曲折，终于完成托付。
  - 老人显出神仙身份，安排他掌管人间生死；后来他又因骄纵而由仙降为鬼，却仍管生死簿。辞典将这则缘起叙事记为满洲里流传的一种讲法。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: 鬼话·当代部分，印页 481（PDF 第 596 页），条目“阎王爷的由来”
  - citation: 内蒙古 · 满洲里市，地域参考资料。
