- id: case_cn_dict_w2_yangquan_ghost_money
  title: 山西 · 阳泉市｜鬼票
  aliases:
  - 小店里的纸钱
  genre: folktale
  credibility_tier: B
  location:
    lat: 37.8573
    lng: 113.5804
    precision: city
    location_name: 山西 · 阳泉市
    culture_region: 东亚 · 中国山西
  location_note: 阳泉地域参考点；店铺、墓地和具体社群未定位。
  paragraphs:
  - 一家小店屡次在收来的钱里发现纸钱，店主查到一位年轻顾客，便悄悄跟随。走到坟地附近时，那人消失了，店主将他理解为墓中出生的鬼孩。
  - 辞典的结尾还记有与孕亡者葬俗有关的忌讳性说法。这是故事叙事的一部分，不能据此推定某种做法在阳泉普遍存在。
