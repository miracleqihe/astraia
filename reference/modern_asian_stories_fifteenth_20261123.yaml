- id: case_cn_hk_windsor_fox_marble_2018
  title: 香港铜锣湾｜云石上的狐狸脸
  genre: urban_legend
  credibility_tier: B
  theme: corpus_cn_hk_fox_stories_fieldwork_2017
  location:
    lat: 22.28027
    lng: 114.18652
    precision: city
    location_name: 中国香港 · 铜锣湾皇室大厦参考点
    culture_region: 东亚 · 中国香港
  map_label: 铜锣湾
  location_note: 故事指向旧温莎公爵大厦；点位为告士打道皇室大厦参考位置，不定位当年的云石。
  temporal:
    year_start: 2018
    year_end: 2018
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 铜锣湾一座大厦的云石墙上，有人看出像狐狸的纹理。传言越传越远：有人说那是一家狐仙，也有人把酒楼里一场满月宴后的不幸与它们联系起来。
  - 《香港01》回顾的一个版本里，母亲梦见狐狸责怪宴席没有向它敬酒；醒来后，家人发现孩子出了事。不同讲述对年份、地点和后续细节并不一致。
  - 故事还说，好奇的人前来观看，云石后来被遮盖、拆走。2017 年陈康言梳理旧报时，未在其查阅的八十年代资料中找到相关报道；论文收录的是后来的传说记录。
  - 大厦与周边商场仍是铜锣湾日常生活的一部分。狐狸脸、梦与酒宴共同组成的是城市传说，并非已经核实的事故经过。
  sources:
  - *id001
  - *id002
  - *id003
  - citation: 香港屋宇署：湾仔区公众地方资料，Windsor House。
    type: map_reference
    url: https://www.bd.gov.hk/en/resources/codes-and-references/public-open-space/HK/dedicated_areas_HK_WC.html
    locator: 告士打道 311 号；点位为建筑参考
