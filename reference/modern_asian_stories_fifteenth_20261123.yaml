- id: case_my_burmese_family_seventh_day_2024
  title: 马来西亚｜第七天的告别
  genre: memorate
  credibility_tier: B
  theme: corpus_asian_personal_night_memories_2016_2025
  location:
    lat: 4.2105
    lng: 101.9758
    precision: culture_region
    location_name: 马来西亚 · 缅甸家庭讲述范围参考
    culture_region: 东南亚 · 马来西亚
  map_label: 马来西亚
  location_note: 讲述称母亲童年时一家住在马来西亚，未说明城市；点位只表示国家范围。
  temporal:
    year_start: 2024
    year_end: 2024
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 女孩十岁左右时，一位姨母去世。家里按照自己的习惯，在第七天请僧人来送别；仪式中，祖母突然从椅子上起身，用另一个声音说话。
  - 家人把那个声音认作已故的亲人，听她道别。祖母事后十分疲惫，也记不清经过。多年后，一家迁居美国，又在另一位亲人去世后讲起相似的经历。
  - 2024 年，采集者记录母亲转述的家庭记忆。母亲说自己亲历了其中一件事；关于声音和仪式的意义，是这家人的理解，不能代表所有缅甸家庭。
  sources:
  - citation: vbuccell, “Burmese Ghost Story – Memorate”, USC Digital Folklore Archives, 14 May 2024。
    type: oral_history
    url: https://folklore.usc.edu/burmese-ghost-story-memorate/
    locator: 母亲在马来西亚的童年回忆及家庭迁徙后的另一段讲述
