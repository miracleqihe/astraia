themes:
- id: corpus_cn_hk_fox_stories_fieldwork_2017
  title: 香港狐仙｜云石传说与民间信仰
  genre: academic_model
  peers:
  - case_cn_zibuyu_v01_s011
  - corpus_cn_hk_bosco_campus_story_versions_2007
  paragraphs:
  - 香港的狐仙故事常从一块石头开始：有人在云石纹理里认出狐狸脸，接着有人讲起酒楼、商场或街道上的怪事。不同讲法把狐仙放在不同地点，细节也不尽相同。
  - 香港浸会大学研究者陈康言在 2017 年的硕士论文中，整理了台湾作家罗问 1997 年书中的四则香港传说，并检索旧报刊。他在所查的 1980 年代报刊资料中未找到相关报道，追溯到的后来报道多在娱乐或专栏版面。这是对检索范围内材料的观察，并不能证明所有旧报都没有记载。
  - 论文也访谈了供奉者，发现狐仙并不只以令人害怕的形象出现。对部分信众而言，狐仙是可以祈求帮助的神灵；作者以田野调查和台湾、山东材料对照，讨论信仰与流行故事的差别。
  - 温莎大厦、北角酒店和传统志怪中的狐狸可以放在一起阅读；材料相似并不等于已经证实它们之间的传播路径。论文原文由大学典藏保存，站内文字是依据研究和报道重新整理的梗概。
  sources:
  - &id002
    citation: 陈康言：《香港狐仙信仰研究》，香港浸会大学哲学硕士论文，2017。
    type: academic_study
    url: https://scholars.hkbu.edu.hk/en/studentTheses/%E9%A6%99%E6%B8%AF%E7%8B%90%E4%BB%99%E4%BF%A1%E4%BB%B0%E7%A0%94%E7%A9%B6/
    locator: 第三章第 30–33 页；学校资料页提供论文摘要与全文入口
  - &id003
    citation: 陈康言：《香港狐仙信仰研究》全文，香港浸会大学机构典藏，2017。
    type: academic_study
    url: https://scholars.hkbu.edu.hk/files/55011968/OA-0479.pdf
    locator: 第三章第 30–33 页；第四章田野记录；访问受学校资料库条件限制
  - &id001
    citation: 乔纳森：〈温莎大厦惊现狐仙〉，《香港01》，2018 年 8 月 24 日。
    type: press_account
    url: https://www.hk01.com/%E7%86%B1%E7%88%86%E8%A9%B1%E9%A1%8C/226641/7%E6%9C%8814%E7%9B%82%E8%98%AD%E7%AF%80-%E6%BA%AB%E8%8E%8E%E5%A4%A7%E5%BB%88%E9%A9%9A%E7%8F%BE%E7%8B%90%E4%BB%99-%E7%8B%90%E7%8B%B8%E9%A0%AD%E9%9B%B2%E7%9F%B3%E5%BC%95%E5%85%A8%E5%9F%8E%E5%93%84%E5%8B%95
    locator: 转述铜锣湾云石与酒楼传闻
