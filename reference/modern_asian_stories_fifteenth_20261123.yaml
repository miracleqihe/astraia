- id: case_mm_family_bedpost_knock_2024
  title: 缅甸家庭｜床柱与无人应答的门
  genre: memorate
  credibility_tier: B
  theme: corpus_asian_personal_night_memories_2016_2025
  location:
    lat: 21.9162
    lng: 95.956
    precision: culture_region
    location_name: 缅甸 · 家庭讲述背景范围参考
    culture_region: 东南亚 · 缅甸
  map_label: 缅甸
  location_note: 家族背景与讲述者关联缅甸；采录没有给出经历发生的城镇或建筑位置。
  temporal:
    year_start: 2024
    year_end: 2024
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 曾祖父睡在一张四柱床上。家人转述，他半夜看见一个人从床柱上爬下来，随即与对方扭打；醒后他仍觉得那比梦真实。
  - 母亲也讲过另一处住宅：有人听见门外敲门和求医的声音，打开门却没有发现来人。她把这些故事和亲属的其他经历一起记在心里。
  - 2024 年的采录保存了母亲从长辈那里听来的叙述。不同经历没有共同的确切地址，也不能由此判断看到或听到的是什么。
