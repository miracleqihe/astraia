- id: case_cn_hk_choi_hung_middle_track_2024
  title: 香港彩虹站｜中间那条轨道
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 22.3348
    lng: 114.2092
    precision: city
    location_name: 中国香港 · 港铁彩虹站参考点
    culture_region: 东亚 · 中国香港
  map_label: 彩虹站
  location_note: 点位为彩虹站位置；故事涉及的列车、日期和人员没有在报道中得到独立核实。
  temporal:
    year_start: 2024
    year_end: 2024
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 等车时，人们可以留意彩虹站中间的一条轨道。都市传说把它说成一条不该驶入的路：有列车曾在途中失去联系，重新出现时，乘客和车长都受到惊吓。
  - 故事还衍生出请人做法、轨道被弃用等说法。《MILK》的回顾同时转述另一种解释：这条轨道通向九龙湾车厂，服务列车运行与维护。
  - 一处日常可见的铁路设施，为传闻提供了具体背景；看到轨道本身，并不能证实故事中的那次列车经历。
