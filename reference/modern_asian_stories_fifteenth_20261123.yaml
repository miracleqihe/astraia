- id: case_cn_hk_seven_sisters_shore_2024
  title: 香港北角｜消失海岸的七姊妹石
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 22.2918
    lng: 114.204
    precision: city
    location_name: 中国香港 · 七姊妹道一带参考点
    culture_region: 东亚 · 中国香港
  map_label: 七姊妹
  location_note: 点位表示今天七姊妹道一带；原来的海岸经填海改变，不表示礁石确切位置。
  temporal:
    year_start: 2024
    year_end: 2024
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 北角七姊妹道的名字，让人想起旧海岸上一组石头。传说七位情同姊妹的女子不愿被迫分离，手牵手走向海里；退潮时，人们在岸边看见几块排列的礁石，便说她们化成了石。
  - 不同讲法对她们投海的缘由并不一致。香港地方志中心记录地方史工作者郑宝鸿的说法：过去海旁有泳棚，七姊妹区后来填海建屋，石头也随旧海岸消失。
  - 2024 年的社区导赏报道另从航海与地形解释这些礁石的名称。街名、旧地图和海岸变迁可以互相参照；传说则保存了人们赋予地方的另一种记忆。
  sources:
  - citation: 黄璇：〈香港故事｜怀缅那些年月的“七姊妹”〉，香港新闻网，2024 年 1 月 28 日。
    type: press_account
    url: https://hkcna.hk/docDetail.jsp?channel=2803&id=100583376
    locator: 传说版本与社区导赏员对地方名称的解释
