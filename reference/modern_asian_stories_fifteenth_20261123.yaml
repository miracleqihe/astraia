    type: local_history
    url: https://web.hkchronicles.org.hk/%E9%A6%99%E6%B8%AF%E5%BF%97/%E7%A4%BE%E6%9C%83/%E6%8E%8C%E6%95%85%E5%B0%88%E5%AE%B6%E9%84%AD%E5%AF%B6%E9%B4%BB%E9%9B%BB%E8%BB%8A%E9%81%8A-%E6%98%A5%E7%A7%A7%E8%A1%97%E8%88%87%E7%A6%8F%E5%BB%BA%E5%AF%8C%E5%95%86%E6%9C%89%E6%B7%B5%E6%BA%90
    locator: 北角七姊妹石、泳棚和填海的地方记忆
- id: case_cn_hk_yau_ma_tei_mahjong_hands_1953
  title: 香港油麻地｜麻将桌上多出的手
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 22.3115
    lng: 114.1707
    precision: city
    location_name: 中国香港 · 油麻地弥敦道范围参考
    culture_region: 东亚 · 中国香港
  map_label: 油麻地
  location_note: 报道指旧楼在弥敦道 452 号；点位仅表示油麻地区域，旧建筑与现况不可混同。
  temporal:
    year_start: 2018
    year_end: 2018
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一桌四人打麻将，牌局正进行时，桌边却仿佛多出两双手：一双伸出来摸牌，另一双向四人收钱。讲述说，四个人吓得离开房间，跑去求助。
  - 1953 年 3 月，香港报纸刊登了油麻地的这则消息。多年后的报道翻看旧报，记录到现场曾引来围观，也记录了关于租务和传闻来源的其他猜测。
  - 纸上留下的是当时人们如何报道、讨论这件事；多出的手从何而来，没有得到一致结论。传言在之后的叙述中又与麻将禁忌相遇，版本逐渐增多。
  sources:
  - citation: 林乐轩：〈弥敦道“鬼屋”四人夜晚打牌多四只鬼手〉，《香港01》，2018 年 8 月 24 日。
    type: press_account
    url: https://www.hk01.com/%E7%86%B1%E7%88%86%E8%A9%B1%E9%A1%8C/224871/7%E6%9C%8814%E7%9B%82%E8%98%AD%E7%AF%80-%E9%A6%99%E6%B8%AF%E5%8F%B2%E4%B8%8A%E6%9C%80%E5%8B%81%E9%AC%A7%E9%AC%BC%E4%BA%8B%E6%95%85-%E5%BD%8C%E6%95%A6%E9%81%93-%E9%AC%BC%E5%B1%8B-4%E4%BA%BA%E6%89%93%E7%89%8C%E5%A4%9A4%E9%9A%BB%E6%89%8B
    locator: 回顾 1953 年报纸报道、围观和不同说法
