- id: case_sg_woodneuk_grandmother_2021
  title: 新加坡｜祖母讲的 Woodneuk 旧宅
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 1.30875
    lng: 103.812222
    precision: city
    location_name: 新加坡 · Istana Woodneuk 建筑参考点
    culture_region: 东南亚 · 新加坡
  map_label: Woodneuk
  location_note: 点位是旧宅建筑的地图参考；此处为遗址，讲述不构成进入许可。
  temporal:
    year_start: 2021
    year_end: 2021
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 荷兰路附近有一座旧宅。祖母告诉孙辈，过去人们听说这里闹鬼，很少靠近；如今倒有年轻人去拍照，她觉得他们打扰了住在故事里的旧主人。
  - 她讲到一位苏丹和他的妻子，说妻子十分喜欢房子，离世后仍留在这里。采集者保留了祖母的讲述，也承认宅邸历史与传说的细节未必一致。
  - 这段家庭回忆于 2021 年采录。旧宅及其所在地可以在地图上辨认；关于谁留在屋里的说法，则属于讲述者的民间故事。
