  - id: case_dead_internet_theory_2021
    title: 死互联网假说与算法幽灵叙事
    aliases: [Dead Internet Theory, IlluminatiPirate, 死互联网理论, 算法幽灵]
    genre: creepypasta_ostension
    credibility_tier: F
    note_kind: legend
    location: {lat: 39.8283, lng: -98.5795, precision: culture_region, location_name: 美国 · 数字原生空间（国别参考点）, culture_region: 北美 · 英语互联网}
    location_note: 本条目为数字原生作品与当代网络阴谋叙事，坐标采用美国国别参考点标示其 2021 年英文论坛原帖语境，用以区分夸大化的叙事隐喻与真实自动化流量统计。
    temporal: {year_start: 2021, era_label: 2021 年论坛原帖与媒体讨论期, uncertainty_note: 2021 年 1 月英文论坛出现系统性原帖，同年 8 月经《大西洋月刊》报道扩散。}
    paragraphs:
      - 2021 年初，网名“IlluminatiPirate”的用户在英文网络论坛 Agora Road’s Macintosh Cafe 发布长帖，提出所谓“死互联网假说”（Dead Internet Theory）：声称互联网大致已在 2016 至 2017 年间“死亡”，此后网上绝大多数帖子、热点评论与审美趋势均由人工智能与机器人账号相互生成、自导自演，只为诱导尚存的少量真人用户沉浸其中并接受舆论引导。
      - 同年 8 月，《大西洋月刊》记者 Kaitlyn Tiffany 撰文剖析这一说法，指出“全网已被政府与科技公司用机器人彻底替代”的阴谋论前提并不成立，但“觉得网络越来越空洞、处处像脚本回复”的情绪却引发了广泛共鸣。近年的网络安全流量观测确实记录到爬虫与自动脚本占据可观比例，但真实人类社区与机构通讯依然活跃。
      - 随着大语言模型与合成图片在 2023 年后普及，计算机与社会媒体学者开始重新讨论该假说如何从边缘论坛怪谈演变为形容“低质量合成内容泛滥”的文化隐喻。归档时应将实证层面的机器人流量监测同整体阴谋叙事分开，避免把隐喻当作事实结论。
    sources:
      - {citation: 'Kaitlyn Tiffany, "Maybe You Missed It, but the Internet ''Died'' Five Years Ago", The Atlantic, August 31, 2021.', type: journalism, url: 'https://www.theatlantic.com/technology/archive/2021/08/dead-internet-theory-wrong-but-feels-true/619937/', locator: Agora Road 论坛原帖、阴谋叙事与用户疏离感}
      - {citation: 'Pranav Muzumdar et al., "The Dead Internet Theory: A Survey on Artificial Interactions and the Future of Social Media", arXiv:2502.00007, 2025.', type: academic_article, url: 'https://arxiv.org/abs/2502.00007', locator: 社交平台机器人交互比例、合成媒体与死互联网概念综述}
    ostension_of: motif_urban_ostension_liminal
    compare: [case_polybius_arcade_legend_2000, case_ghq_ghost_protocol_2026]
    bridge: {entry: LAN-6-0002, cluster: sid_liminal, trail: all, label: 算法幽灵与合成文本感知, rationale: 联系大型语言模型的语言能力与偏差，区分可测量的生成内容比例与“全网只剩机器人”的当代赛博传说。}

  - id: case_r_place_liminal_poolrooms_2020
    title: 泳池空间与阈限建筑视觉民俗
    aliases: [The Poolrooms, Dream Pools, Jared Pike, r/LiminalSpace, 阈限泳池]
    genre: creepypasta_ostension
    credibility_tier: F
    note_kind: legend
    location: {lat: 39.8283, lng: -98.5795, precision: culture_region, location_name: 美国 · 数字原生空间（国别参考点）, culture_region: 北美 · 英语互联网}
    location_note: 本条目为数字原生作品与计算机三维渲染建筑视觉民俗，坐标采用美国国别参考点标示创作者与英文网络社群环境，画面所描绘的无尽室内泳池并不存在于现实。
    temporal: {year_start: 2020, era_label: 2020 年起视觉渲染与网络社区传播, uncertainty_note: 涵盖 2020 年代初《梦幻泳池》三维系列及 Reddit 阈限空间社区的图像汇流。}
    paragraphs:
      - 2020 年以来，随着《后室》与 Reddit 社区 r/LiminalSpace 的流行，美国三维视觉艺术家 Jared Pike 创作的《梦幻泳池》（Dream Pools，俗称“泳池空间”/Poolrooms）成为最具代表性的网络阈限建筑意象之一。画面总是呈现连绵不断、铺满白瓷砖的室内水道、旋转阶梯、天窗冷光与静止的水面，既像似曾相识的度假村和地下浴场，又彻底剥离了救生员、泳客与具体出口。
      - 在受访中，Jared Pike 表示自己最初只是结合老旧水上乐园的记忆与三维渲染软件探索梦境建筑，但图像在网络流传后，很快被网友纳入共创楼层编号、水下回响音效与逃生规则之中，逐渐从单纯的视觉艺术转化为集体建构的数字传说空间。
      - 环境心理学家 Alexander Diel 与 Michael Lewis 在 2022 年《Journal of Environmental Psychology》的研究提出，物理空间中的“结构性轻微偏离”（如比例失调、功能线索缺失但视觉高度熟悉的通道）会诱发类似“恐怖谷”的不适感。将心理学实验与视觉民俗并读，可以清晰看见数字创作如何放大这种微妙的空间错位感。
    sources:
      - {citation: 'Designboom, "Diving into 3D artist Jared Pike''s pool dreamscapes and imaginary liminal interiors", February 17, 2024.', type: interview, url: 'https://www.designboom.com/art/jared-pike-interview-dream-pools-3d-digital-art-liminal-spaces-02-17-2024/', locator: 《梦幻泳池》建筑灵感、三维建模与虚构空景}
      - {citation: 'Northeastern University News, "The dreamlike images of pools you''ve been seeing on the internet are made by a Northeastern grad", June 17, 2025.', type: institutional_account, url: 'https://news.northeastern.edu/2025/06/17/the-dream-pools-jared-pike/', locator: 泳池空间从个人作品到网络阈限民俗的传播}
      - {citation: 'Alexander Diel & Michael Lewis, "Structural deviations drive an uncanny valley of physical places", Journal of Environmental Psychology 82, 2022.', type: peer_reviewed, url: 'https://doi.org/10.1016/j.jenvp.2022.101844', doi: '10.1016/j.jenvp.2022.101844', locator: 阈限建筑结构偏差与空间恐怖谷效应}
    ostension_of: [case_the_backrooms_2019, motif_urban_ostension_liminal]
    compare: [case_house_of_leaves_ergodic_2000]
    bridge: {entry: LIT-4-0004, cluster: sid_liminal, trail: all, label: 无尽瓷砖空间与数字民俗, rationale: 把数字时代的新形态视觉叙事与建筑空间心理研究合读，理解三维空景如何变成集体共享的阈限异境。}

  - id: case_ru_uvb76_buzzer_station
    title: 俄罗斯｜UVB-76 蜂鸣器短波电台之谜
    aliases: [UVB-76, The Buzzer, MDZhB, 4625 kHz, 短波蜂鸣器电台]
    genre: urban_legend
    credibility_tier: B
    note_kind: legend
    location: {lat: 56.0850, lng: 37.0870, precision: city, location_name: 俄罗斯莫斯科州 · 波瓦罗沃历史发射区（参考点）, culture_region: 欧洲 · 俄罗斯}
    location_note: 坐标对应无线电监测者定位的 2010 年前莫斯科州波瓦罗沃发射区参考点；此后发射点迁往圣彼得堡周边及普斯科夫一带，实际军事通信用途未获官方公布。
    temporal: {year_start: 1973, era_label: 约 20 世纪 70 年代末至今持续播送, uncertainty_note: 连续单调蜂鸣脉冲约自 1982 年起被国际短波爱好者稳定记录。}
    paragraphs:
      - 在短波 4625 千赫（上边带调幅）上，一座呼号曾用 UZB-76（民间习称 UVB-76）与 MDZhB 的电台数十年如一日地连续播送单调、粗糙的低频蜂鸣声，每分钟大约响起二十余次；极少数时候，蜂鸣会突然中断，改由人声用俄语朗读一串字母姓名代码与数字组，随后又恢复无止境的“嗡——嗡——”声。
      - 无线电爱好者的测向与档案追踪显示，该台站早年位于莫斯科西北的波瓦罗沃，2010 年前后发射地点转移至圣彼得堡与普斯科夫方向，而播音中偶尔还会泄漏麦克风旁的背景交谈或走动声。由于俄罗斯官方从未就其性质发布说明，网络上围绕它衍生出“冷战自动核反击死手开关”或神秘气候控制指令等诸多都市传闻。
      - 无线电研究站 Priyom 与《Wired》杂志的调查均区分了“可确认的射频观测事实”与“缺乏根据的末日猜测”：在工程与军事通信史上，持续发射占有标记音能帮助维护军区战备信道并防止其他台站占用频率，而偶尔播报的加密语音更符合常规单向军事调度特征，并不支持各类超自然或末日阴谋假说。
    sources:
      - {citation: 'Priyom.org, "The Buzzer (UVB-76 / MDZhB / ZhUOZ) Profile & Broadcast Logs".', type: institutional_account, url: 'https://priyom.org/military-stations/russia/the-buzzer', locator: 4625 kHz 连续蜂鸣参数、呼号变化与发射点迁移监测}
      - {citation: 'Peter Savodnik, "Inside the Buzzer: The Russian Shortwave Radio Enigma", Wired, September 27, 2011.', type: journalism, url: 'https://www.wired.com/2011/09/ff-uvb76/', locator: 波瓦罗沃废弃旧台址寻访与无线电爱好者调查}
    compare: [case_us_chicago_max_headroom_1987, case_us_taos_hum_1993]
    bridge: {entry: PHI-2-0002, cluster: sid_crypt, trail: all, label: 短波标记信号与推理边界, rationale: 依托怀疑论、证据与证言视角，区分可复现的无线电测向记录与缺乏官方文献支持的“末日开关”民间推想。}

  - id: case_us_taos_hum_1993
    title: 美国陶斯｜陶斯嗡鸣与低频环境声调查
    aliases: [Taos Hum, The Hum, 陶斯嗡鸣, 低频环境嗡鸣]
    genre: urban_legend
    credibility_tier: B
    note_kind: legend
    location: {lat: 36.4072, lng: -105.5731, precision: city, location_name: 美国新墨西哥州 · 陶斯地区, culture_region: 北美 · 美国新墨西哥州}
    location_note: 坐标为新墨西哥州陶斯镇区域参考点，对应 1993 年联邦与高校联合声学调查的田野范围，并非已知具体声源位置。
    temporal: {year_start: 1993, year_end: 1993, era_label: 1993 年联合科学测量调查, uncertainty_note: 当地居民自 1991 年前后开始反映嗡鸣，1993 年夏季进行集中仪器监测。}
    paragraphs:
      - 20 世纪 90 年代初，美国新墨西哥州北部小城陶斯（Taos）部分居民向媒体与国会反映，当地持续出现一种微弱而恼人的低频嗡鸣，听起来像远处停着一辆怠速运转的柴油卡车，在室内与夜间尤显清晰。然而在同一个家庭中，有人被声音折磨得难以入眠，另一些人却丝毫听不见任何异响。
      - 在居民怀疑声音与附近国家实验室或军事通讯设施有关后，1993 年夏天，由新墨西哥大学机械工程学者 Joe Mullins、洛斯阿拉莫斯国家实验室、桑迪亚国家实验室及空军菲利普斯实验室组成的联合团队进驻陶斯，部署声学麦克风、地震传感器与电磁检测仪进行了密集监测。受访听者普遍估计声音频率在 30 至 80 赫兹之间，但仪器却未测出任何与主诉匹配的环境声波、地震或电磁信号。
      - 《洛杉矶时报》1993 年的现场报道与《Skeptoid》汇总的声学研究指出，“陶斯嗡鸣”迄今没有单一确定结论：部分学者考虑个体自发性耳声发射、低频耳鸣或鼓膜张肌自发收缩等生理差异，也有研究者探讨未完全测及的局部次声或工业共振。它同时展现了环境传闻与仪器测量之间复杂的感受落差。
    sources:
      - {citation: 'Los Angeles Times, "Mysterious Low-Level Noise Destroys Peace, Serenity of Taos Residents", July 18, 1993.', type: journalism, url: 'https://www.latimes.com/archives/la-xpm-1993-07-18-mn-14234-story.html', locator: 1993 年新墨西哥大学、洛斯阿拉莫斯与桑迪亚联合实地调查}
      - {citation: 'Brian Dunning, "Can You Hear the Hum?", Skeptoid Episode #90.', type: institutional_account, url: 'https://skeptoid.com/episodes/4090', locator: Joe Mullins 与 Norman Kelly 声学调查总结及听觉机制分析}
    compare: [case_coventry_sword_lab_1998, case_andover_tremors_1970s]
    bridge: {entry: PHY-4-0003, cluster: sid_hag, trail: all, label: 低频声波测量与感知差异, rationale: 对照声波强度、响度与多普勒效应中的听阈概念，理解为何精密监测未检出对应外部信号而部分听者仍报告真实痛苦。}

  - id: case_us_chicago_max_headroom_1987
    title: 美国芝加哥｜1987 年电视信号劫持事件档案
    aliases: [Max Headroom signal hijackings, Max Headroom incident, 1987 芝加哥电视劫持, WGN WTTW 劫持案]
    genre: urban_legend
    credibility_tier: B
    note_kind: legend
    location: {lat: 41.8781, lng: -87.6298, precision: city, location_name: 美国伊利诺伊州 · 芝加哥, culture_region: 北美 · 美国芝加哥}
    location_note: 坐标为芝加哥市区参考点，标记 1987 年 11 月 22 日晚间 WGN-TV 与 WTTW 电视台微波中继链路遭外部发射器覆盖的城市，不指向未知作案者位置。
    temporal: {year_start: 1987, year_end: 1987, era_label: 1987 年 11 月 22 日晚间, uncertainty_note: 有精确电视播出时间记录：当晚 21 时 14 分劫持 WGN-TV，23 时 15 分劫持 WTTW。}
    paragraphs:
      - 1987 年 11 月 22 日晚 9 时 14 分，芝加哥独立电视台 WGN-TV 正在直播体育新闻，信号忽然黑屏十余秒，随即切入一名戴着科幻电视人物“麦克斯·海德鲁姆”（Max Headroom）橡胶面具与墨镜的男子：他在旋转波纹金属板前剧烈晃动，伴随刺耳嗡鸣持续约半分钟，直到值班工程师切换演播室至发射塔链路频率才得以切断。
      - 两小时后的晚上 11 时 15 分左右，公共电视台 WTTW 在重播科幻剧《神秘博士》期间再次遭同一扮相劫持。由于西尔斯大厦发射台深夜无人值守，控制室无法立即中断这段持续约 90 秒的盗播画面——男子口齿含混地调侃体育主播、举起百事可乐罐讽刺原作代言的“新可乐”广告，最后弯腰露出臀部并由同伙用苍蝇拍抽打，画面随即突然中止。
      - 联邦通信委员会（FCC）与联邦调查局（FBI）事后调查认为，要从地面向高楼微波接收端定向发射更强的压制信号，需要相当专业的广播发射机、微波天线与工程知识，但因追诉期届满且线索零散，真实作案人始终未能落网。这起真实发生却长期悬而未决的技术恶作剧，也成为后来“模拟恐怖”作品反复效仿广播侵入桥段的现实原型。
