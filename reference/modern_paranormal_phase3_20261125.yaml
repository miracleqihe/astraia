records:
  - id: case_scp_173_containment_2007
    title: SCP-173 与集体协作收容档案
    aliases: [SCP-173, The Sculpture, Moto42, 最初的收容物, 混凝土雕塑]
    genre: creepypasta_ostension
    credibility_tier: F
    note_kind: legend
    location: {lat: 39.8283, lng: -98.5795, precision: culture_region, location_name: 美国 · 数字原生空间（国别参考点）, culture_region: 北美 · 英语互联网}
    location_note: 本条目为数字原生作品，坐标取美国国别参考点标示 4chan /x/ 版面发源的英语网络语境，不指向任何现实收容设施或物理地点。
    temporal: {year_start: 2007, year_end: 2007, era_label: 2007 年 4chan /x/ 论坛初稿, uncertainty_note: 标记匿名作者首发并开启后续协作世界观的年份。}
    paragraphs:
      - 2007 年 6 月，网名 Moto42 的作者在英文论坛 4chan 的超自然板块 /x/ 发布了一则简短帖子：编号“SCP-173”的混凝土与钢筋雕塑只有在无人直视时才会高速移动并折断人的颈部，因此清洁人员必须轮流保持视线接触。这则模仿机密实验档案的虚构文本附带了一张雕塑照片，成为后来整个“SCP 基金会”协作写作计划的起点。
      - 围绕这条孤立的条目，网络参与者逐渐仿照同一套“项目等级—特殊收容措施—描述—附录”文书模板续写成千上万份档案，形成高度制度化的共创宇宙。正因体裁表面采用冷静、克制的科研报告与行政公文口吻，读者的不安不再依赖传统恐怖修辞，而是来自“仿佛确有某个隐秘机构正在日常运转”的拟真形式。
      - 美国新闻史与媒介研究学者 Hayley McCullough 在《American Journalism》的评述中指出，SCP 维基将官方文献体例转化为参与式数字民俗，使作者与读者在共享规则框架内协作造物。阅读时须将作品本身的虚构收容机制、外部雕塑艺术品原型以及数字共创史严格区分开来。
    sources:
      - {citation: 'Moto42 (Wesley Williams), "SCP-173", SCP Foundation Wiki, 2007.', type: community_retelling, url: 'https://scp-wiki.wikidot.com/scp-173', locator: 特殊收容措施、项目等级与最初档案格式}
      - {citation: 'Hayley McCullough, "SCP Foundation Wiki, https://scp-wiki.wikidot.com/", American Journalism 39(2), 2022, pp. 239–241.', type: peer_reviewed, url: 'https://doi.org/10.1080/08821127.2022.2064167', doi: '10.1080/08821127.2022.2064167', locator: 伪官方档案体裁与协同叙事机制分析}
    ostension_of: motif_urban_ostension_liminal
    compare: [case_ghq_ghost_protocol_2026, case_the_backrooms_2019]
    bridge: {entry: LIT-2-0004, cluster: sid_liminal, trail: all, label: 收容档案体例与读者契约, rationale: 将 SCP-173 的伪官方档案写作与叙事伦理、读者契约对读，辨析技术官僚文体如何在网络创作中营造真实感。}

  - id: case_local58_analog_horror_2015
    title: Local 58 与模拟电视恐怖体裁
    aliases: [Local 58, LOCAL58TV, Kris Straub, Weather Service, 模拟恐怖]
    genre: creepypasta_ostension
    credibility_tier: F
    note_kind: legend
    location: {lat: 39.8283, lng: -98.5795, precision: culture_region, location_name: 美国 · 数字原生空间（国别参考点）, culture_region: 北美 · 英语互联网}
    location_note: 本条目为数字原生作品，坐标采用美国国别参考点对应作者发布的英语网络语境；作品设定的“梅森县地方电视台”为完全虚构台标。
    temporal: {year_start: 2015, era_label: 2015 年起网络短片连载, uncertainty_note: 以《气象服务》发布及随后形成模拟恐怖（Analog Horror）标志系列为起点。}
    paragraphs:
      - 2015 年底，美国创作者 Kris Straub 在网络上推出短片《气象服务》（Weather Service），假借名为 WCLV-TV（Local 58）的地方公共电视台节目表，插入逐步升级的紧急警报：屏幕先呼吁民众“不要直视夜空与月亮”，随后却被篡改并转为“我们现在共同仰望”。作者将模拟电视的雪花噪点、卡带扫描线、台标提示音与冷战式公共防灾广播结合，让熟悉的居家媒介变成陌生威胁的通道。
      - 此后的《应急广播测试》《收台》与《高速路最短路线》等短片，把“模拟恐怖”（Analog Horror）确立为辨识度极高的网络恐怖体裁。研究者注意到，这类作品几乎不依靠现代特效，而是借公共广播的权威感与画面受干扰时的信息残缺，引导观众自行补全缺失的情节与恐慌。
      - 电影与民俗学者在探讨模拟恐怖的论文中指出，Local 58 通过模拟旧式录像带归档与信号被劫持的质感，唤醒观众对冷战核预警、地方社区孤立以及屏幕指令失灵的集体记忆。归档本条目重在梳理其媒介修辞与体裁影响，而不将虚构台标混同于现实公共广播事件。
    sources:
      - {citation: 'Kris Straub, LOCAL58TV Official Digital Archive.', type: institutional_account, url: 'https://local58.tv/', locator: 虚构地方电视台档案与核心短片目录}
      - {citation: 'Elinor Dolliver, "The Surprising Folklore of Analog Horror", Film Quarterly 79(3), 2026, pp. 8–18.', type: peer_reviewed, url: 'https://doi.org/10.1525/fq.2026.79.3.8', doi: '10.1525/fq.2026.79.3.8', locator: 模拟恐怖作为数字民俗的体裁溯源}
      - {citation: 'Serdula, "And I Must Scream: Exploring the Distortion of Humanity in Analog Horror", University of North Carolina Asheville Journal of Undergraduate Research, 2023.', type: academic_article, url: 'https://www.unca.edu/sites/default/files/2023-05/Serdula_Paper.pdf', locator: 广播警报格式与磁带失真美学研究}
    ostension_of: motif_urban_ostension_liminal
    compare: [case_us_chicago_max_headroom_1987, case_mandela_catalogue_2021]
    bridge: {entry: SOC-5-0001, cluster: sid_liminal, trail: all, label: 紧急广播框架与媒介恐慌, rationale: 将虚构地方台的紧急警报叙事与媒体框架、议程设置对读，理解权威广播体例为何极易诱发紧迫感。}

  - id: case_mandela_catalogue_2021
    title: 曼德拉记录与替代体恐怖叙事
    aliases: [The Mandela Catalogue, Alex Kister, Alternates, 曼德拉记录, 替代体]
    genre: creepypasta_ostension
    credibility_tier: F
    note_kind: legend
    location: {lat: 43.2558, lng: -88.1912, precision: city, location_name: 美国威斯康星州 · 里奇菲尔德地区（发源参考点）, culture_region: 北美 · 英语互联网}
    location_note: 本条目为数字原生作品，坐标参考创作者 Alex Kister 启动该视频系列的威斯康星州地区背景，作品中的“曼德拉县”及警务录像完全属于虚构。
    temporal: {year_start: 2021, era_label: 2021 年起网络视频连载, uncertainty_note: 标示《第一卷》与政府防灾教学短片在视频平台发布及走红年份。}
    paragraphs:
      - 2021 年，青年创作者 Alex Kister 在视频平台发布《曼德拉记录》（The Mandela Catalogue），以 20 世纪 90 年代至 21 世纪初的复古教学录像、警局培训带与失踪案简报为外壳，虚构了一座受神秘“替代体”（Alternates）渗透的威斯康星“曼德拉县”。片中将伪人生物描绘为能够模仿熟人声音、扭曲面部比例并利用人类心理脆弱处诱导绝望的存在。
      - 作品把宗教经文异变、公共安全教育指南和家用 VHS 录像带的低保真画面揉合在一起，通过刻意拉长的静默镜头、突然畸变的黑白人脸以及白底黑字警句，把日常家庭监控与电视教程改造成心理压迫工具。随着网友二次解析和线索梳理，这类“替代体”形象迅速演变为当代互联网流行恐怖符号。
      - 佐治亚理工学院媒介研究学位论文与《F Newsmagazine》的创作者访谈都讨论了该作品如何用有限成本制造“中介化的诡异真实感”：创作者借助失真画面触发观众对人脸辨识的微妙违和，并将民俗化的“伪人替身”焦虑移植到现代家庭监控与公共指南语境之中。
    sources:
      - {citation: 'Georgia Institute of Technology, "Analog Horror and the Internet: The Mandela Catalogue and the Uncanny Reality of Mediation", Master Thesis.', type: academic_thesis, url: 'https://smartech.gatech.edu/handle/1853/73617', locator: 模拟恐怖的中介性、恐怖谷人脸与录像拼贴}
      - {citation: 'F Newsmagazine, "Ghosts in the Machine: The Fearful Symmetry of Alex Kister’s The Mandela Catalogue", October 2022.', type: interview, url: 'https://fnewsmagazine.com/2022/10/01/ghosts-in-the-machine-the-fearful-symmetry-of-alex-kisters-the-mandela-catalogue/', locator: Alex Kister 创作历程与宗教、影像动机访谈}
    ostension_of: motif_urban_ostension_liminal
    compare: [case_local58_analog_horror_2015, case_the_backrooms_2019]
    bridge: {entry: LIT-3-0003, cluster: sid_hag, trail: all, label: 拟真录像中的时间与舞台性, rationale: 借戏剧空间、时间与舞台性观念，观察静态黑屏字幕、门廊视角和失真录音如何在虚构档案里持续积累张力。}

  - id: case_mystery_flesh_pit_2019
    title: 神秘血肉矿井与伪官方地质档案
    aliases: [Mystery Flesh Pit National Park, MFPNP, Trevor Roberts, Permian Basin Superorganism, 血肉国家公园]
    genre: creepypasta_ostension
    credibility_tier: F
    note_kind: legend
    location: {lat: 31.8457, lng: -102.3676, precision: city, location_name: 美国得克萨斯州西部 · 二叠纪盆地设定参考区, culture_region: 北美 · 英语互联网}
    location_note: 本条目为数字原生作品，坐标参考故事背景所设定的西得克萨斯二叠纪盆地周边地带，现实中并无该国家公园或地下巨型生物遗迹。
    temporal: {year_start: 2019, era_label: 2019 年起跨平台虚构档案创作, uncertainty_note: 自 2019 年在 Reddit 与 Tumblr 连载虚构公园折页、地质剖面图与 2007 年事故报告至今。}
    paragraphs:
      - 2019 年起，设计师 Trevor Roberts 在 Reddit 与 Tumblr 等平台以“神秘血肉矿井国家公园”（Mystery Flesh Pit National Park）为题，虚构了一段跨越数十年的架空历史：石油钻探队在得克萨斯二叠纪盆地地下发现一个宛如活体器官的巨型超生物孔洞，随后私人企业与联邦机构将其包装成观光景区，直到 2007 年暴雨引发灾难性苏醒并导致永久封园。
      - 整部作品以逼真的二十世纪七八十年代旅游宣传折页、地质横截面图、游客守则、商业开发简报与事后调查报告组成，甚至包含印有复古排版的警示标牌与医学观察记录。作者通过极度平静的科普口吻和官僚化安全免责声明，反衬地下血肉景观与资本开发之间的荒诞反差。
      - 2023 年《福布斯》专访记录了作者从一张腐烂哈密瓜照片获得灵感、并利用工业档案设计构建架空世界观的过程。该案例清楚展现了当代数字民俗如何将生态想象、企业危机公关讽刺与视觉平面设计整合为一整套“可信的虚构博物档案”。
    sources:
      - {citation: 'Trevor Roberts, Mystery Flesh Pit National Park Official Digital Archive.', type: institutional_account, url: 'https://mysteryfleshpit.tumblr.com/', locator: 虚构国家公园导览折页、地质剖面与事故报告汇编}
      - {citation: 'Josh Weiss, "The Strange Appeal Of Mystery Flesh Pit: How Trevor Roberts Built The Wildest Theme Park In All Of Fiction", Forbes, June 6, 2023.', type: journalism, url: 'https://www.forbes.com/sites/joshweiss/2023/06/06/the-strange-appeal-of-mystery-flesh-pit-how-trevor-roberts-built-the-wildest-theme-park-in-all-of-fiction/', locator: 创作起源、世界观设计及企业讽刺访谈}
    ostension_of: motif_urban_ostension_liminal
    compare: [case_scp_173_containment_2007, case_ghq_ghost_protocol_2026]
    bridge: {entry: LIT-4-0002, cluster: sid_crypt, trail: all, label: 伪官方地质文书与真实契约, rationale: 从非虚构叙事策略与真实契约入手，分析公园指南、事故简报和地质图示如何在视觉上建立架空史料权威。}

  - id: case_house_of_leaves_ergodic_2000
    title: 《叶之屋》与不可能空间超文本
    aliases: [House of Leaves, Mark Z. Danielewski, The Navidson Record, 叶之屋, 遍历文学]
    genre: creepypasta_ostension
    credibility_tier: F
    note_kind: legend
    location: {lat: 34.0522, lng: -118.2437, precision: city, location_name: 美国加利福尼亚州 · 洛杉矶（出版与早期网络联动参考点）, culture_region: 北美 · 英语互联网}
    location_note: 本条目涵括早期网络论坛连载及数字原生作品互文实验，坐标取作者创作与出版发源城市洛杉矶作参考，书中房屋及纪录片完全虚构。
    temporal: {year_start: 2000, year_end: 2000, era_label: 2000 年出版及同期网络超文本扩散, uncertainty_note: 2000 年由万神殿书局首次出版，之前曾在网络社群与独立传阅稿中流传。}
    paragraphs:
      - 美国作家 Mark Z. Danielewski 于 2000 年出版的《叶之屋》（House of Leaves）采用多层伪学术嵌套结构：文身店学徒 Johnny Truant 整理盲人老者 Zampanò 遗留的手稿，后者逐帧评述一部并不存在的纪录片《纳维森纪录》——片中一家人搬入弗吉尼亚老宅后，发现房屋内部测量尺寸竟然比外部宽阔一分五寸，且门后不断延伸出漆黑无底的迷宫走廊。
      - 小说在排版上打破常规线性阅读：字句时而倒置、斜排、缩成窗口或只剩单字，整页充斥相互跳转的伪引文注脚与附录线索，甚至规定“房屋”一词一律印成蓝色。读者必须像翻检实体迷宫或浏览超链接一样在前后页来回穿梭，被学界视作纸本媒介上的“遍历文学”（ergodic literature）与后续网路“阈限空间”创作的重要先声。
      - 文学与新媒体学者 N. Katherine Hayles 与 Jessica Pressman 在相关研究中指出，作品一方面以印刷书籍的物理材质模拟数字超文本与论坛检索，另一方面通过配套网络讨论版与音乐专辑拓展出跨媒介共读生态，成为数字时代前夕“伪档案空间恐怖”的典范文本。
    sources:
      - {citation: 'N. Katherine Hayles, "Saving the Subject: Remediation in House of Leaves", American Literature 74(4), 2002, pp. 779–806.', type: peer_reviewed, url: 'https://doi.org/10.1215/00029831-74-4-779', doi: '10.1215/00029831-74-4-779', locator: 技术文本、版式迷宫与跨媒介再中介}
      - {citation: 'Jessica Pressman, "House of Leaves: Reading the Networked Novel", Studies in American Fiction 34(1), 2006, pp. 107–128.', type: peer_reviewed, url: 'https://doi.org/10.1353/saf.2006.0015', doi: '10.1353/saf.2006.0015', locator: 网络化小说结构、论坛互动与超文本阅读}
    ostension_of: motif_urban_ostension_liminal
    compare: [case_the_backrooms_2019, case_r_place_liminal_poolrooms_2020]
    bridge: {entry: LIT-4-0004, cluster: sid_liminal, trail: all, label: 纸本迷宫与超文本形态, rationale: 将数字时代的非虚构新形态与《叶之屋》伪学术注脚对照，观察纸面排版和超链接如何共同营造迷失感。}

  - id: case_marble_hornets_2009
    title: 大理石黄蜂与瘦长鬼影伪纪录片
    aliases: [Marble Hornets, Troy Wagner, Joseph DeLage, totheark, 大理石黄蜂]
    genre: creepypasta_ostension
    credibility_tier: F
    note_kind: legend
    location: {lat: 33.2098, lng: -87.5692, precision: city, location_name: 美国亚拉巴马州 · 塔斯卡卢萨（拍摄发源参考点）, culture_region: 北美 · 英语互联网}
    location_note: 本条目为数字原生作品，坐标参考创作者在亚拉巴马州塔斯卡卢萨制作该网络伪纪录片系列的拍摄区域，剧中实体“The Operator”及案件纯粹虚构。
    temporal: {year_start: 2009, year_end: 2014, era_label: 2009—2014 年 YouTube 连载周期, uncertainty_note: 起于 2009 年 6 月首支视频，止于 2014 年第 87 集完结。}
    paragraphs:
      - 2009 年 6 月，在 Something Awful 论坛诞生“瘦长人”图像仅十天后，美国大学生 Troy Wagner 与 Joseph DeLage 在 YouTube 开设“Marble Hornets”频道，以自称 Jay 的叙述者口吻上传友人 Alex 遗留的未完成学生电影录像带。录像里不断闪现身着西装、没有五官的高大身影，同时伴随着画面撕裂、电磁杂音以及人物的记忆断片。
      - 随着连载推进，另一名为“totheark”的神秘账号以加密视频、摩尔斯电码和倒放画面穿插回应，使观众必须跟踪两个频道、推特线索与时间码来拼接故事。这部横跨五年、共 87 集的交互式伪纪录片把原本停留在论坛修图阶段的“瘦长鬼影”重塑为极具传播力的动态视频传说。
      - 法学与哥特文学研究者指出，《大理石黄蜂》示范了“反向展演”如何在视频平台落地：创作者不声称自己是纯小说作者，而是扮演“整理失踪友人旧录像的调查员”，从而把实时评论区解谜与后续模仿拍摄一同吸纳进当代网络民间传说之中。
    sources:
      - {citation: 'Cathay Y. N. Smith, "Beware the Slender Man: Intellectual Property and Internet Folklore", Florida Law Review 73(3), 2021.', type: peer_reviewed, url: 'https://scholarship.law.ufl.edu/flr/vol73/iss3/3/', locator: Marble Hornets 对瘦长鬼影视频化传播与数字民俗权利探讨}
      - {citation: 'Edinburgh University Press, "In the Dark: The Afterlife of a Horror Hoax", Gothic Studies, 2023.', type: peer_reviewed, url: 'https://www.euppublishing.com/doi/10.3366/gothic.2023.0145', doi: '10.3366/gothic.2023.0145', locator: 伪纪录片叙事、电磁故障美学与双频道互动}
