  - id: case_polybius_arcade_legend_2000
    title: 波利比乌斯街机与记忆改造都市传说
    aliases: [Polybius, Sinneslöschen, 波利比乌斯街机, 波利比乌斯传说]
    genre: creepypasta_ostension
    credibility_tier: F
    note_kind: legend
    location: {lat: 45.5152, lng: -122.6784, precision: city, location_name: 美国俄勒冈州 · 波特兰（传说设定参考点）, culture_region: 北美 · 英语互联网}
    location_note: 本条目为数字原生作品与现代网络伪史传说，坐标采用传说虚构设定的 1981 年俄勒冈州波特兰市区作为参考点，历史文献从未证实该街机曾实际存在。
    temporal: {year_start: 2000, year_end: 2000, era_label: 2000 年前后街机网站建档形成传说, uncertainty_note: 最早确切文本见于 2000 年前后 coinop.org 网站收录并经 2003 年游戏杂志传播。}
    paragraphs:
      - 这则广为流传的街机都市传说宣称，1981 年俄勒冈州波特兰郊区的几家游乐场曾短暂停放过一款名为“波利比乌斯”（Polybius）、署名为德语词汇“Sinneslöschen”（意为感官消除）的神秘街机。故事说，该游戏画面令人极度上瘾，却会引发玩家健忘、夜惊与幻觉，随后有黑衣政府人员定期前去抄录主机数据，并很快将机台全部撤走。
      - 经《Skeptoid》与游戏史媒体《Eurogamer》追查，这则传闻的最早文本记录源自 2000 年前后复古街机资料站 coinop.org 的匿名投稿，随后在 2003 年《GamePro》专栏被提及而迅速扩散。无论厂商登记、版权数据库还是 1981 年地方报纸，都没有找到任何与该机台或公司相符的当代一手证据。
      - 研究者指出，该传说之所以逼真，是因为它巧妙嫁接了 1981 年波特兰确曾发生过的联邦调查局（FBI）打击非法赌博街机行动、早期电子游戏引发光敏不适的新闻记忆，以及冷战心理实验想象。它是一例由早期互联网资料站条目反向演化为全球流行现代传说的典型样本。
    sources:
      - {citation: 'Brian Dunning, "Polybius: Video Game of Death", Skeptoid Episode #362.', type: institutional_account, url: 'https://skeptoid.com/episodes/4362', locator: 1981 年档案空白核查与游戏传说拆解}
      - {citation: 'Eurogamer, "Polybius: The story behind the world''s most mysterious arcade cabinet", May 2015.', type: journalism, url: 'https://www.eurogamer.net/articles/2015-05-22-polybius-the-story-behind-the-worlds-most-mysterious-arcade-cabinet', locator: coinop.org 初见日期、FBI 波特兰行动史实与传闻演变}
    ostension_of: motif_urban_ostension_liminal
    compare: [case_slender_man_2009, case_dead_internet_theory_2021]
