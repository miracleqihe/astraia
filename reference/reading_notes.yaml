  map_label: 中国甘肃敦煌（莫高窟藏经洞《佛说十王经》写本出土地）及南北民间劝善书流播区
  location_note: 敦煌莫高窟第十七窟出土多件唐末五代《佛说十王经》彩绘及抄写卷子（现分藏大英图书馆与大英博物馆等机构），坐标取敦煌莫高窟作源流发端参照区。
case_cn_han_danuo_fangxiangshi_exorcism:
  kind: history
  paragraphs:
  - 先秦至两汉的“大傩”是中国礼制史上规模最为宏阔、记录最为翔实的国家岁末逐疫仪典。依据战国秦汉间编定的《周礼·夏官司马》，专职驱疫武官“方相氏”的标准扮相为“掌蒙熊皮，黄金四目，玄衣朱裳，执戈扬盾，帅百隶而时难，以索室驱疫”；在大丧出殡之际，方相氏更须领先开道，入墓圹以戈击打墓室四隅以逐地下精怪“方良”。《礼记·月令》与《礼记·郊特牲》亦先后记季冬“命有司大傩，旁磔，出土牛，以送寒气”，乃至乡里行“乡人傩”时“孔子朝服而立于阼阶”，足见其深入礼俗秩序。
  - 东汉《后汉书·志第五·礼仪志中》完整保存了洛阳皇宫“先腊一日，大傩，谓之逐疫”的剧场式仪程：宫中拣选十岁以上、十二岁以下中黄门子弟一百二十名充任少年舞童（史称“振子”），头戴赤幘、身着皂衣、手持大摇鼓；由方相氏统领披毛戴角的“十二神兽”（甲作、雄伯、腾简、揽诸、伯奇、强梁、祖明、委随、错断、穷奇、腾根等），在太官唱和之下齐声高诵四言逐疫歌，呼召十二神兽分食凶、魅、虎、疫、梦、寄生虫等十二种灾疠，最后“振子遂出端门”，宫外五营骑士接力传举火把，“以送疫出端门……持炬火送疫，弃洛水中”，随后百官门户换立桃梗、郁垒与苇茭以镇护新年。
  - 从宗教仪礼学与古代公共空间史观察，汉代大傩绝非琐碎巫祝私术，而是帝国岁时更替之际由天子官署主持的“社会洁净与阈限重启工程”：借黄金四目面具、熊皮戈盾与百人鼓噪和唱的强声光震慑，先把积聚一年的瘟疫死亡焦虑具象化、驱赶出皇城边界投入洛水冲流，继之在《论衡·解除》的理性反思与魏晋民间演变中，分化出墓葬镇墓明器（参见荆楚汉墓镇墓兽）与后世南北宗族傩戏面具剧场。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国河南洛阳（东汉洛阳宫廷先腊一日大傩仪典中心）
  location_note: 《周礼》方相氏见载于先秦礼制典籍，《后汉书·礼仪志中》则具体记述东汉首都洛阳南宫北宫“先腊一日大傩”逐疫出端门投火洛水之实景，坐标取东汉洛阳城遗址。
case_cn_guizhou_dixi_nuo_masks:
  kind: story
  paragraphs:
  - 流传于贵州安顺市及周边石砌屯堡村寨的“地戏”，被戏剧史与民俗学界公认为罕见的活态“军傩”祭演体系。其源头可溯至明洪武十四年（1381 年）明太祖朱元璋“调北征南”屯戍黔中后留居当地的江南、江淮军户后裔：屯堡先民为在险峻山地保持战备操演习惯并兼顾岁时驱邪纳吉，将江南乡傩、军人祭旗仪式与传统历史演义说唱熔为一体，在村口平地或打谷场“跳神”，故称“地戏”。
  - 与室内舞台化戏曲不同，安顺地戏最核心的灵性镇物与仪式枢纽在于演员斜戴于额头上方（以黑纱遮面、战裙罩腿、背插靠旗）的白杨木或丁香木雕刻面具——当地敬称为“脸子”。民间严守“神灵附于脸子”的禁忌与礼节：新雕脸子不可随意把玩，必须由师父选吉日祭拜、取公鸡冠血点睛诵咒举行“开光”仪式；每年新春“跳新春”与七月半“跳米花神”开演之前，亦须先备祭品开箱请神，并在地场以武生扮演的开山神将“扫台”（踩八卦步清场驱煞），随后方演《三国》《说唐》《薛刚反唐》《岳飞》等忠义征战故事，戏毕再行“封箱”送神，敬畏森严。
  - 从非物质文化遗产形态学与社会记忆研究看（PLoS ONE 2025 傩面具形制与文化模因研究亦析及傩面造型在区域民俗中的模因延续），安顺屯堡地戏恰与皖南池州五猖宗族傩、江西万载傩戏构成跨省互证谱系：它把“征战英雄谱”与“镇物面具开光驱疫”紧密结合，既满足屯堡移民后裔跨越六百年的军旅历史认同，又借助群体齐集村坪击锣敲鼓清扫村界，发挥凝聚宗族治安与抚慰荒山疾疫焦虑的文化作用。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国贵州安顺（西秀区与平坝屯堡村寨军傩地戏非遗保存区）
  location_note: 安顺地戏集中保存于贵州省安顺市西秀区旧州、七眼桥及平坝天龙屯堡等明代军屯村落（2006 年列入第一批国家级非物质文化遗产），坐标取安顺市作核心采录参照点。
case_cn_baize_shanxiao_spirit_lore:
  kind: story
  paragraphs:
  - 现藏于法国国家图书馆（BnF）的敦煌藏经洞唐代彩绘写本 Pelliot chinois 2682（与大英图书馆藏 S.6261 残卷互证，饶宗颐曾作系统校录），是中国中古以前流传广远却一度散佚的《白泽精怪图》最珍贵第一手实物遗存。书首依托“黄帝巡游东海遇神兽白泽，白泽能言天下鬼神精怪之事”之古老传说，逐条工笔彩绘居家宅院、灶釜窗棂、草木鸡犬与山泽行旅中可能遭遇的百余种异常物候征象——从无故自鸣之器物、鼠衔鱼上屋、白犬入室到古木夜哭，每条不仅具象绘其奇形异状，更标明“其名曰某，呼其名则不伤人”，展现出古代中国人试图以“博物编码与命名”消解未知恐惧的独特智性路径。
  - 与敦煌《白泽图》聚焦日常器物精怪并行的，则是《神异经·西荒经》与东晋葛洪《抱朴子·内篇·登涉》所系统梳理的山林“山魈”（古称山臊、山魅、独足鬼）传统。《神异经》记西方深山中有生灵“长尺余，袒身，捕虾蟹”，善畏人又极怕爆竹声响（此即岁首燃爆竹驱山臊之古源），犯之令人发寒热病疟；而《抱朴子·登涉》进而点出山精形状如小儿而“独足向后，喜来犯人”，须知其名曰“超空”或“晖”，呼名厉斥乃退，及至清代袁枚《子不语·缚山魈》已演化为闽浙粤山野独足多力之野怪形象。
  - 民俗学与动物生态史研究认为，将《白泽精怪图》与《神异经》山魈并读，恰好印证全球别列兹金母题库 `k61c`（“知晓妖鬼真名即可制服”）在东亚的经典表现（亦见于徐华龙 1994 鬼怪谱系参考书目）；同时，所谓独足山魈、深山寒热症候及老物自鸣异象，往往对应古人在山林瘴疠（如疟疾发冷发热）、长臂猿猴类或猛禽夜间怪啸与旧木湿胀发声环境下对生态风险的感知编目。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国甘肃敦煌（唐代《白泽精怪图》出土域）及江南西南山林精怪文献分布区
  location_note: 《白泽精怪图》核心写本 P.2682 出土于甘肃敦煌莫高窟（现藏法国国家图书馆），而《神异经》《抱朴子》“山魈/山臊”则广泛关涉江南山越与西南深林精怪叙事，坐标取甘肃河西走廊东段作综合文献参照。
case_cn_naxi_dongba_spirit_scrolls:
  kind: history
  paragraphs:
  - 2003 年被联合国教科文组织正式列入《世界记忆名录》的“古代纳西东巴文献手稿”，及美国国会图书馆、丽江东巴文化博物馆所保存的数万册手工荛花纸写本，保存着世界罕见仍在活态记忆中使用的象形文字系统。其中在丧葬超度仪典里占有至高地位的布帛或麻纸彩绘巨幅卷轴——《神路图》（纳西语称“含依鲁”，全长达十余米至二十米），堪称中国西南多民族幽冥空间图绘的巅峰之作：每逢盛大葬礼与超度，东巴祭司将《神路图》长卷自高向低铺展于灵堂庭院地面，依图诵唱《指路经》，引导亡魂跨过象征十八层地狱苦难的幽暗鬼域，穿过人间险关与各路鬼神守门，最终循序攀升至三十三天净土祖灵圣地（玉龙雪山之巅）。
  - 与面向死后通道的《神路图》互为表里，东巴经籍体系中另一部维系现世秩序的核心文本《祭署经》，则塑造了高度独到的“署神”（Shu）生态精灵谱系。依纳西族创世神话，人与掌管山林、泉水、飞禽走兽的自然精怪之王“署”本为同父异母兄弟，因早期分家不均与人类烧荒伐木而积怨成仇，经东巴始祖丁巴什罗调停订约：人居村田耕牧，署守山林溪涧，互不侵扰；若人类无节制伐林、毒鱼猎兽或污染水源，“署”便会降下恶疮、水旱与疯癫病症加以惩戒，唯有延请东巴举办“祭署”（放生赎罪与重申盟誓）仪式方得和解。
  - 从多民族宗教史与当代生态人类学审视，纳西族东巴文献与彝族毕摩馆藏手稿（如 EAP081 档案）共同表明，西南山地的“神鬼精灵”绝非漫无目的的怪谈堆砌：《神路图》在视觉形式上吸纳了藏传佛教护法、汉地冥官审案与本民族迁徙地名，而“署神契约”更通过神圣禁忌有效遏制了高山脆弱生态带的滥砍滥猎与水源污染。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国云南丽江（玉龙雪山与丽江古城纳西族东巴文献核心保存区）
  location_note: 纳西族东巴教象形文经卷与《神路图》长卷主要保存并传承于云南省丽江市古城及玉龙县等地（现多藏丽江东巴文化博物馆及美国国会图书馆等海内外馆藏），坐标取丽江古城核心位置。
case_cn_dou_e_yuan_ghost_redress:
  kind: story
  paragraphs:
  - 元代戏曲宗师关汉卿代表作《感天动地窦娥冤》，堪称中国古典文学史与民间司法想象中“鬼魂诉冤—天人感应—清官昭雪”母题的最高峰范本。剧中寡妇窦娥因拒张驴儿强娶并受其误毒老母讹诈，在山阳县贪官桃杌严刑逼供下屈打成招，临斩法场之际仰天发下三桩绝世誓愿：“血溅白练”一丈二尺不沾尘埃、“六月飞雪”三尺遮掩尸首、“亢旱三年”惩罚楚州贪墨吏治，果然一一应验。
  - 至全剧第四折，已化作冤魂的窦娥更直接打破阴阳界隔，趁担任两淮肃政廉访使的生父窦天章夜宿山阳公堂灯下阅卷之际，现形现声、亲自翻掀案卷哭诉冤屈，敦促生父提审复查并正法真凶，遂致甘霖骤降。细究文本谱系，关汉卿明言此剧深承西汉班固《汉书·卷七十一·于定国传》“东海孝妇”史案：东海少寡孝顺婆婆而被姑女诬控谋杀、太守强断死刑致“郡中枯旱三年”，直到新任太守采纳于公建言杀牛祭墓表白冤情方得大雨；戏剧由此将汉代天人感应政论与鬼魂亲诉公堂合二为一。
  - 从文学社会学与比较司法文化（参见 Katz，2009 与徐华龙 1994 鬼文化分类线索）解读，“六月飞雪”与“鬼魂翻卷鸣冤”之所以历经七百年仍深入人心，正因为其把传统基层司法中最沉痛的结构性弱点——刑讯逼供、贫弱女性口供遭到制度性轻蔑——置于放大镜下：当阳间诉讼渠道彻底堵死时，唯有借助“天象异常”与“亡灵入署申冤”的超越性正义机制，才得以让受冤者的证言重新获得采信与平反。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国江苏淮安（古楚州山阳县，剧作设定的冤狱发生地）· 兼涉元大都戏曲创作中心
  location_note: 《窦娥冤》剧情设定于淮南东路楚州山阳县（今江苏省淮安市淮安区），直接化用汉代同属江海一带的“东海孝妇”史案；作者关汉卿主要活动于元大都（今北京），坐标取淮安古楚州作故事地理参照。
case_cn_wupenji_talking_basin_opera:
  kind: story
  paragraphs:
  - 《乌盆记》（又称《奇冤报》）是中国戏曲舞台（京剧、徽剧、秦腔等）久演不衰的公案鬼戏代表作，其文本谱系横跨元杂剧《玎玎珰珰盆儿鬼》、清代石玉昆说唱话本《三侠五义·第五回》及近代唱腔舞台本。剧情讲述绸缎客商刘世昌携仆人行经定远地界，借宿窑户赵大（丁千/赵氏夫妇）家中却遭暗下蒙汗药毒杀，凶手为灭尸迹将其焚尸扬灰、骨灰和泥烧制成一只黑陶乌盆；后同村老鞋匠张别古登门向赵大索债无果，被迫以这只乌盆抵账携归。
  - 整部戏曲最富民俗信仰张力的转折点，发生在张别古夜归取盆之后：乌盆竟突然开口发出凄厉哭诉（即元曲所谓“玎玎珰珰”敲盆作响吐露人言），央求张别古带自己赴包拯（包青天）衙门伸冤；然行至府衙门口之时，刘世昌的冤魂却因府门张贴门神镇守而惶恐止步、不敢擅入公堂（或由张别古叩开后门与暂遮门神）。老练清官包拯遂于夜间在公堂设香案灯烛“阴审”乌盆，令鬼魂在神明与阳间清官共治的法坛之中逐一指证赵大夫妇谋财毁尸之状，终使沉冤大白。
  - 将《乌盆记》同其他公案鬼戏对读，可见中国民间戏曲对“物质证据”与“门神边界”的巧妙剧场转化：在缺乏现代法医微量骨灰检验与尸骸鉴识的时代，作者构想死者的骨骼直接化身日常器物（陶盆）并亲口充当证人，巧妙解决了“毁尸灭迹则无苦主举证”的司法困境；而“冤魂怯门神”一节，更反衬出民间岁时门神镇宅俗信如何成为戏曲营造阴曹与阳世边界张力的经典道具符号（剧目文献参照维基文库与徐华龙 1994 鬼戏分类线索）。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 中国河南开封与安徽定远（传统戏曲“包公阴审乌盆”公案舞台设定区）
  location_note: 元杂剧《盆儿鬼》设事于汴京一带，清《三侠五义》系于定远县而京剧《乌盆记》常归于包拯主政之开封府，坐标取开封包公戏曲核心地理参照区。
case_cn_mudanting_soul_return_opera:
  kind: story
  paragraphs:
  - 明万历二十六年（1598 年）戏剧家汤显祖撰成五十五出昆曲传奇巅峰之作《牡丹亭还魂记》，在庄严森冷的传统冥府神判架构之中，以极端浪漫的“至情”笔法重塑了中国文学史上的离魂复生母题。全剧写南安太守杜宝之女杜丽娘久居深闺苦读《诗经》，春日偶入荒废后花园感春成眠（第十出〈惊梦〉），于梦中在牡丹亭畔与风雅书生柳梦梅幽会；醒后寻梦不得，遂伤情憔悴而亡，临终自绘真容嘱托丫鬟春香并葬于梅花庵后杏树之下。
  - 在第二十三出〈冥判〉与第三十五出〈回生〉两出关键剧目中，汤显祖把唐代陈玄祐传奇《离魂记》以来的魂魄游走想象，精密镶嵌进宋明民间早已熟悉的“十殿冥府簿籍制度”：杜丽娘芳魂至森罗殿前，适逢十殿阎王公出，由十殿中执掌案牍的“胡判官”代为升堂审理。胡判官查对阳世姻缘簿，见其虽系伤情夭折却与柳梦梅早有冥契婚姻、且至情动天，遂特准其鬼魂出狱自由“游魂”，在阳世梅花庵与柳梦梅人鬼相恋；最终柳梦梅受丽娘嘱托冒犯“开棺掘墓”禁忌掘开梅花庵墓室、喂以药丸，杜丽娘竟起死回生并随柳生赶考中状元，历经父女重认而终成眷属。
  - 比较文学与民俗史学者（参见 Zeitlin 戏曲与志怪研究脉络）常将《牡丹亭》同《玉历宝钞》及古希腊《俄耳甫斯》下冥界神话对比：同样是跨越幽冥界线寻爱复生，俄耳甫斯因“回望禁忌”功亏一篑，而《牡丹亭》中的胡判官与还魂契约恰恰借用了“冥界官僚簿籍批文”作为合法性护身符，使少女冲破理学闺训与死生大限的情感愿望在皇权礼教框架内获得了戏剧性与神圣性的双重批准。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  - 5
  map_label: 中国江西抚州临川（作者汤显祖故里及昆曲传奇发源区）· 兼涉南安大余梅花庵故事情境
  location_note: 汤显祖于江西临川撰成五十五出传奇《牡丹亭还魂记》，剧中杜丽娘起死回生设于江西南安府（今江西赣州大余），坐标取临川汤显祖文化故里作文学史参照区。
case_eu_malleus_maleficarum_1487:
  kind: history
  paragraphs:
  - 1487 年在德意志莱茵河畔施派尔由彼得·德拉赫（Peter Drach）首次印刷出版的拉丁文宗教裁判指南《女巫之锤》（Malleus Maleficarum，巴伐利亚州立图书馆珍藏 1487 年初版摇篮本 2 Inc.s.a. 836），是理解近代早期欧洲大规模猎巫潮如何从零星地方传闻升级为高度标准化司法杀戮的核心历史档案。该书主要作者为多明我会宗教裁判官海因里希·克雷默（Heinrich Kramer，拉丁名 Institoris），全书卷首刻意附载 1484 年教宗英诺森八世针对德意志上莱茵地区颁发的敕令《最高愿望》（Summis desiderantes affectibus）与神学院推荐文书，借以赋予其跨教区与世俗法庭联合办案的权威。
  - 在内容体例上，《女巫之锤》全书严密划分为三部：第一部论证魔鬼、女巫与神明允许恶行存在的所谓“神学实在性”，宣称“不信巫术即近乎异端”，并将性别偏见理论化，断言女性在天性与理智上更易缔结魔鬼契约；第二部逐一列举害人巫术（maleficia）形态及驱除防卫法式（如雹灾、人畜不育、暗害幼童与破坏婚姻）；第三部则提供极具操作性的“世俗与教会协同审判手册”，详细规定如何接纳匿名举报、如何连续施用刑讯逼供取证、剥夺被告常规辩护权及最终判处火刑。
  - 历史学界在评估此书的实际地位时已纠正两个长期误区：首先，1487 年面世之初，天主教会正统内部与科隆大学神学院曾对其审讯程序违背传统教律提出质疑与抵制；其次，真正促成该书在十六至十七世纪横扫神圣罗马帝国、法兰西、苏格兰乃至跨越大西洋波及北美 1692 年塞勒姆案的关键动力，是金属活字印刷术的商业扩散与宗教改革时期教派竞争及小冰期农业危机下的集体焦虑。把 1487 年《女巫之锤》同唐明清《造畜蛊毒律》及乾隆叫魂案对读，最能揭示东西方“巫术司法化”在刑讯成文规程、地方精英制衡与替罪机制上的深刻分歧。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 德国施派尔（莱茵兰-普法尔茨州，1487 年《女巫之锤》初版印行地）
  location_note: 《女巫之锤》由多明我会宗教裁判官海因里希·克雷默成书于 1486 年，并于 1487 年由施派尔印书匠彼得·德拉赫（Peter Drach）首次印刷出版，坐标取德国施派尔古城中心。

case_cn_dict_zhuhua:
  kind: story
  paragraphs:
  - 一位农人在河边结识名叫竹花的女子。她说自己要寻找替身，才能离开水边；当一位洗衣妇人将要落水时，农人却不忍见她丧命，将人救下。
  - 竹花于是说出自己受害的冤情。故事让农人带来作恶的财主，最终将冤情交由阴间审理；竹花得以还阳。它是辞典归入“当代部分”的罗城地方故事，河流名称来自叙事，尚未核实具体河段。
  source_numbers:
  - 1
  - 2
  map_label: 广西河池 · 罗城县
  location_note: 罗城县城参考点；词典说故事流传于罗城，故事中的桃花村及二渡河均未定位。
case_cn_dict_wang_laoshi:
  kind: story
  paragraphs:
  - 王老实夜里经过坟地，觉得有人不断抽打自己的腿和背；他越跑越快，身后的敲击也愈加明显，到家后急忙请妻子查看。
  - 妻子发现，原来一根长竹和一截稻草挂在他的辫梢与鞋后。地方故事把夜路上的恐惧与回家后的辨认放在一处，结尾揭示原来是虚惊。
  source_numbers:
  - 1
  - 2
  map_label: 湖南湘西 · 泸溪县
  location_note: 泸溪县城附近参考点；词典记“湖南泸溪”流传，夜路与住宅未定位。
case_cn_dict_carpenter_ghost:
  kind: story
  paragraphs:
  - 夜里，一个木匠经过石板桥，遇见哭泣的女子，背她回家后才知道她被讲作鬼。故事里他用墨斗作记号，把她留在家中干活。
  - 女子趁木匠外出时逃走，后来再相遇，又被吓得赶紧离开。故事把熟悉的匠人工具带入夜路奇遇；辞典没有说明石板桥的具体位置和采录者。
  source_numbers:
  - 1
  - 2
  map_label: 四川 · 成都市
  location_note: 成都市区参考点；词典所称石板桥与故事发生的具体地点均未核。
case_cn_dict_ghost_catches_master:
  kind: story
  paragraphs:
  - 刘端公以收鬼闻名，一次替人办事后酒足饭饱，独自走在回家的路上。身后忽然响起声音，他以为有漏掉的鬼追来报复，急忙逃回家。
  - 这一短篇把驱鬼者与害怕者的位置倒转。词典仅记其在成都流传，没有给出发生日期或可查的具体夜路。
  source_numbers:
  - 1
  - 2
  map_label: 四川 · 成都市
  location_note: 成都市区参考点；词典仅记流传于成都，端公夜路并无可核的具体地点。
case_cn_dict_beggar_ghost:
  kind: story
  paragraphs:
  - 一个四处乞食的孩子，夜里遇到传说中要伤害产妇的鬼。对方数次变换样子想将孩子吓走，孩子始终没有退让。
  - 天亮之后，产妇平安生下孩子，家人听说经过后给予孩子住所与田地。故事是地方传说，不可把产妇的遭遇或鬼怪的解释当作医学事实。
  source_numbers:
  - 1
  - 2
  map_label: 四川 · 成都市
  location_note: 成都市区参考点；词典仅记流传于成都，故事中的家庭住址未定位。
case_cn_dict_shuanghunpo:
  kind: story
  paragraphs:
  - 书生乔逸生与表妹玉芹青梅竹马，后来离乡。多年后他遇到玉芹，二人相聚，一夜之后她却不见了；他后来才知道她早已去世。
  - 故事说乔逸生悲痛而亡，附近的人将两人葬在一起，地名由此而来。辞典另标《中国民间故事集成重庆市卷》下册为出处；本次尚未查到该册原件，也未定位山坡。
  source_numbers:
  - 1
  - 2
  map_label: 重庆 · 城市参考
  location_note: 重庆城市参考点；词典所称故事流传重庆，双魂坡位置未核。
case_cn_dict_yama_hired_teacher:
  kind: story
  paragraphs:
  - 一个屡试未中的秀才在家乡教书，相传有一天被阎罗王请去教孩子。学生临时离开前嘱他不要去西楼，他却推门看见妻子守着自己的遗体哭泣。
  - 阎罗王后来安排他借另一具新亡者的身体回去；两家人也因此成为亲属。故事把私塾与家庭生活搬进阴间，但辞典没有给出具体讲述者。
  source_numbers:
  - 1
  - 2
  map_label: 上海 · 金山区
  location_note: 金山区参考点，仅指词典所记流传区域，阴间及宅址不作地理定位。
case_cn_dict_mountain_spirit_ziche:
  kind: story
  paragraphs:
  - 相传资车力气很大，乡人辛苦种下的谷物接连受损，他发现人们把原因归于山鬼。资车为了阻止山鬼，搬到山上，却因为长期无人送食而力竭。
  - 后来乡人再次纪念资车，并将敬奉山神的活动与丰收联系起来。辞典所记是地方祭山故事，不能当作作物受损原因或所有地方仪式的统一解释。
  source_numbers:
  - 1
  - 2
  map_label: 云南玉溪 · 元江县
  location_note: 元江县参考点；词典所记为元江哈尼族的流传范围，不标作仪式采录点。
case_cn_dict_ghost_fears_bao:
  kind: story
  paragraphs:
  - 一个戏班被请到山里演戏，约定天亮才散场。班子演了一场又一场，却始终见不到天亮，众人认定其中有古怪。
  - 班主改演包公戏，包公角色一上台，天便亮了。众人这才发现戏台搭在坟头，四周是一片荒草；辞典把它记为杭州一带的故事，并未说明具体山址。
  source_numbers:
  - 1
  - 2
  map_label: 浙江 · 杭州市
  location_note: 杭州城市参考点；词典仅说故事流传杭州，山间戏台未定位。
case_cn_dict_ghost_long_robe:
  kind: story
  paragraphs:
  - 一个年轻人夜里拉胡琴，听众中有位地方鬼。故事说鬼走时遗落了长衫，年轻人披上衣服后，发现它能使自己隐身，于是起了偷窃的念头。
  - 长衫后来烧出破洞，虽经补缀，他行窃时仍被人看见并受到惩罚。辞典用“地方鬼”称呼此处的无常鬼；这不是能够定位的现实案件。
  source_numbers:
  - 1
  - 2
  map_label: 浙江 · 杭州市
  location_note: 杭州城市参考点；词典仅记流传于杭州，演奏及其他情节的地点未定位。
case_cn_dict_lake_ghost_fooled:
  kind: story
  paragraphs:
  - 一位老人夜里在田边车水，听见水中有人叫他下去洗澡。他认出这是传说中寻找替身的水鬼，便说要先把水车好。
  - 故事里的鬼上岸帮忙，天亮时显出木头的原形；老人把木头带回，做成猪食槽。它将农事工具与河边禁忌编进幽默的斗智故事。
  source_numbers:
  - 1
  - 2
  map_label: 浙江 · 杭州市
  location_note: 杭州城市参考点；词典仅记流传于杭州，故事中的水域与农田未定位。
case_cn_dict_hanging_ghost_mill:
  kind: story
  paragraphs:
  - 丁大胆捉住一名吊死鬼，发现对方能替人拉磨，便经营起磨坊。邻村财主听说后，以银钱买下能使鬼劳作的物件。
  - 财主不知道绳子需要更换，两天后绳断，鬼也逃走了。这个短篇将获利、劳动和贪念转化为喜剧，辞典没有给出坊址或讲述者。
  source_numbers:
  - 1
  - 2
  map_label: 浙江 · 杭州市
  location_note: 杭州城市参考点；词典仅记流传于杭州，磨坊和村落未定位。
case_cn_dict_niba_ghost_dance:
  kind: story
  paragraphs:
  - 重庆一则传说把泥巴鬼舞的来历讲成对地方恶人的回应：一个人因赌害乡里，遭到乡人惩处，死后仍被说成不肯离去。
  - 故事说乡人因此以舞蹈制服他的魂魄。辞典记述的是舞蹈缘起的地方说法；是否对应某种现存仪式、谁在何时讲述，尚须查找田野资料。
  source_numbers:
  - 1
  - 2
  map_label: 重庆 · 城市参考
  location_note: 重庆城市参考点；词典只列流传区域，未识别具体演出地点或社群。
case_cn_dict_wrong_rebirth:
  kind: story
  paragraphs:
  - 戏班里的魏土地死后来到城隍庙，判官说他阳寿未尽，派人带他还魂。他却进入一位刚去世的老妇身体，随后被老妇家人接走照料。
  - 故事借错认身体制造尴尬与幽默。辞典另引《中国民间故事集成重庆市卷》下册；其原件及具体讲述者尚待核对。
  source_numbers:
  - 1
  - 2
  map_label: 重庆 · 城市参考
  location_note: 重庆城市参考点；词典只列流传区域，戏班与故事中城隍庙未定位。
case_cn_dict_litianlong:
  kind: story
  paragraphs:
  - 一个川戏班里的艺人与名叫李天龙的鬼称兄道弟，后来听说对方在山洞里藏有财宝。他动了独吞的念头，忘记了原先答应照顾对方母亲的事。
  - 传说中的李天龙化成猫，被艺人买下带到旅店后又现形，惩罚了失信的他。辞典另引重庆故事集成，原始口述的采录信息尚未核验。
  source_numbers:
  - 1
  - 2
  map_label: 重庆 · 城市参考
  location_note: 重庆城市参考点；词典只列流传区域，山洞与旅店未定位。
case_cn_dict_ghost_and_butcher:
  kind: story
  paragraphs:
  - 一个杀猪的人夜里回家，经过凉亭时遇见女子。女子在故事中不断变化面貌，试图吓退他，却没能成功。
  - 最后反而是她先逃走。短篇以夜路相遇和角色反转制造笑意；词典只给出建德的流传范围，凉亭位置没有得到确认。
  source_numbers:
  - 1
  - 2
  map_label: 浙江杭州 · 建德市
  location_note: 建德市参考点；词典仅记流传于建德，故事中的凉亭与夜路未定位。
case_cn_dict_scald_tousled_ghost:
  kind: story
  paragraphs:
  - 看山的老人夜里遇到蓬头鬼，故事里的鬼把头取下搁在腿上梳理。老人说头发打结了，提议替它烫一烫，鬼答应了。
  - 老人把炉中的热灰倒过去，鬼疼得抱头逃走。辞典将它归为淳安地方鬼话；地名说明流传范围，不能用于推定具体住所。
  source_numbers:
  - 1
  - 2
  map_label: 浙江杭州 · 淳安县
  location_note: 淳安县城参考点；词典仅记流传于淳安，故事中的山林未定位。
case_cn_dict_impermanence_straw_shoes:
  kind: story
  paragraphs:
  - 一人多年在外，回家途中遇到来捉他的无常鬼。无常见他上有父母、下无子女，便借鞋给他，让他先回家与亲人相聚；他穿上后走得飞快。
  - 途中他又帮助一名书生的妻子偿还债务。故事最后，无常带来阎王免他一死的消息。辞典记这则故事流传于杭州，未注明讲述者和采录时间。
  source_numbers:
  - 1
  - 2
  map_label: 浙江 · 杭州市
  location_note: 杭州城市参考点；词典只列流传范围，故事中的路途与住宅未定位。
case_cn_dict_yama_judges_ghost:
  kind: story
  paragraphs:
  - 一人死后来到阴间，阎罗王亲自审问，得知他活着时没有做过坏事，也没有做过好事。故事里的阎王因此发怒，命人重打他四十大板。
  - 辞典用这个短篇说明其所概括的劝善寓意，并注明《苏州民间故事》为来源；该书原件和采录者尚未核对。
  source_numbers:
  - 1
  - 2
  map_label: 江苏 · 苏州市
  location_note: 苏州城市参考点；词典只列流传范围，阴间场景不可定位。
case_cn_dict_turtle_catcher_false_ghost:
  kind: story
  paragraphs:
  - 一个捉鳖的人夜宿客店，发现有人装成女鬼偷他的钱。次夜他又住进同一间房，待那人把手伸进荷包时，藏在袋中的两只鳖咬住了她的手指。
  - 故事揭晓：所谓女鬼是客店里负责烧水和扫地的帮工假扮。辞典将它记为桐庐地方鬼话；“抲”在条目中释为抓，客店地址未给出。
  source_numbers:
  - 1
  - 2
  map_label: 浙江杭州 · 桐庐县
  location_note: 桐庐县城参考点；词典只列流传范围，故事中的客店未定位。
case_cn_dict_chestnuts_defeat_zombie:
  kind: story
  paragraphs:
  - 辞典收录的故事说，村东出现一个见人便吃的僵尸，乡人因而不安。一个胆大的人找来十几位年轻人，抬来一筐筐栗子，准备共同应对。
  - 僵尸出现后在栗子上滑倒，众人一拥而上制服了它。辞典只记故事流传于临安，未提供村名；这是民间叙事中的情节。
  source_numbers:
  - 1
  - 2
  map_label: 浙江杭州 · 临安区
  location_note: 临安区参考点；词典只列流传范围，故事里的村庄未定位。
case_cn_dict_ghost_in_gourd:
  kind: story
  paragraphs:
  - 一人夜里背着装有苞谷的葫芦去磨粉，遇见变成老鼠的鬼。他骗对方钻进葫芦后将其关住，鬼请求放它出来，那人却要求它唱戏。
  - 故事说鬼为他唱了三年戏；后来此人缺少娶亲的钱，便将装鬼的葫芦卖给徽州朝奉。辞典只给出淳安的流传范围，没有磨坊或交易地点的资料。
  source_numbers:
  - 1
  - 2
  map_label: 浙江杭州 · 淳安县
  location_note: 淳安县城参考点；词典只列流传范围，磨坊与售卖地点未定位。
case_cn_dict_hunter_eats_ghost_gall:
  kind: story
  paragraphs:
  - 一个猎人天黑回家，看到凉亭里坐着一名女子。她说自己因夫妻争吵离家，猎人便背她回去；途中他认定她是鬼，故事写他开枪后，对方变成了棺材。
  - 猎人劈开棺材，吞下其中一颗“鬼胆”。此后他自以为能看见各种鬼，反倒吓得不敢出门。辞典只记其流传于桐庐，未给出凉亭位置或讲述者。
  source_numbers:
  - 1
  - 2
  map_label: 浙江杭州 · 桐庐县
  location_note: 桐庐县城参考点；词典只列流传范围，故事中的凉亭与村庄未定位。
case_cn_kaifeng_banqiao_inn_donkeys:
  kind: story
  paragraphs:
  - 唐人传奇里，赵季和投宿汴州西边的板桥店。夜深后，他听见隔壁有窸窣声，透过墙缝，看见女店主放出木人木牛，在屋里耕种一小片地；荞麦转眼成熟，被磨成面，做成了几张饼。
  - 天亮，赵季和推辞早饭，悄悄离开。其他旅人吃了饼，竟化成驴，店主把他们的货物据为己有。赵季和后来带着自制的饼重返店中，掉换饼使店主也变成驴；数年以后，一位老人劝他放过她，才让她恢复人形。
  - 《太平广记》标明这则故事出自《河东记》；邓启耀在《巫蛊》中把它作为役使与夺财叙事阅读。地图标的是汴州的现代参照，而非发现了故事中的旅舍。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 河南 · 开封地区
  location_note: 开封市区仅作为古汴州区域参照；板桥店遗址位置未核，故事为唐传奇。
case_cn_fuqing_gold_silkworm_hedgehogs:
  kind: story
  paragraphs:
  - 宋代蔡绦听人谈起福清的一场诉讼。有人指称自己遭受金蚕之害，官府调查许久，也找不到所说的东西。
  - 一位出主意的人说，金蚕害怕刺猬；依照笔记的讲法，官府于是找来两只刺猬进屋，在床下或墙缝中捉到了金蚕。相邻的一段又讲，人们怎样把金银和金蚕放在路旁，希望拾取者替自己带走麻烦。
  - 这一切经过由《铁围山丛谈》转述，并在邓启耀《巫蛊》的破解章节中出现。它展现的是有关诉讼与动物的古代叙述，金蚕及其功效并未因这段故事得到实证。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 福建 · 福清市区参考点
  location_note: 坐标取福清气象站的公开城市参考点，县官处理地点和叙事中的住宅均未定位。
case_cn_jingzhou_monk_huizong_dream:
  kind: story
  paragraphs:
  - 《酉阳杂俎》记下一位名叫会宗的僧人。他住在荆州公安，病得很重，故事把他的病解释为“中蛊”。他开始反复诵读《金刚经》，等待自己的结局。
  - 一天他在梦中觉得有人让他张口，抽出喉间的头发；当天夜里，他又梦见吐出一条大蚓。作者说他随后恢复健康，并提到另一位僧人见过此事。
  - 这则唐代志怪把病、梦境、诵经与康复编织在一起。邓启耀将它放入禳蛊材料，方便观察佛教信仰如何进入病痛叙事；原文并不足以核实病因或治疗效果。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 湖北 · 公安县城参考点
  location_note: 坐标为公安县城区域参考点，不代表僧人住所或寺院遗址。
case_cn_weihui_du_xuan_cup_bow:
  kind: story
  paragraphs:
  - 夏至时，汲县县令应郴请主簿杜宣饮酒。墙上悬着的弩在杯里投下一道弯影，杜宣以为那是一条蛇，虽然心里害怕，还是把酒喝了下去。
  - 后来他腹痛生病，久久不见好转。应郴探望时听他说起杯中之蛇，回到原处细看，才发现弩影。他请杜宣再来，在同样的位置斟酒，指给他看影子的来源；故事说杜宣于是释然。
  - 应劭《风俗通义》保存了这一早期版本，邓启耀用它讨论恐惧与解释。它是一则古代叙事，不能拿来为现实中的病痛直接下诊断。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 河南 · 卫辉地区参考点
  location_note: 卫辉为古汲县地区参照，不表示酒宴地点已被发现。
case_cn_guangzhou_chunyangguan_villain_hitting_2017:
  kind: report
  paragraphs:
  - 2017 年惊蛰早晨，邓启耀带学生来到广州纯阳观。穿过热闹的市场，到观前空地时，他们看见几位女性各自在小祭席前摆放纸符、果品和香烛，准备仪式。
  - 有的人念一段、烧一张纸；也有人用鞋拍打纸人，把担忧或冲突象征性地放在这些纸上。一位参与者向作者解释，她所说的“小人”并不一定指向某个具体的人。
  - 作者在《巫蛊》中附有当日田野照片。海珠区政府另有纯阳观位置与沿革介绍；政府页面并未独立记录这次具体观察。
  source_numbers:
  - 1
  - 2
  map_label: 广东 · 广州海珠区参考点
  location_note: 参考点在海珠区中山大学南校区附近，仅为城市区域定位；具体观门位置以海珠区政府提供的地址为准。
case_cn_hk_canal_road_villain_hitting_2025:
  kind: report
  paragraphs:
  - 香港铜锣湾的鹅颈桥底，常有人前来请摊档代为“打小人”，把生活中的不顺与人际困扰寄托在纸制形象上。邓启耀在《巫蛊》中讨论过香港和广州不同场景下的类似实践。
  - 2025 年，香港政府回应有关活动的议题时区分了两个层面：惊蛰当天的“祭白虎”在非遗清单中，有时包含打小人；桥底平日持续经营的摊档则属于商业活动。
  - 这一区分让我们既能理解节气与仪式，也能看到现代街道里的服务、旅游和空间管理。地图点只标识铜锣湾一带。
  source_numbers:
  - 1
  - 2
  map_label: 香港 · 铜锣湾地区参考点
  location_note: 采用现有铜锣湾地区参考点，并非摊档或桥底的精确测点。

case_cn_dict_w2_taizhou_doubt:
  kind: story
  paragraphs:
  - 赶集的李红朝走过一座小石桥，听见两个女鬼商量寻找替身。他将谈话记在心里，第二天赶到一户刚遭丧事的人家，劝住正在争吵的婆媳。
  - 他又走访另一户办喜事的人家，帮助新娘找到遗失的手镯，化解危机。辞典将它记为泰州流传的鬼话；故事中的两处村落与桥梁没有经过定位。
  source_numbers:
  - 1
  - 2
  map_label: 江苏 · 泰州市
  location_note: 泰州地域参考点；书中张家坝、鲍家沟和小石桥均未定位。
case_cn_dict_w2_manzhouli_yanluo:
  kind: story
  paragraphs:
  - 一个名叫阎罗的年轻人离开故乡，想为遭受苦难的人们寻找出路。路上两位老人向他提出考验，他历经曲折，终于完成托付。
  - 老人显出神仙身份，安排他掌管人间生死；后来他又因骄纵而由仙降为鬼，却仍管生死簿。辞典将这则缘起叙事记为满洲里流传的一种讲法。
  source_numbers:
  - 1
  - 2
  map_label: 内蒙古 · 满洲里市
  location_note: 满洲里城市参考点；辞典所记为流传范围，不是人物行程定位。
case_cn_dict_w2_shangqiu_water_ghost:
  kind: story
  paragraphs:
  - 喜欢饮酒的渔人发现，自己近来捕鱼常常满载，可酒瓶里的酒却越来越少。原来有个同样嗜酒的水鬼在暗中饮酒，后来二者竟成了朋友。
  - 水鬼一度想找替身，渔人多次劝阻，它终于放弃害人。待渔人生活困顿时，水鬼又拿出银钱相助；这是一则关于人鬼情谊的地方叙事。
  source_numbers:
  - 1
  - 2
  map_label: 河南 · 商丘市
  location_note: 商丘地域参考点；辞典未给出河流、居所或讲述者。
case_cn_dict_w2_xishui_chiboshen:
  kind: story
  paragraphs:
  - 相传水鬼到了寻找替身的期限，先后遇见过河的母亲、财主的儿子和汲水老人。每次看到他们背后的家人，它都不忍心夺走对方性命。
  - 故事最后说，水鬼改而行善，得到封号。辞典将这则神灵缘起记为浠水流传的鬼话，并另引文彦生《中国鬼话》；后者原件未核。
  source_numbers:
  - 1
  - 2
  map_label: 湖北黄冈 · 浠水县
  location_note: 浠水县域参考点；辞典未定位故事中的渡口、井或庙。
case_cn_dict_w2_fuqing_lantern_child:
  kind: story
  paragraphs:
  - 村里戏班开演，书童和乡人都去看戏，留下私塾先生独自在屋里读书。一个胖乎乎的孩子突然在他身边跑跳，先生觉得奇怪，却继续读书。
  - 看戏的人散场回来，孩子也消失了。先生随后在一盏破旧走马灯上见到相似的人像，故事将这次相遇解释为旧画成精。
  source_numbers:
  - 1
  - 2
  map_label: 福建福州 · 福清市
  location_note: 福清市域参考点；私塾和戏班活动地点未定位。
case_cn_dict_w2_xingning_zhongkui:
  kind: story
  paragraphs:
  - 钟馗追赶两面鬼不成，暂时住下。两面鬼找来四个同伴，假扮衙役，携酒菜上门；钟馗没有识破，酒后被他们摆布。
  - 五鬼正要把钟馗扔进湖里，他的两个手下赶来，将两面鬼杀死、其余四鬼擒住。辞典将这则讽谑鬼话列为兴宁流传的版本。
  source_numbers:
  - 1
  - 2
  map_label: 广东梅州 · 兴宁市
  location_note: 兴宁市范围参考点；故事未给出可核实的湖泊。
case_cn_dict_w2_shiyan_spring_child:
  kind: story
  paragraphs:
  - 龙潭坪土地爷不满阎罗横行，却遭到陷害，只好请年轻的春娃帮忙。春娃依照土地爷的指点，救下无辜的人，并设法赶走判官和小鬼。
  - 他又夺得阎罗的马和官服，最终扭转局面。故事写玉帝有意重用春娃，他却推荐土地爷担当职务；词典称此故事流传于十堰。
  source_numbers:
  - 1
  - 2
  map_label: 湖北 · 十堰市
  location_note: 十堰地域参考点；龙潭坪具体位置尚未核实。
case_cn_dict_w2_zhongxian_ghost_city:
  kind: story
  paragraphs:
  - 传说益王来到八德场相看建都之地，随从认为这里地势吉利。不料一阵阴风将众人带进阴间，他们发现阎君早已抢先建起一座鬼城。
  - 益王只得另择地点，故事又把当地祭祀日期的缘起与这次遭遇相连。辞典出版时写“四川忠县”，忠县今属重庆；故事中的场址和祭祀实践未作实地核验。
  source_numbers:
  - 1
  - 2
  map_label: 重庆 · 忠县
  location_note: 忠县县域参考点；八德场、鬼城和祭祀地点均未定位。
case_cn_dict_w2_lincang_carpenter:
  kind: story
  paragraphs:
  - 辞典所记临沧彝族山寨故事里，木匠的妻子反复梦到吊颈鬼，并被引向后山。木匠后来察觉异样，假装求教，趁机用墨线制住来者。
  - 鬼被带回家做农活，过了几代才因墨线被洗掉而逃走。它与其他匠人借工具制鬼的故事有相似情节，但目前没有证据证明版本之间存在传播关系。
  source_numbers:
  - 1
  - 2
  map_label: 云南 · 临沧市
  location_note: 临沧地区城市参考点；辞典未说明山寨、山坳及采录点。
case_cn_dict_w2_yangquan_ghost_money:
  kind: story
  paragraphs:
  - 一家小店屡次在收来的钱里发现纸钱，店主查到一位年轻顾客，便悄悄跟随。走到坟地附近时，那人消失了，店主将他理解为墓中出生的鬼孩。
  - 辞典的结尾还记有与孕亡者葬俗有关的忌讳性说法。这是故事叙事的一部分，不能据此推定某种做法在阳泉普遍存在。
  source_numbers:
  - 1
  - 2
  map_label: 山西 · 阳泉市
  location_note: 阳泉地域参考点；店铺、墓地和具体社群未定位。
case_cn_dict_w2_jingzhou_rice_ghosts:
  kind: story
  paragraphs:
  - 故事将情节放在明末荆州：灾荒中，粮商囤积米粮，打算抬价。一群自称商人的来客买下大米，又低价转给受困的百姓。
  - 粮商后来发现收到的银钱变成纸锭，试图勾结官府夺回粮食，再度中了计。结尾揭示，这群来客是仗义济人的鬼；明末是叙事设定，非已核事件日期。
  source_numbers:
  - 1
  - 2
  map_label: 湖北 · 荆州市
  location_note: 荆州地域参考点；粮行与故事事件均不可定位。
case_cn_dict_w2_chifeng_good_ghost:
  kind: story
  paragraphs:
  - 柴木村的财主占有水井，村民发现新泉后，他又将泉水据为己有。夜里一个白衣身影从他家取出铜钱，钱散落到各家水缸和米缸里。
  - 故事说，水米随之增长，财主试图追回钱财反被淹没，乡人把施助者称为“南海大士”。辞典只记故事流传赤峰，不能据此确认柴木村的位置或实际祭祀。
  source_numbers:
  - 1
  - 2
  map_label: 内蒙古 · 赤峰市
  location_note: 赤峰地域参考点；柴木村、水井、泉水位置未核。
case_cn_dict_w2_xichang_impermanence:
  kind: story
  paragraphs:
  - 住在城隍庙里的麻老三抽鸦片时，故事里的无常无二爷从神坛上走下来讨烟，两人竟成了烟友。无二爷还借他一顶隐身帽，使他能自由出入烟馆。
  - 后来无二爷认识到吸烟有害，提议一起戒掉；麻老三起初不愿，最终答应。鬼友离开后，他成家立业，仍记挂这段相遇。
  source_numbers:
  - 1
  - 2
  map_label: 四川凉山 · 西昌市
  location_note: 西昌城市参考点；故事所称城隍庙与烟馆未定位。
case_cn_dict_w2_tanghe_rice_ball:
  kind: story
  paragraphs:
  - 故事说，一位卖汤圆的王老汉手艺好，名声连阴间都听到了。阎王派来的鬼先后上门，老汉见招拆招，让他们无功而返。
  - 阎王最后亲自带兵前来时，老汉已经离开。辞典将它记为唐河流传的故事，叙事背景设在明末“长安街”；这不是已经核实的事发地点与年代。
  source_numbers:
  - 1
  - 2
  map_label: 河南南阳 · 唐河县
  location_note: 唐河县域参考点；“长安街”是故事叙事地名，未作现实定位。
case_cn_dict_w2_chaling_gaojiangpi:
  kind: story
  paragraphs:
  - 阎王听说高犟皮胆大，派判官和黑鬼去捉他。两者刚躲在门后，就听高犟皮斥骂家中黑鸡；黑鬼误以为说的是自己，慌忙逃走。
  - 阎王亲自前来时，又把高犟皮责骂偷肉小狗的话听作对自己的威胁，也吓得离开。辞典用这则茶陵鬼话把误听和胆量写成喜剧。
  source_numbers:
  - 1
  - 2
  map_label: 湖南株洲 · 茶陵县
  location_note: 茶陵县域参考点；高家住所未定位。
case_cn_dict_w2_dunhua_yanluo_relocates:
  kind: story
  paragraphs:
  - 这则敦化地区的故事说，阎罗殿原先设在人间。阎王眼睛不适，差人找大夫，发现许多医生门前都有自称冤死的鬼。
  - 他挑中门前只有一个鬼的新医生，却不知道那正是医生第一个病人。阎王接受治疗后失明，传说中的阎罗殿因此搬到阴间；故事借误判制造讽刺。
  source_numbers:
  - 1
  - 2
  map_label: 吉林延边 · 敦化市
  location_note: 敦化市域参考点；故事中的医馆及阎罗殿均未定位。
case_cn_dict_w2_shaoyang_aunt_ghost:
  kind: story
  paragraphs:
  - 生活困顿的书生刘玉与人打赌，决定在一座传说闹鬼的庵堂过夜，以赢得百两银子。半夜果然出现一位老妇，他先是吓坏，随后被对方认出是自己的侄子。
  - 姑侄叙旧时，鬼姑母劝他振作。刘玉后来苦读、做官，并修葺庵堂；辞典将其列为邵阳故事，未给出庵堂所在地。
  source_numbers:
  - 1
  - 2
  map_label: 湖南 · 邵阳市
  location_note: 邵阳地域参考点；庵堂具体位置未核。
case_cn_dict_w2_jiuquan_duxiu:
  kind: story
  paragraphs:
  - 地方故事中的杜秀遭地主强抢，拒绝屈服，含冤而死。半年后，地主途经荒坟再遇杜秀，仍起歹意，故事让化作鬼的她杀死了对方。
  - 地主家人追来，杜秀又变化形貌，将他们引到柳林并惩处。辞典将它记作酒泉流传的复仇叙事；坟地、柳林和人物均没有可核实地址。
  source_numbers:
  - 1
  - 2
  map_label: 甘肃 · 酒泉市
  location_note: 酒泉地域参考点；荒坟、柳林以及人物生平未核。
case_cn_dict2_jilin_jian_helpful_ghost:
  kind: story
  paragraphs:
  - 严家小姐与杨宏相爱，家人却另有安排，还借官府之手将杨宏关进牢里。小姐想不开时，一位被称为秃发鬼的角色出现了。
  - 故事里，这位鬼设法让杨宏脱身，又把小姐从婚事中救走。高家后来请人追究，它却没有因此怨恨；辞典将其归入吉林集安流传的“当代鬼话”。
  source_numbers:
  - 1
  - 2
  map_label: 吉林通化 · 集安市
  location_note: 地图点是集安市公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_zhejiang_xianju_invisible_cap:
  kind: story
  paragraphs:
  - 仙居流传的故事中，吴书贵成了水鬼，一次偶然得到龙王的帽子。帽子可以使佩戴者隐身，后来又转到了木匠李梓人手里。
  - 木匠利用帽子偷窃，事情败露后，宝物经过县官、阎王之手，最终被龙王取回。故事沿着一件物品的流转，把欲望和争夺串在一起。
  source_numbers:
  - 1
  - 2
  map_label: 浙江台州 · 仙居县
  location_note: 地图点是仙居县公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_guangdong_gaozhou_redress_temple:
  kind: story
  paragraphs:
  - 赴京赶考的包公在古庙歇夜，一位叫花香的女子向他诉说冤情：她与明哥相爱，却被想霸占她的人拆散，最终失去了生命。
  - 包公当时无力替她讨回公道；故事说他后来取得功名，救出了明哥，也追究了加害者。辞典将这一版本的流传范围记为广东高州。
  source_numbers:
  - 1
  - 2
  map_label: 广东茂名 · 高州市
  location_note: 地图点是高州市公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_jiangsu_yangzhou_butcher_yama:
  kind: story
  paragraphs:
  - 张屠夫病重时，故事让阴差前来捉人。他在屋里说的话接连被听错：让家人拿柜子换米，鬼以为要把自己拿去典当；听见屋梁木件的名称，判官又以为性命不保。
  - 最后连阎王也因一句与自己名号相近的话落荒而逃。这个扬州故事以方言中的近音和误会制造笑料；它与另一则“张屠夫过桥”故事情节不同。
  source_numbers:
  - 1
  - 2
  map_label: 江苏 · 扬州市
  location_note: 地图点是扬州市公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_jiangsu_yancheng_guesthouse_couplet:
  kind: story
  paragraphs:
  - 一位姓李的赶考人没找到住处，只得在传闻闹鬼的客店过夜。店主说，曾有秀才因答不上对联而死，夜里常有声音来问下联。
  - 那晚声音果然出现。李秀才望见墙边的秤杆，临时想出相应的句子；故事说此后客店恢复平静。叙事中的客店没有具体地址。
  source_numbers:
  - 1
  - 2
  map_label: 江苏 · 盐城市
  location_note: 地图点是盐城市公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_hubei_chibi_forest_ghost:
  kind: story
  paragraphs:
  - 辞典称湖北蒲圻流传一则故事：少年王小五听说林中有鬼，便主动去见它。鬼见他大胆，送他一台能够不断取出财物的金磨。
  - 皇帝得知后也想占有宝物。王小五不愿它落入一人手里，将物件扔进海中；故事最后让老鬼改过、转而负责降雨。蒲圻已更名为赤壁，图上仅标流传地区。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 湖北咸宁 · 赤壁市
  location_note: 辞典所称湖北蒲圻，1998 年更名为赤壁；点位为行政区域参考，不标称森林地点。
case_cn_dict2_zhejiang_qingtian_puppet_ghost:
  kind: story
  paragraphs:
  - 金家庆寿时请来木偶戏班，家中小姐看戏后因相思而亡。传说她变成妖怪，化作父亲的模样，把深山装点成另一处人间，又请戏班前来。
  - 戏接连演了多场，天却始终不亮，戏班觉出不对。有人取出包公木偶，故事让这个戏中人物驱走群妖、救下众人。
  source_numbers:
  - 1
  - 2
  map_label: 浙江丽水 · 青田县
  location_note: 地图点是青田县公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_guizhou_zhijin_banishing_mirror:
  kind: story
  paragraphs:
  - 一个独居老妇请求与少年冬生同住。后来村里接连有孩子失踪，老妇屋中半夜也传出动静；冬生查探后，故事揭开了她的鬼怪身份。
  - 冬生先被救下，学艺归来后再次与她相斗。故事最后让他化成一面镇邪镜，危机才结束。辞典记载的是贵州织金的传说，并未标明具体村落。
  source_numbers:
  - 1
  - 2
  map_label: 贵州毕节 · 织金县
  location_note: 地图点是织金县公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_guangxi_baise_mosquito_net:
  kind: story
  paragraphs:
  - 王朴的妻子去世后，他守灵时总在夜里听见洗碗声，也觉得身边有人。仔细察看时，他以为来者是亡妻。
  - 后来一位外乡人前来借宿，听说此事后将一根针挂在蚊帐上。这个百色故事以家中微小的声音与陌生人的办法，解释一种地方说法的由来。
  source_numbers:
  - 1
  - 2
  map_label: 广西 · 百色市
  location_note: 地图点是百色市公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_hubei_yingcheng_thread_whip:
  kind: story
  paragraphs:
  - 王老头家的麦子眼看要收获，却被传说中的鬼破坏，他自己也受惊生病。儿子王馗听说后，用线结成鞭子去迎战。
  - 鬼被打得现出形状，求王馗放它回去；故事中，王馗却让它留下帮忙。辞典把这则应城故事归为对农田习俗的民间解释。
  source_numbers:
  - 1
  - 2
  map_label: 湖北孝感 · 应城市
  location_note: 地图点是应城市公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_shaanxi_lintong_qin_ghost_market:
  kind: story
  paragraphs:
  - 陕西临潼的一则故事想象秦陵建成后，受害的人们向阴间申诉；冥府无力解决，又将诉求交到天上。
  - 故事让他们在皇陵附近重开市集，各自继续原来的营生，偶尔还有活人误入。这是围绕帝陵的民间叙事，不是对具体殉葬规模或鬼市存在的历史证据。
  source_numbers:
  - 1
  - 2
  map_label: 陕西西安 · 临潼区
  location_note: 地图点是临潼区公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_hebei_renqiu_night_comb:
  kind: story
  paragraphs:
  - 故事里的晚西施发现侍女小翠用了自己的玉梳，争执中梳子摔坏，她又残酷地惩罚了小翠。小翠死后，玉梳在故事中竟恢复了原样。
  - 晚西施再用梳子时，头发逐渐变白脱落；类似遭遇也被故事安排给欺压侍女的人。辞典称这则任丘流传的鬼话用来解释夜间梳妆的禁忌。
  source_numbers:
  - 1
  - 2
  map_label: 河北沧州 · 任丘市
  location_note: 地图点是任丘市公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_guangxi_wuxuan_peach_branch:
  kind: story
  paragraphs:
  - 一个少年放牛时遇见凶恶的鬼。他试着用石头应对，却没有效果；手里的一根桃枝反倒让对方退却。
  - 传说由此把桃枝与驱邪联系起来。词典将它记作广西武宣流传的故事，未给出放牛地点或采录年份。
  source_numbers:
  - 1
  - 2
  map_label: 广西来宾 · 武宣县
  location_note: 地图点是武宣县公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_hubei_qichun_carrying_ghost:
  kind: story
  paragraphs:
  - 傻二从塘边回家，一位女子提醒他落下了工具，又陪他同行、替他挑担，请他吃饭休息。等他醒来，才发现自己身处坟地附近。
  - 乡绅听说后也想碰上同样的奇遇，却被打得狼狈；故事交代，女子正是曾遭他逼害的小翠。这则蕲春版本用两人的不同遭遇解释一句俗语。
  source_numbers:
  - 1
  - 2
  map_label: 湖北黄冈 · 蕲春县
  location_note: 地图点是蕲春县公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_hebei_cixian_ghost_mill:
  kind: story
  paragraphs:
  - 一只瘦鬼羡慕另一只鬼丰足，对方告诉它，替人推磨能换来供奉。瘦鬼先去穷人家，主人连自己的饭都难以保证，没能款待它。
  - 它听从建议转去富户家，主人因心里害怕而献上食物。这个磁县故事借两只鬼的处境，讽刺人对财富与亏心事的不同反应。
  source_numbers:
  - 1
  - 2
  map_label: 河北邯郸 · 磁县
  location_note: 地图点是磁县公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_shandong_chengwu_night_watch_ghosts:
  kind: story
  paragraphs:
  - 两位财主死后在故事中成了打更鬼和催火鬼，因做事不力被赶出阴间，只好在土地庙偷吃供品。
  - 村民日子艰难，供品渐少；两鬼搬走时遇到土地夫妇，见到银子后反而互相争斗。辞典把这一版本记在山东成武，并未说明具体庙址。
  source_numbers:
  - 1
  - 2
  map_label: 山东菏泽 · 成武县
  location_note: 地图点是成武县公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_jiangsu_huaian_brave_three_demons:
  kind: story
  paragraphs:
  - 富户张有财不喜欢敢与自己作对的侄子，便让他住进一座传闻有妖的宅院，盼着借此摆脱他。乡人叫这个侄子“小大胆”。
  - 三夜里，小大胆先后借助金砖和葫芦应付来者。叔父见他平安出来，也不敢再轻举妄动；故事中的宅院没有被定位为真实建筑。
  source_numbers:
  - 1
  - 2
  map_label: 江苏 · 淮安市
  location_note: 地图点是淮安市公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_hubei_yangxin_theatregoer_river:
  kind: story
  paragraphs:
  - 老戏迷听说河对岸来了戏班，正准备涉水，忽然有人提出背他过去。他高兴地答应，却发现对方越走越往河心。
  - 戏迷察觉不对，用帽子制住对方，要求背自己回家。第二天出门，他发现门外是一块棺木。辞典将这场夜行记作湖北阳新的地方鬼话。
  source_numbers:
  - 1
  - 2
  map_label: 湖北黄石 · 阳新县
  location_note: 地图点是阳新县公开行政区或城市参考点；词典仅称此故事流传于当地，故事的具体地点、采录者与采录年代均未确定。
case_cn_dict2_jianshui_wait:
  kind: story
  paragraphs:
  - 村里人说，山上堵水浇田时常会遇鬼，因此谁也不愿夜里去。一个壮汉独自上山办完事，回程忽听身后有人喊“等等我”。他等了片刻，认定来者是鬼，反而将它背起，一路往村里跑。
  - 天快亮时，背上的鬼请求下来，他没有答应；到家一看，背回的却是一块棺木。壮汉把木板改作厕板，妻子仍说在那里见到鬼，他才将木板劈开烧掉。辞典记这则故事流传于建水，没有给出具体山路。
  source_numbers:
  - 1
  - 2
  map_label: 云南红河 · 建水县
  location_note: 建水县行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_xingning_competition:
  kind: story
  paragraphs:
  - 一个鬼要和农夫比力气，在石头上捏出指印；农夫却拿萝卜冒充石头，轻轻一捏就出了水。鬼又提出比力气和跑步，农夫说让自己的“儿子”熊和“女儿”兔子代赛，鬼接连输了两场。
  - 最后鬼取出祖传金钮扣比谁抛得高，农夫说要等云来了抛到云里。鬼担心输掉宝物，赶紧收起钮扣，不再比试。故事在辞典中记作流传于广东兴宁，以接连错位的比赛呈现机智。
  source_numbers:
  - 1
  - 2
  map_label: 广东梅州 · 兴宁市
  location_note: 兴宁市行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_suiping_qiyuan:
  kind: story
  paragraphs:
  - 齐元自夸懂武艺，一位老人便请他到小庙里除鬼。夜里他看到黑影晃动，硬着头皮举剑砍去；听见另一边又有脚步声，情急之下再砍一剑。
  - 天亮后老人带他去看，所谓的鬼竟是他自己的斗笠和小灰驴。齐元的邀功变成一场尴尬，此后不敢再夸耀。辞典将它记为河南遂平流传的故事。
  source_numbers:
  - 1
  - 2
  map_label: 河南驻马店 · 遂平县
  location_note: 遂平县行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_guzhen_donkey_debt:
  kind: story
  paragraphs:
  - 阮成常接济舅舅莫祥，舅舅感念他的照顾，说来世要变成驴报答。后来家中出生了一头小驴，夫妻俩把它看作舅舅转生，对它格外照顾。
  - 赶集时，小驴突然踩坏一个卖碗坛的摊子。商人本要索赔，听说这驴被称为“舅舅”后却改口，说自己生前欠过莫祥的钱。辞典将这个以转生讲述人情与债务的故事记为安徽固镇传闻。
  source_numbers:
  - 1
  - 2
  map_label: 安徽蚌埠 · 固镇县
  location_note: 固镇县行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_xiangyang_ghost_shadow:
  kind: story
  paragraphs:
  - 传说恶名远扬的财主张古被新任知县杜郑和处死后，一心复仇。他先化作女子接近知县未果，又扮作村妇在路上等待，最终害死杜郑和。
  - 知县死后向天庭申诉，太上老君提出让鬼不再有影子，以便人与鬼区分。从此鬼没有影子，便成了这则襄阳故事给出的想象性解释；人物与天庭情节都属于讲述。
  source_numbers:
  - 1
  - 2
  map_label: 湖北 · 襄阳市
  location_note: 襄阳市行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_taojiang_egg_ghost:
  kind: story
  paragraphs:
  - 贫困的田令光每天捡蛋壳放在供桌上，感动了一位被称为蛋壳鬼的存在。故事说，供桌渐渐变大，家里缺少的器物都有了，田令光也过上安稳日子。
  - 生活变好后，他不再捡蛋壳，还要求得到官职；做了知县后又胡作非为。蛋壳鬼收回馈赠，他重回贫困。辞典记它流传于湖南桃江，情节把受惠后的变化写成一则反转故事。
  source_numbers:
  - 1
  - 2
  map_label: 湖南益阳 · 桃江县
  location_note: 桃江县行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_zhangjiakou_ghost_market:
  kind: story
  paragraphs:
  - 刘成想买便宜褂子，来到传说里涿鹿城的鬼市，用一吊小钱换到一件衣服。等天亮细看，褂子却化成灰，根本穿不得。他只好再次进市寻找卖衣的人。
  - 卖主原来被讲作鬼，因妻子分娩急需钱才出来做买卖。他把钱还给刘成，还劝他以后少来鬼市，免得被坏人算计。辞典说此故事流传于张家口，并不证明故事中的夜市位置。
  source_numbers:
  - 1
  - 2
  map_label: 河北 · 张家口市
  location_note: 张家口市行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_handan_misjudged_fate:
  kind: story
  paragraphs:
  - 王三死后在阴间做了差官，仍来看望生前酒友李四。他感谢李四照顾自己的家人，还提前告诉对方死期将至：只要藏到午时三刻以后，就可能躲过一劫。
  - 李四钻进老槐树洞，王三则命手下磨刀拖延时辰。不料试刀时偏偏砍向槐树，反而害了躲在树里的酒友。辞典把这段好心却酿成悲剧的阴间故事记为邯郸所传。
  source_numbers:
  - 1
  - 2
  map_label: 河北 · 邯郸市
  location_note: 邯郸市行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_qitaihe_judge_head_swap:
  kind: story
  paragraphs:
  - 广交和妻子生活和睦，一位与他交好的酒友却嫌妻子的容貌不美。这酒友原来是阴间判官，竟自作主张，将广交妻子与张尚书女儿的头换了位置。
  - 张尚书四处寻找女儿，最终在广交家弄清事情经过；阎王得知后处罚判官，广交又用一车纸钱救下这位朋友。辞典将它记为七台河流传的故事，情节中的越界出于判官自己的判断。
  source_numbers:
  - 1
  - 2
  map_label: 黑龙江 · 七台河市
  location_note: 七台河市行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_zhaoping_magic_mill:
  kind: story
  paragraphs:
  - 传说石盘山上有一座神磨，石头和树叶放进去，便能变出米和清水。一年大旱，村里颗粒无收，李老汉为帮助乡亲，说服看守神磨的黑汉鬼拿出粮水。
  - 地主愤恨，从阴间一路买通到天上，雷公劈毁了神磨。后来乡亲建庙祈雨，故事以再次降雨作结。辞典记它流传于广西昭平；石盘山的具体位置未作核定。
  source_numbers:
  - 1
  - 2
  map_label: 广西贺州 · 昭平县
  location_note: 昭平县行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_fengning_liuxiang:
  kind: story
  paragraphs:
  - 猎人和气天黑时在山野求宿，遇见名叫柳香的女子。她留他吃饭过夜，随后请他回家延媒成亲。婚后柳香帮助乡人治病，大家都敬重她。
  - 柳香后来告诉和气自己原是鬼，因驱走恶鬼而须离开。她嘱咐和气迎娶与自己相貌相似的张小玉，随后不见；众人在山野只找到一座荒坟。辞典将这段人鬼姻缘记为丰宁地方故事。
  source_numbers:
  - 1
  - 2
  map_label: 河北承德 · 丰宁满族自治县
  location_note: 丰宁满族自治县行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_xingan_friend_ghosts:
  kind: story
  paragraphs:
  - 王得灵和陈得灵生前是好友，死后仍在一起帮助路人。故事说，一位猎人夜里迷路，两人接他留宿；后来又有客商在坟场附近腹痛，他们把他接回去照料。
  - 客商康复后带着礼物寻找恩人，村里老人告诉他两人早已去世，他再到旧地，只看见坟墓。客商于是焚礼致谢，传说有两只青蛙衔走灰烬。辞典记这则朋友鬼故事流传于广西兴安。
  source_numbers:
  - 1
  - 2
  map_label: 广西桂林 · 兴安县
  location_note: 兴安县行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_laoshan_magistrate_ghost_clerks:
  kind: story
  paragraphs:
  - 除夕夜，周县令听到两个鬼差抱怨：死前当差，死后还得抓人。他认出他们是旧时捕头，也听出要带走的人是刘老汉的女儿桂花，便赶去寻找她。
  - 桂花因家中争执正在寻死，父亲和县令及时将她带回。鬼差没法交差，县令便在差案上写明放人并为他们开脱。辞典记这则故事流传于崂山，阴间办差与人间救人交织在一起。
  source_numbers:
  - 1
  - 2
  map_label: 山东青岛 · 崂山区
  location_note: 崂山区行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_dongfang_jawless_ghost:
  kind: story
  paragraphs:
  - 潘仁夜里听见有人叫他捉鱼，便跟着对方到河边。那人吃起烤鱼，却一边吃一边往下掉；潘仁这才看见，对方没有下颌，样貌也逐渐变得可怖。
  - 受惊的潘仁回去后病了一场。辞典记，地方上由此讲起半夜听到呼唤不要贸然应声的说法；河边的地点和故事发生时间都没有在条目里交代。
  source_numbers:
  - 1
  - 2
  map_label: 海南 · 东方市
  location_note: 东方市行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_xiushui_jar_ghosts:
  kind: story
  paragraphs:
  - 半夜里，一个单身汉遇见六名挑箩筐的人，正往刘家大屋运谷。他们递给他一副扁担，邀他同行。连挑三次之后，他意识到这伙人在偷别人粮食，又怀疑自己碰上了戏弄人的鬼。
  - 再见面时，他骗六名夜客说刘家请人来捉他们，趁他们求救，把他们引进坛子封住。辞典将这则以谷物、夜行和机智为线索的故事记作流传于江西修水。
  source_numbers:
  - 1
  - 2
  map_label: 江西九江 · 修水县
  location_note: 修水县行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_haiyan_boat_passenger:
  kind: story
  paragraphs:
  - 手艺人阿仁乘船回家过年，听见岸上一家穷人争吵，便上岸赠银解困。夜里又有两人上船查账，他瞥见账簿上写着自己正月十五将死，才知道对方被讲作阴间查账的鬼。
  - 年后阿仁再次经过那家，见只有两个孩子，又留下银钱。到了约定的日子，他躺在门板上等候，查账鬼却来告知阎王因他心善添了寿。辞典把这则因果故事记为浙江海盐所传。
  source_numbers:
  - 1
  - 2
  map_label: 浙江嘉兴 · 海盐县
  location_note: 海盐县行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_yueqing_clam_tide:
  kind: story
  paragraphs:
  - 传说蒲岐滩涂生有白蛤，人们纷纷下海采捉，也有人被潮水卷走。一次捉蛤时，出现一名女子，向前方引路，自称住在东海水晶宫。
  - 她用婚姻和长生的承诺引诱青年与老人，两人随着她走向潮头，再没有回来。辞典记故事流传于乐清；滩涂与潮水是叙事背景，不能据此把故事人物认作可核实事故。
  source_numbers:
  - 1
  - 2
  map_label: 浙江温州 · 乐清市
  location_note: 乐清市行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。
case_cn_dict2_shangyu_executioner_pipe:
  kind: story
  paragraphs:
  - 一个刽子手曾听处决的囚犯喊冤，说死后也要来找他。后来黄昏穿过弄堂时，他听见身后有人追喊“还我的头”，吓得一路奔逃，逢人便讲自己遇到了讨头的鬼。
  - 茶店里，一位锡箔师傅听到后揭开误会：先前刽子手踢落了他的烟管头，他追着喊的正是要对方赔还烟管头。辞典记这则语言误会故事流传于浙江上虞。
  source_numbers:
  - 1
  - 2
  map_label: 浙江绍兴 · 上虞区
  location_note: 上虞区行政区域参考点，坐标来自 OpenStreetMap 行政区对象；表示辞典所记的流传区域，非故事中具体发生地点。

case_cn_dict3_dandong_actor:
  kind: story
  paragraphs:
  - 丹东一带有一则被辞典收入的故事：唱花脸的戏子听说西厢房闹鬼，偏要在那里过夜。夜深后，纸窗破洞里伸进一条腿，他一把抓住，发现来的是一名女子。
  - 女子想吓走戏子，变出鬼脸；戏子便用自己的脸谱回应。她又吹来阴气，他不肯退让，最后女子认输。戏台上的装扮，在这里成了人鬼相互试胆的道具。
  source_numbers:
  - 1
  - 2
  map_label: 辽宁丹东
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_ruzhou_wang_yong:
  kind: story
  paragraphs:
  - 临汝地方故事中，王勇听说弟弟被乱坟附近出没的女鬼害死，决心面对她。一天夜里，他将前来的女鬼背在身上，继续干活，一直坚持到天快亮。
  - 女子想回阴间，先恐吓、再挣扎，王勇仍不放手。天亮后她化成一块旧木板；村人起初不相信，后来在长者帮助下将木板烧掉。辞典以旧地名临汝标示流传范围。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 河南汝州
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_hengzhou_scholar_nail:
  kind: story
  paragraphs:
  - 一群无赖打赌，要人在夜里到坟上钉钉子，接着又逼一名秀才代劳。秀才来到坟边，坟中女子现身，向他倾诉自己在阴间遭遇的不公。
  - 两人商定对付无赖；第二天秀才把他们引到坟地，故事以无赖受惩、女子还阳收尾。辞典记其流传于旧称横县的地方，记述的是一则故事而非可核验的案件。
  source_numbers:
  - 1
  - 2
  map_label: 广西横州
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_hailun_who_saved_whom:
  kind: story
  paragraphs:
  - 海伦流传的故事里，一名书生收留了自称无家可归的女子。过了一阵，他在集市遇见僧人；僧人认为女子并非寻常来客，送给他三样护身物。
  - 夜里女子现出另一副面目，护身物随之起作用；故事最后揭示她是狐狸所变。书生原以为自己救助了陌生人，后来却感谢那位提醒他的人，题目因此留下互相救助的反问。
  source_numbers:
  - 1
  - 2
  map_label: 黑龙江海伦
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_biyang_spinning_ghost:
  kind: story
  paragraphs:
  - 辞典所记泌阳故事中，一位年轻媳妇白天忙于家务，夜里还被要求纺线。深夜有个小鬼上门，劝她去做替身；她意识到对方的意图，没有照办。
  - 她借口先要烧水洗脚，让小鬼靠近，趁机用热水把它赶除。故事说，家人从此不再逼她夜间纺线；这里呈现的是带有家庭劳役背景的民间故事，而非一宗被证实的事件。
  source_numbers:
  - 1
  - 2
  map_label: 河南泌阳
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_liping_wuchang:
  kind: story
  paragraphs:
  - 书生张胜经过一间酒家，与店主阿妞约定婚事；临别时她还给他盘缠。到了约定的时候，张胜却把承诺忘了。辞典中的故事说，阿妞死后化为鬼，再次找到他。
  - 二人后来成婚，村里发生孩子失踪的怪事，一位长者向张胜提醒妻子的来历。故事以张胜无法摆脱鬼魅而身亡收场。人物命运、失踪与鬼怪都是民间叙事情节，不是现实指控。
  source_numbers:
  - 1
  - 2
  map_label: 贵州黎平
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_fuyang_jade_brother:
  kind: story
  paragraphs:
  - 故事说，接生婆夜里替一户人家接生，主人以一对龙凤玉佩作为信物：一块给接生婆的孩子张龙，一块留给自家孩子王麟。后来张龙家境败落，手持另一块玉佩的王麟前来相助。
  - 张龙得知对方是“鬼弟”，仍接受他的提醒，重新读书做人。后来他因玉佩结识伴侣；王麟辞去时化为青烟，张龙每见旧物便想起这段情谊。辞典记其流传于阜阳一带。
  source_numbers:
  - 1
  - 2
  map_label: 安徽阜阳
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_jinzhou_ghost_gambling:
  kind: story
  paragraphs:
  - 锦州一则故事里，嗜赌的人赢钱后喝了酒，夜间来到一间土屋，看见床上躺着一人，便邀对方赌钱。他先赢后输，辞别而去。
  - 第二天，他发现口袋里是纸钱，急忙回到昨夜的地方，却只见土坟和倒下的石碑。坟边还有先前赢到的银元；他这才相信昨晚赌局的对手不是常人，受惊之后戒了赌。
  source_numbers:
  - 1
  - 2
  map_label: 辽宁锦州
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_pingdu_five_fingerprints:
  kind: story
  paragraphs:
  - 书生周生进京赶考，与两名同伴受一位白衣女子指引，在空房中留宿。半夜，同伴醒来发现脸上有五道红印，说自己在睡梦中被可怖的人打了一巴掌。
  - 周生随后听见女子诉说冤屈，请他将来替自己伸冤。故事说他考中后查办了害死她的人；空屋、掌印与诉冤共同构成辞典收录的平度地方叙事。
  source_numbers:
  - 1
  - 2
  map_label: 山东平度
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_changyi_red_children:
  kind: story
  paragraphs:
  - 一位商人酒后赶夜路，经过坟场时听到笑声，看见许多孩子在坟头玩耍，围着他要背。孩子们有的爬到肩上，有的钻进背囊，他背着他们走了大半夜。
  - 鸡叫时，孩子们要求下来，商人却坚持带回家。到了家里，他发现背上是一块棺材板，背囊里只剩纸钱；夫妻随后去坟地烧纸，此后再没遇见同样的事。
  source_numbers:
  - 1
  - 2
  map_label: 山东昌邑
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_qinzhou_mojun:
  kind: story
  paragraphs:
  - 钦州地方故事里，莫俊在夜路上遇到一个以钱财相诱的吊颈鬼。道士察觉不对，叫他赶去姐姐家，从灶灰里取出一块人骨，好让鬼无法施展法术。
  - 莫俊到家时，鬼正用金钱引诱姐姐。姐姐没有上当，莫俊揭穿后鬼现出原形；道士赶来，故事以鬼被驱除结束。辞典没有提供这处住宅的具体位置。
  source_numbers:
  - 1
  - 2
  map_label: 广西钦州
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_dict3_weining_flower_shoes:
  kind: story
  paragraphs:
  - 商人“大花脸”深夜住进客栈，见一个鬼取下獠牙、摘头梳发，又出门拜月。商人把獠牙安在自己嘴上；鬼回来误以为遇见鬼王，慌忙献上一双花鞋逃走。
  - 穿上鞋后，他发现自己可以隐身，起初拿它捉弄店伙计，后来竟去偷财主的钱。县官与他打赌，也被花鞋戏弄；两人最终因偷窃受罚。故事把夜宿惊遇接成了一则关于贪念的怪谈。
  source_numbers:
  - 1
  - 2
  map_label: 贵州威宁
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
case_cn_tengchong_paper_horse_interview_2001:
  kind: history
  paragraphs:
  - 2001 年，邓启耀在腾冲和顺访问纸马店。一位店主向他介绍，有人怀疑家中财物反复失窃时，会把甲马纸供起来，希望借此让旁人不敢再取。
  - 受访者还谈到人们在争执中使用纸马的说法。书中保留的是一位店主的解释，而不是证明纸马可以辨认小偷；访谈地点和年份也不能代表云南所有人的做法。
  source_numbers:
  - 1
  - 2
  map_label: 云南腾冲
  location_note: 地图为所属市县的参考点，不是受访者住址或纸马店的精确位置。2001 年是书中所记采访年，不代表习俗起源年份。
case_cn_lianghe_paper_horse_dispute_2001:
  kind: history
  paragraphs:
  - 同在 2001 年的一次梁河访谈中，受访村民讲述：如果东西丢失，怀疑的人和被怀疑的人又各执一词，双方可能带着甲马纸到寺庙，向神灵陈说并发誓。
  - 这则口述把纸符放在无法取得证据的争执中；作者随后讨论它可能具有象征性的裁决功能。它属于受访者所描述的地方实践，不证明誓言可以查明失物，也不应泛化为整个地区的共同做法。
  source_numbers:
  - 1
  - 2
  map_label: 云南德宏 · 梁河县
  location_note: 地图为所属市县的参考点，不是受访者住址或纸马店的精确位置。2001 年是书中所记采访年，不代表习俗起源年份。
case_cn_gaochun_road_stone_grandmother:
  kind: history
  paragraphs:
  - 陶思炎记下，高淳旧称双塔乡的一条朝北村道旁有座小庙，供着当地人称为“石婆婆”的石像。村人说，她与北风有关；石像朝着路的方向，寄托着为村落挡风护路的愿望。
  - 作者讨论她是否与石将军信仰相连，同时明确起源难以考定。村人的解释、书中记录的石像和研究者的推测属于不同层次，不能据此断定神像能够治疗疾病或改变天气。
  source_numbers:
  - 1
  - 2
  map_label: 江苏南京 · 高淳区
  location_note: 高淳区参考点仅表示书中田野所涉区域，不是庙宇、桥梁或旧村的精确坐标；具体地点及现状未独立核实。
case_cn_gaochun_danhu_bridge_ghost_1987:
  kind: story
  paragraphs:
  - 黄昏里，张屠夫走到村口桥边，一位女子请他背自己过桥。她说要去村里看戏，却不敢独自通过；张屠夫留意到她异样的眼睛，仍答应背她上桥。
  - 到了桥中央，他停下来追问她来意，并说如果不回答就把她留在桥上。陶思炎记下这个故事片段，用来讨论鬼畏桥梁的地方观念；书中所记 1987 年是采录年，故事发生时间不详。
  source_numbers:
  - 1
  - 2
  map_label: 江苏南京 · 高淳区
  location_note: 高淳区参考点仅表示书中田野所涉区域，不是庙宇、桥梁或旧村的精确坐标；具体地点及现状未独立核实。
case_cn_gaochun_wei_bagong_lake:
  kind: story
  paragraphs:
  - 地方传说里，一名押粮官在石臼湖遇见大风浪，许愿如果船队能平安完成任务，返途便以自身答谢水神。待粮船平安抵达，他再次经过湖面时兑现了誓言。
  - 陶思炎记述当地人后来为他建庙，船民在水上劳作或远行前会到庙中祈求平安。押粮与誓愿属于地方传说；书中另记录了供奉与出行祈愿的习俗。
  source_numbers:
  - 1
  - 2
  map_label: 江苏南京 · 高淳区
  location_note: 高淳区参考点仅表示书中田野所涉区域，不是庙宇、桥梁或旧村的精确坐标；具体地点及现状未独立核实。
case_cn_hk_king_george_park_child:
  kind: legend
  paragraphs:
  - 西营盘街坊在一次社区鬼故导览中讲起童年回忆：大人坐在公园长椅上照看孩子，瞥见一名陌生男童沿着坡道跑远；可他的背影似乎没有随着斜坡逐渐降低。
  - 讲述者说，故事传开后，部分家长因此不安。2016 年《明报》采访把它与附近街区历史一起保存下来；这是一则受访者转述的社区传闻，原始目击时间及经过无法核实。
  source_numbers:
  - 1
  - 2
  map_label: 香港西营盘 · 佐治五世纪念公园
  location_note: 坐标表示香港岛西营盘公园的位置，非传闻中孩子的精确站位；叙述事件的年份不详。
case_cn_hk_pingshek_night_worker:
  kind: legend
  paragraphs:
  - 一个香港屋邨鬼故说，年轻人夜里送女朋友回家，经过井字形大楼的天井，看见一位挑着两个大桶的老妇与自己擦身而过。他疑惑地问，为什么这里还有人做这种旧式清运工作。
  - 同行的女友说自己什么也没看见；两人回头，老妇已不在原处。2017 年《东方日报》采访一位讲述者时记录了这个版本，所述相遇时间与人物身份没有独立证明。
  source_numbers:
  - 1
  - 2
  map_label: 香港九龙 · 坪石邨
  location_note: 标点是公共屋邨的整体参考位置，不代表故事中某栋住宅或个人住址。
case_cn_hk_victoria_prison_night_call:
  kind: legend
  paragraphs:
  - 香港旧监狱的夜巡故事中，有值勤者在昏暗的地下空间困倦打盹，仿佛听见身边有人提醒自己该醒来了。另一些人说，某道铁门前需先做出特定动作才敢开门。
  - 香港政府文物导览手册收录了这些说法，并转引中西区地方传说资料。监狱作为历史建筑的存在可以查证，声音、铁门习俗及相关灵异解释则仍是手册所载的传闻。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 香港中环 · 域多利监狱旧址
  location_note: 坐标指旧监狱园区参考点，具体地下房间和传闻中的位置未定位。
case_cn_jintang_rooftop_planter_2026:
  kind: legend
  paragraphs:
  - 2026 年，一则消息称成都金堂某小区楼顶的土堆里埋着一名孩子。带着牙齿的碎片照片被传播后，楼顶花坛变成了令人不安的“坟堆”故事。
  - 当地警方通报称，现场是被杂物覆盖的花坛，没有发现墓葬设施；送检残片符合畜禽骨骼和鱼类咽齿特征，关于男童坟墓的说法没有事实依据。这里保存的是传播与核查过程，并非失踪儿童事件。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 四川成都 · 金堂县
  location_note: 为保护居民隐私，标点仅采用金堂县城参考位置，不标记小区或住宅。2026 年是报道与调查时间。
case_kr_hongseong_legend_garden_taxi_2012:
  kind: legend
  paragraphs:
  - 雨夜里，一位穿白衣的女子拦下出租车，到一座旧宅门前下车。她说进屋拿钱，司机等了许久不见人出来，便进门询问。屋里的人告诉他，女儿已去世多年，恰好今天是祭日，并替她付了车费。
  - 2012 年洪城的访谈中，讲述者说这是自己听来的“传说庭园”附近的故事；在场听众也加入补充。记录保存的是一次地方讲述，不能据此确认乘车经过或女子身份。
  source_numbers:
  - 1
  - 2
  map_label: 韩国 · 忠清南道洪城郡
  location_note: 洪城郡城镇参考点，表示 2012 年采录地域；故事里提到的庭园与上下车地点未定位。
case_kr_taebaek_sangdong_pass_taxi_2012:
  kind: legend
  paragraphs:
  - 一位拎包的女子在上东山口拦下出租车，让司机送她去堤川。到家后她推门进去拿车费，却一直没有出来；司机向屋里的人询问，双方因此争执。
  - 家中长辈听过她的衣着后，说她是多年前在山口遇事故去世的儿媳，当晚恰逢祭日。2012 年在太白采录的这个版本里，司机留宿一夜才回家，后来大病一场；这些都是讲述内容，而非独立查证的事件。
  source_numbers:
  - 1
  - 2
  map_label: 韩国 · 江原道太白市
  location_note: 太白市中心为访谈地域参考；故事中的上东山口、目的地住宅和路线未准确定位。
case_kr_ansan_daebu_dark_road_2011:
  kind: legend
  paragraphs:
  - 一名妇人回忆，丈夫过去总说人比鬼可怕。某夜他喝酒后冒雨回家，在山下停下来点烟，路边却黑得几乎看不见；他挥拳驱赶黑影，一直走到村里的堂树附近才辨清道路。
  - 丈夫回家后改变了原先的说法，称途中像遇见了鬼。2011 年大阜岛访谈保留的是妻子对丈夫叙述的回忆，讲述者同时说明自己从未亲眼看见这类东西。
  source_numbers:
  - 1
  map_label: 韩国 · 安山市大阜岛
  location_note: 大阜岛区域参考点，采录于岛上长者活动场所，所述山路未定位。
case_kr_wonju_lost_thorn_path_2010:
  kind: legend
  paragraphs:
  - 一个人在夜里跟着某个东西走了很久，穿过灌木和带刺的草丛，天亮时脸上留下许多伤痕。当地讲述者把这样的迷路经历称作受到了“多怪比”的迷惑；多怪比是朝鲜半岛传说中的精怪。
  - 2010 年在原州访谈中，讲述者又说人们常在喝酒以后讲起这类遭遇。采录保存了一种地方解释，并没有足够信息判定那一夜的路线或引路事物。
  source_numbers:
  - 1
  map_label: 韩国 · 江原道原州市
  location_note: 原州市中心为指定面访谈地域参考，故事里的山谷和荆棘丛未定位。
case_kr_geumsan_irrigation_goblin_2009:
  kind: story
  paragraphs:
  - 天旱时，农人忙到夜里才给田里引够水。回家路上，一个被称作多怪比的精怪跟着他，不停要把肉塞给他；他害怕极了，跑回屋里闩上门。
  - 第二天早上，门上挂着蛇和青蛙。2009 年锦山的讲述者说这是长辈讲过的事，故事把灌溉、夜路和难以辨认的食物连在一起。
  source_numbers:
  - 1
  map_label: 韩国 · 忠清南道锦山郡
  location_note: 锦山郡城镇参考点，采录地点为富利面，道路与住家未定位。
case_kr_gwangju_potlid_gas_station_2012:
  kind: legend
  paragraphs:
  - 夜里厨房传来碰撞声，开灯却看不见人。一次人们发现锅盖卡进铁锅里拔不出来，过一会儿再看，锅盖又已被取出；在场的几位讲述者把这类动静说作民间精怪多怪比的恶作剧。
  - 这段 2012 年京畿广州市的集体访谈还留下了不同意见：有人认为人们喝酒后会看错，另一些人则继续说起夜间的声音。记录展示的是现场如何共同讲述与争论。
  source_numbers:
  - 1
  map_label: 韩国 · 京畿道广州市
  location_note: 京畿道广州市参考点，不是全罗南道的光州；采录地超越邑的加油站与宅院未定位。
case_kr_jangheung_following_lights_2013:
  kind: legend
  paragraphs:
  - 一位村民说，自己夜里饮酒归家，走到村口时看见一点光；光似乎分成几处，沿着路移动并跟着他。他害怕得加快脚步，仍觉得那几盏光在靠近。
  - 2013 年的长兴村落访谈中，旁边的听众把它称为“多怪比火”，即与民间精怪相关的火光。对照记录可看到本人叙述与听众命名的差别；光的来源并未获得现场检验。
  source_numbers:
  - 1
  map_label: 韩国 · 全罗南道长兴郡
  location_note: 长兴郡城镇参考点；采录在龙山面云舟村，光点与夜路的具体位置未测定。
case_kr_namhae_coastal_road_light_2011:
  kind: legend
  paragraphs:
  - 海边开新路时，山坡尚在施工，人们只得绕行旧海岸路。当地讲述里，一名男子夜行经过这段被认为不安宁的路，遇见被称作鬼火的东西，于是划亮火柴将它驱走。
  - 2011 年在南海郡加川村受访的讲述者明确说，这故事来自长辈，自己并未见到。道路修建、口述故事与光的成因，需要分别寻找证据。
  source_numbers:
  - 1
  - 2
  map_label: 韩国 · 庆尚南道南海郡
  location_note: 南海邑为郡级参考点；采录地为南面加川村，故事中海岸旧路并未确定。
case_kr_gwangmyeong_broom_dokkaebi_2013:
  kind: story
  paragraphs:
  - 受访者回忆，长辈说过沾了血的扫帚到了夜里会变成精怪多怪比或鬼，白天又还原为普通扫帚。这样的传闻让人们从熟悉的日用物品里想象夜间出行的怪物。
  - 这是一段 2013 年在光明市采集的简短口述，没有人物相遇或具体住址。它可与日本器物成精故事并读，但相似形象不自动意味着两个地方存在传播关系。
  - 陶思炎《中国镇物》还讨论了朝鲜岁时传闻中的夜光鬼：人们以筛子应对偷鞋的鬼。这是另一则与家用器具相关的材料，书中没有记载本条光明市扫帚口述，二者只作主题比较。
  source_numbers:
  - 1
  - 2
  map_label: 韩国 · 京畿道光明市
  location_note: 光明市中心为采录地域参考，故事并无确定住宅或具体地点。
case_kr_seocheon_cotton_hill_2010:
  kind: legend
  paragraphs:
  - 一位父亲到群山买棉花，准备让女儿出嫁时使用。夜里回来经过山口，棉包一再被扔落，他捡起来背上，又掉下去；天亮后，田间散落着被撕开的棉花。
  - 2010 年的舒川访谈里，有听众说这不是遥远的古事，而是他们年轻时听闻或见过的事；讲述者将棉包的反复掉落说成与多怪比角力。其确切经过并无独立记录。
  source_numbers:
  - 1
  map_label: 韩国 · 忠清南道舒川郡
  location_note: 舒川郡中心为韩山面采录区域参考，故事所说山口未精确定位。
case_kr_haman_mountain_ritual_2013:
  kind: legend
  paragraphs:
  - 一位讲述者回忆自己夜里跟着旁人去看巫俗仪式，仪式进行时出现了他认为是山神的身影。他试着从不同角度看清那人的面孔，甚至俯到地上，最后仍没有看清。
  - 2013 年在咸安的采访中，他还用动作示范当时的姿势。资料记录了个人经验及仪式后的解释，并不能独立证实神灵现身。
  source_numbers:
  - 1
  map_label: 韩国 · 庆尚南道咸安郡
  location_note: 咸安郡行政区参考点；采录在中村村会馆，故事中夜间仪式的具体地点未知。
case_kr_yeongjong_snow_road_1982:
  kind: legend
  paragraphs:
  - 一名男子祭祖后踏雪独行，远远看见两名穿白衣的人。他几次招呼，希望与他们结伴，对方却始终不应声；他冲过去撞踢，眼前的人影便消失了。
  - 他回忆自己喝过酒，事后才发现衣服破损、鼻子流血。1982 年永宗岛的采录把这次经历放进附近“发出怪味的多怪比”传闻里，事情究竟如何发生并无独立验证。
  source_numbers:
  - 1
  map_label: 韩国 · 仁川永宗岛
  location_note: 永宗岛区域参考，1982 年采录于云北里；旧时夜路未测定。
case_kr_sinan_ghost_friend_1984:
  kind: story
  paragraphs:
  - 岛上一名男子有时会突然不见，回来后说曾被鬼背着渡海。后来，与他交好的那个存在表示要回故乡，请他备好食物、酒和糕，在山谷巨石旁作最后一顿聚餐。
  - 1984 年在岩泰岛采录的这个故事中，来客席间才说出自己的身份与离别缘由。它让鬼成为能同行、受人招待并郑重告别的朋友，而不是只会惊吓人的形象。
  source_numbers:
  - 1
  map_label: 韩国 · 全罗南道新安群岛岩泰岛
  location_note: 岩泰岛区域参考；故事里的洞窟与巨石未单独定位。
case_jp_tono_obakobuchi_kappa_horse:
  kind: story
  paragraphs:
  - 孩子把马牵到小乌濑川边洗凉，转身玩耍时，河童想把马拖进水里，反而被马拉回屋舍。家里人掀开倒扣的马槽，看见下面伸出一只手，村民便聚拢商议如何处置它。
  - 大家最终让河童承诺不再戏弄村里的马，将它放走。柳田国男《远野物语》第 58 则记录这一地方故事；不同河童淵如今也与观光活动相连，但本条不把所有地点视为同一水域。
  source_numbers:
  - 1
  - 2
  map_label: 日本 · 岩手县远野市
  location_note: 远野市中心为区域参考；《远野物语》称地点为小乌濑川姥子渊，与其他河童淵景点不可混作一个精确点。
case_jp_yotsuya_oiwa_kabuki:
  kind: story
  paragraphs:
  - 歌舞伎《四谷怪谈》中，伊右卫门想抛弃妻子阿岩，与他人合谋用毒药加害她。阿岩容貌受损后死去，她带着怨恨归来，持续纠缠负心的丈夫，令他最终走向毁灭。
  - 这是一部 1825 年首演的舞台戏剧，属于虚构作品。东京四谷有与阿岩故事相关的稻荷神社和地方说法；剧中情节与神社的现实历史应分开阅读。
  source_numbers:
  - 1
  - 2
  map_label: 日本 · 东京四谷
  location_note: 四谷地区参考点；稻荷神社与舞台中人物的命运并非可以互证的真实现场。
case_kr_jeju_gimnyeong_snake_cave:
  kind: story
  paragraphs:
  - 济州地方故事说，金宁蛇窟中有一条巨蛇，人们相信它会招来风雨，于是每年向它献祭少女。传说中一位新任判官带人前来，在巨蛇扑向少女时将其斩杀，救下了她。
  - 同一传说又讲，判官返途中被一道红光照到背部，此后患病去世。当地旅游资料将它作为洞窟传说介绍；熔岩洞穴的地质事实与故事中的献祭、巨蛇和因果需要分开。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 韩国 · 济州岛金宁窟与万丈窟地区
  location_note: 政府开放数据中金宁窟及万丈窟保护范围的代表点；旅游与洞窟资料坐标不一致，不作为金宁蛇窟洞口或传说场面的精确位置。
case_kr_jeju_sanbang_tears:
  kind: story
  paragraphs:
  - 在济州山房山的故事里，美丽的山神山房德与一名凡人相爱。贪恋她的官员将她的爱人流放，她逃到山中，悲伤地化为岩石。
  - 山房窟寺洞顶的水滴被地方讲述称作她不曾止息的眼泪。山体与洞窟可以观察，山神与人间的遭遇属于地方传说。
  source_numbers:
  - 1
  - 2
  map_label: 韩国 · 济州岛山房山
  location_note: 标记山房山山体参考坐标，洞内滴水点并未定位。
case_kr_jeju_dragon_head_stone:
  kind: story
  paragraphs:
  - 济州一则故事说，一条盼望成龙的蛇在海底等待漫长岁月，终于升向天空时，却被汉拿山神射下。它浮出海面仰头长啸，随后化成岩石；这便是人们指认的龙头岩。
  - 济州旅游公社的地点介绍还提及龙从附近龙渊升天化石的说法。当地岩石外形与风浪侵蚀可以观察，关于龙的动机和结局则随讲述而变化。
  source_numbers:
  - 1
  map_label: 韩国 · 济州岛龙头岩
  location_note: 龙头岩海岸地标的参考坐标，不指故事中龙的实际活动路径。
case_kr_jeju_oedolgae_grandmother:
  kind: story
  paragraphs:
  - 一位老人出海捕鱼，迟迟没有归来。妻子在岸边不断眺望，最终也化作海上的一根石柱；靠近水面的一块石头，则被故事说成遇难的丈夫。
  - 济州的同一石柱还有被将军用作威吓敌军的另一传说，因此有不同名字。旅游资料也将它解释为海浪侵蚀海岸岩体后留下的海蚀柱；这与等待归人的故事属于不同层次的解释。
  source_numbers:
  - 1
  - 2
  map_label: 韩国 · 济州岛西归浦独立岩
  location_note: 西归浦独立岩海岸地标参考坐标；老妇人的经历属于地方传说。
case_mn_ub_courtyard_white_visitor:
  kind: legend
  paragraphs:
  - 一家人搬进旧院落后，养来看门的狗夜里不断奔跑狂吠。男主人从窗里看出去，见一名白衣男子站在院中；他出声询问，来客便消失了。后来家人又听见一个人声，像是在寻找自己的车马和财物。
  - 研究者格雷戈里·德拉普拉斯分析过一则 2006 年出版的乌兰巴托故事：家人请宗教人士处理之后，狗和夜声都安静下来。文章讨论了这类叙事里的历史记忆与族群刻板印象；故事对来客身份的归因不构成对任何现实族群的判断。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 蒙古 · 乌兰巴托
  location_note: 乌兰巴托市中心参考点；研究文章提到登吉因明嘎一带，未公开具体住宅地址。
case_mn_ub_neighbor_nightly_coins:
  kind: legend
  paragraphs:
  - 一名男子发现隔壁住户总是住不长久。某夜，他听见院墙另一边有人反复讨钱；他与邻居打听旧屋的过去，又尝试请人举行仪式，声音仍时有出现。
  - 故事里，邻居偶然朝院子扔下一枚硬币，声音短暂平息，后来却不得不一次次照做，最后搬离。人类学文章据 2003 年故事集转述这一匿名版本，并提醒读者留意其中关于外来者的刻板印象；它不是可核实的闹鬼事件。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 蒙古 · 乌兰巴托
  location_note: 乌兰巴托市中心参考点；研究所引故事对住宅使用匿名处理，具体住址未知。
case_bn_seria_coast_white_woman_2006:
  kind: legend
  paragraphs:
  - 文莱作者回忆，姨妈一家深夜驾车回诗里亚时，看见路边有个人招手。车开近后，白衣身影仿佛站到车前；汽车没能停住，继续驶过，再回头已看不见那人。
  - 这段讲述发表于 2006 年的个人文章，是作者转述家人的经历。文章同时提到沿海公路上的许多不同传闻；没有现场调查材料，不能把夜间所见或道路事故的成因定为某一种解释。
  source_numbers:
  - 1
  - 2
  map_label: 文莱 · 诗里亚地区
  location_note: 诗里亚是家人驾车前往的城镇参考点，原文未记具体道路或出现位置。
case_bn_meragang_beach_chase_2006:
  kind: legend
  paragraphs:
  - 一群年轻人在海滩停留后忽然跑回车上：据转述，某种东西从附近追出来，一路跟着汽车，直到他们驶上公路。讲述者将其与他们在海滩的不当举动联系起来。
  - 2006 年文章称，这个故事由作者的司机讲给作者；司机并非文中明确的亲历者。它保留的是一个有关海边禁忌的传闻，而不是可独立证实的追逐事件。
  source_numbers:
  - 1
  - 2
  map_label: 文莱 · Meragang 海滩
  location_note: 坐标为 Meragang 海滩一处公开采样点，仅代表海滩区域，具体地点未记录。
case_bn_damuan_tutong_fresh_meat_2006:
  kind: legend
  paragraphs:
  - 一位文莱作者记得叔父说过，黄昏经过达慕安公园前的都东路时，车里最好不要带生肉，否则可能听见有人在咀嚼。这个提醒使普通的食物和一段熟悉的道路都染上了夜间禁忌的意味。
  - 作者还谈到自己见过附近车辆急转，却承认不知道司机为何转向。叔父的提醒和作者看到的事故是两种不同材料，无法据此断言事故与传闻有关。
  source_numbers:
  - 1
  - 2
  map_label: 文莱 · 达慕安一带
  location_note: 达慕安地区河道采样点仅作公园附近区域参考，不代表某次汽车经过位置。
case_bn_berambang_spinning_top_rock:
  kind: story
  paragraphs:
  - 文莱地方故事里，战士 Awang Semaun 与侄子在淡布隆的山上比赛转陀螺。轮到他时，两只陀螺撞在一起，其中一只竟飞出山地，在文莱河水面弹跳，最后倒落在 Berambang 岛边，旋转着变成一块大石。
  - 文莱旅游部门把这块陀螺石列入河流文化路线。这个故事用游戏与变化解释地貌；景点和有关它的传说可以共同阅读，不必把石头的形成经过当成可验证事实。
  source_numbers:
  - 1
  - 2
  map_label: 文莱河 · Berambang 岛
  location_note: 坐标取 Berambang 岛区域参考点；石头的确切位置和陀螺飞行路线不按传说绘制。
case_la_nabong_returned_jar_2000:
  kind: legend
  paragraphs:
  - 修水渠时，一名村民在南俄河边发现破损的大罐，里面还有一只完整的小罐。他把小罐洗净，带去万象市场卖掉，回来后却夜不能寐，相信自己受到 phii 的干扰。
  - 讲述里，他又去市场买回小罐，把它埋回最初发现的地方，此后才安心入睡。考古学者 Anna Karlström 说明，这不是发现者本人直接讲给她的经历，而是 2000 年当地调查时由其他村民转述的故事。
  source_numbers:
  - 1
  - 2
  map_label: 老挝万象府 · 纳蓬村
  location_note: 纳蓬村地图节点只表示访谈所述村庄范围，不是陶罐出土点或住址。
case_la_lao_pako_forest_voices_2003:
  kind: story
  paragraphs:
  - 在老挝南俄河边的一段地方叙述中，村民去林子里找食物时，听到像人说话的声音；走近一看，却找不到说话的人。人们于是把林地理解为灵体所在之处，并将其保留为安葬亡者的地方。
  - 2003 年，Nor Ountagok 询问附近长者后整理了这段故事，考古学者 Anna Källén 将之收入论文。研究把地方讲述、墓地记忆和考古材料并置，说明同一处河岸可以承载不同的过去。
  source_numbers:
  - 1
  map_label: 老挝 · Lao Pako 河岸
  location_note: 坐标为研究文献给出的 Lao Pako 遗址地区参考，并非故事中的具体树木或坟墓。
case_th_nakhon_phanom_sammati_river_2025:
  kind: legend
  paragraphs:
  - 湄公河边的那空帕侬有人向守护灵 Chao Pho Sammati 请求帮助，盼望找到落水亲人的遗体。一名居民向研究者讲述，亲属久久未能找到溺水的表亲，家人向守护灵供奉祈求后，才在不久后寻回遗体。
  - 研究者 Vatthana Pholsena 在考察跨河战争记忆时，也记录了当地对守护灵来历的其他版本。祈愿与寻获遗体之间在叙述中相连，不能单凭这一回忆认定因果；人们纪念亡者的方式则值得认真保存。
  source_numbers:
  - 1
  map_label: 泰国 · 那空帕侬市
  location_note: 那空帕侬市区参考点，非溺水位置或某一户家庭的所在地。
case_mm_pyin_oolwin_hotel_witness_2012:
  kind: legend
  paragraphs:
  - 花节期间，来自仰光的一家人好不容易找到一间旅馆平房。夜里，一名女子觉得有人不断从浴室走过床边，起初以为是亲人；天亮前家人交谈时，才发现彼此也记得脚步、敲墙声或难以动弹的片刻。
  - 2012 年《缅甸时报》刊出 Ma Phyo Phyo 对记者的讲述，并称这趟旅行发生在约三年前。报道保存了她和家人的回忆，但不能独立检验每个人当夜的感受，也不能仅凭叙述诊断睡眠状态。
  source_numbers:
  - 1
  map_label: 缅甸 · 彬乌伦
  location_note: 坐标为彬乌伦市区参考点，受访者未公开旅馆名称或房间位置。
case_my_alor_setar_giant_fence_1914:
  kind: legend
  paragraphs:
  - 一则家族讲述发生在黄昏：年轻女子坐在屋外的台阶上，看见篱笆外有个异常高大的人影。她想从正门进去，却发现门锁着，只好绕向侧门；沿篱笆移动的身影仿佛一直与她同行。
  - 她进入屋内再向外看时，身影已经不见。Haji Zain Tajudin 在 1991 年发表的英文转述中，把这件母亲讲给他的往事放在 1914 年亚罗士打，并称它是家中关于 hantu raya 的一个故事。
  source_numbers:
  - 1
  map_label: 马来西亚吉打 · 亚罗士打
  location_note: 亚罗士打城市参考点；文章没有提供祖母住宅的可核实街道坐标。
case_my_alor_setar_rain_follower_1943:
  kind: legend
  paragraphs:
  - 作者回忆 1943 年一个细雨的深夜，自己沿乡间道路独行，突然觉得颈后发冷。一道裹着白布的身影从路边林中出现，与他并肩前行，还不时侧过脸看他。
  - 他记起父亲教过的经文，低声念过后，身影便不见了。次日父亲将此解释为 hantu raya；这是一份由讲述者本人回忆、后经翻译发表的经历，不是对来者身份的证明。
  source_numbers:
  - 1
  map_label: 马来西亚吉打 · 亚罗士打
  location_note: 亚罗士打城市参考点；作者只说道路在祖母家另一侧，未给出道路名称。
case_my_alor_setar_bamboo_sand_prank_1938:
  kind: legend
  paragraphs:
  - 斋月的一天傍晚，男孩提着空饭盒回家，走近祖母院子旁的竹丛时，沙子接连打在身上。他大声呼救，哥哥跑出门来，顺着他指出的方向在树枝上发现一个矮小的轮廓。
  - 哥哥朝旁边故意投出石子，树上的邻家朋友立刻喊出自己名字，原来是一场恶作剧。讲述者将这件 1938 年往事与家族中的灵体故事一起发表，也留下了一次由人解释的虚惊。
  source_numbers:
  - 1
  map_label: 马来西亚吉打 · 亚罗士打
  location_note: 亚罗士打城市参考点，竹丛和祖母家的旧址无法由资料精确定位。
case_my_alor_setar_stone_knocking_1950:
  kind: history
  paragraphs:
  - 1950 年一则报纸转述说，亚罗士打附近一户人家接连听见墙壁和地板的敲击，并有人说看见石头飞来。消息传开后，好奇的村民前来观看，也请人主持驱除仪式。
  - 报道记下村民把声音与一名来访女孩联系起来的推测，但没有独立证明声音来源。保留这份历史报道的意义在于观察当时的解释与围观，不能据此指认女孩或认定超自然原因。
  source_numbers:
  - 1
  - 2
  map_label: 马来西亚吉打 · 亚罗士打地区
  location_note: 报道给出亚罗士打附近村名，城市坐标仅为区域参考，住宅和村名具体对应待核。
case_my_penang_western_road_picture_glass_1930:
  kind: history
  paragraphs:
  - 两名年轻人住进槟城一幢住宅后，报纸说他们两次在卧室发现画框的玻璃被取下，放在地板上；最终，两人决定搬走。厨工虽然觉得房子不寻常，仍表示主人若留下，他也会留下。
  - 1930 年报道还称，之前独居的住客曾在这里平静住了半年。画框如何被移动并未由可用材料查明；旧报采用了耸动的“鬼屋”写法，阅读时可以同时留意其叙事方式。
  source_numbers:
  - 1
  - 2
  map_label: 马来西亚槟城 · 乔治市
  location_note: 乔治市区域参考点；旧报只说住宅在 Western Road 近墓地，无法确定门牌。
case_my_sungai_way_sock_seller_2013:
  kind: legend
  paragraphs:
  - 双溪威流传的一种讲法里，一名戴着黑色面纱的老妇挨家卖袜子；人们说她脸上藏着可怖的变化，还给她编出了伤害少女的来历。关于这个人物，当地还有其他不同版本。
  - 2013 年访问中，一位在双溪威长大的居民否认自己见过鬼，并认为这些是人们编出的故事。可以阅读传闻如何把陌生访客变成恐惧对象，也应避免把故事投射到现实中的卖货者身上。
  source_numbers:
  - 1
  - 2
  map_label: 马来西亚雪兰莪 · 双溪威
  location_note: 坐标为双溪威社区参考点，不指向任何住宅或真实摊贩。
case_my_sabah_batu_tulug_coffin_visitor_2023:
  kind: legend
  paragraphs:
  - 沙巴一篇地方文章转述，三名旅人参观 Batu Tulug 的古代木棺洞穴时，其中一人试着抬起两只木棺。到了另一座城市的旅馆，他夜里醒来，觉得床被摇动，又看见两个高矮不同的身影。
  - 次日，旅人把夜间经历与此前触碰木棺联系起来，并返回洞穴外道歉。州旅游部门确认洞穴保存有历史木棺；地方网站所记经历大约在 2005 或 2006 年，2023 年为后来的电视传播时间。个人讲述不足以诊断或认定因果。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 马来西亚沙巴 · Batu Tulug 洞穴
  location_note: 坐标指墓葬洞穴一带；夜宿旅馆在另一城市且名称未公开，不应混作一处。
case_my_johor_petrie_perfume_bus_1956:
  kind: legend
  paragraphs:
  - 新山曾流传一名白衣女子在接近午夜时登上九号公交，身上带着浓烈香气。故事说她像普通乘客一样付钱落座，车经过墓地附近时，座位上却突然空了。
  - 1956 年《海峡时报》报道此传闻时，也询问了当地人与司机、售票员；报道说他们并未承认见过这位乘客。社会学论文将报纸剪报保存下来，让流言及当时的怀疑回应都能被阅读。
  source_numbers:
  - 1
  - 2
  map_label: 马来西亚柔佛 · 新山市
  location_note: 新山市区参考点；报道提及 Jalan Petrie 附近墓地，但没有给出可信的上车点或完整路线。
case_sg_nee_soon_returned_woman_1949:
  kind: history
  paragraphs:
  - 1949 年，Nee Soon 村流传一名女子从坟墓归来，重新回到丈夫身边，只是无法说话。传言传到其他村落后，许多人赶来打听，甚至向警局询问她的住处。
  - 《海峡时报》的报道说，警员按流言给出的线索前往调查，没有找到女子或她的丈夫。新加坡国立大学论文保存了这份剪报；它记录的是流言与回应，不能证明有任何人死而复生。
  source_numbers:
  - 1
  map_label: 新加坡 · 义顺地区
  location_note: 坐标是今日义顺地区参考点；1949 年旧村庄的具体住宅没有确证。
case_sg_woodlands_snack_auntie_sms_2009:
  kind: legend
  paragraphs:
  - 一则 2009 年在新加坡流传的短信提醒收件人，小心一位上门卖零食的年长女子；不同版本给她附会了恐怖的随从和威胁，并催促人们将提醒继续转发。
  - 新加坡国立大学论文转述了当年的报纸讨论：有人把它当作都市传说，也有人担心这种故事造成不必要的恐慌。短信里的地区名和人物形象不能证明有这样一位危险的人，更不应套到现实中的售货者身上。
  source_numbers:
  - 1
  map_label: 新加坡 · 兀兰地区
  location_note: 兀兰是流传短信中提及的地区之一，不表示传闻人物的住址或真实活动地点。
case_sg_pickering_shop_rumor_1954:
  kind: history
  paragraphs:
  - 1954 年，新加坡旧 Upper Pickering Street 的商户向当局要求降低租金，理由之一是公寓周围的鬼故事让顾客不敢前来。对商户来说，流言不仅发生在夜里，也进入了白天的生计与议价。
  - 《海峡时报》记下商户的说法；报纸能证明他们当时提出过这样的理由，却不能单独证明客流减少的原因或所谓鬼影存在。如今街区已发生变化，地图点只标旧街所在的大致范围。
  source_numbers:
  - 1
  map_label: 新加坡 · 芳林公园附近
  location_note: 坐标是旧 Upper Pickering Street 所在市中心区域参考点，并非某一商铺位置。
case_vn_hanoi_hang_trong_banyan_2012:
  kind: legend
  paragraphs:
  - 河内还剑湖附近一处旧屋的屋顶曾长出榕树，枝叶和气根垂下来。居民讲述中，有人从远处把树影看成一名长发女子，也有人说夜里听见女子哭泣；另一个版本为她编出等待丈夫归来的悲剧。
  - 2012 年报道同时记下旧屋被拆除后故事仍在传播的情形。树木、建筑变迁与关于女子的叙事需要分别核对；不同讲法的存在本身，已经展现了一座城市怎样记住消失的房子。
  source_numbers:
  - 1
  map_label: 越南河内 · 还剑湖西侧
  location_note: 坐标为还剑湖西侧街区参考点；旧屋已重建，不能作为现存建筑门牌的精确定位。
case_ba_vares_katarina_white_rider:
  kind: story
  paragraphs:
  - 山村里有人说，一位身披白衣、骑白马的陌生女子从林中来到牧人身边。她不只问路，还细问村里收成如何、家家是否有足够的冬粮，然后给孩子们留下糖果。
  - 另一则讲述把这位访客认作王后卡塔琳娜：她走进水磨坊，见到贫困的孩子，便每人赠一枚金币。不同村庄记住的是仙女、王后或善行，并没有共同的可核实目击地点。
  - 《波斯尼亚精神》2011 年文章汇集了瓦雷什周边传说和不同采集者的版本；王后的历史身份与仙女骑行故事属于不同性质的材料。
  source_numbers:
  - 1
  map_label: 波黑 · 瓦雷什地区
  location_note: 瓦雷什为数个受访村庄所在地区的参考点，并非故事中一处经过定位的现场。
case_ba_sarajevo_seven_brothers_wishes:
  kind: story
  paragraphs:
  - 萨拉热窝有一条关于心愿的地方说法：人们先到比斯特里克的七兄弟墓，再前往圣安多尼堂与方济各会修院，最后穿过河流去老东正教堂。回家时换一条路，仔细听路人说的第一句话，它或许能回应心中的疑问。
  - 这条路线把不同社群的礼拜空间连成城市中的步行记忆。资料介绍了人们如何讲述和体验这一习俗，但并不能验证心愿是否实现，也不能把它当成所有居民共同遵循的规则。
  source_numbers:
  - 1
  map_label: 波黑 · 萨拉热窝
  location_note: 萨拉热窝市中心参考点；许愿路线包含三处不同地点，不表示墓所精确坐标。
case_rs_strelac_vampire_fieldwork_2003:
  kind: legend
  paragraphs:
  - 在塞尔维亚东南部斯特雷拉茨村，研究者记录到人们讲述一种会在夜里扰动家人和牲畜的吸血鬼。村民说，它可能发出响声、跳到亲属背上；有人主张转身面对它，把它做过的事说出来。
  - 在这些说法里，疾病与家人照料也常被提起：有受访者认为，病人受到忽视会带来日后的纠缠。研究者于 2003 年田野访问后刊文，论文摘要呈现的是村民的解释，不是对超自然成因的证实。
  source_numbers:
  - 1
  - 2
  map_label: 塞尔维亚 · 斯特雷拉茨村
  location_note: 地图使用村庄参考点；受访家庭和叙事中的住宅未定位。
case_pl_warsaw_black_volga_rumor:
  kind: legend
  paragraphs:
  - 传闻中的黑色伏尔加车开得很慢，司机会向路人问路或问时间，然后突然把人带走。有人说司机是神职人员，也有人说是魔鬼；最令人担忧的版本把儿童说成目标。
  - 故事后来又加进车内抽血等细节。波兰亚当·密茨凯维奇研究所介绍了这一都市传说及其流传版本，也提到研究者对真实绑架报道与传闻形成关系的一种解释；车内设备与超自然司机并无由此得到的证据。
  source_numbers:
  - 1
  map_label: 波兰 · 华沙
  location_note: 华沙市区参考点；这类说法在多处流传，不对应某一辆车或可核实的街口。
case_pl_warsaw_palace_hidden_station:
  kind: legend
  paragraphs:
  - 华沙文化科学宫建成后，关于地下室的说法不断增加：有人说那里有通向党政建筑的秘密通道，有人讲成连接中央火车站的地下车站。
  - 另一种更沉重的传闻把施工中死去的工人说成被埋进墙内。Culture.pl 介绍这些说法时明确指出，地下秘密车站和埋墙情节并不属实；施工死亡与后来附着其上的故事应分别辨认。
  source_numbers:
  - 1
  map_label: 波兰 · 华沙市中心
  location_note: 华沙市中心参考点，不标示建筑内部无法核对的通道。
case_pl_warsaw_czerniakow_lake_ufo_1982:
  kind: legend
  paragraphs:
  - 一篇关于华沙都市传闻的文章转述，1982 年秋天，一名男子与儿子在切尔尼亚库夫湖附近看到橙色光和形状奇异的物体。这个故事后来被列入当地不明飞行物传闻。
  - 文章说，消息经由不明飞行物研究者转述，原讲述者没有公开身份；它也提醒读者不要把叙述本身当成外星来访的证明。湖边的电厂和夜间城市景观，是理解这个版本传播环境的背景。
  source_numbers:
  - 1
  map_label: 波兰 · 华沙切尔尼亚库夫湖地区
  location_note: 使用湖区附近参考点；资料仅称湖的北侧，不代表目击者所站的准确位置。
case_pl_wegrow_twardowski_mirror:
  kind: story
  paragraphs:
  - 波兰关于术士特瓦尔多夫斯基的许多故事里，他曾借镜子为思念亡妻的国王召见逝者。民间传说还说，他与魔鬼交换了知识和法术。
  - 文格鲁夫教堂保存一面被称为他的镜子的金属镜。研究资料介绍，这面镜子的制作时间尚不明确，镜框可能制作于十八世纪；实物存在，并不证明传说中的召魂发生过。
  source_numbers:
  - 1
  map_label: 波兰 · 文格鲁夫
  location_note: 文格鲁夫镇区参考点；坐标不对应镜子所在室内位置。
case_pl_liw_yellow_lady_ring:
  kind: story
  paragraphs:
  - 传说城堡主人赠给妻子一枚戒指，戒指不见后他又补送一枚，第二枚也消失了。主人听信旁人的猜疑，将妻子视为背叛者并下令处死。
  - 后来，人们在喜鹊巢中发现两枚戒指。故事说，悔恨的丈夫无法挽回妻子，而她的身影仍穿着黄色衣裙在城堡中徘徊。这是地方叙事的情节，人物遭遇与鬼魂现身没有被此文独立证实。
  source_numbers:
  - 1
  map_label: 波兰 · 利夫地区
  location_note: 利夫地区参考点，不代表故事里建筑内的具体房间。
case_pl_plock_wodnica_star_necklace:
  kind: story
  paragraphs:
  - 一位年轻渔夫在维斯瓦河岸遇见美丽女子，向她求婚。女子答应，却先后要求琥珀项链、珍珠项链，最后又提出要一串天上的星星。
  - 渔夫说自己无法摘下星辰，女子于是显露另一副可怖面貌，在水里掀起怒涛，河岸一角坍落。Culture.pl 将它介绍为普沃茨克地方水灵传说的一种版本，而非一次地貌事件记录。
  source_numbers:
  - 1
  map_label: 波兰 · 普沃茨克
  location_note: 普沃茨克市区作为故事流传地参考；维斯瓦河畔具体河段未定位。
case_bo_lapaz_jaen_green_cross_widow:
  kind: legend
  paragraphs:
  - 拉巴斯的哈恩街有一座绿色十字，周围流传着不同解释。有人说它是为了让徘徊的亡灵安息，有人说是为了阻止一位没有脚、穿着长裙的寡妇拦住独行男子。
  - 2023 年记者访问街区时，居民和警员讲述了脚步、金属声与旧人物身影的不同版本；其中也有人明确表示自己没有见过，只听过转述。真实街道与当地口述是可查资料，鬼魂和传说中的伤亡仍是未经证实的叙事。
  source_numbers:
  - 1
  - 2
  map_label: 玻利维亚 · 拉巴斯市中心
  location_note: 拉巴斯市中心参考点；街上各版本对应的位置不完全一致。
case_bo_lapaz_pura_pura_duende_house:
  kind: legend
  paragraphs:
  - 普拉普拉树林附近留有旧铁路设施。一座被称作“小精灵屋”的建筑曾与煤炭和苗木储存有关，如今人们把它与小个子精灵和夜间奇遇联系起来。
  - 2025 年一篇本地报道采访历史研究者，转述了精灵名称与一名自称发现小人者的故事。废弃建筑及其用途有地方资料可查，精灵现身和商业吉凶则是传闻中的解释。
  source_numbers:
  - 1
  - 2
  map_label: 玻利维亚 · 拉巴斯
  location_note: 拉巴斯市区参考点；不把具体建筑或可能的私人活动空间标为精确坐标。
case_bo_lapaz_choqueyapu_gold_hermit:
  kind: story
  paragraphs:
  - 河边传说有位独居者，平时用金沙换取生活所需。等他病倒，一群人来到住处寻找财富，只有两个孤儿留下照料他，后来被他收为孩子。
  - 故事说，地下室藏着守卫般排列的古老遗骸与许多黄金。贪婪的村人最终为了财物互相争斗，而隐士带着孩子离开。玻利维亚通讯社转载的这个版本保留了完整情节；它不证明河边存在这样的宝库。
  source_numbers:
  - 1
  map_label: 玻利维亚 · 拉巴斯地区
  location_note: 拉巴斯市区参考点；隐士住处和传说中的地下室没有可核地点。
case_cl_chiloe_pincoya_shellfish:
  kind: story
  paragraphs:
  - 奇洛埃的一种说法里，海灵平科亚与伴侣平科伊照看近岸鱼贝。她面朝大海，在沙地上播撒贝类时，意味着那片水域会有丰收；若她转向内陆，贝类则可能变得稀少。
  - 同一份采录还说，过于频繁地在同一处捕捞会让她离开。这个版本把海边生计、资源起伏与对海灵的敬重连在一起；它是文化叙事，不能直接作为渔业变化的测量结果。
  source_numbers:
  - 1
  - 2
  map_label: 智利 · 奇洛埃群岛
  location_note: 群岛地区参考点；故事没有指向一处可核实的海滩。
case_br_auati_parana_curupira_whistle:
  kind: story
  paragraphs:
  - 奥阿蒂—巴拉那保护区的地方材料说，森林中的库鲁皮拉守护猎物，夜里可能出现在水边。更多时候，人们听到的只是哨声；循着声音走，猎人就可能离开熟悉的道路。
  - 巴西保护区管理计划把这一讲述放在当地人的交谈、劳作与跨代记忆中。它与其他地方的库鲁皮拉版本有相似处，也各有不同，不宜把所有亚马孙社群说成只有一种故事。
  source_numbers:
  - 1
  - 2
  map_label: 巴西 · 奥阿蒂—巴拉那保护区地区
  location_note: 亚马孙州保护区的粗略区域参考，不标示任何具体社区或溪流；保护区横跨较大范围。
case_ls_sehlabathebe_water_serpent_mist:
  kind: legend
  paragraphs:
  - 在莱索托东部的山地与深潭旁，一些巴索托讲述者把水蛇与泉水、云雾和降雨联系起来。有人说，山顶聚起的雾意味着水蛇正在移动，或表达它的不悦。
  - 联合国教科文组织资料保留了当地受访者关于水潭、雾和保护水源植被的说法，也记录大型水利工程如何引起对河流的讨论。这里呈现的是有具体语境的信仰与记忆，并不把雾或风暴归因于水蛇。
  source_numbers:
  - 1
  - 2
  map_label: 莱索托 · 塞赫拉巴特贝国家公园地区
  location_note: 国家公园范围的中心参考点，不代表特定水潭或受访者住处。
case_nz_wairoa_hine_korako_waterfall:
  kind: story
  paragraphs:
  - 毛利传统中的水灵希内科拉科曾与人结为伴侣，受到亲属冒犯后离开，来到特雷因加瀑布一带。她与当地人之间的联系并没有因此终止。
  - 一个版本说，河水暴涨时，一条独木舟险些被冲向瀑布，她挡住船并救了船上旅人。新西兰百科全书将其作为塔尼瓦既可能令人畏惧、也可能守护人的例子；这一传统对不同社群有各自的意义。
  source_numbers:
  - 1
  map_label: 新西兰 · 怀罗阿地区
  location_note: 怀罗阿地区参考点；特雷因加瀑布在更广的河流区域，并非此坐标处。

case_cn_dict4_hangzhou_bao_hell:
  kind: story
  paragraphs:
  - 杭州流传的故事说，包龙图死后在阴间主持第一殿。他访查冤案，把不该受罚的人放回阳间，做法与其他殿的审判方式大不相同。
  - 其余阎王联名向玉帝告状，他因此被调到第五殿。新职位有名无实，即便看出冤情也难以改变判决；辞典用这个故事解释屈死鬼的出现。
  source_numbers:
  - 1
  - 2
  map_label: 浙江杭州
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_hangzhou_farmer_waterghost:
  kind: story
  paragraphs:
  - 一名农夫夜里车水时，水中的鬼劝他下水。他识破对方想找替身，拆开水车龙头，令对方的打算落空；次日又阻止一个孩子下水捞伞。
  - 鬼随后往他的田里堆石头报复，农夫反过来骗它清掉石块、丢入旧草鞋等杂物。次年莲子收成很好，故事以一场人鬼之间的机智较量收尾。
  source_numbers:
  - 1
  - 2
  map_label: 浙江杭州
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_hangzhou_peddler_firecracker:
  kind: story
  paragraphs:
  - 货郎见一位媳妇打碎了碗，担心她遭丈夫责打，便替她赔了钱。几天后他才知道，媳妇原是鬼准备找的替身；那鬼因此对他十分恼怒。
  - 鬼现出可怖模样，要货郎跟它走。货郎却说要替它梳妆，悄悄把一串爆竹挂到头发上点燃；连串响声使鬼惊慌逃离。
  source_numbers:
  - 1
  - 2
  map_label: 浙江杭州
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_boli_pharmacy_well:
  kind: story
  paragraphs:
  - 完达山下的小镇有间药店，经常传出闹鬼的消息。店主把店租给宋先生，他搬进去的第一夜，先后听见称药器具坠地、药臼作响，随后又听到女子哭声。
  - 故事解释，女子是店主的亡妻；宋先生说出“井水不把河水犯”后，动静便停了。辞典把它作为勃利流传的鬼话收录，没有给出可核对的店址。
  source_numbers:
  - 1
  - 2
  map_label: 黑龙江勃利
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_yangyuan_woman_revenge:
  kind: story
  paragraphs:
  - 阳原流传的故事里，一名常骚扰妇女的男子深夜遇见女子，起了歹意。女子忽然变成吊死鬼的模样；男子用自己知道的办法制住她，并把她带回家。
  - 她在人形与鬼形间反复变化，男子只好请人驱除；当晚男子突然身亡。故事结尾说，女子生前曾受他欺侮而死，此次是来寻仇。
  source_numbers:
  - 1
  - 2
  map_label: 河北阳原
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_qiandongnan_burial_dream:
  kind: story
  paragraphs:
  - 黔东南一则故事讲，一位地主为了给自己选墓地，听从阴阳先生的建议，与管家以欺骗手段掳来两个孩子，将他们活埋，并害死孩子的父母。
  - 此后地主时常梦见遭狗咬、被鹰啄，管家的脚伤也不断恶化。故事把两人最终死亡写作受害者冤魂的报复；辞典仅标明故事流传于黔东南。
  source_numbers:
  - 1
  - 2
  map_label: 贵州黔东南
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。采用自治州州府凯里作为宽范围代表点；辞典只写“黔东南”，未指明所在县市。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_zoucheng_yuhong_gate:
  kind: story
  paragraphs:
  - 邹县故事中的玉红被豪绅害死，父母求告无门。她向阴间申冤后，奉命去找害她的人，却先被宅门上的两位门神挡在门外。
  - 玉红向门神说明遭遇，秦琼同意放行，尉迟恭也最终让开。她进入宅院带走仇人的魂魄；故事用门神的犹豫与选择表现对冤情的判断。
  source_numbers:
  - 1
  - 2
  map_label: 山东邹城
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。辞典用旧名邹县，此处以今邹城作参考。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_linzhou_bullhorse_banquet:
  kind: story
  paragraphs:
  - 林县的一则传说里，牛大臣听算命人说儿子寿数将尽，依照指点与妻子来到一座庙。他们遇到正在下棋的牛头、马面，带来的饭菜成了请求添寿的契机。
  - 两位阴差吃过饭后答应延长儿子的寿数，也收了纸钱。阎王知道后将他们降为黑无常的下属；故事借阴间差役讲述人情、贿赂和处罚。
  source_numbers:
  - 1
  - 2
  map_label: 河南林州
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。辞典用旧名林县，此处以今林州作参考。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_lingbi_flatbread_ghost:
  kind: story
  paragraphs:
  - 灵璧故事中，卖烧饼的王老伯发现一名女子拿纸钱买饼，便悄悄跟随。女子在一座坟旁消失，那座坟属于王二已故的妻子。
  - 王二得知后带人打开坟墓，发现一个孩子并抱回家。故事说亡妻因失去孩子不断在村中呼喊，王老伯捏了个面人，叫喊声才平息。
  source_numbers:
  - 1
  - 2
  map_label: 安徽灵璧
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_cixi_pawn_ghost:
  kind: story
  paragraphs:
  - 灾荒中，张三捉住一只吊死鬼，鬼化成能叫能跳的葫芦。他把葫芦送到当铺换银钱，并将所得分给生活困苦的人。
  - 当铺老板玩弄葫芦时不慎让鬼逃脱，张三早有准备，又向老板索赔，把得到的钱继续分给百姓。辞典用这则奇诡故事写出灾荒与反转。
  source_numbers:
  - 1
  - 2
  map_label: 浙江慈溪
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_zhangjiakou_ghost_mutton:
  kind: story
  paragraphs:
  - 张家口故事中的大胆李夜走深巷，碰上吊颈鬼。他假称自己也是新鬼，与对方同行，随后救下鬼想找作替身的一位年轻妇女。
  - 接着他用计使鬼变作一头肥羊，卖给肉铺老板。老板发现上当时，肉铺已经臭气熏天，再也无人光顾；故事把救人和惩治奸商连在一起。
  source_numbers:
  - 1
  - 2
  map_label: 河北张家口
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_shengzhou_butcher:
  kind: story
  paragraphs:
  - 嵊县传说里，一名屠夫在桥头遇到女鬼，听她说准备去找替身，便跟了过去。他发现一对婆媳正为项链争执，上前解释并平息了争吵。
  - 女鬼因计划落空，次日找屠夫报复，接连变出可怕的模样。屠夫没有退缩，最终用刀制住她；辞典把这则斗智故事标为嵊县流传。
  source_numbers:
  - 1
  - 2
  map_label: 浙江嵊州
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。辞典用旧名嵊县，此处以今嵊州作参考。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_jiaxian_slope_helper:
  kind: story
  paragraphs:
  - 郏县流传的故事里，一位寡妇死后仍常在村后坡路帮助行人，替人推车、帮人挑担，因此走坡的人觉得格外轻松。
  - 有一次她打翻油罐，提醒歇脚的卖菜老人留意旁边心怀恶意的人；另一次她化作灯光，引领负气离家的妇人返回。辞典将这些情节归于“菩萨坡”的善鬼传说。
  source_numbers:
  - 1
  - 2
  map_label: 河南郏县
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_jianhu_soldier_rebirth:
  kind: story
  paragraphs:
  - 建湖故事中的杨定国战死后并未察觉，仍走到友人家中。家里人都不理睬他，他因受冷落而吃掉厨房的菜，随后被道士收进瓶子。
  - 瓶子破裂后，他来到阎王面前请求重新做人。阎王让他先经历其他生命形态，见他仍做善事，最后答应他的请求。
  source_numbers:
  - 1
  - 2
  map_label: 江苏建湖
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_dengzhou_gambling_ghosts:
  kind: story
  paragraphs:
  - 邓县故事说，王大虎嗜赌，输光家产后又在夜路上被人邀去赌钱。起初他连连取胜，愈发得意，投注也越下越大。
  - 之后他不断输钱，连父亲留下的积蓄也输了。赌友这时现出鬼的身份，说受他亡妻之托劝他改过；故事最终让王大虎回到农活中。
  source_numbers:
  - 1
  - 2
  map_label: 河南邓州
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。辞典用旧名邓县，此处以今邓州作参考。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_zhangjiakou_liver_gambling:
  kind: story
  paragraphs:
  - 一名赌徒在除夕赊了一副羊肝回家，路上又遇到一群人赌博。他随口开玩笑说自己提着“鬼肝”，对方闻言一哄而散，留下的钱被他带回去。
  - 妻子看出那些钱是冥钱，他才明白刚才遇见的是故事中的赌鬼。辞典以这个荒诞结尾写他从此戒赌，标明故事流传于张家口。
  source_numbers:
  - 1
  - 2
  map_label: 河北张家口
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_sheqi_hungry_rebirth:
  kind: story
  paragraphs:
  - 社旗的故事中，一个饿死鬼不愿再做人挨饿，想投生成猪，却又不愿面对猪的食物与遭屠宰的命运。判官最终安排他投生到富裕人家。
  - 他虽衣食无忧，却挥霍家产，最后仍然挨饿而死。回到阴间后，他质问财神为何不帮忙；财神回答，他自己什么也不愿做。
  source_numbers:
  - 1
  - 2
  map_label: 河南社旗
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_xixian_helping_spouse:
  kind: story
  paragraphs:
  - 息县故事中，王翠花生子时去世，丈夫任老七独自操持家庭。一天他劳作归来，发现原本要给孩子做的饭已准备妥当，却不知是谁帮忙。
  - 故事说是翠花死后回来照料家务。任老七起初害怕，转而与人赌博并渐渐沉迷；她跟到赌桌旁劝他改过，此后家里的日子才慢慢好转。
  source_numbers:
  - 1
  - 2
  map_label: 河南息县
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_lixian_guiguzi_birth:
  kind: story
  paragraphs:
  - 澧县传说里，王金花外出时误吞一颗稻粒而怀孕，受到家人责难，死后在墓中生下孩子。故事说她化为人形出门买东西，设法照料婴儿。
  - 她拿随葬的衣物去换物品时被熟人认出，父亲才派人找到孩子并带回抚养。孩子因与谷粒有关，被称为鬼谷子；这是其出生的传说版本。
  source_numbers:
  - 1
  - 2
  map_label: 湖南澧县
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_gongyi_bao_bridge:
  kind: story
  paragraphs:
  - 巩县故事中，寺里恶僧横行，冤魂托梦向包公求助。包公微服前往，却反被暗算，幸得王朝、马汉等人及时相救。
  - 恶僧被处死后，鬼魂仍来纠缠。包公提出若众鬼能在一夜造好桥便交出性命，随后用半夜鸡鸣之计使造桥未能完成。
  source_numbers:
  - 1
  - 2
  map_label: 河南巩义
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。辞典用旧名巩县，此处以今巩义作参考。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_yanling_scholar_couplet:
  kind: story
  paragraphs:
  - 酃县流传的故事说，才学自负的张秀才答不出渔夫给的上联，含愧而死，死后仍因这副对联哭泣。
  - 一位来当地做工的木匠听说后，过了一天便用螺、蚌与团鱼对出下联。秀才的哭声就此停歇；故事让识字的秀才与熟悉日常物类的木匠形成对照。
  source_numbers:
  - 1
  - 2
  map_label: 湖南炎陵
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。辞典用旧名酃县，此处以今炎陵作参考。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_jingxian_looking_for_mother:
  kind: story
  paragraphs:
  - 景县传说里，王云龙和王香即将成婚，王香先后失去母亲和自己的生命。故事又说恶鬼接着伤害云龙的母亲，云龙虽有防备，也没能阻止。
  - 王云龙悲愤中与恶鬼争斗，最终战胜对方；随后因思念母亲而化为望母台。辞典把它作为地名来历的地方讲述，没有提供可定位的台址。
  source_numbers:
  - 1
  - 2
  map_label: 河北景县
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_dongshan_wedding_guanyu:
  kind: story
  paragraphs:
  - 东山流传的传说说，过去每逢新婚夜都有恶鬼来扰乱婚房，赶走新郎。有对新人结婚时，母亲送来一幅关公画像，嘱咐他们悬挂在屋里。
  - 夜里恶鬼再次出现，画像中的关公活过来将它驱除。故事以此解释在屋内悬挂关公像的习惯；这一解释属于所记传说。
  source_numbers:
  - 1
  - 2
  map_label: 福建东山
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_suixian_sorghum_board:
  kind: story
  paragraphs:
  - 睢县故事中的张大力新婚后路过高粱地，把一只鬼背回家。故事说，妻子此后被鬼缠扰，他于是向巫婆请教应对方法。
  - 得到鬼怕天明的说法后，张大力再去高粱地，将两只鬼背到天亮。它们化成棺木，他把木头劈开烧掉，妻子随后恢复；这是辞典记录的一则鬼话。
  source_numbers:
  - 1
  - 2
  map_label: 河南睢县
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_qihe_wang_underworld:
  kind: story
  paragraphs:
  - 齐河故事里的王二小跟能往返阴间的大爷一同出游，看到那里热闹得像阳间。好奇的他跟着一支迎亲队伍走，结果与新娘一道误投到猪圈。
  - 大爷找不到他，四处打听后回阳间寻找，认定一头不吃食的小猪就是侄儿。故事以两人在阴间再次见面结束这次荒诞的游历。
  source_numbers:
  - 1
  - 2
  map_label: 山东齐河
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_dujiangyan_skull_inn:
  kind: story
  paragraphs:
  - 灌县故事中，卖草帽的王安遇到一名女子，随她进入住处。同行的张长三察觉异常，多次提醒，王安虽有疑虑，却没有听从。
  - 故事说女子夜里吸了王安的血后离开。天亮后两人设计追赶，女子逃入乱石旁便不见了，那里只剩一具棺木和骷髅，王安这才醒悟。
  source_numbers:
  - 1
  - 2
  map_label: 四川都江堰
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。辞典用旧名灌县，此处以今都江堰作参考。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_datong_rope_ghost:
  kind: story
  paragraphs:
  - 大同故事里，一人夜里捡到一段腐朽麻绳，随后发现本家嫂嫂正试图上吊，却始终没有成功。他将这两件事联系起来，认为绳子与吊死鬼有关。
  - 回家后有女子出现索还麻绳，得不到便变出鬼脸。那人将墨涂在脸上呵斥她，故事说鬼因惧怕墨所代表的圣人而退走。
  source_numbers:
  - 1
  - 2
  map_label: 山西大同
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_dict4_pingdu_redhaired_ghost:
  kind: story
  paragraphs:
  - 平度故事里的木匠贡生夜间回家，走过树林时见一名白衣女子。他询问却得不到回答，怀疑对方是鬼，便抡起手里的木棍。
  - 女子露出红发和可怖面貌，却始终近不了他的身；故事解释那根棍子可以避邪。贡生回村招人来看时只见地上红色痕迹，不久他病逝。
  source_numbers:
  - 1
  - 2
  map_label: 山东平度
  location_note: 地图仅为辞典所记流传地区的市县或州府代表点，不能当作故事中事件、住址或场所的确切位置。 “当代鬼话”是辞典栏目名称，具体发生或采录年份未注明。
case_cn_wugu_kunming_hospital_moth:
  kind: report
  paragraphs:
  - 邓启耀回忆童年生活在昆明近郊；一次生病住进郊区医院，天黑后，一只大蛾飞进病房。孩子们躲进被子，几位大人找来扫帚和衣物围捕，后来把蛾捉住烧掉。
  - 作者把这一幕与成长时听到的“鬼蝴蝶”故事并置：在一些长辈的讲述里，大蛾与孩子生病被联系起来。这是作者对当年场景和地方说法的回忆，无法由此判断患者病因或蛾类种类。
  source_numbers:
  - 1
  map_label: 云南昆明
  location_note: 作者同时回忆童年昆明住处与郊区医院；医院确切地点未明。地图以昆明作为叙述语境参考，不是医院定位。
case_cn_wugu_ninglang_forest_cloth:
  kind: report
  paragraphs:
  - 一次绕泸沽湖的田野行走中，邓启耀看见山口树枝上系着旧布条。有人告诉他，在当地一些人的解释里，这类旧衣布条与送走病中不祥的仪式有关。
  - 山口也有关于路边遗物的告诫：不要随手将不明来历的物品带回家。作者记录的是当时听到的解释和顾虑，并不能据此概括湖区所有家庭的信仰或辨认任何人。
  source_numbers:
  - 1
  map_label: 云南宁蒗县城参考点
  location_note: 地图以云南宁蒗县城作所在县参考点；泸沽湖跨滇川两省，书中山口与系布树木未作精确定位。
case_cn_wugu_weishan_paperhorse_interview_2009:
  kind: report
  paragraphs:
  - 2009 年，邓启耀在巍山古城访问一间纸扎店，向店主请教纸马的用途。店主夫妇一张张解释，有些图样不愿随意卖出，担心买者不了解使用场合。
  - 作者随后记录当地关于“顺甲马”和“倒甲马”的区别：人物与马的前后位置不同，在叙述中的用途也不同。这次访谈让物件进入了具体的售卖与传承场景；店主的解释不应替所有使用者发言。
  source_numbers:
  - 1
  map_label: 云南巍山
  location_note: 点位为巍山县城参考，不是受访纸扎店的位置；2009 年为书中访谈年份。
case_cn_wugu_dali_three_lady_dragon:
  kind: story
  paragraphs:
  - 书中转述大理地方传说：观音与三姑娘娘各司其职，而三姑娘娘与“五方飞龙”相关，有的纸马还以带翅的形象描绘她。人们也称她飞龙娘娘。
  - 在书中收录的不同纸马图样里，同一称呼所对应的形象并不完全一样。把人物的亲缘讲法与纸上形象并读，可以看到地方信仰如何借叙事和图像被讲述。
  source_numbers:
  - 1
  map_label: 云南大理
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_dali_zhou_cheng_hougong:
  kind: story
  paragraphs:
  - 邓启耀记录一位白族村民对大理周城旧庙的回忆：庙里所见的后宫娘娘像坐在飞龙之上，脚下还有虎形，帽饰则带着动物或虫的图案。
  - 作者另转述地方传说：后宫娘娘经历改变后，转而管理相关灵物。神像的样子、故事中的转变与作者的解释属于不同层次；书中回忆不能确定旧庙现状。
  source_numbers:
  - 1
  map_label: 云南大理
  location_note: 地图以大理市城区为区域参考，不指示书中所说旧庙或访谈者住址。
case_cn_wugu_weishan_soul_horses:
  kind: story
  paragraphs:
  - 书中介绍，云南巍山有一套与叫魂有关的纸马：灶君、山神、土主、门神、桥神以及水火二神，各自守着人们想象中魂魄可能经过的地方。
  - 从灶边、门口到桥路，这些纸马把家与外部世界连成一条可以被呼唤的路线。书中还配有腾冲和大理的纸马图，不能把所有配图都归为巍山的套符。
  source_numbers:
  - 1
  map_label: 云南巍山
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_wanding_bridge_soul:
  kind: story
  paragraphs:
  - 邓启耀介绍云南畹町的叫魂纸符时提到，不同情形会配不同的纸马，其中桥路二神与人们想象中魂魄经过的路途相连。
  - 书中将叫魂、甲马与草甲等纸符放在不同语境下说明。桥与路在这里既是可见的交通空间，也是叙事中为归来留出的道路；各处传统不一定相同。
  source_numbers:
  - 1
  map_label: 云南瑞丽市区参考点
  location_note: 地图以瑞丽市区作所在市参考点，畹町的仪式地点及具体桥梁未定位。
case_cn_wugu_lanping_stove_call:
  kind: story
  paragraphs:
  - 书中介绍云南兰坪、维西的一些叫魂叙述：家人会在灶边点灯，请灶君帮忙寻找孩子的魂，呼唤它穿过山路、风雨后回家。
  - 这段祝愿把厨房变成亲人共同等待的地方。它是书中所记的地方叙述与仪式语言，不能代替对孩子身体不适的医疗判断。
  source_numbers:
  - 1
  map_label: 云南兰坪县城
  location_note: 点位为兰坪县城参考；书中同时提及维西，无法据此定位一户家庭或一次祭祀。
case_cn_wugu_yuanjiang_wood_leg:
  kind: story
  paragraphs:
  - 邓启耀引清代《滇南新语》中的一则简短异闻：有人声称元江一带的过客会被悄悄换上一条木腿，必须交出财物，才有机会恢复。
  - 故事把行旅途中失去身体自主权的恐惧与敲诈联系起来。它是清人所记传闻，原文没有提供可核验的受害者或具体地点。
  source_numbers:
  - 1
  map_label: 云南元江县城
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_changshu_roof_papers:
  kind: story
  paragraphs:
  - 《夷坚志》讲，常熟一座新宅落成后，主人接连梦见七个白衣人从屋脊下来。不久他生病，家人拆瓦察看，在屋顶发现了七个纸人。
  - 故事把纸人归于不满工钱的泥瓦匠，随后众工匠遭到官府惩处。邓启耀引用此事讨论房屋、工钱与工匠传说；梦境和因果属于笔记叙事，不能据此认定真实案情。
  source_numbers:
  - 1
  - 2
  map_label: 江苏常熟
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_weishan_city_dragon_temple:
  kind: story
  paragraphs:
  - 有关巍山古城的地方故事，把城门朝向、山形和楼台高低联系起来：有的讲建城者为了改变山势带来的影响，调整城门与街道的布局。
  - 另一则故事说，一位地方官担心山上的所谓“蛇头穴”，便借修龙王庙改变风水。邓启耀援引地方文史材料讲述这些说法；它们是理解古城的地方叙事，不等于城市设计原因已被证实。
  source_numbers:
  - 1
  map_label: 云南巍山
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_panyu_tree_tiger_2019:
  kind: report
  paragraphs:
  - 邓启耀在书中记述广东一处庙旁的榕树与石虎：有人在树前上香、供果，也有人将纸张贴在树上，祈求减少是非。
  - 书中 2019 年番禺照片显示，石虎嘴边放有馒头，树上贴着“小人纸”。这是作者记录的具体场景，不能推定每座榕树或每次祭拜都有同样意义。
  source_numbers:
  - 1
  map_label: 广东广州番禺区
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_dongguan_shaoshu_village:
  kind: report
  paragraphs:
  - 书中收入的田野记录说，东莞漳澎村有人在土地宫做“烧除”，为处理心中感受到的是非与困扰。所谓“小人”，在这份记录中也可以是一个模糊的称呼，而非指定某人。
  - 参与者会准备米、雪梨、荸荠和纸制物件；讲述者解释了其中的谐音和象征意义。书中注明这一段调查由研究团队成员在 2013—2019 年间完成。
  source_numbers:
  - 1
  - 2
  map_label: 广东东莞市区参考点
  location_note: 地图取东莞市区作城市参考，土地宫和参与者住址均未定位；书中调查时间范围为 2013—2019 年。
case_cn_wugu_guandu_new_year_shoes_2003:
  kind: report
  paragraphs:
  - 书中写到，过年时家人准备新鞋，穿鞋的动作被赋予“踩去小人”的象征。对一些人来说，它把过年换新的日常动作与对新一年顺遂的期待连在一起。
  - 作者配有一张 2003 年摄于昆明官渡年货摊的照片。照片记录一处市场场景，不能证明每个买鞋的人都认同同一种解释。
  source_numbers:
  - 1
  map_label: 云南昆明官渡区
  location_note: 地图为昆明官渡区参考点，照片中的具体摊位未定位；2003 年是图注所记拍摄年。
case_cn_wugu_chengjiang_guansuo_1991:
  kind: report
  paragraphs:
  - 邓启耀在讨论节庆驱逐表演时列出澄江关索戏，书中留下一张 1991 年拍摄的图像。戴面具的戏曲人物，把表演、地方节日与仪式场景联系在一起。
  - 澄江市的文化资料介绍，小屯村关索戏以三国故事为题材，锣鼓带动唱白，表演前另有仪式。政府资料说明的是剧种，并不替代书中照片的具体时间与地点。
  source_numbers:
  - 1
  - 2
  map_label: 云南澄江
  location_note: 地图为澄江市区参考点，不是书中照片的拍摄位置；1991 年为图注所记拍摄年。
case_cn_wugu_huaning_huadeng_troupe_2002:
  kind: report
  paragraphs:
  - 书中记下一幅 2002 年云南华宁的照片：春节期间，村里请来农民花灯戏班，夜间演戏，白天走访人家，将表演与祈求吉祥的活动连在一起。
  - 同一支队伍在白天与夜晚承担不同的角色，留下节庆现场的层次。书中的图注是一次拍摄记录，不能代表华宁所有戏班的演出方式。
  source_numbers:
  - 1
  - 2
  map_label: 云南华宁县城
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_shuangbai_tiger_1991:
  kind: report
  paragraphs:
  - 邓启耀在书中提及云南双柏的“跳老虎”，并配有 1991 年拍摄的图像：参与者化作虎的形象，进入节庆中的集体表演。
  - 作者将这一活动放在讨论地方驱逐性节俗的章节里。虎形、舞蹈和特定仪式的含义需要结合各场表演来理解，不宜把一种解释套到所有社区。
  source_numbers:
  - 1
  map_label: 云南双柏县城
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_puning_yingge_2014:
  kind: report
  paragraphs:
  - 书中用一张 2014 年普宁英歌照片，展示地方节庆里以人物造型和动作构成的队伍。节日中的表演既能成为地方记忆，也会因场合和队伍而有不同变化。
  - 文化和旅游部的项目介绍把普宁英歌描述为融合戏剧、舞蹈与武术的地方舞蹈。照片记录的是一个时点，不能说明该种表演的全部起源。
  source_numbers:
  - 1
  - 2
  map_label: 广东普宁市区
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_shijiazhuang_lions_dispute_1993:
  kind: history
  paragraphs:
  - 邓启耀转述一篇关于石家庄街头石狮的报刊材料：有人认为门前石狮是店面的装饰，也有对面的住户担心狮子的朝向会带来不利，争执因此升级。
  - 书中还转述当时关于管理石狮摆放的讨论。这里记录的是人们对城市空间和物件含义的不同理解；本次没有独立查看原报版面或相关管理文件。
  source_numbers:
  - 1
  map_label: 河北石家庄市区
  location_note: 地图为石家庄市区参考点，不指向具体住宅或店铺。书中称争议发生于 1993 年，所引报刊注明 1994 年；原报未独立核读。
case_cn_wugu_wenling_roof_dispute_1994:
  kind: history
  paragraphs:
  - 邓启耀转述一则据称刊于 1994 年报纸的温岭报道：一户人家听到有人把长期不顺归咎于旧屋房梁，便拆开屋顶，并将怀疑指向曾参与建房的工匠。
  - 书中所引报道又说，冲突扩大并影响到其他居民。事情属于报刊转述，本次未独立查看原始报纸；地图只表示温岭地区，不公开私人住址。
  source_numbers:
  - 1
  map_label: 浙江温岭市区
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_kaili_wood_house_2006:
  kind: report
  paragraphs:
  - 邓启耀记述，黔东南一座旧木屋因工程搬迁而被拆散后，保护者设法收集剩余木料，寻找工匠，希望按原有结构重新拼装。
  - 2006 年，作者带学生在凯里记录复原工作，访谈参与木作的师傅。书中的照片和谈话保留了传统建筑如何被拆解、辨认和再次组装的过程。
  source_numbers:
  - 1
  map_label: 贵州凯里市区
  location_note: 地图取凯里市区参考点；原建筑和临时工场不在此点，2006 年为书中复原访谈年份。
case_cn_wugu_lijiang_dongba_ghost_effigy:
  kind: story
  paragraphs:
  - 邓启耀根据纳西族研究者提供的材料介绍一种仪式叙事：稻草人穿上纸制衣物，代表故事中的角色；讲述者将它与丁巴什罗降伏卡梭麻的神话联系起来。
  - 书中又配有作者 2006 年丽江地区仪式场景的照片。图像和研究者转述的仪式材料应分别阅读，不能仅凭一张照片认定它记录了所述全部环节。
  source_numbers:
  - 1
  map_label: 云南丽江市区
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_wugu_dali_soul_call_bridge_road:
  kind: story
  paragraphs:
  - 在邓启耀收录的云南纸马图样里，有“叫魂娘娘”“追魂”等名称。人们把难以看见的惊惧与离散，转成可以被呼唤、被迎回的形象。
  - 不同纸马出自不同地方，名称与用法也可能有差异。书中图样来自大理地区，呈现的是器物与地方说法，不能替代真实的医疗处置。
  source_numbers:
  - 1
  map_label: 云南大理
  location_note: 地图点为书中所述地区的市县参考位置，不指向个人住址、某次仪式或故事里的具体地点。
case_cn_tao_subei_fish_door_paper:
  kind: history
  paragraphs:
  - 年关将近时，一张镂刻的红纸被贴上门楣或悬在檐下。陶思炎记下一件苏北挂笺：中央是跃起的鲤鱼，画面两侧配有龙首，底纹和垂饰借古钱形象组成。
  - 题额、主图和背后的纹饰共同构成迎新祝愿。作者把它看作年节祈福的纸艺；书中没有交代这件收藏品出自苏北哪一村，也没有给出制作日期。
  source_numbers:
  - 1
  - 2
  map_label: 苏北（徐州地区参考点）
  location_note: 地图是苏北（徐州地区参考点）的宽范围代表点，并不表示故事起源或具体实物、仪式发生在该城市。
case_cn_tao_danyang_qixi_floating_needle:
  kind: history
  paragraphs:
  - 《中国镇物》转述《丹阳县志》的七夕记录：前夜置水，白天让碗受日晒，再将针轻轻放在水面。人们凝视碗底的针影，试着从笔、算盘等形态看出巧拙。
  - 细针、水面与人的眼光组成一场节令游戏。水面能否托住针可以和液体物理现象对照；针影是否预告手艺，则属于当时的民俗解释。
  source_numbers:
  - 1
  - 2
  map_label: 江苏丹阳
  location_note: 地图是江苏丹阳的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_nanjing_qixi_grass_needle:
  kind: history
  paragraphs:
  - 南京旧时七夕也有浮针之戏，不过书中转引的《金陵岁时记》提到，妇女把草截成细针形，放入曝晒过的水盆中，让它浮在水面。
  - 大家观看水底影子，将它想象成珠、伞、箭或笔的形状，再谈吉凶。和金属针的丹阳记录并读，可以看到同一节日中材料与讲述方式的不同。
  source_numbers:
  - 1
  - 2
  map_label: 江苏南京
  location_note: 地图是江苏南京的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_wujin_qixi_mixed_water:
  kind: history
  paragraphs:
  - 《武进阳湖县合志》被《中国镇物》用于说明另一种七夕浮针：人们在午时各取河水和井水，盛在器皿中晒日，再让细针浮于其上。
  - 人们把光下针影看成笔或塔，以此谈论心灵手巧。这里保存的是地方志中的一种记法，具体实施地点、参与者和当年天气并无记录。
  source_numbers:
  - 1
  - 2
  map_label: 江苏常州武进
  location_note: 地图是江苏常州武进的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。 旧志辖域不一定等同于今日武进区。
case_cn_tao_seoul_yagwang_ghost_shoes:
  kind: story
  paragraphs:
  - 《中国镇物》转引朝鲜岁时记述：新年夜里，夜光鬼会偷门外的鞋。孩子们为避开它，早早收起鞋并熄灯，家里还挂起一只筛子。韩国国立民俗博物馆介绍的另一种讲法说，夜光鬼会试穿鞋子，挑合脚的带走。
  - 按故事的说法，夜光鬼会停下来一个个数筛孔，数到鸡鸣才离开。陶思炎另外提出它与中国鬼鸟相通，那是作者的比较意见，不能只凭形象相似认定共同来源。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 朝鲜半岛（首尔地区参考点）
  location_note: 地图是朝鲜半岛（首尔地区参考点）的宽范围代表点，并不表示故事起源或具体实物、仪式发生在该城市。 首尔仅为朝鲜半岛的区域参考点，书中没有给出本次讲述的精确地点。
case_cn_tao_lishui_child_protection_banner:
  kind: history
  paragraphs:
  - 在旧称溧水县凤山乡的庙里，陶思炎记录过一幅挂在神龛前的红布保书。布上写着祈福文字，顶部用竹竿与绳子悬挂，并缀有铜钱和枝叶。
  - 这种文书把孩子寄托给神灵，表达家人盼望孩子平安长大的心愿。书中保留了现场观察；这里不复制保书上的个体姓名，也不把祈愿当成医疗效果。
  source_numbers:
  - 1
  - 2
  map_label: 江苏南京溧水
  location_note: 地图是江苏南京溧水的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_nanjing_bed_gods_new_year:
  kind: history
  paragraphs:
  - 陶思炎援引南京旧俗：除夕时，人们把枝叶和用红纸包好的葱放在床的上方，带孩子一起祭床公床婆，盼望一家人安睡。
  - 书中还展示了床公床母的纸马。卧室里一件不起眼的日常用品，在节日仪式中也获得守护家庭的寓意；记述留下的是祈愿和做法。
  source_numbers:
  - 1
  - 2
  map_label: 江苏南京
  location_note: 地图是江苏南京的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_suzhou_bed_gods_tea_wine:
  kind: history
  paragraphs:
  - 《中国镇物》转述苏州岁时书《清嘉录》：家人把茶、酒和糕果陈设在卧室，祭奉床公床婆，祈求一年睡得安宁。
  - 引文还记民间把茶与酒分别献给两位床神的说法。它同南京床头枝叶的做法相邻，却保存着不同的地方仪式细节。
  source_numbers:
  - 1
  - 2
  map_label: 江苏苏州
  location_note: 地图是江苏苏州的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_gaochun_handprint_brick:
  kind: history
  paragraphs:
  - 《中国镇物》记载高淳淳溪的民居外墙有带手纹的砖，并刊出照片。手掌的印迹被留在烧成的材料上，与周围普通砖块一起砌进墙面。
  - 作者将它放入护宅镇物讨论，并与山西墓葬出土物比较；也可以把它作为制作与建筑使用痕迹观察。砖上有掌纹是观察，留纹目的仍需每件材料的具体证据。
  source_numbers:
  - 1
  - 2
  map_label: 江苏南京高淳
  location_note: 地图是江苏南京高淳的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_xiangfen_jin_tomb_handprint:
  kind: history
  paragraphs:
  - 书中提到山西襄汾荆村沟金墓出土过手纹砖，并用图片展示凸起的掌形。它被拿来与高淳民居外墙上的凹陷手纹相比较。
  - 两件材料处在不同地区和使用环境中。陶思炎提出掌纹的象征性解释，但只凭形式相似，还不能断定两块砖有同一用途或直接传承关系。
  source_numbers:
  - 1
  - 2
  map_label: 山西襄汾
  location_note: 地图是山西襄汾的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。 书中记襄汾荆村沟；地图只示县域，不指示墓葬位置。
case_cn_tao_wan_south_beast_eaves_tile:
  kind: history
  paragraphs:
  - 《中国镇物》收有一张皖南民居的照片：屋檐前缘的瓦件排列成行，每片端头都做出兽面形状。远看是屋顶边线，近看则是一张张脸。
  - 作者将这种图像放入护宅意义的讨论。瓦当也承担屋檐构件的实际与装饰功能；图版没有标明具体村屋，不能把图片位置推成某处现存建筑。
  source_numbers:
  - 1
  - 2
  map_label: 皖南（黄山地区参考点）
  location_note: 地图是皖南（黄山地区参考点）的宽范围代表点，并不表示故事起源或具体实物、仪式发生在该城市。 黄山仅作皖南宽范围代表点，书中未为图 176 标明具体村屋。
case_cn_tao_dunhuang_house_stone_mixture:
  kind: history
  paragraphs:
  - 陶思炎讨论敦煌建筑风俗时，转述过一种称为“镇宅药”的组合：石材、不同物料和文字被置入建屋礼仪，用来寄托安居的愿望。
  - 书中同时列出祈愿用语，并把这种记录与其他地区的镇宅石并读。这个名称描述的是历史文献中的礼俗材料，并不说明配方能够保护房屋或具有药效。
  source_numbers:
  - 1
  - 2
  map_label: 甘肃敦煌
  location_note: 地图是甘肃敦煌的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_xuzhou_building_stone_song:
  kind: history
  paragraphs:
  - 《中国镇物》说，徐州地区有以石镇宅脚的做法，并记录了一首相关歌谣：修屋的人用石头表达对家宅稳定、子孙兴旺的期待。
  - 同一页还谈到其他地方把米、钱或石材放在建筑部位的不同做法。歌谣所载是地方祝愿，书中没有指出某座具体房屋，也未证明其中的象征性作用。
  source_numbers:
  - 1
  - 2
  map_label: 江苏徐州
  location_note: 地图是江苏徐州的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_dantu_roof_beam_food_song:
  kind: history
  paragraphs:
  - 陶思炎记录，上梁仪式中人们会把米粮或面食从新屋梁上抛向地面及等候的人群。书中引述丹徒的抛梁歌，依次讲麦子生长、磨面和做成馒头。
  - 歌谣把普通食物变成建屋祝愿，也把屋主、匠人与在场的人联系在一起。书中转引地方文学资料，不能将歌中的人物和考试结果当作某次具体事件。
  source_numbers:
  - 1
  - 2
  map_label: 江苏镇江丹徒
  location_note: 地图是江苏镇江丹徒的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_yangzhou_taian_beam_rice:
  kind: history
  paragraphs:
  - 书中提及扬州旧称邗江县泰安乡的上梁歌，仪式里用馓馍作为抛粮之物，歌者依次向不同方向表达祝愿。
  - 与丹徒把麦子磨成面食的歌谣相比，这一则更突出上梁时的动作和方位。这里只记录陶思炎转引的地方材料，不推断它在今天每户人家仍然举行。
  source_numbers:
  - 1
  - 2
  map_label: 江苏扬州
  location_note: 地图是江苏扬州的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_jurong_roof_beam_red_green:
  kind: history
  paragraphs:
  - 新屋上梁后，书中记载句容建筑歌谣与挂红绿布的仪式：彩色布条或布面披到屋梁上，歌者唱起花木、进财与家宅的祝愿。
  - 陶思炎把挂布看作迎新屋的一部分，并与湖州、扬州的相近歌谣对照。它首先是建屋现场的仪式记录，歌辞中富贵的愿望并不是对实际结果的保证。
  source_numbers:
  - 1
  - 2
  map_label: 江苏句容
  location_note: 地图是江苏句容的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_huzhou_roof_beam_red_green:
  kind: history
  paragraphs:
  - 《中国镇物》摘录湖州一首与挂红绿布有关的歌：亲人带来彩布，屋主在上梁场合接受祝愿，歌中又铺陈对四方与家宅的祝颂。
  - 这些句子与句容同类歌谣并列，能看出建筑仪式既有相似的动作，也保留地方性的歌词。这里只概述歌意，不把历史歌谣当作今天仍普遍存在的习俗。
  source_numbers:
  - 1
  - 2
  map_label: 浙江湖州
  location_note: 地图是浙江湖州的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_sunan_road_millstones:
  kind: history
  paragraphs:
  - 水乡屋前的小路靠近河塘时，书中记到有人将废旧石磨盘埋在路边、平铺在路上，或砌进临路的墙体，并赋予它守护道路的寓意。
  - 有的磨盘表面做成面孔，有的刻八卦。磨盘本来是加工食物的工具；是否作为镇物使用，仍要结合具体地点和人的讲述判断。
  source_numbers:
  - 1
  - 2
  map_label: 苏南（苏州地区参考点）
  location_note: 地图是苏南（苏州地区参考点）的宽范围代表点，并不表示故事起源或具体实物、仪式发生在该城市。
case_cn_tao_yunnan_paper_horse_two_forms:
  kind: history
  paragraphs:
  - 陶思炎谈到云南甲马时，特别指出两种图样：一种只画马，用来迎请神祇；另一种画人骑在马上，书中称为精神甲马。
  - 这两幅画提醒读者，不能只看人和马的先后位置，就把所有甲马简单归成两类。此处讨论的是图样和名称，与腾冲纸马店有关失物的采访是不同材料。
  source_numbers:
  - 1
  - 2
  map_label: 云南（昆明地区参考点）
  location_note: 地图是云南（昆明地区参考点）的宽范围代表点，并不表示故事起源或具体实物、仪式发生在该城市。
case_cn_tao_jiangsu_anhui_yangsi_water_god:
  kind: story
  paragraphs:
  - 传说里，幼年的杨四弄坏叔父的小船后被投入水中。人们又讲他身上出现异象，因此把他当作水神，另有他斩龙护国的故事。
  - 陶思炎记下苏皖南部一些杨四庙悬挂小木舟，俗称神舟，与水上行旅联系在一起。人物经历属于传说；庙中小舟是书中描述的仪式物件。
  source_numbers:
  - 1
  - 2
  map_label: 苏皖南部（高淳地区参考点）
  location_note: 地图是苏皖南部（高淳地区参考点）的宽范围代表点，并不表示故事起源或具体实物、仪式发生在该城市。
case_cn_tao_gaoyou_gengqigong_lake_robe:
  kind: story
  paragraphs:
  - 书中讲，耿七公隐居高邮，常在湖边游息，甚至独坐蒲席在水上游行。有一次地方官以锦袍答谢他为人诊病，七公却将衣袍投入火中，再取出来时仍完好。
  - 人们因此更把他看作异人；后来，他被供奉为地方水神，船民向他祈求出行平安。湖上与火中的经历是传说，不能仅凭这一段认定历史人物生平。
  source_numbers:
  - 1
  - 2
  map_label: 江苏高邮
  location_note: 地图是江苏高邮的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_suzhou_sweeping_sun_woman:
  kind: history
  paragraphs:
  - 连雨不止时，书中转引吴地岁时记说，人们会剪出一位手持小扫帚的纸女子，把她悬在屋檐下，称作扫晴娘。
  - 另有旧俗记载把纸人倒悬，等天晴后再将她焚去。纸人和扫帚把盼雨停的心愿变成可见的形象；书中所记并不意味着纸人能够改变天气。
  source_numbers:
  - 1
  - 2
  map_label: 江苏苏州
  location_note: 地图是江苏苏州的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_fenghua_two_paper_monks:
  kind: history
  paragraphs:
  - 陶思炎记述奉化一种祈晴做法：人们剪出两个纸和尚贴在墙上，再用竹枝抽打，希望纸人替龙承受责罚，使龙收住雨水。
  - 这是书中转述的地方性仪式想象，和同页的扫晴娘形成对照。它表达对连雨的焦虑与盼晴心愿，不是关于天气控制效果的记录。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 浙江宁波奉化
  location_note: 地图是浙江宁波奉化的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_suzhou_seven_paper_monk_heads:
  kind: history
  paragraphs:
  - 与奉化的两个纸和尚不同，陶思炎记述苏州地区有人用黄纸剪出七个和尚头，倒贴在水缸脚边，并焚香祈求雨停。
  - 纸人的数量、形状与放置位置，让这种做法同手持扫帚的扫晴娘有所区别。书中没有指出某一次仪式发生的确切地点。
  source_numbers:
  - 1
  - 2
  map_label: 江苏苏州
  location_note: 地图是江苏苏州的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_lanxi_rain_lantern_hat:
  kind: history
  paragraphs:
  - 书中讲到，兰溪有把旧箬帽与破灯笼系在竹竿上焚化的祈晴习俗，参与者还会念一段盼望明天天晴的短歌。
  - 破旧的日用品在这里变成向天气表达心愿的媒介。陶思炎将它与纸人祈晴并列；它是历史习俗记述，不是天气干预的方法。
  source_numbers:
  - 1
  - 2
  map_label: 浙江兰溪
  location_note: 地图是浙江兰溪的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_fengxiang_rooster_scorpion_charm:
  kind: history
  paragraphs:
  - 陶思炎收录一张陕西凤翔印制的神鸡蝎符：画中雄鸡与蝎子同现，周边配有符样和文字。书中将它放在谷雨时节与除虫愿望的脉络里。
  - 这件纸符表现人们面对季节性虫蝎时的担忧和期待。它是图像与民俗材料，不是已经验证的防虫或治疗办法；图样制作年份也没有记明。
  source_numbers:
  - 1
  - 2
  map_label: 陕西宝鸡凤翔
  location_note: 地图是陕西宝鸡凤翔的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_sunan_insect_notice:
  kind: history
  paragraphs:
  - 书中说，苏南有写蜒蚰榜的做法：人们在细纸条上写出多种虫名和盼虫离去的语句，再贴在床底、桌脚或橱边。
  - 儿童参与张贴时还会一起呼喊。床脚、纸条与孩子的声音，把人们应对日常虫扰的愿望放进家庭空间；纸榜本身的效力没有得到证明。
  source_numbers:
  - 1
  - 2
  map_label: 苏南（苏州地区参考点）
  location_note: 地图是苏南（苏州地区参考点）的宽范围代表点，并不表示故事起源或具体实物、仪式发生在该城市。
case_cn_tao_gaotang_roasted_beans_scorpion:
  kind: history
  paragraphs:
  - 《中国镇物》转述一则高唐二月二习俗：人们把黄豆浸泡后炒食，并以与蝎子相关的名称称呼这一节令食品，寄托避免虫蝎伤人的愿望。
  - 书中把它与不同地区的蝎符并列。这里记录的是食物名称和节令观念；吃豆并不能由此被当作预防或治疗蝎伤的方法。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 山东高唐
  location_note: 地图是山东高唐的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。
case_cn_tao_ningyuan_yellow_paper_insects:
  kind: history
  paragraphs:
  - 陶思炎记述湖南宁远的旧俗：四月八日，人们把写有文字的黄纸贴在墙上，祈愿家中少受虫扰。纸上的短句借人物意象表达驱虫心愿。
  - 书中将这类文字与苏南蜒蚰榜、陕西蝎符并列，反映不同地区使用纸张与语言的方式。记录没有给出某一村庄或仪式日期，不能将其当作除虫效果的证据。
  source_numbers:
  - 1
  - 2
  map_label: 湖南宁远
  location_note: 地图是湖南宁远的市县或区域参考点，并非图中实物、村落或某次仪式的精确地址。

case_cn_zibuyu_v08_s038:
  kind: story
  paragraphs:
  - 清代《子不语》里，杭州人赵清尧喜爱下棋，在一处庵里遇到一个棋艺不佳却自称“炼师”的道人。赵没有与他深交，当晚却看见帐边鬼火，随后又听见床边传来的声音。
  - 故事说，声音来自受了冷落的道人；他想以恐吓索财，但赵始终没有按他的意愿求饶。结尾交代道人自伤身亡，留下有关报应与先知的种种说法。邓启耀在书中引用这一故事；它属于古代志怪叙事。
  source_numbers:
  - 1
  - 5
  additional_sources:
  - citation: 邓启耀：《巫蛊：中国文化的历史暗流》，桂林：广西师范大学出版社，2025 年 4 月，ISBN 9787559879943。
    type: monograph
    url: https://book.douban.com/subject/37310453/
    locator: 第三章第一节“杀魂夺命”，转引《子不语》“道士作祟自毙”段；本次核读电子书，链接为书目页面、非书中正文；纸书页码未核。
  map_label: 浙江杭州城区参考点
  location_note: 坐标取杭州城市参考点；《子不语》故事中的二圣庵和人物住处未定位，情节不可当作已核案件。
case_cn_zibuyu_v10_s008:
  kind: story
  paragraphs:
  - 《子不语》“张大帝”记下一则墓地故事：一位道士想改变别人家坟地的风水，在羊角里藏入东西，悄悄埋在坟旁。两家此后的变化被故事解释成这一行为的结果。
  - 清明迎神队伍经过墓旁时，神像突然停下。众人按叙事中神灵的指示搜寻，找到羊角并将道士送官；邓启耀以此讨论风水争夺的地方传说。神像、风水效力与审判细节均属于志怪叙事。
  source_numbers:
  - 1
  - 5
  additional_sources:
  - citation: 邓启耀：《巫蛊：中国文化的历史暗流》，桂林：广西师范大学出版社，2025 年 4 月，ISBN 9787559879943。
    type: monograph
    url: https://book.douban.com/subject/37310453/
    locator: 第四章第二节“风水魇镇”，转引《子不语》“安溪相公坟”段；本次核读电子书，链接为书目页面、非书中正文；纸书页码未核。
  map_label: 福建省（福州省域参考点）
  location_note: 原文只说“安溪相公坟，在闽之某山”，未核定坟墓所在山或安溪县。点位为福州省会作福建区域参考，不是坟址。

case_cn_dict5_changsha_opera_appeal:
  kind: story
  paragraphs:
  - 长沙一带的故事把场景放在一场庙会：包公戏正要开演，一名自称蒙冤而死的女子拉住扮演包公的戏子，向他倾诉遭丈夫杀害的经过。
  - 她带着戏子来到坟地；故事说，戏子查验后向官府告发，涉案者受到惩办。戏台上的审案角色，在叙事中越过舞台，成了替人申冤的人。
  source_numbers:
  - 1
  - 2
  map_label: 湖南长沙
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_dengta_teacher_petition:
  kind: story
  paragraphs:
  - 一则流传于灯塔的故事里，教书先生深夜遇见抱着孩子的女子。女子讲述自己受到丈夫诬陷并遇害，希望有人帮她说出冤情。
  - 先生连夜写下诉状，后来戏班又将此事编成戏，消息传到了县衙。故事将书写、表演和申诉连在一起，并未留下可核实的当事人住址。
  source_numbers:
  - 1
  - 2
  map_label: 辽宁灯塔
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_puning_zhongkui_swapped_face:
  kind: story
  paragraphs:
  - 普宁地方故事说，钟馗原本相貌英俊，附近山洞里的丑鬼却想与他交换面容。丑鬼来到寺里，反而被钟馗吞下。
  - 丑鬼在腹中施展换脸的本领，钟馗被迫答应并放他离开。故事借一次出人意料的交换解释钟馗后来为何以异貌捉鬼。
  source_numbers:
  - 1
  - 2
  map_label: 广东普宁
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_yantai_pengzu_three_visits:
  kind: story
  paragraphs:
  - 烟台一带的故事让彭祖先后面对前来捉拿他的阴差：第一次他将来客赶走，第二次又识破茶水中的毒计，以假死脱身。
  - 许多年后，阎王化作游方郎中亲自前来，仍未得逞。辞典把这段长寿与斗智的想象列为地方鬼话，并非人物寿命记录。
  source_numbers:
  - 1
  - 2
  map_label: 山东烟台
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_taicang_flatterer_underworld:
  kind: story
  paragraphs:
  - 太仓故事中，阎王摆出阴差和牛头马面，准备审问一个善于逢迎的鬼，想用森严阵势使他害怕。
  - 受审者却反复称赞阎王公正无私，令其十分得意，最终被放过。故事把一场审讯写成对奉承与权力的讽刺。
  source_numbers:
  - 1
  - 2
  map_label: 江苏太仓
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_lanxi_niu_ma_officials:
  kind: story
  paragraphs:
  - 兰溪版本让牛备、马飞两名书生一同赴考：马飞擅长钻营而得志，牛备落第后又以梦境作说辞，谋得高位。
  - 二人后来结为同党，横行人间。故事让他们死后继续在阴间听差，借此讲述牛头马面的另一种来历。
  source_numbers:
  - 1
  - 2
  map_label: 浙江兰溪
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_taicang_wandering_ghost_king:
  kind: story
  paragraphs:
  - 太仓地方故事说，秀才陈剑秋因不满考场舞弊而郁郁而终；由于阳寿未尽，他在阴间成了一名不受约束的野鬼。
  - 众鬼推举他为首，一同对付不平之事。故事最后让当年的考官当众承认罪行，并说此事后来得到处理。
  source_numbers:
  - 1
  - 2
  map_label: 江苏太仓
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_linqing_ghost_brother_mud:
  kind: story
  paragraphs:
  - 临清的故事里，一位老人在车水时遇见愿意帮忙的鬼，两者结成兄弟，一同对付欺压乡人的恶霸。后来鬼要去做阎王，两人依约再见。
  - 阎王送老人一个能化为姑娘的泥娃；恶霸把她抢走后，她又变回泥。官员在泥里发现诉状，故事以恶霸受惩结束。
  source_numbers:
  - 1
  - 2
  map_label: 山东临清
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_wuning_yaksha_gratitude:
  kind: story
  paragraphs:
  - 武宁一则故事中，一位寡妇在打柴路上发现无人掩埋的遗体，便脱下衣物包裹并安葬。许多年后，她的孩子梦见有人承诺帮助他赴考。
  - 母亲说明当年的事，孩子后来考中并以立碑纪念这份善意。辞典将梦中的帮助写作被安葬者的报恩，而不是可核验的科举档案。
  source_numbers:
  - 1
  - 2
  map_label: 江西武宁
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_shanyin_gambler_straw_hut:
  kind: story
  paragraphs:
  - 山阴故事中的李二鬼输了钱，夜间游荡时听见草屋里喧哗，进去发现有人聚赌。他向人借钱加入，起初赢了不少。
  - 赌徒们后来钻圈上吊，他才意识到自己遇见的是吊死鬼；一番惊险后他决定戒赌。草屋与赌局只属于地方故事中的场景。
  source_numbers:
  - 1
  - 2
  map_label: 山西山阴
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_tongshan_two_debt_spirits:
  kind: story
  paragraphs:
  - 通山故事说，商人张甲听见两个鬼准备托生，其中一个将来到自己家。孩子出生后，他因先入为主地认定孩子是讨债鬼，对孩子十分苛刻。
  - 多年后两鬼相遇，张家的孩子满腹怨气，另一个却在善待中生活得好。故事用相反境遇反讽人们对讨债与还债的预设。
  source_numbers:
  - 1
  - 2
  map_label: 湖北通山
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_kaihua_river_money_bag:
  kind: story
  paragraphs:
  - 开化地方故事里，商人将钱袋放在河边后失窃，误以为是一名路过女子拿走。两人争执时都跌入河中，故事让他们继续在阴间理论。
  - 阎王翻阅生死簿，将他们眼下的遭遇解释为前世的债。这里呈现的是地方叙事中的报应观，并非可据此核定的失窃案件。
  source_numbers:
  - 1
  - 2
  map_label: 浙江开化
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_shilin_official_servant_silver:
  kind: story
  paragraphs:
  - 辞典记云南路南流传的故事：县官杨其良在衙门里发现前任留下的银钱，离任时为了隐瞒此事，杀害知情的书童。
  - 故事说，书童的魂后来投生到杨家，杨其良最终不得善终。路南是辞典所记地名，地图以今石林县作区域参考。
  source_numbers:
  - 1
  - 2
  map_label: 云南石林（旧称路南）
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。 旧称路南对应今石林县；旧辖域与现今行政边界可能不同。
case_cn_dict5_shangyu_trader_wine_ghost:
  kind: story
  paragraphs:
  - 上虞流传的故事里，贩布人王大兴途经江山，在一座古庙投宿；他独自饮酒时遇到一位自称酒鬼的来客，两人连续三夜相伴对饮。
  - 临别时，来客请他代为向家人传话，并告知藏酒所在。贩布人回乡后照办，故事以家人找到陈酒作为回应。
  source_numbers:
  - 1
  - 2
  map_label: 浙江上虞
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。 书中另提江山为故事场景，不能把两处地点混同。
case_cn_dict5_shulan_returning_mother:
  kind: story
  paragraphs:
  - 舒兰故事里，王山根在路上遇见已经去世的母亲，便把她接回家。母亲归来后的举止与从前不同，亲属逐渐感到疑惑。
  - 舅舅察觉危险后试图阻止，最后一位道人出现，故事以妖异被制伏、受害者获救收尾。辞典记载的是一种地方讲法。
  source_numbers:
  - 1
  - 2
  map_label: 吉林舒兰
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_yiyuan_ghost_wife_return:
  kind: story
  paragraphs:
  - 沂源故事中，张生失去妻子，又在赴考失利后心情低落；他在荒山中见到熟悉的身影，便将她带回家。亲属试探后认为她并非活人。
  - 张生放走她并约定再见，后来得知阴差原先抓错了另一位张氏；妻子最终还阳。故事借重名和误认完成团圆的转折。
  source_numbers:
  - 1
  - 2
  map_label: 山东沂源
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_tianzhen_carpenter_ghost_marriage:
  kind: story
  paragraphs:
  - 天镇故事里的木匠夜路迷失，看见一户人家，便请求借宿。屋内一位老人和一位年轻女子自称夫妻，他虽觉得不相称，还是住了下来。
  - 天亮后木匠发现自己睡在荒坟上，打听才知道此处曾有人为逝者配阴亲。故事把荒野借宿与地方婚丧观念连在一起。
  source_numbers:
  - 1
  - 2
  map_label: 山西天镇
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_linan_cheng_black_thread:
  kind: story
  paragraphs:
  - 临安流传的故事让程咬金夜宿凤凰庙，听见异响又看见黑影。旁人说，附近自从来了怪道之后便屡有异事。
  - 次夜他与现身者搏斗，趁机将一根黑线系在对方衣上。众人顺线找到藏身处并合力制服怪物；庙名是故事场景，未据此定位实址。
  source_numbers:
  - 1
  - 2
  map_label: 浙江杭州临安
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_xiantao_xu_tricks_yama:
  kind: story
  paragraphs:
  - 仙桃故事里，徐苟三在山上割草时与阎王结怨，接连遇到被派来捉拿自己的阴间来客。他利用对方的喜好与弱点，设法使他们退走。
  - 最后阎王亲自出马，又中了徐苟三预先布置的圈套。故事以戏谑的方式描绘普通人与阴间权力之间的较量。
  source_numbers:
  - 1
  - 2
  map_label: 湖北仙桃
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_yongji_yanwu_yama:
  kind: story
  paragraphs:
  - 永吉一带的故事说，为人厚道的阎五寿数将尽，接连有阴间差役前来。他借口能替其中一位种出头发，又以计应对后来的来客。
  - 狱帝亲自出面后，阎五骗得官服和坐骑，前往阴间。故事还把“阎五”和“阎王”联系起来，解释后者称谓的来历。
  source_numbers:
  - 1
  - 2
  map_label: 吉林永吉
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_daming_red_stone_bridge:
  kind: story
  paragraphs:
  - 大名地方故事说，王和发出资修桥，后来不幸身亡。叙事让他投生到黄河南岸的一户人家，长大后又来到大名做生意。
  - 他暗中接济王家的母子，家人追问之下才将他认作亡夫转世。故事以再次相认作结，辞典未提供桥的确切位置。
  source_numbers:
  - 1
  - 2
  map_label: 河北大名
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_donglan_soul_mountain:
  kind: story
  paragraphs:
  - 东兰故事里，一对夫妇外出后，家中发生了孩子受伤的事故；夫妇迁怒于照看孩子的老人，致使老人死去。
  - 故事将老人的报复写成魂魄追索：夫妇后来化为两块巨石，逐渐成为山峰。它以一则悲剧叙事解释当地所说的山名。
  source_numbers:
  - 1
  - 2
  map_label: 广西东兰
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_feicheng_midnight_flute:
  kind: story
  paragraphs:
  - 肥城地方故事中，瓜农王大胆夜里自制笛子，吹奏时招来一名要争吹笛子的鬼。他设法将来客赶走，对方却又回来报复。
  - 王大胆躲进豆秸堆，鬼没找到人，误以为自己已经得手。故事用这次夜间遭遇解释不在半夜吹奏的告诫。
  source_numbers:
  - 1
  - 2
  map_label: 山东肥城
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_zhuji_inn_bagua:
  kind: story
  paragraphs:
  - 诸暨故事中，一名旅人住进黑店，察觉屋内气味异常，便按家传办法在门前布置八卦。店主养的鬼夜里试图进屋，直到鸡鸣也没能得逞。
  - 旅人随后报官，故事以黑店被处理结束；它将门上八卦解释为一种护身做法，不能由此推定具体历史案件。
  source_numbers:
  - 1
  - 2
  map_label: 浙江诸暨
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_suzhou_umbrella_barber:
  kind: story
  paragraphs:
  - 故事将场景放在苏州，一位能看见阴间事物的剃头师傅为顾客理发时，说出米店老板将被鬼带走。恰巧顾客正是老板本人。
  - 老板后来请师傅喝酒，问出传说中鬼怕雨伞的办法，从此雨伞不离身。辞典用这一情节讲述撑伞避鬼说法的来历。
  source_numbers:
  - 1
  - 2
  map_label: 江苏苏州
  location_note: 辞典所记流传范围为江苏，故事场景提到苏州娄门；地图以苏州市区作参考，不是具体街址。栏目名称不表示已知实际发生或采录年代。
case_cn_dict5_honghu_wedding_lights:
  kind: story
  paragraphs:
  - 洪湖故事说，银凤与保贵成婚，在迎亲回府途中，银凤的魂被鬼夺走，鬼冒作新娘进入新房，而保贵尚不知道。
  - 故事让银凤到阴间申冤，阴差赶来救下保贵。它又借此解释火把、舞龙和热闹新房等婚礼习俗；这是一种故事化的由来。
  source_numbers:
  - 1
  - 2
  map_label: 湖北洪湖
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_dict5_yichun_ghost_valley:
  kind: story
  paragraphs:
  - 宜春故事里，盗窃成性的王家破坏山林，鬼谷冲的鬼取走了他家的财物。王家试图报复，先要毁掉鬼的藏身处，随后又准备放火烧山。
  - 传说中的鬼两次反击，王家受到惩罚；辞典把这一则归入善鬼为民除害的故事。地图只表示宜春范围，不标出鬼谷冲实址。
  source_numbers:
  - 1
  - 2
  map_label: 江西宜春
  location_note: 地图点是辞典所记流传地的市县或区域参考，并非故事中的住宅、道路、寺庙、墓地或事件的精确位置。“当代鬼话”是辞典栏目名称，不表示已知实际发生或采录年代。
case_cn_wugu_w3_lijiang_stones:
  kind: legend
  paragraphs:
  - 一位老人向邓启耀回忆，丽江曾有一户人家不时遭遇飞石。石子仿佛从屋内飞出，围观的人越聚越多；传说连贴在门楼上的旗子也被打落。讲述者把这一切归到“小神子”身上，称它既会带来财运，也会戏弄主人。
  - 这段口述又把怪事和一笔意外之财连在一起：家人从修桥现场获得财物，曾说发家后要修桥庙，却没有兑现。后来家人归还财物，并集资修桥盖庙；讲述者说，事情这才平息。故事里的还愿与飞石使人联想到公共承诺、财富和邻里议论。作者于1993年采访，老人所称发生时间是1939至1941年；两者不是同一时间，也不能据此证明飞石具有超自然原因。
  source_numbers:
  - 1
  map_label: 云南丽江
  location_note: 坐标采用云南丽江的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_lijiang_red_snake:
  kind: legend
  paragraphs:
  - 同一位丽江讲述者还说，几位行路人来到木桥附近，看见桥下有一条红蛇，随后在桥下发现了首饰。他们将财物带回，传说红蛇也跟着进了家门。此后邻里纷纷送来象征性物件：在当地的讲述中，这表示人们已怀疑这家获得了会招财的东西。
  - 得到财物的人最终将它送回原处。故事说，蛇又现身离去，家里才重新安宁。这里值得读的不只是蛇的奇异形象，还有财富如何通过邻里议论变成一件需要解释的事；这是作者1993年记录的一则口述，不是经独立证实的寻宝事件。
  source_numbers:
  - 1
  map_label: 云南丽江
  location_note: 坐标采用云南丽江的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_tonghai_fenghuang:
  kind: legend
  paragraphs:
  - 通海兴蒙一带流传一则关于凤凰山和河西的故事：山势像为幼鸟觅食的母凤凰，山下人的辛劳被讲成一场地势与命运的较量。一个懂风水的人设计改变道路、牌坊与地沟，想让原来的权势格局逆转。
  - 传说中，地沟总在一夜之间重新填满，故事后来出现了令人不安的牺牲情节，最后又以建桥阻止地脉合拢、施术者遇害收束。邓启耀在1980年通海采访中记录此说；故事所述久远年代、暴力和风水效应均不能当作已证实事件。
  source_numbers:
  - 1
  - 2
  map_label: 云南通海
  location_note: 坐标采用云南通海的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_dongguan_hanjing:
  kind: research
  paragraphs:
  - 在《巫蛊》所引东莞漳澎调查里，家人会用“受惊、魂离开了”的说法解释一些不安和病痛；被称为“喊惊”的仪式以呼唤名字为中心，盼望离散的魂重新归来。家庭成员、仪式主持者与受惊的人共同参与，仪式也成为家人表达关切的场景。
  - 作者并列提到鲁迅所藏《叫惊》木刻，它记录的是另一历史时期的相关风俗，两者不能视为同一次田野观察。本节有项目组2014年的调查注，但该注与这段记录的确切对应关系待进一步核对；这里所记是地方信念和社会实践，不代表疾病原因或疗效已被证实。
  source_numbers:
  - 1
  - 2
  map_label: 广东东莞
  location_note: 坐标采用广东东莞的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_honghe_yiche_calling:
  kind: research
  paragraphs:
  - 邓启耀记录红河哈尼族奕车人的叫魂活动：主持仪式的贝玛在门外念诵，呼唤失散的魂回到人身。书中的叫魂词想象魂走过沟坎、荆棘和各方道路，家人的声音则为它指向回家的方向。
  - 作者拍摄的相关照片标注为1992年云南红河。它呈现的是特定语境下的关切与语言传统，并不能证明魂魄离身或仪式具有医疗效果。红河州地域广阔，地图点仅用州府蒙自作区域参照，不定位为拍摄村庄。
  source_numbers:
  - 1
  map_label: 云南红河州
  location_note: 坐标采用云南红河州的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_weining_cuotaiji:
  kind: research
  paragraphs:
  - 正月里，贵州威宁的撮泰吉把祭祀、耕作、喜庆与扫寨串成一场表演。面具人物在集体场地上行动，农事与迁徙记忆被转化为动作；到“扫火星”时，戏又走向村寨，寄托新年的平安愿望。
  - 邓启耀将撮泰吉放在具有傩祭性质的节日活动中讨论。中国非物质文化遗产网的项目资料另说明它的表演地点、结构与传承背景；对于起源年代，资料明确说尚无定论。地图使用威宁县城参照，并非具体演出现场。
  source_numbers:
  - 1
  - 2
  map_label: 贵州威宁
  location_note: 坐标采用贵州威宁的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_huazhou_huapeng:
  kind: research
  paragraphs:
  - 秋收之后，化州部分地方的人们搭起棚，组织演员戴面具表演。吟唱与舞蹈穿插着农事、生活和祈愿：有接神、锄田、钓鱼，也有人物与戏谑，让一个祭仪空间同时成为村落的舞台。
  - 《巫蛊》把“跳花棚”列入具有傩祭性质的节日表演；中国非物质文化遗产网则记载它在化州的流传、表演角色和内容。地图点是化州市区的地理参照，并非任一具体村庄或某场演出的定位。
  source_numbers:
  - 1
  - 2
  map_label: 广东化州
  location_note: 坐标采用广东化州的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_zhanjiang_kaobing:
  kind: research
  paragraphs:
  - 在湛江及雷州半岛若干地方，名为“考兵”等的傩舞以角色、面具和身体动作组成节日表演。它既与地方祭祀及祈安愿望有关，也留下了围绕雷神、将领等形象形成的表演传统。
  - 《巫蛊》在讨论节日中的傩祭时提到湛江“考兵”；国家级非遗项目资料进一步列出多个流传地区，因此这里用湛江市作为区域参照，而不是把所有演出合并为一件具体事件。
  source_numbers:
  - 1
  - 2
  map_label: 广东湛江
  location_note: 坐标采用广东湛江的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_kunming_lanyao:
  kind: research
  paragraphs:
  - 老昆明话里，“撒烂药”被用来指背后坏人或暗中说坏话。邓启耀解释，这句骂人的话与一种转移病祸的旧观念相连：人们把不愿留下的东西放在路上，想象过路的人会替自己带走厄运。
  - 从路边弃物到日常语言，故事把对病痛的无助与对损害他人的责怪折叠在同一个词里。书中提出的是对地方俗语的解释，不能视为已证实的疾病传播或医疗方法；具体年代和地点未确定。
  source_numbers:
  - 1
  map_label: 云南昆明
  location_note: 坐标采用云南昆明的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_yanshi_transfer_note:
  kind: history
  paragraphs:
  - 书中转述一则关于偃师的旧传闻：有人把写着话的纸包留在路上，希望拾取它的陌生人带走家人的疟疾。故事中，路口连接着两个互不认识的家庭，也让人看到人们如何为久病寻找解释。
  - 作者称此俗在1930年代仍有传闻，并援引1988年文章；我们实际核读的是邓启耀的转述，没有独立查到当年现场或逐份核验他所引文章。纸包与疾病转移属于民俗观念，不是对疟疾传播方式的科学说明。
  source_numbers:
  - 1
  map_label: 河南洛阳偃师
  location_note: 坐标采用河南洛阳偃师的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_guangshun_marriage:
  kind: legend
  paragraphs:
  - 《巫蛊》转录一则贵州广顺的故事：一个年轻女子因母亲被邻人怀疑，自己也被传说带有能够害人的力量。她后来出嫁，男方家人仍因为这些流言而谨慎对待婚礼往来；故事最后说，人们担心的事并没有发生。
  - 这则讲述让超自然传言之外的社会后果变得清楚：被指认的人可能首先失去的是婚姻选择和邻里信任。作者同节列举了旧调查和文章，但本次尚未确认每一则引文与原刊的对应关系；它不能用来概括任何民族或当代社区。
  source_numbers:
  - 1
  - 2
  map_label: 贵州长顺
  location_note: 坐标采用贵州长顺的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_zhenning_needle:
  kind: research
  paragraphs:
  - 邓启耀转述关于镇宁革利地区的一项旧调查：有的家庭在议亲前打听对方家族，使用“针线”之类隐语判断是否符合自己的忌讳。亲事在这种判断中可能反复搁置，私人生活也被邻里的怀疑裹挟。
  - 这里所称“清针线”是书中记录的地方表述，背后是具体时代与地域的婚姻观念，不是对任何群体的本质描述。书中引用了旧调查，但这段与各篇原刊的对应关系尚待核对，不能断言其现在仍普遍存在。
  source_numbers:
  - 1
  map_label: 贵州镇宁
  location_note: 坐标采用贵州镇宁的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_dali_crying_paper:
  kind: research
  paragraphs:
  - 大理一类纸马画上，女人带着雨伞等行装，身后还有一个小人。《巫蛊》图4-1、4-2把这类形象称为“哭神”，并将她与妇女为亡夫痛哭的故事放在一起阅读。她的远行与眼泪，让纸上的小小图像带出了漫长的路。
  - 作者推测身后的形象或许与被筑入城墙的丈夫有关，并没有给出可以确定身份的证据；孟姜女等故事也有不同版本。这里呈现的是纸马及研究者的解释，不把推测直接当作画面的确定含义。
  source_numbers:
  - 1
  map_label: 云南大理
  location_note: 坐标采用云南大理的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_jianchuan_masters:
  kind: research
  paragraphs:
  - 建房之前，剑川白族木匠在所记传统中会纪念地方木匠之神张班与鲁班。邓启耀把“张鲁二班”纸马与营造建筑的担忧并置：屋子尚未成形，工匠、主人与地方神灵的关系已经被放进仪式中。
  - 书中图4-8至4-10展示的是大理、祥云的同类纸马，不能直接说它们全部来自剑川。剑川的叙述与其他地点的实物是相互对读的材料；本条没有记录具体住宅或建房者。
  source_numbers:
  - 1
  map_label: 云南剑川
  location_note: 坐标采用云南剑川的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_jinping_toad_embroidery:
  kind: research
  paragraphs:
  - 邓启耀回忆在云南金平调查时，看到一些孩子的衣背绣着圆形的蟾蜍图案。询问孩子的母亲后，他记录下她们对图案的解释：希望借蟾蜍的象征意义，让孩子远离危险。另一些衣服还绣有猫头鹰。
  - 书中图7-15标注为1993年云南红河拍摄的哈尼族儿童衣背纹样；它与作者的金平记录互相呼应，但单凭图注不能确定照片就是同一场景。图案中的“保护”是受访者表达的愿望，不能当作实际防护效果。
  source_numbers:
  - 1
  - 2
  map_label: 云南金平
  location_note: 坐标采用云南金平的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_ninglang_bottle:
  kind: research
  paragraphs:
  - 1992年夏末，作者参加纪录片拍摄，在宁蒗永宁乡（今永宁镇）住宿时遇到一位自称懂得秘传技艺的人。对方展示一桶浸有多种动物和植物的液体，并声称可以处理身体不适；同行者尝试后，作者留下的是惊异与疑问，而不是确定的结果。
  - 这一段和书中有关“蛊坛”的传闻被并置，是作者的联想，不能证明两者相同。叙述不提供私人地址、人物身份或制作方法，也不采信对方宣称的效果；地图以宁蒗县城为参照，并非住宿地点。
  source_numbers:
  - 1
  - 2
  map_label: 云南宁蒗
  location_note: 坐标采用云南宁蒗的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_guangzhou_dolls:
  kind: research
  paragraphs:
  - 2006年前后，一种被商家称作“巫毒娃娃”的小人偶出现在网络店铺与城市商品市场。邓启耀回忆广州电视节目曾就这一话题联系他，书中也转述当时学生佩戴和商店销售的报道：恐怖外观、护身愿望与商品故事被包装在一起。
  - 商品名、商家宣称的来历与宗教传统不能直接画等号；销售神话也不等于功效证据。这里依据的是作者回忆及其书中转述，未独立核看原电视节目或当年全部销售数据。
  source_numbers:
  - 1
  map_label: 广东广州
  location_note: 坐标采用广东广州的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_wugu_w3_kaili_fengshui_story:
  kind: legend
  paragraphs:
  - 2006年，邓启耀在凯里采访木匠时，听到一则关于清水江流域富户和风水先生的故事。传说先有一位老人帮助宅主选择地方，后来又有客人改动街道与台阶，让原本的好运转向；离奇的夜间见闻也被织进了情节。
  - 采访者追问后，讲述者又说那家后代其实并未像故事中所说的那样衰败。这句补充使传说和现实并排出现。凯里是书中采访地点，并不代表故事中老屋、道路或墓地的实际位置；它与已有老屋修复条目可作背景对照。
  source_numbers:
  - 1
  map_label: 贵州凯里
  location_note: 坐标采用贵州凯里的市县或区域参照点，用于浏览分布；不表示叙事、拍摄或仪式发生于该点，地点范围以正文和出处为准。
case_cn_tao_w3_dantu_dogs:
  kind: history
  paragraphs:
  - 书中以当时“丹徒县”记四月八的驱天狗习俗。人们预先捏泥狗、做面狗；月亮升起时，有妇女把泥狗倒进河塘并燃放爆竹，随后回家蒸食面狗。
  - 这些小狗是节日食品，也是回应天狗吞食日月传闻的象征物。书中将其视为护日月、求平安的民俗，不能据此判断天象或灾害真的受仪式影响。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 江苏镇江丹徒
  location_note: 书中为旧称丹徒县；地图为镇江丹徒一带区域参考，非村庄或仪式地址。旧县与现区边界可能有变化。
case_cn_tao_w3_huaian_flour_child:
  kind: history
  paragraphs:
  - 《中国镇物》引旧时怀安一带的记载：七月半蒸制面人，让孩子抱在怀里；当地传说“天狗”会伤害婴孩，面人因此被当作象征性的替身。
  - 这一小小的人形把家人对孩子的担忧转化成可以制作、可以抱持的东西。书中注释转引《怀安县志》，本次没有独立查阅该县志，也不把传说当作现实危险。
  source_numbers:
  - 1
  - 2
  map_label: 河北张家口怀安
  location_note: 怀安县县城柴沟堡镇一带的参考点，并非记录中的具体村落。
case_cn_tao_w3_xingyang_baizui_iron_ox:
  kind: history
  paragraphs:
  - 书中说，旧荥阳县的广武山脚、黄河岸边柏嘴渡口，原有两只镇河铁牛，人们寄望它们能够制服水中怪物，使河水不再泛滥。
  - 作者记其中一件当时仍存于孤柏口村，卧牛身上有难以辨读的残字和纪年。这里记录的是 1998 年书中所述状况；实物是否仍在原处及其现状另需核查。
  source_numbers:
  - 1
  - 2
  map_label: 河南荥阳
  location_note: 荥阳市城市代表点，不是柏嘴渡口或铁牛实物的位置。
case_cn_tao_w3_hongze_iron_ox:
  kind: history
  paragraphs:
  - 洪泽湖与运河沿岸的居民长期面对水患。书中记，旧洪泽县高良涧闸下放着两只铁牛，身形敦实、昂首张角；它们腹部所铸铭文把镇水愿望与当地水利环境连在一起。
  - 书中图 281 展示同类镇水铁牛，并记铸造和监造文字。这是洪泽的实物记录，与山西蒲津渡的铁牛是不同对象；本条不判断两地形制之间存在直接传承。
  - 王磊 2019 年调查记管理所及其东侧各有一牛。两次记载所涉实物是否完全对应、位置变化经过仍待核实。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 江苏淮安洪泽
  location_note: 洪泽城区代表点，不是实物所在点。原书使用洪泽县旧称，2016 年撤县设区。
case_cn_tao_w3_gaoyou_iron_ox:
  kind: history
  paragraphs:
  - 《中国镇物》记载，高邮运河边马棚湾出土过一件铁牛。作者说，写作时它存放在市内文游台；书中的铁牛呈普通水牛形，而不是独角犀牛。
  - 这件器物与洪泽高良涧的铁牛都在书中作为治水镇物讨论，却有各自的发现地点。存放地点是 1998 年书中信息，不等于今天的展陈位置。
  - 王磊 2019 年调查另记马棚湾西堤有一件铁牛，并将淮扬铁牛判断为黄牛形；与陶书所记存放地点和形态不同。两条记载是否指同一实物、迁移经过仍待核实。
  source_numbers:
  - 1
  - 2
  map_label: 江苏高邮
  location_note: 高邮市城区代表点，不是发现、存放铁牛的具体地点。
case_cn_tao_w3_yanggu_iron_ox:
  kind: history
  paragraphs:
  - 书中提到，山东阳谷县张秋镇因屡遭黄河水患而铸造镇水铁牛。对生活在河流附近的人而言，铁牛既是可见的器物，也寄托着不再受水灾侵扰的愿望。
  - 作者把它与黄河、淮河沿岸的其他铁牛并列讨论；这不是说铁牛本身能够替代堤防，书中亦未交代本件铁牛今天的保存位置。
  source_numbers:
  - 1
  map_label: 山东聊城阳谷
  location_note: 阳谷县城区域参考点，不是张秋镇铁牛的具体位置。
case_cn_tao_w3_hongze_stone_rooster:
  kind: history
  paragraphs:
  - 书中记洪泽旧县城中有一只高高站立、朝东昂首的石鸡。作者将它放在水患地区的镇物传统中讨论，并在次页图 283 标注“江苏洪泽”。
  - 鸡鸣报晓的形象在作者解释中连到光明与驱除灾厄的愿望。石鸡和高良涧的铁牛是不同的器物，书中照片记录的是当时所见，当前位置需要另查。
  source_numbers:
  - 1
  - 2
  map_label: 江苏淮安洪泽
  location_note: 洪泽城区代表点，不是实物所在点。原书使用洪泽县旧称，2016 年撤县设区。
case_cn_tao_w3_jingzhou_xirang:
  kind: story
  paragraphs:
  - 书中转述清代《香祖笔记》：荆州南门有一处被称作“息壤”的地方，相传擅动会招来雷雨。康熙初年大旱时，有人掘开堤旁土层，见到一件来历难明、带有文字的物体。
  - 叙事称人们急忙重新掩埋，而后连降大雨、江水泛滥。旱灾、发掘与暴雨在笔记中被串成传闻；本次未独立核验原书，故事不证明发掘导致降雨。
  source_numbers:
  - 1
  map_label: 湖北荆州
  location_note: 荆州市城区参考点，不代表书中南门或堤坝的位置。
case_cn_tao_w3_tianjin_paper_turtle:
  kind: history
  paragraphs:
  - 书中引《中华全国风俗志》描述天津农人遇旱求雨：队伍中有人披绿色纸制龟壳，随从戴柳圈、持柳枝；孩子们抬着以贝壳装饰鳞片的泥龙沿街唱歌。
  - 街市居民迎接队伍，门前也插上柳枝。纸龟、柳枝与泥龙在这里共同承载盼雨的愿望；本次核到的是《中国镇物》的转引，并未另核原始调查地点。
  source_numbers:
  - 1
  map_label: 天津
  location_note: 天津市中心区域参考点；引文未明确具体乡村或仪式地点。
case_cn_tao_w3_huzhou_red_cloth_brides:
  kind: story
  paragraphs:
  - 湖州一则传说讲，一家嫁女，迎亲队伍途中遭遇狂风。轿子抵达夫家后，轿帘掀开，里面竟坐着两个一模一样的新娘，连父亲也无法分辨。
  - 县令令人架起红幔，让两人依次走过：一个哭着踩下布幔，另一个轻轻走过却不见布动。县令识破后者，妖怪化作风逃走。书中以此解释当地踩红幔的婚俗，本次未独立查阅其所引《湖州市故事卷》。
  source_numbers:
  - 1
  map_label: 浙江湖州
  location_note: 湖州市城区代表点；流传地区不等于故事中的宅院或采录点。
case_cn_tao_w3_sanming_wedding_lamp:
  kind: history
  paragraphs:
  - 书中记福建三明市三元区一些山村的迎亲队伍，走在前方的是火把；另有手提的半圆形吊灯，灯面开孔，灯中燃松明，夜里望去像一团移动的火。
  - 当地说法将灯火视为压住山间精怪的保护。书只指出区域和用途，未提供确切村名与采录日期；其脚注所引婚俗材料本次未独立查核。
  source_numbers:
  - 1
  - 2
  map_label: 福建三明
  location_note: 三明城区参考点；原书称三元区山村，没有给出具体村名和年代。
case_cn_tao_w3_xiangxi_wedding_rooster:
  kind: history
  paragraphs:
  - 书中引湘西苗族婚礼材料：花轿到了男方家，主持者先用祝语迎接新人，又手持雄鸡念唱，表达驱除不祥、迎接吉兆的愿望。
  - 记录还提到鸡冠取血等仪式细节。这里呈现的是作者引用的特定历史材料，不把它推广为所有苗族或湘西家庭的共同习俗，也不推定仪式有效。
  source_numbers:
  - 1
  map_label: 湖南湘西
  location_note: 以吉首作为湘西宽区域参考，书中未记具体村落，不能视为吉首现场。
case_cn_tao_w3_mojiang_wedding_baimu:
  kind: history
  paragraphs:
  - 书中记载，墨江一带一则哈尼族迎亲材料中，请被称为“白母”的仪式主持者，为将入门的新娘举行除秽仪式。记述提到饭水、鸡和祝念等要素。
  - 这是一条有地域范围的书面记录，具体村落与采录时间未明；它不能概括全部哈尼族婚礼，也不等于对仪式效果的证明。
  source_numbers:
  - 1
  map_label: 云南墨江
  location_note: 墨江县城区域参考点；书中只写墨江一带，未给出具体村落。
case_cn_tao_w3_changzhou_wangshai:
  kind: history
  paragraphs:
  - 《中国镇物》记常州旧时迎亲，花轿后面有人把米筛用红布绑在竹竿上，再悬上一盏灯，称作“旺筛”。它随着迎亲队伍移动，既是一件器物，也被赋予保护新人的含义。
  - 书中与杭州、泉州的持筛习俗并列举例，表明相似物件可以出现在不同的迎亲场面，并不说明各地是同一个故事或来自同一次采录。
  source_numbers:
  - 1
  map_label: 江苏常州
  location_note: 常州市城区参考点；所记旧俗未给出具体街村或年代。
case_cn_tao_w3_quanzhou_wedding_sieve:
  kind: history
  paragraphs:
  - 书中提到泉州迎亲时，用米筛遮护新人的头部和面部，并由送嫁者专门持筛。家常筛具因此进入婚礼队伍，成为人们认作可以护佑新人的器物。
  - 作者把这类观念与筛孔、网眼的形象联系起来；这是书中提出的解释，不是可以独立验证的防护机制。记述并未指出某场婚礼的时间或地址。
  source_numbers:
  - 1
  map_label: 福建泉州
  location_note: 泉州市城区参考点；书中所记迎亲习俗没有精确地名。
case_cn_tao_w3_beijing_wedding_carriage:
  kind: history
  paragraphs:
  - 在书中介绍的北京旧时迎亲习俗里，人们绕着花轿用香火熏照，又以镜子和书中所称“宪书”向轿内照看，期望驱散不祥。
  - 这一段被放在“暖轿、亮轿或熏轿”的讨论中。它描述的是未经单独田野复核的旧俗材料，不说明每个时代的北京婚礼都如此。
  source_numbers:
  - 1
  map_label: 北京
  location_note: 北京城区参考点，不指具体婚礼现场；记录年代及辖域未详。
case_cn_tao_w3_nanjing_wedding_carriage:
  kind: history
  paragraphs:
  - 书中记南京旧时在发轿前点燃纸张，并在轿内移动火光，用以“暖轿”。轿子即将载新人出发时，仪式为即将开始的旅程增添了祈安的意义。
  - 这与书中北京绕轿用香火、杭州预备烛火的写法并列，属于作者所收集的不同地区材料；它们不能自动视为互相传播的证据。
  source_numbers:
  - 1
  map_label: 江苏南京
  location_note: 南京城区参考点，不指具体婚礼现场；记录年代及辖域未详。
case_cn_tao_w3_hangzhou_wedding_candles:
  kind: history
  paragraphs:
  - 书中记述杭州旧时迎亲前夜以烛火照护花轿，称作“亮轿”；花轿迎亲回来时也点烛，借此防备人们想象中潜入轿内的不祥之物。
  - 它与北京的熏轿、南京的暖轿都把光带进婚礼，却各有记述细节。年代、采录地点和如今的延续情况，本条所查来源没有交代。
  source_numbers:
  - 1
  map_label: 浙江杭州
  location_note: 杭州市城区参考点，不指具体婚礼现场；记录年代及辖域未详。
case_cn_tao_w3_zhoushan_boat_soul:
  kind: history
  paragraphs:
  - 书中记录舟山渔民造船时安置“船灵魂”的说法：一小块木头中放入银元或铜钱，再装进船舱内的木构件。船尚未出海，祝愿已先被安放在船身里。
  - 当地人把它视为避开海上意外的保护物。作者注释转引金涛《舟山渔民风俗调查》；本次直接查阅的是《中国镇物》，未独立核对该调查，也不推定器物能防止事故。
  source_numbers:
  - 1
  map_label: 浙江舟山
  location_note: 舟山市城区参考点，并非渔船所在港口或船户住址。

case_cn_hanyi_festival_winter_robes:
  kind: history
  paragraphs:
  - 《中国鬼文化大辞典》序一第 9 页转引《上海文化艺术报》1990 年 3 月 9 日的报道，称沈阳、大连、鞍山、本溪、丹东等地在正月十五、清明、七月十五和十月初一等日子可见焚烧黄包装纸的现象。书中这一段是对报纸的转引，并非明确记载 1990 年十月初一的一次实地观察；原报版面尚未独立核对。
  - 农历十月初一在一些地区有祭祖、送寒衣的习俗。清代《燕京岁时记》记载北京送寒衣的风俗；《梦粱录》卷六则记十月初朝廷授衣及士庶扫墓。两者可作为不同时代的文献对读，不应将其细节直接套入丹东的转引报道。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国辽宁丹东（并参华北及江南岁时传统）
  location_note: 地图以丹东市区为地域参考。辞典序一转引的报道涉及东北多个城市，并未给出丹东具体街口；纸衣形制需另据其他资料核对。
case_cn_quanzhou_dachengxi_soul_rescue:
  kind: history
  paragraphs:
  - 泉州打城戏又称法事戏、和尚戏或道士戏，是在僧道法事仪式基础上发展起来的地方戏曲，流行于泉州、晋江等地。演出与“做功德”等民间仪式有关，也有叠桌翻跳、吃火吐火和鬼舞等表演。
  - 泉州市人民政府资料将其发端归于清代咸丰年间，并称光绪十七年形成戏班；相关研究对形成过程仍有讨论。2008 年，打城戏列入第二批国家级非物质文化遗产代表性项目名录。此处与《中国鬼文化大辞典》的鬼戏分类作主题对读，不能据此认定字典记载了本条所有地方戏细节。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 中国福建泉州（鲤城、晋江、南安一带）
  location_note: 泉州打城戏发源于清代咸丰至光绪年间的泉州府及晋江、南安、厦门一带僧道普度超度道场，2008 年列入国家级非物质文化遗产代表性项目名录，现存传习所设于泉州市区。
case_cn_yijian_changgui_tiger_ghost:
  kind: story
  paragraphs:
  - 《太平广记》卷四百二十八〈宣州儿〉注明出自《广异记》。故事说，宣州一名孩子多次看见鬼引虎追赶，预料自己若被虎吃掉也会成为伥，于是请家人在路上设陷阱。后来他果然死于虎口，并托梦提示父亲设阱；父亲与村人最终捉到老虎。这是志怪叙事，不能据此证实故事人物或事件。
  - 同书卷四百三十〈马拯〉另有一群伥鬼走在虎前、触发猎人弩机的情节；它与〈宣州儿〉是不同故事，不应合并为同一情节。伥鬼母题后来也常用来讨论受害者被迫帮助施害者的处境，但各文本的结局并不相同。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 中国安徽宣城（唐代宣州治所，并及江南与巴蜀多虎山区）
  location_note: 《宣州儿》叙事地点为唐代宣州；地图采用今安徽宣城市区作区域参考，并不表示故事发生在该市区的具体地点。
case_cn_eastern_han_dou_song_wugu:
  kind: history
  paragraphs:
  - 《后汉书·清河孝王庆传》记载，宋贵人病中写信让家人求取“生菟”，信被窦皇后截获。窦后据此诬称她以此施行蛊道祝诅，宋氏母子逐渐失宠。建初七年（82 年），太子刘庆被废为清河王，宋贵人姐妹经审讯后服药自尽。原文所称“生菟”在此保留原字，不将其解释为未经核实的食物或药材。
  - 邓启耀《巫蛊》第五章第二节在讨论权争与巫蛊时引述这段《后汉书》材料。可将其作为史书所记宫廷指控与权力竞争的案例；文献中的指控不等于宋贵人确有施蛊行为。
  source_numbers:
  - 1
  - 2
  map_label: 中国河南洛阳（东汉洛阳南宫掖庭及北寺狱史料参照）
  location_note: 东汉章帝朝洛阳宫城与北寺狱发生此案，坐标取汉魏洛阳故城区域作都城史料参照。
case_cn_zhouli_shushi_chugu:
  kind: history
  paragraphs:
  - 《周礼·秋官司寇》记有“庶氏”掌除毒蛊，并列出“攻说”和“嘉草”等做法。邓启耀《巫蛊》第二章第一节引用此条及郑玄注释，讨论祈祭和药草熏治的不同解释。
  - 《周礼》是一部礼制文本；其中职官安排并不能单独证明这些制度在每个时期都按文本实际运行。把它与《左传》中的论蛊段落并读，可以看到古代文本对虫、病与蛊的不同表述，但不宜直接认定后世法律和医疗传统都由这一官职演化而来。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 中国河南洛阳（东周成周王畿《周礼》礼制史料参照）
  location_note: 《周礼》礼制构想与成书渊源多系于东周王室与齐鲁礼学，地图取东周王畿洛邑区域作典制参照。
case_cn_southwest_gu_ordeal_judgment:
  kind: research
  paragraphs:
  - 邓启耀《巫蛊》第八章第一节转引云南怒江文史资料中的傈僳族口述：1929 年，一场关于“杀魂”的指控引发村社纠纷，被指控者被要求以捞油锅接受神判；书中说其手被烫伤，随后产生赔偿和驱逐争议。这里记录的是书中转述的口述材料，不把指控当成事实。
  - 这则材料呈现了以身体伤害和集体压力处理争议的危险，也说明口述者如何回忆当地纠纷。它不能证明某种神异力量，也不足以推断西南所有村寨都采用相同程序；具体地点、当事人口述及原始文史材料仍待进一步核对。
  source_numbers:
  - 1
  - 2
  map_label: 云南怒江（州府附近作区域参考）
  location_note: 书中转述云南怒江文史资料中的村庄口述；地图点取怒江州府附近作为区域参考，不代表所述村庄的具体位置。
case_cn_dujiangyan_libing_stone_rhino:
  kind: history
  paragraphs:
  - 《华阳国志》记述李冰治水时制作五头石犀以“厌水精”。这一叙述属于古人对治水与镇护的记载；另有石人测水位的文献线索，不能把石人的水位标记直接说成每头石犀的功能。
  - 2012 年底至 2013 年初，成都天府广场东北侧出土一尊巨型红砂岩石犀，现藏成都博物馆。博物馆研究者提出它可能是文献所记石犀之一；由于缺少决定性证据，其确切年代及与李冰五石犀的关系仍应保留讨论空间。出土实物不能单独证明当地持续存在沉水石犀的习俗。
  - 都江堰工程与石犀叙述可以分别作为水利工程和象征性镇护的阅读线索。两者并置不等于证明石犀具有控制洪水的作用。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国四川成都都江堰（战国秦蜀守李冰“石犀镇水”与鱼嘴分水古堰参照区）
  location_note: 古籍记李冰于蜀郡修都江堰并刻立石犀五头厌镇水精、分置石犀渠与府市石牛门；坐标取都江堰鱼嘴古堰参照点，成都天府广场考古遗址亦同属成都平原岷江水系文化带。
case_cn_minzhe_boat_eye_dotting:
  kind: story
  paragraphs:
  - 在福建与浙江沿海的传统木质海船、福船及渔船建造工坊里，船体合龙、水密隔舱砌缝竣工而尚未滑轨下水之际，必举行庄重严谨的“画眼点睛”（又称“安船眼”“开光点龙睛”）仪礼。造船匠首依据船型功能严格设定船首两侧凸雕木眼的瞳孔朝向：远洋商船与福船须将黑睛画作平视正前方，取“瞭望风信、明辨航道暗礁”之意；近海作业渔船则令黑睛微斜向下俯视，寄寓“洞见海底鱼群虾蟹”；而地方口述（如浙江玉环《船眼的传说》）更衍生出渔家孝女捐眼指引父亲避礁的动人母题。
  - 这场点睛仪礼构成整套水行镇物链条的最终激活环节：待船身内部先依序封入钱币、镜片或“船灵魂”木块后，未点睛的船眼暂以红绸遮覆，寓意尚待通灵。下水吉时一到，船主与掌墨师先备三牲糕果敬拜妈祖与水府龙神，随即用新毛笔蘸朱砂墨或雄鸡冠血点亮眼仁、揭落红布并鸣放鞭炮敲锣催船入海，期盼新船由此获得“自辨危途、震慑风浪蛟龙”的生灵感知（行旅水神镇物线索参照陶思炎 1998 书目）。
  - 将“画眼点睛”仪式与 2010 年列入联合国教科文组织急需保护名录的“水密隔舱福船制造技艺”并置阅读，能够清楚区分航海信心仪轨与造船物理科学：福船之所以在宋元以来远航南洋抗击风浪，依靠的是横置水密隔舱板阻断局部破损进水、樟松木榫接与桐油灰麻绳捻缝密闭，以及罗盘、牵星板与季风经验；船首木眼并无光学探鱼或物理驱蛟之功，但它作为完工验收、敬海戒慎与全船船员出海前的集体安全动员，长期发挥着稳固海员心理定力与协作纪律的作用。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国福建福州及泉州、浙南沿海（传统福船造船与木船“画眼点睛”礼仪核心区）
  location_note: 福船“画眼点睛”开光礼与船眼朝向规制流传于福建福州、泉州晋江、宁德蕉城及浙江温州、台州玉环等沿海造船港湾，坐标取福州闽江口作东南造船民俗参照区。
case_cn_fengxiang_clay_tiger_guardian:
  kind: story
  paragraphs:
  - 在陕西关中凤翔（古称雍州）城关镇六营村一带世代传承的彩绘泥塑（俗称“泥货”“泥耍货”）与木版年画体系中，最受乡民珍视的并非单纯陈设玩赏，而是兼负护宅与护幼之职的“镇宅神虎”（包括墙面悬挂的彩绘虎头“挂虎”、立座“坐虎”以及木版套印的“下山虎”门画）。匠人取当地板板黄土揉入纸筋与棉花絮，以石膏或泥模压坯阴干后通体刷敷白粉底，再以大红、明绿、黑墨与金黄重彩勾绘火焰双眉、额前大“王”字及莲花石榴暗纹，使威猛山兽呈露出既庄严威吓又饱满喜庆的视觉张力。
  - 这种户内悬虎传统上承东汉应劭《风俗通义·祀典》所论“虎者，阳物，百兽之长也，能执搏挫锐，噬食鬼魅”。昔日关中农家每遇新屋落成、春节岁换或新生儿满月、周岁之际，亲友常购置凤翔泥塑挂虎或木版镇宅神虎挂于大门门楣、中堂中柱或婴儿床头，既祈求猛虎阻拦疫鬼与邻里邪煞入户，亦祝愿幼童免受夜惊而如虎健壮；此外当地亦配有谷雨“神鸡蝎符”等木版驱虫镇纸，构成由大到小、从屋室至童稚的关中镇物网（参照陶思炎 1998 书目对人工、护儿及岁时镇物的系统梳理）。
  - 结合 2006 年国家级非遗“凤翔泥塑”保护档案与物质文化史观察，镇宅神虎在当代已实现从“威慑驱鬼厌胜”向“乡土造型艺术与生肖喜庆信物”的温和转型：悬于客厅的虎头挂片本身并无物理防盗或超自然辟邪之力，其真正生命力植根于黄土泥坯加麻絮防裂的朴素材料智慧、关中女性与泥塑世家的手工协作，以及亲友馈赠“泥虎”时传递的护佑亲情；同时当代工艺传承亦强调选用环保安全水彩颜料，避免传统铅白、矿石色料对幼儿日常接触产生安全隐患。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国陕西宝鸡凤翔区城关镇六营村（凤翔彩绘泥塑与民间木版镇宅神虎核心区）
  location_note: 陕西凤翔彩绘泥塑（当地称“泥货”）及木版年画镇宅虎长期集中制作于宝鸡凤翔城关镇六营村一带，坐标取凤翔六营村一带作非遗民间工艺地理参照点。

case_cn_fan_zhen_shenmielun_debate:
  kind: history
  paragraphs:
  - 《梁书》记载，范缜曾在信奉佛教的竟陵王萧子良座上讨论因果。面对贫富差异的问题，他以同树之花随风飘落、境遇各异作比喻，质疑把世间贵贱归于因果报应。史书接着载录他的《神灭论》，讨论人的形体与精神是否可以分离。
  - 范缜把形体和精神比作刀与刀的锋利：在他的论证里，两者名称不同，却不能脱离彼此独立存在。这里呈现的是南朝典籍中的哲学论辩，不能以此判定任何具体鬼怪传闻的真伪；古籍成文、交锋顺序与现代学术解释仍须分开看。
  source_numbers:
  - 1
  map_label: 中国江苏南京（古建康的城市参照）
  location_note: 坐标取南京市中心，仅作古建康的城市参照；不能据此确定萧子良讲席的具体位置。
case_cn_lingnan_maishui_yankou_rite:
  kind: story
  paragraphs:
  - 钟丽美记录的增城客家丧礼中，亲人离世后，家属要到河边“买水”：晚辈带着瓦罐，在长者和亲属陪同下向水中撒钱、取水，再将水带回，用纸蘸水擦拭逝者的手脚和脸。
  - 记录者解释，当地人认为经过这一礼仪得到的水适合用来为逝者净身；各村具体做法会有差异。泉州另一项民俗普查也记录过向井中投钱求水的做法，可作为不同地点的比较，不能据此把两处仪式拼成一场事件。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 中国广东广州增城区（区域参考点）
  location_note: 坐标采用 GeoNames 的增城行政区域参考点；文章未提供具体村庄或仪式现场，不表示该点发生过所述丧礼。
case_cn_soushen_song_dingbo_ghost:
  kind: story
  paragraphs:
  - 相传南阳青年定伯夜行时遇见一只鬼。他自称也是鬼，与对方结伴，还套问出鬼害怕人的唾液。快到宛城时，定伯把鬼担到市上；鬼变成羊，他便向羊吐唾沫，卖了一千五百钱。
  - 《太平御览》引《搜神记》的这一版本将他写作“宗定伯”，现代通行叙述常作“宋定伯”；同一故事在版本、措辞和结尾上有差异。这个志怪故事以人的机智反转遇鬼的惊惧，属于文学与民间叙事，而不是对鬼怪存在的历史证明。
  source_numbers:
  - 1
  map_label: 中国河南南阳（“南阳”“宛市”的城市参照）
  location_note: 坐标取南阳市城市参考点；“宛市”是故事中的地点，不据此定位古代市集遗址。
case_cn_liangshan_yi_xiaobu_rite:
  kind: report
  paragraphs:
  - 在凉山义诺彝区的田野记录中，“晓补”是由毕摩主持的春季反咒仪式。研究者巴莫曲布嫫记述，一些家庭在春天准备草扎的鬼偶和树枝，邀请毕摩诵念、祭请神灵，最后将仪式物送出家门，表达驱除不祥、祈求家人平安的愿望。
  - 这类仪式既有按季节举行的形式，也可能因具体处境临时举行。仪式所涉及的鬼灵和反咒是当地信仰的叙述方式；把它与口传经文和家庭仪式作比较，并不证明其有超自然效力，也不能概括为已经证实的纠纷调解制度。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 中国四川凉山彝族自治州（以西昌作州域参照）
  location_note: 地图点为凉山州府西昌的区域参考；所引田野材料涉及美姑等地，不能把这个点当作仪式发生的村落。
case_cn_tang_qianjin_gu_antidotes:
  kind: history
  paragraphs:
  - 《备急千金要方》的传世版本中有“蛊毒”条目，列述古人对腹痛、出血等症状的认识，也把药物、灸法和对鬼魅的解释写在一起。《外台秘要》卷二十八目录同样分列“中蛊毒”“蛊吐血”等门类，显示唐代医书如何收集、组织这类疾病记述。
  - 这些文献把当时的病症观察、药物经验和信仰观念并置，不能简单描述为古人已经把巫蛊完全转化为现代毒理学。书中的古方只是医学史资料，并非经现代检验的解毒方法；遇到疑似中毒应及时寻求专业救治。
  source_numbers:
  - 1
  - 2
  map_label: 中国陕西西安（唐代长安的城市参照）
  location_note: 坐标为西安城区参考，表示唐代长安文化背景，并非医书某一方剂的编撰或实施地点。
case_cn_nujiang_cliff_spirit_rite:
  kind: report
  paragraphs:
  - 邓启耀回忆 1995、1996 年在怒江峡谷调查时，当地人曾告诫他不要在太阳照进村北箐沟之前进入。讲述者说，两侧山崖有邪灵活动，人若在不合适的时候经过，可能遭遇不祥；出了事故或有人发病时，有人会请巫师祭祀崖神箐鬼。
  - 这段材料记录的是调查者听到的地方信念与口述经验，并非已证实的超自然事件。山路、峡谷和村落在这些讲述中带有社会意义；由于原文没有给出可以确定的具体地点，地图只标示怒江地区的参考位置。
  source_numbers:
  - 1
  map_label: 中国云南怒江峡谷（区域参照）
  location_note: 所引回忆未给出“村北箐沟”的确切村名；坐标取福贡县城作怒江峡谷范围参考，不代表该村、调查现场或个人住址。
case_cn_han_huangshen_yuezhang_seal:
  kind: history
  paragraphs:
  - 陶思炎《中国镇物》刊有数种“黄神越章”印文，并将图 242 标为东汉印。书中引用《抱朴子》对入山护身的描述：有人携带此印，以印泥布置四方，相信可以防范虎狼和山川神祟。
  - 《抱朴子》还叙述道士以印泥镇制水中大鼋的传说。书页中的印章形制、文献故事和后文其他地券资料应分别辨认；目前材料不足以把图中某枚印确定为洛阳墓葬封泥，也不能将文献中的辟邪效果当作考古事实。
  source_numbers:
  - 1
  - 2
  map_label: 中国河南洛阳（汉晋历史背景的城市参照）
  location_note: 洛阳坐标用于表示汉晋历史背景；图版所示印章的具体出土地未在所核书页注明，不能将此点标成发现地点。
case_cn_shangzhou_jade_cicada_yuhan:
  kind: history
  paragraphs:
  - “琀”是入殓时放在死者口中的物品，可以是贝、玉片或动物形玉器。陶思炎《中国镇物》图 269 将蝉形玉琀标为商周，并把它放在有关魂灵与再生观念的讨论中；这一图版本身没有在所核页注明具体出土地点。
  - 中国国家博物馆的说明区分了商代墓葬中的多种口含物与战国至汉时期较常见的玉蝉。蝉的蜕变常被用来表达对再生的期望，而这是一种丧葬观念，不能当作玉器能够保存遗体的科学证据。不同玉蝉也可能是佩饰或冠饰，并非都用作口琀。
  source_numbers:
  - 1
  - 2
  map_label: 中国河南安阳（商周文化区域参照；图版出土地未注明）
  location_note: 坐标为安阳城市参考；陶思炎书中图 269 没有在本页注明出土地，不能把地图点当作该件文物的出土地点。
case_cn_sichuan_zhangxian_tiangou_ward:
  kind: story
  paragraphs:
  - 在一些民间护儿图像里，张仙手持弹弓，对着天空中的天狗，身旁伴有儿童。陶思炎《中国镇物》收录两幅“张仙送子”图，并记下天狗会伤害幼儿、张仙能将它吓退的民间说法；这些图像寄托的是家人对孩子平安成长的期盼。
  - 地方志还转录过一方题为苏洵跋语的张仙画像碑，讲述求画祈子的故事，但其署名及流传经过仍需进一步考证。《中国镇物》所述孟昶与花蕊夫人的故事也属于人物原型传说，不宜将不同时期的故事合并成一段已证实的历史。
  source_numbers:
  - 1
  - 2
  map_label: 中国四川成都（民间信仰文献中的城市参照）
  location_note: 坐标为成都城市参考；后世碑记提及成都玉局观，所引《中国镇物》图版未给出该版画的具体制作地点。
case_gr_corfu_gorgoneion_apotropaic:
  kind: history
  paragraphs:
  - 1911 年起，考古人员在希腊科孚岛帕莱奥波利斯一带发掘阿尔忒弥斯神庙，其石构山花现藏科孚考古博物馆。山花中央是体量巨大的戈尔工形象：面孔正视观者，獠牙毕露，身体呈古风时期常见的屈膝奔跑姿势；两侧可见豹、飞马珀伽索斯及其他人物。博物馆介绍将作品年代约定为公元前 585 年。
  - 戈尔工形象常被研究者联系到古希腊驱邪护身的视觉传统。面具式戈尔工头像也见于盾牌、建筑和器物；具体作品的用途仍需结合材质、出土背景和时代判断。赫西俄德《神谱》记有美杜莎与珀伽索斯、克律萨俄耳的神话谱系，但诗歌并非这件石雕创作过程的直接记录。
  - 将科孚神庙山花与东亚门庭的守护造像并读，可以比较不同社会如何在空间边界安置醒目的形象。这是一种主题比较，本例并无足以证明两地造像直接传播的证据。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 希腊科孚岛帕莱奥波利斯（神庙所在区域参照；山花现藏科孚考古博物馆）
  location_note: 坐标为科孚岛帕莱奥波利斯附近的城市级参照点；山花现藏科孚考古博物馆，不应视为当时雕像的精确出土地测量值。
case_eg_thebes_heart_scarab_amulet:
  kind: history
  paragraphs:
  - 古埃及人常把象征新生的甲虫护符置于木乃伊胸前。大都会艺术博物馆藏一件新王国时期的人首护心圣甲虫（馆藏号 30.8.1080），由玄武岩、青铜和残留金箔制成，平底刻有十行《亡灵书》第 30B 章文字；馆方只将其地理来源记录为“埃及”。
  - 较早的王室实例包括大英博物馆 EA 7876：绿色碧玉甲虫安置在金座上，铭文写有 Sobekemsaf 王名。关于它究竟属于哪一位同名国王、最初发现于何处，研究者仍有不同判断。第 30B 章护心咒祈求亡者的心在审判中不要作不利证言；心脏在古埃及观念中与思想、记忆和道德判断相连。
  - 从器物和葬仪文本出发，可以观察生者如何为亡者准备通向来世的护符。与其他地区墓葬护符并读时，应分别说明材料、文献和出土背景；跨文化主题相似不构成传播关系的证明。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 埃及（卢克索附近文化区域参照；馆藏出土地未确定）
  location_note: 卢克索及底比斯西岸为古埃及相关丧葬传统的区域参照；EA 7876 的发现背景有争议，大都会博物馆 30.8.1080 的馆藏页仅标明出自埃及，地图点不代表两件器物的确定出土位置。
case_mx_aztec_mictlan_nine_realms:
  kind: story
  paragraphs:
  - 十六世纪《佛罗伦萨抄本》记载，在墨西哥谷地的纳瓦人观念中，一些因疾病等原因去世的人会前往亡者之地米克特兰，那里有冥王米克特兰特库特利及其配偶。亲属准备随葬物，并按传统为逝者举行仪式，帮助他们踏上旅程。
  - 不同版本对冥途的安排并不完全相同。墨西哥国家人类学与历史研究所期刊的文献对照指出，《佛罗伦萨抄本》与《梵蒂冈 A 抄本》所列关卡及先后次序不同：前者所述旅途包含相撞的山、寒冷荒地、锋利之风与河流；后者把渡水位置列在较早处，也出现受箭袭击与食心之地。相关记述中，犬帮助亡者渡水；四年旅程与悼念亦见于这些传统的研究。
  - 墨西哥城的地图点代表特诺奇蒂特兰与相关文献传统，而不是冥界所在的现实地点。将伴行犬与其他文化的渡冥叙事并读，有助于比较死亡与哀悼的表达，但不能由此断定各传统之间存在传播关系。
  source_numbers:
  - 1
  - 2
  map_label: 墨西哥城（特诺奇蒂特兰及纳瓦文献传统的城市级参照）
  location_note: 墨西哥城坐标为特诺奇蒂特兰及纳瓦文献传统的城市级参照，冥界关卡属于叙事空间，不对应现实地点。
case_us_bloody_mary_mirror_troxler:
  kind: legend
  paragraphs:
  - “血腥玛丽”是一种在美国等地流传的镜前试胆游戏：参与者在昏暗空间面对镜子，反复呼唤名字，并讲述镜中可能出现的人影。次数、场地和结局随讲述者而异。民俗学家 Alan Dundes 于 1998 年发表对多个版本的分析，将其放在青少年仪式和象征解释的讨论中；这一解释是研究观点，不是所有参与者共同的动机。
  - 2010 年 Giovanni Caputo 报告一项镜面注视观察：50 名年轻成人在昏暗房间面对镜子十分钟，事后书写自己的体验；其中 66% 描述自己的脸发生明显变形，另有人报告看见其他面孔、动物或怪物形象。这些是该小样本中的自述结果，不能直接视为总体发生率，也未直接验证“血腥玛丽”游戏中每次体验的成因。
  - 视觉适应与特克斯勒消逝可能参与部分面部特征淡化，但新面孔体验的完整机制仍在研究。把民俗文本与视觉实验并读，有助于区分参与者的主观经历、口传解释和实验条件。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 美国加利福尼亚州伯克利（民俗学者 Dundes 任职机构所在城市的研究参照）
  location_note: 伯克利是民俗学者 Alan Dundes 的任职机构所在地，用作研究参照点；不是这一游戏的已知发源地，也不是 Caputo 实验所在地。
case_uk_coventry_infrasound_189hz_lab:
  kind: history
  paragraphs:
  - 工程师 Vic Tandy 在 1998 年与 Tony Lawrence 合著论文，回忆自己曾在医疗设备公司实验室工作时感到不安，并在余光中看见模糊人影。第二天，他将击剑剑条夹在台钳上加工时，注意到剑条振动；移动剑条后，振动在房间不同位置发生变化。他与同事关闭新安装的排风扇后，所观察到的振动消失。
  - 作者根据约 30 英尺的房间长度和声速计算出可能的驻波频率约为 18.98 Hz，并提醒这一数字只是粗略估计；论文明确说当时没有仪器测量次声声压。作者据此提出低频振动可能与异常视觉体验有关，这是一项基于个案的假设，并未直接测定视觉改变的成因。
  - 2009 年 French 等人的“Haunt”项目让 79 名参与者在受控空间中接受次声、复杂电磁场、两者同时或均不暴露的条件，并事先告知可能出现异常感受。研究发现报告的感受数量与实验条件无关，而与颞叶体验量表得分有关。两项研究并读，能帮助区分可观察到的振动、推算出的频率，以及尚待验证的主观体验解释。
  source_numbers:
  - 1
  - 2
  map_label: 英国考文垂（论文作者所属机构所在城市参照；原车间精确地点未核实）
  location_note: 考文垂市中心为作者所属机构的城市级参照；原文没有提供可核验的车间街址，坐标不标示实验室精确位置。
case_us_blair_witch_1999_viral_ostension:
  kind: legend
  paragraphs:
  - 1999 年电影《女巫布莱尔》以“寻获录像”的形式讲述三名学生在马里兰州森林调查女巫传说后失踪的虚构故事。影片用手持镜头、黑白胶片与彩色视频交替呈现他们迷路的过程；真实村镇布尔基茨维尔进入了这套虚构叙事。
  - 发行方与创作者将网站、假新闻访谈、失踪寻人海报和电视伪纪录片编织成电影体验的一部分。匹兹堡大学保存的宣传档案收录了海报和相关资料；电影学者 J. P. Telotte 在 2001 年讨论了网站、影片叙事与传统宣传如何共同制造似真效果。
  - 这一案例可与后来的网络虚构档案及参与式恐怖叙事作主题比较，但现有材料不足以证明它直接导致某个具体网络作品或创作社群诞生。电影故事和伪档案归入 F 级虚构；电影、宣传与大学馆藏本身是可查证的现实资料。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 美国马里兰州布尔基茨维尔（电影叙事关联村镇，地区参照）
  location_note: 马里兰州布尔基茨维尔为电影虚构设定与宣传叙事所关联的真实村镇，坐标为地区参照，不代表真实失踪事件。
