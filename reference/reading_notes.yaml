# Original reading notes keyed by vault ID. Source numbers follow the card's
# citations, followed by any additional public references below.
case_cn_forbidden_city_palace_shadows:
  kind: legend
  map_label: 故宫
  location_note: 紫禁城建筑群内的故宫博物院地标，传闻无具体宫墙位置。
  source_numbers: [1, 2]
  paragraphs:
    - 流传的一个版本说，雷雨中的故宫红墙上突然映出一队宫女，身影转瞬消失。后来的讲述常把这次目击安在 1992 年，也有人把红墙说成能存下并重现影像的天然“录像带”。
    - “墙上出现宫女”的说法至少在 1981 年就已有公开回应。《人民日报》当年转述故宫办公室来信，称工作人员调查与查档均未找到支持。2023 年，故宫研究馆员周乾被问到 1992 年版时也指出，缺乏可信材料证明那次目击。

case_cn_harbin_cat_faced_granny:
  kind: legend
  map_label: 哈尔滨道外
  location_note: 道外区一带是流传版本所提及的范围，点位为城区参考。
  source_numbers: [1, 2, 4]
  paragraphs:
    - 哈尔滨流传的版本说，一位住在道外的老太太买菜回家时倒地，一只猫从她身上跃过。她再站起来时，半边脸已变成猫脸。故事又说她会在天黑后出没，专找落单的孩子。
    - 报刊回述把传闻与 20 世纪 90 年代哈尔滨儿童结伴回家、腕上系红绳的说法联系起来。第十三层的讨论还留下了“猫从守灵中的遗体上跳过”的变体。1995 年是回述所给的年代。

case_cn_duxi_forest_1994:
  kind: report
  map_label: 贵阳都拉营
  location_note: 都拉营附近为报道涉及区域的参考点。
  source_numbers: [1, 2, 3]
  paragraphs:
    - 1994 年末，贵阳北郊都溪林场大片松树折断，附近都拉营车辆厂也有设施受损。记者后来到林场回访。有守夜人员和居民回忆，受损之前听到了类似列车的巨响，还有人看见强光划过，于是出现了“空中怪车”的叫法。
    - 央视与《瞭望东方周刊》的回访把事发日分别记为 11 月 30 日和 12 月 1 日。曾参与调查的高登义提出伴有强雷电的陆龙卷解释，其他受访者仍对成因有分歧。

case_cn_shanghai_dragon_pillar:
  kind: legend
  map_label: 延安高架龙柱
  location_note: 延安高架与南北高架交汇位置。
  source_numbers: [1, 2]
  paragraphs:
    - 上海两条高架交汇处，有一根饰着盘龙的巨大桥柱。市民流传的故事把打桩困难归因于触动地下的龙，讲述者说施工方请僧人到场，后来在墩柱上加了龙纹。
    - Yuting Cai 的论文记录了家人讲述的版本，工程刊物也记录了桥柱及施工困难。两处材料提到的寺院名称不同，留下了同一传说在口述中变形的痕迹。

case_cn_chaonei_81:
  kind: legend
  map_label: 朝内 81 号
  source_numbers: [1, 2]
  paragraphs:
    - 朝阳门内大街 81 号曾有两幢长期闲置的洋楼。一种流传说法把其中一座楼同一位军官的太太联系起来，称她在楼里身亡，后来有人听到响动。记者在 2013 年夜访时，记录的是这类故事围绕空楼传播的情形。
    - 2016 年的实地报道记录了院落修缮与房屋权属。这些建筑史线索和恐怖片《京城 81 号》的情节，可以分别对读。

case_cn_beijing_ghost_bus:
  kind: legend
  map_label: 北京
  location_note: 城市传播地参考点，各版本所称线路和站点不同。
  source_numbers: [1, 2]
  paragraphs:
    - 北京高校里流传过一个末班公交的故事：深夜最后一趟车驶出后，车与售票员一同消失。有人把它说成 375 路，也有人讲成 330 路、347 路或 333 路，故事随着讲述者换了线路。
    - 一篇清华校友访谈回忆，类似传说在 20 世纪 90 年代已经流传。车次和地点会变，但“晚归者身边的一辆寻常公交忽然失踪”始终是故事的核心。

case_cn_beixinqiao_dragon_well:
  kind: legend
  map_label: 北新桥
  location_note: 标记当代北新桥路口及地铁站一带。
  source_numbers: [1, 2, 3]
  paragraphs:
    - 老北京传说里，姚广孝把兴风作浪的龙锁进井中，答应等桥旧了再放它出来。桥便叫了“北新桥”，在故事里一直“新”下去。另一段口述说，牵动井中沉重的铁链，就会听到井底发出轰鸣。
    - 东城区采访里的老居民把长辈所说的方位指向今天的地铁站 B 口附近。报刊调查另外记录了这一带的旧桥和发掘出的水井。

case_cn_hk_high_street_haunted_house:
  kind: legend
  map_label: 西营盘高街
  source_numbers: [1, 2]
  paragraphs:
    - 香港西营盘高街 2 号的花岗石拱廊，原属一座医护人员宿舍，后来纳入精神科医疗设施。建筑空置多年后，附近流传起夜里有哭喊声和异响的故事，“高街鬼屋”逐渐成了它的绰号。
    - 古物古迹办事处记载，旧楼曾改作女病房和日间门诊，随后重建成社区综合大楼，保留的花岗石立面于 2015 年列为法定古迹。

case_cn_tw_minxiong_liu_mansion:
  kind: legend
  map_label: 民雄刘家古厝
  source_numbers: [1, 2, 3]
  paragraphs:
    - 嘉义民雄的刘家古厝在主人搬离后逐渐荒废。围绕这幢红砖楼，流传过婢女投井、士兵鬼魂夜间出现等不同故事。两种讲法都把荒废的院落变成了地方怪谈的舞台。
    - 中央社走访时，受访者谈到游客如何来打听这些故事。公视后续采访又记录了影视改编给古厝带来的关注。

case_zibuyu_li_tongpan:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 李通判早逝，老仆想让主人还阳，愿按道士的要求拿自己的性命交换。一个赤脚僧人暗中交给他纸包，他才在开棺之夜躲过两个小鬼，并从假通判的声音里认出了要夺财色的道士。雷声响过，棺木恢复原状，作法的道士死在坛上。

case_cn_zibuyu_v01_s002:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 杭州北关门外的宅子传闻有鬼，蔡书生却执意买下。半夜，一名女子来到梁下示范如何把脖子套进绳圈，又招手让他照做。蔡偏伸了一只脚进去，反问她自己犯过的错为何还要让别人重演。女子哭着拜别，从此这屋里再没出现怪事。

case_cn_zibuyu_v01_s003:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 南昌两个读书人同住寺里，年长者回家后猝死，又深夜赶回来托友人照顾家人、刊刻遗稿并还笔债。话说完，他却变成一具追人不止的尸身。年轻人翻墙才脱险，天亮被路人救起。袁枚借识者之口用“魂”与“魄”解释他从旧友变成怪物的转折。

case_cn_zibuyu_v01_s004:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 曾虚舟举止像个疯人，却常一语道中旁人的心事。罢官归来的王子坚听人说祖坟风水有问题，想请他决断。还没能挤到跟前，曾虚舟便隔着人群喝止，说他打的是动祖先尸骨的主意。王子坚受惊而归，故事以他的儿子后来做了御史收尾。

case_cn_zibuyu_v01_s005:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 常熟教书人钟孝廉梦见自己被带进一座衙门。阴司的神不追究他自以为严重的过错，却让他照见上一世谋财害友的事。梦里他惊觉自己已经变作菜叶上的小虫，醒来后忙命人准备丧具，三天后果然暴亡。

case_cn_zibuyu_v01_s006:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 陈秀才在庙中梦见一句难解的预言，还是随表弟去了广西。官署花园里有一老人夜夜来谈诗，后来竟索要大量檀香，声称否则要取陈的心肺。陈回乡向亲友求救，众人从梦里的“南山顽石”猜到老人的来历，决计将它引往庙里。

case_cn_zibuyu_v01_s007:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 酆都人把纸钱投井，唯恐停缴所谓的阴间钱粮就会引来瘟疫。新任知县与幕客缒绳下井，请阎罗包公免除这笔负担。包公同意，幕客却又因席间鲁莽问话冒犯关帝，回到县城便死去，连棺木也遭雷火。

case_cn_zibuyu_v01_s008:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 常熟人孙君寿出游时捉弄荒坟里的骷髅，竟听见它开口回答。骷髅一路滚着追他，到了桥边才停下。孙虽逃回家，随即生病，反复说着当时嘲弄骷髅的话，几天后死去。

case_cn_zibuyu_v01_s009:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 杭州一群朋友在酷暑中下棋，姓孙的棋手移去东厢小睡。床席从背后一寸寸凉下来，他低头一看，竟有骷髅在床下朝他吹气，吓得昏倒。醒后有人主张掘地查找，主人家却怕惹祸，把东厢锁了起来。

case_cn_zibuyu_v01_s010:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 赵良栋经过成都，坚持住进一座久已锁闭的衙门。深夜闯来一个白衣大腹的怪物，挨过几次追刺竟还悄悄跟在他背后。赵最终用长戟刺中它，墙上只剩两只发光的金眼，众人再打，金眼散作火星。天亮后依然没人说得出怪物是什么。

case_cn_zibuyu_v01_s011:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 总督夜读时，一名读书人从窗缝挤进来，自称是在此借住百年的狐仙。它说狐也得参加泰山娘娘主持的考试，合格才能继续修仙，还得苦学各地的鸟语才学得人声。总督听罢愿意让出西楼，事后却懊悔没问狐仙试卷上出了什么题。

case_cn_zibuyu_v01_s012:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 淮安一名女子不肯避开亡夫头七，等到红发鬼差牵丈夫回来。鬼差忙着吃祭品，她趁机召来儿女，把丈夫的魂裹回棺中。丈夫活了二十多年，妻子却在城隍庙再次遇到因失职戴枷的鬼差，回家后便去世。

case_cn_zibuyu_v01_s013:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 参将张士贵不信房子闹鬼，夜里持弓守候，射中从梁上垂下的怪物。怪物逃走前扬言要灭他一家，隔天他的妻儿果然相继倒下。一个多月后，他从夹墙里找回活着的两人，开棺才发现里面早已空了。

case_cn_zibuyu_v01_s014:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 杜工部续娶当晚，见一个小人要吹灭婚烛，又指着四周说到处都是人头，随即暴亡。之后妻子每次进食都觉得喉咙被扼住，又听见他哭着说舍不得。老同年周煌当面责问亡者，哭声断绝，她的病也好了。

case_cn_zibuyu_v01_s015:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 方苞在武英殿修书，他的仆人胡求夜宿浴德堂，被两个身影从床上抬到阶下。两边各站着一名高大的红袍神，竟把胡求当成球踢来踢去，直到鸡鸣才消失。第二天，胡求浑身青肿，在故事里养病数月才好。

case_asia_liaozhai_huapi:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 太原王生把一名自称逃难的女子带回家。道士提醒他有邪物，他悄悄窥看，才发现那是一只鬼，正在给一张人皮描画面容。鬼害死王生后，他的妻子奔走求助，最后以乞者教她的方法救回丈夫。

case_asia_liaozhai_kaochenghuang:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 蒲松龄写宋焘病中忽被请去赶考，到了衙署才发现考官是诸神。文章得到赞许，他被选去做河南一地的城隍，却请求等到侍奉老母终年。诸神准他回去九年，另派同场的张生暂代。九年后母亲去世，他安葬完毕，也从人世辞去。

case_asia_liaozhai_qingfeng:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 耿去病闯入久已荒废的宅院，看见一户狐家正举席饮酒，席间与青凤相互动心。青凤受长辈责备，二人一度分开。后来耿在外救下受犬追逐的小狐狸，又与青凤相见。故事最后，她也请耿援救她曾经惧怕的长辈。

corpus_cn_ich_2006_06:
  kind: story
  source_numbers: [1, 2]
  additional_sources:
    - citation: 中国非物质文化遗产数字博物馆，白蛇传传说（杭州）。
      type: institutional_account
      url: https://www.ihchina.cn/project_details/12185.html
      locator: 历代文本与杭州、镇江的流传范围
  paragraphs:
    - 在广为流传的故事里，白蛇化作白娘子，在西湖一带结识许仙，与他成婚。法海要拆散二人，故事经过端午现形、水漫金山等情节，最终把白娘子同雷峰塔联系在一起。不同的文本和戏曲对她是否重获自由有不同写法。
    - 杭州和镇江同列首批申报名录。明代《白娘子永镇雷峰塔》已写出这段故事较完整的早期形态，后来的演出又塑造了多个版本。

corpus_cn_ich_2006_07:
  kind: story
  source_numbers: [1, 2]
  additional_sources:
    - citation: 中国非物质文化遗产数字博物馆，梁祝传说。
      type: institutional_account
      url: https://www.ihchina.cn/project_details/12187/
      locator: 国家级项目条目及其口头传统
  paragraphs:
    - 祝英台女扮男装外出求学，与梁山伯同窗。分别后，梁山伯才明白祝英台的心意，赶去求婚时她已经另有婚约。梁去世后，祝英台经过他的墓地，墓穴裂开将她接入。流传很广的结尾里，两人化蝶相伴。

corpus_cn_ich_2006_08:
  kind: story
  source_numbers: [1, 2]
  additional_sources:
    - citation: 中国非物质文化遗产数字博物馆，孟姜女传说（博山）。
      type: institutional_account
      url: https://www.ihchina.cn/project_details/12192/
      locator: 博山传唱及齐国杞梁妻向秦长城传说的演变
  paragraphs:
    - 常见的传说说，孟姜女为被征去修筑长城的丈夫送寒衣，到时却只得知他的死讯。她悲哭不止，令城墙坍塌，终于得见丈夫遗骨。博山的唱本还保留了地方传唱的印记，同一人物在早期讲法中则与春秋齐国的杞梁妻相连。

case_asia_korea_grateful_ghost:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 高丽时代，一名赶考的书生在山路上听见草丛里有人打喷嚏。仆人挖开树根才发现，藤蔓从一具骷髅的鼻孔穿过。书生将骨头洗净包好，依旧葬在山坡上。受了照顾的鬼魂随后前来答谢，这也是篇名“感恩的鬼”的缘由。

case_nichibun_0640018:
  kind: story
  source_numbers: [1]
  paragraphs:
    - 岩手远野的讲法里，一户人家的主人答应河童，只要它改了河道便把独女嫁给它。河水果然改道，主人却把正在洗衣的女仆推下河。女仆在水中诅咒这家的男子，此后家里的男孩据说都活不过二十岁。

case_asia_philippines_lumawig:
  kind: story
  source_numbers: [1, 2]
  paragraphs:
    - 天上的卢马维格看见两姐妹采豆，下来用一只豆荚装满整筐。他又让这家人的鸡和猪顷刻长大，并选了妹妹富坎作妻子。连襟讥笑婚宴没有食物时，他用少量米装满几口锅，从林中召出猎物，备成宴席。

case_thai_sac_1:
  kind: story
  source_numbers: [1, 2]
  paragraphs:
    - 六个盲人分别摸到大象的不同部位，于是说大象像扫帚、粮仓的墙、风箱、簸箕、水蛭或钩刀柄。他们歇在树下争执，一人被熟果砸中便以为同伴打他，一场关于大象长相的争论最终变成了混战。

case_thai_sac_36:
  kind: story
  source_numbers: [1, 2]
  paragraphs:
    - 诗琳通人类学中心所藏版本中，帕登想娶伊姑娘，却在火箭比赛中落败。水下龙王之子化成松鼠到城里，结果被猎人抓走，全城居民分食了它。龙王得讯，带众掀起洪水淹城，帕登骑马来救姑娘，姑娘仍被拖入水下。最后帝释天出面，才让死后再战的帕登与龙族休兵。

case_china_soulstealers_1768:
  kind: history
  source_numbers: [1]
  paragraphs:
    - 乾隆三十三年，长江下游一带出现借剪辫、名字或符咒夺人魂魄的指控，一些僧人、乞丐和外地人被怀疑施术。随着地方审讯和呈报，乾隆下令扩查，使原来的地方恐慌波及多个省份。孔飞力以清代档案追索了朝廷与地方官员如何处理这些指控。

case_salem_1692:
  kind: history
  source_numbers: [1]
  paragraphs:
    - 1692 年，塞勒姆一带几名少女表现异常，指称有人以巫术伤害她们。嫌疑人从个别邻人扩大到不同社区，法庭在争议重重的证词中审判并处决了多人。存下来的讯问和诉讼文书让人能追踪一则指控如何从邻里纠纷变成案件。

# 2026-11-23 近现代故事与研究
case_mrs_h_co_haunting_1921:
  kind: history
  paragraphs:
  - 一户人家搬进旧宅后，多人陆续感到头痛、乏力，有人还听到异常动静或看见似乎有人出现。Wilmer 收录了 H 夫人的来信，家人的感受构成这则住宅异闻的叙述主体。
  - 排查指向室内炉具废气和一氧化碳暴露。Wilmer 把它作为中毒病例记录，CDC 也把意识混乱和幻觉列为可能表现。病例没有公布住宅地址或暴露读数。
  location_note: Wilmer 在美国发表的匿名病例。卷宗中没有住宅的城市名。
  source_numbers:
  - 1
  - 2
case_coventry_sword_lab_1998:
  kind: research
  paragraphs:
  - 工程师维克·坦迪夜间独自在实验室，先觉得不适，随后在余光里瞥见灰色身影。另一晚，他发现夹在台钳上的击剑剑身在振动，于是沿房间查找振源。
  - 作者在室内测到约 18.9 Hz 的低频振动，并把风扇和驻波列为解释。振动测量有记录，把该频率同先前的鬼影体验相连仍是一项解释假说。伦敦“闹鬼工程”后来以分组实验检验了类似想法。
  source_numbers:
  - 1
  - 2
  - 3
case_french_haunt_project_2009:
  kind: research
  paragraphs:
  - 研究组搭建了一间看起来普通的封闭房间，让 79 名志愿者各停留约 50 分钟，记下不寻常的感觉。实验分四组，分别改变次声、复杂电磁场或两种因素，另有一组作对照。
  - 不同条件下都有人报告眩晕和在场感，各组的报告数量没有随暴露条件显著变化。作者讨论了实验情境产生预期的可能性，个体测量还涉及吸收倾向。实验结果可与另一项直接测量暗示易感性的乌普萨拉研究对读。
  source_numbers:
  - 1
  - 2
  - 3
case_spr_borley_rectory:
  kind: history
  paragraphs:
  - 博利牧师住宅的著名叙述包括院里一闪而过的修女、房内响动，以及墙上的字迹。1929 年报刊介入后，调查者哈里·普赖斯汇集见证，并安排观察者在住宅里记录异象。
  - 丁沃尔、戈德尼与霍尔在 1956 年重新检查关键记录，比较报道、证词和时间线，指出部分故事的来源不可靠。后续争论保留了观察者之间不一致的说法。地图锚在博利村历史教堂，住宅旧址与教堂是两处地点。
  location_note: 坐标为 Historic England 登记的博利教堂，用作村落参照。
  source_numbers:
  - 1
  - 2
  - 3
case_amityville_horror_1977:
  kind: history
  paragraphs:
  - 1975 年末，卢茨一家搬进纽约州阿米蒂维尔的一处住宅，随后很快离开。杰伊·安森在 1977 年把家人的叙述写成书。灯光、声音和房间里的惊惧被编成有首尾的故事，1979 年电影进一步固定了大众熟悉的版本。
  - 美国电影学会保存了购买改编权和诉讼报道的线索，多方曾公开质疑书中说法。卷宗把入住、出版与电影视为可追踪的传播节点，书中的具体异象仍是有争议的当事人叙述。
  location_note: 地图显示阿米蒂维尔村镇中心。
  source_numbers:
  - 1
  - 2
corpus_spr_census_hallucinations:
  kind: research
  paragraphs:
  - 19 世纪末，英国心灵研究学会征集清醒状态下看见、听见或感觉到异常对象的自述。《生者的幻影》汇编较早的见闻，1894 年的普查报告则用问题表把个人叙述汇成约 1.7 万份回答。
  - 报告可用于追踪受访者怎样描述幻象，也能看出征集网络和记忆回溯带来的限制。它没有记录神经活动，不能由旧问卷推定个体遇到了机器人实验所测的同一种在场感。
  location_note: 伦敦是学会和报告的参照城市；受访者分布在多地。
  source_numbers:
  - 1
  - 2
  - 3
case_hydesville_fox_1848:
  kind: history
  paragraphs:
  - 1848 年，福克斯一家说夜里有敲击声，家中几个孩子和来访者尝试用拍手、数数和提问与响声对答。路易斯很快把家人和邻人的说法编成小册子。
  - 这些记录让一个村镇家庭的故事进入公开展演与唯灵论运动。原册保存了当时的证词和对声音的解释，后来的纪念著述则显示它如何被讲成运动的起源。
  map_label: 海德斯维尔
  source_numbers:
  - 1
  - 2
  - 3
case_sauchie_poltergeist_1960:
  kind: history
  paragraphs:
  - 苏格兰索奇村的家人称，在一个女孩身边听到规律敲击，家中装衣物的篮子似乎移动过。学校方面也有人说，教室里有课桌或物件发生异常，引来不同见证者回述。
  - 奥恩整理并访问了当事人。两类报告的地点、在场人和目击条件有差别，常被当作比较骚灵叙述如何围绕一位家庭成员展开的资料。RSPK 是后来用于理解这类记载的假说。
  source_numbers:
  - 1
  - 2
case_andover_tremors_1970s:
  kind: history
  paragraphs:
  - 安多弗一户人家报告家里有撞击声和物体异常。一些敲击似乎会在问话之后响起，于是调查者科尔文多次进屋，记录声音出现的时机和观察者各自听到什么。
  - 后来发表的报告可用来追查现存音频及调查者对它的解释。地下水或微震是骚灵研究中的另一种假说，剑桥郡的人工振动实验采用的是单独一栋房子。
  source_numbers:
  - 1
  - 2
case_druten_stone_throwing_1995:
  kind: history
  paragraphs:
  - 1995 年春，德吕滕有人报告石块、泥土等东西打进住宅。警方见到受损情况，并有人员报告被泥块打中。一些新闻把难以当场追出掷物者的经历写成骚灵现象。
  - 同期警方发言人将事件判断为恶作剧。其后的调查文章比较现场可见性、人员活动和不断扩大的叙述。卷宗保留飞物报告和警方案情判断两个出处。
  source_numbers:
  - 1
  - 2
case_old_hag_sleep_paralysis_1982:
  kind: report
  paragraphs:
  - 若干纽芬兰受访者描述，他们像是已经醒了，身体却动不了，同时感到胸口有人压着，或觉得屋里进来一名老妇。当地把这种经历叫作遭到 Old Hag 夜访。
  - 霍福德把口头说法与人们记得的身体感受放在一起比较，追问一个人如何在具体经历中理解现成故事。发作描述与睡眠瘫痪相似，调查采集的是回忆。
  source_numbers:
  - 1
case_italy_pandafeche_sleep_paralysis:
  kind: research
  paragraphs:
  - 研究者在意大利阿布鲁佐访问经历过睡眠瘫痪的人。有些人把醒来时的不能动、胸闷或在场感归给 Pandafeche，一种可被讲成女巫或鬼影的当地夜访角色。
  - 问卷把经历特征与解释分开记录。当地民俗为个体体验提供了叙事形态，研究结果说明两者如何共现。阿布鲁佐、纽芬兰与开罗的卷宗可以并读，看相似感受怎样进入各地的叙述。
  source_numbers:
  - 1
  - 2
case_yeti_khumjung_scalp_1960:
  kind: history
  paragraphs:
  - 尼泊尔昆琼村民保存着一件被称为雪人头皮的物件。1960 年考察队取得借样机会，比较它与当地动物皮毛，并记录了雪地足迹随形变而改变外观的问题。
  - 考察报告把借出的头皮与鬣羚一类动物的皮革和毛发相联系。这个结果只涉及借出的物件及所做比较，地理位置标记保存标本的昆琼村。
  source_numbers:
  - 1
  - 2
case_contemporary_exorcism_icd11:
  kind: research
  paragraphs:
  - 教廷在 1999 年发表新版驱魔礼的介绍，说明仪式如何在天主教体系中获得解释，并谈到区分疾病与宗教判断。几十年间，人与家庭求助时仍可能同时接触宗教与医疗体系。
  - ICD-11 的附体恍惚障碍（6B63）则按临床定义讨论非自愿的状态、痛苦或功能受损，并区分集体接受的仪式。两个来源各有使用场景，可以对读它们对同类词语所指对象的区别。
  location_note: 地图标记天主教礼典的发布地。ICD-11 为全球分类。
  source_numbers:
  - 1
  - 2
case_slender_man_2009:
  kind: story
  paragraphs:
  - 2009 年，网名 Victor Surge 的创作者把无脸、四肢细长的人形放进合成照片，用类似报刊剪影的说明营造失踪谜案的感觉。Something Awful 论坛的参与者续写新材料，角色逐渐从单个作者的照片变成共享故事。
  - 民俗学者托尔伯特以此说明“反向展演”：创作者先模仿既有传说在现实中留下痕迹的方式，再经集体写作让新角色像一则流传已久的传说。
  location_note: 坐标表示作品发源或流传的国别参考区，故事发生在数字原生空间。
  source_numbers:
  - 1
  - 2
case_the_backrooms_2019:
  kind: story
  paragraphs:
  - 走错一步，日常世界像失灵的游戏一样把人丢进另一侧。那里是不断重复的淡黄房间、嗡响的灯管和旧地毯，出口似乎总在相同的转角后面。2019 年的 4chan 讨论串把一张空房照片与这样的匿名叙述合在了一起。
  - 后来，创作者给房间追加楼层、地图和规则，形成共用叙事场。互联网档案馆追到照片的美国威斯康星州装修资料，创作地点按美国英语网络参照，摄影场所属于另一条出处线索。
  location_note: 坐标表示作品发源或流传的国别参考区，故事发生在数字原生空间。
  source_numbers:
  - 1
  - 2
  - 3
case_dishisanceng_elevator_campus:
  kind: story
  paragraphs:
  - 傍晚，两名同桌走向电梯，看见里面站着一位女生。门先在他们面前合拢，随后按键打开，却空无一人。两人都说看见了女生，其中一人后来把这段讲法发到第十三层论坛。
  - 校园异层的另一种写法以楼梯为入口。小说《恐惧侵袭》里，学生数着楼梯上楼，竟走到平时不存在的第十三阶。电梯门与台阶给相近的空间怪谈提供了两种入口。
  location_note: 坐标表示作品发源或流传的国别参考区，故事发生在数字原生空间。
  source_numbers:
  - 1
  - 2
  - 3
case_ghq_ghost_protocol_2026:
  kind: story
  paragraphs:
  - 你会被登记为调查员。按照《全球灵异事件处理总部》的公开指南，每份长篇委托分段放出目击、异常记录和新线索。读到处置阶段，需要再翻卷宗，从彼此冲突的说法中挑出能支持决定的证据。
  - 作品把闹鬼故事写成机构日常：案件有档案、协作者和结案记录。官方页面的调查员指南给出了这种交互规则，能用来对读《后室》和瘦长人如何借真实媒介表演虚构。
  location_note: 坐标表示作品发源或流传的国别参考区，故事发生在数字原生空间。
  source_numbers:
  - 1
  - 2
text_vanishing_hitchhiker_1981:
  kind: story
  paragraphs:
  - 司机让一名年轻乘客上车。她可能留下地址、借走衣服，或要求在路边下车，随后消失。司机事后从亲属或墓地得知，她早在这趟夜路之前去世。各地会把同一个故事安在自己熟悉的道路和时间上。
  - 布伦范德将这类变体收进 1981 年的著作，用可比较的记录讨论都市传说如何借近距离见闻获得可信感。卷宗保存人物、物件和认出死者的三类变项，便于与马尼拉白衣女一类载车传闻对读。
  source_numbers:
  - 1
  - 2
text_japan_toilet_yokai_db:
  kind: story
  paragraphs:
  - 日本校园怪谈常让最普通的设施成为出入口。在滨松，学生说第三个厕间不能进，会遇见花子或被拉进去。山形的采录变成西边厕所的第二格，一个孩子说念名字会得到回话。
  - 宇都宫的采录出现重复呼唤、冲水和伸出一只手的情节。日本国际日本文化研究中心的数据库把不同出处和行政区逐条保存，提供了比较同一角色如何被本地学生重新讲述的材料。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
motif_urban_ostension_liminal:
  kind: research
  paragraphs:
  - 传说有时以行动、物件或照片的形式重新讲述。Dégh 和 Vázsonyi 用“展演”描述行动进入传说传播的情形；Tolbert 分析瘦长人时借用“反向展演”，说明新创故事如何先造出传说留下物证的效果。
  - 另一条线索是阈限空间。走廊、旅馆、校园、空办公室原本用来通行和等待，故事移走正常的人流与去向，再靠图像和重复结构产生方向感失灵的恐怖。两条线索可在《后室》等作品相遇。
  source_numbers:
  - 1
  - 2
  - 3
motif_poltergeist_500_cluster:
  kind: research
  paragraphs:
  - 盖尔德和康奈尔把约五百宗不同地点和时期的骚灵报告放在一起，区分敲击、飞掷、物件挪移、持续时间和见证人等特征。把材料编码有助于比较个案的叙述结构。
  - 用这个索引可把海德斯维尔的响应式敲击、索奇住宅与学校所称的位移、德吕滕的飞石记录并排阅读。档案的取样和记录质量不同，分类表达的是各报告有哪些特征。
  source_numbers:
  - 1
  - 2
motif_wolf_stranger_ghosts:
  kind: research
  paragraphs:
  - 武雅士在台湾田野中把神、鬼和祖先放回祭祀者的关系网：祖先由亲属照料，神可受许多人供奉，无人认领或来历不明的亡者则可能被对待为有风险的外来者。
  - 这项分析提醒读者，叙述里的“鬼”可以指人群中的社会位置。与 1768 年剪辫叫魂和塞勒姆卷宗对读时，还可追问外人何时成了可疑对象，以及地方传闻如何进入权威机构。
  source_numbers:
  - 1
  - 2
mech_co_poisoning:
  kind: research
  paragraphs:
  - 一氧化碳暴露会妨碍氧的输送，并影响脑和心脏等组织。临床表现可能包括头痛、虚弱、眩晕、意识混乱和幻觉。室内多人在同一期间出现症状时，共同的环境暴露是重要线索。
  - Wilmer 的 1921 年文章收录了 H 夫人住宅里的例子。它把原本让住户作出异闻解释的身体症状和室内炉具问题联系起来，属于有具体病例线索的归因。
  source_numbers:
  - 1
  - 2
mech_tpj_body_signal_integration:
  kind: research
  paragraphs:
  - 人在看不见也摸不到对象时，仍可能感觉身旁有一个同伴。阿尔齐等报告了单个患者在左颞顶交界处刺激时反复出现的伴随者错觉，错觉还会随身体姿势变化。
  - 布兰克等把神经病例与健康志愿者实验结合，通过机器人让自主动作与身体触觉在时间上出现错配。实验诱发了可报告的在场感，病例涉及与身体表征相关的大脑网络。两组材料从不同角度检验了身体信号整合。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
mech_sleep_paralysis:
  kind: research
  paragraphs:
  - 快速眼动睡眠时，许多骨骼肌的活动暂时受到抑制。人在入睡或醒转的过渡期可能察觉环境、却还不能像平时那样移动。睡眠中断实验采到的发作可直接比较脑电和肌电记录。
  - 胸口压迫和身旁有人的体验在不同地方被讲成老妇、精灵、鬼压床等故事。访谈留下受访者对经历的解释，实验留下的则是睡眠生理过程，两类出处可以一起读。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
mech_suggestibility_bias:
  kind: research
  paragraphs:
  - 一个人在进入实验前听到了怎样的故事，或平时多容易沉浸于体验，可能影响是否把细小感觉说成异常。研究会把这种易感性和具体暴露条件分开测量。
  - 格兰奎斯特等的双盲实验里，若干自陈量表比磁场分组更能预测体验报告。弗伦奇等也讨论了实验预期。观察到的统计联系只覆盖所测的人和量表，不能把历史鬼屋中的全部见证都归由一种偏误。
  source_numbers:
  - 1
  - 2
theory_mci_recall_experiments:
  kind: research
  paragraphs:
  - 一个物件如果只违背少数直觉，听众还能从熟悉概念推断其他特征。记忆实验把含这种意外特征的材料与普通材料比较，检查受试者在转述或回忆时保留了什么。
  - 博耶和朗布尔比较多地参与者的记忆结果，巴雷特和奈霍夫也用叙事任务研究传播。卷宗把这种效应限于实验材料与回忆条件，可以据此提出传说传播的问题。
  source_numbers:
  - 1
  - 2
mech_haunt_infrasound_field_hypothesis:
  kind: research
  paragraphs:
  - 假说认为某些建筑环境的低频振动或电磁条件，会增加访客报告眩晕、恐惧或在场感的机会。坦迪的实验室观察提供了低频读数和一次主观体验，因果解释没有单独测出。
  - 伦敦项目后来在同一房间内按组操控次声和复杂电磁场，所得体验报告没有支持预测的分组差异。图谱分别保留个案的待核实边与实验条件下的已驳回边。
  source_numbers:
  - 1
  - 2
  - 3
mech_weak_complex_field_hypothesis:
  kind: research
  paragraphs:
  - 早期研究试图用头部附近的弱而复杂的磁场诱发身边有人的感觉，此类设置后来以“上帝头盔”之名传播。
  - 格兰奎斯特等做了双盲对照，所用弱磁场没有造成预期组间差异。原研究团队对复验的技术细节有异议。图谱的红色边表示这项复验没有支持受检条件下的主张。
  source_numbers:
  - 1
  - 2
  - 3
mech_seismic_groundwater:
  kind: research
  paragraphs:
  - 兰伯特试图把某些骚灵报告中的物体移动归给建筑微震，例如地下水流动对结构产生的扰动。盖尔德和康奈尔提出，若振动足以带动物件，房屋可能已经出现明显运动和损伤。
  - 他们在剑桥郡房屋进行人工振动测试，用物件和结构的反应检查这项预测。这一反证对应受检房屋和设定，可与同一书里的住宅目击卷宗分开阅读。
  source_numbers:
  - 1
  - 2
  - 3
mech_salem_ergotism:
  kind: research
  paragraphs:
  - 卡波雷尔提出，受污染的黑麦可能导致痉挛等症状，并尝试以此解释 1692 年塞勒姆的部分证词。它是一项从历史档案推回临床病因的假说。
  - 斯帕诺斯和戈特利布检查历史资料里的发作形态、人口分布和证词，指出可靠信息与预期的中毒模式不符。塞勒姆卷宗保留反驳的文献和司法档案，便于分别查看。
  source_numbers:
  - 1
  - 2
mech_rspk_poltergeist:
  kind: research
  paragraphs:
  - 威廉·罗尔等调查者用“反复自发念力”解释一类聚集在某人身边的敲击和移动物体报告。调查时，他们记录在场人员、出现频次和家庭情境。
  - 这是一项有争议的超心理学假说。索奇和德吕滕的历史资料提供了可比较的见证结构，尚缺能区分念力、普通人为与环境来源的证据。
  source_numbers:
  - 1
  - 2
case_granqvist_field_replication_2005:
  kind: research
  paragraphs:
  - 格兰奎斯特等把志愿者分配到弱磁场和对照条件，按双盲方式记录是否产生在场感、神秘体验及其他感受，并测量参与者的体验倾向。
  - 弱磁场分组并未预测报告的差异，个体暗示易感性相关量表与报告有统计关系。这两项结果分别入图，可从观察到的关联与被驳回的磁场预测追溯到同一篇论文。
  source_numbers:
  - 1
  - 2
case_tpj_shadow_stimulation_2006:
  kind: research
  paragraphs:
  - 一名癫痫术前评估患者在左侧颞顶交界区域受局灶刺激时，感到身后有个人。患者改变坐姿或手臂位置后，感到对方也随之改变。研究团队在临床条件中多次复现了这一感觉。
  - 作者据此提出，身体姿势和自身动作的脑内表征可能被归给另一个人在场。后来的机器人实验用不同方法检查类似的身体信号错配。
  source_numbers:
  - 1
  - 2
  - 3
case_blanke_robot_presence_2014:
  kind: research
  paragraphs:
  - 参与者动手操作一个装置，另一装置在背部给出触觉反馈。动作与背部触觉的时间关系改变后，一些参与者感觉有人靠近自己。研究者把报告与同步条件比较，还对照了报告在场感的神经病例。
  - 结果支持部分在场感可在身体信号冲突时受控诱发。这里的“在场感”是参与者体验，实验也为理解先前的颞顶刺激病例提供了可比较的数据。
  location_note: 地图标记牵头实验室所在洛桑，论文包含其他合作机构。
  source_numbers:
  - 1
  - 2
case_cornell_gauld_house_vibration_1961:
  kind: research
  paragraphs:
  - 盖尔德和康奈尔把试验用物件放进一栋房子，再强化建筑振动，比较物件是否会像骚灵叙述里那样离开原位。
  - 报告指出，产生相应物件移动之前，室内已经能感到明显震动并出现结构风险。研究者据此质疑小幅地球物理扰动可悄然造成剧烈移物的解释。
  location_note: 坐标代表有文献支持的剑桥郡，未指定实验房屋。
  source_numbers:
  - 1
  - 2
  - 3
case_cn_fengmen_village_legend:
  kind: legend
  paragraphs:
  - 太行山里的旧村逐渐空下来后，古屋和一把遗留椅子成了网上故事的主角。探险者说，在村里遇上莫名声响，或把屋内太师椅说成带来厄运的物件。
  - 《河南日报》到村里访问并询问过去的住户，记录迁居和交通背景。2016 年，央广报道当地救援迷路游客。两类材料显示网络故事怎样把一处迁空的村落变成实地探访的目的地。
  map_label: 河南沁阳
  location_note: 点位是沁阳市域的参照，故事地点在其山地村落。
  source_numbers:
  - 1
  - 2
case_cn_bj_metro_beixinqiao_audio_2019:
  kind: report
  paragraphs:
  - 2019 年，一段在朋友圈流传的音频讲起三个检修人员从北新桥站进入隧道，其中两人突然消失。故事借用了真实站名和深夜检修的场景。
  - 北京地铁运营一分公司随后回应，否认有检修人员神秘失踪。另一份北新桥卷宗保存了当地锁龙井的口述，两条故事可在图谱里对读。
  map_label: 北新桥站
  location_note: 标记音频传闻借用的地标，录制地点不明。
  source_numbers:
  - 1
case_cn_hk_brides_pool_legend:
  kind: legend
  paragraphs:
  - 一则当地传说把新娘潭的名字归给一位赶往婚礼的新娘。婚礼队伍经过山溪，水路险滑，新娘落进潭中。瀑布和深潭让这一段地名故事一直容易被游客记起。
  - 香港渔农自然护理署在郊野公园介绍里把故事作为民间传说保存，并描述潭的真实地貌。可用这份材料对照地名本身如何帮助维系地方故事。
  map_label: 新娘潭
  location_note: 标注新娘潭公园步道一带。
  source_numbers:
  - 1
case_cn_tw_mosina_missing_walkers:
  kind: legend
  paragraphs:
  - 有人进山后突然认不出平时熟悉的路，事后才在离出发点不远的地方被找到。台湾民间有一种解释，把弄错方向、感觉有人招呼，或误以为吃到了寻常食物的经历讲成受到魔神仔引诱。
  - 林美容访问地方讲述者，把迷路、失踪、重新认路和记忆异样的叙述放在一起看。研究关注这些故事如何表达山林风险和亲人的焦虑。田野材料分布在不同县市，地图以台湾岛作为参照。
  map_label: 台湾岛
  source_numbers:
  - 1
case_cn_hk_ghost_oppression_wing_1994:
  kind: research
  paragraphs:
  - 香港受访者用“鬼压床”指称醒转或入睡时不能动、有压迫感或有异常感知的经历。Wing 等人把这一俗称和睡眠研究中的描述放在同一份问卷中询问。
  - 论文报告了样本中的自陈频率和相关特征，为追踪中文俗称与睡眠现象的重叠留下材料。香港调查和开罗访谈可比较个体怎样命名体验，睡眠实验则能另行核对生理过程。
  map_label: 香港
  source_numbers:
  - 1
  - 2
case_jp_hamamatsu_hanako_1998:
  kind: legend
  paragraphs:
  - 滨松学生说，学校厕所从前数的第三个隔间最好不要进去。据说那里会遇见花子或其他鬼怪，也有人说会被拉进厕所深处。
  - 美浓部京子把这一说法编进地方民俗记录。其他城市的版本会改变隔间位置和声音出现的条件。L2 卷宗可直接阅读几种并列版本。
  map_label: 滨松
  source_numbers:
  - 1
case_sg_pontianak_film_1957:
  kind: history
  paragraphs:
  - 马来语故事中的 Pontianak 往往是一位死于怀孕或分娩前后的女子，死后回来。1957 年的电影把她从地方讲述移到银幕，让夜间出现的恐惧与家庭、亲缘和失去孩子的情节连接起来。
  - 新加坡国家档案馆保存了这部马来语电影当年的中文放映广告。这张广告让研究者看到，同一角色怎样越过语言圈进入影院，也提供了可以查到日期和城市的传播节点。
  map_label: 新加坡
  source_numbers:
  - 1
  - 2
case_sg_old_changi_hospital_legend:
  kind: legend
  paragraphs:
  - 樟宜医院搬离后，哈顿路的旧楼在树丛中空置。当地故事常从曾有病房的走廊讲起，讲夜探时的声音或是什么把人留在无人的楼层。周边访谈还保存了年轻人到空楼探访的回忆。
  - 新加坡国家文物局的档案记录了场地从军事建筑到医院的用途。新闻走访记录的是空置后如何被讲成鬼屋。两条线索使同一地点的建筑史和故事传播都可以追读。
  map_label: 旧樟宜医院
  source_numbers:
  - 1
  - 2
case_th_mae_nak_phra_khanong:
  kind: legend
  paragraphs:
  - 丈夫马克归来后，以为娜娜仍在家里照顾孩子。一种著名变体里，他看到她的手从高脚屋伸得异常长，才发现她已在他离开时死于分娩。故事的结尾随着口述、电影和寺庙叙述而改变。
  - 曼谷玛哈布寺一带供奉这位女鬼。来访者可以从地方祭祀、戏剧和电影接触不同版本。卷宗把曼谷传说地标与马来银幕上的 Pontianak 并列，方便比较。
  map_label: 曼谷玛哈布寺
  source_numbers:
  - 1
  - 2
case_th_mekong_naga_fireballs:
  kind: report
  paragraphs:
  - 在泰国廊开的湄公河河岸，佛教雨安居结束前后，有人守到入夜，等河面上出现迅速升空的光点。地方叙述把火点连到住在河里的那伽，也有人提出水面燃气或人为灯光等解释。
  - 泰国旅游机构登记了看火球的地点和节庆，现场新闻记录了人群当晚报告所见。它们可以证明观测和节庆习俗的存在，现有这些材料不足以确定单次光点来源。
  map_label: 蓬披赛河岸
  source_numbers:
  - 1
  - 2
case_ph_capiz_aswang_fieldwork:
  kind: report
  paragraphs:
  - Aswang 在菲律宾传说里可以是变形、夜间行动或危及他人的存在。在卡皮斯的田野研究中，这个名字也会落到实际居民身上。论文里的村民平日捕捉和售卖虾蟹，同时要面对邻人关于她身份的说法。
  - 研究把生计和交易作为观察重点，看到诡异名号怎样同日常交往并存。地图只标卡皮斯省，保留论文对村庄的匿名做法。
  map_label: 卡皮斯省
  source_numbers:
  - 1
case_ph_balete_drive_white_lady:
  kind: legend
  paragraphs:
  - 马尼拉都市区的司机故事说，一位白衣女子会在 Balete Drive 附近上车，走到街道尽头前却消失。有的版本让她忽然出现在车内后座，把日常夜路变成识别陌生乘客的考验。
  - PhilSTAR Life 访问媒体和地方受访者，追到数种互相竞争的起源故事，包括早期报纸写作的说法。既有文本足以看到变体如何流传，最初的写作者仍未确定。
  map_label: 奎松市 Balete Drive
  source_numbers:
  - 1
case_id_pelabuhanratu_nyai_roro_kidul:
  kind: legend
  paragraphs:
  - 在西爪哇面向印度洋的海岸，地方故事把一位巽他公主与南海女王联系起来。人们讲她如何进入海中、怎样拥有自己的领地，也用她的故事说海边应遵守的规矩。
  - Wessing 追踪不同地方把海后说成什么人，并比较她在巽他海岸与爪哇宫廷叙述中的位置。帕拉布汉拉图提供的是海岸说法的一个地理锚点。
  map_label: 帕拉布汉拉图
  source_numbers:
  - 1
case_kh_bokor_yeay_mao_guardian:
  kind: legend
  paragraphs:
  - 柬埔寨南部山路一带，有人把耶茂祖母讲成守护旅人和沿途居民的女性精灵。关于她曾经是谁、经历了什么，各处说法有出入。旅人会把顺利穿越山路的心愿同她联系起来。
  - 波哥山的公共雕像是今天可定位的讲述地标。当地景区资料保存了名称与朝拜线索，是查找流传版本的入口。
  map_label: 波哥山
  source_numbers:
  - 1
case_kh_diaspora_sleep_paralysis_lowell_2005:
  kind: research
  paragraphs:
  - 在美国洛厄尔接受访谈的柬埔寨难民，有人把醒来不能动和胸前压迫感称为 khmaoch sangot，即“鬼压住人”。研究者记录了这种表述怎样同惊恐、记忆和个体经历一起出现。
  - 出处涉及就诊样本，所得比例表达特定群体的调查结果。图谱标记访谈城市，同时把口述的文化背景连回柬埔寨，可与香港、开罗的问卷及访谈比较。
  map_label: 洛厄尔
  location_note: 实地受访地点为美国洛厄尔，语境为柬埔寨高棉文化。
  source_numbers:
  - 1
  - 2
case_vn_saigon_turtle_lake_dragon_legend:
  kind: legend
  paragraphs:
  - 胡志明市龟湖的故事说，独立宫坐在龙头上，后来修建的水池正压住爱摆动的龙尾。有一版传说把八角形水池、突出的塔和龟像解释成用来稳住这片地的布置。
  - 报道将这个说法追到 1982 年的书中，并另行梳理交叉路口改建、安放龟像以及龟像被毁的历史。站内可对读上海高架龙柱，两处都把可见的市政造物讲成了镇住地下龙的设施。
  map_label: 西贡龟湖
  location_note: 标记龟湖圆环广场一带。
  source_numbers:
  - 1
  - 2
case_sleep_paralysis_lab_1992:
  kind: research
  paragraphs:
  - 研究让 16 名志愿者在实验夜里经历计划中的短暂唤醒，再把重新入睡时发生的体验同多导睡眠图一起记录。研究人员取得六次孤立性睡眠瘫痪记录，有五次出现在重新入睡后的快速眼动期。
  - 几名参与者记得自己躺在实验室里，也同时感到无法移动。记录帮助判断快速眼动期肌张力抑制与醒转体验的重叠。病例与香港和开罗的自述调查提供不同层次的证据。
  location_note: 东京为第一作者的早稻田大学所在地。
  source_numbers:
  - 1
case_egypt_jinn_sleep_paralysis:
  kind: research
  paragraphs:
  - 半醒时动不了身体，又觉得房里出现了什么。一些开罗普通受访者用伊斯兰传统中的精灵解释这类体验。研究也访问了开罗美国大学的学生和丹麦的居民，比较各组如何命名和理解发作。
  - 三组受访者的解释有差异，问卷和访谈保存的是当事人的回忆。图谱还连接香港“鬼压床”、阿布鲁佐 Pandafeche 和睡眠实验，便于对照叙述与可同步观察的生理过程。
  source_numbers:
  - 1

# 2026-11-23 东亚与东南亚现代民俗故事
case_cn_liwan_plaza_night_sign:
  kind: legend
  paragraphs:
  - 夜里的商场剩下半亮的楼道和一些还在营业的铺位。坊间说，楼上金字远看会把“广”认成“尸”，走在冷清处还可能听到脚步和哭声。后来，讲述者又把屋顶和楼群的形状编进传说，用这些细节解释为什么整座楼让人不安。
  - 《广州日报》到广场采访时，仍可看到店主串珠、聊天。一位天天晚走的店主说，那些响动她从没听见过。到了短视频时期，夜探者重新拍摄走廊和招牌，让“尸场”这个谐音继续跟着广场传播。
  map_label: 荔湾广场
  location_note: 标记广州荔湾广场附近的公开商圈。
  source_numbers:
  - 1
  - 2
case_cn_wuwei_hairy_water_ghost_1953:
  kind: legend
  paragraphs:
  - 20 世纪 50 年代，无为一带传起一个让人不敢往水边走的故事：水里有全身长毛的东西，会攀上岸袭击村民。故事里的怪物又逐渐有了人的身份和目的，甚至被说成替远方势力做事。陌生来客、河边响动，都可能被套进这个传法里。
  - 这场风声后来成了需要逐级上报的事件。研究者把县档案、地方志和老人访谈对在一起，发现一则水怪故事反复变形，最终足以引发盘查与冲突。材料记录下了无为如何应对这场恐慌。
  map_label: 安徽无为
  location_note: 无为市城区作原无为县的区域锚点。
  source_numbers:
  - 1
case_cn_poyang_laoyemiao_waterway:
  kind: legend
  paragraphs:
  - 渔船从鄱阳湖往长江去，要经过老爷庙附近的一段窄水道。湖上沉过船，船家也讲一只巨鼋的故事：昔日有人遇险时被它驮过水面，后来它受了封号，也有版本说它会掀浪扣住船。出船人有时在庙边停一下，再走那段水。
  - 到了现代，难以看清的湖底和找不到的残骸被讲成“魔鬼三角”。水下考古队随后在这一带确认了两艘水泥沉船，留下了可查的探测记录。老爷庙卷宗把湖上口述与所见实物放在同一页。
  map_label: 鄱阳湖老爷庙
  location_note: 标记都昌与庐山之间的湖口水道参照范围。
  source_numbers:
  - 1
  - 2
case_cn_hk_saikung_boundary_2016:
  kind: legend
  paragraphs:
  - 一位常走西贡山路的山友说，进山之后自己突然无法和同行者碰头，熟悉的路也变得走不通。后来，他又记得石头似乎发出了声音。等搜救人员找到他，他已经在山区度过几个夜晚。
  - 他把这些片段讲出来后，读者拿已有的“西贡结界”解释：走进去的人仍能看见山路，却回不到原本的地方。另有攀山人士表示，西贡山径多、访客也多，迷路事件集中便容易形成这样的印象。
  map_label: 香港西贡山区
  location_note: 标记采访涉及的西贡东部郊野区域，路径和各次目击位置各有差别。
  source_numbers:
  - 1
  - 2
case_cn_hk_tat_tak_old_school:
  kind: legend
  paragraphs:
  - 达德学校停用后，屏山草木逐渐遮住旧教室。有访客把夜里看到的暗影叫作红衣女人，有人则把故事安在旧女厕，给它配上一段失去出处的校史。摄影者到过空楼，听来的鬼话和自己看到的杂草、教室、门窗，两者差得很远。
  - 校园旧址给后来讲述提供了一个有门牌、有教室的场景。古物古迹办事处还记载达德早期曾在愈乔二公祠办学，这是达德的另一处校址。地图用屏山旧校故事的地区作参照。
  map_label: 香港屏山
  location_note: 标记屏山旧校舍一带。官方校史所述的愈乔二公祠是此前另一个校址。
  source_numbers:
  - 1
  - 2
case_cn_hk_taipo_chung_tsai_yuen_bridge:
  kind: legend
  paragraphs:
  - 大埔滘一段老路由山边绕过去。司机故事里，夜行的车灯照到桥边，有穿白衣的女子或孩子正向车招手。人到了跟前，那些身影又不见了。一些版本把拦车的人说成曾被山洪卷走的游人。
  - 松仔园在 1955 年发生过山洪灾难。报刊复述夜路传闻时常提到这段旧闻，路过的人也因此记住“猛鬼桥”的别称。桥下的水患、拦车的身影和后来发生在别处的事故，在传播中容易被讲到一起。
  map_label: 香港大埔松仔园
  location_note: 标记大埔滘相关道路一带。
  source_numbers:
  - 1
case_cn_tw_lantan_human_face_fish:
  kind: legend
  paragraphs:
  - 投书把故事放在嘉义兰潭的傍晚。一群人钓来一条大吴郭鱼，当场架火烤起来。只听见有个老妇人用闽南话问鱼好不好吃。大伙找不到说话的人，直到有人指向烤架，鱼嘴似乎还在动。
  - 故事再往下讲，现场拍下来的鱼头在照片里像是一张人脸。台湾电视节目编导回忆，来自不同地方的观众接连寄来同一张照片。照片和来信由此成了这则故事最容易转给别人的两个物件。
  map_label: 嘉义兰潭
  location_note: 标记投书版本指向的嘉义兰潭，未记录具体烤肉地点。
  source_numbers:
  - 1
  - 2
case_cn_tw_dakeng_red_girl:
  kind: legend
  paragraphs:
  - 一群人去台中大坑走山路，顺手用家用摄影机拍下队伍。回看时，他们说最末尾多了一个穿红衣的小身影，像在跟着大人一步步走。大家的回忆里当时没有那名同行者，画面里的红点便成了越看越令人不安的细节。
  - 影像进入灵异节目之后，寻找拍摄者、重看片段和猜她是谁，逐渐变成故事的一部分。有人把红衣女孩接到山中魔神仔的旧讲法上，后来又出现了电影版本。不同讲述所给的拍摄和播出日期也有出入。
  map_label: 台中大坑
  location_note: 原报道定位在大坑登山步道一带，未指定某条步道的一段。
  source_numbers:
  - 1
  - 2
case_cn_tw_liyutan_fanpo_recollection:
  kind: legend
  paragraphs:
  - 老人潘素珠记得，母亲偶尔出门时留她在家照看妹妹，总要多嘱咐一句，遇到某位老妇人就先走开。有些大人说那老妇平时与旁人无异，夜里却会飞。小孩出了事，邻人有时还把背上的印子认作她留下的。
  - 鲤鱼潭的受访者也记得长辈讲过另一套说法：人会在变成番婆鬼时换上一双猫眼。两代人的记忆一个保留了照看妹妹时的警觉，一个保留了变身的讲法，在同一处聚落连成了完整的地方故事。
  map_label: 苗栗鲤鱼潭
  location_note: 以国家文化记忆库所述聚落作参考。
  source_numbers:
  - 1
case_cn_chengdu_zombie_rumor:
  kind: legend
  paragraphs:
  - 回忆里，成都一些孩子听说城里有僵尸。留在回忆里的一种讲法是，它能装成普通人，混上火车，在谁也不留意时靠过来。有人后来还记得路边的封路场景，把它同怪谈联想在一起。
  - 电影《灵臆事件》宣传时访问了从小在当地生活的人，把这些说法搬到银幕上。儿时曾听说什么、当时街上实际发生什么，是这批回忆中的两个层面。各地转述都把本来熟悉的车站、河边和上学路变成了故事场景。
  map_label: 成都
  location_note: 传闻流通城市参照，片方采访未提供可定位的相关地点。
  source_numbers:
  - 1
case_cn_tw_lintoujie_gezaixi:
  kind: legend
  paragraphs:
  - 歌仔戏版本里，住在台南的招娘守寡后拉扯两个孩子。丈夫的故人周阿司说会帮忙托底，却借做生意把她的积蓄骗走。孩子们没熬过饥寒，招娘死在林投树下，生前没能说清的账从此由鬼魂追索。
  - 她在故事里托人相助，渡过台湾海峡到汕头找到周阿司。原来困在小家里的人，变成了能沿着远行路线找上门的人。文化记忆库的台语录音保存了一份 1950 年代卖药团用稿的传唱方式。
  map_label: 台南
  location_note: 台南是剧本所指主要故事地区，后半段在汕头展开。
  source_numbers:
  - 1
  - 2
case_jp_hachinohe_kuchisake_1990:
  kind: legend
  paragraphs:
  - 在八户采录的版本里，一个戴口罩的女人会走来，问路人自己好不好看。路人一旦点头，她就揭开口罩让对方看清嘴角，接着追上来。孩子们说她跑得快得不像人；八户的讲法还给了她一辆红色轿车。
  - 同一调查在宫城县名取记录到另一个版本：她常在没什么人的道路上截住独行者。街道、车子和口罩都是日常物件，名字相同的怪谈也可以在不同城市换掉其中几样。
  map_label: 日本八户
  location_note: 八户为主记录采录地，另一来源记宫城名取版本。
  source_numbers:
  - 1
  - 2
case_jp_tokyo_red_blue_paper_1986:
  kind: legend
  paragraphs:
  - 东京的一则旧校园传闻说，进了小学最边上的厕间，会听见有人隔着门问想要什么颜色的纸。学生说，选红纸会浑身是血，选蓝纸会被扼住脖子，选白纸才能平安离开。可怕的是，声音提出的像是个再普通不过的问题。
  - 常光彻在 1980 年代采录这类校园谈话。花子版本常要孩子主动敲门，这一则则是孩子已经关在窄小隔间里，才听见陌生的声音来问话。
  map_label: 东京
  location_note: 原记录只标东京都，点位为都域参考。
  source_numbers:
  - 1
case_jp_tokyo_empty_music_room_1986:
  kind: legend
  paragraphs:
  - 那所私立高中有两间音乐室，一间在二楼，一间在三楼。上楼的人本来要去三楼，走过低一层那间的门口时听见里面响起钢琴声。按学生的讲法，房间里并没有人。
  - 故事之所以容易被同学记住，就在这条再普通不过的上楼路线。地点精确到两间音乐室的楼层，声音却找不到演奏者。日文研所引采录保留了这段短短的口述，没有登记校名。
  map_label: 东京
  location_note: 日文研仅登记东京都，未指认学校。
  source_numbers:
  - 1
case_jp_utsunomiya_thirteenth_stair:
  kind: legend
  paragraphs:
  - 学生说，学校里有一级台阶不能踏，就是数到第十三阶的那一级。白天两三步跨过的楼梯，一旦听过这条规矩，夜里独自走便忍不住开始数，每上一步都在等那个数字。
  - 久野俊彦在高中生的谈话里保存了这条禁忌。采录的核心只落在那一级，后来讲的人可以保留这个数字，而把遭遇换成自己学校的怪事。
  map_label: 日本宇都宫
  location_note: 标记栃木县宇都宫市；记录未公开具体校园。
  source_numbers:
  - 1
case_jp_hamamatsu_kisaragi_station_2004:
  kind: legend
  paragraphs:
  - 2004 年深夜，网名“はすみ”的人边坐车边发帖，说自己搭惯了的一班私铁突然不再停靠。论坛里有人问她现在在哪儿，有人叫她想办法下车。列车终于停了，站牌却写着她从没听过的“如月”。周围没有站员，她只能继续在帖子里求助。
  - 读者跟着发帖的间隔猜测接下来会去哪儿，回复自己也成了故事的一部分。多年后影视演绎重写了后半程。卷宗标在滨松出发地附近，帖中目的地仍是故事里的车站。
  map_label: 日本滨松
  location_note: 数字原生传说。坐标对应故事开头所说的新滨松地名。
  source_numbers:
  - 1
  - 2
  - 3
case_sg_ubin_german_girl_shrine:
  kind: legend
  paragraphs:
  - 岛上的讲法从一战开始。岛上住过德国种植园家庭，据说战争来后，一个姑娘为躲避抓捕，跑进林子。几天后，做工的人在山崖下发现了她。此后经过那段路的人会留花或香，有人后来把她移葬到采石场的山头。
  - 姑娘的姓名没有从这里的档案里确定下来，庙却成了可到达的地点。早年通往采石场的危险山路和后来的祭祀一代代接在一起，让许多人是先听到这个故事，再认识这座岛。
  map_label: 乌敏岛
  location_note: 标记乌敏岛西部庙址周边。
  source_numbers:
  - 1
  - 2
case_my_batu_gajah_kellie_night_tour:
  kind: legend
  paragraphs:
  - 古堡的楼道穿过一间间没住人的房间。游客听导览者说，夜里经过时，有人觉得房间里站着身影，有人停在长廊不愿再走。庄园的主人在工程未完时就离开人世，这件事成了后来者讲起廊里身影时常用的开头。
  - 霹雳州的旅行报道留下了夜游兴起的时间。白天可以看房间和建筑格局，晚上同样的路线则用来讲访客口中的怪谈。每一组来访者都可能为这栋没建完的宅子添上一段不同记忆。
  map_label: 霹雳州凯利古堡
  location_note: 点位为峇都牙也附近的公开遗址。
  source_numbers:
  - 1
  - 2
case_id_pontianak_ghost_river_cannon:
  kind: legend
  paragraphs:
  - 坤甸的开城故事说，建立聚居地的人沿河上来，夜里不断受到女鬼 Kuntilanak 的惊扰。他们朝着河岸的方向鸣炮，想把看不清的东西赶开。河边的树丛、船只和响声，后来都成了人们解释这座城市名字的线索。
  - 市政府资料并列保存地方传说和建城记忆。这个故事里的坤甸是加里曼丹的河港，和新加坡电影里的 Pontianak 同属区域女鬼传统，却各有自己的主人公和场景。
  map_label: 印尼坤甸
  location_note: 标记两河汇合的坤甸城市一带。
  source_numbers:
  - 1
  - 2
case_id_semarang_gombel_hill_wewe:
  kind: legend
  paragraphs:
  - 车从三宝垄的贡贝尔坡上去，路两边常见密树林。来路不熟的人讲过路旁人影和突然出现的大蛇，也有人把这一段认作 Wewe Gombel 的住处。爪哇故事里的她是个长发老妇，专抱走没人照看的小孩。
  - 当地居民还记得山上宾馆有生意的年代，那时小孩甚至会去游泳。宾馆停业后，树林和空楼更容易被讲成了同一个怪异地方。居民在采访里把亲眼见过的道路变化和听别人说的鬼话分别讲了出来。
  map_label: 三宝垄贡贝尔坡
  location_note: 标记 Banyumanik 一带的坡道路段。
  source_numbers:
  - 1
case_id_semarang_lawang_sewu_basement:
  kind: legend
  paragraphs:
  - 千门楼里的走廊和门扇叫人走着走着就忘了刚从哪儿来。当地最常提到的现代故事在地下室：电视试胆节目安排参与者停留，镜头中被人认出一抹白色的长发人影，像在远处看着参与者。
  - 节目让许多人先记住那段影像，后来才去看曾经的铁路办公楼。回访报道记录了翻修与建筑用途，也保留观众如何用一个极短的镜头重新想象整栋楼的经过。
  map_label: 三宝垄千门楼
  location_note: 标记三宝垄的铁路文化地标。
  source_numbers:
  - 1
  - 2
case_ph_baguio_diplomat_hotel_nun:
  kind: legend
  paragraphs:
  - 有人在碧瑶旧酒店拍了一段供朋友看的视频。片子传上网后，评论里有人让他们倒回去看背后，说一道影子像穿长袍的修女。后来还有一家游客望向楼上，也用“像修女”形容出现在窗边的轮廓。
  - 守过夜的人另外讲到自己梦见一名神父。GMA 的报道保留了这些各自不同的叙述。酒店早年与多明我会有关，楼梯、窗户和空廊把这段建筑来历和后来访客展示的影像连到了一起。
  map_label: 菲律宾碧瑶旧酒店
  location_note: 定位遗产山旧建筑一带。
  source_numbers:
  - 1
  - 2
case_ph_manila_manananggal_night:
  kind: legend
  paragraphs:
  - 白天看来是一名普通女人的角色，到夜里能把上半身从身体分离，飞出门外。讲故事的人往往不让邻居一开始就认出她，直到一个夜归者仰头或发现空着的屋子，才把白天遇到的人同夜里的东西对上。
  - 现代电影反复给她换居住地点。研究者从 1984 年的电影段落看到 2023 年的再演绎，记录旧村里的恐惧怎样被搬进城市的楼房与邻里关系。卷宗的马尼拉点位代表现代传播背景。
  map_label: 马尼拉
  location_note: 论文和现代媒体流传参照，角色故事地点随作品改变。
  source_numbers:
  - 1
case_th_lopburi_krasue_glow:
  kind: legend
  paragraphs:
  - 泰国的一种夜路讲法说，先看到飘来的红光，靠近才知道是个离开身体的女人头。这个叫克拉苏的角色总在入夜后出来，常同村边和养禽的地方一起被提起。后来的人只要见到忽明忽灭的光，也会用这个故事猜测光从哪里来。
  - 泰国公共电视台回顾了华富里的近年传闻，当地报道最后把其中一次恐慌同装扮后窜入养禽处的人联系起来。地方口述中的怪物又在当代电影里换成有姓名、有家人、被同村人追捕的角色。
  map_label: 泰国华富里府
  location_note: 华富里点位对应公共电视台提及的当代传闻区域。
  source_numbers:
  - 1
  - 2
case_th_isan_phii_pob_ravenous_spirit:
  kind: legend
  paragraphs:
  - 依善村落把 Phi Pob 的故事讲进熟人之间。恶灵可以藏在身边，趁人生病或失常时显出异样的饥饿。讲述者解释，有人保不住身上原有的法力或犯了禁忌，才把自己变成它。
  - 研究者在泰东北访问居民，记录他们如何从身体不适、邻人评语和旧故事里判断遇到了什么。不同人可以对同一件事有不同解释。比较时可以看见，害怕的对象有时逐步从想象的怪物变成邻里中的某个人。
  map_label: 泰国依善地区
  location_note: 依善地区参考点，口述来自泰东北的多地田野。
  source_numbers:
  - 1
  - 2
case_cn_tw_tainan_chen_shouniang_record:
  kind: legend
  paragraphs:
  - 府城的故事里，陈守娘早年守寡，受欺凌而死后化为厉鬼。她回到活人居住的街巷讨说法，一度连庙里出面的神明也压不住。地方讲古会沿着城隍庙、旧市集和神庙，把寻找她的路线走一遍。
  - 留声时代也给她留了声音。研究者在二十世纪三十年代的八张《台南烈女记》曲盘里对照不同唱段，看见故事怎样在祭祀、街谈与唱片之间迁移。台南今有走读路线，陈守娘在城里的故事地点多于一处。
  map_label: 台南府城
  location_note: 点位为中西区旧城参照，故事跨越多个地标。
  source_numbers:
  - 1
  - 2
case_jp_yamagata_nanokamachi_jinmenken:
  kind: legend
  paragraphs:
  - 山形城里的传闻把人面犬说成一条并不大的狗。它走得慢，在街边出现时，远看仍像平时能碰到的狗；让讲述者记住的偏偏是那张脸。学生把七日町一带指作它的出没地，于是本来熟悉的商街也有了不同的看法。
  - 采录者还记下山形的说法和东京不完全一样，山形版本特意强调体型小、行动迟钝。具体街区和动作，让一种外地也有的传闻变成了能用山形地名讲给别人听的故事。
  map_label: 山形七日町
  location_note: 标记日文研记录提及的山形市七日町一带。
  source_numbers:
  - 1
  - 2
case_jp_ishinomaki_taxi_winter_coat:
  kind: legend
  paragraphs:
  - 震后不久，有石卷出租车司机回忆，初夏一个深夜自己在车站候客，后座上来一名穿冬衣的女人。她要去的南滨町当时已有很多空地。司机问她一定要过去吗，两人听来像是在正常交谈，女人却反问自己是否已经死了。
  - 司机说，他从镜里回看，座位已经空了。田野记录还保留了受访司机后来对这个故事的态度：最初吓得动不了，再想起它却开始同情可能还想回去的人。这个版本保留了灾后城市里的具体街道和司机口述。
  map_label: 日本石卷站
  location_note: 上车地标为 JR 石卷站；目的地在石卷南滨町。
  source_numbers:
  - 1
  - 2
case_kr_hong_kong_grandma_school_rumor:
  kind: legend
  paragraphs:
  - 韩国的校园传闻说，一位跟团赴香港的老太太过世后，变成了半人半猫的婆婆鬼。她能摸到留在家里或在外独行的小孩。孩子们在放学路上交换说法，有人记住的是猫脸，有人记住的是大人没回来之前门外的动静。
  - 研究者把它放回韩国出境旅游兴起的年代。香港在这个版本里是故事里的旅行目的地，实际流传群体主要在韩国。后来漫画和影视把婆婆鬼讲得好笑，儿童间又流行起别的蒙脸怪谈。
  map_label: 韩国
  location_note: 韩国为有记录的传播地，故事中的香港是虚构旅行目的地。
  source_numbers:
  - 1
case_kr_red_mask_pandemic_variants:
  kind: legend
  paragraphs:
  - 韩国孩子听来的故事说，晚上落单时会遇见一名戴红口罩的女人。她从暗处走近，让人把注意力全放到遮住的脸上。在一些讲法里，等她露出嘴，已经来不及像路上遇见普通人那样擦身过去了。
  - 疫情期间，口罩成了日常用品，网络短剧和短电影便把这则怪谈倒转过来。红口罩女人重新走上街，却在人群都戴着口罩时失灵，以前吓人的沉默反而成了笑点。韩国论文逐一比较了这些改编。
  map_label: 韩国
  location_note: 标记韩国整体传播区，学术材料涉及多地版本。
  source_numbers:
  - 1
  - 2
case_kr_busan_jangsan_voice_mimic:
  kind: legend
  paragraphs:
  - 萇山怪谈的恐惧先来自声音。山里有人叫，听起来像熟人，转过去却看不见人。用来解释电影来源的一则故事说，一个孩子被爸爸的声音叫醒，聊了几句又睡着，后来才知道爸爸一直在另一间房。
  - 电影导演把这种分不清来源的亲人声音写进萇山怪物，也提到童话里老虎冒用孩子母亲的声音。新故事沿用的，就是听见越熟悉的声音、越容易放下警觉这一点。
  map_label: 釜山萇山
  location_note: 标记传闻常用的釜山萇山区，不指定单次夜间听闻的位置。
  source_numbers:
  - 1
  - 2
case_cn_hunan_yuanling_corpse_inn:
  kind: legend
  paragraphs:
  - 故事说，有外乡人客死，同行者要把他送回去。三个人黄昏投宿时，店家给他们另开一间房，给两个人送饭。那第三个人没有上桌，整夜站在门边，到了第二天才继续跟在后面走。
  - 徐珂的笔记保存了分房与送饭的说法。沈从文又提及辰州一带的传闻，以及当地老人如何一本正经地把送尸讲成走远路的行当。话题一次次进入报刊，讲述人对它的来历始终各有解释。
  map_label: 湖南沅陵
  location_note: 沈从文所指辰州为今沅陵，传说中的送行路线跨越湘黔等地。
  source_numbers:
  - 1
  - 2
case_th_dan_sai_phi_ta_khon_procession:
  kind: legend
  paragraphs:
  - 丹赛有一种讲法，说被迎回城的王子一路穿过林子。归队时队伍越来越大，跟着出来的不全是人，连林中的灵也进了队列。看热闹的人转过去一张张辨认，那些异样的脸已经混在人群里。
  - 今天鬼面节会戴上细长的面具，腰间的铃声在路上响成一片。地方报道保存了鬼随人进村的说法，也记录了居民如何用面具和游行把它讲给每年新来的观众。
  map_label: 泰国丹赛
  location_note: 标记黎府丹赛县的节庆中心。
  source_numbers:
  - 1
  - 2
case_th_isan_guardian_expulsion_fieldwork:
  kind: legend
  paragraphs:
  - 村人过去遇事会去求村里的守护灵。后来，一些人反过来相信，接连的不顺正是这位守护者带来的。请来的仪式专家也认为它已经成了恶灵，于是把从前供奉的存在赶出了村子。
  - 田野论文还记了另一个村子：原先的守护灵渐渐无人顾及，神龛里的旧标记换成了佛像。两则记述都写到从前维持村里平安的角色，后来有了令人害怕的面目。
  map_label: 泰国依善地区
  location_note: 论文覆盖泰东北村落，未用故事代称推定具体庙址。
  source_numbers:
  - 1
case_vn_dalat_prenn_pine_villa:
  kind: legend
  paragraphs:
  - 顺着山口进大叻，公路边的一栋别墅背靠松林。当地故事说，夜里会听见屋里有女人哭，也有守门人说曾被什么赶出门。记者带人到那里过夜，风从窗缝灌进来，潮味重，二楼还放着一张揉乱的席子。
  - 凌晨，门边真的掠过一个长发身影。一行人屏住气，直到二楼传来鼾声，才知道有个到这里睡觉的人。落在空屋上的传说没有随这次夜访一起消失，山口的人仍知道那幢楼叫“鬼屋”。
  map_label: 越南大叻
  location_note: 标记普伦山口通向大叻的公路一带。
  source_numbers:
  - 1
case_la_southern_spirit_forest_lost_exit:
  kind: legend
  paragraphs:
  - 村民讲，一个士兵走进有灵的树林，看见不少烟叶，便采得比自己用得完的还多。临回去时，他绕来绕去，看见的只有树，再也认不出刚才进来的口子。
  - 他想起拿得太多，决定把烟叶放回林子。东西一落地，那条原来怎么都找不到的出口就出现在前面。记录者把这则恐惧故事同村民对林中资源的规矩放在一起，指出害怕迷路本身也让人记得少取。
  map_label: 老挝南部
  location_note: 编者只标老挝南部，地图使用地区参照。
  source_numbers:
  - 1
case_ph_tiyanak_cry_at_night:
  kind: legend
  paragraphs:
  - 走夜路的人忽然听见小孩在哭。循声找过去，通常只能看见一个像被丢下的婴儿。故事把最让人想伸手去帮的时刻写成危险的一刻：等人走近或抱起来，孩子才露出不寻常的样子。
  - 菲律宾的讲述并不总给它同一种身世。访谈里的学者比较了把这类鬼同未受洗的婴儿联系起来的版本，以及更广的地方妖灵说法。不同版本都用相似的哭声，让过路人误以为有人需要照顾。
  map_label: 菲律宾
  location_note: 地图为群岛流传范围参照，故事未指定某条道路。
  source_numbers:
  - 1
  - 2
case_cn_tw_lantern_chair_aunt_sanggu:
  kind: legend
  paragraphs:
  - 元宵夜里，有人把纸画放在一张竹椅上。问话时，扶椅的人看它会不会动。当地的讲法说，椅子请来的叫三姑。这个女孩母亲早亡，跟着嫂嫂生活，后来受虐而死，尸身被藏在猪槽下。
  - 传说让生前无法说话的人，通过一张家里常见的小椅子给出答复。黄金田把聚在一起看椅子的场面画了下来。典藏说明还保存了不同于单纯鬼故事的另一面：这也是元宵夜里一次集体问事。
  map_label: 台湾岛
  location_note: 典藏保存的是台湾元宵民间习俗，故事未标具体地点。
  source_numbers:
  - 1
case_kh_stung_treng_red_neck_rapids:
  kind: legend
  paragraphs:
  - 两条河汇合的急流原有一座小小的灵屋。船家说，得先问住在这里的“红颈”肯不肯放船。水坝蓄水后，急流和灵屋都在水面以下，人们不再知道这位河灵去了哪里。
  - 田野访谈里，一位村民听说“红颈”动了怒，连村里一名干部的病都被拿来跟这件事联系。另有人说河灵拒绝接近大坝。熟悉的急流已经看不到，关于它的主人还能不能回来，反而成了新故事。
  map_label: 柬埔寨上丁省
  location_note: 地图标旧激流的河段参照，不以现有水面判定昔日灵屋点位。
  source_numbers:
  - 1

# 2026-11-23 续编地方怪谈
case_cn_jinan_dorm_mop_legend:
  kind: legend
  paragraphs:
  - 夜过半了，女生宿舍的盥洗室里还有人在拖地。一名找同伴的学生见到一位老太太，随口劝她早些休息。老太太应了一声，把拖把往桶里一搁，慢慢走出了走廊。
  - 女生继续找人，越走越觉得那一幕奇怪。她折回盥洗室，才发现老太太留下的其实是她失踪的同伴。民俗学者马星宇把本科时听来的这个版本放在论文开头，并指出类似故事在不同高校流传。
  map_label: 济南
  location_note: 以研究所涉山东大学在济南的城市位置表示校园传播范围，故事未给楼栋。
  source_numbers:
  - 1
case_cn_meigu_ghost_boards_1992:
  kind: legend
  paragraphs:
  - 1992 年初春，巴莫曲布嫫坐早班车沿美姑山路前行，见草绳将木板绑在树干上。车上一位老人认得这种板，给她讲了紫孜妮楂的往事。故事里，白獐化成的女子为了替丈夫治病，远赴雪山取雪。丈夫趁她离开请来祭司，她在归途化成了山羊，仍带着雪往家赶。
  - 变形的女子被射杀，山中流水把她送到另外一处。吃了羊肉的人接连死去，故事说他们成了祸害聚落的鬼。老人把这段往事同路旁的木板连了起来：板上画鬼，沿着山道送去鬼山。后来巴莫曲布嫫靠近一块板，当地同行者和过路人对触碰所表现出的避忌，也被她写进了田野手记。
  map_label: 美姑
  location_note: 标在四川凉山美姑县城，以县域代表访谈场所；口述中的鬼山与故事地点另有各自指涉。
  source_numbers:
  - 1
case_cn_yuanyang_qingkou_night_road:
  kind: legend
  paragraphs:
  - 从箐口村去附近的哈尼小镇，有一段白天照常走、夜里却被妇女们避开的路。村里的男性希望她们去镇上做工，她们回答说，走那条路夜里会遇鬼。山路上究竟会看见什么，讲述里没有固定形貌，值得害怕的是得在天黑之后独自走过去。
  - 长期在当地调查的马翀炜追问这段夜路为什么会成为顾虑。按他在讲座中的回顾，听过类似故事的男人后来也接受了这种顾虑，外出做工受到的催促随之改变。他以这一场景说明，一则遇鬼故事如何进入村里日常的协商。
  map_label: 箐口村
  location_note: 地图指向云南元阳县箐口村一带，夜路所经位置未由研究者公开。
  source_numbers:
  - 1
case_cn_shanghai_vampire_school_rumors:
  kind: legend
  paragraphs:
  - 流传在上海学生之间的故事，给夜里的陌生人安上了同一个名字：吸血人。有人把故事放到浦东，有人讲成郊区实验室的事故。另一支讲法换到旅馆：两名少女同住，一人去洗手间迟迟未归，另一人赶过去时，只见一位红衣老太太从里面走出来。
  - 旧版本用房间、走廊和洗手间营造恐惧，另一版本则把危险藏在生化研究的想象里。2015 年《太阳报》的专栏并列转述了这几种网络回顾和校园传闻。人名、街区和发端年代随着讲述变动。
  map_label: 上海
  location_note: 标上海市作传播锚点；叙事中的旅馆、实验所与个别城区位置均无可定位的出处。
  source_numbers:
  - 1
case_cn_kanas_lake_wake_2005:
  kind: report
  paragraphs:
  - 2005 年 6 月 7 日傍晚，李筱陵和同伴乘船经过喀纳斯湖三道湾附近。他们停车拍照时，远处水面突然扬起了成片浪花。一道拖长的水线分成前后两路，向湖心移动，两分钟左右便消失了。李筱陵用随身摄像机拍下这一幕。
  - 在电视采访中，拍摄者能指出的是水面上浪花的形状和移动方向。把这种影像放回当地早已有的巨鱼传说，便有了广为传播的湖怪目击版本。画面以风浪和水痕为主，现象的原因仍需通过影像以外的材料判断。
  map_label: 喀纳斯湖
  location_note: 地图采用喀纳斯湖湖区锚点，报道所称目击处在三道湾附近。
  source_numbers:
  - 1
case_cn_shennongjia_road_yeren_2007:
  kind: report
  paragraphs:
  - 2007 年 11 月 18 日中午，王东和同伴开车到神农架老君山。车拐过一个弯，他们在右手的草地上看到两个一高一矮的黑色身影。司机喊出了野人的名字；路旁的身影随即钻进公路下方的灌木。他们没来得及开摄像机，把经历报给了附近的林业管护站。
  - 后来仍有报告者带调查人员进山找足迹和毛发。参加过早年查访的动物学研究者汪松在 2007 年采访中谈到，既往的物证多可追到已知动物。北京自然博物馆的周国兴也把足迹、观察距离和熊直立的可能性列入讨论。
  map_label: 神农架
  location_note: 标神农架林区范围内代表点。采访称目击在老君山里叉河一带，未提供现场坐标。
  source_numbers:
  - 1
case_cn_heizhugou_disappearing_valley:
  kind: legend
  paragraphs:
  - 黑竹沟深处有一段峡谷被叫作罗索伊达。一个和向导家里有关的版本说，1950 年，一队军人进沟后失去消息，只剩一名背着粮食的人活着出来，由向导的父亲救下。进沟之后队伍去了哪里，后来只从幸存的那一端讲起。
  - 2021 年，一支由山地、测绘人员和当地向导组成的队伍花了四天三夜穿越核心地带，报告了局部地磁偏转。发布会上转述的失踪故事和这次实际行程，保存了同一座山谷的两类记述。
  map_label: 黑竹沟
  location_note: 地图落在峨边黑竹沟景区区域，失踪故事中的行路位置不详。
  source_numbers:
  - 1
case_ph_samar_biringan_city:
  kind: legend
  paragraphs:
  - 萨马岛一带的船夫说，海上偶尔能望见一座灯火通明的城市，高楼亮着金色的光，城里住的却是传说中的恩坎托。有人拍下远处灯光，还说听见了车声和婴孩的哭声。船夫奥兰多说自己到过这座城，带电视采访组去看传闻指向的岛。
  - 另一回，一名随车在海上通行的人也把拍到的发光建筑认作比林甘。城市从海面突然出现，亲历讲述和手机影像便成为新版故事用来取信听者的线索。比林甘的位置在不同说法里有所游移。
  map_label: 萨马岛
  location_note: 坐标用于浏览萨马岛及其沿海讲述地区；鬼城只在传说中出现。
  source_numbers:
  - 1
  - 2
case_cn_tw_lukang_night_procession_2006:
  kind: report
  paragraphs:
  - 鹿港发生令居民惶惶的死亡事件后，故事从一户人家传到了附近的街巷。夜里，地方庙宇出面设坛，护送的队伍从街区向镇外移动。陈仕贤记录，队伍沿途响起鞭炮，送往海边或郊外时，人们相信一同送走的还有会滞留在街巷里的煞气。
  - 彰化县文化局保存了 2006 年鹿港的现场照片与科仪说明。鹿港人俗称这场夜间送行是送肉粽。档案还保留了当地人怎么理解它：出殡后的送行给惊惧的人们一个能共同看见的终点。
  map_label: 鹿港
  location_note: 坐标标示记录地鹿港镇；地方科仪的路线随场次而变。
  source_numbers:
  - 1
case_sg_tekong_third_door_bunk:
  kind: legend
  paragraphs:
  - 传言说，德光岛一名新兵走完行军路线后失踪，后来死在林地里。营房随即有了闹鬼说法；原本两扇门之外，人们又开了一扇，好叫无处可走的身影离开。版本传来传去，新兵被找到时的情形也变得越来越骇人。
  - 曾在该连服役的 S M Ong 写道，他曾在故事所指的营房住三个月，那里的确有第三扇门。军旅生活里，他看到的门从未打开，一直挂着锁。列队与巡夜之间，怎么会多出这一扇门，仍是故事过多年还被问起的地方。
  map_label: 德光岛
  location_note: 用岛屿范围表示故事传播地。营房未公开定位。
  source_numbers:
  - 1
case_id_jakarta_jeruk_purut_headless_pastor:
  kind: legend
  paragraphs:
  - 雅加达南部有座公墓，人们把路上看见的一个无头身影讲成神父。故事尤其喜欢放在周四入夜，那时已经算进入星期五的前夜。有人说，到了受敬奉的墓附近，会撞见这个自己走动的身影。
  - 2013 年，detikTravel 的记者跟着守墓人埃科·桑托索走过墓地。他转述过来者说起的目击，也说不上为何偏是一名神父。墓园原有祭扫日常，此后又添了电影转演和慕名试胆者，两类来到墓园的人走的是同一条路。
  map_label: 南雅加达
  location_note: 位置指向南雅加达 Jeruk Purut 公墓所在一带，故事未标定特定墓位。
  source_numbers:
  - 1
  - 2
case_ph_siquijor_tayog_ghost_ship:
  kind: legend
  paragraphs:
  - 锡基霍尔岛拉齐一带的人转讲，夜间的海上会有一艘船出现。它叫泰约格，不止一人声称看过，可一到午夜，船就从视野里消失了。有人把船上看不清的乘客猜成传说里的恩坎托。
  - 2019 年，地方有人说终于用视频拍到了船。电视组先和当地人出海查看，之后重返拉齐，继续追问半夜出现的船影。这里保存的是流传故事和两次节目回访，子夜船影究竟是哪一次航行仍须另行查证。
  map_label: 拉齐
  location_note: 坐标为菲律宾锡基霍尔岛拉齐镇沿海锚点，故事没有固定航迹。
  source_numbers:
  - 1
  - 2
case_vn_my_lai_house_of_the_dead_1993:
  kind: legend
  paragraphs:
  - 1993 年春，越南中部一名男子清早往稻田去，路过战时烧毁的旧宅，望见亡妻坐在石头上。三个孩子挤在她身后，像是怕大人吵架。男子一眼就认出了这一家人，回去想着该给妻儿迁葬，却只攒到卖椰子的一点钱。
  - 他同邻居商量借钱之际，妻子的一位亲属从远处赶来，答应分担费用。她在下葬当天告诉来访的人，亡者一家也在梦里找过她。人类学家权宪益在《越南战争的鬼魂》开篇收录了这一故事，讲述者将重逢的惊异与家属战后如何重新安葬写在一起。
  map_label: 美莱
  location_note: 以广义省美莱一带作采录地锚点。战争死者家属所住村落与旧宅未标精确位置。
  source_numbers:
  - 1
  - 2
case_kr_busan_ami_dong_cemetery_ghosts:
  kind: legend
  paragraphs:
  - 釜山阿米洞的山坡，先是殖民时期日本侨民的墓地，战后又接纳了迁来的人。为了搭房，墓葬及其用物进入了居民的生活空间。后来，这片山坡有了日本亡灵出没的讲述，研究者也把当地称作鬼火的题材列入同一组材料。
  - 民俗研究者 김정하 追访聚落历史，把传说同居民对动过亡者墓地的忧惧联系起来。它讲的鬼究竟是谁，在很大程度上由山坡上两代人的生活史决定。阿米洞的当地传说也留下了日本殖民时期、战后人口变迁与朝鲜战争重叠的城市记忆。
  map_label: 阿米洞
  location_note: 地图标在釜山市西区的阿米洞，研究对象是整个山坡聚落。
  source_numbers:
  - 1
case_kr_seoul_bongcheon_webtoon_2011:
  kind: legend
  paragraphs:
  - 夜归女孩走近一名动作古怪的女人，忽然听她问起自己的孩子在哪里。女孩朝一边指，希望把女人引开。她刚要离去，女人却折回来，逼近她的视野。读者向下翻页时，画面和声音会一齐把这一折返推到眼前。
  - 漫画家 Horang 利用网页滚动触发动作，SBS 在 2011 年访问了他。他确认奉天洞故事和另一部同型作品都是虚构。故事以首尔街区作舞台，传播则发生在网页、转发及读者拍下的惊吓反应之中。
  map_label: 首尔奉天洞
  location_note: 奉天洞是作品地名，坐标用于数字原生空间的地理参照。
  source_numbers:
  - 1
  - 2
case_th_bangkok_sathorn_ghost_tower:
  kind: report
  paragraphs:
  - 曼谷湄南河附近本来要竖起一座豪华公寓楼。1997 年，工程停在只剩框架的阶段。年头久了，有人专门来找这座钢筋混凝土空楼，给它叫出了鬼楼的名字；楼里实际栖了蝙蝠和鸟，记者还望见一只在半空楼层露面的花猫。
  - 大楼近入口处供着一座小小的神龛，香燃过后，旁边摆下打开的红色汽水。看守人告诉美联社记者，那是给鬼喝的。鬼楼这个名字跟着弃楼传播多年，神龛前的供品则是看守人如何同这座弃楼相处的现场细节。
  map_label: 曼谷沙吞
  location_note: 坐标是建筑所在街区锚点。建筑为停工工地遗存。
  source_numbers:
  - 1
case_cn_tw_yushan_yellow_raincoats:
  kind: legend
  paragraphs:
  - 一名登山者从玉山下来，路上起了雾，前后队友都望不见。他看到前方有三个穿黄色雨衣、戴斗笠的人，就快走了几步跟上。那几个人走得太快，他绊了一下，再抬头发现他们已经走向悬崖，在半空里不见了。
  - 登山读物把这段讲述放在玉山黄色小飞侠的说法之下。它还提到，同样是落单或迷路，有些人口中的身影穿黄色雨衣，有些人想到的是红衣女孩。故事里看似可依靠的同行者，恰恰把人引向了危险边缘。
  map_label: 玉山
  location_note: 标玉山山区代表点。来源所说的下山路段未给出经纬度。
  source_numbers:
  - 1
case_jp_yokohama_yosuke_hanako_1990:
  kind: legend
  paragraphs:
  - 横滨某所学校里，学生说两个厕所各住着一个名字。男厕的是洋介，女厕的是花子。叫过名字，就只有三秒能逃；慢下来会被抓住。又有人说，在男厕里唤花子，也能见到便器里伸手。
  - 林英一于 1990 年发表的记录保存了这组说法。除了洋介、花子，有些学生还说厕所里住着太郎、次郎。同一座校园里，能叫出谁的名字本身就成了试胆规则的一部分。
  map_label: 横滨
  location_note: 采录标为横滨市，档案未公布小学名称。
  source_numbers:
  - 1
case_jp_miyawaka_inunaki_village:
  kind: legend
  paragraphs:
  - 故事说，穿过犬鸣旧隧道会到一个地图上找不到的村庄。那里另有自己的规矩，进去的人再也回不来。这个网络传说被搬上银幕后，一个女人留下隧道后还有村子的说法，失踪与意外把主人公引向同一个地名。
  - 研究者鳥飼かおる在 2018 年分析过这座想象中的村庄怎样借用筑丰一带的地方形象。宫若市对 2020 年影片的说明，也把真实的水坝、集体迁移及道路改建与银幕情节分开记载。
  map_label: 宫若
  location_note: 地图以福冈县宫若市表示数字传说借用的地区。旧隧道入口和虚构聚落未作坐标。
  source_numbers:
  - 1
  - 2
  - 3
case_la_hin_heup_bed_following_ghost:
  kind: legend
  paragraphs:
  - 年轻人服役三年回来，黄昏时推开恋人的门。屋里漆黑，女子说点灯会吓到他。两人仍像从前一样说话，直到他认出眼前的人已经死了，而她的身体一直留在搬不动的床上。他找借口溜出门，用滴水的壶和替他答话的虱子拖住她。
  - 女子背着仍黏在身上的床，追进山林。年轻人钻进树洞，一只灵猫换上他的衣服，引开了她。2014 年，讲述者 Tanaly 在老挝欣合县把这个追逐故事讲给采录者，也说明了故事里的家族为何从此忌杀灵猫、忌用那种树作柱。
  map_label: 欣合县
  location_note: 标万象省欣合县一带，代表 Khone Keo 村的采录范围。
  source_numbers:
  - 1
case_th_rasi_salai_don_phudin_white_follower:
  kind: legend
  paragraphs:
  - 一名村民想做一架新楼梯，便与朋友进 Don Phudin 林子取木。两人出来时，朋友回头说有个白衣人跟着。他什么都看不见，仍把木料带回家。走到家门，他忽然发起烧来。在他的讲法里，后来有人把病和树林里的木头连到了一起。
  - 他去问懂得当地仪式的人，对方说是守林的 Chao Pho 动怒。讲述者说，致歉后事情才平息。这个版本和同片林子里其他受惊、失物的口述一起收入田野集，显示祖灵林的规矩平日怎样约束取用木料。
  map_label: 拉西沙莱
  location_note: 标泰国四色菊府拉西沙莱县，故事涉及县域内 Don Phudin 祖灵林。
  source_numbers:
  - 1
case_kh_keo_seima_dream_glass_2014:
  kind: legend
  paragraphs:
  - 蒙多基里一对夫妇讲，旧时村里在山上放牛，找不到牲口，就求山中的灵帮忙，过些天牛往往会回来。夜里，这位看不见的守护者又托梦给一些村人，告诉他们玻璃样的东西怎样从石里出现，以及去哪里能找到。
  - 人们带着寻来的亮石回到山林，在聚会时共同敬拜。夫妇把这场梦和地方名盖西玛联系在一起。故事由 2014 年的奔农族田野采录保存，讲述者指认的山林与他们接受访谈的地点分属同一省内不同地方。
  map_label: 盖西玛
  location_note: 标蒙多基里省盖西玛地区，故事称林地在 Sre Preah，访谈在森莫诺隆。
  source_numbers:
  - 1
case_gb_enfield_poltergeist_1977:
  kind: report
  paragraphs:
  - 1977 年 8 月 31 日，伦敦北部恩菲尔德一户人家听见卧室里有窸窣声和敲击声。母亲上楼后，一家人说斗柜突然挪了位置，随即去找邻居。邻居进屋找敲击的来源，说那声音仿佛跟着他在屋里移动。
  - 超心理研究学会后来派莫里斯·格罗斯与盖伊·莱恩·普莱费尔记录现象，留下音带和证词。学会保存的调查综述也承认，有些后续场景出现过蓄意作假的迹象。这个卷宗把最初一夜的说法与后来不同来源的记录相连。
  map_label: 恩菲尔德
  location_note: 地图按伦敦恩菲尔德区锚定调查，使用城区位置。
  source_numbers:
  - 1
text_cn_ma_xingyu_campus_horror_2016:
  kind: research
  paragraphs:
  - 马星宇把大学校园里的恐怖故事当作都市传说来读。他以山东大学为例，先记下本科时听同学讲的盥洗室故事，再把注意力移到故事的讲述者和场所：学生经过熟悉的楼道、寝室和共用空间，讲的却是深夜里那些不能独自核对的事。
  - 论文把反复出现的类型、同学间的口头转述和网络传播放在一起看。作者认为，传说可以提供消遣，也让在校生用共同的故事确认自己熟悉一处校园。换了一所学校，故事的地点会变，而夜间走过校园仍是听者易于代入的经历。
  source_numbers:
  - 1
text_vn_kwon_ghosts_of_war_2008:
  kind: research
  paragraphs:
  - 人类学家权宪益在岘港周边访问战后居民，并参考早些年在美莱与河美的调查。他在书中称一处聚落为 Cam Re，那里同一户人家的果园中往往散布着十几座旧坟。研究从统计家户照看的坟墓入手，再请住户讲他们如何遇见、辨认和照顾墓里的亡者。
  - 作者发现，当地人给游魂供食，也为一些死者寻找重新安葬的机会。书中的显灵故事因此有两个时间点：有人死去的战争年代，以及多年后家人或陌生人觉得必须回应的当下。第 1 章的美莱故事保留了这种联系，亡妻和三个孩子出现之后，活人开始为迁葬筹钱。
  source_numbers:
  - 1
