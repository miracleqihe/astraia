case_cn_eastern_wu_hunping_maidiquan:
  kind: history
  paragraphs:
  - 三国东吴至西晋时期的江南长江下游与浙东墓葬中，流行一种造型极为繁复华美的青瓷随葬器物——“魂瓶”（考古界亦称堆塑罐、谷仓罐），现存如纽约大都会艺术博物馆所藏西晋越窑青瓷魂瓶（藏品编号 1992.165.21）即其代表。器身下半部保留古代贮藏五谷的“仓罐”实用轮廓，上半部则高高堆塑出飞檐楼阁、胡人乐舞俑、飞鸟辟邪兽、龟趺碑碣乃至早期佛像，常在罐腹小碑刻写“仓满五谷、招魂定魄、千秋万岁”等吉语，为离体魂魄提供丰衣足食且不受惊扰的微缩灵界居所。
  - 与实体青瓷魂瓶相表里的，则是同期墓室随葬的铅券、砖刻或玉石“买地券”（兼含镇墓解谪文）。此类文书完全模仿汉晋人间田宅买卖契约格式：载明亡者姓名、购置墓地“东至青龙、西至白虎、南至朱雀、北至玄武”的四至边界与出钱数万买自“土公/地下五帝/武夷王”的交易细节，请日月星辰或东王公、西王母为证人，末句赫然勒以道教式律令“死生异路，不得相注，急急如律令”。
  - 从宗教史与法文化视角综合观察，魂瓶与买地券共同标志着中国古代丧葬镇护观从纯粹兽形威慑迈向“官僚契约化”：墓葬不再仅仅依靠镇墓兽面目狰狞吓退鬼怪，而是借世俗地契和仓储明器将地下幽冥纳入文书合法管辖，一方面安抚亡灵勿再“注连”祸及生人，另一方面以法律凭证阻绝地下小鬼侵占墓田的危机。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国浙江绍兴与江苏南京（孙吴两晋越窑青瓷魂瓶与买地券集中出土区）
  location_note: 越窑青瓷魂瓶（堆塑罐）及砖刻、铅板买地券大量出土于三国东吴至两晋时期的南京、镇江、绍兴、上虞等江南墓葬，坐标取太湖以西宁镇绍核心考古带。
case_cn_minnan_wangchuan_plague_ship:
  kind: story
  paragraphs:
  - 绵延于福建厦门、泉州、漳州沿海宫庙并远播台湾与东南亚华埠的“送王船”（或称王醮、烧王船），是集社区公共防疫焦虑、海洋护境信仰与大型器物厌胜于一体的宏大仪式传统。每逢三至五年一届定期大醮，当地信众延请造船匠师严格按古帆船比例打造彩绘木质王船（亦称“王舡”），船内配备精微的舱房、水手偶人、米粮日用、铜锣旗帜乃至官印符箓，迎接“代天巡狩”诸姓王爷驻跸庙宇。
  - 在仪式高潮“普渡”与“抢孤/添载”之后，整套程序的核心落脚于“收瘟押煞”的驱逐逻辑：道士或执事手持法鞭巡绕各家街巷，象征性地将潜藏在社区的五方疫鬼、夭亡孤魂（“好兄弟”）及船难厉魄一并驱赶收束、装入王船舱内并贴封条禁锢；继而民众列队护送王船前往海滨空旷沙滩（早期亦有装帆顺风放流大海之俗，近世多改于海滩堆筑金纸木柴举行“化吉”火化），火光升腾之际所有仪仗退走不准回头，寓意瘟疫与凶煞已随王船彻底押送出海、不复返归社区。
  - 民俗史学者及德·格罗特《中国的宗教体系》第六卷均留意到，沿海地区湿热交蒸、古代舟楫往来频繁易暴发季节性瘟疫与海难，送王船在心理与社会治理层面恰恰把无形的疫病危机感，转化为一场全村社动员、分工修船清扫街巷并共同送走灾厄的净化仪式。2020 年联合国教科文组织将其列入名录时，亦特别关注其在当今海洋文化传承与跨国社群团结中的现代转型。
  source_numbers:
  - 1
  - 2
  - 3
  map_label: 中国福建厦门与泉州湾 · 闽南送王船仪式核心分布区
  location_note: “送王船”发源于闽南厦门湾、泉州湾沿海渔港并跨海流播至台湾与马来西亚马六甲，坐标取厦门湾作闽南母体社区文化参照区。

theory_zhenwu_four_pervasiveness:
  kind: research
  paragraphs:
  - 人类在面对旱涝虫疫、门庭路煞与生老病死等难以彻底掌控的自然及社会变数时，往往借助具体物质实体来安顿群体秩序与心理期待。英国人类学者马林诺夫斯基（Bronisław Malinowski，1948）在《巫术、科学与宗教》中揭示，仪式与护物并非盲目的前科学替代品，而是在实用技术到达能力边界后承担缓解焦虑、重建行动信心的文化装置；美国人类学者莱斯利·怀特（Leslie A. White，1949）在《文化的科学》中进一步阐明，人之所以生活在区别于单纯生物环境的意义宇宙中，关键在于人类拥有为平常石木器物赋予“符号化”共享语义的独特能力，从而将内心的祈愿与戒备外化为可触摸、可安放的实体秩序。
  - 将这一象征人类学框架运用于中国数千年的镇物民俗谱系可见，镇物的本质正是“心化的器物”与“物化的精神”双向互构：一方面是观念向器物凝结，另一方面是器物以空间标定反塑群体心智。就物质载体而论，自然界的山石草木（泰山石、桃梗、艾叶、灰弓药材）、人体随身的佩饰衣冠（五彩长命缕、百家锁、虎头鞋帽）以及工匠雕铸的造作器物（青瓷魂瓶、风狮爷、瓦猫、镇水铁牛）构成“自然·身之·人工”三相载体；就社会时空场域而论，则全面嵌入“岁时节令、护身安命、家宅屋宇、路道关津、婚丧墓葬、御凶驱疫”六大功能域，并呈现出时间上“无时不有”、空间上“无处不在”、取材上“无物不用”、主体上“无人不与”的“四无通贯”普及格局。
  - 该理论的学术适用边界与历史演进视角同等重要：随着农业、公共卫生与营造技术进步，许多原本带有强烈畏煞防灾意味的厌胜镇物逐步向“纳福祈祥、节令娱乐与民俗装饰”淡化转型（例如除夕压祟向压岁礼俗演化、门神桃符向年画春联流变）。本文在专题分类与理论命题线索上参照陶思炎《中国镇物》（台北：东大图书公司“沧海美术·艺术特辑”，1998 年，ISBN 957-19-2210-2）之体系成果，并结合《后汉书·礼仪志》等公版文献及国际人类学名著独立撰写；研究具体个案时，须将文化符号的心理凝聚效用同工程物理防护与现代医学防灾严格区隔。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
mech_underworld_bureaucratic_projection:
  kind: research
  paragraphs:
  - 帝制时代中国及其周边东亚文化圈的幽冥想象，既非单纯的鬼魅恐怖幻象，亦非全盘照搬域外宗教图景，而是将人间的州县衙门、文书公案、官吏考课与司法审判程序高度同构地投射至死后世界。汉魏出土镇墓券文已出现“地下丞”“墓伯”等阴官职衔；历经南北朝至唐五代《佛说十王经》对印度阎摩神话的官僚化改写，复经宋明清泰山七十六司、城隍庙夜巡查案、道佛放赦文牒以及劝善书《玉历宝钞》的普及，地府演化出一套设殿分司、逐七递解、执簿核罪、可凭冥契替偿且接受生人“告阴状”申冤的完整行政机器。
  - 社会学与历史人类学研究揭示了这种“制度投影”与“心理代偿”的双重机理。马克斯·韦伯（Max Weber）在《中国的宗教》中指出帝制家产官僚制把社会伦理与宇宙秩序统摄于等级分明的职司体系；杨庆堃（C. K. Yang，1961）阐明“弥散性宗教”如何把世俗官府结构嵌入民间神明崇拜；武雅士（Arthur P. Wolf，1974）更通过对台湾田野的观察提出经典命题：神明对应有印信俸禄的“帝国官吏”、祖先对应宗族“亲属”、游魂厉鬼则对应流离的“陌生人”。太史文（Stephen F. Teiser，1994）与康豹（Paul R. Katz，2009）则从《十王经》写卷与城隍神判史料出发，证明当阳间州县衙门因路远费昂、官商勾结或证据匮乏而难伸冤情时，“阴曹不徇私情、明镜高悬、六月飞雪”的幽冥司法便成为庶民慰藉屈辱、重建因果正义感的关键代偿机制，甚至反过来对基层调解、盟誓发愿与乡约约束产生真实威慑。
  - 本机制的经验解释边界须严密限定：将十殿阎罗、城隍案卷与鬼魂诉冤戏曲理解为帝国行政秩序的象征投影与社会正义代偿，并不意味着历史上存在真实超自然的阴司裁决，也不说明每宗“阴审”“托梦破案”故事都记录了客观案件侦破；同时，如《聊斋志异·考城隍》或清代公案戏曲所讽喻，民间对冥吏贪贿、烧纸通融与错拘替身的想象，本身也折射出庶民对现实衙门吏治腐败的深层不信任。在专题分类对照上，本条目参考徐华龙主编《中国鬼文化大辞典》（南宁：广西民族出版社，1994，ISBN 978-7-5363-2780-1）之冥神与幽冥诉讼分类脉络，正文依据传世史籍及学术专著独立撰成。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  - 5

motif_cn_underworld_bureaucracy_system:
  kind: research
  paragraphs:
  - 中国及东亚的幽冥想象在两千余年的演进中凝结为一套高度“官僚化与契约化”的死后世界模型，其主轴由泰山治鬼、东岳七十六司、十殿阎罗与地方城隍司四个层次叠加而成。早在汉代《后汉书·乌桓鲜卑传》与出土东吴六朝买地券中，亡魂便被视为需赴“泰山”登记户籍并以官文券契向地下神吏购地安身的主体；唐五代敦煌写卷《佛说十王经》将佛教地狱观念与中国州县公堂递解制度合流，塑造出头七至三年十次过堂审理的“十殿冥司”；宋明清以来，城隍神位入列国家祀典而如世俗知府知县掌理一邑阴阳刑名，北京东岳庙塑设统摄寿夭禄籍的“七十六司”，民间劝善书《玉历宝钞》更把孽镜台照罪、孟婆汤忘忧、奈何桥验行与焚化纸钱受生债编织进日常生死伦理。
  - 从制度人类学与比较宗教学检视，这一母题群之所以深植民间社会，在于其同时承担了“道德奖惩规训”与“基层司法代偿”双重功能。如武雅士（Arthur P. Wolf，1974）与康豹（Paul R. Katz，2009）所论证，城隍夜巡暗访、考城隍文学寓言乃至“告阴状”“烧放赦牒”，都借拟人化的官僚簿籍表达普通民众对“程序清廉、冤屈终雪”的期盼；而在新加坡虎豹别墅等二十世纪公共展陈空间（参见相关个案），十殿苦刑雕像更转化为跨海华人社群进行家庭伦理劝诫的视觉剧场。
  - 本母题枢纽在分类线索上参考徐华龙主编《中国鬼文化大辞典》（南宁：广西民族出版社，1994，ISBN 978-7-5363-2780-1）关于冥界神系、十王地狱与冥器纸钱之编目体系，正文则依据《玉历宝钞》、敦煌写卷目录、城隍非遗档案及太史文（Stephen F. Teiser，1994）等学术专著独立撰述。比较分析各成员节点时，须严格区分宗教劝善文本修辞、现实法制史料与文学寓言讽刺（如《聊斋》《子不语》），不可把阴司职官叙事直接视为历史上确实存在过的社会组织实体。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
motif_cn_nuo_funeral_liminal_rites:
  kind: research
  paragraphs:
  - 本母题群聚焦中国社会应对“疫病凶煞”与“死亡断裂”的两大阈限仪典集群：其一是以清场逐疫为核心的“大傩与军傩”传统，其二是以招魂安灵、调解阴阳为主轴的“中元普度与丧葬仪轨”。在先秦两汉文献中，《周礼·夏官》与《礼记·郊特牲》记载方相氏披熊皮、黄金四目、率十二兽于岁终“索室驱疫”并入圹驱除墓中邪祟，东汉《后汉书·礼仪志》进一步记录百余名“少年童子”齐声和唱逐疫歌的宏大宫廷仪程；该脉络此后向民间演化为皖南池州五猖请神、贵州安顺屯堡军傩地戏“开光封箱”等面具祭演体系。与此同时，起自战国《楚辞·招魂》“魂兮归来”及《仪礼·士丧礼》登屋复魂之制，合流佛教目连救母与道教中元地官赦罪，演化出七月半放水灯、竖幡招引、做七回煞、烧纸扎冥器与孤魂普度的庞大仪式网络。
  - 过渡礼仪理论与跨文化临床心理学为这一母题群提供了互补的阐释维度。依据范·热内普与维克多·特纳（Victor Turner，1969）的阈限结构分析，岁末新旧交替、中元鬼月开闭及亲人新丧“五七”之内均属日常结构暂停的危险悬置期，傩仪面具、纸幡结界与火盆水灯正是在脆弱边界上区分生人与亡者、界定可接触范围的文化符号；另一方面，临床丧亲在场感研究（Rees，1971；Kamp 等，2020）证实，头七“回煞”、梦中托嘱与水灯祭奠等集体哀悼仪式，为生者在经历丧亲幻觉或剧烈悲痛时提供了被社群接纳的情感缓冲。
  - 本母题在类别整理上参照徐华龙主编《中国鬼文化大辞典》（南宁：广西民族出版社，1994，ISBN 978-7-5363-2780-1）及陶思炎《中国镇物》（1998，ISBN 957-19-2210-2）关于驱疫傩仪、婚丧镇护之文献线索，正文严格依据公版经传与当代人类学及非遗调查报告撰写。分析湘西“赶尸”、重丧避煞或面具附体等传闻时，必须将演剧性科仪、地方口述想象与真实公共卫生或临床哀伤心理分界说明。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
motif_cn_ethnic_spirits_marvels:
  kind: research
  paragraphs:
  - 中国古代至近世的“精灵物怪”知识体系呈现出“博物图谱制祟”与“多民族生态敬畏”双线交织的特征。先秦《山海经》与六朝托名东方朔的《神異经》系统铺陈九尾狐、毕方、山魈（独足鬼）、魑魅魍魉与刑天、西王母等荒外异象，往往把水旱疫火等物候灾兆编码为奇禽异兽之出现；及至晋葛洪《抱朴子·登涉》与敦煌藏经洞出土唐代彩绘写卷《白泽精怪图》（法国国家图书馆藏 P.2682 及英藏 S.6261 残片），更发展出“辨识精怪名讳即可破其妖祟”的百科全书式防御逻辑——凡老木之精名彭侯、山石器物久而成精、夜半呼名乃狐狸或老鸡化形，皆可通过呼其本名与顺应物候予以制伏。
  - 另一方面，在云南、西藏、贵州及广西等西南山地与多民族交错带，神鬼与精怪谱系深深扎根于族群历史记忆与生态伦理之中：藏族《格萨尔》降魔叙事、彝族毕摩馆藏古文献（大英图书馆 EAP081 档案）与撒尼叙事诗《阿诗玛》、丽江纳西族东巴象形文《神路图》与护持水林的“署神”崇拜，以及港台闽浙民间关于狐仙、水鬼、黄鼠狼“讨封”与器物“付丧神”的口述故事，均将山林溪谷视作人类与非人自然生灵订立契约、共享疆界的生态共同体，一旦过度采伐污秽或冒犯禁忌，便在口述传统中被解释为遭精怪反噬或致病。
  - 本母题梳理参照徐华龙主编《中国鬼文化大辞典》（南宁：广西民族出版社，1994，ISBN 978-7-5363-2780-1）及邓启耀《巫蛊：中国文化的历史暗流》（2025，ISBN 978-7-5598-7994-3）涉及自然物候崇拜与边疆民族神谱之归目线索，正文依据传世古籍、联合国记忆遗产及大英图书馆档案独立撰写。研究精怪传说时，需辨析早期自然灾异气象误读（如磷火鬼火、大气折射、野生动物夜鸣）与族群森林水源保护习惯法之间的功能差异。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
motif_cn_zhiguai_ghost_opera:
  kind: research
  paragraphs:
  - 中国古代关于鬼魂、精魅与死后复仇的叙事文学，沿着“史官实录式志怪—宋元市井传奇公案—明清文人拟托笔记与仪式鬼戏”三大脉络层累生成。魏晋南北朝干宝《搜神记》与刘义庆《幽明录》确立了宗定伯卖鬼、干将莫邪三王墓复仇、离魂赴约、亡灵报恩等基本母题框架；唐宋时期《太平广记》汇录鬼部千余条，洪迈《夷坚志》更以实录笔法广记街巷鬼市、冥感与鬼火奇闻；到了元明清时代，这一叙事传统同时向案头虚构与舞台演剧双向勃发——清代蒲松龄《聊斋志异》（《画皮》《聂小倩》《考城隍》）与袁枚《子不语》借狐鬼讽喻世态科场，纪昀《阅微草堂笔记》以礼理辩驳幽冥，而关汉卿《窦娥冤》的六月飞雪亢旱三年、传统戏曲《乌盆记》的陶盆寄声、汤显祖《牡丹亭》的冥司判婚还魂，以及徽州目连救母仪式鬼戏和台南《林投姐》，则将“冤鬼诉冤”与“冥途寻亲”铸成大众共同体验正义伸张的剧场模式。
  - 在民俗叙事学与社会史研究视野中，巴斯科姆（William Bascom，1965）对神话、传说与民间故事的体裁界分有助于厘清这批材料的多重文本层位：许多早期志怪及《夷坚志》条目兼有地方“传说”实信色彩，而元明清戏曲及《聊斋》文本则高度自觉地运用“鬼魂入梦、物证发声、清官阴审”等戏剧成规。其共享核心结构往往体现出对阳世司法无力或礼教压抑的补偿性想象：当无权势的弱女子、被害行商或受屈书生无法通过常规诉讼洗冤时，鬼魂显形、血溅白练或梦诉包公便充当了维系伦理可信度的最后仲裁。
  - 本母题在归目上参照徐华龙主编《中国鬼文化大辞典》（南宁：广西民族出版社，1994，ISBN 978-7-5363-2780-1）之鬼文学、公案戏曲与民俗故事编次线索，正文依据传世经典校本、丁乃通（1978）故事类型索引及近世戏曲史研究独立撰成。分析相关故事或戏曲时，须注意宗教仪式剧（如目连戏请神送煞规矩）与纯文学案头戏剧在演出禁忌及受众功能上的显著差别。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
motif_global_comparative_myth_complex:
  kind: research
  paragraphs:
  - 从比较神话学与全球宗教史的宏观视野出发，人类不同文明在相互独立或跨大陆交往的谱系中，反复围绕三大结构母题展开叙述：其一是“原初水域、天地分离与宇宙柱”（如盘古开天、共工触不周山、两河劈分提阿玛特、毛利朗伊与帕帕分离、北欧世界树与诸神黄昏、潜沙取土创世）；其二是“英雄或神祇下冥界试炼与回望禁忌”（如伊南娜过七门、俄耳甫斯回望失妻、伊邪那岐赴黄泉比良坂、玻耳塞福涅食石榴籽、玛雅英雄双子过西巴尔巴、那奇凯塔问阎摩）；其三是“跨文化附体出神与妖术迫害”（如埃塞俄比亚扎尔灵、海地伏都教罗瓦骑乘、近世欧洲《女巫之锤》与苏格兰、塞勒姆猎巫审判，以及全球各地高度相似的“夜压鬼压床”体感叙事）。
  - 面对跨洲神话的高度相似性，当代比较学界强调将“历史谱系传播假设”与“人类共性认知及社会机制”并行校验：一方面，维茨尔（Michael Witzel，2012）与别列兹金母题分布索引尝试追踪“劳亚型”和“冈瓦纳型”长时段口述迁移线索；另一方面，针对冥界试炼与巫术恐慌的对比研究显示，农业季节枯荣、丧亲失落、非常意识状态（ASC）中的解离出神以及快速眼动期睡眠瘫痪提供了跨文化的体验基底，而在遭遇宗教冲突、疫病动荡与审讯司法化（如 1487 年《女巫之锤》与 1768 年江南叫魂案的比较）时，相似的社会替罪焦虑又会在截然不同的文化外衣下爆发制度性迫害。
  - 本母题枢纽在跨文化归类上衔接汤普森母题索引、OCM 754/776 编码及邓启耀《巫蛊：中国文化的历史暗流》（2025，ISBN 978-7-5598-7994-3）中有关中西巫术与心身状态对照之思考脉络，正文基于各文明公开典籍库与同行评审成果独立撰写。学术使用中务必严守类比限度：母题相似并不自动证明远古存在单一传播源，亦不可用任何医学假说（如塞勒姆麦角中毒说）粗暴替代复杂历史审判档案的社会史分析。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
corpus_cn_underworld_scriptures_opera:
  kind: research
  paragraphs:
  - 本文献群汇集连接中国“幽冥宗教劝善文本”与“戏曲公案演剧传统”的四大核心史料脉络：第一脉为敦煌藏经洞出土唐五代《佛说十王经》图绘写卷（如大英图书馆藏 Or.8210/S.3961）及早期目连变文，首次以图文并茂的长卷形态定型亡灵七七过殿、奈何桥与判官审案的程序架构；第二脉为宋元明清流行于江南及西北河西走廊的“民间宝卷”（如吴地宝卷、河西宝卷与《血盆经》劝善唱本），借说唱宣卷把十王因果与孝道伦理带入村社妇孺听众；第三脉为元明清公案与还魂戏曲，包括关汉卿《窦娥冤》、汤显祖《牡丹亭》、传统剧目《乌盆记》以及清代“包公阴审”说唱剧本；第四脉则是贯穿明清至近世的通俗善书《玉历宝钞》及其附带地狱刑罚木刻版画。
  - 将敦煌经卷、宝卷说唱与戏曲公案并置对读，能够清晰透视传统中国民间社会如何跨媒介生产“阴司正义”：宗教经变提供了死后世界的行政空间地图（十殿分司、生死簿籍、孟婆忘忧台），宝卷宣讲将抽象教义转译为押韵可吟诵的家庭道德剧本，而元杂剧与地方鬼戏（如徽州目连戏及歌仔戏《林投姐》）更进一步把阴差捉鬼、陶盆发声与判官批婚搬上宗祠或庙会舞台，使观众在敬畏鬼神与宣泄冤抑的双重情绪中完成对人间伦常的再确认。
  - 在文献校勘与学术使用层面，研究者必须留意不同文本媒介的层累改写与版权边界：《佛说十王经》在敦煌各抄本间存在长短本、序赞增删及插图次序差异；元明杂剧传奇（如《窦娥冤》在《元曲选》与脉望馆抄本中的异文）经历过明代文人臧懋循等人的大幅润色；而各地宝卷与地方戏曲手抄本更是世代艺人口耳相传与坊刻杂糅的结晶，宜按具体藏本馆藏号与校勘版次逐一辨正。本群组编目参照徐华龙主编《中国鬼文化大辞典》（1994，ISBN 978-7-5363-2780-1）之戏曲宝卷书目线索独立撰写。
  source_numbers:
  - 1
  - 2
  - 3
  - 4

case_cn_jiangnan_liumeng_locust_ward:
  kind: story
  paragraphs:
  - 在明清至近代的江南太湖流域及江淮稻作区，每年春夏禾苗拔节之际与蝗灾威胁之时，乡间常围绕“刘猛将军”举行盛大的“青苗会”驱蝗护稼仪典。据《清史稿·礼志三》及清代笔记《清稗类钞》所载，雍正二年（1724 年）朝廷因江南、直隶地方官奏报“有猛将军庙处蝗不为灾”，乃诏令各省遍立刘猛将军庙并列入国家祀典，虽同时降谕告诫疆吏遇水旱蝗灾仍须修省实政、不得专事祈祷，然民间迎神巡田之风愈炽。
  - 围绕这一农神信仰，乡里发展出一套结合岁时、家宅与田畔空间的除虫镇物操作：在青苗会抬神像巡游田埂的同时，农家会在门壁或桑稻田角插立贴有“猛将驱蝗”符纸的竹牌，或以生石灰、草木灰配制“灰弓”（或用石灰灰水洒布、以桃枝竹弓弹灰及于门窗贴红纸剪刀），将古礼《诗经·小雅·大田》所谓“去其螟螣，及其蟊贼，无害我田稚。田祖有神，秉畀炎火”转化为大众可参与的驱虫护苗仪式。
  - 从昆虫生态学与象征人类学双重视角辨析，这一体系融合了真实农艺经验与心理防御：一方面，飞蝗在高密度群居时受血清素与信息素调控发生表型相变（Wang 与 Kang，2014），传统农业中燃火诱杀、挖沟掩埋、撒播草木灰及生石灰确能局部干扰蝗蝻趋光与体表呼吸；另一方面，灰弓与符牌本身并无超自然逐蝗效力，其真正社会功能在于借青苗会动员跨村落劳力联防统捕，并在缺乏现代测报与植保手段的年代安顿农户焦虑（镇物分类线索参照陶思炎 1998 书目）。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国江苏苏州及浙江嘉湖（太湖流域江南青苗会驱蝗民俗核心区）
  location_note: 明清以来江南苏锡常及杭嘉湖平原稻作区盛行祭祀驱蝗神刘猛将军与举行青苗会，坐标取苏州吴中太湖畔作江南农神祀典文化参照区。
case_cn_duanwu_wudu_tiger_charm:
  kind: story
  paragraphs:
  - 农历五月仲夏时节，南方梅雨渐盛、气温骤升而蛇虫滋生，传统历书素有“恶月”“毒五月”之忌，由此孕育出中国岁时镇物中最为密集的防御系统。南朝梁宗懔《荆楚岁时记》记载，五月五日鸡未鸣时采艾草扎为人偶、悬于门户之上“以禳毒气”，并以五彩丝系臂谓之“辟兵”；《后汉书·礼仪志》亦详录仲夏以朱索、五色印饰门户止恶气之官制。至明清时期，清代富察敦崇《燕京岁时记》等岁时志书进一步记录京城与各地士庶在门楣粘贴木版朱印“五毒符”、插挂菖蒲艾叶并编结“艾虎”佩戴于幼童发际衣襟。
  - 这套岁时防护横跨自然草木矿物与身之佩饰两类载体：除植物性的艾叶、菖蒲熏燎与花椒丁香药囊（“香包”）外，各地还盛行取矿物雄黄研末拌酒洒喷墙角，并用指蘸雄黄酒在幼童额头书写“王”字，取百兽之王虎形镇压蝎、蛇、蜈蚣、壁虎、蟾蜍“五毒”之义；在衣物刺绣方面，亲属更为婴幼儿缝制虎头鞋、虎头帽及绣有五毒图案的“五毒兜肚”，寄寓“以毒攻毒、借虎噬祟”的护幼祈愿，展现出镇物从畏煞辟邪向爱幼祈福演进的典型轨迹。
  - 从公共卫生与现代毒理学加以审视，端午艾蒲熏室与清理积水确有驱避蚊虫、改善湿热居室环境的卫生价值，但民间“饮雄黄酒”或以雄黄涂抹破损皮肤却暗藏严重健康隐患。明李时珍《本草纲目》虽记雄黄“杀百毒、辟邪魅”，现代化学与胃肠模拟生物可及性研究（Zhang 等，2011）已确证，雄黄主要成分为二硫化二砷，不仅本身含可溶性无机砷，受热或与部分成分反应更易转化为剧毒三氧化二砷（砒霜），绝不可内服饮用或大面积敷涂幼童皮肤。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国湖北武汉及江汉平原（荆楚至中原端午岁时镇物核心区）
  location_note: 南朝宗懔《荆楚岁时记》系统记述江汉地区仲夏端午采艾、五彩丝辟兵风俗，明清《本草纲目》《燕京岁时记》详录五毒符与艾虎雄黄礼俗，坐标取武汉江汉核心区作参照。
case_cn_southwest_village_gu_stigma_asc:
  kind: history
  paragraphs:
  - 在中国西南及中南山地多民族交错带的历史档案与民族志记录中，“巫蛊”并非孤立的妖术传闻，而是一套直接重塑婚姻圈层、村落边界与人际信任的社会污名制度。早在初唐官修《隋书·地理志下》中，史官已载江南部分州郡土俗疑有“畜蛊”之家，常以“蛊主”视之而遭邻里避忌；至宋代周去非《岭外代答》、清代地方志及二十世纪前期学者冯汉骥、施莱克（Feng 与 Shryock，1935）所整理的苗疆、滇黔与湘西田野调查，更详细记录了所谓“带蛊人家”（或称“草鬼婆”“蛊婆”）如何被周围村寨划出明确通婚禁区（“蛊界”），甚至出现同一村落因突发重疾指认某户“养蛊”而实施绝交、迁寨或毁屋逐客的习惯法制裁。
  - 值得与跨文化精神医学和毒理史并置分析的，是所谓“中蛊者”所呈现的躯体与意识异常症候。田野报告与古典医籍（如《诸病源候论》）中描述的中蛊发作，常表现为突发胸腹剧痛、呕吐眩晕、间歇性昏厥、语无伦次或伴随剧烈抽搐与惊恐呼号——此类表现一方面可能源于湿热气候下的急性胃肠感染、寄生虫病或植物毒物误食，另一方面则高度契合路德维希与跨文化精神医学（Bhavsar 等，2016）所界定的“非常意识状态”（altered states of consciousness，简称 ASC）及“文化苦痛表达”：处于极度家庭压力、婚姻矛盾或群体焦虑中的个体，会以文化共享的“被放蛊”语码体验并表达解离性或心因性躯体症状。
  - 社会学与历史人类学研究进一步指出，之所以“带蛊人家”的标签在历史上多落于独居寡妇、通婚外族女性或村寨边缘贫户身上，并非因为她们真的掌握秘密生物毒术，而是熟人社区在遭遇不明疫情、家畜暴毙或宗族利益失衡时，借助“放蛊归因”将无序灾祸具象化为可隔离、可驱逐的内部替罪对象（参见邓启耀 2025 与徐华龙 1994 之社会民俗分类研究线索）。在现代基层治理与临床医学实践里，破除“蛊界”歧视与误诊的关键，正是同时提供循证医疗排查与去污名化的社群支持。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国湖南湘西与黔滇桂交界山地（西南村寨“蛊界”民族志及史志文献区）
  location_note: “放蛊”“带蛊人家”及通婚隔离“蛊界”传闻主要见于唐宋以来湘西、黔东南、桂北及滇西北边地志书与二十世纪田野民族志，坐标取湘黔交界武陵山区作历史文献参照区。
case_cn_digital_wugu_cloud_rumor:
  kind: legend
  paragraphs:
  - 进入二十一世纪移动互联网时代，古老的“放蛊”“魅合”与“拆姻厌胜”话语并未随乡村熟人社会解体而消逝，而是在匿名树洞、短视频评论区与私域社群中演化为当代“云端诅咒”及数字巫蛊都市传闻。在这类线上叙事里，传统需要“履底书名、饮食投毒”的接触仪式，被转译为仅凭生日八字、社交账号头像或语音截图即可“远程下蛊”“隔空锁心”“反噬泄运”的网生传言；部分自称“民间传承人”的商业账号甚至借此推销高价远程“解蛊符箓”与“和合术”。
  - 在临床医学与认知心理学维度，多名亲历“收到匿名诅咒私信”后自称失眠、胸闷、脱发或诸事不顺的求助者，向学界提供了典型的“反安慰剂效应”（nocebo effect）与暗示传染样本。生理学家坎农（Walter B. Cannon，1942/2002）早已论证极度信念恐惧可触发自主神经强烈应激，晚近关于社交媒介诱发群体心因性反应的研究（Fremer 等，2022；Jeong 等，2024）以及跨文化精神医学调查（Stefanovics 等，2016）进一步表明：在高度不确定或情感失落情境下，网络匿名威吓会引导个体将日常偶发的生理疲惫、偏头痛或工作失误统一归因为“已中云端蛊咒”，在反向搜索和焦虑共鸣群组中持续放大躯体化症状。
  - 从社会民俗学与现代法治视角审视（参照邓启耀 2025 关于巫蛊文化当代流变之探讨线索），这类“云端诅咒”既证明象征思维在数字时代极具再生能力，也划定了清晰的实证与法律边界：远程头像或文字咒语在物理与生物层面绝无致病能力，相关症状属心因性焦虑或待排查的基础疾病，而以“代人下蛊”“收费破蛊”为名收取钱财或公开威胁他人生命健康的网暴行为，在当代社会正逐步纳入反电信网络诈骗、治安管理及人格权名誉权侵权规制之中。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  map_label: 中国主要都市及当代中文互联网匿名社交场域（数字民俗采集参照区）
  location_note: 当代“云端下蛊”“线上拆姻诅咒”及伴随反欺诈民事争议广泛见于中文社交媒体与都市年轻群体叙事中，坐标取上海都市圈作当代数字网络传播文化参照区。
case_cn_taishan_dongyue_76_bureaus:
  kind: history
  paragraphs:
  - 中国早期幽冥政治地理的核心枢纽始于五岳之首泰山。汉魏以来文献已明确记载“泰山治鬼”观念：晋陈寿《三国志·卷二十九·方技传》记管辂预知死期时叹曰“但恐至泰山治鬼，不得治生人”；晋张华《博物志》亦称“太山一曰天孙，言为天帝孙也，主召人魂魄，东方万物始成，知人生命之长短”。随道教神谱与朝廷封祀合流，泰山府君逐渐升格为统辖鬼神与人间寿夭贵贱的“东岳泰山天齐大生仁圣大帝”，各地乃广建东岳行宫。
  - 元延祐六年（1319 年），玄教宗师张留孙及弟子吴全节于元大都齐化门外营建北京东岳庙，明万历年间朝廷大加修葺（明内阁首辅张居正曾撰《敕修东岳庙碑文》记其盛）。庙内最具宗教社会学研究价值的建筑布局，正是御道东西两侧廊庑中按品秩依次排布的“七十六司”（现存北京民俗博物馆复原展示）：从执掌世人福禄寿考、生育求嗣的“子孙司”“催生司”“掌财司”，到掌管诉讼伸冤、惩戒欺诈的“速报司”“冤枉司”“欺心司”“水火司”“瘟疫司”，几乎把帝制政府六部九卿与州县公堂的全部行政职能完整复刻至阴间。
  - 历史人类学与法律史研究者（如 Katz，2009）指出，东岳庙七十六司并非只服务于死后审讯，更在活人社会发挥着强大的民间司法与道德规约功能：明清京师商贾与坊间百姓发生口角或债务疑难而官府难决时，常相约前往东岳庙“速报司”前跪立发誓、设盟质证（类似“告阴状”）；人们借助威严的官僚司曹群像，在国家正式司法之外建构起一套具象可见、自我约束的心理威慑体系（归类脉络参照徐华龙 1994 书目）。
  source_numbers:
  - 1
  - 2
  - 3
  - 4
  - 5
  map_label: 中国北京市朝阳区朝阳门外（北京东岳庙与七十六司遗址）· 兼涉山东泰安泰山祠祀源流
  location_note: 北京东岳庙现存于北京市朝阳区朝阳门外大街（今兼北京民俗博物馆），由元代正一道玄教大宗师张留孙建于延祐六年（1319 年），坐标取东岳庙院落核心位置。
case_cn_shidian_yanluo_mengpo_bridge:
  kind: story
  paragraphs:
  - 现存于大英博物馆（编号 1919,0101,0.80）与大英图书馆（如 Or.8210/S.3961）等馆藏的敦煌藏经洞唐末五代写本《佛说阎罗王授记四众逆修生七往生净土经》（简称《佛说十王经》或《预修十王生七经》），是中国冥界观演进史上的关键转折文献。正如太史文（Stephen F. Teiser，1994）通过比勘各本写卷所揭示，该经把源自古印度的死亡神阎摩（Yama）拆解重组为一位位公堂执事的“冥府十王”（秦广王、初江王、宋帝王、五官王、阎罗王、变成王、泰山王、平等王、都市王、五道转轮王），使亡魂在死后“头七”至“七七”、百日、周年及三年共计十个法定期限逐殿受审，并高度配合生人设斋荐拔的“生七”丧礼日历。
  - 宋元至明清时期，这一套图文并茂的经变图卷与地方宗族善书进一步融合，最终凝结为清代流布极广的劝善书《玉历宝钞》（又名《玉历至宝钞》）。在《玉历宝钞》及民间说唱宝卷中，十殿阎罗的空间叙事愈发严密而戏剧化：第一殿秦广王设“孽镜台”照显生前隐恶；第五殿阎罗天子前立“望乡台”使亡魂最后回望亲属；至第十殿转轮王殿前，更由司掌忘忧台之“孟婆”端出“迷魂汤”（孟婆汤），令行将跨过“奈何桥”赴六道投胎的灵魂彻底忘却前尘记忆，完成阳世人伦身份的清零重置。
  - 从宗教学与比较神话学检视，十殿体系与奈何桥孟婆构成了东亚独具特色的“文书化与时间化死后过渡程序”：既保留了古希腊勒忒河忘川饮水、古埃及秤心审判等跨越生死阈限的跨文化母题，又将中国儒家孝道（七七做七救拔先人）、佛教因果业报与帝制州县按期提审制度熔为一炉。在新加坡虎豹别墅等近代公共园林塑像中，这套源自敦煌与善书的十殿图景更跃出纸面，成为跨地域华人社会通俗伦理教育的视觉纪念碑。
  source_numbers:
  - 1
  - 2
  - 3
