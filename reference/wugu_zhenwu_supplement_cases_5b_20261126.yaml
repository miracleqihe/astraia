records:
  - id: case_cn_qin_zuchu_wen_curse
    title: 战国秦地｜《诅楚文》石刻盟誓与巫咸神前诅楚考实
    aliases:
      - 诅楚文
      - 秦祀巫咸神文
      - 大沉厥湫诅楚文
      - 亚驼诅楚文
      - Qin Curse Against Chu
    genre: historical_archive
    credibility_tier: A
    note_kind: history
    location:
      lat: 34.5210
      lng: 107.3950
      precision: city
      location_name: 中国陕西宝鸡凤翔（古雍州与北宋《诅楚文》石刻出土旧域）
      culture_region: 中国 · 关中秦国石刻与先秦盟誓史料区
    location_note: 北宋嘉祐年间在陕西凤翔府开元寺及渭水畔先后发现《诅楚文》三通石刻（或据传为宋代传拓复刻本），坐标取今陕西凤翔作秦故地文献参照点。
    temporal:
      year_start: -313
      year_end: 1064
      era_label: 战国秦惠文王后期（约前 313–前 312 年）盟誓刻石至北宋欧阳修《集古录》考订时期
      uncertainty_note: 《诅楚文》成文于战国秦楚交兵之际（学界多系于秦惠文王伐楚前夕，前 313–前 312 年），原石已佚，传世文本依赖北宋欧阳修《集古录》及《绛帖》《汝帖》刻本保存。
    paragraphs:
      - 《诅楚文》是中国金石学与古代巫祝文献史上年代最早的实物型政治诅咒盟书之一。现存铭文分向“巫咸”“大沈久湫”“亚驼”三神申诉祈告，北宋嘉祐年间先后现世于陕西凤翔等地，经欧阳修收录于《集古录跋尾》、苏轼咏于《凤翔八观》并详加考释。全篇以古拙石鼓字体式的秦篆勒石，陈述昔日秦穆公与楚成王“率诸侯而会，以百世不绝之盟”刻玉沉璧为信，指控当代楚王熊相倍十八世之诅盟、率诸侯之兵以临加秦境。
      - 值得注意的宗教行为学细节在于，铭文并未停留在口头咒骂，而是依托一套高度程序化的“神明诉讼”礼仪：秦王自称以“吉玉宣璧”献祭于巫咸、水神与山川大神之前，逐条举证楚方毁约夺地、内乱败德之罪，请神祇降罚“使之底败军旅、扑灭其社稷”，将外交背盟与战争动员转化为神前裁决的合法诉求。北宋欧阳修已敏锐比勘《史记·楚世家》，发现铭文所斥“熊相”并不直见于司马迁所记楚王世系，从而开启长达千年的古文字释读与历史人名互证辩论。
      - 当代出土文献与先秦礼制研究指出，与侯马盟书“埋牲书辞于坎”同源，《诅楚文》以石刻沉盟的形式把早期“以巫祝制敌”的巫术习惯纳入国家军政制度，折射出战国后期“巫蛊咒诅”在降为汉唐私室禁律之前，曾作为国与国交战前公开执行的宗庙仪式而存在。
    sources:
      - citation: 《诅楚文》（巫咸神文、大沈久湫神文、亚驼神文），维基文库金石传本。
        type: historical_text_transcription
        url: 'https://zh.wikisource.org/wiki/%E8%A9%9B%E6%A5%9A%E6%96%87'
        locator: 三体石刻全文“有秦嗣王敢用吉玉宣璧，使其宗祝邵馨布忠告于不显大神巫咸”段落
      - citation: 〔北宋〕欧阳修撰，《集古录跋尾》，维基文库四库全书校本。
