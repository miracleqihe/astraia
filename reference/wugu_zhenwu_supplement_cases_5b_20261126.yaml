  - id: case_cn_tang_code_gu_statute
    title: 历代刑律｜唐宋至明清“造畜蛊毒”与“采生折割”双轨禁律
    aliases:
      - 造畜蛊毒律
      - 造厌魅律
      - 采生折割人
      - 唐明清巫蛊法制
      - Imperial Gu Statutes
    genre: historical_archive
    credibility_tier: A
    note_kind: history
    location:
      lat: 34.2650
      lng: 108.9540
      precision: culture_region
      location_name: 中国陕西西安与北京（唐长安至明清京师刑部成文法典颁行中心）
      culture_region: 中国 · 历代成文法典与巫蛊禁律史料区
    location_note: 唐永徽律定本于长安，明清律典由南京、北京刑部颁行天下并涵盖州县司法复核，坐标取长安遗址作历代法制主轴参照。
    temporal:
      year_start: 653
      year_end: 1740
      era_label: 唐永徽四年《唐律疏议》（653 年）至清乾隆五年《大清律例》（1740 年）时期
      uncertainty_note: 《唐律疏议》卷十八定立“造畜蛊毒”“厌魅”，明洪武《大明律》增入“采生折割人”重条并归入十恶不道，清乾隆五年《大清律例》续以附例规范边省州县复审。
    paragraphs:
      - 自唐宋至明清，帝国成文法典对“巫蛊”与“毒蛊”始终维持高度戒备与跨代连续性，在《唐律疏议》《大明律》及《大清律例》中将其列为十恶之“不道”重罪。唐律《贼盗》卷十八明文规定：“诸造畜蛊毒及教令者，绞”，并追究同居亲属与里正坊正不纠之责；《大明律》与《大清律例》进一步将“造畜蛊毒杀人”升格为斩立决、财产入官及妻子同居人口流放二千里，并在“谋杀”“贼盗”旁增立专门严惩毁残幼童以行厌魅的“采生折割人”条（凌迟处死）。
      - 值得注意的是，尽管国家成文法对“蛊毒”与“厌魅”保持严厉高压，州县基层司法实践却长期存在“严律与慎勘”的双轨张力。清代《大清律例》附例及《洗冤录》系司法验尸手册在实务中反复告诫地方官吏：审理蛊毒或妖术控告必须详查实据、核验毒药实物与致死因果，严防奸民借“蓄蛊”“厌魅”诬告陷害良民或夺产报复；而在云贵桂湘苗疆与边远乡里，民间却仍常依据习惯法由乡老、宗族或寨规私下调停、驱逐乃至私刑处置被怀疑放蛊之人。
      - 当代中国法制史研究指出，将唐明清律典正条与乾隆三十三年（1768 年）江南“叫魂”大案的刑部复核奏折对读，可清晰辨析两条并行不悖的线索：朝廷既将地下“造畜、厌魅、剪发造符”视作潜在颠覆纲常与地方治安的威胁，又不得不在司法核验层面防范无据妖言引起的冤狱失控。这种制度性的张力，正是理解古代中国民间巫蛊恐慌为何反复涌现却又屡屡受阻于高等司法复审的关键所在。
    sources:
      - citation: 〔唐〕长孙无忌等撰（653 年），《唐律疏议·卷第十八·贼盗》，维基文库校本。
