  - id: case_cn_yunnan_wamao_roof_guardian
    title: 云南滇中｜传统民居屋脊陶塑“瓦猫”镇宅吞煞民俗
    aliases:
      - 瓦猫
      - 镇宅瓦猫
      - 屋脊瓦猫
      - 云南瓦猫民俗
      - Wamao Roof Guardian
    genre: folktale
