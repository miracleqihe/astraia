  - id: case_cn_luban_yansheng
    title: 明清匠作｜《鲁班经》厌胜镇物与传统木作厌胜化解民俗
    aliases:
      - 鲁班经厌胜
      - 木匠镇物
      - 鲁班尺吉凶
