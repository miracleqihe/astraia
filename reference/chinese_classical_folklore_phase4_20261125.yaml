  - id: case_cn_shanhai_jiuweihu
    title: 青丘之山｜九尾狐从瑞兽到食人妖异的二重谱系
    aliases:
      - 青丘九尾狐
      - 九尾狐
      - 涂山九尾白狐
      - Nine-tailed Fox
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 36.7500
      lng: 119.5000
      precision: culture_region
      location_name: 中国山东东部海岱青丘故地 · 古代东夷九尾狐神话参照区
      culture_region: 中国 · 齐鲁海岱神话传统区
    location_note: 先秦注家常以海岱东夷“青丘”比定《山海经》青丘之山，两汉九尾狐画像石则广泛出土于山东、河南与四川汉墓，此坐标作海岱文化参考点。
    temporal:
      year_start: -300
      year_end: 1050
      era_label: 先秦《山海经》至汉代瑞兽、唐宋狐魅转型期
      uncertainty_note: 战国《山海经》兼录其食人异性与辟蛊功效，汉代《吴越春秋》《白虎通》将其奉为王者祥瑞，唐宋笔记后方盛行媚惑幻形故事。
    paragraphs:
      - 《山海经·南山经》首载青丘之山“有兽焉，其状如狐而九尾，其音如婴儿，能食人，食者不蛊”；同书《海外东经》及《大荒东经》亦复记青丘国之“四足九尾狐”。在最早的先秦异兽谱系里，九尾狐并非后世温婉妖媚的书斋精怪，而是兼具食人凶猛之性与“食其肉可免蛊毒”双重巫药灵验的奇兽。
      - 至两汉时期，九尾狐跃升为政治与仙界的祥瑞徽号：《吴越春秋》记大禹三十未婚，行至涂山遇“九尾白狐”，遂娶涂山氏女以应王业；东汉班固《白虎通·封禅》称“狐九尾何？狐死首丘，不忘本也”，认为九尾象征子孙繁昌、德被远方时方现身的圣王符瑞；东汉墓室画像石亦常将九尾狐刻于西王母仙座之旁，伴随三足乌与玉兔象征长生。
      - 六朝《玄中记》至唐宋《广异记》《太平广记》再度挖掘狐狸“善魅、通灵、千年化女”的志怪一面，至明代《封神演义》妲己与清代《聊斋志异》灵狐分流成祸国妖孽与重情精灵。梳理这组从“食人奇兽—汉代瑞兽—唐宋妖异”的历史翻转，可见政治符瑞与民间想象如何层累重写同一神兽符号。
    sources:
