  - id: case_cn_shanhai_bifang
    title: 章莪之山｜《山海经》独足神鸟毕方与兆火灾异记录
    aliases:
      - 毕方鸟
      - 章莪山毕方
      - 木精毕方
      - Bifang
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 35.1000
      lng: 108.5000
      precision: culture_region
      location_name: 中国陕西关中西部与陇东山脉 · 西次三经“章莪之山”参照区
      culture_region: 中国 · 关中西北古山经文化区
    location_note: “章莪之山”出自《山海经·西山经》西次三经昆仑—钟山神话带，古籍方域对应关中以西山系，此坐标仅作文献方位参考。
    temporal:
      year_start: -300
      year_end: 220
      era_label: 战国《山海经》至东汉《东京赋》方相驱疫时期
      uncertainty_note: 《西山经》首记毕方“见则其邑有讹火”，西汉《淮南子》定为“木精”，东汉张衡《东京赋》将其列入大傩所逐火妖。
    paragraphs:
      - 《山海经·西山经》载，章莪之山不生草木而多瑶碧美玉，“有鸟焉，其状如鹤，一足，赤文青质而白喙，名曰毕方，其鸣自叫也，见则其邑有讹火”。同书《海外南经》亦记“毕方鸟在其东，青水西，其为鸟人面一脚”，塑造出中国上古神禽谱系中最醒目的独足火鸟意象。
      - 在汉魏以来的典籍流传中，毕方同时扮演着神官卫从与木火妖异的双重角色：《韩非子·十过》记黄帝合鬼神于泰山之上，“毕方并辖”，充当车驾护卫；而《淮南子·氾论训》称“木生毕方”，认为林木精气积久化为此怪；东汉张衡《东京赋》更写岁终大傩仪式中追逐“魑魅与毕方”，将其视为能引发无名怪火的灾异之精，须以礼仪驱逐。
      - 民俗与图像史研究常从三层线索解析“独足兆火神鸟”：一是先秦巫觋单足跳神（禹步或跛行傩舞）与草木钻火仪式的身体记忆；二是鹤鹳等涉禽单脚站立栖息时在暮色火光下留下的“一足”视觉印象；三是早期木构城市频发无名火灾（讹火），古人借怪鸟现身来解释突发性火患征兆。
