  - id: case_cn_kunlun_xiwangmu
    title: 昆仑瑶池｜西王母神格演变、穆天子会饮与不死药神话
    aliases:
      - 西王母
      - 昆仑仙境
      - 穆天子传
      - 不死药
      - Xiwangmu
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 36.4500
      lng: 94.8500
      precision: culture_region
      location_name: 中国青海昆仑山口与柴达木南缘 · 昆仑神山文化参照区
      culture_region: 中国 · 青藏与西北昆仑神话带
    location_note: 古代文献中的“昆仑之丘”与西王母之山兼含神圣宇宙中心与西域地理想象；近世地理命名为青海—新疆界山昆仑山脉，坐标仅作文化地域参照。
    temporal:
      year_start: -350
      year_end: 220
      era_label: 战国竹简《穆天子传》至东汉画像石兴盛时期
      uncertainty_note: 战国《山海经》与汲冢竹书《穆天子传》各呈异貌，两汉《淮南子》与汉墓画像石完成“长生仙境主神”的图像定型。
    paragraphs:
      - 《山海经·西山经》与《大荒西经》保存了西王母最早的荒古面貌：“其状如人，豹尾虎齿而善啸，蓬发戴胜，是司天之厉及五残”，主掌灾疫与刑杀，并有三只青鸟往来取食；而在西晋太康年间自战国魏王墓发掘出的《穆天子传》里，周穆王驾八骏西巡至昆仑瑶池，与西王母执白圭玄璧相见、互相赋诗唱和，展现出截然不同的西方邦国女主气象。
      - 至西汉《淮南子·览冥训》，“羿请不死之药于西王母，姮娥窃以奔月”将西王母确立为执掌长生灵药的神仙至尊；到了东汉，墓室画像石、青铜摇钱树与规矩镜普遍雕铸出头戴玉胜、端坐龙虎神座的西王母，身边簇拥捣药玉兔、九尾狐与三足乌，成为祈求羽化登仙与墓主灵魂升天的核心图像。
      - 把先秦竹简、传世文献与大都会艺术博物馆藏东汉画像石等出土文物并读，清晰可见一位上古“司厉之兽形山神”如何在数百年间演变为后世道教《汉武帝内传》中赐赠蟠桃仙丹的女仙之宗。这种演变见证了汉代方仙道、西域交通想象与丧葬永生观如何共同重塑传统神谱。
