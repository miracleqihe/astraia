  - id: case_cn_ashma_yi_epic
    title: 滇中石林｜彝族撒尼叙事长诗《阿诗玛》口传诗学与回声传说
    aliases:
      - 阿诗玛
      - 撒尼叙事长诗
      - 石林回声传说
      - Ashima
    genre: folktale
    credibility_tier: B
    note_kind: story
    location:
      lat: 24.8150
      lng: 103.3300
      precision: province
      location_name: 中国云南石林彝族自治县 · 撒尼村寨与石林喀斯特文化区
      culture_region: 中国 · 云南滇中彝族撒尼文化区
    location_note: 区别于单点风景区条目，本坐标对应云南滇中石林周边的撒尼支系村寨与长诗活态吟唱区域，聚焦民间诗学整理史。
    temporal:
      year_start: 1953
      year_end: 2007
      era_label: 撒尼古歌口传、1953 年采录整理与 2007 年世界自然遗产时期
      uncertainty_note: 撒尼彝语五言叙事长诗世代口传无确切起始年，1953 年工作组采录整理成汉译定本，石林喀斯特于 2007 年入选世界自然遗产。
    paragraphs:
      - 在云南石林彝族撒尼支系的语言与节庆生活里，《阿诗玛》既是一段深入人心的抗婚传说，更是一部按固定五言对偶格律吟唱的口传叙事诗。牧羊、婚嫁与火塘夜聚时，长诗以撒尼口弦为引，咏唱聪慧勤劳的姑娘阿诗玛拒绝土司热布巴拉逼婚，哥哥阿黑远归对歌赛箭救妹，却在渡河归家时遭遇山洪将阿诗玛卷走。
      - 诗篇尾声将丧亲之痛化入高原岩溶山水：落水的阿诗玛化为山峰间的“回声”，族人只要高声呼唤其名，石峰便以清越回音应答，仿佛少女仍在云崖深处守望村寨。1953 年，云南圭山工作组深入撒尼村寨收集了二十余份流传于不同歌师口中的撒尼语手抄与口述文本，经比较合校后译为汉语，并在 2006 年列入首批国家级非物质文化遗产名录。
      - 从口述诗学、版本整理史与喀斯特声学角度共读《阿诗玛》，可以看到三层脉络：撒尼语重叠比兴格律如何维系长篇叙事记忆、1950 年代整理本如何在多歌师异文中定型并进入舞台电影改编，以及世界自然遗产“中国南方喀斯特”石林陡立岩壁天然具备的清脆回声反射条件如何滋养了当地传说想象。
