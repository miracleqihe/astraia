  - id: case_cn_xizhou_pangu_creation
    title: 江左与南方｜三国《三五历纪》盘古开天与化身宇宙神话
    aliases:
      - 盘古开天地
      - 盘古化身
      - 三五历纪
      - Pangu
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 32.0600
      lng: 118.7900
      precision: culture_region
      location_name: 中国江苏南京（三国吴徐整文献辑撰地）与华南盘古俗传圈
      culture_region: 中国 · 江南与华南盘古神话区
    location_note: 盘古创世最早见于三国吴太常卿徐整所撰文献，南京为吴都建业所在；后世盘古庙会亦分布于华南多省，此坐标作文本定本文化参考点。
    temporal:
      year_start: 222
      year_end: 624
      era_label: 三国吴徐整《三五历纪》至唐初《艺文类聚》引录时期
      uncertainty_note: 徐整原著已佚，现存最早文字保存于唐欧阳询编《艺文类聚》（624 年）及明清类书《绎史》所引《五运历年纪》。
    paragraphs:
      - 见于唐初类书《艺文类聚》卷一引三国吴徐整《三五历纪》的记载称：“天地混沌如鸡子，盘古生其中。”经历一万八千年，天地开辟，“阳清为天，阴浊为地”，盘古顶天立地于其间，一日九变，圣神过天、智过地；随后“天日高一丈，地日厚一丈，盘古日长一丈”，如是再历一万八千年，天极高、地极深、盘古极长，然后始有三皇。
      - 另一组托名徐整所作、见于明清辑佚书《绎史》的《五运历年纪》与梁代《述异记》则记录了宏阔的“垂死化身”篇：盘古垂死之时，气息化为风云、声音化为雷霆、左眼为日、右眼为月、四肢五体为四极五岳、血液为江河、筋脉为地理、肌肉为田土、发髭为星辰、皮毛为草木、齿骨为金石、精髓为珠玉、汗流为雨泽，身上诸虫因风所感而化为黎民百姓。
      - 先秦两汉主流经子典籍均未见“盘古”之名，直至三国东吴经略南方百越山地后，学界推测江左文人可能吸收了南方“盘瓠”始祖记忆与道家混沌元气说，整合出盘古创世神话。将其与印度吠陀原人（Purusha）或北欧尤弥尔巨躯化生万物对读时，必须注意两者在“创世巨人肢解”母题之外各有独立的历史文本生成脉络。
    sources:
      - citation: 〔唐〕欧阳询等撰（624 年），《艺文类聚·卷一·天部上》引三国吴徐整《三五历纪》，维基文库校本。
        type: historical_text_transcription
        url: 'https://zh.wikisource.org/wiki/%E8%97%9D%E6%96%87%E9%A1%9E%E8%81%9A/%E5%8D%B7001'
        locator: 卷一引“天地混沌如鸡子，盘古生其中”开篇原文
