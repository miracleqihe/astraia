  - id: case_cn_zhubing_mengyan
    title: 隋代洛阳｜《诸病源候论》及古医案中的鬼魇与梦魇记载
    aliases:
      - 卒魇候
      - 鬼魇
      - 梦魇
      - 诸病源候论梦魇
      - 古代鬼压床医案
    genre: historical_archive
