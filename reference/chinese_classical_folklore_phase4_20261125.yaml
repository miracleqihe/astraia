  - id: case_cn_shanhai_gonggong_buzhou
    title: 昆仑西北｜共工怒触不周山与天柱折地维绝神话
    aliases:
      - 共工触山
      - 不周山神话
      - 天柱折地维绝
      - Gonggong
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 39.1500
      lng: 76.1500
      precision: culture_region
      location_name: 中国新疆喀什与帕米尔东麓 · 古西北“不周山”神话地理参照区
      culture_region: 中国 · 西北昆仑帕米尔神话区
    location_note: “不周之山”出自《山海经》西北荒服的想象地理，后世史地考证常将其比附帕米尔至昆仑山系；此坐标仅作文献地理参照，并非真实神山所在。
    temporal:
      year_start: -300
      year_end: -139
      era_label: 战国《山海经》至西汉《淮南子·天文训》（前 139 年）时期
      uncertainty_note: 共工之名早见于先秦典籍，而“怒触不周山、天倾西北、地不满东南”完整宇宙灾变叙事定型于西汉刘安《淮南子·天文训》。
    paragraphs:
      - 西汉《淮南子·天文训》记述，昔者水神共工与颛顼争夺帝位失败，愤怒之下以头撞击西北撑天巨柱“不周之山”，致使“天柱折，地维绝”。天穹随之向西北方向倾斜，故日月星辰皆朝西北运转；大地东南一角陷落不满，江河水潦与尘埃泥沙乃尽数向东南归注。
      - 后出《列子·汤问》将共工触山直接衔接至女娲炼五色石补天、断巨鳌之足以撑四极的修复篇章；而年代更早的《山海经·大荒西经》已载“有山而不合，名曰不周负子”，同书《海内经》《大荒北经》又保留共工臣属相柳九首食九山、喷吐腥水并遭大禹诛杀的治水支线。不同典籍中，共工的敌手亦存在颛顼、祝融、高辛或神农等多重异文。
      - 这则神话以高度戏剧化的神战冲突，把中国古代对“西北山岳隆起、东南低平入海”地势格局与北天极星象运行的观察融入宇宙创世论。当代神话学与地质史阅读中，宜将其理解为古人对天文历象与大河水势的诗意化解释，而非字面意义上的远古天体撞击事件。
    sources:
      - citation: 〔西汉〕刘安等编（前 139 年），《淮南子·天文训》，中国哲学书电子化计划（CText）。
