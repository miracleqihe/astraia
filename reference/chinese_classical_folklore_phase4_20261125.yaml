  - id: case_cn_gesar_epic
    title: 青藏高原｜藏族《格萨尔王传》神授说唱与降魔史诗
    aliases:
      - 格萨尔王传
      - 格萨（斯）尔
      - 神授说唱艺人
      - Gesar Epic
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 31.8200
      lng: 98.5800
      precision: culture_region
      location_name: 中国西藏昌都与川藏康巴草原 · 格萨尔活态说唱文化区
      culture_region: 中国 · 青藏高原藏族史诗文化区
    location_note: 《格萨尔》传唱广布青藏高原及蒙古族、土族等群体，康巴与安多留存密集说唱传统，此坐标仅作青藏草原史诗文化参考区。
    temporal:
      year_start: 1000
      year_end: 2009
      era_label: 吐蕃后分立时期口传定型至 2009 年联合国非遗名录
      uncertainty_note: 史诗核心传说约成型于公元 10 至 12 世纪，各部篇目随历代艺人与木刻本不断扩充，2009 年列入人类非物质文化遗产代表作名录。
    paragraphs:
      - 流传于中国藏族、蒙古族及土族民间的英雄史诗《格萨尔王传》（简称《格萨（斯）尔》）是世界迄今篇幅最宏大、仍在活态演述的口头史诗传统。全诗叙写雪域妖魔横行、黎民受苦之际，天界推巴噶瓦奉莲花生大师之命降生人间岭国，幼时化作贫苦丑童觉如，在赛马大会上力压群雄继位称王，随即率岭国诸将征战霍尔、姜国、门国与大食，并深入地狱救母。
      - 《格萨尔》最具特色的传承机制是“神授说唱艺人”（仲肯）：许多原本不识字的牧民艺人讲述自己在少年时历经一场剧烈奇梦、昏睡或山野异感后“胸臆豁开”，戴上特制史诗法帽便能清唱或散韵相间说唱数十部乃至数百万行长诗；此外还有圆光镜观象艺人、掘藏艺人、闻知艺人及木刻本读诵者等多元谱系。
      - 2009 年联合国教科文组织将其列入人类非物质文化遗产代表作名录。现代民间文学与认知民族志研究指出，“神授梦境”属于艺人获得社区神圣认可的文化叙事，实质仍依托从小浸润牧区说唱听觉记忆、程式化韵文格律与长时即兴重组技巧，应在尊重民族信仰的同时审慎区分宗教叙事与艺术记忆机制。
