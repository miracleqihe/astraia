  - id: case_cn_xiangxi_gu_poison
    title: 江南与湘西｜隋唐至明清地方志、医书中的蓄蛊毒与巫蛊焦虑
    aliases:
      - 蓄蛊毒
      - 放蛊传说
      - 巫蛊
      - 诸病源候论蛊毒
      - Gu Poison
    genre: historical_archive
    credibility_tier: A
    note_kind: history
    location:
      lat: 28.3100
      lng: 109.7300
      precision: culture_region
      location_name: 中国湖南湘西与武陵山区 · 明清方志蓄蛊叙事重点参照区
      culture_region: 中国 · 湘西武陵与江南古籍蛊毒文献区
    location_note: 《隋书·地理志》原将蓄蛊载于古扬州江南诸郡，宋明清方志与边疆游记则逐步将“放蛊”想象推移至湘西、黔东南与岭南，此坐标仅作文献流变参考区。
    temporal:
      year_start: 610
      year_end: 1935
      era_label: 隋唐史志医书（610 年）至明清方志及近代人类学检讨时期
      uncertainty_note: 610 年《诸病源候论》与《隋书》确立政书与医典的“蛊毒”叙述框架，清律仍设“造畜蛊毒”刑条，1935 年近代学界始作系统祛魅分析。
    paragraphs:
      - “蛊”（从虫从皿）在中国正史地理志与历代医典中留有长期记录。《隋书·地理志下》在述及江南数郡民俗时写道：“五月五日聚百种虫，大者至蛇，小者至虱，合置器中，令自相啖，余一种存者留之”，谓之“蛊”以暗害人命、图取财物；隋巢元方《诸病源候论》卷二十六《蛊毒病诸候下》与明李时珍《本草纲目》亦设专目，分述蛇蛊、金蚕蛊、挑生蛊等症状如腹痛呕血、昏厥消瘦及相应解毒药方。
      - 历史人类学与社会史学者指出，所谓“蓄蛊”在现实中高度交织着刑律严惩、区域偏见与基层污名。唐宋至明清法典严厉惩处“造畜蛊毒”，往往将边陲山地居民、外地客商或寡居女性贴上“蓄蛊放毒”标签，由此引发邻里猜疑、婚姻阻断甚至冤狱；1935 年冯汉骥与施赖奥克（J. K. Shryock）发表专题研究，指出“百虫相啖留一毒王”既不合生物学常识，实为层累演化的巫术恐慌话语。
      - 医学史新研（如刘焱对中古中国“以毒疗疾”的考察）进一步揭示，史书与方志中归为“蛊病”的症状群，往往掩盖了湿热山区常见的寄生虫感染、微生物食物中毒，以及斑蝥（芫菁）或毒草药材（如断肠草、乌头类）误服或投毒引发的急性胃肠、肾脏损害。解读此类档案时，必须将真实的中毒与地方病史同针对特定人群的巫蛊焦虑严格剥离。
    sources:
