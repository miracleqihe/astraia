  - id: case_cn_shanhai_kuafu
    title: 北方大荒｜《山海经》夸父逐日与弃杖化邓林神话
    aliases:
      - 夸父逐日
      - 夸父追日
      - 邓林神话
      - Kuafu
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 34.5500
      lng: 110.8800
      precision: culture_region
      location_name: 中国河南灵宝与豫西桃林原 · 注疏比定“邓林/夸父山”参照区
      culture_region: 中国 · 中原豫西神话地理区
    location_note: “夸父山”与“邓林”在《山海经》属北方大荒想象地界，晋郭璞及北魏《水经注》多将邓林比附豫西桃林塞，此处作文献注疏地理参考。
    temporal:
      year_start: -300
      year_end: 320
      era_label: 战国《山海经》至东晋郭璞注时期
      uncertainty_note: 夸父追日载于《山海经·海外北经》及《大荒北经》，《列子·汤问》存详尽变体，东晋郭璞注进一步比定“邓林”所在。
    paragraphs:
      - 《山海经·海外北经》以简劲笔法记下“夸父与日逐走，入日”的著名神话：巨人夸父奋力追赶落日，渴极而饮尽黄河、渭水仍嫌不足，北上欲赴“大泽”解渴，却未及抵达便半途渴死；临终之际他“弃其杖，化为邓林”，使枯死的手杖在荒原化作葱郁林海。
      - 同书《大荒北经》另存一则视角相异的记述：成都载天之山有名叫“夸父”的神人，耳穿两黄蛇、手操两黄蛇，“不量力，欲追日景，逮之于禺谷”，终因饮大泽而亡，另又涉入应龙蓄水之争；至《列子·汤问》复增写“尸膏肉所浸，生邓林，邓林弥广数千里焉”，东晋陶渊明《读山海经》则称颂“夸父诞宏志，乃与日竞走”，确立了不畏险阻的悲壮形象。
      - 并读《海外北经》与《大荒北经》两段古文，能够清楚看见《山海经》各卷原本汇集了不同地域与部族的口述残片，连夸父究竟是部族名号抑或单一巨人、死于枯渴抑或神战均尚存歧义。读者宜将“饮干河渭”视为测度昼夜日影与抗争意志的象征修辞，而非水文史实。
    sources:
      - citation: 《山海经·海外北经》，中国哲学书电子化计划（CText）。
        type: primary_text
