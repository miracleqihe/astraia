  - id: case_cn_shanhai_xingtian
    title: 常羊之山｜《山海经》刑天断首与舞干戚神话
    aliases:
      - 刑天舞干戚
      - 形天
      - 常羊山
      - Xingtian
    genre: myth
    credibility_tier: B
    note_kind: story
    location:
      lat: 36.1500
      lng: 112.9500
      precision: culture_region
      location_name: 中国山西上党与太行南麓 · 方志比定“常羊山”文化参照区
      culture_region: 中国 · 华北太行神话传统区
    location_note: “常羊之山”原出《山海经·海外西经》的西方想象地理，宋元以后晋东南长治等地山志常比附为当地常羊山，此坐标仅作文献地理参照。
    temporal:
      year_start: -300
      year_end: 420
      era_label: 战国《山海经》至东晋陶渊明诗咏时期
      uncertainty_note: 早期传本多作“形天”，东晋陶渊明诗作写作“刑天”，唐宋校勘家曾辨析二者字形与义理演替。
    paragraphs:
      - 《山海经·海外西经》用极度凝练的三十余字塑造了中国神话中最震撼的抗争者：“形天与帝至此争神，帝断其首，葬之常羊之山。乃以乳为目，以脐为口，操干戚以舞。”在这段战国至汉初留存的叙事中，失首的神祇并未倒下，反而将胸腹重塑为面目，执持盾牌与大斧继续挥舞。
      - 宋代曾巩与清代郝懿行考订指出，先秦两汉古本多作“形天”，意谓断首残形或天威裁断；至东晋陶渊明据所见本作“刑天”，并于《读山海经十三首》写下名句“刑天舞干戚，猛志固常在”，使原本奇诡的异域神祇转化为士人在逆境中不屈的抗争符号。宋代《路史》及清代注疏则进一步将其演绎为炎帝神农氏的乐官与武将。
      - 从比较民俗与早期身体想象观察，“无头而以胸乳为目”在欧亚古典地理志（如古希腊所谓无头异人）与神话母题中均有平行例证；《山海经》把它与“和天帝争神位”结合，既体现了上古部族竞争的神话记忆，也是文本字形与读史注解层累改写的绝佳样本。
    sources:
      - citation: 《山海经·海外西经》，中国哲学书电子化计划（CText）。
        type: primary_text
        url: 'https://ctext.org/shan-hai-jing/hai-wai-xi-jing'
        locator: 《海外西经》“形天与帝至此争神……操干戚以舞”原文及郭璞注
      - citation: 《山海经·海外西经》，维基文库古籍校本。
        type: historical_text_transcription
        url: 'https://zh.wikisource.org/wiki/%E5%B1%B1%E6%B5%B7%E7%B6%93/%E6%B5%B7%E5%A4%96%E8%A5%BF%E7%B6%93'
        locator: 海外西经“形天/刑天”校勘条文
      - citation: Mark Edward Lewis, Sanctioned Violence in Early China, SUNY Press, 1990.
        type: academic_monograph
        url: 'https://archive.org/details/sanctionedviolenc0000lewi'
        locator: 早期中国神战暴烈身体意象与礼仪秩序分析
