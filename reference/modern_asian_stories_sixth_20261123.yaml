    type: institutional_account
    url: https://tkutimes.tku.edu.tw/dtl.aspx?no=8516
    locator: 校园报纸所记的等待、问时与黑鸟版本
  - citation: OpenStreetMap contributors：淡江大学淡水校园，地图数据 ODbL 1.0。
    type: map_reference
    url: https://www.openstreetmap.org/way/235915330
    locator: 淡水校园公开地图对象
- id: case_sg_orchard_ride_previous_passenger_2022
  title: 新加坡乌节路｜已经下车的乘客
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_night_transit_lore_2025
  location:
    lat: 1.3006426
    lng: 103.8399231
    precision: city
    location_name: 新加坡 · Orchard Central 参考点
    culture_region: 东南亚 · 新加坡
  location_note: 点位为报道所提商场的公开参考位置，不代表精确上车位置。
  paragraphs:
  - 过了午夜，司机 Joanna 接到一位在 Orchard Central 附近等车的乘客。她看到长椅上有人，却没立刻等到对方上车，便暂时靠着座椅休息。
  - 她说，车门锁着时，自己听见像开门、关门的声音。乘客上车后向她道歉，说刚才没注意到前一位客人已经下车，而司机记得车上此前并没有人。
  - 这段经历来自叫车平台为万圣节播客征集的司机投稿，2022 年由 CNA Lifestyle 转述。它保留了讲述者的经历与乘客的说法。
  sources:
  - *id005
  - citation: OpenStreetMap contributors：Orchard Central，地图数据 ODbL 1.0。
    type: map_reference
    url: https://www.openstreetmap.org/way/41889999
    locator: 商场公开地图对象
  reading_kind: report
- id: case_id_jakarta_saidah_fountain_2019
  title: 雅加达｜空楼前的白衣身影
  genre: memorate
  credibility_tier: B
  theme: corpus_cn_empty_buildings_2004_2008
  location:
    lat: -6.243891
    lng: 106.8592572
    precision: city
    location_name: 印度尼西亚雅加达 · Menara Saidah 参考点
    culture_region: 东南亚 · 印度尼西亚
  location_note: 点位是公开建筑的参考位置，不代表传闻中某个身影的确切地点。
  paragraphs:
  - 雅加达的 Menara Saidah 在停止办公多年后，逐渐成为人们口中的怪谈地点。2019 年，记者向附近居民询问他们听过或见过什么。
  - 一位居民说，曾在大楼工作的侄子讲过喷泉附近的白衣身影；另一位居民则听邻居说过岗亭屋顶垂下的脚。也有受访者表示自己从未看见异常。
  - 这些说法在报道中来自不同的人，属于转述；建筑的关闭与周边居民的日常生活另有自己的历史。
  sources:
  - citation: Nina A. Loasana, “Haunted building? Empty tower attracts curious visitors”, The Jakarta Post, 7 October 2019。
    type: newspaper_report
    url: https://www.thejakartapost.com/news/2019/10/07/haunted-building-empty-tower-attracts-curious-visitors
    locator: 对建筑周边居民及保安亲属的采访
  - citation: OpenStreetMap contributors：Menara Saidah，地图数据 ODbL 1.0。
    type: map_reference
    url: https://www.openstreetmap.org/way/120390216
    locator: 大楼公开地图对象
  reading_kind: report
- id: case_id_jakarta_manggarai_night_train
  title: 雅加达｜末班车后的乘客
  genre: urban_legend
  credibility_tier: A
  theme: corpus_asia_night_transit_lore_2025
  location:
    lat: -6.2101704
    lng: 106.849935
    precision: city
    location_name: 印度尼西亚雅加达 · Manggarai 车站参考点
    culture_region: 东南亚 · 印度尼西亚
  location_note: 点位为车站公开参考位置；不同传闻发生时间与具体位置均不能据此确定。
  paragraphs:
  - Manggarai 车站附近有两种夜车传闻：一种说有人看见熄灯的列车在不该开行的时候自行经过；另一种说，有人在末班车早已离开后，遇见一名像刚下车的迷路乘客。
  - 2016 年另有新闻报道一辆车辆从茂物方向滑行，并追溯 2005 年空车移动至 Manggarai 的事件；铁路方面当时提到线路坡度。
  - 列车传闻和新闻所记车辆移动是不同材料。目前不能确定后者就是传闻的起源。
  sources:
  - *id006
  - *id007
  - citation: OpenStreetMap contributors：Manggarai railway station，地图数据 ODbL 1.0。
    type: map_reference
