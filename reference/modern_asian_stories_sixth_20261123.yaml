- id: corpus_tw_campus_hsieh_2024
  title: 校园里的封锁房间｜故事怎样跨校流传
  genre: academic_model
  peers:
  - case_cn_tw_taipei_ntu_moon_lake
  - case_cn_tw_taichung_thu_bridge_time
  - case_cn_hk_hku_lotus_pool
  paragraphs:
  - 一扇传说中被封起来的门、一张来历不明的床、一个返校前被留在空宿舍的人：相似的情节会被讲成不同学校自己的故事。
  - 谢宜安收集校园口述和 BBS 旧文，比较情节何时出现、如何改变；何敬尧则走访淡水校园并询问学生。把讲述场景与实际事件分开，才看得清传说的流动。
  sources:
  - &id003
    citation: 谢宜安：〈“尸水宿舍”传说传播力惊人〉，《必修！台湾校园鬼故事考》书摘，关键评论网，2024 年 4 月 4 日。
    type: research_book_excerpt
    url: https://www.thenewslens.com/article/200385
    locator: “封锁的寝室”“北工版”“政大版”
  - &id001
    citation: 〈清明鬼话特辑：谢宜安《必修！台湾校园鬼故事考》〉，Openbook 阅读志，2024 年。
    type: interview
    url: https://www.openbook.org.tw/node/68995
    locator: 谢宜安关于高中宿舍与校园传说研究的访谈
  - &id004
    citation: 何敬尧：〈新北：宫灯姐姐——淡江大学宫灯道〉，《神话妖怪台湾岛》研究资料库，2023 年；实地走访于 2018 年。
    type: field_report
    url: https://yokaiwalk.blogspot.com/2023/06/blog-post_0.html
    locator: “妖怪介绍”“探访笔记”与学生访谈
- id: corpus_asia_night_transit_lore_2025
  title: 最后一班车｜城市夜路上的相似故事
  genre: academic_model
  peers:
  - case_cn_beijing_ghost_bus
  - case_sg_bishan_last_train
  - case_jp_hamamatsu_kisaragi_station_2004
  paragraphs:
  - 深夜、停站、陌生乘客与已经错过的末班车，是多地交通怪谈反复出现的线索。长沙的宿舍回忆、新加坡司机的投稿和雅加达的车站传闻，把这些片段带到不同城市。
  - 同一种叙事手法并不意味着它们出自同一事件。报道中另有铁路实际车辆滑行的记录，但目前不能据此断定任何传说的起源。
  sources:
  - &id002
    citation: 〈寝室回忆录〉，湖南师范大学外国语学院院友回忆，2019 年 11 月 12 日。
    type: institutional_account
    url: https://fsc.hunnu.edu.cn/info/1112/3764.htm
    locator: “三、第一次卧谈会”
  - &id005
    citation: Jasmine Teo：〈Gojek Drivers Recount Ghostly Encounters On The Job〉，CNA Lifestyle / 8days，2022 年 10 月 18 日。
    type: newspaper_report
    url: https://cnalifestyle.channelnewsasia.com/8days/gojek-drivers-recount-ghostly-encounters-job-including-passengers-they-didnt-even-know-were-car-444016
    locator: 司机 Joanna L 的投稿与播客征集说明
  - &id006
    citation: '“Phantoms of the metropolitan: Five spooky spots around Jakarta”, The Jakarta Post Weekender, 28 October 2025。'
    type: newspaper_report
    url: https://weekender.thejakartapost.com/life/2025/10/28/phantoms-of-the-metropolitan-five-spooky-spots-around-jakarta.html
    locator: Manggarai 站夜间列车的两种传闻
  - &id007
    citation: 〈Cerita Kereta Hingga Lori yang Nyelonong Sendiri dari Bogor ke Jakarta〉，detikNews，2016 年 9 月 9 日。
    type: newspaper_report
    url: https://news.detik.com/berita/d-3295012/cerita-kereta-hingga-lori-yang-nyelonong-sendiri-dari-bogor-ke-jakarta
    locator: 2016 年车辆滑行与报道追溯的 2005 年空车事件
- id: corpus_cambodia_bennett_living_dead_2015
  title: 与亡者共同生活｜柬埔寨战后记忆
  genre: academic_model
  peers:
  - case_vn_hue_memorial_unheard_names
  - case_la_xieng_khouang_brother_in_doorway
  paragraphs:
  - 在柬埔寨战后田野中，Caroline Bennett 记录了人们重建家庭、谈论逝者和解释夜间经历的方式。受访者的讲述中，恐惧、照料、纪念与继续生活交织在一起。
  - 论文为研究地点改名，也对人物身份作处理；地图仅用国家范围示意。关于战争创伤的叙述应置于它的历史与生活背景中阅读。
  sources:
  - &id009
    citation: 'Caroline Bennett, To Live Amongst the Dead: an Ethnographic Exploration of Mass Graves in Cambodia, PhD thesis, University of Kent, 2015。'
    type: academic_thesis
    url: https://kar.kent.ac.uk/53561/
    locator: 第 93—94、138—141 页：匿名处理及岛上居民回忆
- id: corpus_asia_familiar_figures_2026
  title: 熟悉的人再次出现｜声音与身影的故事
  genre: academic_model
  peers:
  - case_ph_up_diliman_doppelganger_2004
  - case_la_xieng_khouang_brother_in_doorway
  - case_tw_school_upper_bunk_answer_2024
  paragraphs:
  - 熟悉的声音先于本人出现，或一群归来的同伴给出一套令人不安的解释：这些故事把恐惧放进对亲友的信任之中。
  - 台湾宿舍里的转述、菲律宾校园员工的个人回忆与韩国山中小屋的都市传说，叙事方式和来源不同；并列阅读可以比较它们如何利用熟悉感与不确定性。
  sources:
  - *id001
  - &id008
    citation: 'Robert Neff, “A Halloween tale: The haunted slopes of Mount Seorak”, The Korea Times, 26 October 2019。'
    type: newspaper_column
    url: https://www.koreatimes.co.kr/opinion/20191026/a-halloween-tale-the-haunted-slopes-of-mount-seorak
    locator: 山中同伴与小屋故事及作者关于流传版本的说明
records:
- id: case_cn_changsha_dorm_five_bus
  title: 长沙｜宿舍里讲起的末班五路车
  genre: urban_legend
  credibility_tier: A
  theme: corpus_asia_night_transit_lore_2025
  location:
    lat: 28.2282
    lng: 112.9388
    precision: city
    location_name: 中国湖南长沙 · 城市参考点
    culture_region: 中国 · 华中
  location_note: 长沙是回忆录中学生讲述故事的城市；资料未说明故事中的五路车发生地点。
  paragraphs:
  - 熄灯后，寝室里的人接连谈起听来的怪事。有人讲了最后一班五路车：乘客上车后，一位老人忽然将他拉下车，说刚上来的母女没有腿。
  - 在这个故事里，年轻人次日看见车坠河的消息，才明白老人为何拉他下车。讲完后，室友不敢起身；后来一位同学悄悄去关窗，大家发现是虚惊一场。
  - 这一版本出自湖南师范大学校友的宿舍回忆。回忆记录的是讲故事的一夜，不能据此认定故事中的路线或事故真实发生。
  sources:
  - *id002
- id: case_cn_xiangtan_mahjong_paper_money_2002
  title: 湘潭｜四个人都赢了的麻将
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_empty_buildings_2004_2008
  location:
    lat: 27.8297
    lng: 112.9441
    precision: city
    location_name: 中国湖南湘潭 · 城市参考点
    culture_region: 中国 · 华中
  location_note: 报道只将传闻置于湘潭建设路一带；地图使用城区参考点，不指向房屋或住户。
  paragraphs:
  - 湘潭曾流传一个关于空屋的故事：四个人不信传闻，夜里带着麻将去屋里坐了一晚。直到天亮，他们都没有遇见什么异样。
  - 收拾钱时，四人却发现每个人都说自己赢了；走出屋子再看，赢来的钱竟变成祭祀用的纸钱。另一种版本说，牌桌上突然多出一双手。
  - 2002 年的报道把几种说法并列，也说讲述者无法指出当事人。故事保存的是当时的传闻，而不是经过确认的牌局。
  sources:
  - citation: 〈湘潭繁华路段竟有“鬼屋” 闹鬼传言耸人听闻〉，四川在线—华西都市报据潇湘晨报报道，2002 年 9 月 25 日，新浪新闻转载。
    type: newspaper_report
    url: https://news.sina.com.cn/s/2002-09-25/0524741349.html
    locator: 四种流传版本与对当事人的追问
- id: case_cn_changchun_empty_villa_ringtone_2008
  title: 长春｜黑暗里响起的怪叫
  genre: memorate
  credibility_tier: A
  theme: corpus_cn_empty_buildings_2004_2008
  location:
    lat: 43.8171
    lng: 125.3235
    precision: city
    location_name: 中国吉林长春 · 城市参考点
    culture_region: 中国 · 东北
  location_note: 报道涉及住宅区，地图只标长春城区，不标房屋及住户。
  paragraphs:
  - 关于长春一片住宅区，曾有人讲过厨房墙上出现笑脸的传闻。2008 年，一群网友决定夜里结伴去看，记者也同行记录。
  - 他们借着手机灯光在空屋里走动时，身边突然传来一声怪叫，所有人都紧张起来。找到声音来源后才发现，那是队员的短信提示音。
  - 队伍一直待到天亮，没有见到传闻中的笑脸。报道留下了传闻与当晚亲见的区别，也记下人们怎样在黑暗里互相影响。
  sources:
  - citation: 李洪亮：〈长春网友组队探险“闹鬼”别墅〉，国际在线，2008 年 9 月 22 日，新浪新闻转载。
    type: newspaper_report
    url: https://news.sina.com.cn/s/2008-09-22/111514482930s.shtml
    locator: “扭曲笑脸”及记者随行的“恐怖一夜”
  reading_kind: report
- id: case_tw_school_upper_bunk_answer_2024
  title: 台湾校园｜上铺传来的回应
  genre: memorate
  credibility_tier: A
  theme: corpus_tw_campus_hsieh_2024
  location:
    lat: 23.6978
    lng: 120.9605
    precision: culture_region
    location_name: 中国台湾 · 区域参考点
    culture_region: 中国 · 台湾
  location_note: 访谈未公开学校与城市；地图只作为台湾范围示意，不代表具体学校。
  paragraphs:
  - 谢宜安回忆，高中住宿时，学姐们讲起过一件让大家害怕的事：有人在寝室里喊一位不在房内的学姐，声音却从上铺回答了。
  - 紧接着，那位学姐从寝室外走了进来。听故事的人忍不住追问，刚才回答的是谁。
  - 谢宜安是在事后听学姐讲起此事；她记得讲述者惊恐的神情，也记得自己如何被气氛感染。多年后，她开始收集和比较校园传闻。
  sources:
  - *id001
  reading_kind: report
- id: case_tw_taichung_sealed_dorm_room
  title: 台中｜封条后的喧闹声
  genre: urban_legend
  credibility_tier: A
  theme: corpus_tw_campus_hsieh_2024
  location:
    lat: 24.1477
    lng: 120.6736
    precision: city
    location_name: 中国台湾台中 · 城市参考点
    culture_region: 中国 · 台湾
  location_note: 故事是研究者在台中校园活动中听到的讲述；未核实具体房间，地图使用台中城区参考点。
  paragraphs:
  - 有一间宿舍，据说走廊尽头的房门贴着封条。学生经过时，有时会听见房间里像有人聚会、说笑，然而门上的封条依旧完好。
  - 谢宜安在高中时期参加台中一中校庆时，从住宿生那里听到了这个简短版本。故事没有解释房间为什么被封，也因此留下了想象的空间。
  - 在她的比较中，“封锁的房间”是校园怪谈常见的讲述方式；这篇记录不证明某一间房发生过异常事件。
  sources:
  - *id003
- id: case_tw_taipei_nccu_dorm_bbs_1997
  title: 台北｜一张不知搬到哪里的床
  genre: urban_legend
  credibility_tier: A
  theme: corpus_tw_campus_hsieh_2024
  location:
    lat: 24.9869917
    lng: 121.5752222
    precision: city
    location_name: 中国台湾台北 · 政治大学校园参考点
    culture_region: 中国 · 台湾
  location_note: 点位仅指一则 BBS 版本所关联的校园，不代表故事中的特定宿舍或事件现场。
  paragraphs:
  - 一个流传在大学宿舍的版本说，长假里，一名留在寝室的学生病逝；许多年后房间重新开放，新住户在夜间听到咳嗽、拆药包和脚步声。
  - 后来，有人说床被搬走了，却不知道搬到了哪间房。相似故事在许多学校出现，床铺、季节和人物身份不断变化。
  - 谢宜安找到 1995 年北工及 1997 年政大 BBS 的文字版本，并比较它们的差异。她没有找到相应新闻记录，认为应把它读作传播广泛的校园传说。
  sources:
  - *id003
  - citation: OpenStreetMap contributors：国立政治大学，地图数据 ODbL 1.0。
    type: map_reference
    url: https://www.openstreetmap.org/relation/2946719
    locator: 校园公开地图对象
- id: case_tw_tamsui_lantern_sister_2018
  title: 淡水｜宫灯道上的学姐
  genre: urban_legend
  credibility_tier: A
  theme: corpus_tw_campus_hsieh_2024
  location:
    lat: 25.174554
    lng: 121.448588
    precision: city
    location_name: 中国台湾新北 · 淡江大学淡水校园
    culture_region: 中国 · 台湾
  location_note: 点位为淡水校园参考位置；宫灯道上的故事不构成对任何个人经历的确认。
  paragraphs:
  - 淡江大学的宫灯大道两旁有成排的灯柱。学生之间流传一位“宫灯姐姐”的故事，有人说她在这里等待恋人，也有人把黑色羽鸟与她的出现联系起来。
  - 何敬尧在 2018 年走访时，遇到雾中的宫灯，也向经过的学生询问。许多受访者熟悉这个故事，但关于她的身世仍有不同说法。
  - 作者将它与其他校园中的学姐传说并读；灯道是真实地点，故事人物与经历属于流传的叙事。
  sources:
  - *id004
