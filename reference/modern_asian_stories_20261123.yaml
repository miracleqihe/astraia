- id: case_cn_tw_taipei_xinhai_taxi
  title: 台北辛亥隧道｜车资变成冥纸
  genre: urban_legend
  credibility_tier: A
  theme: text_vanishing_hitchhiker_1981
  location:
    lat: 25.033
    lng: 121.565
    precision: city
    location_name: 台湾台北 · 市区参考点
    culture_region: 东亚 · 中国台湾
  location_note: 台北市区参考点；原文只将传说联系辛亥隧道，不精确定位上车处。
  paragraphs:
  - 一个深夜，司机在辛亥隧道附近载了一位女乘客。到了目的地，乘客已经不在车上；第二天，收到的车资也变成了冥纸。故事的后半段说，司机回到载客地点，才认出墓碑上的照片。
  - 台湾历史博物馆将它与“消失的搭车人”比较：这个台湾版本把主人公换成出租车司机，并加入冥纸与特定隧道的细节。文章称此故事至少自 1980 年代在当地流传。
  sources:
  - *id003
- id: case_cn_hk_hku_lotus_pool
  title: 香港大学｜荷花池边问时间的女生
  genre: urban_legend
  credibility_tier: B
  theme: text_cn_ma_xingyu_campus_horror_2016
  location:
    lat: 22.2836
    lng: 114.1371
    precision: city
    location_name: 香港 · 薄扶林校园
    culture_region: 东亚 · 中国香港
  location_note: 香港大学校园参考点，非荷花池具体位置。
  paragraphs:
  - 港大校园鬼故里，有位女生夜里在荷花池附近徘徊，向路过的学生询问时间。故事把她的出现连到一场没有等到赴约者的约会，并提醒听故事的人：午夜遇见时不要回答。
  - 香港 01 在 2019 年整理了这个校园流传版本。传说中的人物与过去发生的事没有独立核实；林舟对香港年轻人鬼故事的研究可作为理解校园讲述背景的延伸阅读。
  sources:
  - &id005
    citation: 董欣琪：〈十二传说：香港院校鬼故〉，香港 01，2019 年，2025 年更新。
