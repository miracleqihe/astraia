- id: case_sg_bishan_last_train
  title: 新加坡碧山｜没有停站的末班车
  genre: urban_legend
  credibility_tier: A
  theme: text_vanishing_hitchhiker_1981
  location:
    lat: 1.3508
    lng: 103.8484
    precision: city
    location_name: 新加坡 · 碧山地铁站一带
    culture_region: 东南亚 · 新加坡
  location_note: 碧山地铁站附近的公共地点参考点；故事并无经核实的车次。
  paragraphs:
  - 末班列车经过碧山站，却没有停下。传说乘客质问司机，司机反问站台有多少人：乘客只看见十几个人，司机却说自己看见更多，而且有人没有脸。
  - 新加坡国家文物局把这则故事放在碧山旧墓园和新市镇的历史中介绍，也提到当地对这片土地存在不同记忆。旧墓地历史与末班车传闻应分别理解。
  sources:
  - citation: 'National Heritage Board, “Bishan: Living with the Dead”, Roots.sg.'
    type: institutional_account
    url: https://www.roots.gov.sg/stories-landing/stories/bishan-living-with-the-dead/story
    locator: 末班地铁都市传说与碧山历史
- id: case_sg_pasir_ris_red_house
  title: 新加坡巴西立｜红屋里的哭泣娃娃
  genre: urban_legend
  credibility_tier: B
  theme: motif_urban_ostension_liminal
  location:
    lat: 1.373
    lng: 103.949
    precision: city
    location_name: 新加坡 · 巴西立
    culture_region: 东南亚 · 新加坡
  location_note: 巴西立地区参考点，不是私人建筑门牌或其现用途的精确标记。
  paragraphs:
  - 巴西立红屋空置多年后，年轻人常结伴夜访。有人讲门前石狮会动，有人讲摇椅上的娃娃在哭，也有人说看见白影；不同讲法把同一栋旧屋变成夜间试胆的目的地。
  - 地方历史网站 Remember Singapore 在 2014 年记录了旧屋的业主沿革、周边度假区和这些传言。建筑后来改建，流传故事并不能证明屋内发生过所说的怪事。
  sources:
  - citation: Remember Singapore, “Pasir Ris Red House… A Haunting Legend No More”, 30 March 2014.
    type: local_history
    url: https://remembersingapore.org/2014/03/30/pasir-ris-red-house/
    locator: 旧建筑史、夜间探访与红屋传言
