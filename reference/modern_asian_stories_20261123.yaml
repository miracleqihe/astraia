- id: case_cn_beijing_dormitory_window_eyes
  title: 北京宿舍｜关灯后窗里的眼睛
  genre: urban_legend
  credibility_tier: A
  theme: text_cn_ma_xingyu_campus_horror_2016
  location:
    lat: 39.9042
    lng: 116.4074
    precision: city
    location_name: 北京 · 城市参考点
    culture_region: 东亚 · 中国
  location_note: 访谈没有公开学校或宿舍名；坐标只表示北京，不是具体校舍。
  paragraphs:
  - 北京一位受访者讲起一间学生宿舍：住过的人说，夜里常有走动和低语声。灯熄了，朝窗玻璃望去，有时会看见一双悲伤的眼睛。知道传闻的老生避开房间，新生住进去后又很快搬走。
  - 故事里，眼睛被解释为很久以前住在这里的一位女生。民俗学者索洛维耶娃在 2015 年访谈中记录了这个版本；访谈留下的是讲述者的记忆与解释，没有指明学校，也不能据此确认故事中的旧事。
  sources:
  - &id001
    citation: Alevtina Solovyova, “Ghostlore of Contemporary Beijing”, 2019, pp. 278–283.
    type: academic_chapter
    url: https://www.academia.edu/61013635/Ghostlore_of_Contemporary_Beijing
    locator: 2012–2016 北京田野访谈；所引叙事注明访谈年份
- id: case_cn_beijing_school_wheelchair
  title: 北京校园｜门外响起轮椅声
  genre: urban_legend
  credibility_tier: A
  theme: text_cn_ma_xingyu_campus_horror_2016
  location:
    lat: 39.9042
    lng: 116.4074
    precision: city
    location_name: 北京 · 城市参考点
    culture_region: 东亚 · 中国
  location_note: 原访谈未公开学校名称；北京坐标仅用于标示采录城市。
  paragraphs:
  - 有人讲，校园里的厕所关上门以后，门外会传来轮椅移动的声音；偶尔还能见到一位坐在轮椅上的老妇人，离地悬着，慢慢经过。
  - 讲述者又说，一位家长后来打听到这里以前曾是老人医院。索洛维耶娃在 2014 年访谈中把这个说法记作故事的一部分：它把校园的陌生声音与一段想象中的建筑旧史连在一起，具体学校和旧史均未在材料中核定。
  sources:
  - *id001
- id: case_cn_yongzhou_liuzijie_cave
  title: 永州柳子街｜山洞里熄灭的火把
  genre: memorate
  credibility_tier: A
  theme: corpus_theme_between_life_death
  location:
    lat: 26.221
    lng: 111.624
    precision: city
    location_name: 湖南永州 · 零陵柳子街
    culture_region: 东亚 · 中国
  location_note: 使用零陵城区参考坐标；山洞位置与口述者住址均不作精确标定。
  paragraphs:
  - 柳子庙假山里有山洞，街坊传说洞中藏着宝物，也有蛇和蝙蝠守着。受访者回忆，小时候曾与伙伴举火把进去；洞越走越窄，一支火把先熄了，返回途中又灭了一支。
  - 有人摔倒，有人喊了一声“鬼”，几个孩子便一齐跑出洞。事后有人说看见了白影。2021 年的柳子街田野论文保留了这段地方口述：宝藏与白影都属于讲述，洞内经历的具体年代并未说明。
  sources:
  - &id002
    citation: 潘雁飞、黄鹂：《柳子街民间传说故事田野调查》，《湖南科技学院学报》2021 年第 4 期，第 20–26 页。
    type: peer_reviewed
    url: https://www.huse.edu.cn/__local/9/BC/CE/831C9ADC31DBEC09E0A74AE1037_E2D67927_9ADB5.pdf?e=.pdf
    locator: 2021 年发表的柳子街地方口述采录
- id: case_cn_yongzhou_liuzijie_snake
  title: 永州愚溪｜中秋夜的三座桥
  genre: folktale
  credibility_tier: A
  theme: corpus_theme_between_life_death
  location:
    lat: 26.221
    lng: 111.624
    precision: city
    location_name: 湖南永州 · 零陵柳子街
    culture_region: 东亚 · 中国
  location_note: 柳子街及愚溪一带的城区参考点，并非故事中桥面的精确坐标。
  paragraphs:
  - 柳子街的一个中秋传说里，愚溪上会出现三座桥。一名化缘的老和尚引人上桥，传说他其实是蛇精；前来调查的人抬头，看见天上竟有三个月亮。
  - 他们向其中一轮射箭，才发现那是蛇精的眼睛。第二天，独眼和尚来到药铺，被等候的人识破。论文还采录了伤在脚上的另一种讲法，两种版本都属于 2021 年记录的地方口述，不能把故事发生时间当作历史年代。
  sources:
  - *id002
- id: case_cn_tw_hsinchu_ghost_playground
  title: 新竹清大｜夜里的儿童乐园
  genre: urban_legend
  credibility_tier: A
  theme: text_cn_ma_xingyu_campus_horror_2016
  location:
    lat: 24.7956
    lng: 120.9939
    precision: city
    location_name: 台湾新竹 · 清华大学校园
    culture_region: 东亚 · 中国台湾
  location_note: 校园参考坐标；不表示声音或游乐设施的精确位置。
  paragraphs:
  - 清华大学人文社会学院的校园传闻说，留到深夜的人会听见孩子嬉闹；楼后曾有的秋千与跷跷板，也被说成是为安抚他们而设。它因此有了“儿童乐园”和“鬼娃谷”的名字。
  - 台湾历史博物馆的文章对照 1936 年新竹都市计划图，指出该片校园附近过去确有墓地；地图能说明地景变化，不能证实孩子、声音或游乐设施用途的传闻。
  sources:
  - &id004
    citation: 苏峯楠：〈博物馆惊魂：文物里的鬼故事与传说背后的台湾史〉，《观・台湾》，国立台湾历史博物馆，2022 年。
    type: institutional_account
    url: https://storystudio.tw/article/watch-Taiwan-NMTH/taiwan-history-in-ghost-stories
    locator: “夜间限定儿童乐园”与“八宝公主”
- id: case_cn_tw_changhua_head_football
  title: 彰化校园｜操场上的无头球赛
  genre: urban_legend
  credibility_tier: A
  theme: text_cn_ma_xingyu_campus_horror_2016
  location:
    lat: 24.075
    lng: 120.544
    precision: city
    location_name: 台湾彰化 · 彰化市参考点
    culture_region: 东亚 · 中国台湾
  location_note: 彰化市参考点，用以标示传说流传地，不作为操场具体位置。
  paragraphs:
  - 彰化高中流传过一则夜间操场故事：有身影在踢球，走近才发现他们踢的并不是球。这个版本还把校园说成旧时刑场。
  - 台湾历史博物馆研究者对照殖民时期刑务所资料指出，这类传说的刑场地点和行刑方式与史料不符。故事展示了恐怖叙事如何借用地方历史，但不能当作校园历史的证据。
  sources:
  - &id003
    citation: 国立台湾历史博物馆：《台湾灵异怪谈与都市传说》，《观・台湾》，2022 年。
    type: institutional_account
    url: https://storystudio.tw/article/watch-Taiwan-NMTH/weirdtales-place-of-origin-taiwan
    locator: 刑场传说、军中小红及搭车女鬼
- id: case_cn_tw_yilan_xiaohong
  title: 宜兰｜营区里的“小红”
  genre: urban_legend
  credibility_tier: A
  theme: motif_urban_ostension_liminal
  location:
    lat: 24.757
    lng: 121.754
    precision: city
    location_name: 台湾宜兰 · 宜兰市参考点
    culture_region: 东亚 · 中国台湾
  location_note: 金六结一带的城市参考点，不标记营区内部位置。
  paragraphs:
  - 台湾多处新训营区都讲过名叫“小红”的女子：她探望男友后遭遇侵害，死后徘徊在营区。宜兰金六结的早期讲法把故事放在泳池，后来流传更广的版本则转向西侧厕所。
  - 台湾历史博物馆文章将它视作不同营区反复讲述、不断变化的营队怪谈；同一情节并不意味着每处都发生过相同事件。这里保留情节而不把暴力传闻指认为真实个案。
  sources:
  - *id003
