  paragraphs:
  - 理工大学校园故事说，夜里有人隔着饭堂窗户，看见一个小孩从泳池爬出，缓缓朝饭堂走来，随后消失。流传的说法还把后来窗上的磨砂贴膜解释为遮挡视线。
  - 香港 01 的校园怪谈汇编把这个场景与孩子溺水的传闻连在一起；报道未给出可核实的事件记录，贴膜和身影的解释都保留为故事中的说法。
