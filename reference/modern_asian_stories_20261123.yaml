  genre: urban_legend
  credibility_tier: B
  theme: text_cn_ma_xingyu_campus_horror_2016
  location:
    lat: 1.3483
    lng: 103.6831
    precision: city
    location_name: 新加坡 · 南洋理工大学校园
    culture_region: 东南亚 · 新加坡
  location_note: 南洋理工大学校园参考点，不指向宿舍楼内部。
  paragraphs:
  - 一位学生结束排练后回宿舍，一边看手机一边爬楼梯。走廊变得越来越暗，她抬头看见楼层牌写着四楼；校园传说说，这栋宿舍原本只有三层。
  - 新加坡媒体 ZULA 在 2017 年整理了这个宿舍版本。楼层与遭遇均出自故事，报道没有提供可供独立核实的房间或经历者；多出来的楼层是叙事的关键。
  sources:
