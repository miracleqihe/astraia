- id: case_cn_zhouli_shushi_chugu
  title: 东周洛邑｜《周礼·秋官·庶氏》“除毒蛊”官制与先秦祛蛊双轨源流
  aliases:
  - 周礼庶氏掌除毒蛊
  - 攻说禬之嘉草攻之
  - 先秦祛蛊官职典制
  genre: historical_archive
  credibility_tier: A
  note_kind: history
  location:
