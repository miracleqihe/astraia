    precision: city
    location_name: 中国河南洛阳（东周成周王畿《周礼》礼制史料参照）
    culture_region: 中国 · 先秦王制礼典与除毒蛊官制区
  location_note: 《周礼》礼制构想与成书渊源多系于东周王室与齐鲁礼学，地图取东周王畿洛邑区域作典制参照。
  temporal:
    year_start: -475
    year_end: -221
    era_label: 战国时期（《周礼》定型编纂年代下限参照，约前475—前221年）
    uncertainty_note: 《周礼》所载官制兼具历史制度遗存与战国理想化政典重构属性，成书于战国中晚期至汉代显传，此处按战国典章区间标定。
  paragraphs:
  - 《周礼·秋官司寇》记有“庶氏”掌除毒蛊，并列出“攻说”和“嘉草”等做法。邓启耀《巫蛊》第二章第一节引用此条及郑玄注释，讨论祈祭和药草熏治的不同解释。
  - 《周礼》是一部礼制文本；其中职官安排并不能单独证明这些制度在每个时期都按文本实际运行。把它与《左传》中的论蛊段落并读，可以看到古代文本对虫、病与蛊的不同表述，但不宜直接认定后世法律和医疗传统都由这一官职演化而来。
  sources:
