    locator: 清河孝王庆传，宋贵人“病思生菟”及废太子记载。
  - citation: 邓启耀：《巫蛊：中国文化的历史暗流》（桂林：广西师范大学出版社，2025）。
    type: scholarly_monograph
    url: https://book.douban.com/subject/37310453/
    locator: 第五章第二节“权争与巫蛊之祸”，引《后汉书·清河王庆传》；电子版无固定纸书页码，链接为书目介绍。
