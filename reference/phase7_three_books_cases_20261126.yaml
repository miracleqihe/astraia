- id: case_cn_eastern_han_dou_song_wugu
  title: 东汉洛阳｜建初七年窦皇后与宋贵人巫蛊宫禁狱案（82 CE）
  aliases:
  - 东汉宋贵人挟邪媚道案
  - 建初七年窦后构陷案
  - 生菟厌魅东宫易储狱
  genre: historical_archive
  credibility_tier: A
  note_kind: history
  location:
    lat: 34.725
    lng: 112.596
    precision: city
    location_name: 中国河南洛阳（东汉洛阳南宫掖庭及北寺狱史料参照）
    culture_region: 中国 · 汉魏宫廷巫蛊政争与外戚狱案区
  location_note: 东汉章帝朝洛阳宫城与北寺狱发生此案，坐标取汉魏洛阳故城区域作都城史料参照。
  temporal:
    year_start: 82
    year_end: 82
    era_label: 东汉建初七年（82 CE）
    uncertainty_note: 《后汉书·皇后纪上》与《清河孝王庆传》均明载汉章帝建初七年六月案发、废太子庆而宋贵人姊妹自杀，年月精确。
  paragraphs:
  - 《后汉书·清河孝王庆传》记载，宋贵人病中写信让家人求取“生菟”，信被窦皇后截获。窦后据此诬称她以此施行蛊道祝诅，宋氏母子逐渐失宠。建初七年（82 年），太子刘庆被废为清河王，宋贵人姐妹经审讯后服药自尽。原文所称“生菟”在此保留原字，不将其解释为未经核实的食物或药材。
  - 邓启耀《巫蛊》第五章第二节在讨论权争与巫蛊时引述这段《后汉书》材料。可将其作为史书所记宫廷指控与权力竞争的案例；文献中的指控不等于宋贵人确有施蛊行为。
  sources:
  - citation: 范晔《后汉书·卷五十五·清河孝王庆传》，维基文库校本。
    type: primary_text
