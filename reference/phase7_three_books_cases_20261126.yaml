- id: case_cn_minzhe_boat_eye_dotting
  title: 闽浙沿海｜传统木船“画眼点睛”礼仪与行船镇风辟蛟民俗
  aliases:
  - 木船画眼点睛
  - 安船眼
  - 福船点睛开光
  - 舟眼辟蛟民俗
  - Boat Eye Dotting Ritual
  genre: folktale
  credibility_tier: A
  note_kind: story
  location:
    lat: 26.0745
    lng: 119.2965
    precision: culture_region
    location_name: 中国福建福州及泉州、浙南沿海（传统福船造船与木船“画眼点睛”礼仪核心区）
    culture_region: 中国 · 闽浙东南沿海造船民俗与行船镇物区
  location_note: 福船“画眼点睛”开光礼与船眼朝向规制流传于福建福州、泉州晋江、宁德蕉城及浙江温州、台州玉环等沿海造船港湾，坐标取福州闽江口作东南造船民俗参照区。
  temporal:
    year_start: 1178
    year_end: 2010
    era_label: 宋明闽浙远洋海舟兴盛期至 2010 年水密隔舱福船技艺列入联合国急需保护非遗
    uncertainty_note: 宋明文献《岭外代答》《天工开物》《东西洋考》详记福船远航形制与船工祭海信俗；近现代民俗采录（参照《中国镇物》水行镇物及浙闽沿海民间传说）完整保留了点睛开光仪节细节。
  paragraphs:
  - 在福建与浙江沿海的传统木质海船、福船及渔船建造工坊里，船体合龙、水密隔舱砌缝竣工而尚未滑轨下水之际，必举行庄重严谨的“画眼点睛”（又称“安船眼”“开光点龙睛”）仪礼。造船匠首依据船型功能严格设定船首两侧凸雕木眼的瞳孔朝向：远洋商船与福船须将黑睛画作平视正前方，取“瞭望风信、明辨航道暗礁”之意；近海作业渔船则令黑睛微斜向下俯视，寄寓“洞见海底鱼群虾蟹”；而地方口述（如浙江玉环《船眼的传说》）更衍生出渔家孝女捐眼指引父亲避礁的动人母题。
  - 这场点睛仪礼构成整套水行镇物链条的最终激活环节：待船身内部先依序封入钱币、镜片或“船灵魂”木块后，未点睛的船眼暂以红绸遮覆，寓意尚待通灵。下水吉时一到，船主与掌墨师先备三牲糕果敬拜妈祖与水府龙神，随即用新毛笔蘸朱砂墨或雄鸡冠血点亮眼仁、揭落红布并鸣放鞭炮敲锣催船入海，期盼新船由此获得“自辨危途、震慑风浪蛟龙”的生灵感知（行旅水神镇物线索参照陶思炎 1998 书目）。
  - 将“画眼点睛”仪式与 2010 年列入联合国教科文组织急需保护名录的“水密隔舱福船制造技艺”并置阅读，能够清楚区分航海信心仪轨与造船物理科学：福船之所以在宋元以来远航南洋抗击风浪，依靠的是横置水密隔舱板阻断局部破损进水、樟松木榫接与桐油灰麻绳捻缝密闭，以及罗盘、牵星板与季风经验；船首木眼并无光学探鱼或物理驱蛟之功，但它作为完工验收、敬海戒慎与全船船员出海前的集体安全动员，长期发挥着稳固海员心理定力与协作纪律的作用。
  sources:
  - citation: 〔明〕宋应星撰，《天工开物·卷九·舟车》，维基文库校本。
    type: historical_text_transcription
    url: https://zh.wikisource.org/wiki/%E5%A4%A9%E5%B7%A5%E9%96%8B%E7%89%A9/%E8%88%9F%E8%BB%8A
    locator: 《舟车》海舟、福船构造形制及风信操舟记载
