- id: case_cn_yijian_changgui_tiger_ghost
  title: 唐代宣州｜《太平广记》〈宣州儿〉与伥鬼故事
  aliases:
  - 为虎作伥
  - 宣州儿虎伥故事
  - 虎伥鬼传说
  genre: folktale
  credibility_tier: A
  note_kind: story
  location:
    lat: 30.9407
    lng: 118.7587
    precision: city
    location_name: 中国安徽宣城（唐代宣州治所，并及江南与巴蜀多虎山区）
    culture_region: 中国 · 江南皖南与巴蜀山地志怪区
  location_note: 《宣州儿》叙事地点为唐代宣州；地图采用今安徽宣城市区作区域参考，并不表示故事发生在该市区的具体地点。
  temporal:
    year_start: 713
    year_end: 978
    era_label: 唐代《广异记》故事，收入北宋《太平广记》
    uncertainty_note: 虽先秦两汉已有畏虎言说，但“人死化鬼反为虎前导”的定型叙事主要见于盛唐至北宋《太平广记》卷四二八前后所辑笔记，并经明清熟语凝固为“为虎作伥”。
  paragraphs:
  - 《太平广记》卷四百二十八〈宣州儿〉注明出自《广异记》。故事说，宣州一名孩子多次看见鬼引虎追赶，预料自己若被虎吃掉也会成为伥，于是请家人在路上设陷阱。后来他果然死于虎口，并托梦提示父亲设阱；父亲与村人最终捉到老虎。这是志怪叙事，不能据此证实故事人物或事件。
  - 同书卷四百三十〈马拯〉另有一群伥鬼走在虎前、触发猎人弩机的情节；它与〈宣州儿〉是不同故事，不应合并为同一情节。伥鬼母题后来也常用来讨论受害者被迫帮助施害者的处境，但各文本的结局并不相同。
  sources:
  - citation: 李昉等编《太平广记》卷四百二十八〈宣州儿〉，注明出《广异记》。
    type: primary_text
    url: https://zh.wikisource.org/zh-hans/%E5%A4%AA%E5%B9%B3%E5%BB%A3%E8%A8%98/%E5%8D%B7%E7%AC%AC428
    locator: 卷四百二十八·虎三·宣州儿。
  - citation: 李昉等编《太平广记》卷四百三十〈马拯〉。
    type: primary_text
    url: https://zh.wikisource.org/zh-hans/%E5%A4%AA%E5%B9%B3%E5%BB%A3%E8%A8%98/%E5%8D%B7%E7%AC%AC430
    locator: 卷四百三十·虎五·马拯；另一则伥鬼叙事。
  - citation: 徐华龙主编《中国鬼文化大辞典》（南宁：广西民族出版社，1994）。
    type: folklore_compilation
    locator: 鬼名分类作书目对读；具体词条页码尚待核对。
