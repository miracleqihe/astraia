- id: case_cn_quanzhou_dachengxi_soul_rescue
  title: 福建泉州｜打城戏“打地下城破狱”宗教法事戏剧体系
  aliases:
  - 泉州打城戏
  - 闽南法事戏
  - 和尚戏与道士戏
  genre: historical_archive
  credibility_tier: A
  note_kind: history
  location:
    lat: 24.9075
    lng: 118.5858
    precision: city
    location_name: 中国福建泉州（鲤城、晋江、南安一带）
    culture_region: 中国 · 闽南沿海法事戏俗区
  location_note: 泉州打城戏发源于清代咸丰至光绪年间的泉州府及晋江、南安、厦门一带僧道普度超度道场，2008 年列入国家级非物质文化遗产代表性项目名录，现存传习所设于泉州市区。
  temporal:
    year_start: 1851
    year_end: 2012
    era_label: 清咸丰道场演变、光绪十七年成班至今传承
    uncertainty_note: 其科仪底本与傀儡法乐远承宋元闽南“做功德”与目连戏传统；目前地方档案与戏曲史可确证的独立“打城戏”班社史实大约在清咸丰至光绪十七年（1891）前后渐趋定型。
  paragraphs:
  - 泉州打城戏又称法事戏、和尚戏或道士戏，是在僧道法事仪式基础上发展起来的地方戏曲，流行于泉州、晋江等地。演出与“做功德”等民间仪式有关，也有叠桌翻跳、吃火吐火和鬼舞等表演。
  - 泉州市人民政府资料将其发端归于清代咸丰年间，并称光绪十七年形成戏班；相关研究对形成过程仍有讨论。2008 年，打城戏列入第二批国家级非物质文化遗产代表性项目名录。此处与《中国鬼文化大辞典》的鬼戏分类作主题对读，不能据此认定字典记载了本条所有地方戏细节。
  sources:
  - citation: 中国非物质文化遗产网：国家级代表性项目“打城戏”。
    type: institutional_record
    url: https://www.ihchina.cn/project_details/13512
    locator: 项目编号Ⅳ-114；2008年第二批名录及项目介绍。
  - citation: 泉州市人民政府，泉州打城戏。
    type: institutional_record
    url: https://quanzhou.gov.cn/lyb/lswh/dfxj/201510/t20151029_181675.htm
    locator: 地方戏剧资料：起源与戏班形成的说法。
  - citation: 徐华龙主编《中国鬼文化大辞典》（南宁：广西民族出版社，1994）。
    type: folklore_compilation
    locator: 鬼戏分类作书目对读；本次未逐条核实相关辞条。
