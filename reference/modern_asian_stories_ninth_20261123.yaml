themes:
- id: corpus_id_ui_red_ghost_iskandarsyah_2012
  title: 红衣幽灵如何成为校园故事｜印尼大学人类学研究
  genre: academic_model
  peers:
  - case_id_yogyakarta_silent_lecturer_2016
  - corpus_id_campus_stories_and_media_2021_2024
  paragraphs:
  - 2012 年，印尼大学人类学学生 M. Iskandarsyah 以德波校园流传的“Hantu Merah（红色幽灵）”为题完成本科论文。研究关心的不是替灵异事件下结论，而是人们怎样认识、讲述并赋予这些故事意义。
  - 论文访问了来自不同院系和工作岗位的校园成员。有人听朋友谈起红色身影，有人描述自己的经历，也有人只知道某处一向被说成不寻常。作者在比较表中列出位置、红色来自衣服还是光影、对出现原因的解释，以及信息来源。图书馆、实验室、课堂、水塔和林地，因不同人的回忆而获得不同的形象。
  - 例如一位受访者从学生谈话中听来课堂人数对不上的故事；另一位受访者则转述实验室看守说过的长发身影。两个片段使用同一名称，却不能因此认定是同一次经历。
  - 作者结合经验与文化建构的讨论，认为过去听来的知识会影响人们对日常环境的理解与行动。具体结论属于这项质性研究的解释，不代表每个校园成员都有相同看法。这里保存中文梗概；出处可查看论文摘要、访谈章节和第 125—126 页比较表。
  sources:
  - &id006
    citation: 'M. Iskandarsyah, “Hantu Merah: Melihat Konstruksi Budaya dan Telaah Fungsi Dalam Memaknai Cerita Legenda Alam Gaib Kampus UI”, antropologi, Universitas Indonesia, 2012。'
    type: academic_thesis
    url: https://lib.ui.ac.id/file?file=digital%2Fold28%2F20309724-S42881-Hantu+merah.pdf
    locator: 摘要；第 79—80、90—93、125—126 页：受访者说法及比较表
- id: corpus_east_asia_school_oral_accounts_2011_2026
  title: 校园里的故事从谁那里听来｜东亚口述
  genre: academic_model
  peers:
  - case_cn_shenzhen_university_dorm_sign_2007
  - case_jp_tokyo_forest_school_window_1986
  paragraphs:
  - 青岛的讲述者记得故事从同学和学长那里传来；香港的受访者则从父亲那里听过两个不同版本。韩国的讲述者在考试前的夜晚，转述曾在故事书读到的情节。
  - 南加州大学数字民俗档案同时保存故事与讲述情境。讲述者记得的城市、故事设定的学校，以及多年后记录谈话的地方，不一定是同一地点。
  - 把不同版本并列，可以看见窗、楼梯和封闭房间怎样从普通校园空间变成故事的舞台。
  sources:
  - &id001
    citation: chenyizh, “Ghost Story in Primary School”, USC Digital Folklore Archives, posted 18 May 2020。
    type: oral_history
    url: https://folklore.usc.edu/ghost-story-in-primary-school/
    locator: 青岛小学同学之间的口述与采集者对传闻环境的说明；页面另列 2000 年采录日期
  - &id003
    citation: Mary Overbey, “Ghost story – Hong Kong”, USC Digital Folklore Archives, interview 11 April 2011, posted 11 May 2011。
    type: oral_history
    url: https://folklore.usc.edu/ghost-story-hong-kong/
    locator: Theresa 转述父亲讲过的学校走廊故事及两个背景版本
  - &id005
    citation: Min Cho, “Bloody Competition”, USC Digital Folklore Archives, told 27 October 2013, posted 25 November 2013。
    type: oral_history
    url: https://folklore.usc.edu/bloody-competition/
    locator: 韩国受访者在备考时转述从故事书读到的版本
- id: corpus_asian_personal_night_memories_2016_2025
  title: 天黑后的熟悉地方｜家庭与校园里的亲历回忆
  genre: academic_model
  peers:
  - case_my_kl_grandmother_seventh_night_2013
  - case_id_malang_dark_seventh_floor_2023
  paragraphs:
  - 哈尔滨的窗帘、吉打州宿舍的窗外、日惹校园里逐渐靠近的歌声，都来自讲述者对熟悉地点的回忆。
  - 有些是本人后来讲述的经历，有些经过朋友转述；私人住处和校园中的具体房间不在地图上定位。回忆里的不确定，也作为故事的一部分保留。
  sources:
  - &id002
    citation: vchen923, “The Shadow Behind the Curtain”, USC Digital Folklore Archives, 16 December 2025。
    type: oral_history
    url: https://folklore.usc.edu/the-shadow-behind-the-curtain/
    locator: 匿名讲述者对哈尔滨童年经历和后来梦境的回忆
  - &id010
    citation: “Ghost Stories From Universiti Utara Malaysia”, Between Science And Religion, 25 April 2016。
    type: personal_blog
    url: https://liewsp1-magicsea.blogspot.com/2016/04/ghost-stories-from-universiti-utara.html
    locator: 作者转述朋友 Chang 的宿舍故事；作者注明内容供娱乐
  - &id008
    citation: Ahmad Effendi, “Sinden di Toilet dan Kisah Horor Lain yang Menyelimuti Lingkungan UNY”, Mojok.co, 24 December 2023。
    type: newspaper_report
    url: https://mojok.co/liputan/kampus/kisah-horor-di-kalangan-warga-uny/
    locator: 学生 Ilham、Dimas、Dina 与楼宇管理者 Sugono 的不同讲述
- id: corpus_asia_roads_and_warnings_2020_2026
  title: 夜路与客车｜故事怎样从一个人传给另一个人
  genre: academic_model
  peers:
  - case_cn_beijing_ghost_bus
  - case_ph_balete_drive_white_lady
  paragraphs:
  - 北京末班车的故事传到青岛小学生之间时，有人记得一位老人把乘客拉下车，也有人讲起另一种没有幽灵的版本。越南海云岭的采录又把警告放在一条雾中的山路上。
  - 相似的转折可以并读，但口述记录并未证明故事间存在直接传播。山路点位表示现实中的海云岭，车次和具体经历仍属于讲述内容。
  sources:
  - &id012
    citation: chenyizh, “Ghosts and Murderers on a Bus”, USC Digital Folklore Archives, interview 15 April 2020, posted 18 May 2020。
    type: oral_history
    url: https://folklore.usc.edu/ghosts-and-murderers-on-a-bus/
    locator: 青岛受访者转述北京公交怪谈及另一版本
  - &id011
    citation: ariatran, “The story about Hai Van Passage”, USC Digital Folklore Archives, 5 May 2026。
    type: oral_history
    url: https://folklore.usc.edu/the-story-about-hai-van-passage/
    locator: 一位喜欢骑行的亲属转述海云岭故事
records:
- id: case_cn_qingdao_school_statue_restroom_2020
  title: 青岛｜弹琴的雕像眨了眼
  genre: urban_legend
  credibility_tier: B
  theme: corpus_east_asia_school_oral_accounts_2011_2026
  location:
    lat: 36.0671
    lng: 120.3826
    precision: city
    location_name: 中国山东青岛 · 城市参考点
    culture_region: 中国 · 华东
  location_note: 档案只说明讲述者的小学在青岛；地图不指向具体学校。
  paragraphs:
  - 放学后，一个留下打扫的女孩经过校门边弹琴的女性雕像，忽然觉得它眨了一下眼。她走到操场附近的小洗手间，看见一名戴帽子的清洁人员，便没有在意。
  - 等她想离开时，却像被一堵看不见的墙挡住了。故事讲到这里，女孩再也没有走出来。
  - 南加州大学民俗档案 2020 年发布的记录中，两位曾在青岛同校的学生回忆，自己读低年级时便听同学或高年级学生讲过这个故事。页面另列的采录日期为 2000 年。
  sources:
  - *id001
- id: case_cn_beijing_school_statue_direction_2019
  title: 北京｜夜里改变方向的雕像
  genre: urban_legend
  credibility_tier: B
  theme: corpus_east_asia_school_oral_accounts_2011_2026
  location:
    lat: 39.9042
    lng: 116.4074
    precision: city
    location_name: 中国北京 · 城市参考点
    culture_region: 中国 · 华北
  location_note: 档案指向北京一所学校；地图只使用城市参考，不指向校内设施。
  paragraphs:
  - 一名学生深夜回学校取东西。他说，进门时看到作家雕像的手指朝向了与平时不同的一边；办完事洗过手后，他离开了校园。
  - 第二天，故事里传来不幸的消息，他再回去看时，雕像又指回原来的方向。讲述者把洗手池与那条消息联系起来，为这个校园传说留下一个令人不安的结尾。
  - 这是 2019 年一位在北京成长的学生向民俗档案讲述的故事，故事中的事件没有独立核实。
  sources:
  - citation: Aisling Deng, “Supernatual event at Lu Xun Middle School”, USC Digital Folklore Archives, interview 4 April 2019, posted 13 May 2019。
    type: oral_history
    url: https://folklore.usc.edu/supernatual-event-at-lu-xun-middle-school/
    locator: 北京成长的学生转述校园雕像传说
- id: case_cn_beijing_teller_hidden_b4_2023
  title: 北京讲述｜传闻中的地下四层
  genre: urban_legend
  credibility_tier: B
  theme: corpus_east_asia_school_oral_accounts_2011_2026
  location:
    lat: 39.9042
    lng: 116.4074
    precision: city
    location_name: 中国北京 · 受访者居住地参考点
    culture_region: 中国 · 华北
  location_note: 北京是档案所列受访者居住地；他转述的朋友就读学校没有明确地点。
  paragraphs:
  - 朋友向讲述者说过，学校北楼明面上有三层地下室，再往下的楼梯被铁门挡住。新生间流传，门后还有不开放的第四层，有人说进去后听到哭声，或看见墙上的手印。
  - 故事把这一空间与一场过去的意外联系起来。2023 年的讲述者说，他无法确定第四层是否存在，也认为学生可能为了探险而不断添写细节。
  - 南加州大学档案记录的是朋友转述与讲述者自己的判断，学校和意外没有在档案中得到独立确认。
  sources:
  - citation: Andy Yang, “The Hidden Floor of the Middle School”, USC Digital Folklore Archives, 28 November 2023。
    type: oral_history
    url: https://folklore.usc.edu/the-hidden-floor-of-the-middle-school/
    locator: 北京受访者转述朋友所说的地下楼层故事
- id: case_cn_harbin_curtain_shadow_2025
  title: 哈尔滨｜雪天窗帘后的人影
  genre: memorate
  credibility_tier: B
  theme: corpus_asian_personal_night_memories_2016_2025
  location:
    lat: 45.8038
    lng: 126.5349
    precision: city
    location_name: 中国黑龙江哈尔滨 · 城市参考点
    culture_region: 中国 · 东北
  location_note: 讲述涉及家庭住处；点位仅标哈尔滨城市参考。
  paragraphs:
  - 冬天的清晨，十岁的 SG 听到脚步声，以为是习惯早起的祖父。她走到客厅，灯还没有亮，厚窗帘后面似乎站着一个人。
  - 她喊了一声，没有回应；鼓起勇气拉开窗帘，窗边却空无一人，外面只见落雪。她跑回床上，过了很久才把这件事讲出来。
  - 2025 年她向采集者回忆，祖父当时仍在房间睡觉。多年后，她偶尔还会梦见相似的窗帘，也不能确定童年的一幕是梦还是别的经历。
  sources:
  - *id002
- id: case_cn_hk_school_locked_staff_room_2011
  title: 香港｜跑进锁住办公室的孩子
  genre: urban_legend
  credibility_tier: B
  theme: corpus_east_asia_school_oral_accounts_2011_2026
  location:
    lat: 22.3193
    lng: 114.1694
    precision: city
    location_name: 中国香港 · 城市参考点
    culture_region: 中国 · 香港
  location_note: 口述没有给出可核对的校名或地址；点位为香港城市范围参考。
  paragraphs:
  - 一所学校夜间关门前，清洁人员总说看见一个孩子在楼上走廊跑动，却追不上他。后来两人分别守住走廊两端，想等他走出来。
  - 孩子跑向教员办公室门边的凹处；等他们赶到，那里已没有人，而办公室的门从外面上着锁。故事还给这个孩子配过不同的旧事背景。
  - 2011 年 Theresa 向民俗采集者讲起父亲曾讲给她的两个版本。具体学校和背景中所说的事情，记录并未独立证实。
  sources:
  - *id003
- id: case_tw_taipei_daren_elevator_2015
  title: 台北阳明山｜每层都停的电梯
  genre: urban_legend
  credibility_tier: B
  theme: corpus_east_asia_school_oral_accounts_2011_2026
  location:
    lat: 25.1372
    lng: 121.5406
    precision: city
    location_name: 中国台湾台北 · 文化大学阳明山校园
    culture_region: 东亚 · 台湾
  location_note: 点位为文化大学阳明山校园参考，不标示实际电梯。
  paragraphs:
  - 校园传说里，一名学生按下七楼，电梯却在每一层停下，门外始终没有人。随着门一次次开合，轿厢里似乎越来越闷。
  - 另一个版本说，教官为了证明传闻不实，独自搭上电梯，却被带往建筑正常楼层之外。不同讲述对他看到什么、后来电梯怎样处理，各有不同细节。
  - 校友网络转载与 2024 年校园怪谈文章都记录了这一故事；它们并不能确认故事中的经历或今天的电梯状态。
  sources:
  - &id004
    citation: 迷诚品内容中心：〈8 则台湾校园怪谈传说〉，2024 年 2 月 20 日。
    type: magazine_article
    url: https://meet.eslite.com/tw/sc/article/202402190001
    locator: 文化大学大仁馆电梯与中山大学地下室两节
  - citation: 文化大学慧智社校友会：〈十大鬼地方／阴阳交界大仁馆〉，联合新闻网转载，2015 年。
    type: magazine_article
    url: https://city.udn.com/60720/5365630
    locator: 大仁馆电梯传说的早期网络转载
  - citation: Mindat 地名条目：Chinese Culture University。
    type: map_reference
    url: https://www.mindat.org/feature-6728381.html
    locator: 阳明山校园参考坐标约 25.1372, 121.5406
- id: case_tw_kaohsiung_basement_watcher_2013
  title: 高雄｜地下室监视器里的身影
  genre: urban_legend
  credibility_tier: B
  theme: corpus_east_asia_school_oral_accounts_2011_2026
  location:
    lat: 22.6275
    lng: 120.2653
    precision: city
    location_name: 中国台湾高雄 · 中山大学校园参考点
    culture_region: 东亚 · 台湾
  location_note: 点位为校园范围参考；网络叙述未提供可核对的地下室位置。
  paragraphs:
  - 一篇 2013 年网络故事写到，学生因功课太晚，睡在艺术大楼地下室的沙发上，却总觉得有人在看自己，梦也反复出现。
  - 后来他与保安聊天，对方讲起监视器里曾出现的跪坐身影；实际走到那里，却没有找到人。
  - 2024 年《迷诚品》回顾了这则网络故事。这里保存它作为校园叙事的版本，不把论坛情节当作已核实的监控记录。
  sources:
  - *id004
  - citation: OpenStreetMap contributors：National Sun Yat-sen University。
    type: map_reference
    url: https://www.openstreetmap.org/search?query=National%20Sun%20Yat-sen%20University
    locator: 高雄校园范围参考点，非具体建筑入口
- id: case_kr_school_mirror_dance_2019
  title: 韩国校园故事｜没有镜子的舞蹈室
  genre: urban_legend
  credibility_tier: B
  theme: corpus_east_asia_school_oral_accounts_2011_2026
  location:
    lat: 36.5
    lng: 127.8
    precision: culture_region
    location_name: 韩国 · 国家范围参考点
    culture_region: 东亚 · 韩国
  location_note: 香港媒体将其列为韩国校园故事，但未说明具体学校；点位仅表示国家范围。
  paragraphs:
  - 新来的老师听说舞蹈室夜里会闹鬼，决定留到晚上亲自看看。她打开音乐，对着镜中的自己跳了很久，并没有遇到传说里的身影。
  - 第二天，她告诉学生自己看了一整夜镜子。学生却说，舞蹈室正在施工，里面根本没有镜子。
  - 这是《香港 01》2019 年整理的校园故事版本；文章没有注明具体学校或最初讲述者。
  sources:
  - citation: 李梓媛：〈盘点韩国最恐怖的 5 个校园鬼故〉，《香港 01》，2019 年 5 月 13 日，2025 年更新。
    type: magazine_article
    url: https://www.hk01.com/開罐/324238/盤點韓國最恐怖的5個校園鬼故-晚上還是不要留在學校
    locator: 第三则舞蹈室镜子故事；未给出具体学校或采录人
- id: case_kr_seoul_teller_hundred_days_2013
  title: 韩国讲述｜想考第一名的约定
  genre: urban_legend
  credibility_tier: B
  theme: corpus_east_asia_school_oral_accounts_2011_2026
  location:
    lat: 37.5665
    lng: 126.978
    precision: city
    location_name: 韩国首尔 · 讲述者居住地参考
    culture_region: 东亚 · 韩国
  location_note: 首尔是档案登记的讲述者居住地；故事没有给出学校或事件地点。
  paragraphs:
  - 故事里的学生总差一点才能考到第一。一天，一位陌生老妇提出交换：连续一百天献出鲜血，并且在过程中不能低头看。
  - 到了最后一天，她终于忍不住望向禁看的地方，发现老妇就在那里，等待她的供奉。故事停在这一刻，没有交代她后来是否如愿。
  - 2013 年，两位学生在美国图书馆备考时谈起恐怖故事；其中一人说自己从韩国故事书读过这个版本。首尔点位只代表档案所载居住地。
  sources:
  - *id005
- id: case_kr_family_red_blue_paper_2026
  title: 韩国讲述｜最后一间隔间的问题
  genre: urban_legend
  credibility_tier: B
  theme: corpus_east_asia_school_oral_accounts_2011_2026
  location:
    lat: 36.5
    lng: 127.8
    precision: culture_region
    location_name: 韩国 · 故事传播范围参考点
    culture_region: 东亚 · 韩国
  location_note: 档案没有指明学校或城市；点位只表示讲述者母亲所说的韩国校园背景。
  paragraphs:
  - 一位母亲讲过，学校洗手间最后一间隔间里会有声音询问：要红色的纸，还是蓝色的纸？在她的版本里，两种选择都会带来危险。
  - 她的孩子多年后在民俗访谈中重讲故事，并记得母亲说过相似情节也见于日本。这个来源只记录了母亲的说法，不能单独证明传播路线。
  - 不同地区的版本对回答、后果和躲避办法有变化，可以与日本校园资料并读。
