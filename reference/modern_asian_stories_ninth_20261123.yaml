    paragraphs:
    - 夜里，一名乘客坐上末班公交。车到站时，又上来几个人；一位老人忽然拉着他下车。乘客不愿离开，她却坚持把他带到路边，随后说车上那些人很不寻常。
    - 第二天，故事里传来车辆失踪或坠入山谷的消息。2020 年两位在青岛读过同一所小学的讲述者重谈北京公交故事，还记得衣着、双脚和油箱的不同细节。
    - 他们也提到另一种讲法：老人发现车上乘客的可疑迹象，故事不一定涉及幽灵。讲述者还记得后来在网上见过类似说法，网络与儿童间的口耳相传在这次访谈里交织。
    - 北京高校的旧闻还有 375、347、330、333 等不同线路号；清华校友记得类似传说在 1990 年代已流行。地图只标北京城市范围，不绘制一条确定的行车路线。
  case_cn_shanghai_pacific_baby_song:
    path: vault/01_cases/case_cn_shanghai_pacific_baby_song.md
    source:
      citation: Jiedi Chen, “Shanghai Department Store Ghost”, USC Digital Folklore Archives, interview 4 November 2011, posted 20 November 2011。
      type: oral_history
      url: https://folklore.usc.edu/shanghai-department-store-ghost/
      locator: 上海受访者转述学生间的商场故事及其听闻来源
    original_source_numbers:
    - 1
    - 2
    - 3
    - 4
    source_numbers:
    - 1
    - 2
    - 3
    - 4
    - 5
    paragraphs:
    - 九十年代，上海徐家汇太平洋百货总会响起同一首《宝贝对不起》。顾客逛上几个小时，往往能听见好几遍。慢慢地，大家开始猜测：为什么商场要一直放这首歌？
    - 一种传说说，商场地下曾是育婴堂，夜里保安会听见孩子哭声，却找不到人；后来有人建议用这首歌安抚他们。不同版本把故事讲得越来越长。
    - 2011 年，一位来自上海的受访者向南加州大学采集者讲了自己从中学同学那里听到的版本；被追问细节时，她也说这些都是从别人那里听来的。
    - 旧报纸确曾批评商场反复播放这首歌。2020 年受访的商场人员解释，整点音乐用于提醒各楼层汇总营业额；2023 年地方史采访也指出，传说中的育婴堂与百货店旧址不是同一地点。
