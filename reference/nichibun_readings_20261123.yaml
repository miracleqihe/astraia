- id: case_nichibun_2181261
  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_2181261.md
  title: 北秋田｜河边的应答
  former_title: 日文研 2181261 · カッパ
  snapshot_sha256: 54ba77d5021c3c16b8d765a961ee258bc97961527c49c241a61fbfdd3705988e
  note:
    kind: history
    paragraphs:
    - 馆藏摘要记下河边玩水时的一种习俗：女孩小便前要向附近的人喊“河童”，对方回答“ドーヘ”，然后再念一段祈求不被带走的话。
    - 这是一条地方习俗的记录，所引资料出版于 1941 年；摘要并未讲述某个具体人物的经历。
    map_label: 北秋田
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
    source_numbers:
