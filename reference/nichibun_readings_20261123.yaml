  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_2260023.md
  title: 由利本庄｜雨后的脚印
  former_title: 日文研 2260023 · 河童 / カッパ
  snapshot_sha256: fdf009fcd2fb346fd80b6edb016db7694150c557fb7f8d3cbec4d02c99e55dd3
  note:
    kind: legend
    paragraphs:
    - 雨后的早晨，路上出现一串像三四岁孩子留下的脚印。同行的人说，那是河童的足迹。
    - 馆藏摘要保留了发现脚印和同行者的解释，没有进一步描述留下脚印的人或动物。所引资料出版于 1929 年。
    map_label: 由利本庄
