- id: case_nichibun_2360781
  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_2360781.md
  title: 福岛饭坂｜把糯米团送进河里
  former_title: 日文研 2360781 · 河童，（俗信） / カッパ，（ゾクシン）
  snapshot_sha256: 1e0fb0d17a25df6828473038ba5eaab1f149cca05c5c48828f073d3fa7f38f6d
  note:
    kind: history
    paragraphs:
    - 饭坂一带称十二月一日为“カッパレ”或“カッパリヤ”的朔日。这一天有人停下工作，把糯米团送入河中。
    - 记录还说，孩子吃了当天供佛的糯米团，就不会被河童拖走。馆藏摘要所引资料出版于 1964 年。
    map_label: 福岛饭坂
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
    source_numbers:
    - 1
