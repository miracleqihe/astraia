- id: case_nichibun_2181227
  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_2181227.md
  title: 北秋田｜“被河童带走”的说法
  former_title: 日文研 2181227 · カッパ
  snapshot_sha256: f39ba813254de4aec305a8358ae1343e65124f760fe5cbf225ed01dd701aa13f
  note:
    kind: history
    paragraphs:
    - 这张馆藏卡记录了一种避讳说法：不直接说一个人溺亡，而说他“被河童带走”。
    - 它保存的是一句地方用语，并没有附带完整故事。所引资料出版于 1940 年。
    map_label: 北秋田
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
    source_numbers:
