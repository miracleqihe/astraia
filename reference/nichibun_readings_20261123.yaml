- id: case_nichibun_2181263_002
  path: vault/00_drafts/nichibun_tohoku/case_nichibun_2181263_002.md
  title: 北秋田｜黄瓜尾端的禁忌
  former_title: 日文研 2181263_002 · 河童 / カッパ
  snapshot_sha256: b86feb083b0748f67eaffb3b48d986a7190421997fd793663b2f540ec4592d17
  note:
    kind: history
    paragraphs:
    - 当地流传一种与植物有关的禁忌：吃了黄瓜的尾端，就会被河童带走。
    - 馆藏卡只保存了这一句说法，所引资料出版于 1941 年。
    map_label: 北秋田
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
