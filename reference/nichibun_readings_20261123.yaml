- id: case_nichibun_2360782
  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_2360782.md
  title: 福岛饭坂｜河童朋友与糯米团
  former_title: 日文研 2360782 · 河童 / カッパ
  snapshot_sha256: 7615b79ecd89e4f9cde94244aa455cf474a82f6c56f9eac2fe7e0451f7129365
  note:
    kind: legend
    paragraphs:
    - 一个喜欢到河边玩的孩子，在十二月一日把糯米团送给河童朋友。后来河童告诉他，自己原本想取孩子的肝，给生病的父母治病。
    - 收到糯米团后，它没能下手；父母吃了团子竟好了。当地说法把这段故事与当天吃糯米团、避免被河童拖走的习俗联系起来。馆藏摘要所引资料出版于 1964 年。
    map_label: 福岛饭坂
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
    source_numbers:
    - 1
