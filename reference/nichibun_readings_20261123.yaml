- id: case_nichibun_2366183
  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_2366183.md
  title: 福岛茂庭｜五月的河中供物
  former_title: 日文研 2366183 · 河童 / カッパ
  snapshot_sha256: 1d810c5434f664639775f2f4d71d3cd70d4bbbbb670e6c0687df71236f2aacd1
  note:
    kind: history
    paragraphs:
    - 福岛中茂庭的记录说，五月四日，人们会把一个年糕送入河中，说是给河童的供物。
    - 这张馆藏卡是一条简短的习俗记录；所引资料出版于 1985 年。
    map_label: 福岛饭坂
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
