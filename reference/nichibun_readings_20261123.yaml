- id: case_nichibun_2260024
  path: vault/00_drafts/nichibun_tohoku/case_nichibun_2260024.md
  title: 由利本庄｜送鳟鱼的约定
  former_title: 日文研 2260024 · 河童 / カッパ
  snapshot_sha256: 5f9c5a57addb4d89235d7f4d6effebed299be4995ab6cf69176e066eb6b382cf
  note:
    kind: legend
    paragraphs:
    - 一只河童被发现缠在马的缰绳上，险些丧命。它答应每天早晨送来鳟鱼，才被放过。
    - 有一天，女佣把镰刀挂在门锁旁的柱子上；从那以后，鳟鱼就不再送来了。馆藏摘要所引资料出版于 1929 年。
    map_label: 由利本庄
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
