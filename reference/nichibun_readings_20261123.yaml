records:
- id: case_nichibun_0690185
  path: vault/00_drafts/nichibun_tohoku/case_nichibun_0690185.md
  title: 岩泉｜被石头惊动的水中来客
  former_title: 日文研 0690185 · ザシキワラシ，河童 / ザシキワラシ，カッパ
  snapshot_sha256: e91ca34b247a7b6d0052f8037506bd4118d46ba27caf271ed7540b9a68021735
  note:
    kind: legend
    paragraphs:
    - 一名男子在水里看见像兔子的东西，向它投了石头。当天夜里，那东西溜进他的寝室，隔着被褥压得他难受。
    - 他奋力坐起时，对方滑溜溜地逃走了。馆藏摘要记下当地把座敷童子与河童联系起来的说法；所引刊物出版于 1924 年。
    map_label: 岩泉
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
    source_numbers:
    - 1
    - 2
- id: case_nichibun_0690186
  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_0690186.md
  title: 岩泉｜粮仓里的夜宴
  former_title: 日文研 0690186 · 河童 / カッパ
  snapshot_sha256: a8a90e8210dbd2bdf769aed7664ebd29868049967f67dfb9f701b615b469eeec
  note:
    kind: legend
    paragraphs:
    - 一家富户仓里的鱼和酒每晚都不见了。主人暗中守候，看见一群十二三岁模样的孩子趁大家睡熟后进仓，大吃大喝。
    - 主人喝了一声，孩子们四散逃走；其中一个没来得及跑，被发现有红脸和盘状的头。主人让这河童写下不再作恶的保证，放了它。馆藏摘要所引刊物出版于 1924 年。
    map_label: 岩泉
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
    source_numbers:
    - 1
    - 2
- id: case_nichibun_0730013
  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_0730013.md
  title: 岩泉｜兔子分给河童的盐
  former_title: 日文研 0730013 · 河童 / カッパ
  snapshot_sha256: 6502dc47d2da53ede88744c5d43a28cc892b206970e2fd0e824ef77a900f8667
  note:
    kind: story
    paragraphs:
    - 兔子利用猴子和河童，偷走了赶马车人的货物。分赃时，河童得到盐，猴子得到草席，兔子则拿了豆子。
    - 河童的盐在河里化了，猴子又因草席打滑受了伤。兔子吃完豆子，把豆粒粘在毛上，装作自己也吃了亏。馆藏摘要所引资料出版于 1961 年。
    map_label: 岩泉
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
    source_numbers:
    - 1
    - 2
- id: case_nichibun_0730014
  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_0730014.md
  title: 岩泉｜河边化成家人的河童
  former_title: 日文研 0730014 · 河童 / カッパ
  snapshot_sha256: 996ae09fb10c365412a4240ff4a3f83db883311e378d92cb8e7ebefe4be039d8
  note:
    kind: legend
    paragraphs:
    - 馆藏摘要记载，一名女孩被称作“かあぱ”的河童拉进水里，失去了传说中的“尻子玉”。
    - 另一段说法警告喝酒后夜行的人：河童会化成妻子的模样，把人引向河边。所引资料出版于 1961 年，摘要没有给出当事人姓名或具体地点。
    map_label: 岩泉
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
    source_numbers:
    - 1
    - 2
- id: case_nichibun_0730016
  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_0730016.md
  title: 岩泉｜深潭边扬起的沙
  former_title: 日文研 0730016 · 河童 / カッパ
  snapshot_sha256: c8485149564e97bd51e81448bc1d9c8771c5bc0a8ab9f8bf30b74ac62f366d44
  note:
    kind: legend
    paragraphs:
    - 当地人说，在大潭边曾被河童扬起的沙子打到，也有人说当年看见一只在潭里。
    - 它看上去像孩子，望着望着就不见了；夜里会吓唬独自经过的人，但并不伤人性命。馆藏摘要所引资料出版于 1961 年。
    map_label: 岩泉
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
    source_numbers:
