- id: case_nichibun_2360783
  path: vault/00_drafts/nichibun_tohoku/case_nichibun_2360783.md
  title: 福岛饭坂｜十三岁孩子的约定
  former_title: 日文研 2360783 · 河童，水神，水神 / カッパ，スイジン，ミズガミ
  snapshot_sha256: 851a8f60fa071ff9f0a0f92df439e83c6805d6c219d33432abec38e694690879
  note:
    kind: legend
    paragraphs:
    - 故事里，一名男子听观音说，一个刚出生的孩子将在十三岁那年的十二月一日被河童带走。他回家后发现，那孩子竟是自己的儿子。
    - 十三岁那天，儿子执意去河边，父亲给他带了糯米团。河童出现后吃饱便离开，孩子平安归来；从此，人们在这天把团子送进河里。馆藏摘要所引资料出版于 1964 年。
    map_label: 福岛饭坂
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
