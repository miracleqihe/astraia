- id: case_nichibun_2366189
  path: vault/00_drafts/nichibun_tohoku_more/case_nichibun_2366189.md
  title: 福岛茂庭｜十二月的糯米团
  former_title: 日文研 2366189 · かっぱっこ，河童 / カッパッコ，カッパ
  snapshot_sha256: 2a67fd349bc72c122d9af1d49da5ba8edaf4724272ee775c78db444fe90499ed
  note:
    kind: legend
    paragraphs:
    - 另一则记载里，母亲担心总往海边跑的儿子被河童吃掉，便做了糯米团。儿子把团子喂给河童，让它吃饱，自己得以平安。
    - 这个版本把吃糯米团的习俗与十二月一日的“カッパレ”联系起来。它与同地其他河童故事相似，但馆藏没有说明彼此的传播关系；所引资料出版于 1985 年。
    map_label: 福岛饭坂
    location_note: 地图使用市镇地名参考点；具体采录地点未确定。出版年份不等于传说发生时间。
