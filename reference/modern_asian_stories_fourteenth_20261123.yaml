- id: case_ph_holiday_bathroom_curtain_2023
  title: 菲律宾探亲｜浴帘后的脚步
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 12.8797
    lng: 121.774
    precision: culture_region
    location_name: 菲律宾 · 国家范围参考
    culture_region: 东南亚 · 菲律宾
  map_label: 菲律宾
  location_note: 受访者只说在菲律宾探亲，未给出城市或房屋位置；点位为国家范围参考。
  temporal:
    year_start: 2023
    year_end: 2023
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一次去菲律宾探亲时，女孩住在亲属家里。一天晚上她洗澡，听见浴室门被打开，又看见帘子外地面上有脚和一道人影经过。
  - 她以为是母亲或姐姐来用浴室，没有在意；等她拉开浴帘，外面却没有人。她叫出声来，母亲赶到后说，其他家人刚才都在卧室。
  - 2023 年的采录记录了她对十四岁左右那次经历的回忆。家人在那次旅行中还继续住了两周，房屋的城市和地址没有公开。
  sources:
  - citation: licup, “The Ghost in the Bathroom”, USC Digital Folklore Archives, interview 26 November, posted 5 December 2023。
    type: oral_history
    url: https://folklore.usc.edu/the-ghost-in-the-bathroom/
    locator: 受访者回忆探亲期间浴室帘后的身影
- id: case_ph_family_storage_small_figure_2011
  title: 菲律宾家庭｜储藏室箱子上的小人
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 12.8797
    lng: 121.774
    precision: culture_region
    location_name: 菲律宾 · 家庭讲述范围参考
    culture_region: 东南亚 · 菲律宾
  map_label: 菲律宾
  location_note: 讲述者只提供菲律宾的家庭背景；没有指定房屋所在城市。
  temporal:
    year_start: 2011
    year_end: 2011
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 夜里十一点左右，母亲让女儿到楼下储藏室拿东西。女孩很快哭着跑回来，说看见一个小人坐在箱子上朝她笑。
  - 母亲和家人下楼检查，搬开箱子，却没有发现什么。她把女儿的描述与家里流传的 duwende 小人故事联系起来。
  - 采集者还记得自己十岁时，在同一座屋里看见窗外屋檐下有个影子来回走动；靠近窗户时，影子仿佛转了过来。他随后躲回被子里。
  - 2011 年的记录把母亲的转述与采集者自己的童年回忆分别保存，也提到他们对这些经历可能有不同解释。
  sources:
  - citation: Kevin Chan, “Duwende at Home in the Philippines”, USC Digital Folklore Archives, interview 1 November, posted 20 November 2011。
    type: oral_history
    url: https://folklore.usc.edu/duwende-at-home-in-the-philippines/
    locator: 母亲转述孩子在储藏室的经历及采集者自己的回忆
