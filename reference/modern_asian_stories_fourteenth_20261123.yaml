- id: case_cn_dorm_pen_falling_light_2020
  title: 中国校园｜期末考试后的笔与灯
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_campus_hidden_sight_2017_2023
  location:
    lat: 35.8617
    lng: 104.1954
    precision: culture_region
    location_name: 中国 · 讲述背景范围参考
    culture_region: 东亚 · 中国
  map_label: 中国
  location_note: 受访者说自己在中国读中学；采录没有给出城市或学校，点位仅表示讲述背景范围。
  temporal:
    year_start: 2020
    year_end: 2020
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 期末考试结束后，几个室友在宿舍里谈起当时流行的电影《笔仙》，好奇自己的成绩，便围坐在桌边，一起握着笔等待答案。她们看见笔动了起来，纸上慢慢出现一个数字。
  - 她们把笔留在宿舍，随后听见隔壁传来一声巨响：那间屋子的吊灯掉了下来。讲述者说，维修人员检查过吊灯，却没有解释原因。
  - 几个学生把两件事联系起来。第二天她们把笔埋进校园花园，此后没有再遇到类似动静；这是受访者对那次经历的回忆。
  - 2020 年，采集者通过消息向朋友询问这段中学往事。档案没有提供学校和城市，也没有保存成绩或吊灯维修记录。
  sources:
  - citation: siruizhu, “Bunshinsaba”, USC Digital Folklore Archives, interview 28 October, posted 19 November 2020。
    type: oral_history
    url: https://folklore.usc.edu/bunshinsaba/
    locator: 受访学生回忆期末考试后的宿舍经历
  - citation: siruizhu, “Bunshinsaba”, USC Digital Folklore Archives 作者索引。
    type: oral_history
    url: https://folklore.usc.edu/author/siruizhu/
    locator: 索引保留讲述、采集情境与记录者意见
- id: case_cn_tw_shipai_blue_tarp_2023
  title: 台北石牌｜蓝白帆布下面
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_campus_hidden_sight_2017_2023
  location:
    lat: 25.1154139
    lng: 121.5124667
    precision: city
    location_name: 中国台湾台北 · 石牌小学参考
    culture_region: 东亚 · 中国台湾
  map_label: 石牌
  location_note: 采录明确提到石牌小学；点位是校园地图参考，不能定位帆布原先所在的角落。
  temporal:
    year_start: 2023
    year_end: 2023
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 三年级时，同学悄悄问她听没听说校园角落的传闻：一块蓝白相间的大帆布下面，好像藏着一具遗体。大课间，几个孩子一起跑过去看。
  - 帆布确实隆起一团，但谁也不敢靠近。正当大家远远站着，一只松鼠跑过布面，孩子们立刻尖叫起来。
  - 后来她又经过那里，发现盖着的东西有一角露了出来，那是一堆木头。她不确定第一次看到的是否也是这些木头，也不知道传闻是谁开始说的。
  - 2023 年的访谈保存了她的校园回忆：先是孩子间的猜测，再是后来亲眼见到的一角，两者并不必然能互相证明。
  sources:
  - *id001
  - citation: Wikimedia Commons, Taipei Municipal Shipai Elementary School。
    type: map_reference
    url: https://commons.wikimedia.org/wiki/Category:Taipei_Municipal_Shipai_Elementary_School
    locator: 校园地图参考点 25.1154139, 121.5124667
  peers:
