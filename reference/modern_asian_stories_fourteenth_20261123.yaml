themes:
- id: corpus_asia_campus_hidden_sight_2017_2023
  title: 校园里的遮挡与回望｜口述材料并读
  genre: academic_model
  peers:
  - case_cn_tw_taipei_ntu_moon_lake
  - case_cn_beijing_teller_hidden_b4_2023
  - case_cn_qingdao_school_statue_restroom_2020
  - case_my_kemaman_camp_door_fingers_2011
  - corpus_east_asia_school_oral_accounts_2011_2026
  paragraphs:
  - 一张桌子、一扇门、一块布：校园故事常把看不见的部分留给听众想象。台湾的公寓故事和韩国的教室故事都让人物躲到桌下，却在最后一刻发现来者的姿态与自己预想不同。
  - 在台北的一次童年回忆里，孩子们听说帆布下藏着可怕的东西，跑去看时却没有人敢掀开；后来露出的一角是木头。受访者没有断言最初的传闻从何而来。
  - 新加坡一位校友回忆考试前的教室传闻；北京地下楼层和马来西亚露营厕所的故事，则由朋友、同学或家人转述。它们保留了不同人物如何讲述、相信或怀疑的线索。
  - 这些材料放在一起，是为了比较故事怎样利用遮挡与期待制造转折。相似的情节并不能单独证明某个版本从另一个地区传来。
  sources:
  - &id002
    citation: Marcus Wu, “Taiwanese Urban Ghost Story”, USC Digital Folklore Archives, 1 May 2017。
    type: oral_history
    url: https://folklore.usc.edu/taiwanese-urban-ghost-story/
    locator: 台湾受访者转述姐姐讲的公寓故事
  - &id003
    citation: Jihyun La, “The Kong-Kong Gwishin”, USC Digital Folklore Archives, interview 30 October, posted 4 November 2021。
    type: oral_history
    url: https://folklore.usc.edu/the-kong-kong-gwishin/
    locator: 受访者以韩语讲述，采集者提供英语译文
  - &id001
    citation: Yen Ai Tai, “The Secret under the Tarpaulin”, USC Digital Folklore Archives, 13 May 2023。
    type: oral_history
    url: https://folklore.usc.edu/the-secret-under-the-tarpaulin/
    locator: 受访者回忆石牌小学同学的传闻与后来看到的木头
  - &id004
    citation: Koh Yuen Lin, “A Class of Its Own”, National University of Singapore, 18 April 2022。
    type: institutional_account
    url: https://fass.nus.edu.sg/news/2022/04/18/a-class-of-its-own/
    locator: 1972 届校友 Victor Roger Savage 转述校园教室故事
