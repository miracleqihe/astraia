- id: case_my_patrol_white_guardian_2020
  title: 马来西亚｜夜巡时转过街角的人
  genre: memorate
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 4.2105
    lng: 101.9758
    precision: culture_region
    location_name: 马来西亚 · 国家范围参考
    culture_region: 东南亚 · 马来西亚
  map_label: 马来西亚
  location_note: 受访者在马来西亚太平成长，但没有明确这次巡逻的地点；地图只显示国家范围。
  temporal:
    year_start: 2020
    year_end: 2020
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 父亲参加邻里夜巡时，凌晨看见前方路中央有一个瘦高的人，穿着一身白衣，独自往街角走。巡逻的人觉得奇怪，跟了过去。
  - 他们转过弯，却再也没有看见那个人。女儿多年后转述父亲的经历，猜测他遇见的是当地称作 Na Tuk Kong 的守护灵。
  - 她向采集者解释，附近有人会为这种守护灵设供奉处。2020 年的访谈保存的是家族讲述及女儿自己的解释，并未确认那个人的身份。
  sources:
  - citation: “Na Tuk Kong”, USC Digital Folklore Archives, interview 24 October 2020。
    type: oral_history
    url: https://folklore.usc.edu/na-tuk-kong/
    locator: 受访者转述父亲夜间巡逻的经历与自己的解释
