- id: case_cn_tw_apartment_upside_down_2017
  title: 台湾讲述｜桌子挡不住的目光
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asia_campus_hidden_sight_2017_2023
  location:
    lat: 23.6978
    lng: 120.9605
    precision: province
    location_name: 中国台湾 · 区域范围参考
    culture_region: 东亚 · 中国台湾
  map_label: 台湾
  location_note: 故事只说发生在台湾一处公寓，没有给出城市或地址；点位为区域参考。
  temporal:
    year_start: 2017
    year_end: 2017
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一个学生住在公寓顶层，夜里常听见附近传来低低的声音。她请道士来查看；故事里，道士告诉她，屋里以前住过一位年轻女子，并提醒她几天后不要与来者对视。
  - 那一夜，学生按建议藏到桌子下面。第二天道士回来，发现她已经去世。故事最后才揭开原因：来者倒着进入房间，藏在桌下的人反而先看见了她的眼睛。
  - 2017 年，一位台湾受访者转述自己小时候听姐姐讲过的版本；采录没有提供公寓地址或可核查的人物身份。
  sources:
  - *id002
  peers:
  - case_kr_kong_kong_study_room_2021
- id: case_kr_kong_kong_study_room_2021
  title: 韩国校园｜走廊里的咚咚声
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asia_campus_hidden_sight_2017_2023
  location:
    lat: 36.5
    lng: 127.75
    precision: culture_region
    location_name: 韩国 · 国家范围参考
    culture_region: 东亚 · 韩国
  map_label: 韩国
  location_note: 采录称故事流传于韩国学生之间，没有指出具体学校或城市；点位为国家范围参考。
  temporal:
    year_start: 2021
    year_end: 2021
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 一个学生总是考第二名，无论怎样用功，第一名始终是身边的同学。故事说，这名学生把对方叫到楼梯口推下去，下一次考试终于得了第一。
  - 后来，这名学生独自在教室复习，听见走廊里传来“咚、咚”的声音，还有人一间间推门说里面没有人。学生想起不能和鬼对视，连忙躲到桌子下面。
  - 声音来到门口时，学生还是与来者对上了眼睛。讲述者最后解释：那个身影倒着移动，进门时正好朝向桌底。
  - 一位受访者在 2021 年以韩语讲述这个 Kong-Kong Gwishin 故事，说自己最初听同学讲过，考试前也常听见类似故事。
  sources:
  - *id003
  peers:
  - case_cn_tw_apartment_upside_down_2017
- id: case_ph_boracay_farmland_duendes_2023
  title: 菲律宾长滩岛附近｜田边的细响
  genre: memorate
  credibility_tier: B
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 11.9693
    lng: 121.9227
    precision: city
    location_name: 菲律宾 · 长滩岛区域参考
    culture_region: 东南亚 · 菲律宾
  map_label: 长滩岛
  location_note: 受访者说小时候探访长滩岛附近的亲属；点位为岛屿参考，不能定位家宅和农地。
  temporal:
    year_start: 2023
    year_end: 2023
    era_label: 资料发表
    uncertainty_note: 年份为资料发表或记录时间，并非故事中事件发生时间。
  paragraphs:
  - 孩子去长滩岛附近看望祖父母。祖母常说，地下住着叫 duendes 的小人，会藏起东西，也会带走独自走远的孩子。
  - 一天晚上，亲属在院子里聚餐。他听见农地较暗的一侧有声音，便好奇地走过去；离家人越远，声音越响，后来仿佛从几个方向传来。
  - 他害怕地跑回去，向父母和祖母讲起听见的声音。家人把它解释为遇见了 duendes；剩下的旅途中，他不再独自走远。
  - 这段童年回忆由受访者在 2023 年讲给采集者，声音与家人的解释都保留在原记录里。
  sources:
  - citation: licup, “The Duendes in the Fields”, USC Digital Folklore Archives, interview 26 November, posted 5 December 2023。
    type: oral_history
    url: https://folklore.usc.edu/the-duendes-in-the-fields/
    locator: 受访者回忆探访长滩岛附近亲属时听见田边声响
