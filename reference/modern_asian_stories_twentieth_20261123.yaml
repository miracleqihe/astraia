- id: case_cn_tw_daguanshan_tunnel_2022
  title: 台湾南横｜大关山隧道的天花板
  genre: urban_legend
  reading_kind: legend
  credibility_tier: B
  theme: corpus_asia_roads_houses_rumors_2002_2026
  location:
    lat: 23.26481
    lng: 120.95808
    precision: city
    location_name: 中国台湾 · 南横大关山隧道参考
    culture_region: 东亚 · 台湾
  map_label: 大关山
  location_note: 点位为公开地图中的隧道区域参考，不代表传闻所述位置。
