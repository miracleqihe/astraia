- id: case_cn_hk_star_street_shelter_rumor_2022
  title: 香港星街｜防空洞前的神龛
  genre: urban_legend
  reading_kind: legend
  credibility_tier: A
  theme: corpus_asia_roads_houses_rumors_2002_2026
  location:
    lat: 22.275951
    lng: 114.168608
    precision: city
    location_name: 中国香港 · 湾仔星街参考
    culture_region: 东亚 · 香港
  map_label: 星街
  location_note: 点位为星街街区参考，不指向防空洞的具体入口。
  temporal:
    year_start: 2022
    year_end: 2022
    era_label: 资料发表
    uncertainty_note: 年份为所引资料发表时间；故事所述经过可能发生于其他时间。
  paragraphs:
  - 湾仔星街一带有一处旧防空洞。围绕它流传着战时遇难者和夜间身影的故事，洞口附近的土地神龛也被一些人看作社区求平安的回应。
  - 香港地方志中心把防空洞的留存、神龛和地方传说并列记录。另一篇采访里，一位保育人士转述祖辈曾在洞内避难的经历，对洞内发生过什么提出了不同说法。
  - 旧洞、神龛与街坊记忆共同留下了一个地点的多重讲法；它们并不自动证明传闻中的每件事。
  sources:
  - &id002
