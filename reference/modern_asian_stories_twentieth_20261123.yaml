- id: case_cn_danzhou_shop_rumor_2008
  title: 海南儋州｜十五年没有租出的铺面
  genre: urban_legend
  reading_kind: legend
  credibility_tier: A
  theme: corpus_asia_roads_houses_rumors_2002_2026
  location:
    lat: 19.516795
    lng: 109.542428
    precision: city
    location_name: 中国海南 · 儋州那大镇参考
    culture_region: 中国 · 近现代地方传闻
  map_label: 那大镇
  location_note: 点位为那大镇区域参考，不指向具体商铺。
  temporal:
    year_start: 2008
    year_end: 2008
    era_label: 资料发表
    uncertainty_note: 年份为所引资料发表时间；故事所述经过可能发生于其他时间。
  paragraphs:
  - 那大镇一处两层铺面，长年被人称作“鬼屋”。经过的人越讲越玄，房东想出租或出售，却很难找到愿意接手的人。
  - 《海南日报》2008 年回访时，铺面正在装修，准备重新营业。报道说，报社前一年的调查将流言追溯到多年前的一场纠纷；随后有读者联系房东，询问租房或买房。
  - 这条新闻留下了传闻的另一面：故事在街上流传多年，也改变了一间普通铺面的命运。
  sources:
  - citation: 孙乐明、郭树坤，〈“鬼屋”闲置 15 年 装修一新成旺铺〉，《海南日报》，2008 年 3 月 19 日，第 12 版。
    type: newspaper_report
    url: https://news.hndaily.cn/resfile/2008-03-19/012/90121205895362860.pdf
    locator: 社会新闻版的跟踪报道
