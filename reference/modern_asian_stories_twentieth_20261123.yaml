- id: case_cn_tonggu_light_reflection_2015
  title: 江西铜鼓｜门前游动的光
  genre: urban_legend
  reading_kind: legend
  credibility_tier: A
  theme: corpus_asia_roads_houses_rumors_2002_2026
  location:
    lat: 28.629317
    lng: 114.387797
    precision: city
    location_name: 中国江西 · 铜鼓县参考
    culture_region: 中国 · 近现代地方传闻
  map_label: 铜鼓县
  location_note: 点位是铜鼓县区域参考，不指向报道中的私人住宅。
  temporal:
    year_start: 2015
    year_end: 2015
    era_label: 资料发表
    uncertainty_note: 年份为所引资料发表时间；故事所述经过可能发生于其他时间。
  paragraphs:
  - 2015 年，江西一处村庄流传一则微信消息：夜里有亮光在一栋新房门前移动，被人叫作“鬼灯笼”。消息很快传开，赶来看热闹的人越来越多。
  - 当地调查人员在夜间观察，并用遮光布遮住门窗：亮光随之消失；移开遮挡后，又出现了。调查组将这一现象解释为远处动态灯光经过门窗反射和折射形成的影像。
  - 报道也记录了围观带来的影响：车辆堵住村路，住宅主人和邻居不得不反复解释。故事从一束光，变成了关于陌生人、手机消息和家庭生活的故事。
  sources:
  - *id001
  - citation: OpenStreetMap，地点参考。
    type: map_reference
    url: https://www.openstreetmap.org/relation/3182918
    locator: 中国江西 · 铜鼓县参考
  peers:
  - corpus_cn_empty_buildings_2004_2008
- id: case_cn_hengshui_red_building_2011
  title: 河北衡水｜半拆楼里的脚步声
  genre: urban_legend
  reading_kind: legend
  credibility_tier: A
  theme: corpus_asia_roads_houses_rumors_2002_2026
  location:
    lat: 37.73643
    lng: 115.667723
    precision: city
    location_name: 中国河北 · 衡水城区参考
    culture_region: 中国 · 近现代地方传闻
  map_label: 衡水
  location_note: 点位为衡水城区参考，不标示当年的住宅或住户。
  temporal:
    year_start: 2011
    year_end: 2011
    era_label: 资料发表
    uncertainty_note: 年份为所引资料发表时间；故事所述经过可能发生于其他时间。
  paragraphs:
  - 衡水一幢商住楼被拆去一部分后，红色外墙和空荡的楼体格外显眼。附近流传着做饭时听见身后脚步声、睡在床上却在地上醒来的说法。
  - 2011 年记者采访时，拆迁部门解释，工程停下涉及尚未签订协议的住户，以及与邻近建筑距离过近的安全问题。两位当地村民则把早年的“闹鬼”说法与搬迁纠纷联系起来。
  - 脚步声和房屋来历有不同版本；当时能看到的半拆建筑和关于它的故事，被路人一起记住了。
  sources:
  - citation: 中新网，〈河北衡水一搁置建筑被传“鬼楼” 拆迁部门回应〉，2011 年 4 月 21 日；华商网转载。
    type: investigative_report
    url: https://news.hsw.cn/system/2011/04/21/050901861.shtml
    locator: 居民讲述与拆迁部门回应
  - citation: OpenStreetMap，地点参考。
    type: map_reference
