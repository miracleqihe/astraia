themes:
- id: corpus_asia_roads_houses_rumors_2002_2026
  title: 夜路、旧屋与人群｜亚洲地方怪谈的几条线索
  paragraphs:
  - 同一段夜路，有人记住坡道和弯，有人记住车里的乘客，还有人记住从林地深处传来的笑声。地方怪谈常把一个可辨认的地点，变成一段可以转述的经历。
  - 在千叶富津，民俗研究者通过访谈和隧道故事分析，讨论空间气氛怎样影响人的感受；在江西铜鼓，调查人员则围绕门前光影做了现场遮挡实验。两种材料提出的问题不同，却都保留了故事发生的环境。
  - 网络照片、夜访报道和口耳相传会让旧屋或道路获得新的名字。我们把故事、报道后续和当事人的不同说法放在一起阅读，不把相似情节直接当作传播路线或共同起源。
  sources:
  - &id004
    citation: 岩埜紘史朗，〈雰囲気と怪異：トンネル怪談と心霊スポット「観音隧道」を事例として〉，《現代民俗学研究》18，2026，85–100 页。
    type: peer_reviewed
    url: https://www.jstage.jst.go.jp/article/slf/18/0/18_85/_article/-char/ja
    locator: 摘要及论文第 93、95–96 页
  - &id001
    citation: 陈国菊、陈欣，〈“鬼火”微信传言日点击量上万 房主财产受损〉，大江网，2015 年 6 月 1 日；中新网转载。
    type: investigative_report
    url: https://www.chinanews.com/sh/2015/06-01/7313982.shtml
    locator: 传闻传播、住户访谈与现场遮挡实验
  - &id006
    citation: Faizal Amiruddin，〈Mitos Nini Loyeh dan Jalur Gaib di Tengah Warga Pangandaran〉，detikNews，2021 年 10 月 19 日。
    type: interview
    url: https://news.detik.com/berita-jawa-barat/d-5773168/mitos-nini-loyeh-dan-jalur-gaib-di-tengah-warga-pangandaran
