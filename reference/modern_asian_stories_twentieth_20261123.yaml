- id: case_cn_beijing_tuanjiehu_building_rumor_2011
  title: 北京团结湖｜像录像带一样的墙
  genre: urban_legend
  reading_kind: legend
  credibility_tier: B
  theme: corpus_asia_roads_houses_rumors_2002_2026
  location:
    lat: 39.930556
    lng: 116.457696
    precision: city
    location_name: 中国北京 · 团结湖街区参考
    culture_region: 中国 · 近现代地方传闻
  map_label: 团结湖
  location_note: 点位为团结湖街区参考，不指向具体住户或楼层。
  temporal:
    year_start: 2011
    year_end: 2011
    era_label: 资料发表
    uncertainty_note: 年份为所引资料发表时间；故事所述经过可能发生于其他时间。
  paragraphs:
  - 北京一处公寓的空置和冷清，在网上被解释成“楼里有鬼”。有人又补上一种说法：墙面能够像录像带一样留下人影，遇到闪电时再把影子放出来。
  - 2011 年记者访问住户和周边人士，发现不少人最初也是从网络听到这个故事；报道同时追问楼盘销售、入住和开发商等现实背景。
  - 会“播放影像”的墙是流言中的解释，报道并没有用实验支持这种说法。
  sources:
  - citation: 〈紫荆豪庭捂盘拖出鬼故事〉，2011 年 10 月 28 日，新浪财经转载。
    type: investigative_report
