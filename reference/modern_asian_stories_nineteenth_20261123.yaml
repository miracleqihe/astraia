- id: case_cn_shanghai_fudan_fourth_classroom_2004
  title: 上海复旦｜清场时留在教室的人
  genre: urban_legend
  credibility_tier: C
  theme: corpus_asia_campus_lore_spaces_2004_2024
  location:
    lat: 31.29826
    lng: 121.49537
    precision: city
    location_name: 中国上海 · 复旦大学邯郸校区附近
    culture_region: 东亚 · 中国
  map_label: 复旦大学
  location_note: 点位为复旦大学地铁站附近的校区参考，不是故事中的教室或当年建筑入口。
  temporal:
    year_start: 2004
    year_end: 2004
    era_label: 资料发表
    uncertainty_note: 年份为所引资料发表时间，不等于故事所述情节的发生时间。
  paragraphs:
  - 一位复旦学生转述：复习考试的夜里，教学楼一间自习室只剩下一位女生和一名男生。管理员进门提醒她该离开，她便收拾东西下楼。
  - 楼道渐暗，她想等那位男生一起走，却一直没有见他出来。直到楼灯熄灭，管理员也离开了，她才想起对方刚才似乎只对她一个人说了话。
  - 这则故事发表于 2004 年的学生访谈，讲述者说它是从研究生那里听来的。
  sources:
  - citation: 新浪教育，《动感e族》，2004 年 3 月 4 日。
    type: interview
    url: https://edu.sina.com.cn/y/news/2004-03-04/4183.html
    locator: 复旦学生转述第四教学楼的夜间自习故事
  - citation: OpenStreetMap / GeoNames，地点参考。
    type: map_reference
    url: https://mapcarta.com/N9381675519
    locator: 复旦大学站、邯郸校区附近
  peers:
  - corpus_cn_campus_lore_and_writing_2007
