    culture_region: 东亚 · 中国
  map_label: 北京师大
  location_note: 点位表示学校区域，未将传闻定位到某一扇校门或某次事件。
  temporal:
    year_start: 2018
    year_end: 2018
    era_label: 资料发表
    uncertainty_note: 年份为所引资料发表时间，不等于故事所述情节的发生时间。
  paragraphs:
  - 校园里的一个说法是：南门每开一次，便会有人出事。门的开合因此被一些讲故事的人赋予了不祥的意味。
  - 2018 年一篇讨论高校怪谈的文章将这一说法与校园地名、建筑和风水传闻并列。它记录的是口耳相传的联系，没有证明门与人员伤亡之间存在因果关系。
  sources:
  - &id001
    citation: 惊蛰青年，《昨晚我在大学里撞见……》，2018 年 10 月 31 日。
