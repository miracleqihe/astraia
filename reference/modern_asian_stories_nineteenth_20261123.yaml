themes:
- id: corpus_asia_campus_lore_spaces_2004_2024
  title: 教室、窗与夜路｜亚洲城市中的校园怪谈
  paragraphs:
  - 熄灯前的自习室、九楼的窗口、总在同一层停下的电梯：校园怪谈把熟悉的空间稍稍改写，便让日常路线出现了另一种走法。
  - 山东大学校园传说研究、韩国民俗学者关于大学怪谈的论文，以及万隆媒体对学生和学者的采访，都关注故事怎样在人与人之间流传。相似情节可以并读，但不能因此断定它们彼此借用。
  - 这组材料既有学生转述的传说，也有受访者自称经历的故事；刊载时间、叙述身份和地点精度分别保留。
  sources:
  - citation: 马星宇，《校园“惊魂”：校园恐怖传说探析——以山东大学校园传说为例》，《民俗研究》2016 年第 6 期。
    type: peer_reviewed
    url: https://m.fx361.com/news/2016/1130/16458455.html
    locator: 摘要及开篇校园故事
  - citation: Kim Jong-dae, “Types and means of existence in ghost stories; Among university student circles”, 2006。
    type: peer_reviewed
    url: https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART001018134
    locator: 韩国口碑文学研究 22，409–442 页及摘要
  - &id003
    citation: Hengky Sulaksono, “Legenda Urban Hantu Kampus di Bandung”, Mojok, 7 May 2022。
    type: interview
    url: https://mojok.co/liputan/legenda-urban-hantu-kampus-di-bandung/
    locator: 校园传闻、学生采访与人文学者评论
  peers:
  - corpus_east_asia_school_oral_accounts_2011_2026
  - corpus_id_campus_stories_and_media_2021_2024
