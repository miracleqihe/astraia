    culture_region: 东亚 · 韩国
  map_label: 三陟
  location_note: 点位取三陟市区参考，故事指向江原大学三陟校区，未精确标出喷泉。
  temporal:
    year_start: 2024
    year_end: 2024
    era_label: 资料发表
    uncertainty_note: 年份为所引资料发表时间，不等于故事所述情节的发生时间。
  paragraphs:
  - 一名江原大学学生说，三陟校区正门附近有座喷泉，周围有商店和来往的人，可他很少见人走到喷泉边。
  - 他向学长询问原因，得到的回答是：夜里那里会传来女子哭声，靠近时还会觉得发冷。这个解释来自学生转述，而喷泉在白天只是校园入口的一处景观。
  sources:
