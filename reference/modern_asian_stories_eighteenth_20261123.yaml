    uncertainty_note: 年份表示报道或讲述记录时间；传闻内容及事件经过并非由此证实。
  paragraphs:
  - 1954 年，贤律一带传出夜里出现白衣身影的消息。报刊转述说，有人追赶时，对方会朝人群投掷石子；附近住户开始提早回家，晚上紧闭门窗。
  - 不同家庭给出不同解释：有人联想到附近施工与战时埋葬，有人向神明祈求平安。后来有居民把一位老妇人的去世与传闻联系起来，这是他们当时的理解，并非事件原因的证明。
  - 研究者对照了当年的华文与英文报纸。新闻记录了恐惧和应对方式，却无法证明目击者看到的是同一人或超自然存在。
  sources:
  - citation: 'Esmond Chuah Meng Soh、Jin Rong Aw，Experience, person, and myth: A socio-cultural history of the ‘oily man’ in post-colonial Malaysia and Singapore，Modern Asian Studies，2026，doi:10.1017/S0026749X26102194。'
