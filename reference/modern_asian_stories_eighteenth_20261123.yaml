existing_notes:
  case_ph_cole_1916_p068:
    paragraphs:
    - 山里的一群猎人听见狗叫，以为它围住了鹿；跑近后却发现，它追逐的是一只会自己移动的陶罐。猎人们怎么也抓不住它，歇下时听到一个看不见的人指点他们怎样继续寻找。
    - 罐子最终躲进山洞，被人带回。书中说它叫 Magsawi，会说话，也会独自远行去探望另一只罐子；后来罐身裂开，人们便听不清它的声音了。
    - 1916 年选集把这个故事放在 Tinguian 目录下，并提到罐子持有者与地方名称。这里保留的是该书的讲法，不能将书中的时代称呼直接等同于所有当代社群。
    source:
      citation: Mabel Cook Cole, Philippine Folk Tales, A. C. McClurg, Chicago, 1916；Project Gutenberg 电子转录。
      type: edition_link
      url: https://www.gutenberg.org/ebooks/12814
      locator: 1916 年版印刷页 68–70；电子转录可检索原题
  case_ph_cole_1916_p071:
    paragraphs:
    - 一位猎人在山中追赶受伤的鹿，和狗一同钻进洞里。洞室一间连着一间，他循着狗叫摸索，忽然碰到一棵长着果实的小树；折下一枝时，树竟发出陌生的声音。
    - 他慌忙奔出洞口，来到阿布拉河边，才发现枝上的“果实”是珍贵的玛瑙珠。村里人跟着他回去寻找，树却已经不见了，洞壁上只留下奇怪的刻痕。
    - 这是 1916 年英文本中保存的一种讲述；书中提及河流，却没有给出可以准确标点的洞口。
    source:
      citation: Mabel Cook Cole, Philippine Folk Tales, A. C. McClurg, Chicago, 1916；Project Gutenberg 电子转录。
      type: edition_link
      url: https://www.gutenberg.org/ebooks/12814
      locator: 1916 年版印刷页 71–72；电子转录可检索原题
  case_ph_cole_1916_p073:
    paragraphs:
    - 三个人进山打猎，夜里各自裹着毯子睡在树下。其中一人的毯子有红黄条纹，在昏暗中像一只小野猪；他还醒着时，听见两个精灵说要把这只“野猪”吃掉。
    - 他悄悄把自己的条纹毯换到同伴身上。精灵果然误认了毯子下面的人。1916 年选集把这个不安的结局和一条山中禁忌联系起来。
    - 这是一则历史选集中的故事版本；书中没有标明此次讲述的采录村落。
    source:
      citation: Mabel Cook Cole, Philippine Folk Tales, A. C. McClurg, Chicago, 1916；Project Gutenberg 电子转录。
      type: edition_link
      url: https://www.gutenberg.org/ebooks/12814
      locator: 1916 年版印刷页 73；电子转录可检索原题
  case_ph_cole_1916_p077:
    paragraphs:
    - 有人走过树林，看见一群名叫 Alan 的精灵倒挂在树上。他被吓得跌倒，精灵以为他已经死去，下来为他放上金子和珠子。
    - 他突然跳起来，想把精灵赶走；精灵只要求他归还其中一颗特别的珠子，其余都可以带走。他拒绝后，精灵生气离开，说会烧掉他的房子。后来房子果然起火了。
    - 这个版本载于 1916 年选集，既有对陌生精灵的恐惧，也写出误会和不愿归还珠子带来的后果。
    source:
      citation: Mabel Cook Cole, Philippine Folk Tales, A. C. McClurg, Chicago, 1916；Project Gutenberg 电子转录。
      type: edition_link
      url: https://www.gutenberg.org/ebooks/12814
      locator: 1916 年版印刷页 77–78；电子转录可检索原题
  case_ph_cole_1916_p079:
    paragraphs:
    - 猎人 Sogsogot 被大鸟抓到高树上的巢里。他照顾巢中的雏鸟，等它们长大时抓住鸟腿，终于回到地面。
    - 后来，他在路上遇见已去世的妻子。妻子让他带上一只白鸡，领他去亡者的村落，并教他用鸡羽挡住夜里前来的居民。住了两周，羽毛快用完时，他请求回家，妻子便给他路上吃的米。
    - 回家后，他才从家人那里得知妻子已经下葬。1916 年选集将这段旅程与当时记录的亡者世界观联系起来；这是选集中的讲述，并不代表所有相关社群的看法。
    source:
      citation: Mabel Cook Cole, Philippine Folk Tales, A. C. McClurg, Chicago, 1916；Project Gutenberg 电子转录。
      type: edition_link
      url: https://www.gutenberg.org/ebooks/12814
      locator: 1916 年版印刷页 79–81；电子转录可检索原题
  case_ph_cole_1916_p113:
    paragraphs:
    - 两个兄弟每天上山捡柴，母亲总嫌他们带回来的柴不好，给的食物也很少。有一天，哥哥爬上树，说要给家里更多的柴，落下的却是一根根自己的骨头。
    - 弟弟伤心地收起骨头，一只鹰从树上传来声音，说要陪他回家。母亲看见带回来的东西吓了一跳；哥哥已化作鹰，在空中盘旋，再也不用向她讨食物。
    - 1916 年选集注明此故事曾由 A. E. Jenks 记录，也把它作为一种鸟的由来故事。这里保存的是该版本，而非对整片山区的概括。
    source:
      citation: Mabel Cook Cole, Philippine Folk Tales, A. C. McClurg, Chicago, 1916；Project Gutenberg 电子转录。
      type: edition_link
      url: https://www.gutenberg.org/ebooks/12814
      locator: 1916 年版印刷页 113–114；电子转录可检索原题
