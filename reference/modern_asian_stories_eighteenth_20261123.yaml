  genre: urban_legend
  credibility_tier: B
  theme: corpus_sg_my_oily_man_press_1932_2002
  location:
    lat: 1.738
    lng: 103.9
    precision: city
    location_name: 马来西亚柔佛 · Kota Tinggi 城市参考
