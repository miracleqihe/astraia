themes:
- id: corpus_sg_my_oily_man_press_1932_2002
  title: 油鬼仔｜从街巷传闻到报纸与电影
  paragraphs:
  - 从 1930 年代的新加坡，到世纪之交的马来西亚，“油鬼仔”在不同报道中可能是夜间闯入者、令人不安的传闻，也可能是被赋予法术的身影。相同的名字，并不保证人们说的是同一件事。
  - 2026 年一项研究比较英语、华语和马来语报刊，追踪目击、指认、巡逻以及电影中的再讲述。研究者把人物、经历和神话放在一起考察，而不是把所有报道归为一种固定的鬼怪。
  - 这组卷宗按报道地点和时间并列：贤律一带的夜间惊扰、皇后街的围观、金文泰的巡逻，以及笨珍与昔加末的不同版本。它们之间的连线表示供读者比较，不代表同一人活动路线。
  sources:
  - citation: 'Esmond Chuah Meng Soh、Jin Rong Aw，Experience, person, and myth: A socio-cultural history of the ‘oily man’ in post-colonial Malaysia and Singapore，Modern Asian Studies，2026，doi:10.1017/S0026749X26102194。'
    type: research_article
    url: https://www.cambridge.org/core/journals/modern-asian-studies/article/experience-person-and-myth-a-sociocultural-history-of-the-oily-man-in-postcolonial-malaysia-and-singapore/B1EC978DEEDDD8614609F46B0AFBA5AE
    locator: 摘要；Experience、Person、Myth 各节及所引当时报刊；CC BY 4.0
  peers: []
