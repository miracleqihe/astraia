  title: 新加坡皇后街｜为看“油鬼仔”聚集的人群
  genre: urban_legend
  credibility_tier: B
  theme: corpus_sg_my_oily_man_press_1932_2002
  location:
    lat: 1.298
    lng: 103.852
    precision: city
    location_name: 新加坡 · 皇后街教堂附近参考
    culture_region: 东南亚 · 马来西亚与新加坡
  map_label: 皇后街
  location_note: 标点表示皇后街教堂附近的区域，并非目击位置或人物住址。
  temporal:
