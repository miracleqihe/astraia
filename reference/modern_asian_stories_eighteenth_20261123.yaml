- id: case_cn_tw_hengchun_fieldhouse_pressure_2018
  title: 台湾恒春｜野外调查借住的房子
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 22.00266
    lng: 120.74469
    precision: city
    location_name: 中国台湾屏东 · 恒春镇参考
    culture_region: 东亚 · 中国
  map_label: 恒春
  location_note: 点位是恒春镇参考位置；访谈没有公布房屋地址。
  temporal:
    year_start: 2018
    year_end: 2018
    era_label: 资料记录
    uncertainty_note: 年份表示报道或讲述记录时间；传闻内容及事件经过并非由此证实。
  paragraphs:
  - 地质研究生到恒春做野外调查时，常借住同一处房子。学长之间流传过几个住客的经历：有人觉得身上压着东西，想动却动不了，于是把房子与“鬼压身”联系起来。
  - 2018 年的受访者说，这些是他从同学和学长那里听来的。他自己也曾经历醒来时无法活动，觉得睡眠和身体的状态可能有关，但没有亲历这处房子里的说法。
  - 故事没有提供房屋位置或逐次记录。它让我们看到一个熟悉的身体经验，如何在学生住宿和野外工作的语境里被讲成地方故事。
  sources:
