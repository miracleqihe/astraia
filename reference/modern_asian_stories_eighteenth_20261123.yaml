  theme: corpus_asia_night_places_oral_accounts_2012_2025
  location:
    lat: 39.91743
    lng: 116.39078
    precision: city
    location_name: 中国北京 · 故宫建筑群参考
    culture_region: 东亚 · 中国
  map_label: 故宫
  location_note: 点位表示故宫建筑群，访谈没有确定是哪一口井。
  temporal:
    year_start: 2022
    year_end: 2022
    era_label: 资料记录
    uncertainty_note: 年份表示报道或讲述记录时间；传闻内容及事件经过并非由此证实。
  paragraphs:
  - 一位讲述者在短视频里听到一则故宫故事：宫里有口井，夜间会传出奇怪的声音；有人说，一位年轻女子曾在那里遭遇不幸，如今仍徘徊井边。
  - 2022 年的访谈里，他记不清女子的身份，也没有说出井的名称。这个版本保留的是他从网络听来的故事，不能据此把传言中的人物、地点和经过当作史实。
  - 故宫还有关于红墙影子的另一则流传故事。两者都借助宫殿空间展开，却有不同的情节与出处。
  sources:
