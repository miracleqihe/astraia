  - id: case_jp_kanashibari_sleep_lore
    title: 日本｜“金缚”从不动明王法咒到睡眠麻痹俗称的演变
    aliases: [Kanashibari, 金缚, 不动明王, 鬼压床]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 35.6762, lng: 139.6503, precision: culture_region, location_name: 日本 · 本州东京及民俗语汇流传区（文化参考）, culture_region: 东亚 · 日本}
    location_note: 坐标取日本东京作文化流变与现代睡眠研究语境参考；“金缚”作为日常用语与睡眠体验俗称通行于日本全国。
    paragraphs:
      - 在日本现代日常语言里，指代睡眠麻痹的惯用词“金缚”（kanashibari，字面意为“像被金属铁链牢牢捆住”）最初并非描述卧室睡眠困厄的医学或怪谈名词。它的语源扎根于日本密教与修验道传统：不动明王法相中左手常持绳索“绢索”（kensaku），象征降伏与束缚邪祟烦恼；古代行者借持诵不动明王咒施展“金缚法”，旨在将妖魔或敌手定身封锁、使其寸步难行。
      - 随着密教礼俗与山岳修行词汇逐渐进入近世庶民生活和怪谈书写，“如遭金属铁索捆束、浑身无法动弹”的意象发生了显著语义迁移：人们把半夜醒来时四肢麻木、听见室内异声或感知无形压迫的惊惧体验转称为“遭遇金缚”，并在江户至现代都市怪谈中将其与幽灵、狐狸作祟或凶宅传闻挂钩。
      - 二十世纪八十年代末以来，日本睡眠学者福田一彦（1987）及宗泽岳史等（2011）针对大学生和全国青少年展开大规模问卷与多导睡眠监测研究，发现自陈经历“金缚”者占比颇高，且与熬夜作息紊乱及入睡期快速眼动睡眠（SOREMP）显著相关。一个源于佛教缚魔仪轨的宗教法词，由此完成了向现代跨文化睡眠麻痹标准民俗俗称的转型。
    sources:
      - {citation: 'Kazuhiko Fukuda, T. Miyasita, M. Inugami & K. Ishihara, High prevalence of isolated sleep paralysis: kanashibari phenomenon in Japan, Sleep 10(3), 1987, 279–286.', type: academic_article, url: 'https://pubmed.ncbi.nlm.nih.gov/3629091/', locator: 日本大学生群体中金缚现象的早期流行病学调查}
      - {citation: 'Takeshi Munezawa et al., Nightmare and sleep paralysis among Japanese adolescents: a nationwide representative survey, Sleep Medicine 12(1), 2011, 56–64.', type: academic_article, url: 'https://pubmed.ncbi.nlm.nih.gov/20920888/', locator: 日本全国青少年噩梦与金缚睡眠麻痹调查统计}
      - {citation: 'JAANUS (Japanese Architecture and Art Net Users System), Fudou Myouou.', type: institutional_account, url: 'https://www.aisf.or.jp/~jaanus/deta/f/fudoumyouou.htm', locator: 密教不动明王造像、降魔绢索与缚魔仪轨图标注记}
    compare: [case_sleep_paralysis_lab_1992, case_cn_hk_ghost_oppression_wing_1994]
    motifs: [index_ocm_776]
    bridge: {entry: LAN-3-0004, cluster: sid_hag, trail: all, label: 宗教咒法语词与日常语义迁移, rationale: 追踪“金缚”从密教不动明王缚魔仪轨转为现代睡眠瘫痪俗称的历程，观察语言接触与语境转化如何重塑身体体验名称。}

  - id: case_ru_kikimora_night_lore
    title: 俄罗斯｜宅灵基基莫拉夜间纺纱与噩梦压迫民俗
    aliases: [Kikimora, Кикимора, Shishimora, 基基莫拉, 宅灵]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 59.2205, lng: 39.8915, precision: province, location_name: 俄罗斯 · 北方俄语民俗采集区（沃洛格达参考）, culture_region: 欧洲 · 俄罗斯东欧}
    location_note: 坐标取俄罗斯北部沃洛格达一带作传统农舍信仰采录区参考；基基莫拉传说广泛流传于俄罗斯北方及东斯拉夫乡村。
    paragraphs:
      - 在俄罗斯与东斯拉夫民间信仰体系中，基基莫拉（Kikimora）是一位性格多变甚至令人畏惧的家宅女性灵体，常与男性宅神“多莫沃伊”（Domovoi）形成对应，有时也被讲成栖息在林沼边缘的精怪。词源学上，其名称后半部分的“mora”正与斯拉夫语里指代噩梦与夜间压迫灵体的古词根同源，直接联系着夜半窒息惊梦的体验。
      - 民俗学者琳达·伊万尼茨在《俄罗斯民间信仰》以及安西莫娃与戈卢布科娃（2016）关于俄语词典与民族志的考述中记载：基基莫拉形貌瘦小凌乱，白昼蛰伏于农舍土炉背后、地窖或阁楼，夜晚则显现并摆弄未收好的纺锤。乡民普遍相信，若在深夜听见炉后传来细碎急速的纺纱声，往往预示家中即将有凶信或丧事；而半夜被乱线缠绕、被无形重物压住胸口难以翻身呼喊，或是家禽惊扰、碗碟碎响，亦常被归因于基基莫拉对懈怠主妇的恼怒。
      - 从乡村社会生活来看，基基莫拉传说一方面以“睡前务必收拾纱线、勿在夜间纺麻”及看护孩童睡眠的家庭戒律维系室内劳动节奏，另一方面也把农舍夜间鼠响木裂与睡眠瘫痪压胸感编织进同一位“炉后夜纺者”的叙事形象中。
    sources:
      - {citation: 'Linda J. Ivanits, Russian Folk Belief (1989), Internet Archive.', type: academic_article, url: 'https://archive.org/details/russianfolkbelie0000ivan', locator: 俄罗斯农舍灵体分类、基基莫拉夜间纺纱禁忌与民族志采录}
      - {citation: 'O. K. Ansimova & O. V. Golubkova, Mythological Characters of the Domestic Space in Russian Folk Beliefs: Lexicographic and Ethnographic Aspects, Archaeology, Ethnology & Anthropology of Eurasia 44(3), 2016, 130–138.', type: academic_article, url: 'https://doi.org/10.17746/1563-0110.2016.44.3.130-138', doi: '10.17746/1563-0110.2016.44.3.130-138', locator: 俄罗斯家宅空间神话角色的词典学与田野分布研究}
    compare: [case_ru_karelia_baba_yaga, case_se_scandinavia_mara_nightmare]
    motifs: [index_ocm_776]
    bridge: {entry: REL-5-0007, cluster: sid_hag, trail: all, label: 炉灶家宅空间与夜间规训, rationale: 对比俄罗斯农舍炉灶背后的“基基莫拉”纺纱警示与家庭空间信仰，理解家宅叙事如何将夜声与日常劳动规范相连。}

  - id: case_ma_maghreb_bou_kebbaz
    title: 马格里布与摩洛哥｜夜间压胸灵体“布凯巴兹”睡眠传说
    aliases: [Bou Kebbaz, Boukebbaz, Boughattat, Al-Jathoom, 布凯巴兹, 布加塔特, 马格里布夜压]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 34.0209, lng: -6.8416, precision: culture_region, location_name: 摩洛哥及马格里布地区（拉巴特文化参考）, culture_region: 非洲 · 摩洛哥与马格里布}
    location_note: 坐标取摩洛哥西部拉巴特作马格里布地区文化参考；“布凯巴兹”（Bou Kebbaz）与“布加塔特”（Boughattat）等夜间压胸俗称及传说通行于摩洛哥及北非多地方言社群。
    paragraphs:
      - 在摩洛哥及更广泛的北非马格里布方言口述里，睡醒交界之际骤然全身动弹不得、胸肺受重压窒息的经历常以具体夜压灵体相称，地方语汇中既见“布凯巴兹”（Bou Kebbaz / Boukebbaz）等呼号，在摩洛哥阿拉伯语里也广泛使用意为“覆压窒息者”的“布加塔特”（Boughattat）以及泛阿拉伯世界的“贾苏姆”（Al-Jathoom）。亲历者多讲述黑夜中有沉重黑影跨坐胸前，令人想呼喊却喉舌凝滞。
      - 人类学与跨文化精神医学研究长期关注北非民众如何解释这类夜间侵扰。文森特·克拉潘扎诺（1975）在摩洛哥民族心理研究中分析了当地梦境、精灵（jnun）观念与个体危机的象征转译；而阿纳斯塔西娅·利姆等学者（2015）对穆斯林患者精灵归因的综述亦显示，在许多马格里布家庭的认知结构里，夜间压迫、幻听与感官异常首先被当作精灵接触问题，并借诵念《古兰经》护佑经文（如“宝座经文”）寻求安抚。
      - 近年北非临床睡眠流行病学调查（如 2024 年突尼斯成年人睡眠习惯与障碍横断面研究）进一步表明，马格里布人群中的睡眠瘫痪发作频率与作息紊乱、焦虑及仰卧睡眠高度相关。田野访谈与睡眠调查互相参照，呈现了传统灵体名称与现代睡眠生理知识在当代北非社会中的长期并存。
    sources:
      - {citation: 'Vincent Crapanzano, Saints, Jnun, and Dreams: An Essay in Moroccan Ethnopsychology, Psychiatry 38(2), 1975, 145–159.', type: academic_article, url: 'https://pubmed.ncbi.nlm.nih.gov/1144570/', locator: 摩洛哥民族心理学中的精灵观念、梦境与夜间惊惧分析}
      - {citation: 'Anastasia Lim, Hans W. Hoek & Jan Dirk Blom, The attribution of psychotic symptoms to jinn in Islamic patients, Transcultural Psychiatry 52(1), 2015, 18–32.', type: academic_article, url: 'https://pubmed.ncbi.nlm.nih.gov/25080427/', locator: 伊斯兰与北非文化背景中感官异象归因精灵的跨文化精神医学综述}
      - {citation: 'Sameh Msaad et al., Sleep Habits and Disturbances Among Tunisian Adults: A Cross-Sectional Online Survey, Nature and Science of Sleep 16, 2024.', type: academic_article, url: 'https://doi.org/10.2147/NSS.S456879', doi: '10.2147/NSS.S456879', locator: 北非马格里布成年人群体睡眠紊乱与睡眠瘫痪相关横断面调查}
    compare: [case_egypt_jinn_sleep_paralysis, case_ma_tangier_aisha_qandisha]
    motifs: [index_ocm_776]
    bridge: {entry: REL-5-0004, cluster: sid_hag, trail: all, label: 北非精灵阐释与睡瘫共存, rationale: 对读摩洛哥民族心理研究与北非睡眠调查，观察传统“布凯巴兹”和精灵观念怎样与现代睡眠医学并存于同一社群。}

  - id: case_jp_kyoto_tsukumogami_lore
    title: 日本京都｜室町《付丧神记》百年器物成精与百鬼夜行
    aliases: [Tsukumogami, Tsukumogami-ki, Hyakki Yagyo, 付丧神, 付丧神记, 百鬼夜行]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 35.0116, lng: 135.7681, precision: city, location_name: 日本京都府 · 京都市（室町叙事舞台参考）, culture_region: 东亚 · 日本京都}
    location_note: 坐标取日本京都市中心作室町时代《付丧神记》叙事发生城市参考；其情节围绕京城街巷年末大扫除与旧器物被弃的都市情景展开。
    temporal: {year_start: 1485, year_end: 1600, era_label: '室町时代（1485 年《实隆公记》确载《付丧神绘》）', uncertainty_note: '三条西实隆日记《实隆公记》文明十七年（1485）十月已有观览《付丧神绘》记载；现存写本画卷主要为江户时期传抄。'}
    paragraphs:
      - 日本室町时代流传下来的御伽草子绘卷《付丧神记》，把妖怪想象直接植根于京都庶民家庭的器物使用周期之中。故事讲述京城贵族与百姓在年末“煤拂”（大扫除）时，将服务将近百年、磨损残破的琵琶、茶釜、雨伞、草履与数珠一并丢弃在街角路旁；这些旧物怨愤人类忘恩负义，决意在立春前夜“节分”集结化妖，组成声势浩大的“百鬼夜行”在京都街巷作祟。
      - 公卿三条西实隆的日记《实隆公记》于文明十七年（1485 年）明确记载曾在宫中观览上下两卷《付丧神绘》，而京都大学附属图书馆珍藏的江户抄本《付丧神绘卷》等馆藏也保存了这批图文谱系。研究日本宗教文学的学者野里子·T·赖德（Noriko T. Reider, 2009）指出，《付丧神记》绝非单纯的吓人怪谈，结尾处作祟器物被佛法降伏后经真言宗高僧点化而悉数成佛，实则以叙事寓言演绎了“草木国土悉皆成佛”与无情物（非情）亦可悟道的密教义理。
      - 历经江户时代鸟山石燕等妖怪图鉴的再编目，“使用满九十九年或百年的旧器物会滋生灵性化作付丧神”逐渐脱离原本的真言宗说教外壳，成为日本民俗里广为人知的器物妖怪母题，反映出前现代社会惜物伦理、废弃焦虑与日常物质寿命之间的想象张力。
    sources:
      - {citation: 'Noriko T. Reider, Animating Objects: Tsukumogami ki and the Medieval Illustration of Shingon Truth, Japanese Journal of Religious Studies 36(2), 2009, 231–257.', type: academic_article, url: 'https://doi.org/10.18874/jjrs.36.2.2009.231-257', doi: '10.18874/jjrs.36.2.2009.231-257', locator: 室町《付丧神记》文本、1485 年文献着录与真言宗非情成佛阐释}
      - {citation: 'Kyoto University Rare Materials Digital Archive, Tsukumogami Emaki (付喪神絵巻 2巻).', type: archival_catalogue, url: 'https://rmda.kulib.kyoto-u.ac.jp/item/rb00013599', locator: 京都大学图书馆藏两卷本《付丧神绘卷》数字化写本与书志记录}
    compare: [case_jp_kurama_tengu]
    motifs: [index_berezkin_c13, index_ocm_776]
    bridge: {entry: HIS-4-0002, cluster: sid_crypt, trail: all, label: 器物传记与中世物怪想象, rationale: 借物质文化与器物传记视角阅读《付丧神记》，看被抛弃的日常器具如何承载寿命、劳作与宗教救度想象。}

  - id: case_gb_scotland_kelpie_lore
    title: 苏格兰高地｜湖沼变形水马“凯尔皮”警戒传说
    aliases: [Kelpie, Each-uisge, Water horse, 凯尔皮, 苏格兰水马]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 57.4778, lng: -4.2247, precision: culture_region, location_name: 英国苏格兰 · 高地河湖区（因弗内斯区域参考）, culture_region: 欧洲 · 英国苏格兰}
    location_note: 坐标取苏格兰高地首府因弗内斯一带作高地河湖文化区参考；凯尔皮与盖尔语水马传说广泛分布于苏格兰河流、瀑布与淡水湖泊，并非指代近代尼斯湖水怪目击潮。
    paragraphs:
      - 不同于二十世纪三十年代后围绕尼斯湖公路与新闻照片兴起的近代“水怪目击潮”（case_gb_loch_ness_columba_water_beast），“凯尔皮”（苏格兰语 Kelpie，在盖尔语口述中常与更凶猛的“水马”Each-uisge 并称）是苏格兰低地与高地河川湖泊间传承数世纪的变形水灵。传说它常现身为毛色漆黑或雪白的俊美骏马静立渡口或深潭岸边，一旦迷路旅人或顽童骑上马背，皮肤便会牢牢黏附在马身之上，随其跃入激流深渊遭吞噬。
      - 凯尔皮亦常幻化为英俊青年或披发水鬼诱惑涉水者，识别破绽在于其发丝间缠着水草泥沙或仍隐现马蹄。苏格兰民俗研究与盖尔语口述档案（如爱丁堡大学“苏格兰研究”学者罗纳德·布莱克对 Each-uisge 传统的考辨）收录了多类变体：也有讲述称若用刻有十字架或铁制的缰绳趁机套住凯尔皮头部，便可将其驯服用来搬运筑桥或建堡巨石；而在日常社区生活里，长辈更直接借“水马潜伏在深潭与急流”告诫孩童远离危险水域。
      - 从 1674 年苏格兰地名文献的早期记载、罗伯特·彭斯 1786 年诗作《致魔鬼》的引用，到当代福尔柯克运河畔高三十米的钢雕《凯尔皮》（The Kelpies），这一形象始终属于充满地域警戒意味的民间水灵叙事，而不对应任何待确认的现生水生动物物种。
    sources:
      - {citation: 'Encyclopædia Britannica, Kelpie (mythological creature).', type: institutional_account, url: 'https://www.britannica.com/topic/Kelpie-mythological-creature', locator: 苏格兰水马凯尔皮形态特征、溺水警戒功能与彭斯诗作记载}
      - {citation: 'Raghnall MacilleDhuibh (Ronald Black), An t-Each-Uisge, Scottish Studies 37, 2014.', type: academic_article, url: 'https://doi.org/10.2218/ss.v37i0.1801', doi: '10.2218/ss.v37i0.1801', locator: 苏格兰盖尔语口述档案中的水马（Each-uisge）与凯尔皮叙事研究}
      - {citation: 'Historic Environment Scotland, Supernatural Creatures in Scottish Folklore, 2018.', type: institutional_account, url: 'https://blog.historicenvironment.scot/2018/10/supernatural-creatures-in-scottish-folklore/', locator: 凯尔皮与现代运河雕塑遗产背景介绍}
    compare: [case_gb_loch_ness_columba_water_beast, case_ua_dnipro_rusalka_lore]
    motifs: [index_berezkin_h51, index_berezkin_f27]
    bridge: {entry: LIF-EMERG-0104, cluster: sid_crypt, trail: all, label: 危险水域警戒与水马变形, rationale: 区分苏格兰传统水域警戒故事“凯尔皮”与现代水怪目击潮，并思考激流深潭传说背后的涉水安全语境。}

  - id: case_nz_waikato_taniwha_lore
    title: 新西兰怀卡托河｜毛利口述“塔尼瓦”水守护兽传统
    aliases: [Taniwha, Waikato taniwha rau, 塔尼瓦, 怀卡托河水兽]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: -37.7870, lng: 175.2793, precision: culture_region, location_name: 新西兰 · 怀卡托河流域（汉密尔顿一带区域参考）, culture_region: 大洋洲 · 新西兰怀卡托}
    location_note: 坐标取新西兰北岛怀卡托河中游汉密尔顿一带作流域文化参考；毛利口述传统中的塔尼瓦分布在长达四百余公里河道的多处深潭与弯道。
    paragraphs:
      - 在新西兰毛利人（Māori）的口述传统里，“塔尼瓦”（Taniwha）是栖息于深水潭（rua taniwha）、急流旋涡、峡湾或海洞的强大水中存在，形态各异，时而呈巨型爬行动物、大鳗鱼、鲸鲨或漂流巨木状。贯穿北岛最长河流怀卡托河的著名毛利谚语“Waikato taniwha rau, he piko he taniwha”（“怀卡托有百尊塔尼瓦，每一个河弯就有一尊塔尼瓦”）同时具有双关意涵：既标记河道处处暗藏急流险滩，也比喻沿河各个部落（hapū）每一处河湾皆有大酋长（rangatira）坐镇护卫。
      - 新西兰官方百科《Te Ara》梳理指出，毛利传统里的塔尼瓦不可简单套用欧洲“湖怪”或“邪恶怪兽”二分法。虽有古英雄斩杀食人恶兽的传说，但对大多数怀卡托部族而言，诸如卡鲁塔希（Karutahi）等有名有姓的塔尼瓦更接近与祖先谱系相连的保护神灵（kaitiaki），划独木舟或涉水经过其栖身深潭时必须遵循禁忌并念诵敬祷词（karakia），以示对河流力量的敬畏。
      - 直到当代新西兰公共议程中，怀卡托流域的塔尼瓦口述传统仍在河流治理、公路改线与跨河桥梁选址磋商中发挥实际话语作用，用来标记易发洪涝与河岸坍塌的敏感水文弯段，而并不构成生物分类学意义上的未知水栖动物主张。
    sources:
      - {citation: 'Basil Keane, Taniwha, Te Ara – The Encyclopedia of New Zealand.', type: institutional_account, url: 'https://teara.govt.nz/en/taniwha', locator: 毛利口述中塔尼瓦的形态谱系、护卫神灵（kaitiaki）职能与现代水域协商}
      - {citation: 'Te Ara – The Encyclopedia of New Zealand, Waikato tribes – Waikato landmarks.', type: institutional_account, url: 'https://teara.govt.nz/en/waikato-tribes/page-2', locator: 怀卡托河谚语“百尊塔尼瓦”与河湾酋长谱系地理}
    compare: [case_gb_scotland_kelpie_lore, case_ca_okanagan_lake_ogopogo]
    motifs: [index_ocm_776]
    bridge: {entry: GEO-LAND-0021, cluster: sid_crypt, trail: all, label: 弯道深潭地貌与河灵守护, rationale: 将怀卡托河“每弯一尊塔尼瓦”的毛利口述与弯曲河道深潭水文地貌并读，体会河流险段如何沉淀为守护谱系。}

  - id: case_br_amazon_mapinguari_lore
    title: 巴西亚马孙｜独眼巨兽马平瓜里传说与更新世地懒假说
    aliases: [Mapinguari, Mylodontidae, 马平瓜里, 巨型地懒假说]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: -8.7619, lng: -63.9039, precision: culture_region, location_name: 巴西 · 亚马孙西南部朗多尼亚一带（区域参考）, culture_region: 南美洲 · 巴西亚马孙}
    location_note: 坐标取巴西西南部朗多尼亚州韦柳港一带（奥伦访谈与范德维尔登田野讨论所在的亚马孙西南部地区）作文化地理参考，并非实体动物发现坐标。
    paragraphs:
      - 在巴西亚马孙西南部朗多尼亚、阿克里及亚马孙州一带的原住民与割胶工（seringueiros）口述传统中，“马平瓜里”（Mapinguari）是一头身材高大、浑身披覆红褐色粗毛、散发出刺鼻臭味的林中巨怪。常见讲法描绘它额生独眼、腹部裂开巨口、双足朝后生长，厚实毛皮甚至刀枪不入，如同守林灵体库鲁皮拉（Curupira）一样专门惩罚过度捕猎或闯入深林禁地的猎人。
      - 1993 年与 2001 年，鸟类学家戴维·C·奥伦（David C. Oren）先后在巴西格尔迪博物馆刊物与《贫齿类》（Edentata）发表论文，提出颇具争议的猜测：认为割胶工与原住民讲述的刺鼻巨爪、可弹开子弹的厚甲皮肤（类似真皮小骨板 osteoderms）与足迹特征，或源自更新世磨齿兽科（Mylodontidae）巨型地懒的残存或文化记忆。人类学家费利佩·费雷拉·范德维尔登（2016）则沿亚马孙西南部田野追踪了这一争论，揭示本土神灵宇宙观、地方口述与外来“神秘动物学”探险叙述之间的明显错位。
      - 从古生物学与考古学现有实证来看，南美洲巨型地懒约在更新世末至全新世初（距今一万余年前）绝灭，迄今从未发现任何现生标本；不过 2023 年发表于《英国皇家学会学报 B》的巴西中部圣埃利纳岩棚研究确证，末次盛冰期人类曾与巨型地懒（Glossotherium）共存并打磨其骨质皮内成骨制作饰物。因此，“马平瓜里”究竟属于雨林禁忌精怪的跨文化拼合，抑或携带着极其久远的人兽共处生态回响，仍有赖古生态证据与民俗文本各自独立检验。
    sources:
      - {citation: 'David C. Oren, Does the Endangered Xenarthran Fauna of Amazonia Include Remnant Ground Sloths?, Edentata 4, 2001, 2–5.', type: academic_article, url: 'https://xenarthrans.org/files/papers/Edentata/Edentata_4/Edentata_4_2-5.pdf', locator: 亚马孙割胶工目击转述与磨齿兽科残存地懒假说论文}
      - {citation: 'Felipe Ferreira Vander Velden, Realidade, ciência e fantasia nas controvérsias sobre o Mapinguari no sudoeste amazônico, Boletim do Museu Paraense Emílio Goeldi: Ciências Humanas 11(1), 2016, 209–224.', type: academic_article, url: 'https://doi.org/10.1590/1981.81222016000100011', doi: '10.1590/1981.81222016000100011', locator: 亚马孙西南部马平瓜里人类学争论与本土叙事辨析}
      - {citation: 'Thaís Pansani et al., Evidence of artefacts made of giant sloth bones in central Brazil around the last glacial maximum, Proceedings of the Royal Society B 290, 2023.', type: academic_article, url: 'https://doi.org/10.1098/rspb.2023.1090', doi: '10.1098/rspb.2023.1090', locator: 巴西圣埃利纳遗址更新世晚期人类加工巨型地懒骨质皮内成骨饰物考古证据}
    compare: [case_br_sao_paulo_curupira, case_np_khumbu_yeti_lore]
    motifs: [index_ocm_776]
    bridge: {entry: GEO-LAND-0017, cluster: sid_crypt, trail: all, label: 古生物化石证据与生态记忆假说, rationale: 并读亚马孙“马平瓜里”口述、地懒假说与巴西更新世骨器考古研究，区分地质化石实证与跨世代生物残存猜想。}
