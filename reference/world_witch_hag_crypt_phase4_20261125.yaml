  - id: case_tr_karabasan_sleep_lore
    title: 土耳其安纳托利亚｜夜间“黑压者”卡拉巴桑睡眠体验传说
    aliases: [Karabasan, Karabasan basması, Bastırık, 卡拉巴桑, 黑压者]
    genre: folktale
    credibility_tier: B
    note_kind: story
    location: {lat: 39.9334, lng: 32.8597, precision: culture_region, location_name: 土耳其 · 安纳托利亚中部安卡拉（区域文化参考）, culture_region: 中东与西亚 · 土耳其安纳托利亚}
    location_note: 坐标取土耳其安纳托利亚中部作文化地理参考；“卡拉巴桑”（Karabasan）说法普遍流传于土耳其各地及突厥语相关民俗社群。
    paragraphs:
      - 在安纳托利亚与当代土耳其日常用语中，人们在半梦半醒间突然浑身僵硬、胸口似有巨石压迫的经历，普遍被称为“卡拉巴桑”（Karabasan），词面由“黑”（kara）与“压迫者”（basan）组合而成。当地民间口述常把它形象化为夜间悄然进屋、坐在睡者胸前扼住喉咙或散发低语脚步声的黑影与精灵（cin）。
      - 比较民俗学者阿赫迈特·塔杰特丁·哈拉奇与塞伊富拉·耶尔德勒姆（2024）梳理突厥语与高加索民俗词源发现，卡拉巴桑与阿尔巴斯提（Albastı）、诺盖人流传的“巴斯特勒克”（Bastırık）同属以动词 basmak（意为“按压、镇压”）命名的睡眠压迫灵体谱系；传统应对习惯包括在枕头下放置铁剪、面包、大蒜或写有祈福经文的护符袋（muska）。
      - 在临床与跨文化精神医学调查中，巴兰·贾拉勒等学者（2021）对土耳其大学生样本进行访谈，发现高达百分之八十八曾经历过睡眠瘫痪的受访者会使用“卡拉巴桑”命名此次体验，并将胸闷恐惧感与呼吸窒息忧虑和诵念《古兰经》经文等宗教安抚策略联系起来；研究再次提示需将当事人的文化解释模型与可测量的睡眠生理过程分开记录。
    sources:
      - {citation: 'Baland Jalal, H. Sevde Eskici, Ceren Acarturk & Devon E. Hinton, Beliefs about sleep paralysis in Turkey: Karabasan attack, Transcultural Psychiatry 58(3), 2021.', type: academic_article, url: 'https://doi.org/10.1177/1363461520909616', doi: '10.1177/1363461520909616', locator: 土耳其样本中卡拉巴桑命名比例、躯体压迫感及宗教应对方式调查}
      - {citation: 'Ahmet Tacetdin Hallaç & Seyfullah Yıldırım, "Basmak" Kökenine Dayanan Mitik Varlıklar ve Kafkaslardan Bir Uyku İblisi: "Bastırık", Folklor/Edebiyat 30(117), 2024, 65–84.', type: academic_article, url: 'https://doi.org/10.22559/folklor.2625', doi: '10.22559/folklor.2625', locator: 突厥与高加索语境中 basmak 词根睡眠压迫民俗谱系比较}
    compare: [case_egypt_jinn_sleep_paralysis, case_tr_anatolia_nazar_amulet]
