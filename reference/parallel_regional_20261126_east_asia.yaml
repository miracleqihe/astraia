    bridge: {entry: FOR-5-0011, cluster: sid_hag, trail: trail5, label: 雪夜身影与观察条件, rationale: 并读低照度、降雪和讲述中的饮酒信息，不将其指定为该经历的确定解释。}

  - id: case_kr_sinan_ghost_friend_1984
    title: 新安群岛｜与人一起吃告别饭的鬼
    aliases: [귀신을 친구로 사귄 사람, 암태도 귀신 친구]
    genre: folktale
    credibility_tier: B
    location: {lat: 34.839, lng: 126.09, precision: city, location_name: 韩国 · 全罗南道新安群岛岩泰岛, culture_region: 东亚 · 韩国}
    location_note: 岩泰岛区域参考；故事里的洞窟与巨石未单独定位。
    temporal: {year_start: 1984, year_end: 1984, era_label: 采录时间, uncertainty_note: 口述故事发生年代不详。}
    paragraphs:
      - 岛上一名男子有时会突然不见，回来后说曾被鬼背着渡海。后来，与他交好的那个存在表示要回故乡，请他备好食物、酒和糕，在山谷巨石旁作最后一顿聚餐。
      - 1984 年在岩泰岛采录的这个故事中，来客席间才说出自己的身份与离别缘由。它让鬼成为能同行、受人招待并郑重告别的朋友，而不是只会惊吓人的形象。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“与鬼结为朋友的人”，1984 年 6 月 9 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.1_20976', locator: 岩泰面道昌里口述全文}
    bridge: {entry: REL-5-0005, cluster: sid_hag, trail: trail2, label: 海岛鬼友与送别, rationale: 以共同饮食和告别场景阅读地方口述，区分资料记载与故事世界中的人物身份。}

  - id: case_jp_tono_obakobuchi_kappa_horse
    title: 远野｜被马拖上岸的河童
    aliases: [姥子淵の河童, 遠野物語第58話, Kappa horse Tono]
