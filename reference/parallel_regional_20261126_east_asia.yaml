    credibility_tier: B
    location: {lat: 39.3279, lng: 141.533, precision: city, location_name: 日本 · 岩手县远野市, culture_region: 东亚 · 日本}
    location_note: 远野市中心为区域参考；《远野物语》称地点为小乌濑川姥子渊，与其他河童淵景点不可混作一个精确点。
    temporal: {year_start: 1910, year_end: 1910, era_label: 文献出版时间, uncertainty_note: 传说发生时间不详。}
    paragraphs:
      - 孩子把马牵到小乌濑川边洗凉，转身玩耍时，河童想把马拖进水里，反而被马拉回屋舍。家里人掀开倒扣的马槽，看见下面伸出一只手，村民便聚拢商议如何处置它。
      - 大家最终让河童承诺不再戏弄村里的马，将它放走。柳田国男《远野物语》第 58 则记录这一地方故事；不同河童淵如今也与观光活动相连，但本条不把所有地点视为同一水域。
    sources:
      - {citation: '远野市，远野土渊山口集落介绍：“河童淵（姥子淵）”及《远野物语》第 58 则。', type: institutional_account, url: 'https://www.city.tono.iwate.jp/handlers/printcontent.cfm?ContentID=47710&EntryCode=6904&GroupID=48&ThisPageURL=https%3A%2F%2Fwww.city.tono.iwate.jp%2Findex.cfm%2F48%2C47710%2C303%2Chtml', locator: 姥子淵、河童与马的地方版本}
      - {citation: '远野市观光协会，〈远野物语の日に歩く――物語の舞台・山口集落〉。', type: institutional_account, url: 'https://tonojikan.jp/feature/tonomonogatari-day/', locator: 区分山口姥子淵与旅游地点}
    compare: [case_jp_tono_zashiki_warashi_1910]
    bridge: {entry: REL-5-0006, cluster: sid_myth, trail: trail2, label: 河童故事与地方展示, rationale: 把 1910 年文本与今天的地方解释并读，观察故事如何被联系到可游览的场所。}

