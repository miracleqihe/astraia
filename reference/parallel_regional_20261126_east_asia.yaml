    genre: folktale
    credibility_tier: B
    location: {lat: 33.23921, lng: 126.54486, precision: city, location_name: 韩国 · 济州岛西归浦独立岩, culture_region: 东亚 · 韩国济州}
    location_note: 西归浦独立岩海岸地标参考坐标；老妇人的经历属于地方传说。
    paragraphs:
      - 一位老人出海捕鱼，迟迟没有归来。妻子在岸边不断眺望，最终也化作海上的一根石柱；靠近水面的一块石头，则被故事说成遇难的丈夫。
      - 济州的同一石柱还有被将军用作威吓敌军的另一传说，因此有不同名字。旅游资料也将它解释为海浪侵蚀海岸岩体后留下的海蚀柱；这与等待归人的故事属于不同层次的解释。
    sources:
