  - id: case_mn_ub_courtyard_white_visitor
    title: 乌兰巴托｜院子里叫不停的狗
    aliases: [Denjiin Myanga ghost, 达希家的夜间访客]
    genre: urban_legend
    credibility_tier: B
    location: {lat: 47.92194, lng: 106.91528, precision: city, location_name: 蒙古 · 乌兰巴托, culture_region: 东亚 · 蒙古}
    location_note: 乌兰巴托市中心参考点；研究文章提到登吉因明嘎一带，未公开具体住宅地址。
    temporal: {year_start: 2006, year_end: 2006, era_label: 故事出版时间, uncertainty_note: 研究者引述的故事于 2006 年出版或再版，传言指向 1980 年代。}
    paragraphs:
      - 一家人搬进旧院落后，养来看门的狗夜里不断奔跑狂吠。男主人从窗里看出去，见一名白衣男子站在院中；他出声询问，来客便消失了。后来家人又听见一个人声，像是在寻找自己的车马和财物。
      - 研究者格雷戈里·德拉普拉斯分析过一则 2006 年出版的乌兰巴托故事：家人请宗教人士处理之后，狗和夜声都安静下来。文章讨论了这类叙事里的历史记忆与族群刻板印象；故事对来客身份的归因不构成对任何现实族群的判断。
    sources:
      - {citation: 'Grégory Delaplace, “Chinese Ghosts in Mongolia”, Inner Asia 12(1), 2010, pp. 127–141.', type: academic_article, url: 'https://www.academia.edu/592639/Chinese_Ghosts_in_Mongolia_2010_', doi: '10.1163/146481710792710282', locator: 第 131–132 页：2006 年故事集第 7 卷所引旧院落叙事；此处通过研究文章转述}
      - {citation: 'Grégory Delaplace, “Neighbours and Their Ruins”, in Frontier Encounters, Open Book Publishers, 2012.', type: academic_book, url: 'https://tile.loc.gov/storage-services/master/gdc/gdcebookspublic/20/19/46/78/08/2019467808/2019467808.pdf', locator: 第 211 页起的历史记忆研究；补充语境，非此具体故事出处}
      - {citation: 'Ulaanbaatar，城市地理参考。', type: geographic_reference, url: 'https://en.wikipedia.org/wiki/Ulaanbaatar', locator: 市中心参考坐标}
    bridge: {entry: HIS-6-0001, cluster: sid_hag, trail: trail5, label: 院落传闻与来源层次, rationale: 把故事集、研究者的转述和城市历史分别当作不同来源，留意故事中的族群刻板印象。}

  - id: case_mn_ub_neighbor_nightly_coins
    title: 乌兰巴托｜隔壁院子里的讨钱声
