    paragraphs:
      - 济州地方故事说，金宁蛇窟中有一条巨蛇，人们相信它会招来风雨，于是每年向它献祭少女。传说中一位新任判官带人前来，在巨蛇扑向少女时将其斩杀，救下了她。
      - 同一传说又讲，判官返途中被一道红光照到背部，此后患病去世。当地旅游资料将它作为洞窟传说介绍；熔岩洞穴的地质事实与故事中的献祭、巨蛇和因果需要分开。
    sources:
      - {citation: '济州旅游公社，〈金宁蛇窟〉。', type: institutional_account, url: 'https://m.visitjeju.net/kr/detail/view?contentsid=CNTS_000000000019979', locator: 洞窟介绍及判官退蛇传说}
