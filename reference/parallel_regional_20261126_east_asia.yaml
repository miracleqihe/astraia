records:
  - id: case_kr_hongseong_legend_garden_taxi_2012
    title: 洪城｜雨夜出租车上的白衣乘客
    aliases: [전설가든 귀신, 택시기사와 전설가든 귀신]
    genre: urban_legend
    credibility_tier: B
    location: {lat: 36.5994, lng: 126.6628, precision: city, location_name: 韩国 · 忠清南道洪城郡, culture_region: 东亚 · 韩国}
    location_note: 洪城郡城镇参考点，表示 2012 年采录地域；故事里提到的庭园与上下车地点未定位。
    temporal: {year_start: 2012, year_end: 2012, era_label: 采录时间, uncertainty_note: 故事经历的具体年份不详。}
    paragraphs:
      - 雨夜里，一位穿白衣的女子拦下出租车，到一座旧宅门前下车。她说进屋拿钱，司机等了许久不见人出来，便进门询问。屋里的人告诉他，女儿已去世多年，恰好今天是祭日，并替她付了车费。
      - 2012 年洪城的访谈中，讲述者说这是自己听来的“传说庭园”附近的故事；在场听众也加入补充。记录保存的是一次地方讲述，不能据此确认乘车经过或女子身份。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“出租车司机与传说庭园的鬼”，2012 年 2 月 6 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_18287', locator: 采录信息、共同讲述与全文}
      - {citation: '洪城郡地理参考。', type: geographic_reference, url: 'https://en.wikipedia.org/wiki/Hongseong_County', locator: 郡级参考坐标}
    compare: [case_kr_goyang_jayuro_hollow_eyes, case_jp_ishinomaki_taxi_winter_coat]
    bridge: {entry: HIS-6-0002, cluster: sid_liminal, trail: trail5, label: 雨夜乘客与口述现场, rationale: 对读访谈现场与转述链，区分乘客故事、听众补充和可独立核实的事实。}

  - id: case_kr_taebaek_sangdong_pass_taxi_2012
    title: 太白采录｜山口出租车与祭日归客
    aliases: [귀신을 태운 택시기사, 상동재 택시]
    genre: urban_legend
    credibility_tier: B
    location: {lat: 37.1641, lng: 128.9856, precision: city, location_name: 韩国 · 江原道太白市, culture_region: 东亚 · 韩国}
    location_note: 太白市中心为访谈地域参考；故事中的上东山口、目的地住宅和路线未准确定位。
    temporal: {year_start: 2012, year_end: 2012, era_label: 采录时间, uncertainty_note: 讲述者只说故事发生在十余年前，未核具体日期。}
    paragraphs:
      - 一位拎包的女子在上东山口拦下出租车，让司机送她去堤川。到家后她推门进去拿车费，却一直没有出来；司机向屋里的人询问，双方因此争执。
      - 家中长辈听过她的衣着后，说她是多年前在山口遇事故去世的儿媳，当晚恰逢祭日。2012 年在太白采录的这个版本里，司机留宿一夜才回家，后来大病一场；这些都是讲述内容，而非独立查证的事件。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“载鬼的出租车司机”，2012 年 6 月 2 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_17441', locator: 太白市采录信息及完整讲述}
      - {citation: '韩国气象厅太白观测点，地点参考。', type: geographic_reference, url: 'https://data.kma.go.kr/tmeta/stn/selectStnDetail.do?isSelectStn=Y&pgmNo=82&stdStnNo=216', locator: 太白市参考点，非叙事山口}
    compare: [case_kr_hongseong_legend_garden_taxi_2012, case_jp_ishinomaki_taxi_winter_coat]
    bridge: {entry: HIS-6-0002, cluster: sid_liminal, trail: trail5, label: 归客、祭日与讲述地点, rationale: 比较两则载客故事的路线与祭日细节，同时分清采录地和叙事中的地点。}

  - id: case_kr_ansan_daebu_dark_road_2011
    title: 大阜岛｜雨夜挡住道路的黑影
    aliases: [귀신 본 이야기, 영전경로당 귀신]
    genre: memorate
    credibility_tier: B
    location: {lat: 37.24, lng: 126.58, precision: city, location_name: 韩国 · 安山市大阜岛, culture_region: 东亚 · 韩国}
    location_note: 大阜岛区域参考点，采录于岛上长者活动场所，所述山路未定位。
    temporal: {year_start: 2011, year_end: 2011, era_label: 采录时间, uncertainty_note: 丈夫经历发生在采录前，年份不详。}
    paragraphs:
      - 一名妇人回忆，丈夫过去总说人比鬼可怕。某夜他喝酒后冒雨回家，在山下停下来点烟，路边却黑得几乎看不见；他挥拳驱赶黑影，一直走到村里的堂树附近才辨清道路。
      - 丈夫回家后改变了原先的说法，称途中像遇见了鬼。2011 年大阜岛访谈保留的是妻子对丈夫叙述的回忆，讲述者同时说明自己从未亲眼看见这类东西。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“见鬼的故事”，2011 年 1 月 18 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_14456', locator: 大阜岛访谈及丈夫夜行叙述}
    bridge: {entry: FOR-5-0011, cluster: sid_hag, trail: trail5, label: 雨夜转述与观察条件, rationale: 将夜路讲述与记忆、照明及转述条件并读，不据此认定所见影子的来源。}

  - id: case_kr_wonju_lost_thorn_path_2010
    title: 原州｜荆棘丛中走了一整夜
    aliases: [도깨비에 홀린 사람, 원주 도깨비 홀림]
    genre: memorate
    credibility_tier: B
    location: {lat: 37.3422, lng: 127.9202, precision: city, location_name: 韩国 · 江原道原州市, culture_region: 东亚 · 韩国}
    location_note: 原州市中心为指定面访谈地域参考，故事里的山谷和荆棘丛未定位。
    temporal: {year_start: 2010, year_end: 2010, era_label: 采录时间, uncertainty_note: 故事时间不详。}
    paragraphs:
      - 一个人在夜里跟着某个东西走了很久，穿过灌木和带刺的草丛，天亮时脸上留下许多伤痕。当地讲述者把这样的迷路经历称作受到了“多怪比”的迷惑；多怪比是朝鲜半岛传说中的精怪。
      - 2010 年在原州访谈中，讲述者又说人们常在喝酒以后讲起这类遭遇。采录保存了一种地方解释，并没有足够信息判定那一夜的路线或引路事物。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“受多怪比迷惑的人”，2010 年 12 月 18 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_12625', locator: 原州采录、夜行与荆棘叙述}
    bridge: {entry: FOR-5-0011, cluster: sid_hag, trail: trail5, label: 迷路故事与夜间记忆, rationale: 将讲述者提及的饮酒、黑暗与记忆边界并读，不将一般因素当作该次事件的确定原因。}

  - id: case_kr_geumsan_irrigation_goblin_2009
    title: 锦山｜夜灌后挂在门上的蛇与青蛙
    aliases: [뱀과 개구리를 달아 놓고 간 도깨비, 금산 농수로 도깨비]
    genre: folktale
    credibility_tier: B
    location: {lat: 36.1081, lng: 127.4882, precision: city, location_name: 韩国 · 忠清南道锦山郡, culture_region: 东亚 · 韩国}
    location_note: 锦山郡城镇参考点，采录地点为富利面，道路与住家未定位。
    temporal: {year_start: 2009, year_end: 2009, era_label: 采录时间, uncertainty_note: 故事发生年代不详。}
    paragraphs:
      - 天旱时，农人忙到夜里才给田里引够水。回家路上，一个被称作多怪比的精怪跟着他，不停要把肉塞给他；他害怕极了，跑回屋里闩上门。
      - 第二天早上，门上挂着蛇和青蛙。2009 年锦山的讲述者说这是长辈讲过的事，故事把灌溉、夜路和难以辨认的食物连在一起。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“留下蛇和青蛙的多怪比”，2009 年 2 月 16 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_26350', locator: 富利面采录与完整口述}
    bridge: {entry: REL-5-0005, cluster: sid_hag, trail: trail2, label: 夜灌故事与长辈传述, rationale: 对读一次讲述中的劳作场景与长辈转述，关注多怪比形象如何嵌入地方生活。}

  - id: case_kr_gwangju_potlid_gas_station_2012
    title: 京畿广州｜锅盖和夜里的响声
    aliases: [솥뚜껑을 솥 안에 넣은 도깨비, 광주 도깨비 장난]
    genre: memorate
    credibility_tier: B
    location: {lat: 37.4292, lng: 127.2550, precision: city, location_name: 韩国 · 京畿道广州市, culture_region: 东亚 · 韩国}
    location_note: 京畿道广州市参考点，不是全罗南道的光州；采录地超越邑的加油站与宅院未定位。
    temporal: {year_start: 2012, year_end: 2012, era_label: 采录时间, uncertainty_note: 被讲述的事件未标具体年份。}
    paragraphs:
      - 夜里厨房传来碰撞声，开灯却看不见人。一次人们发现锅盖卡进铁锅里拔不出来，过一会儿再看，锅盖又已被取出；在场的几位讲述者把这类动静说作民间精怪多怪比的恶作剧。
      - 这段 2012 年京畿广州市的集体访谈还留下了不同意见：有人认为人们喝酒后会看错，另一些人则继续说起夜间的声音。记录展示的是现场如何共同讲述与争论。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“把锅盖塞进锅里的多怪比”，2012 年 1 月 11 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_20172', locator: 共同讨论、厨房声音与锅盖}
    bridge: {entry: HIS-6-0002, cluster: sid_hag, trail: trail5, label: 锅盖异响与集体叙述, rationale: 对照访谈中的不同声音，观察听众补充与怀疑怎样改变共同讲述。}

  - id: case_kr_jangheung_following_lights_2013
    title: 长兴｜村口追上来的几盏光
    aliases: [도깨비불, 장흥 운주마을 도깨비불]
    genre: memorate
    credibility_tier: B
    location: {lat: 34.681, lng: 126.907, precision: city, location_name: 韩国 · 全罗南道长兴郡, culture_region: 东亚 · 韩国}
    location_note: 长兴郡城镇参考点；采录在龙山面云舟村，光点与夜路的具体位置未测定。
    temporal: {year_start: 2013, year_end: 2013, era_label: 采录时间, uncertainty_note: 讲述所指夜晚年份不详。}
    paragraphs:
      - 一位村民说，自己夜里饮酒归家，走到村口时看见一点光；光似乎分成几处，沿着路移动并跟着他。他害怕得加快脚步，仍觉得那几盏光在靠近。
      - 2013 年的长兴村落访谈中，旁边的听众把它称为“多怪比火”，即与民间精怪相关的火光。对照记录可看到本人叙述与听众命名的差别；光的来源并未获得现场检验。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“多怪比火”，2013 年 1 月 31 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_22804', locator: 云舟村讲述与听众回应}
    bridge: {entry: FOR-5-0011, cluster: sid_hag, trail: trail5, label: 村口光点与观察记忆, rationale: 对读夜间观察和后来命名，保留光的真实来源未知这一界限。}

  - id: case_kr_namhae_coastal_road_light_2011
    title: 南海郡｜修路时绕行海边遇见的火
    aliases: [새 길을 내는 바닷가 길에서 귀신불을 만난 이야기, 남해 바닷길 귀신불]
    genre: memorate
    credibility_tier: B
    location: {lat: 34.8374, lng: 127.8926, precision: city, location_name: 韩国 · 庆尚南道南海郡, culture_region: 东亚 · 韩国}
    location_note: 南海邑为郡级参考点；采录地为南面加川村，故事中海岸旧路并未确定。
    temporal: {year_start: 2011, year_end: 2011, era_label: 采录时间, uncertainty_note: 夜行故事的具体年代不详。}
    paragraphs:
      - 海边开新路时，山坡尚在施工，人们只得绕行旧海岸路。当地讲述里，一名男子夜行经过这段被认为不安宁的路，遇见被称作鬼火的东西，于是划亮火柴将它驱走。
      - 2011 年在南海郡加川村受访的讲述者明确说，这故事来自长辈，自己并未见到。道路修建、口述故事与光的成因，需要分别寻找证据。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“修建新路时在海边遇见鬼火”，2011 年 1 月 25 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_13458', locator: 加川村采录与故事提要}
      - {citation: 'Namhae County，南海郡地理参考。', type: geographic_reference, url: 'https://en.wikipedia.org/wiki/Namhae_County', locator: 南海郡行政中心坐标}
    bridge: {entry: ARC-4-0009, cluster: sid_liminal, trail: trail5, label: 旧海路与地方记忆, rationale: 对读海岸道路变迁和人们赋予路线的故事，不以访谈代替道路工程记录。}

  - id: case_kr_gwangmyeong_broom_dokkaebi_2013
    title: 光明｜白天是一把扫帚
    aliases: [피 묻은 빗자루에서 변하는 도깨비, 광명 빗자루 도깨비]
    genre: folktale
    credibility_tier: B
    location: {lat: 37.4786, lng: 126.8646, precision: city, location_name: 韩国 · 京畿道光明市, culture_region: 东亚 · 韩国}
    location_note: 光明市中心为采录地域参考，故事并无确定住宅或具体地点。
    temporal: {year_start: 2013, year_end: 2013, era_label: 采录时间, uncertainty_note: 故事流传年代不详。}
    paragraphs:
      - 受访者回忆，长辈说过沾了血的扫帚到了夜里会变成精怪多怪比或鬼，白天又还原为普通扫帚。这样的传闻让人们从熟悉的日用物品里想象夜间出行的怪物。
      - 这是一段 2013 年在光明市采集的简短口述，没有人物相遇或具体住址。它可与日本器物成精故事并读，但相似形象不自动意味着两个地方存在传播关系。
      - 陶思炎《中国镇物》还讨论了朝鲜岁时传闻中的夜光鬼：人们以筛子应对偷鞋的鬼。这是另一则与家用器具相关的材料，书中没有记载本条光明市扫帚口述，二者只作主题比较。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“由沾血扫帚变成的多怪比”，2013 年 2 月 14 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_23598', locator: 光明市口述原文}
      - {citation: '陶思炎：《中国镇物》，台北：东大图书，1998。', type: reference_book, locator: 印页 146，引朝鲜《京都杂志》“元日”与夜光鬼筛子；为主题对读，不是光明扫帚故事的来源}
    compare: [case_jp_kyoto_tsukumogami_lore]
    bridge: {entry: REL-5-0005, cluster: sid_hag, trail: all, label: 扫帚变形与口述传统, rationale: 对读日常器物形象与口述环境，避免把题材相似当作传播证据。}

  - id: case_kr_seocheon_cotton_hill_2010
    title: 舒川｜山口散落一地的棉花
    aliases: [재수없는 땅고개 귀신, 서천 땅고개 도깨비]
    genre: memorate
    credibility_tier: B
    location: {lat: 36.0806, lng: 126.6919, precision: city, location_name: 韩国 · 忠清南道舒川郡, culture_region: 东亚 · 韩国}
    location_note: 舒川郡中心为韩山面采录区域参考，故事所说山口未精确定位。
    temporal: {year_start: 2010, year_end: 2010, era_label: 采录时间, uncertainty_note: 女儿出嫁与夜间行路的日期不详。}
    paragraphs:
      - 一位父亲到群山买棉花，准备让女儿出嫁时使用。夜里回来经过山口，棉包一再被扔落，他捡起来背上，又掉下去；天亮后，田间散落着被撕开的棉花。
      - 2010 年的舒川访谈里，有听众说这不是遥远的古事，而是他们年轻时听闻或见过的事；讲述者将棉包的反复掉落说成与多怪比角力。其确切经过并无独立记录。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“令人不安的山口鬼”，2010 年 1 月 26 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_25882', locator: 韩山面讲述及听众补充}
    bridge: {entry: HIS-6-0002, cluster: sid_hag, trail: trail5, label: 夜路棉花与听众记忆, rationale: 对照讲述者和听众的不同表述，审视地方经历如何进入共同记忆。}

  - id: case_kr_haman_mountain_ritual_2013
    title: 咸安｜仪式中始终看不清的脸
    aliases: [굿판 도중 나타난 산신령, 함안 산신령]
    genre: memorate
    credibility_tier: B
    location: {lat: 35.2725, lng: 128.4066, precision: city, location_name: 韩国 · 庆尚南道咸安郡, culture_region: 东亚 · 韩国}
    location_note: 咸安郡行政区参考点；采录在中村村会馆，故事中夜间仪式的具体地点未知。
    temporal: {year_start: 2013, year_end: 2013, era_label: 采录时间, uncertainty_note: 仪式发生年代未注明。}
    paragraphs:
      - 一位讲述者回忆自己夜里跟着旁人去看巫俗仪式，仪式进行时出现了他认为是山神的身影。他试着从不同角度看清那人的面孔，甚至俯到地上，最后仍没有看清。
      - 2013 年在咸安的采访中，他还用动作示范当时的姿势。资料记录了个人经验及仪式后的解释，并不能独立证实神灵现身。
    sources:
      - {citation: '韩国学中央研究院，《韩国口碑文学大系》：“仪式中出现的山神”，2013 年 1 月 23 日采录。', type: oral_history_archive, url: 'https://kdp.aks.ac.kr/inde/gubi?id=POKS.GUBI.GUBI.2_21256', locator: 中村采录提要及演示情形}
