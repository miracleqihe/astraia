  - id: case_kr_yeongjong_snow_road_1982
    title: 永宗岛｜雪路上不答话的白衣人
    aliases: [도깨비 이야기 2, 영종도 냄새피는 도깨비]
    genre: memorate
    credibility_tier: B
    location: {lat: 37.49, lng: 126.53, precision: city, location_name: 韩国 · 仁川永宗岛, culture_region: 东亚 · 韩国}
    location_note: 永宗岛区域参考，1982 年采录于云北里；旧时夜路未测定。
