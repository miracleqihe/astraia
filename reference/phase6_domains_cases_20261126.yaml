  - id: case_cn_wupenji_talking_basin_opera
    title: 开封与徽京戏台｜《乌盆记》冤魂寄声陶盆、门神阻挡与包公阴审断狱
    aliases:
      - 乌盆记
      - 奇冤报
      - 玎玎珰珰盆儿鬼
      - 张别古携盆喊冤
      - The Black Basin Opera
    genre: folktale
