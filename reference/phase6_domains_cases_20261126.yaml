  - id: case_cn_mudanting_soul_return_opera
    title: 临川与南安｜汤显祖《牡丹亭》惊梦游园、冥司判婚与还魂复生
    aliases:
      - 牡丹亭
      - 牡丹亭还魂记
      - 惊梦与冥判
      - 杜丽娘还魂
