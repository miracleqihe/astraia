  - id: case_cn_shidian_yanluo_mengpo_bridge
    title: 敦煌与民间｜《佛说十王经》至《玉历宝钞》十殿阎罗与奈何桥孟婆
    aliases:
      - 十殿阎罗
      - 佛说十王经
      - 玉历宝钞
      - 奈何桥与孟婆汤
      - Ten Kings of Hell
