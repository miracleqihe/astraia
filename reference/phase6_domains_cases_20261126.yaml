  - id: case_cn_guizhou_dixi_nuo_masks
    title: 贵州安顺｜屯堡地戏木雕脸子开光与军傩驱邪祭演体系
    aliases:
      - 安顺地戏
      - 屯堡地戏
      - 地戏脸子
      - 军傩祭演
      - Anshun Dixi
    genre: folktale
