  - id: case_cn_dou_e_yuan_ghost_redress
    title: 元代大都与楚州｜关汉卿《窦娥冤》六月飞雪、鬼魂诉冤与东海孝妇公案母题
    aliases:
      - 窦娥冤
      - 感天动地窦娥冤
      - 六月飞雪
      - 东海孝妇公案
      - The Injustice to Dou E
    genre: folktale
    credibility_tier: A
    note_kind: story
    location:
