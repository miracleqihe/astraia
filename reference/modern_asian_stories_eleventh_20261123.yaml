themes:
- id: corpus_asian_waters_trees_night_paths_2014_2024
  title: 洞窟、河流与榕树｜故事如何给地方命名
  genre: academic_model
  peers:
  - corpus_asia_night_places_oral_accounts_2012_2025
  - corpus_nichibun_tohoku_kappa
  paragraphs:
  - 一处洞窟里的水池、一座还没有名字的桥、一棵夜里不宜照亮的榕树：地方被记住时，常会连同一个故事一起传下来。
  - 这里并列家庭转述、朋友间讲述和网上重述的不同记录。洞窟的故事来自祖母，桥的故事来自家中帮工；榕树的禁忌则由朋友转告。
  - 日本馆藏卡还留下河边禁忌、祭礼和故事的短摘要。它们和东南亚记录被放在一起，便于观察人如何描述水边与夜路；相似并不证明这些故事之间有传播关系。
  sources:
  - &id001
    citation: “A Nat’s Malevolent Dream”, USC Digital Folklore Archives, 19 March 2024, posted 13 May 2024。
    type: oral_history
    url: https://folklore.usc.edu/a-nats-malevolent-dream/
    locator: 受访者转述祖母讲述的彬乌伦洞窟传说
  - &id002
    citation: “Nat Sain Legend”, USC Digital Folklore Archives, 17 March 2024, posted 13 May 2024。
    type: oral_history
    url: https://folklore.usc.edu/nat-sain-legend/
    locator: 受访者转述家中帮工讲过的桥梁传说
  - &id003
    citation: “The Hantus in the Banyan Trees”, USC Digital Folklore Archives, 25 April 2018。
    type: oral_history
    url: https://folklore.usc.edu/the-hantus-in-the-banyan-trees/
    locator: 新加坡受访者重述朋友讲的榕树禁忌
records:
- id: case_mm_pyin_oo_lwin_nat_treasure_pool_2024
  title: 彬乌伦｜梦里的洞窟水池
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 22.03501
    lng: 96.45683
    precision: city
    location_name: 缅甸彬乌伦 · 城市参考点
    culture_region: 东南亚 · 缅甸
  location_note: 地图标示彬乌伦市镇；故事没有指出具体洞窟或水池。
  paragraphs:
  - 一家人去彬乌伦旅行，白天参观了一座洞窟佛塔。当晚，儿子梦见自己回到洞中，水池底下藏着许多财宝。
  - 故事说，第二天他真的去了洞窟寻找财宝。几天后，人们在水池中发现他的遗体，身上缠着锁链。祖母把这解释为神灵想找人替自己留在原地。
  - 2024 年，一位来自仰光的受访者转述祖母讲给他的这个故事。他认为长辈也许想借它提醒孩子：在寺塔中不要贪心或独自乱走。
  sources:
  - *id001
  - citation: GeoNames, Pyin Oo Lwin, Myanmar, place 1309937。
    type: gazetteer
    url: https://www.geonames.org/1309937/pyin-oo-lwin.html
    locator: 城市参考点 22.03501, 96.45683
  map_label: 彬乌伦
- id: case_mm_village_bridge_nat_sain_2024
  title: 缅甸口述｜桥下的神灵
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 21.9162
    lng: 95.956
    precision: culture_region
    location_name: 缅甸 · 传说背景范围参考
    culture_region: 东南亚 · 缅甸
  location_note: 讲述提到缅甸一座乡村桥梁，但没有村名；点位只表示国家范围。
  paragraphs:
  - 村里修桥，桥却一次次坍塌。传说中，人们相信只有找到出生日期和年龄符合某些条件的人，才能让工程顺利完成。
  - 一位常给在工地工作的丈夫送饭的女子被发现符合条件。故事说，她被裹进席子，埋在桥墩下，桥随后建成；过桥的人会为她祈祷。
  - 2024 年受访者回忆，这是家中帮工告诉她的村桥传说。她记得讲述者称那座桥真实存在，但档案没有给出村庄和桥名，无法定位或核实传说中的事件。
  sources:
  - *id002
  map_label: 缅甸
- id: case_cn_chongqing_grandfather_bear_granny_2019
  title: 重庆讲述｜熊嘎婆
  genre: folktale
  credibility_tier: B
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 29.563
    lng: 106.5516
    precision: city
    location_name: 中国重庆 · 讲述者家族参考
    culture_region: 中国 · 西南
  location_note: 重庆是讲述者祖父的家乡；故事没有指定树林或房屋。
  paragraphs:
  - 两个孩子在树林里遇见像祖母一样的人，跟她回到家。夜深后，姐姐被咀嚼声吵醒，问她在吃什么，对方说是糖。
  - 月光照进来，姐姐才看见床上的血迹，发现妹妹已经遭遇不测。受访者记得故事到这里的惊吓，却没有在这次访谈中讲出后续。
  - 2019 年，一名学生转述祖父给他讲的睡前故事，说自己还曾讲给小学同学听。祖父来自重庆；这是一则家庭保存的讲述，并非可定位的新闻事件。
  sources:
  - citation: Yunqian Hsu, “Bear Granny”, USC Digital Folklore Archives, 13 March 2019, posted 13 May 2019。
    type: oral_history
    url: https://folklore.usc.edu/bear-granny/
    locator: 受访者重述来自重庆的祖父所讲故事
  map_label: 重庆
- id: case_tw_mountain_school_sitting_ghost_2014
  title: 台湾讲述｜山中宿舍的来客
  genre: memorate
  credibility_tier: B
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 23.7
    lng: 120.96
    precision: culture_region
    location_name: 中国台湾 · 口述背景范围参考
    culture_region: 东亚 · 台湾
  location_note: 受访者提到台湾山中学校，没有给出校名或城镇；点位只表示台湾范围。
  paragraphs:
  - 一位教师到山里的学校任教并住在宿舍。陌生的房间让她害怕；睡着之后，她醒来时觉得身体被压住，动弹不得。
  - 适应黑暗后，她觉得床脚站着一个穿古代军服的男子。对方安静地望着她，她将其理解为可能保护自己的过客，便又睡了过去。
  - 这段回忆于 2014 年被记录。采集者把类似体验与“鬼压床”和睡眠瘫痪联系起来；仅凭转述无法判断这一次体验的原因。
  sources:
  - citation: Anita Chen, “The Sitting Ghost”, USC Digital Folklore Archives, 14 March 2014, posted 16 May 2014。
    type: oral_history
    url: https://folklore.usc.edu/the-sitting-ghost/
    locator: 受访者回忆在台湾山中学校住宿时的经历
  peers:
  - mech_sleep_paralysis
  map_label: 台湾
- id: case_tw_school_third_floor_scream_2012
  title: 台湾校园｜三楼传来的声音
  genre: memorate
  credibility_tier: B
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 23.7
    lng: 120.96
    precision: culture_region
    location_name: 中国台湾 · 口述背景范围参考
    culture_region: 东亚 · 台湾
  location_note: 学校和村庄未具名；地图仅表示口述中的台湾范围。
  paragraphs:
  - 到台湾教英语的 R 回忆，孩子们提醒他们晚上不要靠近学校。有一天，他和同伴还是摸黑上了楼梯，听见楼上传来一声尖叫，便赶紧跑走。
  - 第二天，他们向村里的人问起。对方提到一位最近去世的女孩，还说已请人处理；R 表示，自己听见声音前并不知道这段说法。
  - 采集者后来发现，自己提问时曾把故事记成女孩自杀，但 R 的重述没有说明死因。档案因此也留下了记忆如何改变故事的例子。
  sources:
  - citation: Belal Wang, “Taiwan Ghost Experience”, USC Digital Folklore Archives, April 2012。
    type: oral_history
    url: https://folklore.usc.edu/taiwan-ghost-experience/
    locator: 受访者回忆夜访学校及次日听到的解释
  peers:
  - corpus_east_asia_school_oral_accounts_2011_2026
  map_label: 台湾
- id: case_sg_banyan_hantu_flashlight_2018
  title: 新加坡｜榕树上方不要照光
  genre: urban_legend
  credibility_tier: B
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 1.3521
    lng: 103.8198
    precision: city
    location_name: 新加坡 · 城市范围参考
    culture_region: 东南亚 · 新加坡
  location_note: 受访者说的是新加坡的榕树，并未指出具体树林。
  paragraphs:
  - 一位新加坡受访者讲起朋友告诉他的禁忌：夜里走进树林，看见垂着气根的榕树时，不要把手电筒照向树冠，也不要碰那些垂下来的根。
  - 在朋友的说法里，树上的 hantus 会因此跳出来；也有人声称见过树冠间的眼睛。受访者自己并不相信这个故事。
  - 2018 年的档案把这段交谈记录下来。它保存的是朋友之间对榕树的讲述，并未指定哪一棵树或哪座公园。
  sources:
  - *id003
  map_label: 新加坡
- id: case_kh_jungle_traveler_animals_online_2018
  title: 柬埔寨网传｜森林里的旅人
  genre: urban_legend
  credibility_tier: C
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 12.5657
    lng: 104.991
    precision: culture_region
    location_name: 柬埔寨 · 故事背景范围参考
    culture_region: 东南亚 · 柬埔寨
  location_note: 网络故事没有村庄或森林名称；点位只表示柬埔寨范围。
  paragraphs:
  - 一名旅人到村里，请人带他进入森林。向导提醒他，走在林中时不要和动物说话；旅人觉得好笑，后来还是试着同动物交谈。
  - 第二天，旅人失踪了。向导以为自己明白发生了什么，独自回到村庄；故事没有交代旅人之后的下落。
  - 2018 年的访谈中，一位柬埔寨裔受访者说自己是在 Reddit 读到这个故事，又觉得它与父亲曾说过的森林禁忌相似。故事本身不是父亲的直接口述。
  sources:
  - citation: “JUNGLES OF CAMBODIA”, USC Digital Folklore Archives, 24 April 2018, posted 6 May 2018。
    type: oral_history
    url: https://folklore.usc.edu/jungles-of-cambodia/
    locator: 受访者重述 Reddit 读到的森林故事，并与父亲讲过的话比较
  map_label: 柬埔寨
- id: case_mm_minbu_dragons_lake_2024
  title: 敏布｜龙与伴侣的冒泡水池
  genre: folktale
  credibility_tier: B
  theme: corpus_asian_waters_trees_night_paths_2014_2024
  location:
    lat: 20.180592
    lng: 94.875954
    precision: city
    location_name: 缅甸敏布 · 城市参考点
    culture_region: 东南亚 · 缅甸
  location_note: 点位仅表示敏布市镇范围；具体水池以原馆藏所述为准。
  paragraphs:
  - 旅行者在敏布附近看见几处不断冒泡的水池。当地流传的解释说，一条龙和伴侣死在这里，水池的动静与它们的情感有关。
  - 2024 年，一位受访者回忆中学时随家人游览这处被称作“龙之湖”的地方，也记得听到的故事。
  - 她猜想这可能是导游为游客讲的传说，仍觉得游览很有趣。档案保存的是她的旅游记忆和猜测，并没有确认传说的起源。
  sources:
  - citation: “Nga Ka Pwe Taung (Dragon’s Lake)”, USC Digital Folklore Archives, 17 March 2024, posted 13 May 2024。
    type: oral_history
    url: https://folklore.usc.edu/nga-ka-pwe-taung-dragons-lake/
    locator: 访谈中受访者回忆敏布游览和听到的龙之湖传说
  - citation: GeoNames, Minbu, Myanmar, place 1309289。
    type: gazetteer
    url: https://www.geonames.org/1309289/minbu.html
    locator: 敏布城市参考点
  map_label: 敏布
