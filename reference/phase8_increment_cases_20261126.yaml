  - 阿兹特克九重冥界
  - 米克特兰九重试炼
  - 阿兹特克亡者伴行犬
  - Mictlan Nine Realms
  genre: myth
  credibility_tier: A
  note_kind: story
  location:
    lat: 19.435
    lng: -99.1313
    precision: city
    location_name: 墨西哥城（特诺奇蒂特兰及纳瓦文献传统的城市级参照）
    culture_region: 北美洲 · 中美洲墨西哥谷地纳瓦—阿兹特克文化圈
  location_note: 墨西哥城坐标为特诺奇蒂特兰及纳瓦文献传统的城市级参照，冥界关卡属于叙事空间，不对应现实地点。
  temporal:
    year_start: 1325
    year_end: 1585
    era_label: 墨西哥谷地后古典期传统与 16 世纪文献编纂
    uncertainty_note: 《佛罗伦萨抄本》和《梵蒂冈 A 抄本》成书于殖民时期；文献记录不应直接等同于所有前殖民时期社群的统一信仰。
  paragraphs:
  - 十六世纪《佛罗伦萨抄本》记载，在墨西哥谷地的纳瓦人观念中，一些因疾病等原因去世的人会前往亡者之地米克特兰，那里有冥王米克特兰特库特利及其配偶。亲属准备随葬物，并按传统为逝者举行仪式，帮助他们踏上旅程。
  - 不同版本对冥途的安排并不完全相同。墨西哥国家人类学与历史研究所期刊的文献对照指出，《佛罗伦萨抄本》与《梵蒂冈 A 抄本》所列关卡及先后次序不同：前者所述旅途包含相撞的山、寒冷荒地、锋利之风与河流；后者把渡水位置列在较早处，也出现受箭袭击与食心之地。相关记述中，犬帮助亡者渡水；四年旅程与悼念亦见于这些传统的研究。
  - 墨西哥城的地图点代表特诺奇蒂特兰与相关文献传统，而不是冥界所在的现实地点。将伴行犬与其他文化的渡冥叙事并读，有助于比较死亡与哀悼的表达，但不能由此断定各传统之间存在传播关系。
  sources:
  - citation: Florentine Codex, Book 3, Appendix, folio 23v, Digital Florentine Codex, Getty Research Institute.
    type: primary_text
    url: https://florentinecodex.getty.edu/book/3/folio/23v?nhTexts=&spTexts=
    locator: 第三卷附录第一章，亡者去处与葬仪记述；原文及译文可并读。
  - citation: 'Mónica Luna López, El camino al Mictlán: ¿ruta al tormento o al origen?, Vita Brevis 6(11), 2017.'
    type: peer_reviewed
    url: https://revistas.inah.gob.mx/index.php/vitabrevis/article/download/11698/12466/
    locator: pp. 163–165 表 1 对照两部抄本中的路径；pp. 169–170 讨论四年旅程。
