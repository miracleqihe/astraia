- id: case_uk_coventry_infrasound_189hz_lab
  title: 英国考文垂｜次声驻波的个案推测与后续检验
  aliases:
  - 考文垂次声驻波个案
  - 机器中的幽灵 1998
  - Vic Tandy 次声假说
  - Coventry Infrasound Case
  genre: historical_archive
  credibility_tier: A
  is_fictional_quarantine: false
  note_kind: history
  location:
    lat: 52.4081
    lng: -1.5106
    precision: city
    location_name: 英国考文垂（论文作者所属机构所在城市参照；原车间精确地点未核实）
    culture_region: 欧洲 · 英国现代声学与异常体验研究
  location_note: 考文垂市中心为作者所属机构的城市级参照；原文没有提供可核验的车间街址，坐标不标示实验室精确位置。
  temporal:
    year_start: 1998
    year_end: 2009
    era_label: 1998 年个案论文与 2009 年后续研究
    uncertainty_note: 1998 年论文回述此前的工作室经历，未在所引文章中给出足以确定事件发生年份的日期；2009 年为后续研究的期刊刊期。
  paragraphs:
  - 工程师 Vic Tandy 在 1998 年与 Tony Lawrence 合著论文，回忆自己曾在医疗设备公司实验室工作时感到不安，并在余光中看见模糊人影。第二天，他将击剑剑条夹在台钳上加工时，注意到剑条振动；移动剑条后，振动在房间不同位置发生变化。他与同事关闭新安装的排风扇后，所观察到的振动消失。
  - 作者根据约 30 英尺的房间长度和声速计算出可能的驻波频率约为 18.98 Hz，并提醒这一数字只是粗略估计；论文明确说当时没有仪器测量次声声压。作者据此提出低频振动可能与异常视觉体验有关，这是一项基于个案的假设，并未直接测定视觉改变的成因。
  - 2009 年 French 等人的“Haunt”项目让 79 名参与者在受控空间中接受次声、复杂电磁场、两者同时或均不暴露的条件，并事先告知可能出现异常感受。研究发现报告的感受数量与实验条件无关，而与颞叶体验量表得分有关。两项研究并读，能帮助区分可观察到的振动、推算出的频率，以及尚待验证的主观体验解释。
  sources:
  - citation: Vic Tandy and Tony R. Lawrence, The Ghost in the Machine, Journal of the Society for Psychical Research 62(851), 1998.
    type: peer_reviewed
    url: https://capitanache.com/assets/pdf/Tandy-The-Ghost-in-Machine.pdf
    locator: 个案叙述、由房长估算 18.98 Hz 的计算与未测声压的说明；数字不应标作实测值。
  - citation: Christopher C. French, Usman Haque, Rosie Bunton-Stasyshyn and Rob Davis, The 'Haunt' project, Cortex 45(5), 2009, pp. 619–629, DOI 10.1016/j.cortex.2007.10.011.
    type: peer_reviewed
    url: https://pubmed.ncbi.nlm.nih.gov/18635163/
    locator: 79 名参与者、暴露条件与颞叶体验量表结果。
