- id: case_cn_liangshan_yi_xiaobu_rite
  title: 四川凉山｜彝族毕摩的“晓补”春季反咒仪式
  aliases:
  - 凉山彝族晓补
  - 毕摩春季反咒
  - 晓补仪式
  genre: folktale
  credibility_tier: A
  is_fictional_quarantine: false
  note_kind: report
  location:
    lat: 27.8816
    lng: 102.2673
    precision: culture_region
    location_name: 中国四川凉山彝族自治州（以西昌作州域参照）
    culture_region: 中国西南·凉山彝族毕摩信仰
  location_note: 地图点为凉山州府西昌的区域参考；所引田野材料涉及美姑等地，不能把这个点当作仪式发生的村落。
  temporal:
    year_start: 1989
    year_end: 2010
    era_label: 1989—2010 年间的研究与公开记录
    uncertainty_note: 时间为已列研究发表或公开时间，不表示仪式在这段时间才出现或此后停止。
  paragraphs:
  - 在凉山义诺彝区的田野记录中，“晓补”是由毕摩主持的春季反咒仪式。研究者巴莫曲布嫫记述，一些家庭在春天准备草扎的鬼偶和树枝，邀请毕摩诵念、祭请神灵，最后将仪式物送出家门，表达驱除不祥、祈求家人平安的愿望。
  - 这类仪式既有按季节举行的形式，也可能因具体处境临时举行。仪式所涉及的鬼灵和反咒是当地信仰的叙述方式；把它与口传经文和家庭仪式作比较，并不证明其有超自然效力，也不能概括为已经证实的纠纷调解制度。
  sources:
  - citation: 巴莫曲布嫫：《彝族鬼灵信仰田野调查手记》，中国非物质文化遗产网，2009。
    type: field_report
    url: https://www.ihchina.cn/Article/Index/detail?id=8251
    locator: “凉山彝族的咒仪”与毕摩经书分类；晓补列为春季反咒。
  - citation: 巴莫曲布嫫：《凉山义诺彝族的季节仪式及其节日化之走向》，彝学研究网，2010。
    type: field_report
    url: https://www.yixueyanjiu.com/details.jsp?class=3&id=10647
    locator: “春季反咒：晓补”及注 5、7；原文记具体调查地、日期和仪式步骤。
  - citation: 巴莫阿依：《凉山彝族的“晓补”反咒仪式》，《世界宗教研究》1989 年第 3 期。
    type: peer_reviewed
    locator: 书目信息转据巴莫曲布嫫上文注 5；本次未独立取得原刊全文。
