  - Huangshen Yuezhang Seal
  genre: historical_archive
  credibility_tier: A
  note_kind: history
  location:
    lat: 34.6197
    lng: 112.454
    precision: culture_region
    location_name: 中国河南洛阳（汉晋历史背景的城市参照）
    culture_region: 中国汉晋道教印信与辟邪文化
  location_note: 洛阳坐标用于表示汉晋历史背景；图版所示印章的具体出土地未在所核书页注明，不能将此点标成发现地点。
  temporal:
    year_start: 25
    year_end: 420
    era_label: 东汉至东晋的印章与文献
    uncertainty_note: 陶思炎图版称东汉印；《抱朴子》为东晋文本。器物具体出土年代和地点仍需另核。
  paragraphs:
  - 陶思炎《中国镇物》刊有数种“黄神越章”印文，并将图 242 标为东汉印。书中引用《抱朴子》对入山护身的描述：有人携带此印，以印泥布置四方，相信可以防范虎狼和山川神祟。
  - 《抱朴子》还叙述道士以印泥镇制水中大鼋的传说。书页中的印章形制、文献故事和后文其他地券资料应分别辨认；目前材料不足以把图中某枚印确定为洛阳墓葬封泥，也不能将文献中的辟邪效果当作考古事实。
  sources:
  - citation: 陶思炎：《中国镇物》，台北：东大图书公司，1998。
    type: reference_book
    locator: 印页 270，图 242 与相邻正文；本次实际目视扫描本第 300 页，图版未列确切出土地。
  - citation: 〔东晋〕葛洪《抱朴子内篇》卷十七〈登涉〉，古诗文网整理本。
    type: primary_text
