    uncertainty_note: 游戏有更早的流传与不同版本；地图和年份标示的是所引研究坐标及出版时间，不代表民俗的确切起源。
  paragraphs:
  - “血腥玛丽”是一种在美国等地流传的镜前试胆游戏：参与者在昏暗空间面对镜子，反复呼唤名字，并讲述镜中可能出现的人影。次数、场地和结局随讲述者而异。民俗学家 Alan Dundes 于 1998 年发表对多个版本的分析，将其放在青少年仪式和象征解释的讨论中；这一解释是研究观点，不是所有参与者共同的动机。
  - 2010 年 Giovanni Caputo 报告一项镜面注视观察：50 名年轻成人在昏暗房间面对镜子十分钟，事后书写自己的体验；其中 66% 描述自己的脸发生明显变形，另有人报告看见其他面孔、动物或怪物形象。这些是该小样本中的自述结果，不能直接视为总体发生率，也未直接验证“血腥玛丽”游戏中每次体验的成因。
  - 视觉适应与特克斯勒消逝可能参与部分面部特征淡化，但新面孔体验的完整机制仍在研究。把民俗文本与视觉实验并读，有助于区分参与者的主观经历、口传解释和实验条件。
  sources:
  - citation: 'Alan Dundes, Bloody Mary in the Mirror: A Ritual Reflection of Pre-Pubescent Anxiety, Western Folklore 57(2/3), 1998, pp. 119–135.'
    type: peer_reviewed
    url: https://www.jstor.org/stable/1500216
    locator: 游戏版本与作者对仪式的民俗学解释。
  - citation: Giovanni B. Caputo, Strange-face-in-the-mirror illusion, Perception 39(7), 2010, pp. 1007–1008, DOI 10.1068/p6466.
    type: peer_reviewed
    url: https://pubmed.ncbi.nlm.nih.gov/20842976/
    locator: 50 名年轻成人的镜像注视观察；66% 对应报告自身面孔明显变形的比例。
  - citation: Eduardo Fonseca-Pedrero et al., Strange-face-in-the-mirror illusion and schizotypy during adolescence, Schizophrenia Bulletin 41 Suppl 2, 2015, S475–S482.
    type: peer_reviewed
    url: https://pubmed.ncbi.nlm.nih.gov/25810060/
    locator: 110 名非临床青少年的镜面注视研究及不同体验类型。
