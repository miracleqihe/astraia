    locator: 卷七十四“解毒杂治方·蛊毒第四”；此为所引版本卷次。
  - citation: 〔唐〕王焘《外台秘要》，维基文库。
    type: primary_text
    url: https://zh.wikisource.org/wiki/%E5%A4%96%E8%87%BA%E7%A7%98%E8%A6%81
    locator: 卷二十八目录“中蛊毒”“蛊吐血”等门类；本次据目录核对，并未把目录当作各方疗效证据。
  motifs:
