- id: case_cn_tang_qianjin_gu_antidotes
  title: 唐代医书中的“蛊毒”：方药与鬼魅解释并存
  aliases:
  - 千金方解蛊毒门
  - 孙思邈与王焘治蛊方
  - 中古毒物医学化档案
  genre: historical_archive
  credibility_tier: A
  is_fictional_quarantine: false
  note_kind: history
  location:
    lat: 34.265
    lng: 108.954
    precision: city
    location_name: 中国陕西西安（唐代长安的城市参照）
    culture_region: 中国唐代医籍与疾病观念史
  location_note: 坐标为西安城区参考，表示唐代长安文化背景，并非医书某一方剂的编撰或实施地点。
  temporal:
    year_start: 618
    year_end: 907
    era_label: 唐代医籍传统
    uncertainty_note: 两书的编纂经历及不同传世版本的卷次不完全一致；地图年代表示唐代而非具体病例发生时间。
  paragraphs:
  - 《备急千金要方》的传世版本中有“蛊毒”条目，列述古人对腹痛、出血等症状的认识，也把药物、灸法和对鬼魅的解释写在一起。《外台秘要》卷二十八目录同样分列“中蛊毒”“蛊吐血”等门类，显示唐代医书如何收集、组织这类疾病记述。
  - 这些文献把当时的病症观察、药物经验和信仰观念并置，不能简单描述为古人已经把巫蛊完全转化为现代毒理学。书中的古方只是医学史资料，并非经现代检验的解毒方法；遇到疑似中毒应及时寻求专业救治。
  sources:
  - citation: 〔唐〕孙思邈撰、〔宋〕林亿等校《备急千金要方》，识典古籍四库本。
    type: primary_text
