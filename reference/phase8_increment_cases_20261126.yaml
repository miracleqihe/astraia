    lng: 112.5283
    precision: city
    location_name: 中国河南南阳（“南阳”“宛市”的城市参照）
    culture_region: 中国中原志怪文学
  location_note: 坐标取南阳市城市参考点；“宛市”是故事中的地点，不据此定位古代市集遗址。
  temporal:
    year_start: 220
    year_end: 420
    era_label: 魏晋志怪叙事传统
    uncertainty_note: 现核原文为宋代《太平御览》所引《搜神记》材料；故事发生年代和早期版本的确切成书时间不能据此确定。
  paragraphs:
  - 相传南阳青年定伯夜行时遇见一只鬼。他自称也是鬼，与对方结伴，还套问出鬼害怕人的唾液。快到宛城时，定伯把鬼担到市上；鬼变成羊，他便向羊吐唾沫，卖了一千五百钱。
  - 《太平御览》引《搜神记》的这一版本将他写作“宗定伯”，现代通行叙述常作“宋定伯”；同一故事在版本、措辞和结尾上有差异。这个志怪故事以人的机智反转遇鬼的惊惧，属于文学与民间叙事，而不是对鬼怪存在的历史证明。
  sources:
  - citation: 〔宋〕李昉等编《太平御览》卷八百二十八，引《搜神记》“南阳宗定伯”。
    type: primary_text
    url: https://zh.wikisource.org/zh-hans/%E5%A4%AA%E5%B9%B3%E5%BE%A1%E8%A6%BD/0828
    locator: 卷八百二十八“南阳宗定伯”条；本次核对此转引本，非据另一版本补写情节。
