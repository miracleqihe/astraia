- id: case_cn_lingnan_maishui_yankou_rite
  title: 广州增城｜客家丧礼中的“买水”
  aliases:
  - 增城客家买水
  - 岭南买水丧俗
  - 丧礼买水净身
  genre: folktale
  credibility_tier: A
  note_kind: story
  location:
    lat: 23.35278
    lng: 113.78311
    precision: city
    location_name: 中国广东广州增城区（区域参考点）
    culture_region: 中国华南·增城客家丧葬习俗
  location_note: 坐标采用 GeoNames 的增城行政区域参考点；文章未提供具体村庄或仪式现场，不表示该点发生过所述丧礼。
  temporal:
    year_start: 2015
    year_end: 2015
    era_label: 2015 年地方文化记录发表
    uncertainty_note: 年份为资料网页的发表时间；习俗本身的起源和持续年代无法据此确定。
  paragraphs:
  - 钟丽美记录的增城客家丧礼中，亲人离世后，家属要到河边“买水”：晚辈带着瓦罐，在长者和亲属陪同下向水中撒钱、取水，再将水带回，用纸蘸水擦拭逝者的手脚和脸。
  - 记录者解释，当地人认为经过这一礼仪得到的水适合用来为逝者净身；各村具体做法会有差异。泉州另一项民俗普查也记录过向井中投钱求水的做法，可作为不同地点的比较，不能据此把两处仪式拼成一场事件。
  sources:
  - citation: 钟丽美：《广东增城客家葬礼习俗及用语》，广州大学广府文化研究中心，2015。
    type: field_report
    url: https://gzgfwh.gzhu.edu.cn/info/1046/1399.htm
    locator: 2015 年 11 月 3 日，正文第（四）节“买水”。
  - citation: 闽南文化生态保护区：泉州非遗普查“上水送草”，讲述者吴家隆。
    type: field_report
    url: https://www.mnwhstq.com/szzy/fyxmpcjk/201607/t20160713_95049.htm
    locator: 鲤城区鲤中街道“上水”记录，作为泉州地方比较。
  - citation: GeoNames, Zengcheng Shi, administrative reference point.
    type: geographic_reference
    url: https://www.geonames.org/1785436/zengcheng-shi.html
    locator: 增城行政区参考坐标，仅用于地理定位。
