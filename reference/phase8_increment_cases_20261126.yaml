- id: case_cn_soushen_song_dingbo_ghost
  title: 南阳｜宋定伯（宗定伯）卖鬼
  aliases:
  - 宋定伯捉鬼卖鬼
  - 宗定伯卖鬼
  - 南阳定伯逢鬼变羊
  genre: folktale
