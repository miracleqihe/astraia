- id: case_cn_fan_zhen_shenmielun_debate
  title: 南京｜范缜《神灭论》与南朝形神之辩
  aliases:
  - 范缜《神灭论》辩难
  - 萧子良西邸神灭之争
  - 齐梁神灭神不灭大辩论
  genre: historical_archive
  credibility_tier: A
  note_kind: history
  location:
    lat: 32.0603
    lng: 118.7969
    precision: city
    location_name: 中国江苏南京（古建康的城市参照）
    culture_region: 中国江南南朝思想史资料区
  location_note: 坐标取南京市中心，仅作古建康的城市参照；不能据此确定萧子良讲席的具体位置。
  temporal:
    year_start: 479
    year_end: 557
    era_label: 南朝齐梁时期（5—6 世纪）
    uncertainty_note: 这里标示南朝齐梁的大致历史时段，不将讨论或著述的具体年日视为已经确证。
  paragraphs:
  - 《梁书》记载，范缜曾在信奉佛教的竟陵王萧子良座上讨论因果。面对贫富差异的问题，他以同树之花随风飘落、境遇各异作比喻，质疑把世间贵贱归于因果报应。史书接着载录他的《神灭论》，讨论人的形体与精神是否可以分离。
  - 范缜把形体和精神比作刀与刀的锋利：在他的论证里，两者名称不同，却不能脱离彼此独立存在。这里呈现的是南朝典籍中的哲学论辩，不能以此判定任何具体鬼怪传闻的真伪；古籍成文、交锋顺序与现代学术解释仍须分开看。
  sources:
  - citation: 〔唐〕姚思廉撰《梁书》卷四十八〈范缜传〉，维基文库校本。
    type: primary_text
    url: https://zh.wikisource.org/wiki/%E6%A2%81%E6%9B%B8/%E5%8D%B748
    locator: 卷四十八〈范缜〉，花落之喻与《神灭论》全文。
  motifs: []
  compare: []
  bridge:
    id: SYZ-644
    entry: PHI-6-0002
    cluster: sid_crypt
    trail: all
    label: 范缜形神之辩与中国哲学传统
