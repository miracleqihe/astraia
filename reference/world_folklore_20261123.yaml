# Editorial summaries in original Chinese, based on the cited sources.
# Locations are reference points, not asserted sites of supernatural events.
themes:
  - id: corpus_theme_ancestor_returns
    title: 祖灵归来：迎接、祭奠与送别
    paragraphs:
      - 在不同地方，亡者的归来可以是恐怖故事，也可以是与祖先重聚、照料无主亡灵或向亲人表达思念的节期。中元、盂兰盆、京都送火与墨西哥亡灵节各有自己的历史和仪式，不宜看成同一个节日的简单复制。
      - 本组把可核对的地方记录并列，供读者比较时间、地点和参与者；连线表示同题阅读，不代表已证实的传播路线。
    sources:
      - {citation: 中国非物质文化遗产保护中心，《中元节：三节合一 源远流长》，2017。, url: 'https://www.ihchina.cn/project_details/9857', locator: 中元、盂兰盆与放水灯}
      - {citation: 京都市观光协会，Gozan Okuribi。, url: 'https://kyoto.travel/en/travel-inspiration/gozan-okuribi-bonfire', locator: 盂兰盆送火}
    peers: [case_th_dan_sai_phi_ta_khon_procession]
  - id: corpus_theme_between_life_death
    title: 人间与冥界：戏剧、传说与记忆
    paragraphs:
      - 目连戏让救母者走入幽冥，爱尔兰口述故事则让夜归人遇见不可见的存在。两者的表演环境与人物关系各不相同，但都把生者与亡者之间难以跨越的界线写成故事。
      - 在关于战争遗骸的田野研究中，亡者还与土地、亲属关系和未完成的葬礼相连。本组保留这些不同的叙述目的，不把传说或宗教信仰当作超自然事实。
    sources:
      - {citation: 中国非物质文化遗产保护中心，《目连戏（徽州目连戏）》。, url: 'https://www.ihchina.cn/project_details/13370', locator: 剧情和地方演出}
      - {citation: 'Lisa J. Arensen, The Dead in the Land, Journal of Asian Studies 76:1, 2017, pp. 69–86.', url: 'https://doi.org/10.1017/S0021911816001662', locator: 摘要与田野研究}
    peers: [case_id_pontianak_ghost_river_cannon, case_sg_pontianak_film_1957, case_ph_capiz_aswang_fieldwork]
  - id: corpus_theme_creation_worlds
    title: 天地如何开始：不同传统中的创世叙事
    paragraphs:
      - 有的叙述让天地由混沌中展开，有的讲述天空与大地的分离，也有的追问人类如何被创造。盘古、女娲、彝族史诗、基切玛雅《波波尔·乌》和毛利传承分别属于不同社群与文献传统。
      - 这组条目按照各自的采录和传承背景阅读；相似主题可以比较，却不能仅凭相似情节推断共同起源或传播方向。
    sources:
      - {citation: 中国非物质文化遗产保护中心，《盘古神话》。, url: 'https://www.ihchina.cn/project_details/12289.html', locator: 桐柏和泌阳的地方神话群}
      - {citation: Museum of New Zealand Te Papa Tongarewa，Origins of Māori Weaving。, url: 'https://collections.tepapa.govt.nz/topic/3612', locator: 天与地的叙事}
    peers: [corpus_cn_ich_2008_0544, corpus_cn_ich_2008_0545, corpus_cn_ich_2008_0551, corpus_cn_ich_2011_1065, corpus_cn_ich_2021_1375, corpus_popol_vuh]

records:
  - id: case_cn_qimen_mulian_opera
    title: 徽州目连戏：穿过地府寻找母亲
    aliases: [目连救母, 徽州目连戏]
    location: {lat: 29.854, lng: 117.718, precision: city, location_name: 安徽祁门县, culture_region: 中国 · 安徽}
    location_note: 坐标为祁门县城参考点；目连戏的演出地点因班社和场次而异。
    theme: corpus_theme_between_life_death
    paragraphs:
      - 徽州目连戏讲，傅罗卜得知母亲刘氏死后受苦，历经艰险入幽冥寻母。得佛祖帮助后，他成为目犍连，最终救出母亲；戏台上的鬼脸、锣鼓和武戏，将这段跨越生死的寻亲故事演给村落观众。
      - 祁门人郑之珍在明代万历年间综合既有戏曲、变文和传说，写成《新编目连救母劝善戏文》。当地既有真人扮演的“大目连”，也有木偶形式的“托目连”；此处依据祁门地方戏资料记述，并非所有目连故事的统一版本。
    sources:
      - {citation: 中国非物质文化遗产保护中心，《目连戏（徽州目连戏）》。, url: 'https://www.ihchina.cn/project_details/13370', locator: 祁门戏曲及故事梗概}
  - id: case_cn_zhongyuan_lantern_traditions
    title: 中元的水灯：为归来的亡者照路
    aliases: [七月半, 中元水灯]
    location: {lat: 25.78, lng: 110.65, precision: city, location_name: 广西桂林资源县, culture_region: 中国 · 广西}
    location_note: 地图用资源县城作地区参考点，水灯习俗并不只限此地。
    theme: corpus_theme_ancestor_returns
    paragraphs:
      - 农历七月里，一些地方的人们备好饭食祭祖，也为无人祭奠的亡者举行普度。夜晚，灯盏或蜡烛安在纸制、木制的底座上，被送入水流；灯火沿江河漂远，承载对先人和逝者的思念。
      - 中国非遗保护中心的介绍将地方习俗放在道教中元、佛教盂兰盆和民间七月祭祀长期相互影响的背景下。各地举行日期、祭仪和称呼不尽相同；广西资源等地有自己的河灯节传统。
    sources:
      - {citation: 中国非物质文化遗产保护中心，《中元节：三节合一 源远流长》，2017。, url: 'https://www.ihchina.cn/project_details/9857', locator: 放水灯、祭祖与中元普度}
      - {citation: 中国非物质文化遗产保护中心，《中元节（资源河灯节）》。, url: 'https://www.ihchina.cn/project_details/15278.html', locator: 资源河灯节的地方背景}
  - id: case_cn_qinan_nuwa_festival
    title: 秦安女娲祭典：创世故事中的地方祭仪
    aliases: [秦安女娲祭典, 女娲信俗]
    genre: myth
    location: {lat: 34.858, lng: 105.674, precision: city, location_name: 甘肃秦安县, culture_region: 中国 · 甘肃}
    location_note: 坐标是秦安县城参考点；祭典与女娲庙位于秦安县陇城一带。
    theme: corpus_theme_creation_worlds
    paragraphs:
      - 在女娲造人、补天的流传故事之外，甘肃秦安还有围绕女娲的地方祭仪。庙会、祭祀与民众讲述将远古叙事带入每年的地方生活。
      - 中国非遗数字博物馆记录的“秦安女娲祭典”是具体地方的民俗项目。与湖北竹山的女娲传说并读时，应分别保留各自的地点和传承方式。
    sources:
      - {citation: 中国非物质文化遗产保护中心，《女娲祭典（秦安女娲祭典）》。, url: 'https://www.ihchina.cn/project_details/14995', locator: 项目介绍及地方祭典}
  - id: case_cn_tw_keelung_zhongyuan
    title: 基隆中元祭：水灯与城中的普度
    aliases: [鸡笼中元祭, 鷄籠中元祭]
    location: {lat: 25.128, lng: 121.742, precision: city, location_name: 台湾基隆市, culture_region: 中国 · 台湾}
    location_note: 坐标为基隆市区参考点；放水灯及祭典活动分布于多处。
    theme: corpus_theme_ancestor_returns
    paragraphs:
      - 每逢农历七月，基隆的中元祭把轮值组织、祭祀与水灯活动连在一起。人们准备灯具和供品，迎接、祭奠亡者，也借仪式表达地方社群之间的联系。
      - 台湾宗教文化地图记录这一地方节庆的组织与历史，台湾历史博物馆的水灯头收藏则保存了相关器物。城中祭典有自己的变迁，不能直接等同于所有地区的中元习俗。
    sources:
      - {citation: 台湾宗教文化资产，鸡笼中元祭。, url: 'https://taiwangods.moi.gov.tw/html/cultural/3_0011.aspx?i=4', locator: 地方祭典}
      - {citation: 国立台湾历史博物馆，水灯头馆藏记录。, url: 'https://collections.nmth.gov.tw/CollectionContent.aspx?RNO=2004.019.0125&a=132', locator: 馆藏器物}
  - id: case_jp_kyoto_gozan_okuribi
    title: 京都五山送火：把祖灵送回彼岸
    aliases: [五山送火, Gozan Okuribi]
    location: {lat: 35.0116, lng: 135.7681, precision: city, location_name: 日本京都市, culture_region: 东亚 · 日本}
    location_note: 京都市中心参考点；送火分别在五处山体举行。
    theme: corpus_theme_ancestor_returns
    paragraphs:
      - 京都的盂兰盆节相信祖先的灵魂回家探望亲人。8 月 16 日夜晚，城市周围的山上依次点起五组火形，人们以送火为返家的祖灵送行。
      - 京都市官方介绍列出“大”“妙法”、船形、左大文字和鸟居形五组火，亦指出这一习俗的确切起源并不明朗。五山不是五个可任意互换的单一点位。
    sources:
      - {citation: 京都市观光协会，Gozan Okuribi (bonfires)，2025。, url: 'https://kyoto.travel/en/travel-inspiration/gozan-okuribi-bonfire', locator: 五组火形、日期与来源记载}
  - id: case_vn_hcm_vu_lan
    title: 胡志明市盂兰节：给父母与逝者的灯
    aliases: [Vu Lan, 越南盂兰节]
    location: {lat: 10.7769, lng: 106.7009, precision: city, location_name: 越南胡志明市, culture_region: 东南亚 · 越南}
    location_note: 坐标为胡志明市中心参考点，不代表单一寺院或仪式会场。
    theme: corpus_theme_ancestor_returns
    paragraphs:
      - 越南的盂兰节是纪念父母恩情的佛教节期。寺院和家庭在这一时节表达对在世父母的感恩，也追念已经去世的亲人。
      - 越南之声对胡志明市节庆的报道记录了信众到寺院参与活动的情形。这里所写的是现代城市中的具体实践，与各地以鬼怪为主角的叙述应分开理解。
    sources:
      - {citation: 越南之声，Worshippers observe Vu Lan Festival in Ho Chi Minh City，2024。, url: 'https://vov.gov.vn/worshippers-observe-vu-lan-festival-in-ho-chi-minh-city-dtnew-1022416?keyDevice=true', locator: 胡志明市盂兰节报道}
  - id: case_kh_battambang_dead_in_land
    title: 柬埔寨西北部：土地里的遗骨与战后记忆
    aliases: [The Dead in the Land]
    genre: historical_archive
    location: {lat: 13.0957, lng: 103.2022, precision: province, location_name: 柬埔寨马德望省, culture_region: 东南亚 · 柬埔寨}
    location_note: 标记马德望省的省府参考点，不是文中村庄或遗骨发现地点。
    theme: corpus_theme_between_life_death
    paragraphs:
      - 战后迁居的村民在土地里遇到遗骨，有人也讲述过看见亡灵的经历。面对非亲属的遗骸，村民谈论的是如何安置、安慰亡者，以及活人同这些死者之间的关系。
      - 人类学者 Lisa J. Arensen 2017 年的研究以柬埔寨西北部一个村庄为中心，讨论战乱造成的丧葬中断与随后的生活。文章中的鬼魂叙述是受访者的经验与记忆，不能被改写成已经证实的超自然事件。
    sources:
      - {citation: 'Lisa J. Arensen, The Dead in the Land, Journal of Asian Studies 76:1, 2017, pp. 69–86.', url: 'https://doi.org/10.1017/S0021911816001662', locator: 摘要与田野研究}
  - id: case_sg_haw_par_ten_courts
    title: 新加坡虎豹别墅：十殿阎罗的公共展陈
    aliases: [Haw Par Villa, Ten Courts of Hell, 十殿阎罗]
    location: {lat: 1.2829, lng: 103.7818, precision: city, location_name: 新加坡虎豹别墅, culture_region: 东南亚 · 新加坡}
    location_note: 标记虎豹别墅公园地标；这是展陈地点，不是传说事件发生点。
    theme: corpus_theme_between_life_death
    paragraphs:
      - 虎豹别墅的十殿阎罗展陈把死后审判、善恶报应和惩戒塑造成可供行走观看的场景。观众在一组组塑像之间穿行，看到的是二十世纪新加坡公共空间中对相关民间观念的再现。
      - 新加坡国家文物局的馆藏资料将这一公园及其场景置于具体历史中。展陈是一种有时代和创作者背景的视觉叙事，不代表所有华人或佛道信众共享同一套冥界观念。
    sources:
      - {citation: 新加坡国家文物局，Haw Par Villa 馆藏条目。, url: 'https://www.roots.gov.sg/Collection-Landing/listing/1133191', locator: 虎豹别墅相关馆藏}
  - id: case_ie_ardagh_banshee_wake
    title: 阿达的守灵夜：怀疑女妖的归人
    aliases: [The Banshee, Ardagh 守灵夜]
    location: {lat: 52.4499, lng: -9.0561, precision: city, location_name: 爱尔兰利默里克郡纽卡斯尔韦斯特, culture_region: 欧洲 · 爱尔兰}
    location_note: 点位是学校采录地纽卡斯尔韦斯特参考点；故事提到阿达，未给出可核实的废墟位置。
    theme: corpus_theme_between_life_death
    paragraphs:
      - 一次守灵夜里，男人准备独自回家。旁人提醒他提防女妖，他却说世上没有这种东西。后来他走过一处旧屋，见里面亮着灯，便进门查看；刚跨过门槛，就被看不见的人一路打回家中，随后卧床，一周后死去。
      - 爱尔兰学校民俗档案保存了这一讲述：John Sexton 为叙述者，Thomas Sexton 为采录者，记录见第 488 册第 8 页。这里复述的是一则口述故事，不是对死亡原因的历史认定。
    sources:
      - {citation: 'National Folklore Collection, The Schools’ Collection, volume 0488, page 008, The Banshee.', url: 'https://www.duchas.ie/en/cbes/4921961/4913641/4935044', locator: 故事转录及采录者、讲述者}
  - id: case_ie_donegal_ghost_turnip
    title: 多尼戈尔幽灵萝卜灯与无处可去的杰克
    aliases: [Ghost turnip, Jack-o'-lantern]
    location: {lat: 54.869, lng: -8.12, precision: city, location_name: 爱尔兰多尼戈尔郡芬敦, culture_region: 欧洲 · 爱尔兰}
    location_note: 标记馆藏所记芬敦地区参考点，不指称故事发生的具体地点。
    theme: corpus_theme_between_life_death
    paragraphs:
      - 爱尔兰国家博物馆 1943 年收到一盏来自多尼戈尔郡芬敦附近的萝卜灯，并由馆方艺术家依原物制作彩绘石膏模型。萝卜灯挖空后刻出可怖面孔，放入蜡烛，用来在节期夜晚吓人。
      - 馆方将这类灯与关于杰克的传说并置：他不能进入天堂，也不能进入地狱，只能提着灯在黑暗中游荡。地方讲法各有变化，实物则留下了节俗如何被制作与使用的线索。
    sources:
      - {citation: National Museum of Ireland，Ghost turnip，馆藏介绍。, url: 'https://source.museum.ie/en-IE/Collections-Research/Collection/Top-things-to-see-in-the-Irish-Folklife-Collection/Artefact/Ghost-turnip/b202e8ea-0728-4b3d-b0f1-82660fe45ce9', locator: 芬敦萝卜灯及故事背景}
  - id: case_mx_michoacan_day_dead
    title: 米却肯亡灵节：供桌与归家的记忆
    aliases: [Día de los Muertos, 亡灵节]
    location: {lat: 19.7008, lng: -101.1844, precision: province, location_name: 墨西哥米却肯州, culture_region: 北美洲 · 墨西哥}
    location_note: 点位为米却肯州首府莫雷利亚参考点，不指称任何单一社群的祭台。
    theme: corpus_theme_ancestor_returns
    paragraphs:
      - 墨西哥许多家庭在亡灵节准备祭坛、食物、花与亲人的照片，用各自的方式迎接、记念已逝家人。它既涉及家庭记忆，也有地方社区的不同实践。
      - 史密森尼民俗生活中心的资料讨论了祭坛传统及其变化，也记录米却肯一些地区将帝王蝶归来与亡者归来联系起来的讲述。这是一种地方性解释，不代表所有墨西哥家庭的信仰。
    sources:
      - {citation: Smithsonian Folklife，Altered Altars。, url: 'https://folklife.si.edu/magazine/altered-altars-changing-traditions-dia-de-los-muertos', locator: 亡灵节祭坛与家庭传统}
      - {citation: Smithsonian Folklife，Monarch Butterflies in Mexican Culture and Conservation。, url: 'https://folklife.si.edu/magazine/monarch-butterflies-mexico-culture-conservation', locator: 米却肯地区的蝴蝶与亡者讲述}
  - id: corpus_nz_maori_rangi_papa
    title: 毛利创世叙事：天空之父与大地之母
    aliases: [Ranginui, Papatūānuku, Tāne]
    genre: myth
    location: null
    theme: corpus_theme_creation_worlds
    paragraphs:
      - 毛利创世传统的一种叙述中，天空之父 Ranginui 与大地之母 Papatūānuku 紧紧相拥，孩子们生活在他们之间的黑暗中。Tāne 将父母分开，光明进入世界，生命得以伸展。
      - 新西兰国家博物馆 Te Papa 将这一叙述与毛利人的亲缘谱系和对世界的理解相联系。毛利社群内部有多种讲述与表达，不应把它钉在单一地点或当作过时的信仰。
    sources:
      - {citation: Museum of New Zealand Te Papa Tongarewa，Origins of Māori Weaving。, url: 'https://collections.tepapa.govt.nz/topic/3612', locator: 天父地母及其子嗣}
  - id: corpus_norse_world_tree
    title: 北欧宇宙观：世界树、命运与诸神黄昏
    aliases: [Yggdrasil, 诸神黄昏]
    genre: myth
    location: null
    theme: corpus_theme_creation_worlds
    paragraphs:
      - 北欧神话中的世界树 Yggdrasil 将诸多世界联系起来，诸神、巨人与其他存在居于不同领域。关于命运和世界终局的叙述，又把众神的世界置于会发生变化的时间之中。
      - 丹麦国家博物馆介绍的材料来自维京时代宗教及其后世保存的文献传统。故事有不同文本和研究解释，这里把它作为一组宇宙叙事阅读，不指定虚构的事件坐标。
    sources:
      - {citation: National Museum of Denmark，The Old Religion。, url: 'https://en.natmus.dk/historical-knowledge/denmark/prehistoric-period-until-1050-ad/the-viking-age/religion-magic-death-and-rituals/the-old-religion/', locator: 北欧神话与宗教传统}
  - id: corpus_egypt_weighing_heart
    title: 古埃及《亡灵书》：亡者之心与审判
    aliases: [Weighing of the Heart, 亡灵书]
    genre: historical_archive
    location: null
    theme: corpus_theme_between_life_death
    paragraphs:
      - 在古埃及丧葬文献所描绘的审判中，亡者的心被放上天平，与代表真理和秩序的羽毛相衡。图像和咒文共同帮助亡者面对通往来世的考验。
      - 大英博物馆的古埃及文字展览材料介绍了奈杰梅特的《亡灵书》及称心场景。这是对具体文物与历史信仰的说明，并非可以被证实的死后经历。
    sources:
      - {citation: 'British Museum，Hieroglyphs: unlocking ancient Egypt，展览文字指南。', url: 'https://www.britishmuseum.org/sites/default/files/2022-10/Hieroglyphs_unlocking_ancient_Egypt_large_print_guide_The_British_Museum.pdf', locator: 奈杰梅特《亡灵书》及称心场景}

existing_notes:
  corpus_cn_ich_2008_0544:
    paragraphs:
      - 河南桐柏与泌阳的盘古神话群，不只讲开天辟地，还包含世界毁灭、婚配繁衍和身体化作万物等故事。山川、村落与节俗在长期讲述中进入神话，形成地方版本。
      - 2008 年名录卡记录的是一项民间文学项目。补充链接提供桐柏、泌阳传承的介绍，不能据此断言所有盘古故事出自同一地点。
    source: {citation: 中国非物质文化遗产保护中心，《盘古神话》。, url: 'https://www.ihchina.cn/project_details/12289.html', locator: 地方神话群}
  corpus_cn_ich_2021_1375:
    paragraphs:
      - 湖北竹山的女娲传说包含抟土造人、炼石补天，以及创造乐器等不同故事。宝丰镇女娲山一带的讲述、歌谣、祭祀和地方艺术，使这些故事与当地生活相连。
      - 非遗项目介绍还指出，女娲传说分布于多个地区。竹山是此条记录的传承背景，不能将地方传说中的地点当成神话事件得到历史证实的现场。
    source: {citation: 中国非物质文化遗产保护中心，《女娲传说》。, url: 'https://www.ihchina.cn/Article/Index/detail?id=23438', locator: 竹山传承与主要故事}
  corpus_cn_ich_2008_0551:
    paragraphs:
      - 《查姆》是云南双柏等地彝族民间创世史诗，名称意译为“万物的起源”。它以神话叙述人类与万物的起源和发展，并由通晓彝文的毕摩记录、传承。
      - 这是一套属于具体语言和社群的知识传统；阅读时应同时注意其口传、仪式与彝文记录背景。
    source: {citation: 中国非物质文化遗产保护中心，《查姆》。, url: 'https://www.ihchina.cn/project_details/12297/', locator: 史诗内容与传承}
  corpus_cn_ich_2011_1065:
    paragraphs:
      - 《阿细先基》是云南弥勒彝族阿细人的创世史诗，围绕人类和世界的起源展开，长期以地方语言和演唱形式传承。
      - 非遗项目资料把它放在弥勒当地的传承群体和文化生活中介绍。它不是对其他彝族社群所有创世叙事的概括。
    source: {citation: 中国非物质文化遗产保护中心，《阿细先基》。, url: 'https://www.ihchina.cn/project_details/12369/', locator: 史诗的地方传承}
  corpus_popol_vuh:
    paragraphs:
      - 基切玛雅《波波尔·乌》保存了创世、人类起源与英雄双生子的故事。不同篇章把天地的形成、祖先世系和人类共同体的来历编织在一起。
      - 这部作品以拉丁字母文字记录并经后世文献保存；盖蒂研究资源提供书写与视觉传统的背景。阅读时应区分文本、较早的玛雅艺术以及各自的历史语境。
    source: {citation: Getty Research Institute，Popol Vuh iconography record。, url: 'https://www.getty.edu/cona/CONAIconographyRecord.aspx?iconid=901001893', locator: 基切玛雅文本与图像背景}
