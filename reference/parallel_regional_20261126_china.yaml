- id: case_cn_dict3_changyi_red_children
  title: 山东昌邑｜坟场里的红袄孩子
  aliases:
  - 穿红袄的小孩
  genre: folktale
  credibility_tier: B
  location:
    lat: 36.85361
    lng: 119.39083
    precision: city
    location_name: 山东昌邑
    culture_region: 东亚 · 中国
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
  paragraphs:
  - 一位商人酒后赶夜路，经过坟场时听到笑声，看见许多孩子在坟头玩耍，围着他要背。孩子们有的爬到肩上，有的钻进背囊，他背着他们走了大半夜。
  - 鸡叫时，孩子们要求下来，商人却坚持带回家。到了家里，他发现背上是一块棺材板，背囊里只剩纸钱；夫妻随后去坟地烧纸，此后再没遇见同样的事。
  sources:
