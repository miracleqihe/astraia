- id: case_cn_dict3_hailun_who_saved_whom
  title: 黑龙江海伦｜谁救了谁
  aliases:
  - 谁救了谁
  genre: folktale
  credibility_tier: B
  location:
    lat: 47.44663
    lng: 126.92475
    precision: city
    location_name: 黑龙江海伦
    culture_region: 东亚 · 中国
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
  paragraphs:
  - 海伦流传的故事里，一名书生收留了自称无家可归的女子。过了一阵，他在集市遇见僧人；僧人认为女子并非寻常来客，送给他三样护身物。
  - 夜里女子现出另一副面目，护身物随之起作用；故事最后揭示她是狐狸所变。书生原以为自己救助了陌生人，后来却感谢那位提醒他的人，题目因此留下互相救助的反问。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: “当代鬼话”，印页 541（PDF 第 656 页）；辞典转引文彦生《中国鬼话》，转引书未在本次独立核查。
  - citation: 黑龙江海伦地理参考。
    type: geographic_reference
    url: https://www.geonames.org/2037069/
