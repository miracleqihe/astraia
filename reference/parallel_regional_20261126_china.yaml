- id: case_cn_dict3_pingdu_five_fingerprints
  title: 山东平度｜空屋里的五个指印
  aliases:
  - 五个手指印
  genre: folktale
  credibility_tier: B
  location:
    lat: 36.78444
    lng: 119.94639
    precision: city
    location_name: 山东平度
    culture_region: 东亚 · 中国
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
  paragraphs:
  - 书生周生进京赶考，与两名同伴受一位白衣女子指引，在空房中留宿。半夜，同伴醒来发现脸上有五道红印，说自己在睡梦中被可怖的人打了一巴掌。
  - 周生随后听见女子诉说冤屈，请他将来替自己伸冤。故事说他考中后查办了害死她的人；空屋、掌印与诉冤共同构成辞典收录的平度地方叙事。
