- id: case_cn_dict3_fuyang_jade_brother
  title: 安徽阜阳｜半块玉佩与鬼弟
  aliases:
  - 鬼弟
  genre: folktale
  credibility_tier: B
  location:
    lat: 32.9
    lng: 115.81667
    precision: city
    location_name: 安徽阜阳
    culture_region: 东亚 · 中国
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
  paragraphs:
  - 故事说，接生婆夜里替一户人家接生，主人以一对龙凤玉佩作为信物：一块给接生婆的孩子张龙，一块留给自家孩子王麟。后来张龙家境败落，手持另一块玉佩的王麟前来相助。
  - 张龙得知对方是“鬼弟”，仍接受他的提醒，重新读书做人。后来他因玉佩结识伴侣；王麟辞去时化为青烟，张龙每见旧物便想起这段情谊。辞典记其流传于阜阳一带。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: “当代鬼话”，印页 552（PDF 第 667 页）；辞典转引文彦生《中国鬼话》，转引书未在本次独立核查。
