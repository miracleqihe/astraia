- id: case_cn_dict3_biyang_spinning_ghost
  title: 河南泌阳｜夜纺与小鬼
  aliases:
  - 童养媳坑恶鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 32.73087
    lng: 113.32195
    precision: city
    location_name: 河南泌阳
    culture_region: 东亚 · 中国
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
  paragraphs:
  - 辞典所记泌阳故事中，一位年轻媳妇白天忙于家务，夜里还被要求纺线。深夜有个小鬼上门，劝她去做替身；她意识到对方的意图，没有照办。
  - 她借口先要烧水洗脚，让小鬼靠近，趁机用热水把它赶除。故事说，家人从此不再逼她夜间纺线；这里呈现的是带有家庭劳役背景的民间故事，而非一宗被证实的事件。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: “当代鬼话”，印页 547（PDF 第 662 页）；辞典转引文彦生《中国鬼话》，转引书未在本次独立核查。
  - citation: 河南泌阳地理参考。
    type: geographic_reference
    url: https://www.geonames.org/1816315/
    locator: 所列点仅作城市、县区或公共场所参考；详见地图精度说明。
  bridge:
    entry: LIT-2-0004
    cluster: sid_liminal
    trail: all
    label: 家庭劳役与故事视角
    rationale: 从叙事视角观察人物如何应对不平等处境，不把文本情节当作历史个案。
- id: case_cn_dict3_liping_wuchang
  title: 贵州黎平｜阿妞与失约的书生
  aliases:
  - 吴伥鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 26.23111
    lng: 109.13139
    precision: city
    location_name: 贵州黎平
    culture_region: 东亚 · 中国
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
  paragraphs:
  - 书生张胜经过一间酒家，与店主阿妞约定婚事；临别时她还给他盘缠。到了约定的时候，张胜却把承诺忘了。辞典中的故事说，阿妞死后化为鬼，再次找到他。
  - 二人后来成婚，村里发生孩子失踪的怪事，一位长者向张胜提醒妻子的来历。故事以张胜无法摆脱鬼魅而身亡收场。人物命运、失踪与鬼怪都是民间叙事情节，不是现实指控。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: “当代鬼话”，印页 547–548（PDF 第 662–663 页）；辞典转引文彦生《中国鬼话》，转引书未在本次独立核查。
