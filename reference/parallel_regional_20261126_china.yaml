    cluster: sid_liminal
    trail: all
    label: 戏台脸谱与夜宿故事
    rationale: 对读戏子、厢房和脸谱如何共同构成故事场景；不把鬼怪当作目击事实。
- id: case_cn_dict3_ruzhou_wang_yong
  title: 河南汝州｜王勇背鬼到天明
  aliases:
  - 王勇斗鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 34.16167
    lng: 112.82972
    precision: city
    location_name: 河南汝州
    culture_region: 东亚 · 中国
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
  paragraphs:
  - 临汝地方故事中，王勇听说弟弟被乱坟附近出没的女鬼害死，决心面对她。一天夜里，他将前来的女鬼背在身上，继续干活，一直坚持到天快亮。
  - 女子想回阴间，先恐吓、再挣扎，王勇仍不放手。天亮后她化成一块旧木板；村人起初不相信，后来在长者帮助下将木板烧掉。辞典以旧地名临汝标示流传范围。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
