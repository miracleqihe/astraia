- id: case_cn_dict3_jinzhou_ghost_gambling
  title: 辽宁锦州｜赌局后的纸钱
  aliases:
  - 和鬼赌钱
  genre: folktale
  credibility_tier: B
  location:
    lat: 41.10778
    lng: 121.14167
    precision: city
    location_name: 辽宁锦州
    culture_region: 东亚 · 中国
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
  paragraphs:
  - 锦州一则故事里，嗜赌的人赢钱后喝了酒，夜间来到一间土屋，看见床上躺着一人，便邀对方赌钱。他先赢后输，辞别而去。
  - 第二天，他发现口袋里是纸钱，急忙回到昨夜的地方，却只见土坟和倒下的石碑。坟边还有先前赢到的银元；他这才相信昨晚赌局的对手不是常人，受惊之后戒了赌。
  sources:
