- id: case_cn_dict3_hengzhou_scholar_nail
  title: 广西横州｜秀才与坟边的约定
  aliases:
  - 秀才钉坟
  genre: folktale
  credibility_tier: B
  location:
    lat: 22.68955
    lng: 109.2674
    precision: city
    location_name: 广西横州
    culture_region: 东亚 · 中国
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
  paragraphs:
  - 一群无赖打赌，要人在夜里到坟上钉钉子，接着又逼一名秀才代劳。秀才来到坟边，坟中女子现身，向他倾诉自己在阴间遭遇的不公。
  - 两人商定对付无赖；第二天秀才把他们引到坟地，故事以无赖受惩、女子还阳收尾。辞典记其流传于旧称横县的地方，记述的是一则故事而非可核验的案件。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
