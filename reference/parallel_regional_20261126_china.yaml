- id: case_cn_dict3_dandong_actor
  title: 辽宁丹东｜西厢房里的花脸
  aliases:
  - 戏子吹鬼
  genre: folktale
  credibility_tier: B
  location:
    lat: 40.12917
    lng: 124.39472
    precision: city
    location_name: 辽宁丹东
    culture_region: 东亚 · 中国
  location_note: 地图为辞典所记流传地的市县参考点，故事中的屋舍、道路及坟墓未定位。辞典栏目名为“当代鬼话”，不等于故事发生或采录年代已知。
  paragraphs:
  - 丹东一带有一则被辞典收入的故事：唱花脸的戏子听说西厢房闹鬼，偏要在那里过夜。夜深后，纸窗破洞里伸进一条腿，他一把抓住，发现来的是一名女子。
  - 女子想吓走戏子，变出鬼脸；戏子便用自己的脸谱回应。她又吹来阴气，他不肯退让，最后女子认输。戏台上的装扮，在这里成了人鬼相互试胆的道具。
  sources:
  - citation: 徐华龙主编：《中国鬼文化大辞典》，南宁：广西民族出版社，1994。
    type: reference_book
    locator: “当代鬼话”，印页 539（PDF 第 654 页）；辞典转引文彦生《中国鬼话》，转引书未在本次独立核查。
  - citation: 辽宁丹东地理参考。
    type: geographic_reference
    url: https://www.geonames.org/2037886/
    locator: 所列点仅作城市、县区或公共场所参考；详见地图精度说明。
  bridge:
