  - id: motif_cn_zhuyou_incantation_craft
    title: 祝由咒禁与方术医疗母题群
    aliases:
      - 祝由十三科
      - 咒禁科
      - 符水收惊
      - Zhuyou incantation healing
    node_type: motif_index
