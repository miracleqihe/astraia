  reading_kind: report
- id: case_id_medan_night_ride_calls_2023
  title: 印尼棉兰｜深夜无人回应的订单
  genre: memorate
  credibility_tier: B
  theme: corpus_id_campus_stories_and_media_2021_2024
  location:
    lat: 3.561741
    lng: 98.656052
    precision: city
    location_name: 印尼北苏门答腊棉兰 · 苏门答腊大学
    culture_region: 东南亚 · 印度尼西亚
  location_note: 点位为大学校园参考；故事涉及不同校门，不表示订单的精确起点。
  paragraphs:
  - 深夜结束校园活动后，Ira 和朋友几次叫车都被取消。终于有司机接单，却在到达之前反复打电话；两人上车后才知道，司机担心这是一笔找不到乘客的订单。
  - 司机告诉她，以前接过一些深夜从校园另一处门口发出的订单，打回去却没有声音。Ira 将这段对话讲给 2023 年来访的记者；她也说自己并未亲眼见过当地传说中的红衣女子。
  - 司机的经历经由学生转述，订单是否存在技术问题或其他原因，报道没有查明。
  sources:
  - *id006
  - *id007
  reading_kind: report
- id: case_id_makassar_ambulance_siren_2021
