records:
- id: case_cn_xianning_classroom_paper_2002
  title: 湖北咸宁｜教室门缝里的纸片
  genre: memorate
  credibility_tier: A
  theme: corpus_cn_city_rumor_and_investigation_2002_2009
  location:
    lat: 29.8413
    lng: 114.322
    precision: city
    location_name: 中国湖北咸宁 · 城市参考点
    culture_region: 中国 · 华中
  location_note: 学校名称见报道；地图使用城市参考点，不指向学生或教室。
  paragraphs:
  - 一间闲置教室堆着桌椅，门常年锁着。有学生透过门缝往里看，高年级同学开玩笑说里面有鬼；恰好一张纸从蜘蛛网上飘落，小孩子便害怕起来。
  - 2002 年校长向记者回忆，这个故事传出学校后不断变化，有人说看见白骨，有人又编出关于师生的不幸遭遇。老师只好反复向家长解释，记者到附近商户处求证时，也没有人能说出传闻中人物的来历。
  - 纸片与故事的最初经过来自校长的讲述；后续各种惊悚情节则是报道追访到的传言。
  sources:
  - *id001
  reading_kind: report
- id: case_cn_qingdao_morning_wall_tapping_2009
  title: 青岛｜每天清晨响起的敲击
  genre: memorate
  credibility_tier: A
  theme: corpus_cn_city_rumor_and_investigation_2002_2009
  location:
    lat: 36.0671
    lng: 120.3826
    precision: city
    location_name: 中国山东青岛 · 城市参考点
    culture_region: 中国 · 华东
  location_note: 报道涉及仍有人居住的住宅；只标青岛城市参考点。
  paragraphs:
  - 连续半个月，青岛一栋住宅楼总在清晨传出一阵阵敲击声，似乎沿着墙面传遍房间。邻居们尝试寻找声源，有人猜是水管，也有人开始讲楼里闹鬼。
  - 2009 年一个清晨，民警与居民逐层查找，敲到六楼时声音停了。住在那里的邻居解释，自己是在拍打墙面与地板尝试创作音乐。
  - 这篇报道把早起住户听到的声音和后来查找的过程都保存了下来。
  sources:
  - *id002
  reading_kind: report
- id: case_cn_hohhot_bathhouse_rumor_2008
  title: 呼和浩特｜浴池里的陌生传言
  genre: memorate
  credibility_tier: A
  theme: corpus_cn_city_rumor_and_investigation_2002_2009
  location:
    lat: 40.8426
    lng: 111.7492
    precision: city
    location_name: 中国内蒙古呼和浩特 · 城市参考点
    culture_region: 中国 · 华北
  location_note: 报道涉及当地经营场所与居民；点位为呼和浩特城市参考，不指向浴池。
  paragraphs:
  - 2008 年，呼和浩特一带传起浴池里的恐怖故事：有人说一名洗澡的女子见到了陌生身影，回家后遭遇不幸。街坊讲得越来越具体，却没人能说清当事人是谁。
  - 记者访问传言中提到的经营者与村委会工作人员。经营者说自己也是听别人讲起，工作人员走访后同样找不到具体的浴池和人物。
  - 故事留下的是一次传闻在社区里的扩散；报道中的个人猜测并不能单独确定传言由谁编造。
  sources:
  - *id003
  reading_kind: report
- id: case_id_solo_nyah_rewel_campus_grave_2022
  title: 印尼梭罗｜校园里留下的旧墓
  genre: memorate
  credibility_tier: A
  theme: corpus_id_campus_stories_and_media_2021_2024
  location:
    lat: -7.5576139
    lng: 110.8557427
    precision: city
    location_name: 印尼中爪哇梭罗 · 三月十一日大学
    culture_region: 东南亚 · 印度尼西亚
  location_note: 点位采用大学公开的校园参考坐标，墓地及故事中的路线未作精确定位。
  paragraphs:
  - 三月十一日大学校园里保留着一座被称为 Nyah Rewel 的旧墓。有人讲，夜深时曾在附近看见穿传统服饰的女子；医学院的一位职员则说，自己长期夜间经过这里，没有遇到怪事，只在某些日子闻过香气。
  - 一位附近居民回忆，童年时曾在墓下较大的空间玩耍；他从母亲那里听说，那个称呼与墓的修建过程有关。另一位保安谈及早年这片土地上的墓地和村落。
  - 2022 年的采访保留了不同人的记忆和传闻。关于墓主与名字的解释，也仍是受访者转述的地方说法。
  sources:
  - *id004
  - citation: Universitas Sebelas Maret, “University Profile”。
    type: map_reference
    url: https://uns.ac.id/en/about-uns/university-profile/
    locator: 校方公布的校园坐标 -7.5576139, 110.8557427
  reading_kind: report
- id: case_id_malang_dark_seventh_floor_2023
  title: 印尼玛琅｜雨后电梯的第七层
  genre: memorate
  credibility_tier: B
  theme: corpus_id_campus_stories_and_media_2021_2024
  location:
    lat: -7.96431
    lng: 112.61998
    precision: city
    location_name: 印尼东爪哇玛琅 · 国立玛琅大学
    culture_region: 东南亚 · 印度尼西亚
  location_note: 校园范围参考点来自校园影像位置；故事发生的电梯不单独定位。
  paragraphs:
  - 一场大雨让学生 Hayyu 留在教学楼里。她到三楼寻找充电插座，发现周围已没人，便按下一楼准备离开；她回忆电梯却向上驶去，门打开时，七楼一片昏暗。
  - 她惊慌地关门，停了一会儿，再次按下一楼，电梯便带她下去。她把拍到的片段发到网上，故事很快传开。
  - 2023 年记者试乘时电梯正常运行；学校设施负责人推测，可能有人在七楼呼叫电梯，并表示会检查设备。推测不等于已经查明的故障原因。
  sources:
  - *id005
  - citation: Universitas Negeri Malang：2020 年校园影像，Wikimedia Commons。
    type: map_reference
    url: https://commons.wikimedia.org/wiki/File:Universitas_Negeri_Malang_UM_2019.jpg
    locator: 影像拍摄坐标 -7.964313, 112.619978；作为校园范围参考
  reading_kind: report
- id: case_id_medan_rain_gate_figure_2023
  title: 印尼棉兰｜雨中的校园路口
  genre: memorate
  credibility_tier: B
  theme: corpus_id_campus_stories_and_media_2021_2024
  location:
    lat: 3.561741
    lng: 98.656052
    precision: city
    location_name: 印尼北苏门答腊棉兰 · 苏门答腊大学
    culture_region: 东南亚 · 印度尼西亚
  location_note: 点位为大学校园范围参考；不精确标示受访者经过的停车处。
  paragraphs:
  - 考试结束后的雨夜，学生 Winda 和朋友骑车经过校园一带。她说朋友先注意到附近停车处的人影，她随后也看见一个似乎悬空坐着的身影；两人惊叫，一时紧张得忘了如何加速。
  - 这一带还流传过红衣女子的故事。2023 年记者实地观察了树木、道路和照明，并分别采访学生；人影的身份仍然只是当事人的判断。
