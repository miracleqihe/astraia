revisions:
  case_cn_qingdao_jiangxi_road_red_dress:
    source:
      citation: 〈记者多方求证网友实地打探攻破“鬼楼”闹鬼传言〉，青岛新闻网，2005 年 2 月 21 日，新浪新闻转载。
      type: newspaper_report
      url: https://news.sina.cn/sa/2005-02-21/detail-ikkntiam2689120.d.html
      locator: 网友夜宿及住户、管理者、警方采访
    paragraphs:
    - 青岛江西路一栋楼的部分窗户破旧，晚上偶尔透出灯光。附近居民听到一种讲法：一位穿红裙的女子出现在楼道，后来住户陆续搬走。
    - 2004 年记者访问楼内租户、长期住户和当地派出所。受访者说自己也听过故事，但没有见到传闻中的事情；警方介绍，部分房间空置与住房使用安排有关。
    - 2005 年，十位网友带着帐篷夜宿楼道，一夜只听见风声。另一些住户和附近工作人员告诉记者，他们一直在这里生活或工作，也没有遇到传闻中的情形。
    - 红裙女子的经历属于转述，报道没有找到可以独立核对的当事人。
