themes:
- id: corpus_cn_city_rumor_and_investigation_2002_2009
  title: 传言如何走出一栋楼｜中国城市调查
  genre: academic_model
  peers:
  - case_cn_qingdao_jiangxi_road_red_dress
  - case_cn_cenxi_fish_drain_sound_2007
  paragraphs:
  - 闲置教室里飘落的一张纸、住宅楼墙里的敲击声、浴池里无人说清的故事，在口耳相传中各自长出新的版本。
  - 记者走访留下了学生、住户和经营者的说法，也记录他们的回应。把传闻与调查放在一起，能看见一个故事如何改变人们对熟悉地方的想象。
  sources:
  - &id001
