    locator: 浴池经营者与村委会调查
- id: corpus_id_campus_stories_and_media_2021_2024
  title: 印尼校园的夜晚｜口述、视频与戏仿地图
  genre: academic_model
  peers:
  - case_id_yogyakarta_silent_lecturer_2016
  - case_cn_shenzhen_university_dorm_sign_2007
  paragraphs:
  - 校园旧建筑、路口和电梯，既是夜间活动的真实地点，也会成为学生分享怪谈的坐标。有人讲述自己的经历，有人将片段拍成短视频，还有人绘制玩笑性质的地图。
  - 2021 至 2024 年的新闻把讲述者、现场采访和管理者的解释留在一起。这些材料记录的是故事的传播与不同人的观察，并不证明故事中的超自然解释。
