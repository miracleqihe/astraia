- id: corpus_seasia_empty_house_and_belief_2013_2017
  title: 空屋、楼宇与家人记忆｜东南亚的讲述
  genre: academic_model
  peers:
  - case_vn_hanoi_dorm_white_coat_2009
  - case_ph_manila_manananggal_night
  paragraphs:
  - 胡志明市的高楼和旧宅、菲律宾家庭的童年记忆，与泰国素林地区悬挂红衣的做法，来自各自不同的城市生活与信仰环境。
  - 一篇报道、一次口述与一部电影都保存了不同层次的材料。并读时保留故事发生地、讲述地点和未被证实的部分，不把相似形象视为共同起源的证据。
  sources:
