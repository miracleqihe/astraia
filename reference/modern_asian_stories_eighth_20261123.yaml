    locator: 校长、附近商户与记者对传言演变的调查
  - &id002
    citation: 〈百通花园某楼凌晨传怪响以讹传讹被称为鬼楼〉，《青岛早报》，2009 年 8 月 27 日，青岛新闻网。
    type: newspaper_report
    url: https://qingdaonews.com/content/2009-08/27/content_8128471.htm
