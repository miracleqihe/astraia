- id: case_cn_yunnan_luliang_jingmacao_sounds
  title: 云南陆良｜惊马槽里的声音
  genre: memorate
  credibility_tier: A
  theme: corpus_cn_yunnan_field_reports_2001_2007
  location:
    lat: 25.0314329
    lng: 103.6622775
    precision: city
    location_name: 中国云南 · 陆良县城参考点
    culture_region: 中国 · 西南
  location_note: 调查地点在陆良彩色沙林一带；点位为陆良县城参考坐标，不标示山谷具体位置。
  paragraphs:
  - 陆良彩色沙林附近，几位村民向记者描述山沟里的声音：有人听成喊声、马叫，有人说像脚步和鼓声；当地流传的名字叫“阴兵过路”。他们记住的时间、天气和声音并不完全一样。
  - 2001 年，记者夜里走进惊马槽，最终只听见风声。报道也收录过不同的自然解释，但没有提供足以确认具体声源的重复测量；这份记录保留村民的讲述和记者当晚的观察。
  sources:
