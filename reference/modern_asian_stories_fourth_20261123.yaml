themes:
- id: corpus_cn_shanghai_city_lore_liu_2015
  title: 上海都市传说｜从建筑外形到口耳相传
  genre: academic_model
  peers:
  - case_cn_shanghai_dragon_pillar
  - case_cn_shanghai_vampire_school_rumors
  - corpus_cn_beijing_ghostlore_solovyova_2019
  paragraphs:
  - 上海的高架桥、商场、写字楼和地铁站，常被人们赋予建筑用途之外的故事。反复播放的歌曲、楼梯间里的迷路经历，或大楼形状，都可能成为传说的起点。
  - Mingming Liu 的 2015 年论文附录保存并翻译了当时网络上流传的一组上海城市传闻；黄景春的会议论文提要则把这些叙事与城市发展和文化记忆联系起来。这里比较的是不同讲法，不把网上的细节当作已核实的事件。
  sources:
  - &id001
    citation: 'Mingming Liu, Theory of the Strange: Towards the Establishment of Zhiguai as a Genre, University of California, Riverside, 2015。'
    type: academic_thesis
    url: https://escholarship.org/content/qt3579w43t/qt3579w43t_noSplash_12f87bb1b9e1abf8834fc55ba8836130.pdf
    locator: 附录 VIII，第 125—130 页：上海城市传闻的网络文本与译注
  - &id002
    citation: 黄景春：〈当代民间叙事的文化幻象——上海都市传说的文学解析〉，中国民俗学会 2012 年年会论文提要。
    type: conference_abstract
    url: https://chinafolklore.org/upload/userfiles/cfs_2012_abstracts.pdf
    locator: 年会论文提要第 10 页：上海当代传说与城市空间
- id: corpus_cn_yunnan_field_reports_2001_2007
  title: 云南的传闻与现场｜山谷和旧楼
  genre: academic_model
  peers:
  - case_cn_shanghai_abandoned_school_exploration_2012
  - case_cn_shennongjia_road_yeren_2007
  paragraphs:
  - 在陆良，有村民向记者讲过惊马槽的声音；在昆明，一群青年回忆走进旧楼后，被一段漆黑的录像吓了一跳。这两则地方材料都保留了人们对陌生空间的好奇与猜测。
  - 2001 年和 2007 年的报道还写下调查者自己看到或没有看到的情形。将传闻、当事人回忆和现场观察分开，可以让故事更完整，也更容易追查出处。
  sources:
  - &id005
    citation: 〈鬼影鬼叫连连：云南陆良“闹鬼”现场调查记〉，新浪新闻，2001 年 11 月 4 日。
    type: newspaper_report
    url: https://news.sina.com.cn/s/2001-11-04/392051.html
    locator: 仕官村、汤官箐村受访者讲述及记者夜访惊马槽
  - &id004
    citation: 毛翠、秦力：〈昆明 X 友的另类空间：吓得半死再乐死〉，《生活新报》，2007 年 8 月 13 日，新浪新闻转载。
    type: newspaper_report
    url: https://news.sina.com.cn/c/2007-08-13/102612375407s.shtml
    locator: 昆明城市探访者采访与“滇五大 X 空间”段落
- id: corpus_tw_campus_lakes_yang_chen_2024
  title: 校园湖泊｜风景、记忆与鬼故事
  genre: academic_model
  peers:
  - case_cn_hk_hku_lotus_pool
  - text_cn_ma_xingyu_campus_horror_2016
  paragraphs:
  - 台湾校园里的湖有着多重身份：它们是散步、纪念与毕业活动的地方，也成为学生讲述怪谈的场景。醉月湖的孤亭让人联想到断桥故事；竹湖的叙事则把水里的意外和宿舍中的异样联系起来。
  - 杨凯杰、陈彦杰 2024 年比较校湖的建造、使用和地方想象，同时指出醉月湖湖心亭的断桥式设计早已存在。把故事和湖的历史一起阅读，更容易看出景观如何进入学生的共同记忆。
  sources:
  - &id006
    citation: 杨凯杰、陈彦杰：〈方塘鉴开：大学校湖水景的政治与文化〉，《建筑与城乡研究学报》第 24 期，2024 年，第 69—119 页。
    type: peer_reviewed
    url: https://bp.ntu.edu.tw/001/Upload/1352/ckfile/6d584ee0-8cfe-45fb-bb2a-594cb996eeb2.pdf
    doi: 10.6154/JBP.202409_(24).0003
    locator: 第 104—105 页：醉月湖和竹湖的校园叙事；第 89 页：湖泊沿革
- id: corpus_id_pontianak_duile_2020
  title: 坤甸夜谈｜女鬼、河流与城市边缘
  genre: academic_model
  peers:
  - case_id_pontianak_ghost_river_cannon
  - case_sg_pontianak_film_1957
  - case_my_kl_um_roadside_woman_2009
  paragraphs:
  - Kuntilanak 在印尼和马来语世界的口述、电影中都有不同形象。坤甸的建城故事讲到两河交汇处的树与炮声；当代居民也会在夜谈、晾衣和门前灯光中，提起这位熟悉又令人畏惧的角色。
  - 人类学者 Timo Duile 依据 2014 年起的田野观察，区分地方建城叙事、居民讲述与流行影视作品。相同名称并不表示每个地区的故事相同。
  sources:
  - &id007
    citation: 'Timo Duile, “Kuntilanak: Ghost Narratives and Malay Modernity in Pontianak, Indonesia”, Bijdragen tot de Taal-, Land- en Volkenkunde 176, 2020, 279–303。'
    type: peer_reviewed
    url: https://brill.com/view/journals/bki/176/2-3/article-p279_3.pdf
    doi: 10.1163/22134379-17601001
    locator: 第 291—292 页：2014 年起坤甸郊区的访谈与观察
- id: corpus_vn_hue_ghost_memory_phuoc_2025
  title: 顺化的纪念与讲述｜1885 年之后
  genre: academic_model
  peers:
  - corpus_la_tappe_ghosts_war_business
  paragraphs:
  - 顺化关于 1885 年都城陷落的记忆，既留在纪念仪式中，也留在民间关于无名亡者的故事里。有人讲亡者托梦寻求安葬和名字，有人记得夜里传来的哭声与求救声。
  - Hoàng Hữu Phước 在 2022—2024 年访谈与资料分析的基础上，比较纪念场所中的不同叙事。文章把这些故事看作人们表达哀悼和传递历史记忆的方式。
  sources:
  - &id008
    citation: 'Hoàng Hữu Phước, “Contemporary Ghost Legends Associated with the Fall of Huế Citadel in 1885”, HNUE Journal of Science: Social Sciences 70(2), 2025, 35–46。'
    type: peer_reviewed
    url: https://hnuejs.edu.vn/ss/article/download/897/454/5795
    doi: 10.18173/2354-1067.2025-0018
    locator: 第 40—42 页：2022—2024 年田野访谈归纳的祭坛与庙宇传说
records:
- id: case_cn_shanghai_pacific_baby_song
  title: 上海徐家汇｜商场里反复响起的歌
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_shanghai_city_lore_liu_2015
  location:
    lat: 31.1967669
    lng: 121.4340122
    precision: city
    location_name: 中国上海 · 徐家汇太平洋百货旧址
    culture_region: 中国 · 华东
  location_note: 坐标为 OpenStreetMap 所标的太平洋百货徐汇店旧址参考点；商场于 2023 年结束营业。
  paragraphs:
  - 九十年代，上海徐家汇太平洋百货总会响起同一首《宝贝对不起》。顾客逛上几个小时，往往能听见好几遍。慢慢地，大家开始猜测：为什么商场要一直放这首歌？
  - 一种网络传说说，商场的地面下曾是育婴堂，夜里保安会听见孩子哭声，却找不到人；后来有人建议用这首歌安抚他们。不同版本把故事讲得越来越长。
  - 旧报纸确曾批评商场反复播放这首歌。2020 年受访的商场人员解释，整点音乐用于提醒各楼层汇总营业额；2023 年地方史采访也指出，传说中的育婴堂与百货店旧址不是同一地点。
  sources:
  - *id001
  - citation: 上海市民生活指南：〈《宝贝，对不起》的真相，我们今天解开了〉，澎湃号，2020 年 7 月 9 日。
    type: newspaper_report
    url: https://www.thepaper.cn/newsDetail_forward_8190351
    locator: 文汇报 1996 年报道及商场工作人员对整点播放用途的解释
  - citation: 严晓峰：〈太平洋百货徐汇店 8 月底终止运营：陪伴上海人 30 年，这次真的要告别了〉，《新闻晨报》，2023 年 8 月 1 日。
    type: newspaper_report
    url: https://ep.shxwcb.com/2023/08/01/img/080801.pdf
    locator: 第 8 版：徐汇非遗工作者关于育婴堂与商场旧址的考证
  - citation: OpenStreetMap contributors：太平洋百货徐汇店，地图数据 ODbL 1.0。
    type: map_reference
    url: https://www.openstreetmap.org/node/6298348685
    locator: 公开地图对象；坐标用于地点参考
- id: case_cn_shanghai_westgate_stairwell
  title: 上海南京西路｜走不出去的楼梯间
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_shanghai_city_lore_liu_2015
  location:
    lat: 31.2308605
    lng: 121.4522614
    precision: city
    location_name: 中国上海 · 梅龙镇广场
    culture_region: 中国 · 华东
  location_note: 使用梅龙镇广场公开地图轮廓的参考坐标，不标示传闻中的具体楼梯。
  paragraphs:
  - 一位讲述者去南京西路的梅龙镇广场见客户，不想等电梯，便走进楼梯间。走了许久，他仍找不到出口，回想起来觉得自己像是在同一段楼梯里绕圈。
  - 他也猜测可能只是迷了路。2015 年一篇关于“志怪”的博士论文收录并翻译了这则网络传闻；文章记录的正是一个人如何给普通建筑里的迷路经历增添神秘意味。
  sources:
  - *id001
  - citation: OpenStreetMap contributors：梅龙镇广场，地图数据 ODbL 1.0。
    type: map_reference
    url: https://www.openstreetmap.org/way/255632383
    locator: 公开地图对象；坐标用于地点参考
- id: case_cn_shanghai_plaza66_incense_shape
  title: 上海南京西路｜被说成香炉的大楼
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_shanghai_city_lore_liu_2015
  location:
    lat: 31.2298098
    lng: 121.4488454
    precision: city
    location_name: 中国上海 · 恒隆广场
    culture_region: 中国 · 华东
  location_note: 点位取恒隆广场公开地图对象中心；传说中的施工过程并未由该点位证实。
  paragraphs:
  - 南京西路的恒隆广场外形醒目，附近流传过一种讲法：大楼在传闻中被想象成一座香炉，而这样的造型是为了回应建造时碰到的怪事。
  - 2015 年研究收录的网络版本把施工受阻与建筑形状连在一起；2012 年民俗学会议提要也把恒隆广场列入上海都市传说。它们记录的是人们如何解释一座大楼，并不是施工事故的证明。
  sources:
  - *id001
  - *id002
  - citation: OpenStreetMap contributors：恒隆广场，地图数据 ODbL 1.0。
    type: map_reference
    url: https://www.openstreetmap.org/way/10692949
    locator: 公开地图对象；坐标用于地点参考
- id: case_cn_shanghai_longhua_yinyang_river
  title: 上海龙华｜河边的阴阳传闻
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_shanghai_city_lore_liu_2015
  location:
    lat: 31.1767917
    lng: 121.4472502
    precision: city
    location_name: 中国上海 · 龙华寺参考点
    culture_region: 中国 · 华东
  location_note: 文献把传闻与龙华寺及附近河道相连；坐标取寺院公开地图中心，不代表河道具体位置。
  paragraphs:
  - 上海龙华一带有一则关于“阴阳河”的讲法：人们把机场附近的一条河与不安的夜间气氛联系起来，并想象寺院有守护附近的作用。
  - 2015 年论文将它作为网上流传的地点故事收录。寺院、河道和城市建设各有自己的历史；传说里的解释属于讲述者的想象。
  sources:
  - *id001
  - citation: OpenStreetMap contributors：龙华寺，地图数据 ODbL 1.0。
    type: map_reference
    url: https://www.openstreetmap.org/way/404694432
    locator: 公开地图对象；坐标用于地点参考
- id: case_cn_shanghai_dongfang_road_name
  title: 上海浦东｜被重新解释的路名
  genre: urban_legend
  credibility_tier: A
  theme: corpus_cn_shanghai_city_lore_liu_2015
  location:
    lat: 31.2301468
    lng: 121.5215483
    precision: city
    location_name: 中国上海 · 东方路潍坊路附近
    culture_region: 中国 · 华东
  location_note: 坐标取东方路潍坊路公交站公开地图点，作为路口附近参考，不定位任何事故。
  paragraphs:
  - 有一则浦东传闻把东方路一带的旧路名与上海话里关于墓地的词联系起来，又把十字路口的交通事故放进同一个故事。不同转述者由此讲出一条名字令人不安的道路。
  - Mingming Liu 于 2015 年把这一说法作为网络传闻译录。谐音、地点的旧貌和故事里的事故次数，都属于所收录的讲法，不能直接当作道路历史或事故统计。
