  paragraphs:
  - 醉月湖湖心有一座孤亭，学生间流传一位女子深夜在湖边问人时间。故事把她的徘徊与一段失约的感情联系起来，还衍生出亭子为什么看似断桥的不同说法。
  - 2024 年的校湖研究追溯这些版本，并引用校史资料指出：湖心亭的断桥式设计原本就存在。风景的形状与后来流传的故事，叠成了两种不同的记忆。
