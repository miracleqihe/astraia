- id: case_cn_guangzhou_yongfang_steps
  title: 广州校园｜白天与夜晚的台阶
  genre: memorate
  credibility_tier: A
  theme: text_cn_ma_xingyu_campus_horror_2016
  location:
    lat: 23.0991051
    lng: 113.2912292
    precision: city
    location_name: 中国广州 · 中山大学永芳堂
    culture_region: 中国 · 华南
  location_note: 点位为永芳堂公开地图轮廓中心；故事流传和学生核数的具体时间未说明。
  paragraphs:
  - 广州一位学生记得，刚入学时就听学长谈起永芳堂。它的建筑形状、广场雕像，以及白天和夜里数不出同样阶数的楼梯，都成了校园故事的材料。
  - 她的同学后来真的去数过，结果两次一样。2013 年《中国科学报》采访了这段校园回忆：学生既讲述传说，也会亲自验证其中可核对的部分。
  sources:
  - &id003
    citation: 韩琨：〈校园里的“奇葩”景观〉，《中国科学报》，2013 年 10 月 10 日，第 8 版。
    type: newspaper_report
    url: https://news.sciencenet.cn/sbhtmlnews/2013/10/278588.shtm?id=278588
    locator: 受访学生对广州永芳堂台阶与北京校园雕塑的回忆
  - citation: OpenStreetMap contributors：中山大学永芳堂，地图数据 ODbL 1.0。
    type: map_reference
    url: https://www.openstreetmap.org/way/301319558
    locator: 公开地图对象；坐标用于地点参考
  reading_kind: report
- id: case_cn_beijing_tsinghua_porcelain_finger
  title: 北京清华园｜夜路上的青花指甲
  genre: memorate
  credibility_tier: A
  theme: text_cn_ma_xingyu_campus_horror_2016
  location:
    lat: 40.0009
    lng: 116.327
    precision: city
    location_name: 中国北京 · 清华大学校园参考点
    culture_region: 中国 · 华北
  location_note: 报道只提供雕塑在校园主楼后方西侧的相对位置；点位为校园区域参考。
  paragraphs:
  - 一位在清华园读书的学生常骑车经过一件雕塑：它像一截手指，长指甲上画着青花山水。白天看只是奇特，晚上从旁边经过，她却觉得有点吓人。
  - 作品本名为《美甲系列——青花山水》，与百年校庆期间的雕塑展有关。2013 年的采访里，她还谈到校园里其他看起来古怪的作品；这些感受属于日常空间里的个人经验。
  sources:
  - *id003
  reading_kind: report
- id: case_cn_kunming_camera_lens_cap_2006
  title: 昆明旧楼｜漆黑录像的原因
  genre: memorate
  credibility_tier: B
  theme: corpus_cn_yunnan_field_reports_2001_2007
  location:
    lat: 25.0389
    lng: 102.7183
    precision: city
    location_name: 中国云南昆明 · 城市参考点
    culture_region: 中国 · 西南
  location_note: 报道所述旧楼在昆明西山区，未核对其现状；地图只使用昆明城市参考点。
  paragraphs:
  - 几位昆明青年听过一栋旧楼的种种传闻，2006 年冬夜决定亲自去看。有人回忆，进楼时正赶上雷电，房间里积着灰和旧桌椅，几个人始终提着心。
  - 他们回放录像，画面却漆黑一片，一时更加紧张。检查之后才发现，镜头盖一直没有打开。《春城晚报》2007 年采访了这段经历；故事的结尾也留下了他们自己笑场的片刻。
